，其余都是它们的推论","x":"定量对比：把损耗降到 1/4，加粗导线要使截面积变 4 倍，升压只需 2 倍，成本差一个量级"}]}],"电路及其应用":[{"t":"电路动态分析","f":"滑动变阻器阻值变化，判断电表读数、灯泡亮度、某元件功率如何变化","k":"从变化点出发走一条链：局部 R 变 → 总 R 变 → 总 I 变 → 路端电压变 → 再回到各支路","q":[{"q":"电源电动势 12 V、内阻 1 Ω，外接 3 Ω 的定值电阻与滑动变阻器串联。滑动变阻器由 2 Ω 调到 8 Ω，求路端电压的变化。","s":["总电阻由 3+2+1 = 6 Ω 变为 3+8+1 = 12 Ω","总电流由 12/6 = 2 A 变为 12/12 = 1 A","路端电压 U = E − Ir，由 12−2 = 10 V 变为 12−1 = 11 V","结论：外电阻增大，路端电压升高、总电流减小"],"a":"路端电压由 10 V 增大到 11 V","c":"定性判断用「局部 → 整体 → 局部」的推理链，不要跳步；定量时再代数值","x":"直接用 U = E − Ir：I 减小则 U 增大，一句话定性；需要具体数值时再算一次"}],"v":["判断电表读数的变化","判断灯泡亮度的变化","判断某元件功率的变化","用「串反并同」的规律","滑动变阻器阻值变化的连锁反应"]},{"t":"电功与电热的区分","f":"纯电阻电路与非纯电阻电路（电动机、电解槽）中的功率、发热与效率计算","k":"纯电阻电路 P = UI = I²R = U²/R 三者等价；非纯电阻只能用 P = UI 求总功率，发热必须用 I²R","q":[{"q":"电动机接在 220 V 电源上，通过线圈的电流 5 A，线圈电阻 4 Ω。求总功率、热功率、机械功率与效率。","s":["总功率 P总 = UI = 220×5 = 1100 W","热功率 P热 = I²R = 25×4 = 100 W","机械功率 P机 = P总 − P热 = 1000 W","效率 η = 1000/1100 ≈ 90.9%"],"a":"1100 W、100 W、1000 W，效率约 90.9%","c":"非纯电阻电路中欧姆定律不成立（U ≠ IR），必须用能量守恒把功率拆成「发热 + 有用」两部分","x":"反算校验：若按纯电阻算 R = U/I = 44 Ω，与实际 4 Ω 相差十倍，立刻说明这是非纯电阻电路"}],"v":["纯电阻电路的功率","电动机的发热与输出功率","电解槽的效率","非纯电阻不能用 U²/R","电功大于电热"]},{"t":"含电容器的直流电路","f":"求电容器两端电压与所带电荷量，或开关变化后通过某支路的电荷量","k":"稳态时电容器所在支路无电流、相当于断路；电容器两端电压等于与它并联部分的电压","q":[{"q":"电源电动势 12 V、内阻 1 Ω，外接 R₁ = 5 Ω 与 R₂ = 6 Ω 串联，电容器（C = 2 μF）与 R₂ 并联。求电容器两端电压与所带电荷量。","s":["稳态时电容器支路无电流，电路就是 R₁ 与 R₂ 串联","I = E/(R₁ + R₂ + r) = 12/(5 + 6 + 1) = 1 A","电容器电压等于 R₂ 两端电压：U = IR₂ = 6 V","Q = CU = 2×10⁻⁶ × 6 = 1.2×10⁻⁵ C"],"a":"电压 6 V，电荷量 1.2×10⁻⁵ C","c":"含容电路两步走：先把电容器当断路画出等效电路算电流，再把电容器接回去读它并联部分的电压","x":"记住「电容器电压 = 并联部分电压」，不必管它自己那条支路"}],"v":["求电容器两端的电压","求电容器所带的电荷量","开关变化后通过的电荷量","稳态时电容器相当于断路","与电容器串联的电阻无电流"]}],"电阻定律":[{"t":"电阻定律的定量计算","f":"已知材料、长度、截面积求电阻，或导线被拉长、对折后求新电阻","k":"R = ρL/S；形变时体积不变，L 变 n 倍则 S 变 1/n，电阻变 n² 倍","v":["求导线的电阻","导线拉长后电阻如何变","对折后电阻如何变","由电阻率判断材料"],"q":[{"q":"一根导线电阻为 R，均匀拉长到原来的 2 倍长度，电阻变为多少？对折后电阻变为多少？","s":["拉长过程体积不变：L 变 2 倍则 S 变 1/2","R′ = ρ(2L)/(S/2) = 4ρL/S = 4R","对折后：L 变 1/2，S 变 2 倍","R″ = ρ(L/2)/(2S) = R/4"],"a":"拉长 2 倍后为 4R；对折后为 R/4","c":"形变类问题的关键是「体积不变」，L 与 S 一个变大另一个必然变小，两者方向相反","x":"记规律：拉长 n 倍电阻变 n² 倍；对折一次电阻变 1/4，对折两次变 1/16"}]},{"t":"电阻率与温度的关系","f":"判断电阻率随温度的变化，解释灯泡伏安特性曲线为什么弯曲","k":"金属的电阻率随温度升高而增大，半导体相反；灯泡电阻随温度升高而变大","v":["电阻率与温度的关系","灯泡的 U-I 图为什么弯曲","半导体电阻随温度如何变","电阻率由什么决定"],"q":[{"q":"小灯泡的 U-I 图线随电压增大而向下弯曲（斜率逐渐减小），解释原因。","s":["U-I 图线的斜率 ΔI/ΔU 等于 1/R","电压升高时灯丝温度升高，金属电阻率随温度升高而增大","故 R 变大，斜率变小，图线向电流轴弯曲","这说明灯丝不是线性电阻，欧姆定律的 I ∝ U 只对线性元件成立"],"a":"灯丝温度升高使电阻率增大、电阻变大，所以图线弯曲","c":"金属的 ρ 随温度升高而增大，半导体的 ρ 随温度升高而减小，方向正好相反","x":"从「斜率 = 1/R」入手：斜率变小就是 R 变大，再看 R 变大的原因是温度，逻辑链完整"}]}],"盖-吕萨克定律":[{"t":"等压变化的计算","f":"求等压过程中的体积或温度，常见于活塞可自由移动的气缸","k":"V₁/T₁ = V₂/T₂；「活塞自由移动」「开口容器」都是等压过程的标志","q":[{"q":"气缸内气体在 27 ℃ 时体积为 2 L，活塞可自由移动。加热到 127 ℃，体积变为多少？","s":["活塞自由移动意味着压强始终等于外界压强，是等压过程","T₁ = 300 K，T₂ = 400 K","V₂ = V₁T₂/T₁ = 2 × 400/300","V₂ ≈ 2.67 L"],"a":"约 2.67 L","c":"先判断过程类型：活塞能动就是等压，容器密闭且体积固定就是等容，这一步决定用哪条定律","x":"用比例：400/300 = 4/3，体积同比例放大到 8/3 L，一步出结果"}],"v":["求等压过程的体积","求等压过程的温度","活塞可自由移动的气缸","V 与 T 成正比","V₁/T₁ = V₂/T₂ 的应用"]},{"t":"等压过程中的功","f":"求气体对外做的功，或由 p-V 图求功","k":"W = pΔV 只适用于等压过程；一般过程的功等于 p-V 图线下的面积","q":[{"q":"气体在 1.0×10⁵ Pa 下等压膨胀，体积由 2 L 增大到 5 L。求气体对外做的功。","s":["等压过程：W = pΔV","ΔV = 3 L = 3×10⁻³ m³","W = 1.0×10⁵ × 3×10⁻³","W = 300 J"],"a":"300 J","c":"只有等压过程才有 W = pΔV；其他过程必须用 p-V 图面积或由第一定律反求","x":"单位换算是本类题最大的坑：1 L = 10⁻³ m³，先把体积换成 m³ 再乘压强"}],"v":["求气体对外做的功","由 p-V 图求功","用 W = pΔV 计算","膨胀做正功还是负功","压缩时外界对气体做功"]},{"t":"V-T 图像与绝对零度的外推","f":"由 V-T 图求斜率的意义，或把 V-t 图外推求绝对零度","k":"等压时 V/T = C，V-T 图是过原点的直线；V-t 图不过原点，与 t 轴交于 −273 ℃","q":[{"q":"某气体等压变化，V-t（摄氏温度）图是一条直线，与 t 轴交于 −273 ℃。说明该交点的物理意义。","s":["等压时 V 与热力学温度成正比：V = C·T","把 T = t + 273 代入，得 V = C(t + 273)","当 t = −273 ℃ 时 T = 0 K，V = 0","故交点即绝对零度，是理想气体体积外推的零点"],"a":"交点对应绝对零度（0 K，−273 ℃），是体积的外推零点","c":"V-T 图过原点、V-t 图交 −273 ℃；两图形状相似但坐标原点含义不同","x":"记住「V-T 过原点、V-t 交 −273」，图像类选项基本都能直接判"}],"v":["由 V-T 图求斜率","把 V-t 图外推求绝对零度","图线为什么过原点","与等容线、等温线的比较","斜率与压强的反比关系"]}],"相互作用":[{"t":"受力分析的基本程序","f":"给出斜面、绳、挡板、叠放等情境，要求画受力图，或判断某个力是否存在、方向如何","k":"顺序固定：重力 → 接触力（弹力、摩擦力）→ 其他场力。每个力都必须找到施力物体，找不到施力物体的力一定不存在","q":[{"q":"质量 m 的物体静止在粗糙斜面上（倾角 θ）。分析它受哪几个力，并求出各力大小。","s":["重力 mg，竖直向下","斜面支持力 N，垂直于斜面向上","物体有沿斜面下滑的趋势，故受静摩擦力 f，沿斜面向上","沿斜面、垂直斜面分解：f = mg sinθ，N = mg cosθ"],"a":"重力 mg、支持力 mg cosθ、静摩擦力 mg sinθ（沿斜面向上）","c":"先重力再接触力，每个接触处都问一句「有没有挤压、有没有相对运动趋势」，力的个数就不会漏也不会多","x":"用假设法反推：假设斜面光滑，物体必下滑，与「静止」矛盾，所以摩擦力一定存在且方向沿斜面向上"}],"v":["判断某个力是否存在","画出完整的受力图","确定各力的方向","选择整体还是隔离作为研究对象","按重力、弹力、摩擦力的顺序找力"]},{"t":"三力平衡的图解与相似三角形","f":"一个力大小方向不变（通常是重力），另两个力方向随几何关系缓慢变化，判断各力如何变化","k":"三个力平衡必构成闭合矢量三角形。优先寻找与「几何三角形」的相似关系，把力的变化翻译成边长的变化，比列三角函数式更稳","q":[{"q":"光滑小球用细绳悬挂在竖直墙上，绳缓慢变长的过程中，绳的张力 T 与墙对球的支持力 N 如何变化？","s":["球受重力 G、绳张力 T（沿绳）、墙的支持力 N（水平向外）","三力平衡，力三角形与几何三角形（悬点、球心、球心在墙上的投影）相似","对应边成比例：T/G = L/h，N/G = R/h，其中 L 为绳长、R 为球半径、h = √(L²−R²)","绳变长时 h 增大，故 T = GL/h 与 N = GR/h 都减小"],"a":"T 减小，N 减小","c":"相似三角形法的关键是找对几何三角形：力三角形的三边分别平行于几何三角形的三边，比例式一写就出结果","x":"极限法验证：绳无限长时球贴墙、绳趋于竖直，此时 T → G、N → 0，两者确实都在减小，无需计算即可判断趋势"}],"v":["一个力恒定、另一个力方向不变","动态平衡中判断各力如何变化","用相似三角形求力的大小","求使物体平衡的最小力","用矢量三角形封闭判断"]},{"t":"多力平衡与正交分解","f":"物体受四个或更多力作用而处于平衡，求某个力的大小或动摩擦因数","k":"建立直角坐标系（尽量让未知力落在坐标轴上），列 ΣFx = 0 与 ΣFy = 0 两个方程","q":[{"q":"质量 2 kg 的物块在水平地面上，受与水平方向成 37° 斜向上的拉力 F = 10 N 而匀速前进。求支持力与动摩擦因数（g = 10，sin37° = 0.6，cos37° = 0.8）。","s":["竖直方向平衡：N + F sin37° = mg","N = 20 − 10×0.6 = 14 N","水平方向平衡：f = F cos37° = 10×0.8 = 8 N","由 f = μN 得 μ = 8/14 ≈ 0.57"],"a":"支持力 14 N，动摩擦因数约 0.57","c":"斜向力必须先分解再列平衡方程；「N = mg」只在竖直方向没有其他力时才成立","x":"顺序固定：竖直方向定 N → 水平方向定 f → μ = f/N，三步走不会乱"}],"v":["求某个力的大小","求动摩擦因数","如何建立坐标系更省事","分解后列两个方向的平衡方程","四个力以上的平衡问题"]}],"相对论":[{"t":"同时的相对性与时间膨胀","f":"判断同一事件在不同参考系中是否同时，或比较两参考系测得的时间间隔","k":"同时性是相对的；运动参考系中的时钟变慢（钟慢效应），固有时间最短","v":["同时性为什么是相对的","哪个参考系的钟走得慢","时间膨胀如何判断","高速飞行员的寿命效应"],"q":[{"q":"一列以 0.6c 相对地面飞行的列车，车厢正中央发出一闪光。车上人看到光是否同时到达两端？地面上的人呢？","s":["车上参考系：光速各向同性、两端距离相同，故光同时到达两端","地面参考系：光速仍是 c，但车厢后端迎着光运动、前端远离光运动","故地面上看到光先到后端、后到前端，两者不同时","结论：同时性是相对的，说「同时」必须指明参考系"],"a":"车上同时；地面上不同时，先到后端","c":"「同时」不是绝对的，判断时必须固定在某个参考系里说","x":"用追及直觉：后端向光迎上去，路程短；前端被光追，路程长，故不可能同时"}]},{"t":"相对论速度合成","f":"两个接近光速的速度叠加，求合速度，或判断是否会超过光速","k":"u = (u′ + v)/(1 + u′v/c²)，结果永远小于 c","v":["两个 0.6c 如何合成","合成速度会超过光速吗","光速为什么是上限","低速时公式如何退化"],"q":[{"q":"飞船以 0.6c 相对地球飞行，船上向前发射一枚相对飞船速度为 0.6c 的探测器。地面测得探测器速度是多少？","s":["经典力学会给出 1.2c，但超过光速，不可能","用相对论速度合成：u = (u′ + v)/(1 + u′v/c²)","u = (0.6c + 0.6c)/(1 + 0.36) = 1.2c/1.36","u ≈ 0.88c，仍小于 c"],"a":"约 0.88c","c":"相对论速度合成永远得不出超过 c 的结果，这是公式本身保证的","x":"用极限检验：取 u′ = v = c，得 u = 2c/2 = c，说明光速是速度上限"}]},{"t":"经典力学与相对论的适用范围","f":"判断某情境该用经典力学还是相对论，或说明两者的关系","k":"v 接近 c 或引力极强时用相对论，v ≪ c 时牛顿力学足够精确","v":["什么时候必须用相对论","牛顿力学何时失效","两者是什么关系","相对论效应如何判断显著"],"q":[{"q":"什么情况下必须用相对论、什么情况下牛顿力学已经足够？","s":["相对论效应在速度接近光速时才显著，v ≪ c 时退化为经典力学","判据看 v/c：小于 0.1 时误差小于 1%，牛顿力学足够","强引力场（如黑洞附近）需要广义相对论","日常与工程中的速度远小于 c，牛顿力学完全够用"],"a":"v 接近 c 或引力极强时用相对论，否则牛顿力学足够","c":"相对论不是「推翻」牛顿力学，而是把它包含为低速极限","x":"用「对应原理」理解：任何新理论都必须在旧理论的适用范围内回到旧理论"}]}],"相对论初步":[{"t":"光速不变原理","f":"判断关于光速、参考系、相对性原理的说法是否正确","k":"两个基本假设：物理规律在所有惯性系中形式相同；真空光速与光源、观察者的运动无关","q":[{"q":"以 0.5c 飞行的飞船向前发射一束激光，地面观察者测得的光速是多少？","s":["由光速不变原理，真空光速与光源的运动无关","也不与观察者的运动有关","故测得的光速仍为 c","不能按经典速度合成写成 1.5c"],"a":"仍为 c","c":"光速不变是最反直觉也最常考的一条：任何惯性系中测得的光速都等于 c","x":"一句话：速度可以相加，光速不能相加——这是相对论与经典力学的分界线"}],"v":["判断关于光速的说法","光速与参考系无关","相对性原理的内容","经典时空观遇到的困难","迈克尔逊—莫雷实验"]},{"t":"时间膨胀与长度收缩","f":"判断运动时钟变慢、长度收缩的效应，或比较不同参考系的测量结果","k":"Δt = Δt₀/√(1−v²/c²)，运动时钟变慢；沿运动方向的长度收缩，垂直方向不变","q":[{"q":"飞船以 0.6c 飞行，船上的钟走过 1 s。地面上的观察者测得经过了多少时间？","s":["√(1 − 0.6²) = √0.64 = 0.8","Δt = Δt₀/0.8","= 1/0.8 = 1.25 s","地面观察者认为飞船上的钟变慢了"],"a":"1.25 s","c":"公式里的 Δt₀ 是与事件相对静止的钟测得的时间（固有时），代入前先想清楚「谁在动」","x":"记住常用值：v = 0.6c 时因子 0.8，v = 0.8c 时因子 0.6，考试基本只用这两组"}],"v":["判断运动的钟是否变慢","判断运动的尺是否变短","比较不同参考系的测量结果","γ 因子的计算","只沿运动方向收缩"]},{"t":"相对论质量与质能关系","f":"判断相对论质量随速度的变化，或把质能方程与质量亏损联系起来","k":"m = m₀/√(1 − v²/c²)，速度越大质量越大；E = mc² 说明质量与能量是同一事物的两种量度","q":[{"q":"为什么说质能方程把「质量亏损」与「释放能量」统一起来了？","s":["E = mc² 表明任何质量都对应一份能量，比例系数为 c²","核反应后总质量减小 Δm，对应能量减少 Δm·c²","这部分能量并未消失，而是以生成粒子的动能和光子形式放出","故「质量亏损」与「释放核能」是同一件事的两种说法"],"a":"因为质量与能量成正比，质量减少 Δm 就等于放出 Δm·c² 的能量","c":"质能方程不是「质量变成能量」，而是「质量就是能量的一种量度」","x":"答「质量哪去了」，标准说法是：质量没有消失，随能量一起转移到生成物的动能与辐射中"}],"v":["判断质量随速度如何变化","把质能方程与质量亏损联系起来","E = mc² 的含义","速度趋近光速时质量如何变","质量与能量是同一事物的两种量度"]}],"碰撞问题":[{"t":"弹性碰撞的结论与速算","f":"求弹性正碰后两物体的速度，或判断某组速度是否可能","k":"动量守恒与动能守恒联立得 v₁′ = (m₁−m₂)v₁/(m₁+m₂)，v₂′ = 2m₁v₁/(m₁+m₂)，记熟可省去大量运算","q":[{"q":"质量 2 kg 的 A 以 6 m/s 与静止的 4 kg 的 B 发生弹性正碰。求碰后两者的速度。","s":["v₁′ = (m₁−m₂)v₁/(m₁+m₂) = (2−4)×6/6 = −2 m/s","v₂′ = 2m₁v₁/(m₁+m₂) = 2×2×6/6 = 4 m/s","A 反向运动（反弹），B 沿原方向运动","校验动能：碰前 36 J，碰后 ½×2×4 + ½×4×16 = 4 + 32 = 36 J ✓"],"a":"A 以 2 m/s 反弹，B 以 4 m/s 沿原方向运动","c":"两条结论式比每次联立动量与动能方程快得多，也更不容易算错","x":"用「等质量交换速度」特例对照：m₁ = m₂ 时碰后交换速度；本题 m₁ < m₂ 故 A 反弹，定性判断也能先排除一半选项"}],"v":["求弹性正碰后的速度","判断某组速度是否可能","质量相等时交换速度","一动碰一静的速算公式","碰后速度的相对关系"]},{"t":"碰撞可能性的三条件判断","f":"给出碰前碰后的速度或动量组合，判断哪些是可能的","k":"三条约束：动量守恒、动能不增加、碰后不能「穿越」（同向运动时后者速度不小于前者）","q":[{"q":"质量 1 kg 的 A 以 6 m/s 撞击静止的质量 2 kg 的 B。判断下列碰后组合（v_A′, v_B′）哪些可能：(4,1)、(2,2)、(−6,6)、(3,1.5)。","s":["动量守恒要求 v_A′ + 2v_B′ = 6，四个组合都满足","(4,1)：动能 8+1 = 9 J < 18 J，但 A 在后速度 4 > B 的 1，会穿越，不可能","(−6,6)：动能 18+36 = 54 J > 18 J，动能增加，不可能","(3,1.5)：动能 4.5+2.25 = 6.75 J，但 A 速度 3 > B 的 1.5，会穿越，不可能","(2,2)：动量 6 ✓、动能 6 J ✓、速度相等不穿越 ✓，可能（正是完全非弹性碰撞）"],"a":"只有 (2,2) 可能","c":"三条约束逐条筛：动量守恒 → 动能不增 → 不穿越。前两条是方程，第三条最容易被忽略","x":"先算完全非弹性碰撞的共速 v = m₁v₁/(m₁+m₂) = 2 m/s，它就是动能损失最大的极限，任何组合的动能都必须大于它对应的值"}],"v":["动量是否守恒","动能是否不增加","速度是否符合实际情景","判断哪组数据不可能","碰后同向时后者速度不能更大"]},{"t":"完全非弹性碰撞与能量损失","f":"求碰后共速、损失的动能、损失占碰前动能的比例","k":"完全非弹性碰撞共速 v = m₁v₁/(m₁+m₂)，损失动能最多；被撞物静止时损失比例为 m₂/(m₁+m₂)","q":[{"q":"质量 2 kg 的物块以 6 m/s 撞上静止的质量 4 kg 的物块并粘在一起。求共速速度与损失的动能。","s":["动量守恒：2×6 = (2+4)v，得 v = 2 m/s","碰前动能 ½×2×6² = 36 J","碰后动能 ½×6×2² = 12 J","损失 36 − 12 = 24 J，占碰前动能的 2/3"],"a":"共速 2 m/s，损失 24 J（占碰前动能的 2/3）","c":"完全非弹性碰撞的损失比例可以直接算：m₂/(m₁+m₂) = 4/6 = 2/3，不必逐个算动能","x":"记两个比例：损失 m₂/(m₁+m₂)，剩余 m₁/(m₁+m₂)，两者相加为 1"}],"v":["求碰后的共同速度","求损失的动能","求损失占碰前动能的比例","求碰后系统的总动能","子弹打入木块后的共同速度"]}],"磁场":[{"t":"安培定则与磁场的叠加","f":"判断通电直导线、环形电流、螺线管的磁场方向，或两个电流在某点磁场的叠加","k":"直导线用右手「握」：拇指指电流、四指指磁场；环形电流与螺线管用右手「绕」：四指指电流、拇指指内部磁场","q":[{"q":"两根平行长直导线通以同向电流，判断它们之间的相互作用是吸引还是排斥。","s":["左侧导线在其右侧（两线之间）产生的磁场垂直纸面向里","右侧导线处于该磁场中，电流方向与左侧相同","由左手定则，右侧导线受力指向左侧导线","同理左侧导线也受力指向右侧，两导线相互吸引"],"a":"同向电流相互吸引","c":"结论要记牢：同向电流相吸、反向电流相斥。这与「同种电荷相斥」正好相反，是高频陷阱","x":"推导只需两步：先求一根导线在另一根处的磁场，再用左手定则。记不住结论时现推即可"}],"v":["判断直导线周围的磁场方向","环形电流的磁场方向","螺线管的 N 极在哪端","两个电流在某点磁场的叠加","用右手螺旋定则判断"]},{"t":"地磁场与磁偏角","f":"判断小磁针指向、地磁场方向，或解释磁偏角、极光等现象","k":"地球地理北极附近是地磁南极，小磁针 N 极指向地理北方（即指向地磁南极）","q":[{"q":"在地球赤道上方的某点水平放置一枚小磁针，静止时 N 极指向哪里？","s":["地磁场在赤道上空的方向大致由南指向北","小磁针 N 极受力方向即磁场方向","故 N 极指向地理北方","严格地说，它指向地磁南极，而地磁南极在地理北极附近"],"a":"指向地理北方（地磁南极附近）","c":"一切地磁题的前提都是「地磁南北极与地理南北极相反」，先把这个前提摆正","x":"记一句话「地理北极出地磁南极」，所有指向判断都不会错"}],"v":["判断小磁针的指向","地磁场的方向与磁偏角","极光为什么出现在两极","地理南北极与地磁南北极的差别","地磁场对宇宙射线的屏蔽"]},{"t":"通电线圈在磁场中的转动","f":"判断线圈受力与转动方向，或解释电流表、电动机的工作原理","k":"线圈两边受安培力形成力偶使线圈转动；线圈平面与磁场平行时磁力矩最大，垂直时为零","q":[{"q":"矩形线圈放在匀强磁场中，通以电流后开始转动。判断线圈转到什么位置时磁力矩为零。","s":["线圈平面与磁场平行时，两边受力方向相反且都垂直于磁场，力臂最大，磁力矩最大","线圈平面与磁场垂直时，两边受力沿平面方向、作用线共线","此时力臂为零，磁力矩为零","注意此时穿过线圈的磁通量恰好最大"],"a":"线圈平面与磁场垂直（磁通量最大）时磁力矩为零","c":"磁力矩最大对应「线圈平面与磁场平行」，为零对应「线圈平面与磁场垂直」——与磁通量的极值正好相反，别记混","x":"记「平行力矩大、垂直力矩零」，与「平行磁通量为零、垂直磁通量最大」对照记忆"}],"v":["判断线圈的转动方向","磁力矩何时最大、何时为零","电流表的工作原理","电动机的换向器作用","线圈平面与磁场平行时的受力"]}],"磁感应强度":[{"t":"磁感应强度的定义与理解","f":"判断关于 B 的说法是否正确，或由安培力求 B，或讨论 B 与 F、I、L 的关系","k":"B = F/(IL) 是定义式：B 由磁场本身决定，与试探电流的 F、I、L 都无关；方向是小磁针 N 极受力方向","q":[{"q":"长 0.5 m 的导线垂直放入匀强磁场中，通 2 A 电流时受安培力 0.4 N。求磁感应强度；若电流加倍，B 是否改变？","s":["B = F/(IL) = 0.4/(2×0.5) = 0.4 T","B 由磁场本身决定，与放入的电流无关","电流加倍只使安培力加倍（变为 0.8 N）","B 仍为 0.4 T"],"a":"B = 0.4 T；电流加倍时 B 不变","c":"定义式只用于「测量」B，绝不能说「B 与 F 成正比、与 IL 成反比」，这是最常见的概念错误","x":"与 E = F/q 类比：都是用受力去测场，场本身与试探物无关，两处逻辑完全一样"}],"v":["判断关于 B 的说法是否正确","由安培力反求 B","B 与 F、I、L 的关系","B 由磁场本身决定","B 的方向如何规定"]},{"t":"磁通量与有效面积","f":"求穿过某个面的磁通量，或判断线圈转动时磁通量的变化","k":"Φ = B·S⊥，S⊥ 是线圈面积在垂直 B 方向上的投影；线圈平面垂直 B 时最大，平行时为零","q":[{"q":"面积 0.02 m² 的线圈放在 0.5 T 的匀强磁场中。线圈平面与磁场垂直时磁通量多大？绕轴转过 60° 后多大？","s":["垂直时 Φ = BS = 0.5×0.02 = 0.01 Wb","转过 60° 后，线圈法线与 B 的夹角为 60°","Φ = BS cos60° = 0.01×0.5 = 0.005 Wb","若转到 90°，线圈平面与 B 平行，Φ = 0"],"a":"0.01 Wb；转过 60° 后为 0.005 Wb","c":"磁通量看的是「穿过」的有效面积，即 S 在垂直 B 方向上的投影，不是线圈面积本身","x":"记「垂直最大、平行归零」，中间按 cosθ 过渡，不必每次重新推投影关系"}],"v":["求穿过某个面的磁通量","线圈转动时磁通量如何变化","有效面积的取法","Φ = BS 中 S 的含义","磁通量为零时 B 是否为零"]},{"t":"B 与 E 的类比与区别","f":"判断关于磁感应强度与电场强度异同的说法，或比较两者的定义方式与方向规则","k":"都用比值定义（E = F/q、B = F/(IL)）；但 E 的方向就是正电荷受力方向，B 的方向与安培力方向垂直","q":[{"q":"判断「磁感应强度的方向就是通电导线在该处所受安培力的方向」是否正确，并说明理由。","s":["由左手定则，安培力方向与 B、I 都垂直","B 的方向由小磁针 N 极的指向定义，与受力方向无关","故该说法错误","对比电场：E 的方向确实就是正电荷受力方向，两者定义方式相似但方向规则不同"],"a":"错误；B 的方向由小磁针 N 极定义，与安培力方向垂直","c":"类比要小心：电场力与场同向，磁场力与场垂直，这是电磁学里最容易混淆的一处","x":"记「电场力顺着场、磁场力横着场」，一句话分开"}],"v":["比较两者的定义方式","比较两者方向的规定","电场力与磁场力的方向差别","判断某句类比说法是否正确","两者都由场本身决定"]}],"等效替代法":[{"t":"合力与分力的等效替换","f":"求合力、分力，或判断「效果相同」的替换是否成立、合力与分力能否同时计入","k":"合力与分力是等效替代关系：作用效果相同，但不能重复计入——加了合力就不能再加分力","q":[{"q":"两个大小均为 10 N 的力，夹角 120°。求它们的合力大小与方向。","s":["平行四边形定则：F = √(F₁² + F₂² + 2F₁F₂cos120°)","cos120° = −0.5，代入得 F = √(100 + 100 − 100)","F = √100 = 10 N","方向沿两力夹角的角平分线"],"a":"10 N，方向沿角平分线","c":"大小相等的两个力夹角 120° 时，合力与分力等大，这是最常用的特殊结论，直接记","x":"菱形法：两个 10 N 夹 120° 构成等边三角形的两边，对角线长 10 N，看图即得"}],"v":["求合力或分力","判断「效果相同」是否成立","合力与分力能否同时计入","等效替代的前提条件","等效不是相等"]},{"t":"等效重力与等效重力加速度","f":"求复合场中小球的平衡位置、摆动周期、圆周运动临界速度","k":"重力与电场力都是恒力时，合成一个「等效重力」G′，等效重力加速度 g′ = G′/m，之后完全按单一重力场处理","q":[{"q":"竖直向下的匀强电场中，带正电小球（质量 m、电荷量 q）用长 L 的细线悬挂，已知 qE = mg。求小球小角度摆动的周期。","s":["重力 mg 与电场力 qE 都竖直向下，可等效替代为一个等效重力","G′ = mg + qE = 2mg","等效重力加速度 g′ = G′/m = 2g","单摆周期 T = 2π√(L/g′) = 2π√(L/2g)"],"a":"T = 2π√(L/(2g))，约等于 π√(2L/g)","c":"恒力场叠加的通用做法：先合成等效重力定平衡位置，再把 g 换成 g′，其余公式一字不改","x":"记 g′ = g ± qE/m：同向相加、反向相减，直接代进单摆周期公式，不必重新推导"}],"v":["求复合场中的平衡位置","求等效摆长与周期","求圆周运动的临界速度","等效重力场的方向与大小","把电场力与重力合成"]},{"t":"等效电源与等效电阻","f":"把含源电路等效为一个电源，简化复杂电路的计算","k":"等效电动势等于该部分的开路电压，等效内阻等于其余电源置零后的等效电阻","q":[{"q":"电源 E、r 与电阻 R 串联，把 R 与电源一起看成一个等效电源，求其等效电动势与内阻。","s":["等效电动势 = 该部分的开路电压，即 a、b 两点断开时的 U_ab","R 与 r 串联且无电流时，U_ab = E","等效内阻 = 把 E 短路后 a、b 两点间的电阻 = r + R","故等效电源电动势为 E，等效内阻为 r + R"],"a":"等效电动势 E，等效内阻 r + R","c":"等效电源两步：开路电压定电动势、电源置零定内阻——顺序不能乱","x":"任何「把一部分电路打包」的题都按这两步走：先求开路电压，再把独立源置零求电阻"}],"v":["求等效电动势","求等效电源的内阻","用开路电压定电动势","把独立源置零定内阻","简化复杂含源电路"]}],"简谐运动":[{"t":"简谐运动的参量与图像","f":"由振动图像求振幅、周期、频率、某时刻的位移与速度方向，或求某段时间内的路程","k":"振幅看峰值、周期看两相邻同向过零点、速度方向看斜率；位移最大处速度为零、加速度最大，平衡位置处正好相反","q":[{"q":"某质点做简谐运动，位移—时间图像为从原点出发向上的正弦曲线，振幅 4 cm，周期 0.4 s。求 t = 0.1 s 时的位移与速度。","s":["ω = 2π/T = 5π rad/s，故 x = 4sin(5πt) cm","t = 0.1 s 时 5πt = 0.5π","x = 4sin(0.5π) = 4 cm，位于正向最大位移处","该处速度为 0，加速度大小最大、方向指向平衡位置"],"a":"位移 4 cm（正向最大），速度为零","c":"先由图像定初相位与 ω，再代入时刻；位置与速度的对应关系要背成条件反射","x":"记四句话：位移最大处速度为零、加速度最大；位移为零处速度最大、加速度为零。选择题几乎都能秒判"}],"v":["由图像读振幅与周期","由周期求频率","求某时刻的位移与速度方向","求一段时间内的路程","求某段时间内的位移"]},{"t":"单摆周期与等效摆长","f":"单摆周期计算、摆长变化、用单摆测重力加速度、不同天体上的周期比较","k":"T = 2π√(L/g)，与摆球质量、振幅（小角度）无关；等效摆长要算到摆球球心，不是悬点到球顶","q":[{"q":"摆长 1 m 的单摆在地球表面周期为 2 s（取 π² ≈ 10）。把它移到月球，月球表面重力加速度为地球的 1/6。求月球上的周期。","s":["T = 2π√(L/g)，周期与 √(1/g) 成正比","T月/T地 = √(g地/g月) = √6","T月 = 2×√6 ≈ 4.9 s","重力加速度变小，周期变长，符合「月球上摆得慢」的直觉"],"a":"约 4.9 s","c":"比较不同星球上的周期，用比例式 T ∝ 1/√g 最快，不必重新算一遍 2π√(L/g)","x":"记住 g = 10 m/s² 时 T ≈ 2√L（秒摆 L ≈ 1 m），本题直接得 2 s，月球上再乘 √6 即可"}],"v":["求单摆的周期","摆长变化后周期如何变","用单摆测重力加速度","不同天体上的周期比较","等效摆长的计算"]},{"t":"简谐运动的对称性与周期性","f":"求质点两次经过同一位置的时间关系、某段路程对应的最短时间，或一个周期内的路程","k":"关于平衡位置对称的两点速度大小相等；一个周期内路程恒为 4A，与起点无关","q":[{"q":"弹簧振子的周期为 0.4 s，振幅 5 cm。某时刻振子经过平衡位置，求它第一次到达最大位移处所需时间，以及 1 s 内经过的路程。","s":["从平衡位置到最大位移是四分之一周期：t = T/4 = 0.1 s","1 s = 2.5 个周期","一个周期内路程恒为 4A = 20 cm","2.5 个周期的路程 = 2.5×20 = 50 cm"],"a":"0.1 s；1 s 内路程 50 cm","c":"「一个周期走 4A」与起点无关，最可靠；但「半周期 2A、四分之一周期 A」只在从平衡位置或最大位移处起算时才成立","x":"直接用「周期数 × 4A」算路程；不要拿 A 去乘非整数倍的四分之一周期，那样容易错"}],"v":["两次经过同一位置的时间关系","某段路程对应的最短时间","一个周期内的路程为 4A","关于平衡位置对称的两点速度等大反向","求振动的总时间"]}],"自感互感":[{"t":"通电自感与断电自感","f":"判断开关闭合、断开瞬间各灯泡的亮度变化与电流方向","k":"自感电动势阻碍电流变化：通电时电流不能突变（逐渐增大），断电时电流不能突变（逐渐减小）","q":[{"q":"电感线圈与灯泡并联后接在电源上，断开开关瞬间，灯泡是立即熄灭还是闪亮一下再熄灭？","s":["断开前线圈中有稳定电流","断开瞬间线圈产生自感电动势，阻碍电流减小","线圈与灯泡构成新的闭合回路，电流经灯泡继续流动","若断开前线圈电流大于灯泡电流，灯泡会闪亮一下再熄灭；否则逐渐熄灭"],"a":"取决于断开前线圈电流与灯泡电流的大小关系：线圈电流更大则闪亮一下","c":"判断闪不闪只比一件事：断开前线圈的电流是否大于灯泡的电流","x":"一句话理解：断电自感时线圈相当于临时电源，电流方向与原来相同，沿回路继续流动"}],"v":["闭合开关瞬间灯泡的亮度变化","断开开关瞬间灯泡是否闪亮","判断电流方向","自感电动势阻碍电流变化","断电时灯泡为何先亮后灭"]},{"t":"自感系数与涡流","f":"判断自感系数的影响因素，或分析涡流的利弊与防止措施","k":"自感系数 L 由线圈自身结构（匝数、截面积、有无铁芯）决定，与电流、电压无关；涡流是整块导体中的感应电流","q":[{"q":"把铁芯插入线圈后自感系数如何变化？变压器铁芯为什么用硅钢片叠压而成而不是整块铁？","s":["插入铁芯后磁通量大大增加","自感系数 L 显著增大","整块铁芯中会产生很大的涡流，发热损耗能量","用硅钢片叠压并相互绝缘，可切断涡流路径，减小损耗"],"a":"L 显著增大；硅钢片叠压是为了减小涡流损耗","c":"L 只由线圈本身的结构决定，与电流、电压无关，这是概念题的高频陷阱","x":"类比记忆：电容 C 也只由结构决定（C = εS/4πkd），两个「只由本身决定」的元件可以一起记"}],"v":["判断自感系数的影响因素","分析涡流的利弊","涡流的防止措施","电磁炉与变压器铁芯","线圈匝数与自感系数的关系"]},{"t":"互感与变压器的基本原理","f":"判断互感现象，或由匝数比求电压、电流","k":"互感是一个线圈的电流变化在另一线圈中产生感应电动势；理想变压器电压比等于匝数比","q":[{"q":"理想变压器原线圈 1000 匝接 220 V 交流，副线圈 100 匝。求副线圈电压。","s":["理想变压器：U₁/U₂ = n₁/n₂","220/U₂ = 1000/100 = 10","U₂ = 22 V","接负载时功率相等：P₁ = P₂，故 I₁/I₂ = n₂/n₁"],"a":"22 V","c":"变压器只能改变交流电压，不能改变直流；电压比等于匝数比，电流比是匝数的反比","x":"记「匝数比 = 电压比 = 电流反比」，三个比例一次记牢"}],"v":["判断是否存在互感现象","由匝数比求电压","由匝数比求电流","理想变压器的功率关系","变压器为什么不能变直流"]}],"自由落体运动":[{"t":"自由落体的规律与比例","f":"已知下落高度或时间，求速度、位移，或求最后一段时间内的位移","k":"直接用 v=gt、h=½gt²、v²=2gh；「最后 1 s 内」用总位移减去前面位移","v":["求落地时间与落地速度","求最后 1 s 内的位移","连续相等时间内的位移比","求某段高度所需时间"],"q":[{"q":"物体从 45 m 高处自由下落，g 取 10 m/s²。求落地时间、落地速度，以及最后 1 s 内的位移。","s":["由 h = ½gt² 得 45 = ½×10×t²，解得 t = 3 s","落地速度 v = gt = 10×3 = 30 m/s","前 2 s 内位移 h₂ = ½×10×2² = 20 m","最后 1 s 内位移 = 45 − 20 = 25 m"],"a":"落地时间 3 s，落地速度 30 m/s，最后 1 s 内下落 25 m","c":"「最后 1 s 内」一律用总位移减前 (t−1) s 的位移，比逐段累加稳","x":"用比例 1:3:5：3 s 内三段位移共 9 份对应 45 m，每份 5 m，第三段 5×5 = 25 m，口算即得"}]},{"t":"频闪照片与重力加速度的测量","f":"给出小球自由下落的频闪照片，量出相邻间距，求 g 或某点的瞬时速度","k":"求 g 用逐差式 Δh = gT²；求瞬时速度用「中间时刻速度等于该段平均速度」","v":["用逐差法求重力加速度","求照片中某点的瞬时速度","判断照片是否从释放点开始","估算频闪时间间隔"],"q":[{"q":"频闪照片上连续三段间距为 1.0 cm、1.4 cm、1.8 cm，频闪间隔 0.02 s。求重力加速度和中间位置的速度。","s":["相邻位移差 Δh = 1.4 − 1.0 = 0.4 cm = 4×10⁻³ m","由 Δh = gT² 得 g = 4×10⁻³/(2×10⁻²)² = 10 m/s²","中间位置速度等于前后两段的平均速度：v = (1.0+1.4)×10⁻²/(2×0.02) = 0.6 m/s","检验：由 v = gt 得 t = 0.06 s，正好是 3 个时间间隔，位置对应无误"],"a":"g = 10 m/s²，中间位置速度 0.6 m/s","c":"两条公式分工明确：求 g 用 Δh = gT²，求瞬时速度用平均速度代替中间时刻速度","x":"看比例：自由落体连续相等时间位移比应为 1:3:5，实测 1.0:1.4:1.8 = 5:7:9，说明第一段之前已下落过一段，照片不是从释放点拍的"}]}],"薄膜干涉":[{"t":"增透膜与增反膜","f":"求增透膜的最小厚度，或判断膜厚与波长的关系","k":"增透膜利用两表面反射光相消，膜厚为介质中波长的四分之一，即 d = λ/(4n)","q":[{"q":"在折射率 1.5 的玻璃表面镀增透膜（膜材料折射率 1.38），使波长 550 nm 的绿光反射最少。求最小膜厚。","s":["增透条件：两表面反射光的光程差为半波长，反射相消","膜厚 d = λ/(4n)","= 550/(4×1.38)","≈ 99.6 nm"],"a":"约 100 nm","c":"增透膜厚度是「介质中波长的四分之一」，必须除以膜的折射率，不能直接用真空波长","x":"记住数量级：可见光增透膜约 100 nm。若算出几百 nm，说明忘了除以 n"}],"v":["求增透膜的最小厚度","判断膜厚与波长的关系","为什么厚度取 λ/4","增反膜的条件","反射光相消还是相长"]},{"t":"检验平整度与条纹弯曲","f":"由干涉条纹的弯曲方向判断表面是凸还是凹，或解释条纹疏密","k":"同一级条纹对应同一膜厚，故条纹总是向「膜更薄」的方向弯曲；条纹越密说明厚度变化越快","q":[{"q":"用标准平板检查工件表面时，干涉条纹向左侧弯曲。判断该处表面是凸起还是凹陷。","s":["同一级条纹对应相同的空气膜厚度","条纹向左弯曲，说明该处「同厚度」的位置比周围偏左","即该处膜厚偏大，工件表面凹陷","若条纹向右弯曲，则说明该处凸起"],"a":"该处表面凹陷","c":"判据：条纹总是向膜更薄的方向弯曲，因为同一级条纹对应同一膜厚","x":"记「弯向薄处」，再判断哪一边更薄，凹凸立刻清楚"}],"v":["判断表面是凸还是凹","解释条纹为什么疏密不均","弯曲方向与凹凸的对应","用劈尖检验平整度","条纹弯曲说明什么"]},{"t":"劈尖干涉的条纹间距与楔角","f":"由条纹间距判断楔角的变化，或解释条纹为什么等间距","k":"相邻亮纹对应膜厚差 λ/2，条纹间距 Δx = λ/(2θ)，θ 为楔角","q":[{"q":"用两块玻璃片夹成空气劈尖观察干涉条纹。若把夹片变薄使楔角减小，条纹间距如何变化？","s":["相邻亮纹对应的膜厚增加 λ/2","膜厚随水平距离的变化率由楔角决定：Δh = θ·Δx","令 θ·Δx = λ/2，得 Δx = λ/(2θ)","θ 减小则 Δx 增大，条纹变稀疏"],"a":"条纹间距变大，条纹变稀疏","c":"「楔角越小、条纹越疏」——这是劈尖干涉唯一的定量结论，检验平整度也靠它","x":"记住 Δx = λ/(2θ)，θ 在分母，所以楔角与条纹间距成反比"}],"v":["判断楔角变化后间距如何变","解释条纹为什么等间距","用 Δx = λ/(2θ) 计算","楔角越小条纹越疏","膜厚差为 λ/2 对应一条条纹"]}],"质点参考系":[{"t":"能否看成质点的判断","f":"给出具体情境（地球公转、火车过桥、乒乓球旋转等），判断能否把物体看成质点","k":"看物体的大小形状对所研究的问题有没有影响，影响可忽略才能看成质点，与物体本身大小无关","v":["判断某情境下能否看成质点","说明把物体看成质点的理由","同一物体在不同问题中的结论","区分质点与几何点"],"q":[{"q":"下列情况能把物体看成质点的是：A 研究地球自转；B 研究地球绕太阳公转；C 研究乒乓球的旋转发球；D 研究火车通过一座 200 m 长的桥所用的时间。","s":["判断标准只有一条：物体的大小、形状对所研究的问题影响是否可以忽略","A 自转：各点绕轴转动的情况不同，形状正是研究对象，不能忽略","B 公转：地球直径约 1.3×10⁴ km，远小于日地距离 1.5×10⁸ km，可以忽略","C 旋转：旋转本身就是各点位置不同造成的，不能忽略","D 过桥：火车长 200 m 与桥长可比，不能忽略"],"a":"只有 B 能看成质点","c":"关键不是「物体小不小」，而是「大小对这个问题有没有影响」，同一物体换一个问题答案可能相反","x":"极端化检验：把物体缩成一个点，若结论不变则可看成质点；若结论消失（旋转、过桥时间），则不能"}]},{"t":"参考系与相对运动","f":"给出两个物体的运动，判断甲相对乙的运动方向，或选择使问题最简的参考系","k":"相对速度用矢量差 v甲乙 = v甲 − v乙，符号带进去算，方向自然出来","v":["判断甲相对乙的运动方向","选择合适的参考系简化问题","说明静止是相对的","同向与反向运动的相对速度"],"q":[{"q":"甲、乙两车同向行驶，甲 20 m/s，乙 15 m/s；丙车以 15 m/s 反向行驶。求甲相对乙、甲相对丙的速度。","s":["取地面为参考系，规定甲的运动方向为正方向","v甲 = +20 m/s，v乙 = +15 m/s，v丙 = −15 m/s","甲相对乙：v甲乙 = 20 − 15 = 5 m/s，正值表示与甲同向","甲相对丙：v甲丙 = 20 − (−15) = 35 m/s，方向与甲相同"],"a":"甲相对乙为 5 m/s 同向；甲相对丙为 35 m/s 同向","c":"相对速度一律写成矢量差，把方向变成正负号，比画图更不容易错","x":"换到乙车上观察：乙看到甲以 5 m/s 超车，看到丙以 30 m/s 迎面而来，故甲丙相对速度 5+30 = 35 m/s"}]}],"质能方程":[{"t":"质量亏损与结合能","f":"求质量亏损、结合能、比结合能，或比较原子核的稳定性","k":"ΔE = Δmc²；比结合能 = 结合能 ÷ 核子数，中等质量核的比结合能最大、最稳定","q":[{"q":"氦核（4 个核子）的结合能为 28.3 MeV。求它的比结合能，并说明意义。","s":["比结合能 = 28.3 ÷ 4","≈ 7.1 MeV/核子","比结合能越大，原子核越稳定","铁附近的核比结合能最大（约 8.8 MeV/核子），所以最稳定"],"a":"约 7.1 MeV/核子","c":"衡量稳定性要看比结合能而不是结合能：核子多的核结合能自然大，但不一定更稳定","x":"记住「铁最稳定」，裂变与聚变都朝铁的方向走，所以两者都能释放能量"}],"v":["由原子质量求质量亏损","由质量亏损求结合能","求比结合能并比较稳定性","比较原子核的稳定性"]},{"t":"质量亏损的物理含义","f":"判断核反应中质量是否守恒，或解释亏损的质量去了哪里","k":"质量并没有消失，而是以能量形式释放；核反应中质量不守恒，但质能总量守恒","q":[{"q":"某核反应后总质量减少了 0.002 u。减少的质量去哪了？","s":["质量并没有凭空消失","由 ΔE = Δmc²，减少的质量以能量形式释放","ΔE = 0.002 × 931.5 ≈ 1.86 MeV","这些能量以光子动能、粒子动能的形式带走"],"a":"转化为约 1.86 MeV 的能量释放出去","c":"质量与能量是同一事物的两种形式：核反应中「质量不守恒，但质能总量守恒」","x":"一句话：亏损的质量变成了光子和粒子的动能，能量与质量始终等价"}],"v":["核反应中质量是否守恒","亏损的质量去了哪里","质量与能量的等价性","反应前后的总能量","不是质量消失而是形式转化"]},{"t":"比结合能曲线与核能释放方向","f":"由质量亏损计算核反应释放的能量，或判断某反应是否放能","k":"ΔE = Δm·c²；实用形式 ΔE = Δm × 931.5 MeV/u，也可用比结合能之差乘核子数","q":[{"q":"某核反应中质量亏损 0.02 u，已知 1 u 对应 931.5 MeV。求释放的核能。","s":["ΔE = Δm·c²，实用形式为 ΔE = Δm × 931.5 MeV/u","ΔE = 0.02 × 931.5","≈ 18.6 MeV","该能量以生成粒子的动能与γ光子形式释放"],"a":"约 18.6 MeV","c":"记住换算 1 u ↔ 931.5 MeV，比每次代 c² = 9×10¹⁶ 快十倍且不易错","x":"看到 u 就用 931.5 乘，看到 kg 才用 c² 硬算，两种单位不要混"}],"v":["计算反应释放的能量","判断某反应是否放能","为什么裂变与聚变都放能","都向曲线峰值靠拢","比结合能变大就放能"]}],"超重失重":[{"t":"视重的计算与判断","f":"电梯升降过程中体重计示数、弹簧秤读数，或由示数反推运动状态","k":"视重就是支持力或拉力，由牛顿第二定律决定；超重看加速度向上、失重看加速度向下，与速度方向完全无关","q":[{"q":"质量 60 kg 的人站在电梯内的体重计上，电梯正以 3 m/s² 的加速度减速下降。求体重计示数（g 取 10 m/s²）。","s":["减速下降意味着速度向下、加速度向上","对人：N − mg = ma，N = m(g + a) = 60×13","N = 780 N，大于实重 600 N","示数偏大，处于超重状态"],"a":"780 N","c":"先由「上升还是下降 + 加速还是减速」定出加速度方向，再代 N − mg = ma；速度方向不影响结论","x":"用等效重力加速度 g' = g + a = 13 m/s²，示数 = mg'，一步出结果；判超重失重只看 a 的箭头朝上还是朝下"}],"v":["求体重计的示数","由示数反推加速度","加速上升与减速下降的区别","完全失重时示数为零","斜向加速时的示数"]},{"t":"完全失重现象的判断","f":"空间站、自由落体系统内的仪器与现象判断，如天平、气压计、摆钟、浮力是否失效","k":"完全失重的条件是 a = g 且方向向下，此时一切由重力产生的效果（压力、浮力、液体压强、单摆回复力）全部消失，但质量与惯性不变","q":[{"q":"在绕地球做匀速圆周运动的空间站内，下列仪器仍能正常使用的是：A 天平　B 水银气压计　C 弹簧测力计　D 摆钟","s":["完全失重时物体对支持面的压力为零","天平靠重力压盘工作，失效；水银气压计靠液柱重力，失效；摆钟靠重力提供回复力，失效","弹簧测力计测的是弹簧的弹力，只要有力拉它就有示数","故只有弹簧测力计仍可使用"],"a":"C 弹簧测力计","c":"判断标准是「该仪器是否依赖重力产生效果」，凡与重力无关的（弹力、惯性、电磁）都照常工作","x":"一句话记：失重时「与重力有关的现象全部消失，与惯性、弹力、电磁有关的一概不变」"}],"v":["天平还能否称质量","水银气压计是否失效","摆钟是否停摆","浮力是否消失","空间站内的水滴形状"]},{"t":"示数与运动状态的多解对应","f":"给出体重计示数，列举电梯所有可能的运动状态；或判断「一定向上运动」这类说法是否成立","k":"示数只反映加速度方向，不反映速度方向；失重对应向下加速或向上减速两种可能","q":[{"q":"某人站在电梯内的体重计上，某段时间内示数稳定为实重的 0.8 倍。列举电梯可能的运动状态。","s":["示数小于实重，属于失重，加速度方向向下","加速度向下有两种可能：向下加速，或向上减速","故电梯可能在加速下降，也可能在减速上升","单凭示数无法区分，必须再知道速度方向才能确定"],"a":"可能向下加速，也可能向上减速；仅凭示数不能确定","c":"示数只反映加速度方向、不反映速度方向，这是超重失重题最常设的陷阱","x":"记「失重 = 向下加速 或 向上减速」，选择题里凡出现「一定向上运动」这类绝对表述都可直接排除"}],"v":["列举电梯所有可能的运动状态","判断「一定向上运动」是否正确","示数大于实重的两种情形","示数随时间变化的图像","由示数判断超重还是失重"]}],"运动和力的关系":[{"t":"瞬时性问题（弹簧与绳的区别）","f":"剪断细绳、撤去挡板、突然撤力的瞬间，求各物体的加速度","k":"判据只有一条：绳、杆、接触面的弹力可以突变，弹簧、橡皮条的弹力不能突变。剪断瞬间先看谁的形变来不及改变","q":[{"q":"质量均为 m 的 A、B 两球，A 用细绳悬挂在天花板上，A、B 之间用弹簧相连。剪断细绳的瞬间，A、B 的加速度各是多少？","s":["剪断前：绳张力 2mg，弹簧对 A 向下拉力 mg，对 B 向上拉力 mg","剪断瞬间绳张力立刻消失，弹簧形变来不及改变，弹力仍为 mg","A 球：合力 = mg（重力）+ mg（弹簧）= 2mg，方向向下，a_A = 2g","B 球：合力 = mg（重力）− mg（弹簧）= 0，a_B = 0"],"a":"A 为 2g 向下，B 为 0","c":"先算剪断前每个弹力，剪断后只删掉绳（杆）的力、保留弹簧的力，再分别求合力","x":"画一张「剪断前受力表」，两列分别写剪断前后的力，逐行相减就是合力，比在脑子里推演可靠得多"}],"v":["剪断细绳瞬间求加速度","撤去挡板瞬间求加速度","弹簧与绳的突变差异","突然撤去拉力的瞬间","剪断弹簧与剪断绳的结果对比"]},{"t":"牛顿三定律的辨析","f":"选择题判断惯性与质量的关系、作用力与反作用力和平衡力的区别、定律的适用范围","k":"惯性只由质量决定，与速度无关；作用力与反作用力作用在两个物体上，平衡力作用在同一物体上，这是唯一的区分标准","q":[{"q":"马拉车前进时，马拉车的力与车拉马的力大小关系如何？既然两者大小相等，车为什么还能前进？","s":["这两个力是一对作用力与反作用力，任何时刻大小相等、方向相反","它们分别作用在车和马两个不同物体上，不能相互抵消","对车：向前的拉力大于向后的阻力，合力向前，车加速前进","对马：地面向前的摩擦力大于车向后的拉力，合力向前，马也前进"],"a":"大小相等；能否前进取决于各自所受的合力","c":"判断一对力是「相互作用」还是「平衡」，只看作用对象是一个还是两个，与大小是否相等无关","x":"记口诀「同物平衡、异物相互作用」，再复杂的情境一句话就能定性"}],"v":["惯性与质量的关系","作用力反作用力与平衡力的区别","牛顿定律的适用范围","力是维持运动的原因吗","惯性与速度是否有关"]},{"t":"惯性系与非惯性系","f":"判断某个参考系中牛顿定律是否成立，或解释加速车厢、电梯内的现象","k":"牛顿定律只在惯性系中成立；相对地面静止或匀速直线运动的才是惯性系，有加速度的都不是","q":[{"q":"加速前进的车厢内，光滑水平桌面上放着一个小球。车内观察者看到小球向后运动，如何解释？","s":["地面观察者（惯性系）：小球水平方向不受力，保持原来的速度不变","车厢在加速前进，于是小球相对车厢向后移动","车内观察者（非惯性系）：小球有加速度，却找不到施力物体","说明牛顿定律在非惯性系中不成立；若要沿用 F = ma，必须补一个惯性力 ma（方向与车厢加速度相反）"],"a":"地面系看是小球保持惯性、车厢加速；车内系必须引入惯性力才能解释","c":"判断是否惯性系只看一点：该参考系相对地面有没有加速度","x":"一句话：不是「小球被推了一把」，而是「车厢先跑了」"}],"v":["判断某参考系中定律是否成立","加速车厢内悬挂小球的状态","电梯内单摆的偏角","非惯性系中的「惯性力」","匀速与加速参考系的区别"]}],"运动的描述":[{"t":"多过程运动的分段求解","f":"以「先加速再匀速后减速」「上升—下降」「传送带」等情境给出 2~3 个阶段，求总时间、总位移或某段速度","k":"画运动草图，逐段标出 v₀、v、a、x、t；阶段之间的唯一连接量是上一段的末速度，先算它，再一段一段往下推","q":[{"q":"汽车从静止出发以 2 m/s² 加速 5 s，接着匀速行驶 10 s，最后以 4 m/s² 匀减速到停止。求全程位移。","s":["第一段：v₁ = a₁t₁ = 10 m/s，x₁ = ½a₁t₁² = 25 m","第二段：x₂ = v₁t₂ = 10×10 = 100 m","第三段：t₃ = v₁/a₂ = 2.5 s，x₃ = v₁²/(2a₂) = 12.5 m","总位移 x = 25 + 100 + 12.5 = 137.5 m"],"a":"137.5 m","c":"分段列式，每段挑「缺一个量」的公式；交界速度是唯一必须传递的量，先算它再算各段，可避免重复计算","x":"画 v-t 图，位移就是图线下的面积：上底 10 s、下底 17.5 s、高 10 m/s 的梯形，(10+17.5)/2×10 = 137.5 m，一步到位还能顺手检查数量级"}],"v":["求全程总时间或总位移","求某个阶段的速度或加速度","在 v-t 图上分段求面积","判断相邻两段的加速度是否相同"]},{"t":"追及与相遇问题","f":"两物体同向运动，给出初速度、加速度或图像，判断能否追上、求最远（最近）距离或相遇时刻","k":"临界条件永远是「速度相等」——此时距离取极值。先用 v₁ = v₂ 求出临界时刻，再把两个位移相减；能否追上则看临界时刻的位移差是否已跨过初始距离","q":[{"q":"甲车以 10 m/s 匀速行驶，经过静止的乙车时乙车立即以 2 m/s² 同向启动。求两车再次相遇前相距的最远距离。","s":["速度相等时距离最远：10 = 2t，t = 5 s","甲的位移 x甲 = 10×5 = 50 m","乙的位移 x乙 = ½×2×5² = 25 m","最远距离 Δx = 50 − 25 = 25 m"],"a":"25 m","c":"「速度相等 → 距离极值」是追及问题的通用判据；先求临界时刻，再作位移差，最后与初始间距比较判断能否追上","x":"换参考系：以甲为参考系，乙的相对初速度为 −10 m/s、相对加速度 +2 m/s²，相对速度减到零时相对位移最大，Δx = v²/(2a) = 100/4 = 25 m，一步出结果"}],"v":["求两者之间的最大（最小）距离","判断能否追上、何时追上","求相遇时的位置","用 v-t 图面积差解追及","两次相遇的时间间隔"]},{"t":"x-t 图像的分析","f":"由位移—时间图线判断运动性质、求速度、比较两物体、求相遇位置","k":"x-t 图的斜率是速度，斜率正负表方向，交点表相遇，图线弯曲表变速","q":[{"q":"甲、乙两物体的 x-t 图线都是直线：甲从原点出发、斜率为 4 m/s；乙从 x = 10 m 处出发、斜率为 −2 m/s。求两者相遇的时刻与位置。","s":["甲：x甲 = 4t（从原点出发，速度 4 m/s）","乙：x乙 = 10 − 2t（从 10 m 处反向运动）","相遇即位置相同：4t = 10 − 2t","解得 t = 5/3 ≈ 1.67 s，代入得 x ≈ 6.7 m"],"a":"约 1.67 s 时在 x ≈ 6.7 m 处相遇","c":"x-t 图的交点是相遇，不是速度相等——这一点和 v-t 图正好相反，最容易混","x":"相对速度法：两者接近速度 4 + 2 = 6 m/s，相距 10 m，t = 10/6 ≈ 1.67 s，一步得"}],"v":["由斜率求速度大小与方向","判断物体的运动性质","比较两物体的速度大小","求两图线交点的含义","由图像求某段时间的位移"]}],"近代物理":[{"t":"波粒二象性的判断","f":"判断某现象体现光的粒子性还是波动性，或计算光子的能量与动量","k":"干涉、衍射、偏振体现波动性；光电效应、康普顿散射体现粒子性。光子能量 ε = hν = hc/λ","q":[{"q":"波长 500 nm 的光子能量是多少焦耳？合多少电子伏？","s":["ε = hc/λ = 6.63×10⁻³⁴ × 3×10⁸ ÷ 5×10⁻⁷","= 3.98×10⁻¹⁹ J","换算：1 eV = 1.6×10⁻¹⁹ J","ε ≈ 2.49 eV"],"a":"约 4.0×10⁻¹⁹ J，约 2.5 eV","c":"1 eV = 1.6×10⁻¹⁹ J 是必背换算，光子能量在原子物理里几乎都用 eV 表示","x":"记 hc = 1240 eV·nm，则 ε = 1240/λ(nm) = 1240/500 ≈ 2.48 eV，一步出结果"}],"v":["判断某现象体现粒子性","判断某现象体现波动性","计算光子的能量","计算光子的动量","干涉与光电效应各归属哪一面"]},{"t":"核能的计算","f":"由质量亏损求释放的核能，或比较不同核反应的释能量级","k":"ΔE = Δmc²，实用换算为 1 u 对应 931.5 MeV","q":[{"q":"某核反应中质量亏损为 0.02 u。求释放的核能。","s":["ΔE = Δm·c²","用 1 u 对应 931.5 MeV 换算","ΔE = 0.02 × 931.5","≈ 18.6 MeV"],"a":"约 18.6 MeV","c":"核反应能量几乎都用 1 u = 931.5 MeV 换算，比每次代入 c² = 9×10¹⁶ 快得多","x":"记住量级：核反应释放的能量在 MeV 级，化学反应在 eV 级，两者相差约百万倍"}],"v":["由质量亏损求核能","比较不同核反应的释能量级","用 931.5 MeV/u 换算","裂变与聚变的能量比较","1 u 对应多少 MeV"]},{"t":"物理学史与经典实验的对应","f":"把实验现象、科学家与结论正确对应，或判断某结论由谁通过什么实验得出","k":"按「现象—实验—结论」三列记忆：α散射→核式结构、光电效应→光子说、氢光谱→玻尔模型","q":[{"q":"把「α粒子散射实验」「光电效应实验」「氢原子光谱」与各自对应的结论配对。","s":["α粒子散射：极少数发生大角度偏转 → 原子核式结构（卢瑟福）","光电效应：存在截止频率、具有瞬时性 → 光子说（爱因斯坦）","氢原子光谱：分立的线状谱 → 能级量子化（玻尔）","三条线索分别指向原子结构、光的本性、原子能量的量子化"],"a":"α散射→核式结构；光电效应→光子说；氢光谱→玻尔能级","c":"史实题不考细节年份，只考「哪个实验推翻了哪个模型」，抓住这一层就够","x":"口诀：「散射定核、光电定光子、光谱定能级」"}],"v":["把实验与结论配对","判断某结论由谁得出","哪个实验推翻了哪个模型","用口诀记忆三条主线","散射定核、光电定光子、光谱定能级"]}],"连接体问题":[{"t":"轻绳连接体的加速度与张力","f":"滑轮组、斜面上用轻绳连接的两物体，求加速度、绳张力或某段绳的受力","k":"整体法求 a（内力不出现），隔离法求 T（只对一个物体列式）；轻绳不可伸长意味着两物体加速度大小相同","q":[{"q":"质量 2 kg 的物体放在光滑水平桌面上，通过跨过定滑轮的轻绳与悬空的 3 kg 物体相连。求系统的加速度与绳张力（g 取 10 m/s²）。","s":["整体：只有悬空物体的重力是外力，m₂g = (m₁+m₂)a","a = 30/5 = 6 m/s²","隔离桌面上的物体：T = m₁a = 2×6 = 12 N","校验：隔离悬空物体，m₂g − T = 30 − 12 = 18 = 3×6，与 a 一致"],"a":"a = 6 m/s²，T = 12 N","c":"整体一步得 a、隔离一步得 T，两个方程互为校验，只要两边自洽基本不会算错","x":"记结论 T = m₁m₂g/(m₁+m₂) = 12 N，选择题可直接套；若桌面有摩擦，把 m₂g 换成 m₂g − μm₁g 即可"}],"v":["滑轮组两侧的加速度","斜面上绳的张力","绳的张力是否处处相等","加速度大小相同的条件","动滑轮两侧的速度关系"]},{"t":"板块模型","f":"物块放在木板上，水平力作用于其中之一，判断是否一起运动、求各自加速度与相对位移","k":"先假设一起运动、用整体法求 a，再隔离受力较少的物体检验所需静摩擦是否超过最大值；超过则发生相对滑动，须分别列式","q":[{"q":"质量 2 kg 的木板放在光滑水平面上，其上放 1 kg 的物块，两者间动摩擦因数 0.2。用 9 N 水平力拉木板，求物块与木板的加速度（g 取 10 m/s²）。","s":["假设一起运动：a = 9/3 = 3 m/s²","隔离物块：所需静摩擦 f = ma = 3 N","最大静摩擦 f_max = μmg = 0.2×1×10 = 2 N < 3 N，假设不成立","物块 a₁ = μg = 2 m/s²；木板 9 − 2 = 2a₂，a₂ = 3.5 m/s²"],"a":"物块 2 m/s²，木板 3.5 m/s²","c":"板块题必须做「假设一起 → 检验静摩擦」这一步，跳过就一定会错判运动状态","x":"先算临界拉力 F₀ = f_max(m+M)/m = 2×3/1 = 6 N，9 N 已超过，立刻判定相对滑动，省去假设与检验"}],"v":["判断是否一起运动","求各自的加速度","求相对位移与划痕长度","求恰好不滑下的板长","地面光滑与粗糙的差别"]},{"t":"弹簧连接体的分离临界","f":"两物体叠放并由弹簧支撑，求恰好分离时的位置、弹力或速度","k":"恰好分离的判据是接触面间弹力 N = 0，此刻两者加速度仍相同","q":[{"q":"质量均为 m 的物块 A、B 上下叠放，B 的下方连着劲度系数为 k 的竖直弹簧。用力缓慢下压 A 后释放，求 A、B 恰好分离时弹簧的形变量。","s":["分离瞬间 A、B 之间的弹力 N = 0","对 A：只受重力，故 a_A = g，方向向下","对 B：受重力 mg 与弹簧弹力 F，且 a_B 也等于 g","由 mg − F = m·g 得 F = 0","弹簧弹力为零，说明此时弹簧恰好恢复原长"],"a":"弹簧恢复原长（形变量为零）时两者分离","c":"「恰好分离」一律先写 N = 0，再对两个物体各列一次牛顿第二定律，用「加速度相同」把两式联立","x":"结论速记：竖直弹簧支撑的两物体分离时弹簧恰好原长，与下压多少无关"}],"v":["求恰好分离时的位置","求分离瞬间的弹力","求分离时的速度","分离后各自的加速度","分离条件是 N=0"]}],"重力":[{"t":"重力与视重（超重失重的本质）","f":"电梯、升降机、体重计情境，判断示数与实重的关系，或由示数反推加速度","k":"视重就是支持力（或拉力），由牛顿第二定律决定；超重失重只改变视重，重力 mg 从头到尾没变","q":[{"q":"质量 50 kg 的人站在电梯内的体重计上，电梯以 2 m/s² 的加速度匀加速上升。求体重计示数（g 取 10 m/s²）。","s":["对人受力分析：重力 mg 向下，支持力 N 向上","加速度向上，合力向上：N − mg = ma","N = m(g + a) = 50×(10+2) = 600 N","示数 600 N，大于实重 500 N，处于超重状态"],"a":"600 N","c":"先定加速度方向，再写「支持力 − 重力 = ma」，符号由方程自己给出，不要凭感觉加减","x":"用等效重力加速度：g' = g + a = 12 m/s²，示数 = mg' = 600 N，一步得解；减速下降同理 g' = g − a"}],"v":["判断处于超重还是失重","由体重计示数求加速度","完全失重的条件与现象","比较示数与实重的大小","斜向加速时示数如何变化"]},{"t":"重心位置与组合体","f":"求组合体的重心位置，或用悬挂法、支撑法判断重心，或讨论稳度与重心高低的关系","k":"重心是重力的等效作用点，均匀规则物体在几何中心；组合体的重心用「加权平均」求，等价于找平行力的合力作用点","q":[{"q":"长 1 m 的均匀杆重 10 N，在一端挂 30 N 的重物。求整体重心到挂重物端的距离。","s":["以挂重物端为原点，杆的重心在 0.5 m 处，重 10 N","重物作用在原点，重 30 N","由力矩平衡求合力作用点：x = (10×0.5 + 30×0) / (10+30)","x = 5/40 = 0.125 m"],"a":"距挂重物端 0.125 m","c":"组合体重心 = 各部分重力对某点的力矩之和 ÷ 总重力，与求质心是同一套算法","x":"当成杠杆看：重心到两端的距离与两端的重力成反比，(0.5−x)/x = 30/10，解得 x = 0.125 m，一步出"}],"v":["求组合体的重心位置","用悬挂法确定重心","稳度与重心高低的关系","挖去一部分后的重心偏移","重心不一定在物体上"]},{"t":"重力加速度随位置的变化","f":"比较赤道与两极、地表与高空、不同星球上的重力与 g","k":"g = GM/R²；高度越大 g 越小，纬度越高 g 越大，赤道 g 最小因为部分引力提供了自转向心力","q":[{"q":"某星球质量为地球的 4 倍、半径为地球的 2 倍。求该星球表面的重力加速度与地球的比值。","s":["表面重力加速度 g = GM/R²","g′/g = (M′/M) ÷ (R′/R)²","= 4 ÷ 2² = 4 ÷ 4 = 1","故两星球表面重力加速度相同"],"a":"比值为 1，即 g′ = g","c":"一切 g 的比较题都写成 g = GM/R² 的比值式再约分，不必代入 G 的数值","x":"记「质量翻倍、半径也翻倍 → g 不变」，因为 R 是平方关系"}],"v":["比较赤道与两极的 g","比较地表与高空的 g","比较不同天体表面的 g","g 随纬度升高而增大","重力与万有引力的差别"]}],"重力势能与弹性势能":[{"t":"重力做功与重力势能变化","f":"物体沿不同路径上升或下降，求重力做的功与重力势能的变化量","k":"重力做功只由高度差决定，WG = mgΔh；重力做正功势能减少，做负功势能增加","v":["求重力做的功","求重力势能的变化量","零势能面如何选取","沿曲面下滑重力做功"],"q":[{"q":"质量 2 kg 的物体从高 5 m 处自由下落，陷入沙中 0.2 m 后停止，g=10。求下落过程中重力做的功与重力势能的变化；陷入沙中时重力做功多少？","s":["下落 5 m：W_G = mgh = 2×10×5 = 100 J","重力做正功，重力势能减少 100 J，即 ΔEp = −100 J","陷入沙中 0.2 m：重力仍竖直向下，与位移同向，W_G = 2×10×0.2 = 4 J","全程重力做功 104 J，与路径无关"],"a":"下落过程重力做功 100 J、势能减少 100 J；陷入沙中重力做功 4 J","c":"重力做功只看初末高度差，与路径、与零势能面的选择都无关","x":"整体一步算：初末高度差 5.2 m，W_G = 2×10×5.2 = 104 J，不必分两段"}]},{"t":"弹性势能与能量转化","f":"弹簧被压缩或拉伸后释放，求弹性势能、弹出速度或最大形变量","k":"Ep = ½kx²；弹簧恢复原长时弹性势能全部转化为动能","v":["求弹簧的弹性势能","求物体被弹出的速度","求弹簧的最大压缩量","用 F-x 面积求功"],"q":[{"q":"劲度系数 200 N/m 的弹簧被压缩 0.1 m，求弹性势能；在光滑水平面上用它弹出质量 0.2 kg 的物体，求物体离开弹簧时的速度。","s":["Ep = ½kx² = ½×200×0.01 = 1 J","弹簧恢复原长时弹性势能全部转化为物体动能：½mv² = 1","v = √(2/0.2) = √10 ≈ 3.16 m/s","若弹簧只被压缩一半（0.05 m），弹性势能变为 1/4，弹出速度为原来的一半"],"a":"弹性势能 1 J，物体速度为 √10 ≈ 3.16 m/s","c":"½kx² 的本质是平均力 kx/2 乘位移 x，所以弹簧的 F-x 图是一条过原点的直线","x":"用面积法现场推：最大弹力 kx = 20 N，三角形面积 ½×20×0.1 = 1 J，忘记公式也能算"}]}],"闭合电路欧姆定律":[{"t":"电源的功率与效率","f":"求电源总功率、输出功率、内耗功率、效率，或求输出功率最大、效率最高的条件", = −W；电场力做正功电势能减少，只有电场力做功时动能与电势能之和守恒","q":[{"q":"电荷 q = −2×10⁻⁶ C 从 A 点移到 B 点，电场力做功 4×10⁻⁶ J。求 U_AB 与电势能的变化量。","s":["由 W_AB = qU_AB 得 U_AB = W_AB/q = 4×10⁻⁶ ÷ (−2×10⁻⁶) = −2 V","U_AB < 0 说明 φ_A < φ_B，B 点电势更高","电场力做正功，电势能一定减少","ΔEp = −W_AB = −4×10⁻⁶ J"],"a":"U_AB = −2 V，电势能减少 4×10⁻⁶ J","c":"三个符号最容易乱：q 的正负、U_AB = φ_A − φ_B 的顺序、W = qU 的写法。一律先代数运算，再解释含义","x":"用「电场力做正功 → 电势能减少」定符号，其余靠 W = qU 定量，比死记符号规则可靠得多"}],"v":["求电场力做的功","求电势能的变化","求动能的变化","用 W电 = −ΔEp 计算","结合动能定理求速度"]},{"t":"电场中带电体的平衡","f":"带电小球悬挂在电场中、静止在斜面上，求场强、电量或偏角","k":"把电场力 qE 当成普通力并进受力分析，与重力、绳拉力一起列平衡方程","q":[{"q":"质量 m、电荷量 q 的带正电小球用绝缘细线悬挂在水平向右的匀强电场中，静止时细线与竖直方向成 30°。求场强大小。","s":["小球受重力 mg、绳拉力 T、电场力 qE 三个力","水平方向：T sin30° = qE","竖直方向：T cos30° = mg","两式相除得 tan30° = qE/mg","E = mg tan30°/q = √3mg/(3q)"],"a":"E = √3mg/(3q)","c":"电场力就是普通力，直接并进受力分析；三力平衡用合成法或正交分解都可以","x":"记结论：偏角 θ 满足 tanθ = qE/mg，看到角度直接写比值，不必解方程"}],"v":["悬挂小球求场强","斜面上静止求电荷量","求悬线与竖直方向的偏角","三力平衡的分析","求悬线的张力与偏角"]}],"静电屏蔽与应用":[{"t":"静电平衡的三条结论","f":"导体放入电场后达到静电平衡，判断内部场强、电势与电荷分布","k":"内部合场强为零、整体是等势体、净电荷只分布在外表面（曲率大处更密）","v":["导体内部场强是多少","导体是否为等势体","净电荷分布在哪里","尖端为什么电荷密集"],"q":[{"q":"一金属球壳放在匀强电场中达到静电平衡。判断球壳内部的场强、球壳各点的电势、净电荷的分布。","s":["静电平衡时导体内部（含空腔）的合场强为零","内部场强为零意味着沿内部任意路径电势不变，整个导体是等势体","净电荷只分布在导体外表面，曲率大处面电荷密度更大","外电场与感应电荷产生的场在导体内部正好等大反向"],"a":"内部场强为零，导体是等势体，净电荷分布在外表面","c":"静电平衡就三条结论：内部场强为零、整体等势、电荷在外表面，背下来直接套","x":"用「抵消」理解：感应电荷在导体内产生的场与外场等大反向，合场强自然为零，不必背结论"}]},{"t":"静电屏蔽的应用","f":"判断某装置能否起到屏蔽作用，或解释金属网罩、屏蔽服、同轴电缆的原理","k":"空腔导体内部场强为零，可屏蔽外电场；接地导体壳还能屏蔽腔内电荷对外部的影响","v":["金属网罩能否屏蔽电场","接地与不接地的区别","高压带电作业服的原理","为什么用网而不用实心板"],"q":[{"q":"为什么精密电子仪器外面用金属网罩，而高压带电作业服里织入金属丝？","s":["金属网罩在电场中达到静电平衡，内部场强为零，外部电场无法进入","网孔远小于电磁波波长时屏蔽效果与实心板相当，且更轻便、透气","作业服中的金属丝使人体表面等电势，人体内部场强为零","两者都利用了静电平衡时导体内部场强为零这一条性质"],"a":"两者都是静电屏蔽：网罩屏蔽外场，作业服使人处于等势体内部","c":"屏蔽的本质只有一句「导体内部场强为零」，形式可以是板、网、笼、服","x":"反过来想：若没有屏蔽，仪器内部存在场强，电荷重新分布就会导致误动作，所以必须屏蔽"}]}],"高中物理":[{"t":"多过程综合题的解题流程","f":"给出包含多个阶段、多个物体的情境，求某状态的速度、某力的大小或某过程的能量转化","k":"四步定式：①选对象（整体还是隔离）②分段（按加速度是否变化切）③每段选规律（要力用牛顿定律、要时间用动量、要位移用动能）④衔接点（速度、位移）","q":[{"   el.className='lbl'; el.textContent=n;
  const lb=new CSS2DObject(el);
  lb.position.copy(P[i]).add(new THREE.Vector3(0,r*1.6+.1,0));
  lb.userData.w=n.length*11+10;          // 11px 字号下标签宽度的估算，防重叠时用
  scene.add(lb);
  labels.push(lb); labelPos.push(lb.position);
});

/* ---------- 屏幕空间拾取 ---------- */
// Plotly 的 3D 命中按节点实际像素半径算，小球几乎点不中。
// 这里改成屏幕空间判定：每个节点在屏幕上都有固定的最小热区半径，远近一致。
const rect={w:0,h:0,l:0,t:0}, tmp=new THREE.Vector3(), camSpace=new THREE.Vector3();
function syncRect(){const b=renderer.domElement.getBoundingClientRect();rect.w=b.width;rect.h=b.height;rect.l=b.left;rect.t=b.top}
syncRect();

function project(p){
  camSpace.copy(p).applyMatrix4(camera.matrixWorldInverse);
  if(camSpace.z>-0.2) return null;                       // 在相机背后
  tmp.copy(p).project(camera);
  return {x:(tmp.x*.5+.5)*rect.w+rect.l, y:(-tmp.y*.5+.5)*rect.h+rect.t, d:-camSpace.z};
}

const HOT=19;                                            // 最小热区半径（像素）
function pick(mx,my){
  camera.updateMatrixWorld();
  let best=-1, bestScore=Infinity, bestDepth=Infinity;
  for(let i=0;i<NODES.length;i++){
    const s=project(P[i]); if(!s) continue;
    const lim=Math.max(RAD[i]*(rect.h/2)/(Math.tan(camera.fov*Math.PI/360)*s.d)*1.35, HOT);
    let score=Math.hypot(s.x-mx,s.y-my);
    if(score>lim){                                       // 球体没命中，再看标签
      const l=project(labelPos[i]);
      if(!l) continue;
      const dl=Math.hypot(l.x-mx,l.y-my);
      if(dl>lim*1.05) continue;
      score=dl;
    }
    if(score<bestScore-1.5 || (Math.abs(score-bestScore)<=1.5 && s.d<bestDepth)){
      best=i; bestScore=score; bestDepth=s.d;
    }
  }
  return best;
}

/* ---------- 状态与着色 ---------- */
let selected=-1, hovered=-1, showLabels=true;

function paint(){
  const rel=selected>=0?new Set([NODES[selected],...ADJ[NODES[selected]]]):null;
  meshes.forEach((m,i)=>{
    const on=i===selected, hov=i===hovered;
    // 悬停的节点即使在其他节点被灰掉时也恢复原色，明确"点下去选的是它"
    const dim=selected>=0&&!on&&!hov;
    m.scale.setScalar(on?2:(hov?1.15:(dim?.8:1)));
    m.material.color.copy(dim?GREY:m.userData.c);
    m.material.emissive.copy(dim?BG:m.userData.c);
    m.material.emissiveIntensity=dim?.02:(hov?.26:.08);
  });
  lmat.opacity=selected>=0?.14:.55;
  rlmat.opacity=selected>=0?.06:.2;
  labels.forEach((lb,i)=>{
    lb.position.y=P[i].y+RAD[i]*(i===selected?2.1:1.5)+.08;   // 跟随球体缩放，始终贴在球外
    // 注意：CSS2DRenderer 每帧会覆盖 element.style.display，隐藏必须用 object.visible
    // 分级显示：根、模块、章常显；知识点只在悬停/选中、或作为选中节点的关联时出现，
    // 否则 149 个节点的标签会糊成一片
    const focus=i===selected||i===hovered;
    const big=LV[NODES[i]]<=2;
    lb.userData.want=showLabels&&(focus||(big&&(!rel||rel.has(NODES[i]))));
    lb.element.style.fontWeight=i===selected?'700':'400';
    lb.element.style.fontSize=i===selected?'13px':'11px';
    lb.element.style.color=(selected>=0&&!rel.has(NODES[i]))?'#C9CDD3':'#2C3E50';
    lb.element.style.opacity=i===hovered||i===selected?'1':'.82';
  });
}

/* ---------- 标签防重叠 ----------
   常显的标签是根 + 6 个模块 + 25 个章，一共 32 个，投影后难免互相压字。
   这里按「悬停/选中 → 根 → 模块 → 章」的优先级依次占位，与已占位矩形相交的
   先不显示（转一下视角自然就出来了）。纯几何计算，不读 DOM，每帧只多几十次投影。 */
function prio(i){ return (i===selected||i===hovered)?-1:LV[NODES[i]]; }
function layoutLabels(){
  const box=[], order=[];
  for(let i=0;i<labels.length;i++){
    if(labels[i].userData.want) order.push(i);
    else labels[i].visible=false;
  }
  order.sort((a,b)=>prio(a)-prio(b));
  for(const i of order){
    const lb=labels[i], s=project(labelPos[i]);
    if(!s){ lb.visible=false; continue; }
    const w=lb.userData.w+(i===selected?8:0), h=15;
    const x=s.x-w/2, y=s.y-h/2;
    let hit=false;
    for(let k=0;k<box.length;k++){
      const b=box[k];
      if(x<b[2]+2 && x+w>b[0]-2 && y<b[3]+1 && y+h>b[1]-1){ hit=true; break; }
    }
    lb.visible=!hit;
    if(!hit) box.push([x,y,x+w,y+h]);
  }
}

/* ---------- 相机动画 ---------- */
let anim=null;
let tocOpen=false;                 // 目录面板是否展开（focus 需要据此算焦点偏移）
function flyTo(camTo,tgtTo,dur=700){
  anim={c0:camera.position.clone(),c1:camTo.clone(),t0:controls.target.clone(),t1:tgtTo.clone(),t:0,dur};
}
function focus(i){
  const tgt=P[i];
  const dir=camera.position.clone().sub(controls.target);
  if(dir.lengthSq()<1e-6) dir.copy(HOME);
  dir.normalize();
  // 距离按「选中节点 + 它的邻居」的包围范围自适应，
  // 保证聚焦后周围的节点仍在视野内，可以接着点，不用先缩放。
  let rad=1.4;
  (ADJ[NODES[i]]||[]).forEach(n=>{
    const j=NODES.indexOf(n);
    if(j>=0) rad=Math.max(rad,tgt.distanceTo(P[j])+RAD[j]);
  });
  const fit=rad/Math.tan(camera.fov*Math.PI/360)*1.12;
  const dist=Math.min(Math.max(fit,7),26);
  // 右侧有详情面板，把焦点往左挪半屏宽，选中节点才不会被挡住
  camera.updateMatrixWorld();
  const perPx=2*dist*Math.tan(camera.fov*Math.PI/360)/innerHeight;
  const aim=tgt.clone();
  if(innerWidth>860){
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).normalize();
    // 左侧目录占 320px、右侧详情占 372px，把焦点移到两者之间空白区的中心
    const shift=tocOpen?26:186;
    aim.addScaledVector(right,shift*perPx);        // 大屏：按左右面板宽度差把焦点居中
  }else{
    // 窄屏详情面板在底部（bottom:12、max-height:42vh），焦点上移到面板上方的空白区中心
    aim.y-=(innerHeight*.21+6)*perPx;
  }
  flyTo(aim.clone().add(dir.multiplyScalar(dist)),aim);
}
function home(){
  selected=-1; hovered=-1; paint(); renderHint();
  flyTo(HOME,new THREE.Vector3(0,0,0),600);
}

/* ---------- 详情面板 ---------- */
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 转义后只放行 <sub>/<sup>，其余 HTML 一律当文本
const rich=v=>esc(v).replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>');
const side=document.getElementById('sidebar'), box=document.getElementById('search'), res=document.getElementById('results');
const HINT='<div class="hint">点击图中任意节点<br>查看知识点、公式、考法与例题</div>';
function renderHint(){side.innerHTML=HINT}

// 关系类型 → 颜色。同一套颜色用于标签、关联列表与思维导图的连线
const RTYPE={'前置':['#5DADE2','以它为前提'],'延伸':['#27AE60','向纵深延伸'],'对比':['#E67E22','易混辨析'],
             '同源':['#8E44AD','共用同一模型'],'应用':['#E74C3C','作为工具应用'],'组成':['#7F8C8D','结构组成'],
             '迁移':['#16A085','跨模块迁移']};
const rt=k=>RTYPE[k]||['#95A5A6',k];

/* 关联思维导图：左侧根节点，右侧按关系逐条展开，线色区分关系类型 */
function mindmap(n,rel){
  if(!rel.length) return '';
  const W=314, RH=25, GAP=8, TOP=14;
  const H=Math.max(132, rel.length*(RH+GAP)-GAP+TOP*2), cy=H/2, c=(INFO[n]||['#999'])[0];
  const RW=Math.min(100,Math.max(62,n.length*11+14));      // 根节点宽度随名字长度走
  const BX=RW+54, FS=n.length>6?10.5:11.5;
  let s=`<svg class="mm" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
  s+=`<rect x="2" y="${cy-13}" width="${RW}" height="26" rx="7" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-opacity=".55"/>`;
  s+=`<text x="${2+RW/2}" y="${cy+4}" text-anchor="middle" class="mmr" style="font-size:${FS}px">${esc(n)}</text>`;
  rel.forEach((r,i)=>{
    const info=RELM[n+'|'+r]||['关联',''], col=rt(info[0])[0];
    const by=TOP+i*(RH+GAP)+RH/2;
    s+=`<path d="M ${2+RW} ${cy} C ${2+RW+26} ${cy} ${BX-26} ${by} ${BX-3} ${by}"
         fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="1.4"/>`;
    s+=`<g class="mmn" data-n="${esc(r)}">
      <rect x="${BX}" y="${by-RH/2}" width="${W-BX-2}" height="${RH}" rx="6" fill="#F7F9FC" stroke="#E4E9F0"/>
      <circle cx="${BX+11}" cy="${by}" r="3.2" fill="${col}"/>
      <text x="${BX+20}" y="${by+4}" class="mmb">${esc(r.length>8?r.slice(0,8)+'…':r)}</text>
      <text x="${W-8}" y="${by+4}" text-anchor="end" class="mmt">${esc(info[0])}</text></g>`;
  });
  s+='</svg>';
  const types=[...new Set(rel.map(r=>(RELM[n+'|'+r]||['关联'])[0]))];
  return s+`<div class="mml">${types.map(t=>`<span><i style="background:${rt(t)[0]}"></i>${esc(t)}</span>`).join('')}</div>`;
}

function panel(n){
  const [c,d,f,no,p,t,e]=INFO[n]||['#999','暂无描述',[],[],[],[],[]];
  const rel=relOf(n), ex=EX[n]||[];
  const nav=[[f.length,'sec-f','公式'],[no.length,'sec-no','结论'],[p.length,'sec-p','要点'],
             [t.length,'sec-t','易错'],[(ex.length||e.length),'sec-e','考法'],[rel.length,'sec-rel','关联'],
             [rel.length,'sec-map','导图']]
            .filter(x=>x[0]).map(x=>`<a data-t="${x[1]}">${x[2]}</a>`).join('');

  // 考法：有题库就用折叠卡片（含例题与解法），否则退回标签
  const exHtml = ex.length
    ? `<div class="sec" id="sec-e">常见考法<em>${ex.length} 类 · ${ex.reduce((a,x)=>a+(x.q||[]).length,0)} 例</em></div>`
      + ex.map((x,i)=>{
          const qs=x.q||[];
          return `<div class="exg${i?'':' open'}">
            <div class="exh"><span class="exn">${i+1}</span><span class="ext">${rich(x.t)}</span><i class="exarw"></i></div>
            <div class="exb">
              ${x.f?`<div class="exf"><b>考查形式</b>${rich(x.f)}${(x.v&&x.v.length)?`<ul class="exv">${x.v.map(s=>`<li>${rich(s)}</li>`).join('')}</ul>`:''}</div>`:''}
              ${x.k?`<div class="exk"><b>破题关键</b>${rich(x.k)}</div>`:''}
              ${qs.map(q=>`<div class="exq">
                <div class="exqt"><span class="tag">例</span>${rich(q.q)}</div>
                ${(q.s||[]).length?`<ol class="exqs">${q.s.map(s=>`<li>${rich(s)}</li>`).join('')}</ol>`:''}
                ${q.a?`<div class="exqa"><b>答案</b>${rich(q.a)}</div>`:''}
                <div class="exsol">
                  ${q.c?`<div class="sc"><b>核心解法</b>${rich(q.c)}</div>`:''}
                  ${q.x?`<div class="sx"><b>特殊解法</b>${rich(q.x)}</div>`:''}
                </div></div>`).join('')}
            </div></div>`;
        }).join('')
    : (e.length?`<div class="sec" id="sec-e">常见考法</div>`+e.map(x=>`<span class="ex">${rich(x)}</span>`).join(''):'');

  // 关联概念：只列同级 / 下级，附关系类型与说明
  const relHtml = rel.length
    ? `<div class="sec p" id="sec-rel">关联概念<em>${rel.length} 个</em></div>`
      + rel.map(r=>{
          const info=RELM[n+'|'+r]||['关联',''], tc=rt(info[0])[0];
          const cc=(INFO[r]||['#999'])[0];
          return `<div class="rel" data-n="${esc(r)}" style="border-left-color:${cc}">
            <div class="relh"><b>${esc(r)}</b>
              <span class="relt" style="background:${tc}">${esc(info[0])}</span>
              <span class="lv">${LV[r]>LV[n]?'下级':LV[r]<LV[n]?'上级':'同级'}</span></div>
            ${info[1]?`<div class="reld">${rich(info[1])}</div>`:''}</div>`;
        }).join('')
      + `<div class="sec p" id="sec-map">关联思维导图</div><div class="mmw">${mindmap(n,rel)}</div>`
    : `<div class="sec p" id="sec-rel">关联概念</div><div class="hint">暂无同级关联</div>`;

  side.innerHTML=`<h3 style="border-bottom-color:${c}">${esc(n)}</h3>
    <div class="nav">${nav}</div>
    <div class="sec" id="sec-d">概念概述</div><div class="desc">${rich(d)||'暂无描述'}</div>`
    +(f.length?`<div class="sec" id="sec-f">核心公式</div>`
      +f.map(x=>`<div class="f"><b>${rich(x[0])}</b><i>${rich(x[1]||'')}</i></div>`).join(''):'')
    +(no.length?`<div class="sec" id="sec-no">关键结论</div>`
      +no.map(x=>`<div class="note">${rich(x)}</div>`).join(''):'')
    +(p.length?`<div class="sec" id="sec-p">核心知识点</div>`
      +p.map(x=>`<div class="pt">${rich(x)}</div>`).join(''):'')
    +(t.length?`<div class="sec warn" id="sec-t">易错提醒</div>`
      +t.map(x=>`<div class="tip">${rich(x)}</div>`).join(''):'')
    +exHtml+relHtml;
  box.value=n; res.style.display='none'; side.scrollTop=0;
}

function select(i){
  if(typeof i==='string') i=NODES.indexOf(i);   // 也接受节点名，方便控制台调用
  if(!(i>=0&&i<NODES.length)) return;
  selected=i; hovered=i; paint(); focus(i); panel(NODES[i]);
  box.value=NODES[i]; res.style.display='none'; syncToc(NODES[i]);
}
function clearSel(){
  selected=-1; hovered=-1; paint(); renderHint();
  box.value=''; res.style.display='none';
  tocBody.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  flyTo(HOME,new THREE.Vector3(0,0,0),600);
}

/* ---------- 指针交互 ---------- */
const canvas=renderer.domElement;
canvas.style.cursor='grab';
let mx=0,my=0,raf=0,downX=0,downY=0;

function onMove(){
  raf=0;
  const i=pick(mx,my);
  if(i!==hovered){hovered=i;paint()}
  canvas.style.cursor=i>=0?'pointer':'grab';
}
addEventListener('pointermove',e=>{
  mx=e.clientX; my=e.clientY;
  if(!raf) raf=requestAnimationFrame(onMove);
});

canvas.addEventListener('pointerdown',e=>{
  downX=e.clientX; downY=e.clientY; anim=null;   // 用户操作随时打断相机动画
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointerup',e=>{
  canvas.style.cursor=hovered>=0?'pointer':'grab';
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;  // 是拖拽，不是点击
  const i=pick(e.clientX,e.clientY);
  if(i>=0) select(i); else clearSel();                       // 点空白取消选择
});

addEventListener('keydown',e=>{if(e.key==='Escape')clearSel()});

side.addEventListener('click',e=>{
  const a=e.target.closest('.nav a');
  if(a){                                   // 段落导航
    const el=document.getElementById(a.dataset.t);
    if(el) side.scrollTo({top:el.offsetTop-10,behavior:'smooth'});
    return;
  }
  const h=e.target.closest('.exh');
  if(h){ h.parentElement.classList.toggle('open'); return; }   // 考法卡片折叠
  const t=e.target.closest('.rel,.mmn');
  if(t&&t.dataset.n) select(t.dataset.n);
});

/* ---------- 搜索 ---------- */
box.addEventListener('input',()=>{
  const q=box.value.trim().toLowerCase();
  if(!q){res.style.display='none';return}
  const m=NODES.filter(n=>n.toLowerCase().includes(q));
  res.innerHTML=m.length?m.map(n=>`<div data-n="${n}">${n}</div>`).join('')
                        :'<div style="color:#999;cursor:default">无匹配结果</div>';

});
res.addEventListener('click',e=>{
  const t=e.target.closest('[data-n]');
  if(t) select(NODES.indexOf(t.dataset.n));

document.addEventListener('click',e=>{

/* ---------- 按钮 ---------- */
document.getElementById('btn-reset').onclick=home;
document.getElementById('btn-clear').onclick=clearSel;
const btnLabel=document.getElementById('btn-label');
btnLabel.onclick=()=>{
  showLabels=!showLabels;
  btnLabel.classList.toggle('off',!showLabels);
  paint();
};


/* ---------- 目录树 ---------- */
const tocEl=document.getElementById('toc'), tocBody=document.getElementById('toc-body');
document.getElementById('toc-n').textContent=NODES.length-1+' 个知识点';

function renderToc(){
  tocBody.innerHTML=TOC.map((m,mi)=>{
    const chs=m.ch.map((c,ci)=>{
      const has=c.i.length;
      const kids=has?`<div class="ch-b">`+c.i.map(n=>
          `<div class="it" data-n="${esc(n)}">${esc(n)}</div>`).join('')+`</div>`:'';
      return `<div class="ch" data-ch="${mi}-${ci}">
        <div class="ch-t" data-n="${esc(c.t)}">${has?'<span class="arw"></span>':''}
          <span class="tx">${esc(c.t)}</span></div>${kids}</div>`;
    }).join('');
    const cnt=m.ch.reduce((a,c)=>a+c.i.length+1,0)+(m.n?1:0);
    return `<div class="mod on" data-mod="${mi}">
      <div class="mod-t" data-n="${m.n?esc(m.n):''}">
        <span class="arw"></span><i style="background:${m.c}"></i>
        <span class="tx">${esc(m.t)}</span><b>${cnt}</b></div>
      <div class="mod-b">${chs}</div></div>`;
  }).join('');
}
renderToc();

tocBody.addEventListener('click',e=>{
  const row=e.target.closest('.mod-t,.ch-t,.it');
  if(!row) return;
  const box=row.parentElement;                       // .mod 或 .ch
  const canFold=box.classList.contains('mod')||box.classList.contains('ch');
  if(e.target.closest('.arw')){                      // 点三角只折叠，不换选中
    if(canFold) box.classList.toggle('on');
    return;
  }
  if(canFold) box.classList.add('on');               // 点标题：展开并选中
  if(row.dataset.n) select(row.dataset.n);
  // 窄屏：只有点到末级知识点（或没有子项的空章）才收起抽屉，
  // 否则展开章节的这一步会把抽屉关掉，永远进不到下一层
  const sub=box.querySelector('.mod-b,.ch-b');
  if(innerWidth<=860&&!sub) toggleToc(false);
});

function syncToc(name){
  tocBody.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  const el=tocBody.querySelector(`[data-n="${name}"]`);
  if(!el) return;
  const ch=el.closest('.ch'), mod=el.closest('.mod');
  if(ch&&el.classList.contains('it')) ch.classList.add('on');
  if(mod) mod.classList.add('on');
  el.classList.add('sel');
  if(!tocOpen) return;
  // 只滚动目录自身，避免 scrollIntoView 连带滚动页面
  const r=el.getBoundingClientRect(), b=tocBody.getBoundingClientRect();
  if(r.top<b.top+4) tocBody.scrollTop-=b.top+4-r.top;
  else if(r.bottom>b.bottom-4) tocBody.scrollTop+=r.bottom-b.bottom+4;
}

function toggleToc(on){
  tocOpen=on===undefined?!tocOpen:on;
  tocEl.classList.toggle('on',tocOpen);
  document.getElementById('btn-toc').classList.toggle('off',!tocOpen);
  document.getElementById('legend').style.display=tocOpen?'none':'';
}
document.getElementById('btn-toc').onclick=()=>toggleToc();

/* ---------- 循环 ---------- */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta();
  if(anim){
    anim.t+=dt*1000;
    const k=Math.min(anim.t/anim.dur,1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.c0,anim.c1,e);
    controls.target.lerpVectors(anim.t0,anim.t1,e);
    if(k>=1) anim=null;
  } else controls.update();
  renderer.render(scene,camera);
  layoutLabels();
  labelRenderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
  syncRect();
});

paint();
loop();
document.getElementById('loading').remove();
setTimeout(()=>{syncRect()},80);

// 调试接口：控制台可用 kg.select('电场')、kg.pick(x,y)
window.kg={pick,select,clearSel,NODES,P,project};
</script>
<script>
setTimeout(function(){
  var el=document.getElementById('loading');
  if(el) el.textContent='3D 引擎加载失败，请检查网络后刷新';
},9000);
</script>
