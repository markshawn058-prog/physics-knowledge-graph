<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高中物理知识图谱 · 3D 交互版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='4' fill='%233498DB'/><circle cx='5' cy='6' r='2.5' fill='%235DADE2'/><circle cx='19' cy='7' r='2.5' fill='%235DADE2'/><circle cx='6' cy='18' r='2.5' fill='%235DADE2'/><circle cx='18.5' cy='18' r='2.5' fill='%235DADE2'/></svg>">
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#FAFAFA;font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif}
#graph{position:fixed;inset:0;z-index:1}
#graph canvas{display:block}
.lbl{position:absolute;left:0;top:0;font-size:11px;line-height:1;color:#2C3E50;white-space:nowrap;
  text-shadow:0 0 3px #FAFAFA,0 0 3px #FAFAFA,0 0 3px #FAFAFA,0 0 3px #FAFAFA;pointer-events:none}
.card{position:fixed;z-index:10;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#title{position:fixed;z-index:10;top:22px;left:20px;font-size:17px;font-weight:700;color:#2C3E50;
  padding:0;background:none;box-shadow:none;pointer-events:none;white-space:nowrap;letter-spacing:.2px}
#toolbar{top:16px;right:16px;left:auto;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px}
#search{width:186px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:0}
#search:focus{border-color:#3498DB}
button{padding:8px 13px;border:0;border-radius:6px;background:#3498DB;color:#fff;font-size:13px;
  white-space:nowrap;cursor:pointer;transition:background .15s}
button:hover{background:#2980B9}
button.gray{background:#95A5A6}button.gray:hover{background:#7F8C8D}
button.off{background:#D5D8DC}button.off:hover{background:#BDC3C7}
#results{position:absolute;top:100%;left:14px;width:190px;margin-top:4px;background:#fff;border-radius:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);max-height:210px;overflow:auto;display:none}
#results div{padding:8px 12px;font-size:13px;cursor:pointer}
#results div:hover{background:#E3F2FD}
#sidebar{top:78px;right:20px;width:352px;max-height:78vh;overflow-y:auto;padding:18px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.nav a{padding:3px 9px;font-size:11.5px;color:#5D6D7E;background:#F1F4F8;
  border-radius:20px;cursor:pointer;transition:background .15s,color .15s}
.nav a:hover{background:#DCE6F2;color:#2C3E50}
#sidebar h3{margin:0 0 12px;padding-bottom:8px;font-size:18px;color:#2C3E50;border-bottom:3px solid #3498DB}
.sec{margin:16px 0 8px;padding-left:8px;font-size:14px;font-weight:700;color:#2C3E50;border-left:4px solid #3498DB}
.sec.p{border-left-color:#9B59B6}
.desc{padding:10px;font-size:13px;line-height:1.6;color:#555;background:#F8F9FA;border-radius:6px}
.f{margin:4px 0;padding:6px 10px;background:#FFF3E0;border-radius:4px}
.f b{display:block;font:14px "Cambria Math","Times New Roman",serif;color:#E65100}
.f i{display:block;margin-top:2px;font:11.5px/1.45 "Microsoft YaHei",sans-serif;font-style:normal;color:#A0785A}
.note{margin:5px 0;padding:7px 10px;font-size:12.5px;line-height:1.6;color:#1B4F72;background:#EAF2FB;
  border-left:3px solid #3498DB;border-radius:4px}
.tip{margin:5px 0;padding:7px 10px;font-size:12.5px;line-height:1.6;color:#922B21;background:#FDEDEC;
  border-left:3px solid #E74C3C;border-radius:4px}
.sec.warn{color:#922B21;border-left-color:#E74C3C}
.pt{position:relative;padding:4px 0 4px 16px;font-size:13px;line-height:1.5;color:#444}
.pt::before{content:"•";position:absolute;left:4px;font-weight:700;color:#3498DB}
.ex{display:inline-block;margin:3px;padding:4px 10px;font-size:12px;color:#2E7D32;background:#E8F5E9;border-radius:12px}
.sec em{margin-left:6px;font-size:11px;font-weight:400;font-style:normal;color:#9AA5B1}

/* 考法卡片（折叠） */
.exg{margin:6px 0;border:1px solid #E9EDF3;border-radius:8px;overflow:hidden;background:#fff}
.exh{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;background:#F7F9FC;
  font-size:13px;font-weight:600;color:#2C3E50;user-select:none}
.exh:hover{background:#EFF4FA}
.exn{flex:none;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;
  background:#3498DB;color:#fff;font-size:11px;font-weight:700}
.ext{flex:1;line-height:1.4}
.exarw{flex:none;width:6px;height:6px;margin-right:3px;border-right:1.6px solid #9AA5B1;
  border-bottom:1.6px solid #9AA5B1;transform:rotate(45deg);transition:transform .18s}
.exg.open .exarw{transform:rotate(-135deg)}
.exb{display:none;padding:2px 11px 11px}
.exg.open .exb{display:block}
.exf,.exk{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:#4A5568}
.exf b,.exk b{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:4px;
  font-size:11px;font-weight:600;background:#EAF2FB;color:#2471A3}
.exk b{background:#FDF2E9;color:#B9770E}
.exv{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.exv li{padding:2px 7px;border-radius:4px;background:#F2F5F9;border:1px solid #E3E8EF;
  font-size:11.5px;line-height:1.55;color:#5A6675}
.exq{margin:10px 0 0;padding:10px;background:#FAFBFD;border:1px solid #EDF0F5;border-radius:7px}
.exqt{font-size:12.5px;line-height:1.7;color:#2C3E50}
.tag{display:inline-block;margin-right:6px;padding:0 5px;border-radius:3px;background:#2C3E50;
  color:#fff;font-size:10.5px;line-height:16px;vertical-align:1px}
.exqs{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.75;color:#444}
.exqs li{margin:2px 0}
.exqa{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:#1B4F72;font-weight:600}
.exqa b{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:4px;background:#D6EAF8;
  color:#1B4F72;font-size:11px;font-weight:600}
.exsol{margin:9px 0 0;display:grid;gap:6px}
.exsol>div{padding:7px 9px;border-radius:6px;font-size:12.5px;line-height:1.65}
.exsol b{display:block;margin-bottom:2px;font-size:11px;font-weight:700}
.sc{background:#EAF7EE;color:#1E6B3A;border-left:3px solid #27AE60}
.sc b{color:#1E8449}
.sx{background:#FEF5E7;color:#8A5A0B;border-left:3px solid #E67E22}
.sx b{color:#B9770E}

/* 关联概念 */
.rel{margin:6px 0;padding:8px 10px 8px 11px;background:#F8F9FA;border-left:3px solid #9B59B6;
  border-radius:6px;cursor:pointer;transition:background .15s}
.rel:hover{background:#F1F5FA}
.relh{display:flex;align-items:center;gap:6px;font-size:13px;color:#2C3E50}
.relh b{font-weight:600}
.relt{padding:1px 6px;border-radius:9px;color:#fff;font-size:10.5px;font-weight:400}
.lv{margin-left:auto;font-size:10.5px;color:#AAB3BE}
.reld{margin-top:4px;font-size:12px;line-height:1.55;color:#5D6D7E}

/* 思维导图 */
.mmw{margin:0 0 4px}
.mm{display:block;overflow:visible}
.mm text{font-family:"Microsoft YaHei",sans-serif}
.mmr{font-size:11.5px;font-weight:700;fill:#2C3E50}
.mmb{font-size:11px;fill:#2C3E50}
.mmt{font-size:9.5px;fill:#AAB3BE}
.mmn{cursor:pointer}
.mmn:hover rect{fill:#EDF3FB;stroke:#BBD4EE}
.mml{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px;font-size:10.5px;color:#8C96A3}
.mml span{display:flex;align-items:center;gap:4px}
.mml i{width:7px;height:7px;border-radius:50%}
.hint{padding:40px 0;text-align:center;font-size:13px;color:#95A5A6}

#toc{left:20px;top:78px;bottom:20px;width:300px;display:none;flex-direction:column;padding:0;overflow:hidden}
#toc.on{display:flex}
.toc-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px;
  border-bottom:1px solid #EEF1F5;flex:none}
.toc-head span{font-size:14px;font-weight:700;color:#2C3E50}
.toc-head b{font-size:11.5px;font-weight:400;color:#9AA5B1}
.toc-body{flex:1;overflow-y:auto;padding:8px 10px 16px}
.mod{margin:0 0 1px}
.mod-t{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:700;color:#2C3E50;user-select:none}
.mod-t:hover{background:#F4F7FB}
.mod-t .arw{width:0;height:0;border-left:4.5px solid #B4BCC6;border-top:3.5px solid transparent;
  border-bottom:3.5px solid transparent;transition:transform .18s;flex:none}
.mod.on>.mod-t .arw{transform:rotate(90deg)}
.mod-t i{width:8px;height:8px;border-radius:50%;flex:none}
.mod-t .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-t b{font-size:11px;font-weight:400;color:#B4BCC6}
.mod-b{display:none;margin-left:11px;padding-left:6px;border-left:1px solid #EEF1F5}
.mod.on>.mod-b{display:block}
.ch{margin:0}
.ch-t{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:#4A5568;user-select:none}
.ch-t:hover{background:#F4F7FB;color:#2C3E50}
.ch-t .arw{width:0;height:0;border-left:4px solid #C7CED6;border-top:3px solid transparent;
  border-bottom:3px solid transparent;transition:transform .18s;flex:none}
.ch.on>.ch-t .arw{transform:rotate(90deg)}
.ch-t .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-b{display:none;margin-left:8px}
.ch.on>.ch-b{display:block}
.it{position:relative;padding:5px 8px 5px 16px;border-radius:5px;cursor:pointer;
  font-size:12px;color:#7A8694;user-select:none}
.it::before{content:"";position:absolute;left:5px;top:50%;width:3px;height:3px;border-radius:50%;
  background:#CBD3DC;transform:translateY(-50%)}
.it:hover{background:#F4F7FB;color:#2C3E50}
.it.sel{background:#EAF2FB;color:#1B4F72;font-weight:600}
.it.sel::before{background:#3498DB}
.ch-t.sel{background:#EAF2FB;color:#1B4F72;font-weight:600}
#legend{left:20px;bottom:20px;padding:12px 16px;font-size:13px}
#legend div{display:flex;align-items:center;margin:5px 0}
#legend i{width:12px;height:12px;margin-right:8px;border-radius:50%}
#tips{left:50%;bottom:20px;transform:translateX(-50%);padding:6px 14px;box-shadow:none;
  background:rgba(255,255,255,.82);font-size:12px;color:#8C96A3;white-space:nowrap;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:#95A5A6;z-index:20}
@media(max-width:860px){
  #title{display:none}
  #toolbar{right:12px;top:12px;padding:8px 10px;gap:6px}
  #search{width:104px}
  #results{left:10px;width:210px}
  button{padding:7px 9px;font-size:12px}
  #sidebar{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:42vh}
  #legend{display:none}#tips{display:none}
  #toc{left:12px;right:12px;top:66px;bottom:12px;width:auto}
}
</style>
</head>
<body>
<div id="graph"></div>
<div id="loading">正在加载 3D 引擎…</div>

<div id="title">高中物理知识图谱 · 3D 交互版</div>

<div id="toolbar" class="card">
  <input id="search" placeholder="搜索概念节点..." autocomplete="off">
  <div id="results"></div>
  <button id="btn-reset">重置视图</button>
  <button id="btn-clear" class="gray">清除选择</button>
  <button id="btn-label">标签</button>
  <button id="btn-toc" class="off">目录</button>
</div>

<div id="sidebar" class="card"><div class="hint">点击图中任意节点<br>查看详细知识点、公式和考法</div></div>

<div id="toc" class="card">
  <div class="toc-head"><span>知识架构</span><b id="toc-n"></b></div>
  <div class="toc-body" id="toc-body"></div>
</div>

<div id="legend" class="card">
  <div><i style="background:#E74C3C"></i>力学</div>
  <div><i style="background:#3498DB"></i>电磁学</div>
  <div><i style="background:#F39C12"></i>热学</div>
  <div><i style="background:#9B59B6"></i>光学</div>
  <div><i style="background:#1ABC9C"></i>近代物理</div>
  <div><i style="background:#7F8C8D"></i>思想方法</div>
</div>

<div id="tips" class="card">拖拽旋转 · 滚轮缩放 · 点击节点查看 · 点空白取消</div>

<script type="importmap">
{
  "imports": {
    "three": "https://registry.npmmirror.com/three/0.160.0/files/build/three.module.min.js",
    "three/addons/": "https://registry.npmmirror.com/three/0.160.0/files/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------- 数据 ---------- */
// 节点：颜色, 概述, 核心公式[], 核心知识点[], 常见考法[]
const INFO={"力学":["#E74C3C","力学研究宏观物体的运动规律与相互作用，主线是「描述运动 → 分析受力 → 牛顿定律 → 能量与动量」。前几章建立运动学和动力学的基础，中间用守恒定律绕开复杂的过程细节，最后把研究对象从质点扩展到振动与波。",[["F合 = ma","牛顿第二定律，动力学的核心"],["W合 = ΔEk","动能定理"],["FΔt = Δp","动量定理"],["E、p 守恒","两大守恒定律"]],["解决力学问题有两条路：牛顿定律走「力—加速度—运动」，守恒定律走「状态—状态」","受力分析是所有动力学问题的起点","碰撞、爆炸这类短过程，用动量守恒比用牛顿定律省事得多","振动与波是力学规律在周期性运动中的体现"],["运动学只描述位置随时间的变化，不追问原因","动力学用牛顿定律把力与运动联系起来","功和能给出过程的另一种描述方式","动量守恒适用于内力远大于外力的短过程","机械振动是回复力作用下的周期性运动","机械波是振动在介质中的传播"],["把运动学公式当成力学规律，跳过受力分析","不判断条件就套用守恒定律"],["运动学综合","动力学两类问题","能量与动量综合","振动与波综合"]],"运动的描述":["#E74C3C","研究物体位置随时间的变化规律，只描述「怎样动」，不追问「为什么这样动」。做法是先把实际物体抽象成质点，再用位移、速度、加速度三个矢量刻画，最后借运动学公式或图像求解。它是力学的语言基础——牛顿定律给出的正是加速度，要得到运动细节必须回到运动学。",[["v = Δx/Δt","平均速度，方向与位移同向"],["a = Δv/Δt","加速度，描述速度变化的快慢与方向"],["x = v₀t + ½at²","匀变速直线运动位移"],["v² − v₀² = 2ax","不含时间的速度位移关系"]],["匀变速直线运动中，平均速度等于中间时刻的瞬时速度","任意两个连续相等时间间隔内的位移差恒定：Δx = aT²"],["参考系的选择决定运动的描述，同一运动在不同参考系中形式不同","质点模型的条件：物体大小形状对研究问题的影响可忽略","位移是矢量（初位置指向末位置），路程是标量（轨迹长度）","速度是矢量，速率是标量；平均速度不等于平均速率","加速度方向与速度方向同向则加速，反向则减速","加速度大小与速度大小无必然联系，速度大可以加速度为零"],["加速度为负不等于减速，要看向与速度方向的关系","平均速度公式只对匀变速成立，变加速运动不能直接用","刹车类问题要先算停止时间，防止代入出现「倒着开」的荒谬解"],["概念辨析（位移与路程、速度与速率、加速度与速度）","多过程运动的分段求解","纸带与频闪照片的数据处理"]],"质点参考系":["#E74C3C","质点是为简化问题引入的理想模型：当物体的大小和形状对所研究的问题影响可以忽略时，就可以把它看成质点。参考系是描述运动时选定的标准物体，同一运动在不同参考系中的描述并不相同。",[["—","本章以概念为主，没有核心公式"]],["能否看成质点取决于研究的问题，不取决于物体本身的大小","参考系可以任意选取，但选好后全程不能更换","坐标系是参考系的数学表达"],["质点是理想化模型，忽略大小和形状","地球研究公转时可看成质点，研究自转时不能","参考系不同，同一运动的描述不同","位移、速度、加速度都具有相对性"],["认为体积小的物体一定能看成质点","描述运动时不说明参考系"],["质点模型的判断","参考系与运动的相对性","坐标系与位置变化"]],"位移速度加速度":["#E74C3C","描述运动的三个基本物理量，共同点是都是矢量，都必须交代方向。三者的关系是一条链条：位移对时间的变化率是速度，速度对时间的变化率是加速度。理清这条链条，运动学的概念题基本不会失分。",[["v = Δx/Δt","速度是位移的变化率"],["a = Δv/Δt","加速度是速度的变化率"],["Δx = x₂ − x₁","位移由初末位置决定，与路径无关"]],["三个量都是矢量，比较大小只比绝对值，说「相等」必须方向也相同","速度为零时加速度可以很大（竖直上抛最高点），加速度为零时速度可以很大（匀速飞行）"],["位移由初末位置决定，路程由轨迹决定，单向直线运动时二者大小相等","平均速度 = 位移/时间，平均速率 = 路程/时间，二者一般不等","瞬时速度是 Δt 趋于零时平均速度的极限，方向沿轨迹切线","加速度的方向是速度变化量的方向，不是速度的方向","加速减速的判据是 a 与 v 的夹角：锐角加速，钝角减速"],["「速度变化量大」不等于「加速度大」，还要看所用时间","往返运动中位移可能为零而路程不为零，此时平均速度为零而平均速率不为零","加速度方向判断错是最常见失分点，尤其在曲线运动中"],["矢量与标量的辨析","平均速度与平均速率的计算","加速度方向与加减速判断","结合图像判断运动性质"]],"匀变速直线运动":["#E74C3C","加速度大小方向都恒定的直线运动，是运动学里唯一能用初等公式完整求解的模型。自由落体、竖直上抛、刹车、斜面下滑在受力恒定时都归入此类。掌握它的标志不是背公式，而是能根据已知量快速选出最省事的那条公式。",[["v = v₀ + at","不含位移，已知时间求速度"],["x = v₀t + ½at²","不含末速度，已知时间求位移"],["v² − v₀² = 2ax","不含时间，已知位移求速度"],["x = (v₀ + v)t/2","不含加速度，平均速度乘时间"],["Δx = aT²","连续相等时间间隔的位移差"]],["五个物理量 v₀、v、a、x、t 中知三求二，选公式的原则是「缺什么避开什么」","中间时刻速度 v(t/2) = (v₀+v)/2，中间位置速度 v(x/2) = √((v₀²+v²)/2)，恒有 v(x/2) > v(t/2)","初速度为零的匀加速：连续相等时间内位移比为 1:3:5:7"],["公式全是矢量式，先规定正方向再代入符号","逐差法求加速度：a = (x₄+x₅+x₆ − x₁−x₂−x₃)/(9T²)","竖直上抛的对称性：上升与下落经过同一点速率相等，全程加速度恒为 g","多过程问题要画运动草图，标出每个阶段的 v₀、v、a、x、t","追及相遇的临界条件是速度相等时距离取极值"],["刹车问题必须先判断何时停止，停止后不能继续套公式","位移公式中的 x 是位移不是路程，往返运动要带符号","逐差法用 6 段比用 4 段精度高，因为充分利用了数据"],["追及与相遇问题（临界条件、能否追上、最远最近距离）","纸带处理与逐差法求 a","多阶段运动（先加速后匀速再减速）","竖直上抛与自由落体组合"]],"自由落体运动":["#E74C3C","自由落体是初速度为零、只受重力作用的匀加速直线运动，加速度为 g。它是匀变速直线运动在 v₀ = 0、a = g 时的特例，也是研究匀变速规律、测量重力加速度的重要载体。",[["v = gt","速度"],["h = ½gt²","下落高度"],["v² = 2gh","速度与高度"],["Δh = gT²","相邻相等时间内的高度差"]],["自由落体是 v₀ = 0、a = g 的匀加速直线运动","同一地点所有物体的自由落体加速度相同","下落快慢与质量无关，这是伽利略的重要结论"],["自由落体的条件是初速为零且只受重力","g 随纬度和高度变化","可以用自由落体测重力加速度","空气阻力不可忽略时不能按自由落体处理"],["认为重的物体下落得快","把有初速度的下落当成自由落体"],["自由落体的基本计算","测重力加速度","自由落体与竖直上抛的结合"]],"v-t图像":["#E74C3C","把速度随时间的变化画成图，是运动学的图形语言。相比公式，图像能一眼看出运动性质的变化、极值出现的位置，特别适合多过程问题和追及相遇问题。读图的关键是把「斜率、面积、截距、交点」四个几何要素翻译成物理量。",[["斜率 k = a","切线斜率表示该时刻加速度"],["面积 S = x","图线与 t 轴围成的面积表示位移，轴下为负"],["截距","纵截距为初速度，横截距为速度为零的时刻"]],["两图线交点表示该时刻速度相等，常是距离取极值的临界点","图线在 t 轴下方表示速度为负，位移为负，不是「减速」"],["匀变速运动对应倾斜直线，斜率恒定即加速度恒定","曲线 v-t 图的切线斜率表示瞬时加速度，割线斜率表示平均加速度","面积计算位移时要区分轴上轴下，代数相加而非几何相加","由 v-t 图可反推运动过程，也可由运动过程画出 v-t 图","v-t 图不表示运动轨迹，图线不是物体的实际路径"],["把 v-t 图当轨迹图是最常见的错误，图线倾斜不代表物体斜着走","求路程要用面积绝对值相加，求位移用代数和","曲线 v-t 图求某点加速度要画切线，不能用两点连线斜率"],["图像信息读取与运动性质判断","追及相遇问题用面积法求最远距离","图像转换（v-t 转 x-t、转 a-t）","非匀变速运动的定性分析"]],"相互作用":["#E74C3C","研究物体之间的相互作用力，是全部力学分析的起点。高中阶段把力分为两类：一类是接触力（弹力、摩擦力），一类是场力（重力、电场力、磁场力）。受力分析的本质是把「谁在推它」一个个找全，再用矢量运算合成。",[["G = mg","重力"],["F = kx","胡克定律，弹力"],["f = μN","滑动摩擦力"],["F = kq₁q₂/r²","库仑力，场力的一种"]],["四种基本相互作用中，高中只涉及引力与电磁力的宏观表现","受力分析顺序：重力 → 接触力（弹力、摩擦力）→ 其他场力，可有效防止漏力"],["力的三要素：大小、方向、作用点，缺一不可","力不能脱离物体存在，每个力都有施力物体","弹力产生条件：接触且发生弹性形变，二者缺一不可","摩擦力产生条件：接触、挤压、粗糙、有相对运动或趋势","合力与分力是等效替代关系，不是同时存在的两个力","共点力平衡条件：合力为零，可分解为各方向分量和为零"],["分析受力时不要把「合力」和「分力」同时画进去，那是重复计算","不要凭空添加「向心力」「下滑力」这类不存在的力，它们只是某个力的分效果","摩擦力方向与相对运动方向相反，不是与运动方向相反"],["受力分析作图","动态平衡问题（三力平衡、图解法）","摩擦力方向与大小判断","多物体系统的受力分析"]],"重力":["#E74C3C","由于地球吸引而使物体受到的力，是地面附近所有力学问题的背景力。严格说重力只是万有引力的一个分力，另一个分力提供物体随地球自转的向心力，因此在赤道略小、两极略大。",[["G = mg","m 质量，g 重力加速度，通常取 9.8 或 10 m/s²"],["g = GM/R²","忽略自转时由万有引力决定"],["Δg = g(两极) − g(赤道) ≈ 0.05 m/s²","自转导致的差异"]],["重力方向竖直向下（垂直水平面），不是指向地心（除赤道与两极）","重心是重力的等效作用点，可以在物体外（如圆环、直角尺）"],["重力的大小与物体运动状态无关，超重失重时重力不变","重心位置由质量分布和形状决定，与物体是否受力无关","g 随高度增大而减小，随纬度增大而增大","重力属于场力，不需要接触即可作用","重力做功只与高度差有关，与路径无关"],["「竖直向下」不等于「垂直向下」，前者垂直水平面，后者垂直接触面","超重失重时重力并没有变化，变的是支持力","重心不一定在物体上，悬挂法测重心利用了二力平衡"],["重心位置判断与悬挂法","重力与质量的区别","g 随高度纬度的变化","重力做功与重力势能变化"]],"弹力":["#E74C3C","发生弹性形变的物体，由于要恢复原状而对与之接触的物体产生的力。压力、支持力、拉力、弹簧弹力都是弹力的不同表现形式。判断弹力方向的核心是「恢复形变的方向」，而弹力大小除弹簧外一般由平衡条件或牛顿定律反求。",[["F = kx","胡克定律，k 劲度系数(N/m)，x 形变量而非弹簧长度"],["F = k(x − x₀)","含原长的写法，x₀ 为原长"]],["轻绳只能沿绳方向拉，不能推；轻杆既能拉也能推，方向不一定沿杆","弹簧串联 1/k = 1/k₁ + 1/k₂，并联 k = k₁ + k₂"],["弹力产生条件：直接接触 + 发生弹性形变，二者缺一不可","面面接触的弹力垂直于接触面，点面接触垂直于面，点点接触垂直于公切面","轻绳的拉力沿绳收缩方向，绳上张力处处相等（轻绳、静止或匀速）","轻杆的弹力方向由运动状态决定，需用平衡或牛顿定律求解","弹簧弹力不能突变，轻绳轻杆的弹力可以突变","胡克定律中的 x 是形变量，不是弹簧总长"],["「轻杆弹力一定沿杆」是错误命题，只有二力杆在特定条件下才沿杆","剪断绳瞬间绳的拉力立刻消失，但弹簧的弹力保持不变，这是瞬时加速度题的命题核心","弹力有无的判断用假设法：撤去接触面看物体是否改变运动状态"],["弹力方向判断","胡克定律与弹簧串并联","瞬时性问题（绳断、弹簧剪断）","含弹簧的平衡与临界问题"]],"摩擦力":["#E74C3C","两个相互接触的物体发生相对运动或有相对运动趋势时，在接触面上产生的阻碍相对运动的力。它是高中力学里唯一「大小和方向都要靠分析确定」的力，也是最容易出错的力。关键区分：静摩擦看平衡，滑动摩擦看公式。",[["f = μN","滑动摩擦力，μ 动摩擦因数，N 正压力"],["0 ≤ f ≤ f<sub>max</sub>","静摩擦力大小由平衡条件决定，最大静摩擦略大于滑动摩擦"],["f<sub>max</sub> ≈ μN","计算时通常近似取等"]],["摩擦力方向与「相对运动（趋势）」方向相反，与绝对运动方向可能同向","摩擦力可以是动力（传送带带动物体、人走路），也可以是阻力"],["产生条件：接触、挤压、接触面粗糙、有相对运动或相对运动趋势","滑动摩擦力大小只与 μ 和 N 有关，与接触面积、相对速度无关","静摩擦力大小随外力变化，用平衡条件或牛顿第二定律反求","最大静摩擦力对应「恰好要滑动」的临界状态","摩擦力方向沿接触面切线，与正压力垂直","传送带问题中，共速前是滑动摩擦，共速后要看能否一起运动"],["静摩擦力不能用 f = μN 计算，那是最大值而非实际值","N 不一定等于 mg，斜面上 N = mg·cosθ，有竖直加速度时 N ≠ mg","判断摩擦力方向先定「相对」二字，参照物是接触面而非地面"],["摩擦力方向与大小判断","传送带模型（水平、倾斜、多段）","板块模型（相对滑动与共速）","临界问题（恰好不滑动的 μ 最小值）"]],"力的合成分解":["#E74C3C","力是矢量，多个力对物体的作用效果可以用一个合力等效替代，这叫合成；反过来一个力也可以分解成几个分力，叫分解。两者都遵循平行四边形定则。分解的价值在于「把力放到便于列方程的方向上」，正交分解是解题最常用的手段。",[["F = √(F₁² + F₂² + 2F₁F₂cosθ)","平行四边形定则的余弦形式"],["|F₁ − F₂| ≤ F ≤ F₁ + F₂","合力范围"],["Fₓ = F·cosθ, F<sub>y</sub> = F·sinθ","正交分解"]],["两个等大的力夹角 120° 时，合力大小等于分力大小","三力平衡时，任意两力的合力与第三力等大反向"],["合力与分力是等效替代关系，不能同时计入受力分析","平行四边形定则与三角形定则等价，多力合成可首尾相接","合力可以大于、等于或小于任一分力","正交分解的原则：让尽量多的力落在坐标轴上","按效果分解的典型场景：斜面上重力分解为下滑分力与压紧分力","动态平衡中三力构成闭合三角形，可用图解法判断变化趋势"],["合力不一定大于分力，夹角大于 120° 时合力可能小于每个分力","正交分解后忘记把加速度也分解，是动力学题的常见错误","分解力时凭空造出「下滑力」这种不存在的力，实际是重力的分力"],["三力平衡与图解法","动态平衡（一力恒定、一力方向恒定）","正交分解列方程","力的合成范围与极值"]],"共点力的平衡":["#E74C3C","物体在几个力作用下处于静止或匀速直线运动状态，称为平衡。共点力平衡的条件是合力为零，处理方法有正交分解、矢量三角形、相似三角形等。三力平衡时，任意两个力的合力与第三个力等大反向。",[["ΣF = 0","平衡条件"],["Fx合 = 0，Fy合 = 0","正交分解形式"],["F₁/sinθ₁ = F₂/sinθ₂","正弦定理（三力平衡）"]],["平衡状态包括静止和匀速直线运动两种","三力平衡时三个力必共点，且能构成闭合三角形","动态平衡用矢量三角形判断各力如何变化","四个力以上优先正交分解"],["平衡的两种状态：静止、匀速直线运动","三力平衡的矢量三角形法","相似三角形法处理力与几何边的对应","动态平衡中「一力恒定、一力方向不变」的判断","平衡问题里整体法与隔离法的选择"],["把「速度为零」直接等同于「处于平衡」","动态平衡中忘记某个力的大小也在变"],["三力平衡的图解","动态平衡分析","多力平衡与正交分解"]],"运动和力的关系":["#E74C3C","经典力学的核心，由三条定律组成：惯性定律说明力不是维持运动的原因而是改变运动状态的原因；第二定律给出力与加速度的定量关系；第三定律说明作用力与反作用力的关系。三者共同把「受力」与「运动」连接起来，是动力学的总纲。",[["F_合 = ma","牛顿第二定律，瞬时对应"],["F<sub>AB</sub> = −F<sub>BA</sub>","牛顿第三定律，等大反向共线、作用在不同物体上"],["∑F = 0 ⟺ 静止或匀速","第一定律的平衡表述"]],["三定律的适用范围：惯性参考系、宏观低速物体","第二定律的瞬时性：力变则 a 立刻变，但速度不能突变"],["惯性是物体的固有属性，只与质量有关，与速度、受力无关","质量是惯性大小的量度，质量越大运动状态越难改变","牛顿第二定律是矢量式，可分解为 Fₓ = maₓ、F<sub>y</sub> = ma<sub>y</sub>","作用力与反作用力「同时产生、同时消失」，不能求合力","作用力与反作用力作用在两个物体上，平衡力作用在同一物体上","第一定律不是第二定律的特例，它定义了惯性参考系"],["「物体运动需要力来维持」是亚里士多德的错误观点，惯性才是维持运动的原因","作用力反作用力与平衡力最容易被混淆，判据是「是否作用在同一物体上」","牛顿定律只在惯性系成立，非惯性系中需引入惯性力（超纲但可定性理解）"],["惯性概念辨析","作用力反作用力与平衡力的区分","第二定律的矢量性与瞬时性","定律适用范围判断"]],"牛顿第一定律":["#E74C3C","一切物体总保持匀速直线运动状态或静止状态，直到有外力迫使它改变这种状态。它揭示了力不是维持运动的原因，而是改变运动状态的原因，同时定义了惯性这一概念。",[["ΣF = 0 ⟺ a = 0","合力为零则运动状态不变"]],["力是改变运动状态的原因，不是维持运动的原因","惯性是物体的固有属性，只与质量有关","牛顿第一定律描述的是理想情况，无法直接由实验验证"],["惯性的唯一量度是质量","质量越大惯性越大，与速度无关","牛顿第一定律定性地给出了力的作用效果","惯性不是力，不能说「受到惯性作用」"],["认为物体运动需要力来维持","把惯性当成一种力"],["惯性与质量的关系","力与运动关系的辨析","牛顿第一定律的理解"]],"牛顿第二定律":["#E74C3C","F_合 = ma，把物体所受合外力与加速度定量联系起来的核心方程。它的三个性质决定了解题套路：矢量性要求规定正方向或正交分解，瞬时性要求分清「绳断瞬间」与「弹簧剪断瞬间」，独立性允许各方向分别列式。",[["F_合 = ma","合力与加速度同向，大小成正比"],["Fₓ = maₓ，F<sub>y</sub> = ma<sub>y</sub>","正交分解形式"],["a = Δv/Δt","加速度定义，与第二定律联立可求速度变化"]],["加速度是联系受力与运动的桥梁，解题时先求 a 再回到运动学","系统整体列式：F_外 = Σm·a，适用于各物体加速度相同的连接体"],["同体性：F、m、a 必须对应同一研究对象","瞬时性：合力突变的瞬间加速度突变，但速度不能突变","矢量性：加速度方向永远与合力方向一致","独立性：某一方向的合力只产生该方向的加速度","相对性：只在惯性参考系中成立","解题步骤：选对象 → 受力分析 → 定正方向 → 列方程 → 解出 a → 回到运动学"],["忘记「合力」二字，把某个分力当成合力代入","斜面上分解加速度时方向搞反，导致方程符号错","系统问题中把内力写进合力，或把不同加速度的物体硬套整体式"],["已知受力求运动","已知运动求受力","瞬时加速度问题（绳、弹簧突变）","多过程动力学综合"]],"牛顿第三定律":["#E74C3C","两个物体之间的作用力和反作用力总是大小相等、方向相反、作用在同一条直线上。它们分别作用在两个不同物体上，同时产生、同时变化、同时消失，且性质相同。",[["F₁₂ = −F₂₁","作用力与反作用力"]],["作用力与反作用力作用在两个不同物体上，不能相互抵消","两者同时产生、同时变化、同时消失","作用力与反作用力性质相同，平衡力性质可以不同"],["作用力与反作用力的「三同三不同」","与平衡力的区别：同体与异体","作用力反作用力与物体的运动状态无关","性质相同：弹力对弹力、摩擦力对摩擦力"],["把作用力与反作用力当成平衡力","认为先有作用力后有反作用力"],["作用力与反作用力的辨析","与平衡力的区别","牛顿第三定律的应用"]],"连接体问题":["#E74C3C","两个或多个物体通过绳、杆、接触面连接，一起运动或存在相对运动的问题。核心难点是「选谁作为研究对象」：求系统外力用整体法，求内部相互作用用隔离法，两者交替使用是最经济的路径。",[["F_外 = (m₁+m₂+…)a","整体法，要求各物体加速度相同"],["F_内 = m·a","隔离法，对其中一个物体列式"],["a = F/(m₁+m₂)","光滑水平面上推两物块"]],["加速度相同的连接体可整体处理，加速度不同的要用「系统牛顿第二定律」ΣF_外 = Σmᵢaᵢ","轻绳连接的物体沿绳方向加速度大小相等，轻杆连接的还需考虑转动"],["整体法优点：不涉及内力，方程少；缺点：求不出内力","隔离法优点：能求内力；缺点：方程多，易漏力","常规套路：先整体求 a，再隔离求内力","绳连接：沿绳方向加速度相等，绳张力是内力","接触连接：垂直接触面方向加速度相等，可能存在相对滑动","传送带、板块问题要先判断能否一起运动（比较所需摩擦与最大静摩擦）"],["整体法不能用于加速度不同的系统（除非用 Σma 形式）","隔离时漏掉绳的拉力或接触面的摩擦力","板块问题直接假设一起运动，没有验证所需静摩擦是否超过最大值"],["绳连接体的加速度与张力","板块模型（相对滑动、共速、相对位移）","传送带上的多阶段运动","斜面上的连接体"]],"超重失重":["#E74C3C","物体对支持物的压力（或对悬挂物的拉力）大于或小于自身重力的现象。本质是竖直方向存在加速度：加速度向上则超重，向下则失重，完全失重对应 a = g。要注意重力本身从未改变，变的只是「视重」。",[["N = m(g + a)","加速度向上，超重"],["N = m(g − a)","加速度向下，失重"],["N = 0","a = g 时完全失重"],["N − mg = ma","通式，规定向上为正"]],["超重失重只取决于加速度方向，与速度方向无关","完全失重时一切与重力有关的现象消失：天平失效、水不流出、浮力为零"],["判断依据：看加速度方向，向上超重、向下失重","加速上升与减速下降都是超重，减速上升与加速下降都是失重","完全失重时物体对支持物压力为零，但重力仍存在","卫星中的完全失重：万有引力全部提供向心力","电梯问题中先判断 a 的方向，再用牛顿第二定律求 N","体重计读数反映的是支持力，不是重力"],["把「超重」理解为重力变大是最典型的错误，重力始终是 mg","认为「上升就超重、下降就失重」，忽略了减速阶段的加速度方向","完全失重时误以为物体不受重力"],["电梯中的视重计算","完全失重现象判断（天平、水银气压计、浮力）","卫星中的失重与实验","结合 v-t 图判断超失重状态"]],"抛体运动":["#E74C3C","轨迹是曲线的运动。与直线运动最本质的区别在于速度方向时刻在变，因此一定有加速度，且合力必指向轨迹的凹侧。处理曲线运动的基本思想是「化曲为直」——把运动分解成两个方向的直线运动，分解的依据通常是力的方向或运动的独立性。",[["v 方向沿轨迹切线","速度是矢量，方向随时间改变"],["F_合 指向轨迹凹侧","合力方向判据"],["x = v₀t，y = ½at²","分解为两个方向后分别用直线运动规律"]],["合力与速度不共线是曲线运动的充要条件","合力方向与速度方向的夹角决定速率变化：锐角加速，钝角减速，直角速率不变"],["曲线运动一定是变速运动，但变速运动不一定是曲线运动","速度方向沿轨迹切线，指向运动方向","合力指向轨迹凹侧，这是判断受力方向的快速方法","运动的独立性：两个分运动互不影响，可分别处理","运动的等时性：分运动与合运动经历相同时间","平抛、类平抛、圆周是三类最基本的曲线运动模型"],["认为「曲线运动加速度一定变化」——平抛就是匀变速曲线运动，加速度恒定","合力方向画到轨迹凸侧，与凹侧判据相反","分解运动时两个方向选得不合理，导致无法求解（应优先沿力和垂直力的方向分解）"],["曲线运动的条件与轨迹判断","运动的合成与分解（小船渡河、绳杆关联速度）","类平抛运动的识别与求解","合力方向与速率变化的关系"]],"曲线运动与运动的合成":["#E74C3C","当物体所受合外力的方向与速度方向不在同一直线上时，物体做曲线运动，轨迹总是弯向合力的一侧。曲线运动可以分解为两个方向的分运动，合成与分解遵循平行四边形定则。",[["v = √(vx² + vy²)","合速度"],["F合 与 v 不共线","做曲线运动的条件"]],["曲线运动的轨迹一定弯向合力所指的一侧","速度方向沿轨迹的切线方向","合运动与分运动具有等时性和独立性","两个匀速直线运动的合运动仍是匀速直线运动"],["曲线运动的速度方向沿切线","做曲线运动的条件是合力与速度不共线","运动的合成与分解遵循平行四边形定则","小船渡河的最短时间与最短位移","绳拉船、杆靠墙这类速度分解问题"],["把曲线运动的合力方向当成速度方向","渡河问题中把船速与水速直接相加"],["曲线运动的轨迹判断","小船渡河问题","速度的分解"]],"平抛运动":["#E74C3C","物体以水平初速度抛出、只受重力的运动，是匀变速曲线运动的典型。水平方向匀速、竖直方向自由落体，两个分运动互不影响。它是「化曲为直」思想最直接的应用，也是电场偏转、类平抛问题的原型。",[["x = v₀t","水平方向匀速"],["y = ½gt²","竖直方向自由落体"],["v<sub>y</sub> = gt","竖直分速度"],["tanθ = v<sub>y</sub>/v₀ = gt/v₀","速度偏角，θ 为速度与水平方向夹角"],["tanα = y/x = gt/(2v₀)","位移偏角，恒有 tanθ = 2tanα"],["t = √(2h/g)","落地时间只由高度决定"]],["速度偏角的正切是位移偏角正切的两倍，这是平抛最常用的二级结论","速度的反向延长线交于水平位移的中点","落地时间只与高度有关，与初速度无关"],["水平方向不受力，做匀速直线运动","竖直方向初速度为零，做自由落体","两个分运动共用同一个时间 t，这是列式的桥梁","任意时刻速度方向与水平方向夹角的正切随时间线性增大","相同时间间隔内竖直位移差恒定，Δy = gT²","斜面上的平抛：落到斜面时位移偏角等于斜面倾角"],["把「速度偏角」与「位移偏角」混用，二者正切差两倍","认为初速度越大落地越慢——落地时间与初速度无关","斜抛问题直接套平抛公式，忽略了竖直方向有初速度"],["平抛基本规律与时间计算","斜面平抛（落在斜面上、垂直打在斜面上）","平抛与圆周、碰撞的组合","类平抛（电场偏转、光滑曲面）"]],"圆周运动的规律":["#E74C3C","圆周运动是曲线运动中最基本的一种。描述它需要线速度、角速度、周期、转速四个量，它们由 v = ωr 串起来。向心加速度指向圆心，向心力是效果力，由具体的性质力提供。竖直面内的临界问题是本章的难点。",[["v = ωr = 2πr/T","线速度与角速度"],["a = v²/r = ω²r","向心加速度"],["F = mv²/r","向心力"],["T = 2πr/v","周期"]],["向心力是效果力，受力分析时不能再单独计入","同轴转动角速度相同，皮带传动线速度相同","竖直面内绳模型最高点最小速度 √(gr)，杆模型可以为零","向心加速度只改变速度方向，不改变大小"],["线速度、角速度、周期、转速的换算","向心力的来源分析是解题关键","水平面内圆周的临界由静摩擦或绳张力提供","竖直面内的临界分绳模型与杆模型","离心运动是提供的向心力不足"],["把向心力当成物体额外受到的第四个力","认为匀速圆周运动是匀变速运动"],["圆周运动的描述","向心力的来源","竖直面内的临界","圆周与平抛结合"]],"圆周运动":["#E74C3C","轨迹为圆的运动，分为匀速圆周与变速圆周。描述它的物理量比其他运动多：线速度、角速度、周期、频率、转速，彼此由半径联系。动力学上的核心是「向心力不是新的力」，而是合力沿半径方向的分量。",[["v = ωr = 2πr/T","线速度与角速度、周期的关系"],["a<sub>n</sub> = v²/r = ω²r = 4π²r/T²","向心加速度"],["F<sub>n</sub> = mv²/r = mω²r","向心力"],["ω = 2πn","n 为转速（转/秒）"]],["同轴转动角速度相同，皮带（齿轮）传动边缘线速度相同","向心力是效果力，由重力、弹力、摩擦力、场力等提供，受力分析时不能单独画出"],["匀速圆周运动速度大小不变、方向时刻改变，是变速运动","向心加速度只改变速度方向，不改变速度大小","向心力始终指向圆心，与速度垂直，不做功","变速圆周运动中合力不指向圆心，需分解为切向与法向","传动装置：同轴 ω 相同，皮带边缘 v 相同","竖直平面内的圆周运动分「绳模型」与「杆模型」，临界条件不同"],["受力分析时把「向心力」当成一个独立的力画进去，导致多力","认为匀速圆周运动是匀速运动（速度方向在变）","竖直圆周运动中最高点临界速度：绳模型 v = √(gr)，杆模型 v = 0"],["传动装置的 v、ω 关系","水平面内的圆周（圆锥摆、转弯、转盘）","竖直平面圆周的临界问题","向心力来源分析"]],"向心加速度":["#E74C3C","描述速度方向变化快慢的物理量，方向始终指向圆心。它不改变速度大小，只改变方向，因此向心力永远不做功。理解这一点是区分「匀速圆周」与「变速圆周」的关键。",[["a<sub>n</sub> = v²/r","线速度形式"],["a<sub>n</sub> = ω²r","角速度形式"],["a<sub>n</sub> = 4π²r/T²","周期形式"],["a<sub>n</sub> = vω","混合形式"]],["向心加速度只反映方向变化率，切向加速度才反映大小变化率","匀速圆周运动中 a 大小恒定、方向时刻改变，是变加速运动"],["方向始终指向圆心，与速度垂直","大小与速度平方成正比，与半径成反比（v 一定时）","同一轮子上各点 ω 相同，a<sub>n</sub> ∝ r，越靠边缘加速度越大","皮带传动边缘各点 v 相同，a<sub>n</sub> ∝ 1/r，半径大的加速度小","变速圆周运动中，加速度是向心加速度与切向加速度的矢量和","向心加速度由合力沿半径方向的分量提供"],["把向心加速度当成总加速度，忽略变速圆周中的切向分量","认为 a<sub>n</sub> 与 r 成正比或成反比时不看前提（v 一定还是 ω 一定）","混淆 a<sub>n</sub> = v²/r 中 v 是线速度而非角速度"],["向心加速度大小的比较","传动装置中 a 的比较","变速圆周运动的加速度分解","向心力来源与 a<sub>n</sub> 的对应"]],"向心力":["#E74C3C","做圆周运动的物体受到的指向圆心的合力叫向心力，它是效果力，由具体的性质力（重力、弹力、摩擦力、绳的拉力等）提供。向心力只改变速度的方向，不改变速度的大小。",[["F = mv²/r = mω²r","向心力"],["F = m·4π²r/T²","用周期表示"]],["向心力是效果力，受力分析时不能重复计入","向心力由沿半径方向的合力提供","匀速圆周运动的向心力大小不变、方向时刻改变","变速圆周运动的合力不指向圆心"],["向心力的来源分析是解题的第一步","水平面内圆周：静摩擦、绳张力、支持力的分量","竖直面内圆周：重力与弹力的合力提供向心力","圆锥摆的向心力由拉力与重力的合力提供","离心运动是提供的向心力不足"],["把向心力当成物体额外受到的力","竖直圆周中漏掉重力沿半径方向的分量"],["向心力的来源分析","圆锥摆与转弯问题","竖直面内的临界"]],"生活中的圆周运动":["#E74C3C","火车转弯、汽车过拱桥与凹桥、离心机、洗衣机脱水都是圆周运动的应用。分析的关键是找准圆心、明确向心力由谁提供，再结合临界条件判断。",[["mg·tanθ = mv²/r","火车转弯（外轨高于内轨）"],["mg − N = mv²/r","拱形桥最高点"],["N − mg = mv²/r","凹形桥最低点"]],["火车转弯的最佳状态是重力与支持力的合力提供向心力，轮缘不受侧向挤压","拱桥最高点压力小于重力，凹桥最低点压力大于重力","离心运动的条件是提供的向心力小于所需的向心力"],["火车转弯的内外轨高度差","汽车过拱桥的最大安全速度","凹形桥最低点的超重现象","离心机与洗衣机的脱水原理","航天器中的完全失重"],["拱桥问题中把支持力当成等于重力","把离心运动说成受到「离心力」"],["火车转弯","拱桥与凹桥","离心运动"]],"万有引力与航天":["#E74C3C","任何两个有质量的物体之间都存在相互吸引的力，大小与质量乘积成正比、与距离平方成反比。它把天上与地上的运动统一起来：行星绕日、卫星绕地、苹果落地遵循同一条规律，这是物理学史上第一次大统一。",[["F = Gm₁m₂/r²","G = 6.67×10⁻¹¹ N·m²/kg²，r 为质心间距"],["GM = gR²","黄金代换，忽略自转时成立"],["mg = GMm/R²","地面附近重力近似等于万有引力"]],["黄金代换 GM = gR² 是解决天体问题的万能钥匙，可避免直接使用 G","r 是两球心间距离，不是表面距离，也不是高度"],["万有引力定律适用于质点，均匀球体可视为质量集中于球心","引力常量 G 由卡文迪什用扭秤测得，被称为「称量地球质量的人」","天体质量的计算：由环绕体的轨道半径与周期反求中心天体质量","重力是万有引力的一个分力，另一分力提供随地球自转的向心力","两物体间的万有引力是一对作用力与反作用力，与质量大小无关地等大","卫星的轨道平面必须过地心"],["把 r 当成高度 h，导致 (R+h)² 写成 h²","认为万有引力与距离平方成反比只对天体成立（宏观物体同样成立，只是太小测不出）","计算中心天体质量时把环绕体质量也算进去"],["天体质量与密度的估算","黄金代换的应用","双星系统","重力加速度随高度、纬度的变化"]],"开普勒三定律":["#E74C3C","开普勒根据天文观测总结出行星运动的三条规律：轨道定律、面积定律、周期定律。它们为牛顿发现万有引力定律提供了基础，其中周期定律常用于比较不同轨道的运动。",[["a³/T² = k","周期定律，k 只与中心天体有关"],["S/t = 常量","面积定律"]],["所有行星的轨道都是椭圆，太阳在其中一个焦点上","离太阳越近速度越大，越远速度越小","周期定律中的 k 只由中心天体决定"],["轨道定律：椭圆轨道、太阳在焦点","面积定律：近日点快、远日点慢","周期定律：a³/T² = k","k 与中心天体质量有关，与行星无关","开普勒定律同样适用于卫星绕地球的运动"],["把椭圆轨道直接当成圆轨道处理","认为 k 与行星本身有关"],["周期定律的比较","近日点与远日点的速度","椭圆轨道的定性分析"]],"万有引力定律":["#E74C3C","开普勒三定律的动力学解释。定律本身给出力的表达式，真正解题时更常用的是它的两种用法：一是「万有引力提供向心力」处理环绕问题，二是「黄金代换」处理表面重力问题。",[["GMm/r² = mv²/r = mω²r = m(4π²/T²)r","环绕问题的通式"],["GM = gR²","黄金代换"],["ρ = 3π/(GT²)","近地卫星法测中心天体密度"],["ρ = 3πr³/(GT²R³)","已知轨道半径与天体半径时"]],["「万有引力提供向心力」只适用于「只受引力」的环绕体，地表物体不适用","由 GMm/r² = m(4π²/T²)r 得 T² ∝ r³，即开普勒第三定律"],["环绕天体做匀速圆周运动时，引力全部提供向心力","轨道半径越大，线速度越小、角速度越小、周期越大、向心加速度越小","第一宇宙速度是最小发射速度、最大环绕速度","同步卫星的五个「一定」：周期一定、高度一定、速率一定、轨道平面一定、方向一定","双星系统角速度相同，轨道半径与质量成反比","变轨时速度突变，但同一点加速度由该点引力决定、与轨道无关"],["把「地表物体随地球自转」当成环绕运动处理，这是概念性错误","认为轨道越高速度越大，实际是越小","双星问题中把两星间距当成各自轨道半径"],["卫星参量比较（v、ω、T、a）","同步卫星与近地卫星对比","双星与多星系统","天体质量密度的估算"]],"万有引力理论的成就":["#E74C3C","万有引力定律不仅能解释天体运动，还能用来「称量」天体质量、预测未知天体。两条思路：用环绕天体的轨道半径与周期求中心天体质量，或用表面重力加速度与半径求质量。",[["GMm/r² = m·4π²r/T² → M = 4π²r³/(GT²)","环绕法求中心天体质量"],["GM = gR²","黄金代换"],["ρ = 3πr³/(GT²R³)","求平均密度"]],["只能求中心天体的质量，求不出环绕天体自己的质量","近地卫星的密度表达式为 ρ = 3π/(GT²)","海王星被称为「笔尖下发现的行星」"],["两条求质量的思路：环绕法、表面重力法","黄金代换 GM = gR² 的使用条件","只能求中心天体质量","密度计算中要区分轨道半径 r 与天体半径 R"],["用环绕天体的数据去求环绕天体自己的质量","把轨道半径 r 与天体半径 R 混用"],["天体质量与密度的估算","黄金代换的应用","双星系统的质量"]],"宇宙速度":["#E74C3C","从地面发射航天器所需的最小速度。第一宇宙速度是环绕速度，第二是逃逸速度，第三是飞出太阳系的速度。三个速度对应三种「束缚状态」的解除，本质是能量条件。",[["v₁ = √(gR) = √(GM/R) ≈ 7.9 km/s","第一宇宙速度，近地环绕"],["v₂ = √2·v₁ ≈ 11.2 km/s","第二宇宙速度，脱离地球"],["v₃ ≈ 16.7 km/s","第三宇宙速度，脱离太阳系"]],["第一宇宙速度既是最大环绕速度，也是最小发射速度","由 v = √(GM/r) 可知 r 越小 v 越大，故近地轨道速度最大"],["第一宇宙速度的推导：重力提供向心力 mg = mv²/R","发射速度介于 v₁ 与 v₂ 之间，轨道为椭圆","发射速度等于 v₂ 时，轨道为抛物线，恰好脱离地球","环绕速度随轨道半径增大而减小，但发射速度随目标轨道升高而增大","卫星的发射速度与环绕速度不是同一个概念","同步卫星的环绕速度小于第一宇宙速度"],["混淆「发射速度」与「环绕速度」，前者随轨道升高而增大，后者相反","认为第一宇宙速度是卫星在任意轨道的速度上限（应是近地轨道的环绕速度）","用 v = √(gR) 计算高空卫星速度（应用 v = √(GM/r)）"],["三个宇宙速度的数值与意义","发射速度与轨道形状的对应","第一宇宙速度的推导","卫星速度与轨道半径的关系"]],"卫星变轨":["#E74C3C","卫星从一条轨道转移到另一条轨道的过程，本质是通过点火改变速度，从而改变所需的向心力与引力供给的匹配关系。理解变轨的关键是一句话：速度突变导致「供需失衡」，卫星因此做离心或向心运动。",[["GMm/r² = mv²/r","供需平衡时做圆周运动"],["GMm/r² > mv²/r","引力过剩，做向心运动（轨道降低）"],["GMm/r² < mv²/r","引力不足，做离心运动（轨道升高）"]],["同一点上，无论在哪条轨道，加速度都由该点引力决定，完全相同","低轨到高轨需两次加速：先在近地点加速进入椭圆，再在远地点加速进入圆轨道"],["加速 → 所需向心力增大 → 引力不足 → 离心 → 轨道升高","减速 → 所需向心力减小 → 引力过剩 → 向心 → 轨道降低","椭圆轨道上，近地点速度最大、远地点速度最小","变轨过程机械能改变（点火做功），同一点不同轨道机械能不同","同一轨道上卫星机械能守恒","对接问题：低轨追赶高轨需先减速降低轨道再加速抬升"],["认为变轨后同一点加速度变了（加速度只由位置决定）","把「加速升轨」与「加速后速度变大」混淆——升到高轨后环绕速度反而更小","忽略变轨过程机械能不守恒"],["变轨过程中的速度、加速度、能量变化","椭圆轨道近远地点参量比较","飞船对接与轨道维持","第一宇宙速度与变轨的结合"]],"机械能守恒定律":["#E74C3C","功是能量转化的量度。动能定理把合力做的功与动能变化联系起来，对变力、曲线运动同样成立；机械能守恒定律则适用于只有重力、弹力做功的系统。这一章把「力—位移—能量」串成一条线，是处理复杂过程的首选工具。",[["W = Fx cosθ","恒力做功"],["P = W/t = Fv cosθ","平均功率与瞬时功率"],["W合 = ΔEk","动能定理"],["Ek1 + Ep1 = Ek2 + Ep2","机械能守恒"]],["功是能量转化的量度，做多少功就有多少能量转化","动能定理只涉及初末状态，不涉及时间，对变力和曲线运动都成立","机械能守恒的条件是只有重力或弹力做功","除重力、弹力之外的力做功，等于机械能的变化量"],["功的正负由力与位移的夹角决定，夹角大于 90° 做负功","功率有平均功率和瞬时功率两种，P = Fv 求瞬时值","重力势能具有相对性，大小与零势能面的选取有关","动能定理不关心过程细节，只关心初末动能与总功","机械能守恒要先判断条件，再选取零势能面列式"],["把「合外力做的功」与「某个力做的功」混为一谈","忽略摩擦力做功，误用机械能守恒","重力势能的正负随手写，没有明确零势能面"],["功和功率的计算","动能定理的应用","机械能守恒的判断","功能关系与图像"]],"功和功率":["#E74C3C","功是力在位移方向上的累积，是能量转化的量度。功率描述做功的快慢，有平均功率和瞬时功率之分。机车启动问题把功率、牵引力、速度三者联系起来，是常见综合题。",[["W = Fx cosθ","恒力做功"],["P = W/t","平均功率"],["P = Fv cosθ","瞬时功率"],["P额 = f·vm","最大速度"]],["功是标量，正负表示能量的转移方向","夹角小于 90° 做正功，大于 90° 做负功","恒定功率启动时牵引力与速度成反比","最大速度出现在牵引力等于阻力时"],["功的正负判断：看力与位移的夹角","总功等于各力做功的代数和","平均功率与瞬时功率的区别","恒定功率启动：加速度减小的加速运动","恒定牵引力启动：先匀加速、后变加速、最后匀速"],["用 W = Fx 直接计算变力做功","把平均功率当成瞬时功率"],["功的正负与计算","功率的计算","机车启动问题"]],"动能定理":["#E74C3C","合外力对物体做的功等于物体动能的变化。它把「力在空间上的累积效果」与「动能变化」直接联系起来，最大的优势是不涉及时间和加速度，特别适合处理变力做功、多过程、曲线运动的问题。",[["W_合 = ΔE<sub>k</sub> = ½mv² − ½mv₀²","动能定理"],["W = Fx·cosθ","恒力做功"],["W<sub>f</sub> = −fx","滑动摩擦力做功"],["W = Pt","恒定功率做功"]],["动能定理对变力、曲线运动同样成立，这是它比牛顿定律更通用的原因","功是标量，但有正负：正功动能增加，负功动能减少"],["动能定理适用于任何力、任何运动，不需分解方向","求变力做功的常用方法：动能定理、图像面积、平均力、功率乘时间","摩擦力做功与路径有关，往复运动要按路程算","多过程问题可全程列式，不必分段","动能是标量，动能变化只看初末速率，与方向无关","合外力做功为零则动能不变，但动量可能变化"],["把位移当成路程，导致摩擦力做功算错","忘记重力做功、弹力做功，只算拉力做功","对变力直接用 W = Fx，应改用动能定理或图像法"],["变力做功的计算","多过程全程列式","曲线运动中的动能定理","与动量守恒联立的综合题"]],"重力势能与弹性势能":["#E74C3C","重力势能由物体与地球的相对位置决定，具有相对性，大小与零势能面的选取有关，但势能的变化量与零势能面无关。弹性势能与弹簧的形变量有关。",[["Ep = mgh","重力势能"],["W重 = −ΔEp","重力做功与势能变化"],["Ep = ½kx²","弹性势能"]],["重力做功与路径无关，只与初末位置的高度差有关","重力做正功，重力势能减少","势能是系统共有的，属于物体与地球（或弹簧）组成的系统"],["重力势能的相对性与零势能面", v","动量"],["I = FΔt","冲量"],["I = Δp","动量定理"],["Ek = p²/(2m)","动能与动量的关系"]],["动量是状态量，冲量是过程量","动量变化的方向与冲量方向相同","动量是矢量，比较时要考虑方向","动能与动量的关系 Ek = p²/(2m) 在碰撞问题中很常用"],["动量的矢量性","冲量是力对时间的累积","动量与动能的区别与联系","动量变化量的计算要注意方向","Ek = p²/(2m) 的应用"],["把动量当成标量直接相加","认为动量大的物体动能一定大"],["动量的矢量计算","冲量的计算","动量与动能的关系"]],"动量定理":["#E74C3C","物体所受合外力的冲量等于动量的变化量。它把力、时间与速度变化联系起来，特别适合处理碰撞、缓冲、连续作用等时间短、力变化剧烈的问题。",[["F合·t = mv₂ − mv₁","动量定理"],["F = Δp/t","求平均作用力"]],["动量定理是矢量式，使用前必须规定正方向","求平均作用力时用 F = Δp/t","缓冲的原理是延长作用时间以减小作用力","动量定理对变力也成立，此时 F 取平均值"],["动量定理的矢量性","用动量定理求平均作用力","缓冲与安全气囊的原理","连续作用问题取一段时间内的质量元","动量定理与牛顿第二定律等价"],["忘记规定正方向导致符号错误","把某个力的冲量当成合外力的冲量"],["动量定理求平均力","缓冲现象分析","连续介质的作用力"]],"动量守恒":["#E74C3C","系统不受外力或合外力为零时，系统总动量保持不变。它是矢量式，可以分方向使用。相比机械能守恒，动量守恒的适用范围更广——碰撞、爆炸这类机械能不守恒的过程，动量依然守恒。",[["m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′","两体碰撞的守恒式"],["Δp₁ = −Δp₂","两物体动量变化等大反向"],["m₁v₁ₓ + m₂v₂ₓ = m₁v₁ₓ′ + m₂v₂ₓ′","分方向守恒"]],["守恒条件可放宽：内力远大于外力时（碰撞、爆炸）近似守恒","某方向合外力为零，该方向动量守恒，其他方向不一定"],["动量是矢量，列式前必须规定正方向","碰撞、爆炸、反冲是动量守恒的典型场景","人船模型：系统初动量为零，位移与质量成反比","弹簧连接的两物体：动量守恒 + 弹性势能最大时共速","动量守恒与机械能守恒的适用条件不同，不能混用","反冲运动中，火箭速度由动量守恒与质量变化共同决定"],["列式时正负号混乱，尤其是反向运动的情况","把动量守恒当标量处理，只写大小关系","忽略「某方向守恒」而整体判定不守恒"],["碰撞与爆炸","人船模型与反冲","弹簧连接体的共速问题","分方向动量守恒"]],"碰撞问题":["#E74C3C","两个物体在极短时间内相互作用、动量重新分配的过程。按动能是否损失分为弹性碰撞、非弹性碰撞和完全非弹性碰撞。判断碰撞是否可能发生，需要同时检验动量守恒、动能不增、速度合理三条。",[["m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′","动量守恒"],["½m₁v₁² + ½m₂v₂² ≥ ½m₁v₁′² + ½m₂v₂′²","动能不增"],["v₁′ = (m₁−m₂)v₁/(m₁+m₂)，v₂′ = 2m₁v₁/(m₁+m₂)","一动碰一静的弹性碰撞"],["ΔE = ½m₁m₂v₁²/(m₁+m₂)","完全非弹性碰撞的动能损失"]],["弹性碰撞的结论：质量相等则交换速度；m₁≪m₂ 则原速反弹；m₁≫m₂ 则速度几乎不变、m₂ 获得 2v₁","完全非弹性碰撞动能损失最大，损失量 ΔE = ½μv<sub>rel</sub>²"],["碰撞三原则：动量守恒、动能不增、碰后速度符合实际（不能穿越）","弹性碰撞：动量与动能同时守恒","完全非弹性碰撞：碰后共速，动能损失最大","非弹性碰撞：动量守恒，动能减少但不为零","碰撞后速度方向的合理性检验是常考的隐含条件","微观粒子碰撞与宏观物体碰撞遵循相同规律"],["只验动量守恒，忘了动能不增的检验","碰后速度出现「后球超过前球」的荒谬结果未被发现","把完全非弹性碰撞当成弹性碰撞代入公式"],["碰撞可能性判断","弹性碰撞的速度计算","完全非弹性碰撞的能量损失","多次碰撞与临界条件"]],"反冲与爆炸":["#E74C3C","系统在内力作用下分裂为两部分，一部分向前运动，另一部分向相反方向运动，这种现象叫反冲。爆炸是反冲的极端情形，作用时间极短、内力远大于外力，动量守恒但动能增加。",[["0 = m₁v₁ + m₂v₂","反冲（初动量为零）"],[" 的辨析"]],"多普勒效应":["#E74C3C","波源与观察者之间有相对运动时，观察者接收到的频率与波源发出的频率不同，这种现象叫多普勒效应。相互靠近时接收频率变高，相互远离时变低。",[["靠近：f接收 > f发出","频率升高"],["远离：f接收 < f发出","频率降低"]],["多普勒效应是接收频率的变化，不是波速的变化","相互靠近频率升高，相互远离频率降低","测速雷达、多普勒超声都利用这一效应","天体光谱的红移说明星系在远离"],["多普勒效应的成因","靠近与远离时频率的变化方向","波源本身的频率不变","多普勒效应的应用：测速、医学超声、天文红移","光的多普勒效应与红移"],["认为波源频率发生了变化","把频率变化与波速变化混为一谈"],["频率变化方向的判断","多普勒效应的应用","红移与宇宙膨胀"]],"电磁学":["#3498DB","电磁学研究电荷、电流与它们产生的场。主线是「场的描述 → 带电粒子的受力与运动 → 电路 → 电磁感应 → 交变电流与电磁波」。电场与磁场都用「场强 + 势（或磁通）」两个量描述，这是贯穿全章的方法。",[["F = kq₁q₂/r²","库仑定律"],["E = F/q，U = Ed","电场强度与电势差"],["F = BIL，f = qvB","安培力与洛伦兹力"],["E = nΔΦ/Δt","法拉第电磁感应定律"]],["电场与磁场都通过「场」传递相互作用，不需要接触","电场力做功与路径无关，可以引入电势能","洛伦兹力永不做功，只改变速度方向","电磁感应的本质是磁通量发生变化"],["静电场用场强和电势两个角度描述","带电粒子在电场中加速与偏转是两类基本运动","电路问题分部分电路与闭合电路两个层次","磁场对电流和对运动电荷的作用是同一件事的两种表述","电磁感应把「场的变化」与「电」联系起来","交变电流与电磁波是电磁理论的直接应用"],["把电场强度与电势混为一谈，认为场强大的地方电势一定高","忽略洛伦兹力不做功这一前提"],["场的叠加与计算","带电粒子在复合场中的运动","电路动态分析","电磁感应综合"]],"静电场":["#3498DB","电荷周围存在的一种特殊物质，基本性质是对放入其中的电荷有力的作用。它看不见摸不着，但可以通过力的效应和能量的效应来描述——前者用场强，后者用电势。整个电学就是围绕「力」与「能」两条线索展开的。",[["E = F/q","电场强度定义式，q 为试探电荷"],["U<sub>AB</sub> = W<sub>AB</sub>/q","电势差定义式"],["E = U/d","匀强电场中场强与电势差的关系"]],["电场是客观存在的物质，不是人为假设的工具","电场线与等势面垂直，且由高电势指向低电势"],["电场的基本性质是对场中电荷有力的作用","描述电场有两个角度：力的角度用场强 E，能的角度用电势 φ","电场线是假想的曲线，疏密表示场强大小，切线表示方向","电场线不相交、不闭合（静电场），始于正电荷止于负电荷","匀强电场的电场线是等间距的平行直线","电场叠加遵循矢量合成，多个电荷的场强用平行四边形定则合成"],["把电场线当成电荷的运动轨迹（只有初速度为零且电场线为直线时才重合）","认为电场强度与试探电荷有关（E 由场源决定，与 q 无关）","电场线方向与正电荷受力方向相同，与负电荷相反，容易记反"],["电场线与场强、电势的判断","电场叠加与合场强","电场中的受力与运动","电场与力学综合"]],"库仑定律":["#3498DB","真空中两个静止点电荷之间的相互作用力，与电荷量乘积成正比、与距离平方成反比，方向沿两者连线。它是电磁学的「牛顿定律」，形式与万有引力定律完全同构，因此处理多电荷平衡时可用与力学相同的合成方法。",[["F = kq₁q₂/r²","k = 9.0×10⁹ N·m²/C²，r 为点电荷间距"],["F = kq₁q₂/(εr²)","介质中的形式，ε 为相对介电常数"]],["适用条件：真空、静止、点电荷。带电球体在电荷均匀分布时可等效为球心处的点电荷","三个自由点电荷平衡时「两同夹异、两大夹小」，且靠近小电荷"],["点电荷是理想模型，与质点一样是「大小形状可忽略」的抽象","库仑力是一对作用力与反作用力，等大反向，与电荷量大小无关","多个点电荷的作用力用矢量合成，遵循平行四边形定则","同种电荷相斥、异种电荷相吸，方向沿连线","三个自由电荷平衡问题的口诀与位置关系是常考模型","库仑力可以是引力也可以是斥力，需先判断方向再合成"],["把 r 当成两球表面距离（应为球心距）","认为电荷量大的对电荷量小的作用力更大（作用力与反作用力等大）","介质中忘记考虑介电常数"],["库仑定律的基本计算","三个自由电荷的平衡","库仑力与力学的综合（悬挂小球、三力平衡）","电场中的动力学问题"]],"电场强度":["#3498DB","描述电场力的性质的物理量，定义为单位正电荷在电场中受到的力。它是矢量，方向与正电荷受力方向相同。三个公式各有用途：定义式 E = F/q 普遍适用，点电荷式 E = kQ/r² 用于场源，E = U/d 只用于匀强电场。",[["E = F/q","定义式，普遍适用，q 为试探电荷"],["E = kQ/r²","点电荷场强，Q 为场源电荷"],["E = U/d","匀强电场，d 为沿场强方向的距离"],["E = ΣE<sub>i</sub>","场强叠加，矢量和"]],["定义式与点电荷式的区别：前者是「测量」，后者是「决定」","E = U/d 中的 d 必须是沿电场方向的距离，不是两点间直线距离"],["场强由电场本身决定，与试探电荷的电量、电性无关","场强是矢量，叠加时用平行四边形定则","电场线的疏密表示场强大小，切线方向表示场强方向","匀强电场中，同一方向上等距离的两点电势差相等","点电荷场强分布：以场源为中心的球面上场强大小相等","场强为零的点电势不一定为零，电势为零的点场强不一定为零"],["用 E = U/d 计算非匀强电场（该式只对匀强电场成立）","d 取了两点间的斜距，导致结果偏小","认为场强大的地方电势一定高（场强与电势无直接对应关系）"],["三个公式的适用条件辨析","场强叠加与合场强","电场线与场强分布","匀强电场中 E 与 U 的关系"]],"电势电势能":["#3498DB","从能量角度描述电场。电势是单位正电荷在电场中某点具有的电势能，是标量但有正负；电势差是两点电势之差，等于移动电荷时电场力做功与电荷量之比。与重力场类比是理解这一组概念最有效的方法。",[["φ = E<sub>p</sub>/q","电势定义式"],["U<sub>AB</sub> = φ_A − φ_B","电势差"],["W<sub>AB</sub> = qU<sub>AB</sub>","电场力做功与电势差的关系"],["E<sub>p</sub> = qφ","电势能"],["U = Ed","匀强电场中电势差与场强的关系"]],["沿电场线方向电势逐渐降低，这是判断电势高低最可靠的方法","电场力做正功，电势能减少；做负功，电势能增加"],["电势是标量，有正负，正负表示比零电势点高还是低","电势高低沿电场线方向降低，与电荷正负无关","电势能是电荷与电场共有的，属于系统而非单个电荷","电场力做功与路径无关，只与初末位置的电势差有关","正电荷在电势高处电势能大，负电荷在电势高处电势能小","等势面与电场线垂直，沿等势面移动电荷电场力不做功"],["认为电势高处电势能一定大（负电荷相反）","把电势差与电势混淆，U<sub>AB</sub> = φ_A − φ_B 的顺序写反","判断电场力做功正负时只看电荷正负，忘了看移动方向"],["电势高低的判断","电势能变化的判断","电场力做功的计算","等势面与电场线的关系"]],"电势差与场强":["#3498DB","匀强电场中，两点间的电势差等于场强与沿场强方向距离的乘积。这条关系把「力的角度」与「能的角度」连起来，是处理匀强电场问题的重要工具。",[["U = Ed","匀强电场中电势差与场强"],["E = U/d","由电势差求场强"]],["公式中的 d 是沿电场方向的距离","沿电场线方向电势降低最快","等势面与电场线垂直","非匀强电场中 E = U/d 只能定性使用"],["U = Ed 中 d 的含义","由等势面判断电场方向","匀强电场中的等势线与电场线","电势差与电场力做功的关系","非匀强电场中电势差的定性比较"],["把任意两点间的距离当成 d","在非匀强电场中直接套用 U = Ed"],["匀强电场中 E 与 U 的关系","等势面与电场线","电势差的比较"]],"静电屏蔽与应用":["#3498DB","处于静电平衡的导体内部场强为零，电荷只分布在导体外表面，这就是静电屏蔽。尖端放电、避雷针、静电除尘都是静电现象的应用。",[["导体内部 E = 0","静电平衡的条件"],["φ内 = 常量","导体是等势体"]],["静电平衡时导体内部场强处处为零","净电荷只分布在导体外表面，尖端处更密","静电屏蔽可以屏蔽外部电场对内部的影响"],["静电平衡的三个特点","尖端放电与避雷针","静电屏蔽的两种情形","静电除尘与静电喷涂","电容器中插入金属板的影响"],["认为导体内部没有电荷就场强为零","把静电屏蔽理解成屏蔽磁场"],["静电平衡的特点","静电屏蔽的应用","尖端放电"]],"电容器与带电粒子":["#3498DB","电容器是储存电荷的元件，电容由本身结构决定。带电粒子在电场中的运动分两类：沿电场方向加速，以及垂直电场方向偏转。偏转问题用类平抛的方法处理，加速问题用动能定理。",[["C = Q/U","电容定义式"],["C = εS/(4πkd)","平行板电容器电容"],["qU = ½mv²","加速"],["y = qUL²/(2mdv₀²)","偏转位移"]],["电容由电容器本身决定，与 Q、U 无关","加速用动能定理，偏转用类平抛分解","偏转的推论：速度反向延长线过极板中心","示波管把加速与偏转组合起来"],["电容器的两种动态：电压不变（接着电源）、电量不变（断开电源）","带电粒子在电场中的加速","偏转的分解与偏转角的计算","能否射出极板的临界判断","加速与偏转组合的示波管模型"],["认为电容与所带电荷量成正比","偏转问题中忘记粒子在电场中的运动时间由板长和初速决定"],["电容器的动态分析","加速与偏转的组合","偏转的推论与屏上位置"]],"电容器":["#3498DB","两个彼此绝缘又相互靠近的导体组成的装置，用来储存电荷与电场能。核心关系是 C = Q/U：电容由电容器本身的结构决定，与所带电量、两端电压无关。平行板电容器的动态分析是这一章的命题热点。",[["C = Q/U","电容定义式，普遍适用"],["C = εS/(4πkd)","平行板电容器，决定式"],["E = U/d = 4πkQ/(εS)","板间场强"],["E<sub>C</sub> = ½CU² = ½QU","储存的电场能"]],["电容由 ε、S、d 决定，与 Q、U 无关——这是定义式与决定式的经典区分","动态分析口诀：电容器与电源相连则 U 不变，断开电源则 Q 不变"],["电容的单位是法拉（F），1 F = 10⁶ μF = 10¹² pF","平行板电容器电容与正对面积成正比、与板间距成反比、与介电常数成正比","始终与电源相连：U 恒定，改变 d 或 S 时 Q、E 随之变化","充电后断开电源：Q 恒定，改变 d 时 E 保持不变（E = 4πkQ/εS 与 d 无关）","电容器在直流电路中相当于断路，在交流电路中可「导通」","击穿电压与额定电压是两个不同的概念"],["认为电容随所带电量增大而增大（电容是固有属性）","动态分析时没先判断「U 不变」还是「Q 不变」，直接套公式","断开电源后误以为 E 随 d 改变（实际 E 与 d 无关）"],["平行板电容器的动态分析","电容器的充电与放电","带电粒子在电容器中的平衡","含电容器的电路分析"]],"带电粒子运动":["#3498DB","带电粒子在电场中的运动本质是力学问题：受到电场力后按牛顿定律运动。处理思路与平抛、匀变速完全一致——先求加速度 a = qE/m，再按运动分解求解。加速与偏转是两个最基本的模型。",[["a = qE/m = qU/(md)","匀强电场中的加速度"],["W = qU = ½mv² − ½mv₀²","加速过程用动能定理"],["v<sub>y</sub> = at = qUL/(mdv₀)","偏转过程的竖直速度"],["y = ½at² = qUL²/(2mdv₀²)","偏转位移"]],["粒子重力是否忽略的判断：电子、质子、离子一般忽略；带电小球、油滴、尘埃一般不能忽略","偏转中速度偏角正切是位移偏角正切的两倍，与平抛一致"],["加速模型：电场力做功转化为动能，用动能定理最简洁","偏转模型：沿初速度方向匀速，垂直方向匀加速，与平抛同构","偏转角 tanθ = v<sub>y</sub>/v₀ = qUL/(mdv₀²)","偏转位移 y = qUL²/(2mdv₀²)","粒子飞出偏转电场后做匀速直线运动，反向延长线过极板中点","先加速后偏转的组合：偏转量与加速电压、偏转电压的比值有关"],["该考虑重力时忽略了重力（如带电油滴平衡问题）","把偏转电场中的水平方向当成加速（应为匀速）","偏转位移与偏转角的公式混用"],["加速与偏转的组合","偏转中的临界（能否飞出极板）","示波管原理","带电粒子在复合场中的运动"]],"电场加速":["#3498DB","带电粒子在电场中由静止（或初速度）被加速的过程。电场力做正功，电势能转化为动能。计算时优先用动能定理，因为它不涉及时间与加速度，比牛顿定律更简洁。",[["qU = ½mv² − ½mv₀²","动能定理，最常用"],["v = √(2qU/m)","由静止加速后的速度"],["a = qU/(md)","若需时间时用"],["t = d·√(2m/(qU))","加速时间"]],["加速后的速度只与加速电压有关，与板间距无关","粒子获得的动能 qU 与电荷量成正比，速度与比荷的平方根成正比"],["电场力做正功，电势能减少、动能增加","用动能定理可跳过加速度与时间，直接求速度","同一加速电压下，比荷越大末速度越大","加速过程中若考虑重力，需把重力做功一并计入","多级加速时总功为各级电压之和乘以电荷量","回旋加速器中粒子每次加速的电压相同，但轨道半径逐渐增大"],["用 v = at 求速度时忘记先求 a","忽略初速度不为零的情况","认为加速电压越高、板间距越大速度越大（只与电压有关）"],["加速后速度与动能的计算","加速与偏转组合","回旋加速器","多级直线加速"]],"电场偏转":["#3498DB","带电粒子垂直进入匀强电场后做类平抛运动。沿初速度方向匀速，沿电场方向匀加速。这是示波管、喷墨打印、静电分选的技术基础，也是高考中「类平抛」模型的原型。",[["t = L/v₀","在电场中的飞行时间"],["y = qUL²/(2mdv₀²)","偏转位移"],["v<sub>y</sub> = qUL/(mdv₀)","出场时的竖直速度"],["tanθ = qUL/(mdv₀²)","速度偏角正切"],["tanθ = 2tanα","速度偏角与位移偏角的关系"]],["偏转位移与偏转电压成正比，这是示波器显示波形的基础","粒子离开电场后沿出射方向做匀速直线运动，可延长线交于极板中点"],["垂直进入匀强电场，做类平抛运动","水平方向匀速，竖直方向匀加速","偏转位移 y ∝ U，偏转电压越大偏得越远","能否飞出的临界条件：y ≤ d/2","速度偏角的正切是位移偏角正切的两倍","偏转后打在荧光屏上的位置由出射点与出射方向共同决定"],["把偏转电场中的水平运动当成加速","忘记判断粒子能否飞出极板（y > d/2 则打在板上）","计算屏上位置时只考虑出射点，忽略出射方向的延长"],["偏转位移与偏转角计算","能否飞出的临界问题","示波管与荧光屏成像","偏转与加速的组合"]],"电路及其应用":["#3498DB","电荷定向移动形成电流，大小方向都不随时间变化的叫恒定电流。研究恒定电流的核心是三条：电流的定义、欧姆定律、以及能量转化（电功与电功率）。电路分析的本质是找各部分的电压、电流、电阻关系。",[["I = q/t","电流定义式，q 为通过截面的电荷量"],["I = nqSv","微观表达式，n 载流子数密度，v 定向移动速率"],["R = ρL/S","电阻定律"],["W = UIt，P = UI","电功与电功率"],["Q = I²Rt","焦耳热"]],["电流的传导速率是光速，但电子定向移动速率只有 10⁻⁵ m/s 量级","纯电阻电路 W = Q，非纯电阻电路 W > Q"],["电流是标量，但习惯上说「方向」指正电荷定向移动的方向","电阻由材料、长度、横截面积决定，与电压电流无关","电阻率 ρ 与材料、温度有关，金属随温度升高而增大","串联分压、并联分流，是电路化简的基本工具","电功 W = UIt 普遍适用，焦耳热 Q = I²Rt 也普遍适用","非纯电阻电路（电动机、电解槽）不能用 U = IR"],["认为电流有方向就是矢量（电流是标量，运算不遵循平行四边形定则）","对电动机用欧姆定律 U = IR（非纯电阻不成立）","把电功与焦耳热混为一谈"],["电阻定律与电阻率","串并联电路计算","电功电功率与焦耳热","非纯电阻电路"]],"电流与电动势":["#3498DB","电荷的定向移动形成电流，方向规定为正电荷移动的方向。电动势描述电源把其他形式能转化为电能的本领，由电源本身决定，等于电源不接外电路时两端的电压。",[["I = q/t","电流的定义式"],["I = nqSv","电流的微观表达式"],["E = W非/q","电动势的定义式"]],["电流是标量，但习惯上说方向","电动势由电源本身决定，与外电路无关","电动势等于内阻与外电阻上的电压之和","电源短路时电流最大但会损坏电源"],["电流的定义式与微观表达式","电动势与电压的区别","电源的 U-I 图线与电动势","电动势的测量","电源串联与并联的等效电动势"],["把电动势当成路端电压","认为电动势与外电路电阻有关"],["电流的微观表达式","电动势的理解","电源的串并联"]],"欧姆定律":["#3498DB","导体中的电流与两端电压成正比、与电阻成反比。它的适用范围是纯电阻（金属导体、电解液），对气体导电、半导体器件不成立。部分电路欧姆定律处理单个元件，闭合电路欧姆定律处理整个回路。",[["I = U/R","部分电路欧姆定律"],["U = IR","电压形式"],["R = U/I","电阻的测量式（非决定式）"]],["R = U/I 是测量式，电阻由材料结构决定，不由 U、I 决定","欧姆定律只适用于纯电阻，金属导体的伏安特性曲线是过原点的直线"],["适用条件：纯电阻、温度变化不大","伏安特性曲线：线性元件的 U-I 图是直线，斜率表示电阻","非线性元件（小灯泡、二极管）的电阻随状态变化","二极管具有单向导电性，正反向电阻差异极大","串并联电路中欧姆定律依然成立，只是研究对象换成等效电阻","图像法处理 U-I 图：图线上某点与原点连线的斜率表示该状态下的电阻"],["用 R = U/I 说明「电阻与电压成正比」，这是因果倒置","对小灯泡的 U-I 曲线用直线斜率求电阻（应为割线斜率）","把欧姆定律用于非纯电阻元件"],["伏安特性曲线的分析","非线性元件的电阻计算","含二极管的电路","欧姆定律与电功率综合"]],"电阻定律":["#3498DB","导体的电阻由材料、长度、横截面积决定，与两端电压和通过的电流无关。电阻率反映材料的导电性能，随温度变化。这是电阻的决定式，与 R = U/I 这个测量式有本质区别。",[["R = ρL/S","电阻定律（决定式）"],["ρ = RS/L","电阻率的测量式"]],["电阻由导体本身决定，与 U、I 无关","R = U/I 只是测量式，不是决定式","金属的电阻率随温度升高而增大，半导体则减小","导线拉长时体积不变，R 与 L² 成正比"],["电阻定律与欧姆定律的区别","电阻率与温度的关系","导线形变后的电阻变化","电阻率的测量实验","超导现象与零电阻"],["用 R = U/I 说明电阻与电压成正比","导线拉长时只考虑长度变化，忽略横截面积同时减小"],["电阻定律的计算","导线形变问题","电阻率的测量"]],"串并联电路":["#3498DB","串联电路电流处处相等、电压按电阻分配；并联电路电压处处相等、电流按电阻反比分配。这是电路化简的基础，也是电表改装、分压限流接法、故障判断的工具。",[["R_串 = R₁ + R₂ + …","串联等效电阻"],["1/R_并 = 1/R₁ + 1/R₂ + …","并联等效电阻"],["U₁/U₂ = R₁/R₂","串联分压"],["I₁/I₂ = R₂/R₁","并联分流"]],["并联总电阻小于任一支路电阻，串联总电阻大于任一电阻","n 个相同电阻并联，总电阻为 R/n"],["串联：电流相同，电压与电阻成正比，功率与电阻成正比","并联：电压相同，电流与电阻成反比，功率与电阻成反比","任何一个电阻增大，串联总电阻增大，并联总电阻也增大","电表改装：串联大电阻扩大量程（电压表），并联小电阻扩大量程（电流表）","分压接法适合大范围调节，限流接法适合节能","电路故障判断：断路处电压不为零，短路处电压为零"],["认为并联一个电阻后总电阻变大","电表改装时把串联并联弄反","动态电路分析时没有按「局部—整体—局部」的顺序推导"],["等效电阻计算","电表改装","分压限流接法选择","电路故障分析"]],"焦耳定律与电功率":["#3498DB","电流通过导体时产生的热量由焦耳定律给出。电功率分电功功率与热功率，纯电阻电路中两者相等，非纯电阻电路（电动机、电解槽）中电功率大于热功率。",[["Q = I²Rt","焦耳定律"],["P = UI","电功率"],["P热 = I²R","热功率"],["P出 = UI − I²R","电动机的输出功率"]],["纯电阻电路：电功等于电热，P = UI = I²R = U²/R","非纯电阻电路：电功大于电热","电动机的输入功率等于输出机械功率加热功率","远距离输电用高压减小线路损耗"],["电功与电热的区别","纯电阻与非纯电阻的判断","电动机的三个功率","额定功率与实际功率","含电动机的电路计算"],["对电动机用 P = U²/R 求功率","认为电功率总等于热功率"],["电功与电热的区分","电动机的功率计算","非纯电阻电路"]],"伏安特性曲线":["#3498DB","以电压为横轴、电流为纵轴画出的图线叫伏安特性曲线。线性元件的图线是过原点的直线，斜率的倒数表示电阻；非线性元件（小灯泡、二极管）的图线弯曲，电阻随状态变化。",[["R = U/I","某状态下的电阻（割线斜率）"],["k = 1/R","线性元件的斜率"]],["线性元件的伏安特性曲线是过原点的直线","非线性元件的电阻随电压（温度）变化","图线上某点与原点连线的斜率表示该状态的电阻","二极管具有单向导电性"],["线性与非线性元件的区别","割线斜率与切线斜率的区别","小灯泡电阻随温度变化","二极管的单向导电性","伏安特性曲线与电源 U-I 线的交点即工作点"],["用切线斜率求非线性元件的电阻","认为小灯泡的电阻是定值"],["伏安特性曲线的分析","非线性元件的电阻","工作点的确定"]],"电学实验":["#3498DB","以测量电阻、电动势、内阻为核心的一组实验，考查器材选择、电路设计、数据处理与误差分析。核心能力是三件事：选对电路（安培计内外接、分压限流）、读准数据、算对结果。",[["R = ρL/S","电阻率测量原理"],["R_测 = U/I","伏安法测电阻"],["E = U + Ir","测电源电动势与内阻"],["R_中 = √(R<sub>A</sub>·R<sub>V</sub>)","内外接法的临界电阻"]],["大电阻用内接法（测量值偏大），小电阻用外接法（测量值偏小）","测电源内阻时，电压表分流导致电动势与内阻的测量值都偏小"],["电流表内接：适合大电阻，测量值 = R_真 + R<sub>A</sub>","电流表外接：适合小电阻，测量值 = R_真·R<sub>V</sub>/(R_真+R<sub>V</sub>)","分压接法：要求电压从零开始调节时必须使用","限流接法：电路简单、能耗小，但调节范围有限","伏安法测电源：用 U-I 图线，纵截距为 E，斜率绝对值为 r","多用电表的使用：机械调零、选挡、欧姆调零、测量、复位"],["内外接法选择时只看电阻大小，忽略电压表内阻的影响程度","测电源电动势时用一节旧电池，导致图线画不出（电压变化太小）","螺旋测微器读数忘记估读位"],["伏安法测电阻的电路选择","测电源电动势与内阻","测金属电阻率","多用电表的原理与使用"]],"电能与能量守恒":["#3498DB","闭合电路把电源的内阻考虑进来，端电压随外电阻变化。电源的总功率、输出功率、内耗功率与效率是常考内容。多用电表则是闭合电路欧姆定律的直接应用。",[["E = U + Ir","闭合电路欧姆定律"],["P总 = EI","电源总功率"],["P出 = UI","输出功率"],["η = U/E","效率"]],["路端电压随外电阻增大而增大","输出功率最大时 R = r，但此时效率只有 50%","电源的 U-I 图线斜率绝对值等于内阻","欧姆表的内阻等于中值电阻"],["闭合电路欧姆定律与路端电压","电源的三种功率与效率","输出功率最大的条件","U-I 图像读电动势与内阻","多用电表的原理与使用"],["把路端电压当成电动势","认为输出功率最大时效率也最高"],["闭合电路的计算","电源的功率与效率","多用电表的原理"]],"闭合电路欧姆定律":["#3498DB","把电源的内阻纳入考虑后的欧姆定律：电流等于电动势除以总电阻。它揭示了路端电压随外电阻变化的规律，是分析电源输出功率、电路动态变化的核心方程。",[["I = E/(R + r)","闭合电路欧姆定律"],["U = E − Ir","路端电压"],["P_出 = I²R = E²R/(R+r)²","电源输出功率"],["η = R/(R+r)","电源效率"]],["当 R = r 时输出功率最大，P<sub>max</sub> = E²/(4r)，但此时效率只有 50%","路端电压随外电阻增大而增大，随电流增大而减小"],["电动势是电源把其他形式能转化为电能的本领，由电源本身决定","内电压 U_内 = Ir，路端电压 U = E − Ir","U-I 图像：纵截距为电动势，斜率的绝对值为内阻","外电阻增大，总电流减小，路端电压增大","输出功率随外电阻先增后减，R = r 时最大","电源的效率随外电阻增大而增大"],["认为电动势就是路端电压（只有断路时二者才相等）","把输出功率最大当成效率最高","动态分析时忽略内阻，得出路端电压不变的错误结论"],["闭合电路的计算","U-I 图像求电动势与内阻","电源输出功率与效率","动态电路分析"]],"电源的功率与效率":["#3498DB","电源的总功率等于电动势与电流的乘积，输出功率等于路端电压与电流的乘积，两者之差是内阻上消耗的功率。输出功率随外电阻变化，在 R = r 时达到最大。",[["P总 = EI","总功率"],["P出 = UI = I²R","输出功率"],["P内 = I²r","内耗功率"],["R = r 时 P出 最大","最大输出功率条件"]],["输出功率最大时 R = r，此时效率只有 50%","效率 η = U/E = R/(R+r)","外电阻越大效率越高，但输出功率不一定大","U-I 图线上某点与坐标轴围成的面积表示输出功率"],["三种功率的计算","输出功率随外电阻的变化","最大输出功率与最大效率的区别","电源的 U-I 图线","含非线性元件时的工作点"],["认为输出功率最大时效率也最高","混淆「最大输出功率」与「最大效率」"],["电源的功率与效率","输出功率最大的条件","U-I 图线的应用"]],"多用电表":["#3498DB","多用电表把电流表、电压表、欧姆表集成在一起，通过转换开关切换。欧姆档内部有电源，读数等于表盘示数乘以倍率，换挡后必须重新欧姆调零。",[["R内 = E/Ig","欧姆表内阻"],["R测 = E/I − R内","待测电阻"]],["欧姆表的刻度不均匀，左密右疏","指针指在中值附近时读数最准确","换挡后必须重新进行欧姆调零","测电阻时必须把待测电阻与外电路断开"],["多用电表的三档功能","欧姆表的原理与刻度特点","欧姆调零与机械调零的区别","中值电阻的意义","用多用电表判断二极管极性"],["换挡后忘记重新欧姆调零","在带电电路中直接测电阻"],["多用电表的使用","欧姆表的原理","二极管极性的判断"]],"磁场":["#3498DB","磁体或电流周围存在的一种特殊物质，对放入其中的磁体、电流、运动电荷有力的作用。磁场与电场最大的区别是：磁场只对运动电荷有力的作用，且力的方向总垂直于速度与磁场构成的平面。",[["F = BIL·sinθ","安培力，θ 为电流与磁场夹角"],["F = qvB·sinθ","洛伦兹力"],["B = F/(IL)","磁感应强度定义（电流元垂直放入）"]],["磁场方向规定为小磁针 N 极受力方向，磁感线在磁体外部由 N 到 S，内部由 S 到 N","磁感线是闭合曲线，这一点与静电场的电场线不同"],["磁场的基本性质是对运动电荷、电流、磁体有力的作用","磁感线的疏密表示磁感应强度大小，切线表示方向","磁感线不相交，且是闭合曲线（无磁单极）","常见磁场：条形磁体、蹄形磁体、直线电流、环形电流、通电螺线管","安培定则（右手螺旋定则）判断电流磁场方向","地磁场：地理北极附近是地磁南极"],["把磁感线当成真实存在的线（与电场线一样是假想曲线）","认为磁感线从 N 极出发到 S 极终止（应为闭合曲线）","安培定则与左手定则混用"],["磁感线分布与方向判断","安培定则的应用","磁场的叠加","地磁场与指南针"]],"磁感应强度":["#3498DB","描述磁场强弱和方向的物理量，用垂直放入的短直导线所受安培力与电流和长度的乘积之比定义。它是矢量，方向为该点磁场方向，即小磁针 N 极的受力方向。",[["B = F/(IL)","定义式，要求电流元垂直于磁场"],["B = Φ/S","与磁通量的关系（垂直时）"],["1 T = 1 N/(A·m)","单位换算"]],["B 由磁场本身决定，与放入的电流元无关","B 与 F、I、L 无正比反比关系，定义式只是量度方式"],["磁感应强度是矢量，叠加时遵循平行四边形定则","B 的方向是小磁针 N 极受力方向，也是磁感线切线方向","定义式要求电流元垂直于磁场，若平行则 F = 0","匀强磁场的磁感线是等间距的平行直线","磁通量 Φ = BS 中 S 必须是垂直磁场的有效面积","磁通量是标量，但有正负（穿入穿出方向）"],["认为 B 与 F 成正比、与 IL 成反比（定义式不是决定式）","电流与磁场平行时仍用 F = BIL 计算（此时 F = 0）","计算磁通量时用了线圈面积而非垂直投影面积"],["磁感应强度的定义与理解","磁场的叠加","磁通量的计算","B 与 Φ 的区别"]],"安培力":["#3498DB","通电导线在磁场中受到的力。大小 F = BIL·sinθ，方向由左手定则判断，总垂直于电流与磁场构成的平面。它是电动机、磁电式仪表的工作原理，也是导体棒在磁场中运动问题的受力基础。",[["F = BIL","电流垂直于磁场时"],["F = BIL·sinθ","一般情况，θ 为 I 与 B 的夹角"],["F = 0","电流与磁场平行时"]],["安培力方向总垂直于 B 和 I 决定的平面，但 B 与 I 不一定垂直","弯曲导线可用等效长度（首尾连线）计算安培力"],["左手定则：磁感线穿入手心，四指指电流方向，拇指指安培力方向","安培力大小与导线在磁场中的有效长度有关","闭合线圈在匀强磁场中所受安培力合力为零，但可能有转动力矩","安培力可以做正功也可以做负功，是电能与其他形式能转化的桥梁","通电导体在磁场中的平衡与运动问题，本质是力学问题加一个安培力","磁电式电表的线圈受力矩作用而偏转，游丝提供反向力矩"],["左手定则与右手定则（判断感应电流）混用","计算弯曲导线受力时用总长度而非等效长度","认为安培力方向与磁场方向相同或相反"],["安培力大小与方向","通电导体的平衡与运动","安培力做功与能量转化","磁电式仪表原理"]],"洛伦兹力":["#3498DB","运动电荷在磁场中受到的力，是安培力的微观本质。大小 F = qvB·sinθ，方向由左手定则判断（负电荷反向）。它永远垂直于速度，因此不做功，只改变速度方向。",[["F = qvB","v 垂直于 B 时"],["F = qvB·sinθ","一般情况"],["r = mv/(qB)","圆周运动半径"],["T = 2πm/(qB)","圆周运动周期"]],["洛伦兹力永不做功，只改变速度方向，不改变速率","周期与速度、半径无关，只由比荷与磁感应强度决定"],["左手定则判断方向，负电荷四指指向速度反方向","洛伦兹力始终垂直于速度，提供向心力","带电粒子垂直进入匀强磁场做匀速圆周运动","速度与磁场平行时不受洛伦兹力，做匀速直线运动","洛伦兹力不做功，但可以改变动量","宏观安培力是洛伦兹力的宏观表现"],["认为洛伦兹力能改变速度大小（它永不做功）","负电荷判断方向时忘记反向","把洛伦兹力当成可以单独做功的力"],["洛伦兹力方向判断","带电粒子在磁场中的圆周运动","洛伦兹力与电场力的比较","速度选择器与磁流体发电机"]],"带电粒子圆周运动":["#3498DB","带电粒子垂直进入匀强磁场后，洛伦兹力提供向心力，做匀速圆周运动。半径 r = mv/(qB)，周期 T = 2πm/(qB)。解题的关键是「找圆心、定半径、算圆心角」，画图能力决定成败。",[["r = mv/(qB) = p/(qB)","轨道半径"],["T = 2πm/(qB)","周期，与速度无关"],["t = (θ/2π)T","运动时间，θ 为圆心角"],["r = √(2mE<sub>k</sub>)/(qB)","由动能表示半径"]],["找圆心的方法：过两点作速度垂线，交点即圆心；或利用弦的中垂线","粒子在磁场中运动的时间由圆心角决定，圆心角等于速度偏转角"],["半径与速度成正比、与磁感应强度成反比","周期与速度无关，这是回旋加速器能工作的原理","圆心角等于速度方向的偏转角，是求时间的关键","临界问题：恰好不飞出边界的条件是轨迹与边界相切","多解问题：粒子可能从不同边界射出，或转过的圆心角有多个可能","磁场边界形状（直线、圆形、矩形）决定临界条件的写法"],["找圆心时把弦的中垂线画错","求时间时用错圆心角，或把角度制与弧度制混用","忽略多解性，只答一种情况"],["半径与周期的计算","磁场边界上的临界与多解","回旋加速器","粒子在复合场中的运动"]],"电磁感应":["#3498DB","穿过闭合回路的磁通量发生变化时，回路中产生感应电流的现象。它是电场与磁场的桥梁，揭示了「变化的磁场产生电场」这一深刻规律。产生的条件有两个：回路闭合、磁通量变化。",[["Φ = BS·cosθ","磁通量"],["E = nΔΦ/Δt","法拉第电磁感应定律"],["E = BLv","导体棒切割磁感线"],["I = E/(R+r)","感应电流"]],["产生感应电流的条件：磁通量变化 + 回路闭合。只有电动势没有回路时无电流","磁通量变化的方式：B 变、S 变、夹角变，或三者组合"],["磁通量变化是产生感应电动势的根本原因","感应电动势的大小由磁通量变化率决定，与磁通量本身大小无关","切割磁感线与磁通量变化是同一规律的两种表述","感应电流的方向由楞次定律或右手定则判断","电磁感应过程伴随能量转化：机械能转化为电能","自感现象是电磁感应的特例，由自身电流变化引起"],["认为磁通量大则感应电动势大（应为变化率大）","磁通量变化但回路不闭合时误判有感应电流","把 Φ = BS 中的 S 当成线圈面积（应为有效面积）"],["感应电流产生条件判断","感应电动势的计算","电磁感应中的能量转化","图像问题（Φ-t、E-t、i-t）"]],"电磁感应现象":["#3498DB","只要穿过闭合回路的磁通量发生变化，回路中就有感应电流产生，这就是电磁感应现象。磁通量的变化可以来自磁场变化、面积变化或两者夹角变化。",[["ΔΦ ≠ 0 ⟹ 有感应电流","产生条件"],["Φ = BS cosθ","磁通量"]],["产生感应电流的条件是磁通量发生变化","磁通量变化有三种途径：B 变、S 变、夹角变","有感应电动势不一定有感应电流（回路不闭合时）","感应电动势是电磁感应的本质"],["磁通量与磁通量变化率的区别","产生感应电动势与产生感应电流的条件不同","回路不闭合时只有电动势没有电流","磁通量为零时变化率不一定为零"],["认为导体在磁场中运动就一定有感应电流","把磁通量大当成感应电动势大"],["感应电流产生的条件","磁通量变化的三种途径","有无感应电流的判断"]],"楞次定律":["#3498DB","感应电流的磁场总要阻碍引起感应电流的磁通量的变化。四个字概括就是「增反减同」。它是能量守恒在电磁感应中的体现——要产生电能必须克服阻碍做功。",[["增反减同","磁通量增大则感应磁场反向，减小则同向"],["来拒去留","导体与磁体相对运动时的受力判断"],["增缩减扩","回路面积的变化趋势"]],["楞次定律的本质是能量守恒：感应电流的机械效果总是反抗引起它的原因","判断步骤：原磁场方向 → 磁通量增减 → 感应磁场方向 → 感应电流方向（安培定则）"],["「阻碍」不是「阻止」，磁通量仍在变化，只是变化被减缓","增反减同：磁通量增大时感应磁场与原磁场反向","来拒去留：磁体靠近时回路排斥，远离时吸引","增缩减扩：磁通量增大时回路有收缩趋势","楞次定律适用于一切电磁感应现象，右手定则只适用于切割磁感线","感应电流的磁场总是阻碍相对运动，这是电磁阻尼与电磁驱动的原理"],["把「阻碍变化」理解成「阻止变化」","判断时漏掉「原磁场方向」这一步，直接跳到结果","切割磁感线时用楞次定律绕远路，应直接用右手定则"],["感应电流方向判断","楞次定律的推广形式（来拒去留、增缩减扩）","电磁阻尼与电磁驱动","安培力方向与运动趋势"]],"法拉第电磁感应定律":["#3498DB","感应电动势的大小与穿过回路的磁通量变化率成正比，比例系数为线圈匝数。它给出的是「变化有多快」，而不是「变化了多少」。切割磁感线的 E = BLv 是它的特例。",[["E = nΔΦ/Δt","普适式，n 为匝数"],["E = BLv","导体棒垂直切割磁感线"],["E = BLv·sinθ","速度与磁场成 θ 角"],["E = ½BL²ω","导体棒绕一端转动切割"]],["E = nΔΦ/Δt 求的是平均电动势，E = BLv 求的是瞬时电动势（v 为瞬时速度时）","感应电荷量 q = nΔΦ/R，与时间无关，只与磁通量变化量有关"],["感应电动势与磁通量变化率成正比，与磁通量本身无关","平均电动势用 ΔΦ/Δt，瞬时电动势用 BLv","线圈匝数 n 只影响电动势大小，不影响感应电流方向的判断","感应电荷量 q = nΔΦ/(R+r)，常用于求通过导体截面的电量","切割长度 L 是有效长度，即垂直于速度方向的投影长度","转动切割的电动势为平均切割速度对应的值"],["用 E = BLv 求平均电动势（该式在 v 变化时只给瞬时值）","计算电荷量时把时间也算进去（q 与时间无关）","有效长度取错，尤其是弯曲导线或斜向切割"],["感应电动势的平均值与瞬时值","感应电荷量的计算","转动切割","图像问题（E-t 图）"]],"自感互感":["#3498DB","自感是导体自身电流变化引起磁通量变化、从而产生感应电动势的现象；互感是两个线圈之间通过磁通量耦合传递能量的现象。自感的本质是「线圈对电流变化的阻碍」，通直流阻交流、通低频阻高频。",[["E = L·ΔI/Δt","自感电动势，L 为自感系数"],["L 由线圈匝数、截面积、长度、是否有铁芯决定","自感系数的决定因素"]],["自感电动势总是阻碍电流的变化，但不能阻止变化","通电自感：灯泡逐渐变亮；断电自感：灯泡可能闪亮一下再熄灭"],["自感系数 L 由线圈本身决定，单位是亨利（H）","电流增大时，自感电动势与电流方向相反；电流减小时，方向相同","断电自感中灯泡是否闪亮，取决于线圈电流与原灯泡电流的大小关系","互感是变压器、无线充电的工作原理","电感在电路中的作用：通直流、阻交流、通低频、阻高频","自感现象中线圈的电流不能突变，这一点与弹簧弹力不能突变类似"],["认为自感电动势能阻止电流变化（只能延缓）","断电自感时判断灯泡是否闪亮，没有比较断电前后的电流大小","把自感系数当成与电流有关的量"],["通电与断电自感的现象分析","自感电动势的方向判断","含电感的电路分析","变压器与互感"]],"导轨问题":["#3498DB","导体棒在导轨上运动、切割磁感线产生感应电流，进而受到安培力阻碍运动的模型。它是力、电、能三者的综合载体，几乎是电磁感应压轴题的固定形态。分析主线是：运动 → 感应电动势 → 电流 → 安培力 → 加速度变化 → 最终状态。",[["E = BLv，I = BLv/(R+r)","感应电流"],["F<sub>A</sub> = B²L²v/(R+r)","安培力，与速度成正比"],["a = (F − B²L²v/(R+r))/m","加速度，随速度减小"],["q = nΔΦ/(R+r)","通过截面的电荷量"],["Q = ½mv₀² − ½mv²","焦耳热的能量来源"]],["安培力与速度成正比，速度增大则安培力增大、加速度减小，最终匀速","最大速度的条件：合力为零，即 F = B²L²v<sub>m</sub>/(R+r)"],["单棒模型：恒力拉动下做加速度减小的加速运动，最终匀速","无外力时导体棒在安培力作用下做减速运动，最终停止","双棒模型：两棒通过安培力相互作用，最终共速（无外力时）","能量关系：外力做功 = 动能增量 + 焦耳热","求焦耳热用能量守恒，求电荷量用 q = ΔΦ/R，二者不能混用","导轨有摩擦时，最终状态由摩擦力与安培力的平衡决定"],["认为导体棒做匀加速运动（安培力随速度变化，加速度不恒定）","求焦耳热时用 Q = I²Rt 但电流是变化的，应改用能量守恒","双棒问题中误以为两棒速度始终相同"],["单棒的最大速度与收尾速度","双棒模型的共速与相对位移","电磁感应中的能量分配","含摩擦的导轨问题"]],"交变电流":["#3498DB","线圈在匀强磁场中匀速转动产生正弦式交变电流。描述交变电流需要峰值、有效值、周期、频率四个量，其中有效值按电流的热效应定义。变压器与远距离输电是交变电流最重要的应用。",[["e = Eₘsinωt","瞬时电动势"],["Eₘ = nBSω","峰值"],["E = Eₘ/√2","正弦交流的有效值"],["U₁/U₂ = n₁/n₂","理想变压器"]],["中性面处磁通量最大、感应电动势为零","有效值按热效应定义，正弦交流为峰值除以 √2","变压器只改变电压电流，不改变频率，也不能变直流","远距离输电用高压减小线路损耗"],["交变电流的产生与中性面","峰值、有效值、平均值的区别","变压器的电压比、电流比、功率关系","远距离输电的功率损耗","电感与电容对交变电流的影响"],["求电表读数时误用峰值","认为变压器可以改变频率或变换直流"],["交变电流的产生与图像","有效值的计算","变压器与远距离输电"]],"交变电流的产生与描述":["#3498DB","线圈在匀强磁场中绕垂直于磁场的轴匀速转动，产生正弦式交变电流。中性面是线圈平面与磁场垂直的位置，此时磁通量最大、感应电动势为零。",[["e = Eₘ sinωt","从中性面开始计时"],["Eₘ = nBSω","峰值"],["i = Iₘ sinωt","瞬时电流"]],["中性面处磁通量最大、电动势为零","线圈平面与磁场平行时电动势最大、磁通量为零","每经过中性面一次，电流方向改变一次","从中性面开始计时是正弦，从平行位置开始是余弦"],["中性面的特点","峰值与转速、匝数、面积的关系","瞬时值表达式的书写","交变电流的图像","电流方向改变的次数"],["把磁通量最大处当成电动势最大处","写瞬时值表达式时搞错计时起点"],["交变电流的产生","中性面与峰值","瞬时值表达式"]],"有效值与峰值":["#3498DB","有效值是根据电流的热效应定义的：让交流与直流在相同时间内产生相同的热量，这个直流的数值就是交流的有效值。正弦交流的有效值是峰值的 1/√2。",[["E = Eₘ/√2","正弦交流的有效值"],["I = Iₘ/√2","电流有效值"],["Q = I²Rt","用有效值算热量"]],["有效值按热效应定义，只有正弦交流才等于峰值除以 √2","电表读数、铭牌参数都是有效值","求热量、功率用有效值，求电荷量用平均值","非正弦交流的有效值要用定义式计算"],["有效值的定义与计算","峰值与有效值的关系","平均值与有效值的区别","非正弦交流的有效值","电表读数与额定值"],["对非正弦交流直接用峰值除以 √2","求电荷量时误用有效值"],["有效值的计算","非正弦交流的有效值","有效值与平均值的区别"]],"变压器":["#3498DB","理想变压器通过互感改变交流电压，原副线圈的电压比等于匝数比，电流比等于匝数反比，输入功率等于输出功率。变压器不能改变频率，也不能变换直流。",[["U₁/U₂ = n₁/n₂","电压比"],["I₁/I₂ = n₂/n₁","电流比（只有一个副线圈时）"],["P₁ = P₂","功率 ，布朗运动越剧烈","定性规律"]],["布朗运动是固体颗粒的运动，不是液体分子的运动，但它反映了液体分子的无规则运动","布朗运动永不停止，与外界是否扰动无关"],["布朗运动是悬浮颗粒的无规则运动，颗粒本身包含大量分子","成因：液体分子从各方向撞击颗粒的冲力不平衡","颗粒越小，某一瞬间受力越不平衡，运动越明显","温度越高，分子热运动越剧烈，布朗运动越明显","布朗运动是永不停息的，说明分子运动永不停止","观察到的颗粒运动轨迹是折线，不是分子的运动轨迹"],["把布朗运动当成分子运动（这是最典型的错误）","认为温度越低布朗运动越明显","认为布朗运动是化学反应或对流引起的"],["布朗运动与分子热运动的关系","影响布朗运动明显程度的因素","布朗运动与扩散现象的比较","分子热运动的实验证据"]],"分子动能与势能":["#F39C12","分子永不停息地做无规则运动，因此具有分子动能；分子间存在相互作用力，因此具有分子势能。两者之和就是物体的内能。温度是分子平均动能的标志，分子势能则与分子间距有关。",[["Ek = ½mv²","单个分子的动能"],["Ep 与 r 有关","分子势能"],["U = ΣEk + ΣEp","内能"]],["温度是分子平均动能的标志","分子势能在 r = r₀ 处最小","理想气体忽略分子势能，内能只由温度决定","内能是所有分子动能与势能的总和"],["分子平均动能与温度的关系","分子势能随距离的变化","内能与温度、体积的关系","理想气体内能只与温度有关","内能与机械能的区别"],["认为温度高的物体内能一定大","把分子平均动能与单个分子的动能混淆"],["温度与平均动能","分子势能曲线","内能的比较"]],"气体固体和液体":["#F39C12","气体分子间距大、作用力可忽略，用压强、体积、温度三个参量描述状态。三个实验定律分别对应等温、等容、等压三种过程，综合起来就是理想气体状态方程。固体分晶体与非晶体，液体则有表面张力等特有现象。",[["pV/T = C","理想气体状态方程"],["p₁V₁ = p₂V₂","玻意耳定律（等温）"],["p₁/T₁ = p₂/T₂","查理定律（等容）"],["V₁/T₁ = V₂/T₂","盖-吕萨克定律（等压）"]],["三个实验定律都是状态方程在某个量不变时的特例","温度必须用热力学温度","晶体有固定熔点，非晶体没有","表面张力使液面趋于收缩到最小面积"],["气体压强的微观解释","三个实验定律的适用条件","理想气体状态方程的综合应用","晶体与非晶体的区别","液体表面张力与浸润现象","饱和汽与相对湿度"],["把摄氏温度直接代入气体定律","认为非晶体没有确定的熔点却仍是固体"],["气体状态变化的图像","变质量问题","晶体与非晶体的判断","表面张力现象"]],"气体定律":["#F39C12","描述理想气体压强、体积、温度三者关系的规律。三个实验定律分别对应等温、等容、等压三种特殊过程，统一起来就是理想气体状态方程。处理气体问题的方法固定：确定研究对象 → 找出初末状态参量 → 选合适定律 → 列式求解。",[["pV/T = C","一定质量的理想气体，状态方程"],["p₁V₁/T₁ = p₂V₂/T₂","两状态形式"],["pV = nRT","克拉珀龙方程"]],["三个实验定律是状态方程在某一量不变时的特例","热力学温度 T = t + 273.15 K，气体定律中必须用热力学温度"],["等温变化（玻意耳定律）：pV = 常量","等容变化（查理定律）：p/T = 常量","等压变化（盖-吕萨克定律）：V/T = 常量","解题时必须把摄氏温度换算成热力学温度","确定研究对象：封闭气体，质量不变","p-V 图、p-T 图、V-T 图上各过程的图线形状要能互画"],["温度用摄氏度代入（必须用热力学温度）","研究对象质量发生变化时仍用状态方程（应分两部分处理）","压强计算时忘记加上大气压或液柱压强"],["三种等值变化的计算","气体图像的分析与转换","变质量问题（充气、抽气、漏气）","与力学结合的封闭气体压强计算"]],"玻意耳定律":["#F39C12","一定质量的理想气体在温度不变时，压强与体积成反比。等温过程在 p-V 图上是双曲线的一支。它的微观解释是：温度不变则分子平均动能不变，体积减小则分子数密度增大，单位时间撞击器壁的次数增多，压强增大。",[["p₁V₁ = p₂V₂","等温过程"],["p = C/V","反比关系"],["p-V 图线为双曲线","离原点越远的曲线温度越高"]],["等温线在 p-V 图上越远离原点，对应温度越高" ",[["F = αL","表面张力（α 为表面张力系数）"],["—","毛细现象定性分析"]],["表面张力使液面趋于收缩到最小面积","浸润液体在毛细管中上升，不浸润液体下降","表面张力产生在液面内，方向与液面相切","小液滴趋于球形是表面张力的结果"],["表面张力的成因","浸润与不浸润","毛细现象","表面张力使液面收缩","生活中的表面张力现象"],["认为表面张力是液面与容器之间的力","把浸润与不浸润的升降方向记反"],["表面张力的成因","毛细现象","浸润与不浸润"]],"热力学定律":["#F39C12","热力学的两条基本定律。第一定律是包含热现象的能量守恒，第二定律指明自然过程的方向性——孤立系统的熵永不减少。前者告诉你「能量怎么算」，后者告诉你「过程往哪走」。",[["ΔU = W + Q","第一定律，W 为外界对气体做功"],["ΔU = Q − W′","W′ 为气体对外做功"],["η = W/Q₁","热机效率"]],["第一定律中 W 的正负约定是易错点：外界对气体做功为正","第二定律的两种表述（克劳修斯、开尔文）等价，都指向不可逆性"],["第一定律：内能变化等于做功与热传递之和","第二定律：热量不能自发地从低温物体传到高温物体","第二定律的统计意义：孤立系统总是从有序走向无序","两类永动机都不可能实现：违反第一类或第二类定律","热机效率不可能达到 100%","第二定律是过程方向性的表述，不涉及具体时间"],["做功与热传递的正负号搞反","认为第二定律意味着「能量不守恒」","认为热量不能从低温传到高温（冰箱、空调可以，但需外界做功）"],["第一定律的符号与计算","第二定律的方向性判断","热机效率与永动机","两类永动机的辨析"]],"热力学第一定律":["#F39C12","ΔU = W + Q：系统内能的改变等于外界对系统做的功与系统吸收的热量之和。它是包含热现象的能量守恒定律，把做功与热传递这两种改变内能的方式统一在一个式子里。",[["ΔU = W + Q","W 外界对气体做功为正，Q 吸热为正"],["W = pΔV","等压过程中气体做功"],["ΔU = 0（等温）","理想气体内能只与温度有关"]],["理想气体的内能只与温度有关：等温过程 ΔU = 0，因此 Q = −W","绝热过程 Q = 0，因此 ΔU = W"],["改变内能的两种方式：做功和热传递，效果相同但本质不同","符号规定：外界对气体做功 W > 0，气体吸热 Q > 0，内能增加 ΔU > 0","等温过程：ΔU = 0，吸收的热量全部用来对外做功","等容过程：W = 0，吸收的热量全部用于增加内能","绝热过程：Q = 0，外界做功全部转化为内能","自由膨胀：不做功、不吸热，内能不变（理想气体）"],["W 的正负号搞反，导致整题方向错","认为「吸热就一定升温」（等温膨胀时吸热但温度不变）","对非理想气体直接套用「内能只与温度有关」"],["四种特殊过程的能量分析","气缸类综合题","图像与第一定律结合","绝热与自由膨胀"]],"熵增加原理":["#F39C12","孤立系统中一切自发过程都朝着熵增加的方向进行，熵是系统无序程度的量度。这条原理给出了热力学第二定律的定量表述，也解释了为什么时间有方向——从有序到无序是自然趋势。",[["ΔS ≥ 0（孤立系统）","熵增原理"],["ΔS = Q_可逆/T","熵变的计算（可逆过程）"]],["熵是状态函数，只与初末状态有关，与过程无关","熵增加意味着系统无序度增大、可用能减少"],["熵是系统无序程度的量度，熵越大越无序","孤立系统的熵永不减少，这就是熵增原理","自发过程的方向：从有序到无序、从高温到低温、从高压到低压","熵增原理是第二定律的统计表述","生命体可以通过从环境摄取负熵维持有序，但总熵仍在增加","熵增不意味着「混乱必然发生」，而是「概率更大的状态更容易出现」"],["认为熵增原理适用于任何系统（只适用于孤立系统）","把熵等同于「混乱」而忽略其统计本质","认为熵减少的过程绝对不可能（开放系统可以）"],["熵增与过程方向性","第二定律的统计解释","能量品质与可用能","热现象的方向性判断"]],"光学":["#9B59B6","研究光的传播、干涉、衍射、偏振等现象。几何光学用光线模型处理反射折射，物理光学用波动性解释干涉衍射，而偏振现象则确证了光是横波。这一章的特点是：现象多、公式少，考的是对现象成立条件的辨析。",[["n = sinθ₁/sinθ₂","折射定律"],["n = c/v","折射率与光速的关系"],["sin C = 1/n","全反射临界角"],["Δx = Lλ/d","双缝干涉条纹间距"]],["光在介质中的频率不变，波速与波长都变小","干涉与衍射都是波特有的现象，偏振证明光是横波"],["几何光学：光的直线传播、反射、折射、全反射","物理光学：干涉、衍射、偏振，体现光的波动性","光的颜色由频率决定，频率越高折射率越大","光从光疏介质进入光密介质，速度减小、波长变短、频率不变","同一介质对不同色光折射率不同，这是色散的原因","光电效应体现光的粒子性，与波动性共同构成波粒二象性"],["认为光进入介质后频率改变（频率由光源决定，不变）","把干涉与衍射的条件混淆","认为偏振现象说明光是纵波"],["折射与全反射综合","干涉条纹间距的计算与比较","光的波动性实验现象辨析","几何光学与物理光学综合"]],"光":["#9B59B6","光从一种介质斜射入另一种介质时，传播方向发生改变的现象。入射角与折射角的正弦之比等于两种介质折射率之比，这就是折射定律。折射的本质是光在不同介质中传播速度不同。",[["n₁sinθ₁ = n₂sinθ₂","折射定律（斯涅尔定律）"],["sinθ₁/sinθ₂ = n₂/n₁","相对折射率形式"],["n = c/v","绝对折射率"]],["光从光疏介质进入光密介质，折射角小于入射角，光线向法线偏折","光路是可逆的，反过来入射角与折射角互换"],["入射角、折射角都是光线与法线的夹角，不是与界面的夹角","折射率大的介质为光密介质，光在其中速度小","光垂直入射时传播方向不变，但仍发生折射（速度改变）","折射时频率不变，波速与波长改变","视深与实际深度的关系：h_视 = h/n","棱镜、透镜、海市蜃楼都是折射的应用"],["把入射角当成光线与界面的夹角","认为垂直入射时不发生折射（速度仍改变，只是方向不变）","光路可逆时把两种介质的折射率弄反"],["折射定律的计算","视深与视高问题","三棱镜与色散","光路可逆的应用"]],"折射率":["#9B59B6","描述介质对光偏折本领的物理量，定义为光在真空中的速度与在介质中速度之比，也等于入射角与折射角的正弦之比。它由介质与光的频率共同决定，因此同一介质对不同色光的折射率不同。",[["n = c/v","定义式，c 为真空中光速"],["n = sinθ₁/sinθ₂","测量式"],["n = 1/sin C","与临界角的关系"],["λ_介质 = λ_真空/n","介质中波长"]],["同一介质中，频率越高的光折射率越大（紫光 > 红光）","折射率由介质和光的频率共同决定，与入射角无关"],["n > 1，因为光在介质中的速度总小于真空中的速度","折射率越大，光偏折越明显，临界角越小","白光通过棱镜发生色散，是因为各色光折射率不同","频率与折射率的对应关系：紫光频率高、折射率大、临界角小","光在介质中的波长变短，但颜色（频率）不变","相对折射率 n₂₁ = n₂/n₁"],["认为折射率与入射角有关（由介质和频率决定）","认为光进入介质后颜色改变（频率不变，颜色不变）","把折射率与密度直接挂钩（二者无必然关系）"],["折射率的计算与比较","色散现象与各色光参量比较","临界角与折射率的关系","光在介质中的波长与速度"]],"全反射":["#9B59B6","光从光密介质射向光疏介质时，若入射角大于临界角，折射光线消失，光全部返回原介质的现象。发生条件是「光密到光疏」加「入射角大于等于临界角」，二者缺一不可。",[["sin C = 1/n","临界角，n 为光密介质的折射率"],["n = 1/sin C","由临界角求折射率"],["C = arcsin(1/n)","临界角计算"]],["只有光从光密介质射向光疏介质时才可能发生全反射","折射率越大，临界角越小，越容易发生全反射"],["发生条件：光密 → 光疏，且入射角 ≥ 临界角","临界角对应折射角等于 90° 的状态","全反射时没有折射光线，能量全部返回原介质","光导纤维、全反射棱镜、海市蜃楼都利用全反射","水中气泡看起来发亮，是全反射的结果","全反射是折射的极限情况，不是反射定律的例外"],["认为从光疏到光密也能全反射（不能）","把临界角公式记成 sin C = n","忽略「入射角大于临界角」这一条件"],["全反射条件的判断","临界角与折射率的互算","光导纤维与全反射棱镜","几何光学作图与计算"]],"光导纤维":["#9B59B6","利用全反射原理传导光信号的细玻璃丝，由高折射率的纤芯和低折射率的包层组成。光在纤芯与包层的界面上不断发生全反射，从而沿光纤传播，几乎不损失能量。",[["sin C = n_包层/n_纤芯","全反射临界角"],["n_纤芯 > n_包层","全反射的必要条件"],["v = c/n","光在纤芯中的速度"]],["纤芯折射率必须大于包层折射率，否则无法全反射","光纤通信的优点是容量大、损耗小、抗干扰强"],["结构：内层纤芯（高折射率）+ 外层包层（低折射率）","原理：光在纤芯内壁发生全反射，沿轴向传播","入射角必须大于临界角才能全反射","光纤弯曲半径过小时，入射角减小，可能漏光","光信号在光纤中传播时频率不变，速度由折射率决定","内窥镜、光纤通信、传感器都基于此原理"],["把纤芯与包层的折射率大小关系弄反","认为光纤中光沿直线传播（实际是不断全反射的折线）","忽略弯曲对全反射条件的影响"],["光纤中的全反射计算","临界角与折射率的应用","光纤通信的物理原理","几何光学综合题"]],"光的干涉":["#9B59B6","两列频率相同、相位差恒定、振动方向相同的光波叠加，在某些区域始终加强、某些区域始终减弱，形成明暗相间的条纹。它是光具有波动性的直接证据，也是精密测量（如测波长、测微小厚度）的手段。",[["Δr = kλ（明纹）","光程差为波长整数倍"],["Δr = (2k+1)λ/2（暗纹）","光程差为半波长奇数倍"],["Δx = Lλ/d","双缝干涉条纹间距"]],["相干条件：频率相同、相位差恒定、振动方向相同，三者缺一不可","白光干涉出现彩色条纹，是因为各色光波长不同、条纹间距不同"],["干涉是波特有的现象，证明光具有波动性","明纹条件是光程差为波长整数倍，暗纹是半波长奇数倍","相干光源的获得：把同一光源的光分成两束（双缝、薄膜）","条纹间距与波长成正比、与双缝间距成反比","白光干涉中央为白色亮纹，两侧为彩色条纹","干涉条纹是等间距的，这是与衍射条纹的重要区别"],["认为任意两束光都能干涉（必须满足相干条件）","明暗纹条件记反","把干涉条纹（等间距）与衍射条纹（不等间距）混淆"],["双缝干涉条纹间距计算","明暗纹位置判断","薄膜干涉的应用","波长测量实验"]],"双缝干涉":["#9B59B6","托马斯·杨用双缝把一束光分成两束相干光，在屏上形成等间距的明暗条纹，首次用实验证明了光的波动性。条纹间距 Δx = Lλ/d 是这一实验的核心公式，也是测量光波长的方法。",[["Δx = Lλ/d","条纹间距，L 为缝屏距离，d 为双缝间距"],["λ = dΔx/L","由条纹间距测波长"],["Δx ∝ λ","红光条纹间距大于紫光"]],["条纹间距与波长成正比，因此红光条纹最宽、紫光最窄","d 是双缝间距，L 是双缝到屏的距离，二者不能混淆"],["实验装置：单缝（保证相干性）+ 双缝（分光）+ 屏（观察条纹）","条纹是等间距的明暗相间条纹","中央为明纹，两侧对称分布","增大缝屏距离 L，条纹间距变大","减小双缝间距 d，条纹间距变大","用白光照射时中央为白色，两侧为彩色条纹"],["把 d 当成缝宽（应为双缝间距）","认为条纹间距与波长成反比","实验中使用白光却期待单色条纹"],["条纹间距的计算与比较","测波长实验的数据处理","装置改动对条纹的影响","白光与单色光条纹的区别"]],"薄膜干涉":["#9B59B6","光照射到薄膜上，从前后两个表面反射的两列光波叠加产生干涉。由于薄膜厚度不均，不同位置的光程差不同，形成明暗相间的条纹。肥皂膜、油膜、增透膜、检测平整度都基于此原理。",[["Δr = 2d（垂直入射）","薄膜干涉的光程差，d 为膜厚"],["2d = kλ（明纹）","厚度为半波长整数倍"],["2d = (2k+1)λ/2（暗纹）","厚度为四分之一波长奇数倍"]],["薄膜干涉是等厚干涉：同一厚度的位置对应同一条纹","增透膜厚度为 λ/4，使反射光相互抵消"],["光在薄膜前后表面反射，两列反射光叠加产生干涉","薄膜厚度变化导致条纹弯曲，可用来检测表面平整度","肥皂膜上的彩色条纹是薄膜干涉的结果","增透膜利用干涉相消减少反射、增加透射","条纹的疏密反映薄膜厚度的变化快慢","白光照射时因各色光波长不同，出现彩色条纹"],["把薄膜干涉与衍射混淆","认为增透膜越厚越好（应为 λ/4）","忽略半波损失对明暗条件的影响"],["薄膜干涉条纹的分析","增透膜与高反膜","检测平整度的原理","肥皂膜彩色条纹的解释"]],"光的衍射":["#9B59B6","光绕过障碍物偏离直线传播的现象。当障碍物或孔的尺寸与波长可比时，衍射现象明显。它同样证明光的波动性，与干涉的区别在于：干涉是两束光的叠加，衍射是同一束光无数子波的叠加。",[["缝宽 a 越小，衍射越明显","定性规律"],["a ~ λ 时衍射最明显","明显衍射的条件"],["单缝衍射条纹不等间距","与双缝干涉的区别"]],["明显衍射的条件：障碍物或孔的尺寸与波长相差不多或更小","单缝衍射条纹中央最宽最亮，两侧逐渐变窄变暗，不等间距"],["衍射是波绕过障碍物继续传播的现象","一切波都能衍射，明显与否取决于尺寸与波长的关系","单缝衍射条纹：中央亮纹宽而亮，两侧不等间距","圆孔衍射形成明暗相间的同心圆环","衍射现象说明光沿直线传播只是近似","泊松亮斑是衍射的著名证据"],["认为只有缝很小时才有衍射（任何情况都有，只是不明显）","把单缝衍射条纹与双缝干涉条纹混淆（前者不等间距）","认为衍射否定了光的直线传播（直线传播是近似）"],["衍射现象的判断","单缝衍射与双缝干涉的条纹比较","明显衍射的条件","衍射与波动性的关系"]],"光的偏振":["#9B59B6","光波的振动方向在垂直于传播方向的平面内不均匀分布的现象。自然光在各个方向振动均匀，通过偏振片后成为偏振光。偏振现象确证了光是横波，这是纵波不可能具有的性质。",[["I = I₀cos²θ","马吕斯定律，θ 为偏振方向夹角"],["自然光通过偏振片后强度减半","I = I₀/2"]],["偏振是横波特有的现象，纵波没有偏振","自然光通过两个偏振片，转动其中一个，透射光强周期性变化"],["光是横波，振动方向垂直于传播方向，这是偏振的前提","自然光各方向振动均匀，偏振光只在一个方向振动","偏振片只允许某一方向的光振动通过","两偏振片偏振方向垂直时，透射光强为零","反射光、折射光通常是部分偏振光","偏振现象在摄影、液晶显示、立体电影中有广泛应用"],["认为纵波也能偏振","把偏振与干涉、衍射混为一谈","认为自然光通过偏振片后强度不变"],["偏振现象与横波特性","马吕斯定律的计算","偏振片组合的透射光强","偏振的实际应用"]],"激光":["#9B59B6","激光是受激辐射产生的光，具有相干性好、平行度好、亮度高的特点。它在测距、通信、医疗、加工等领域有广泛应用。",[["—","本节以特性与应用为主"]],["激光是相干光，频率单一、相位一致","激光平行度极好，几乎是一束不发散的光","激光亮度极高，能量可以高度集中","激光是受激辐射而非自发辐射"],["激光的三个特性","激光的产生原理：受激辐射","激光的应用","激光与普通光的区别","全息照相的原理"],["把激光当成普通强光","认为激光的相干性来自滤波"],["激光的特性","激光的应用","受激辐射"]],"近代物理":["#1ABC9C","把研究尺度推进到原子（10⁻¹⁰ m）与原子核（10⁻¹⁵ m）的物理。两条主线：一是光的粒子性（光电效应、光子说），二是原子的结构与核的变化（散射实验、玻尔模型、放射性、核反应）。它颠覆了经典物理的连续性观念，引入量子化与波粒二象性。",[["ε = hν","光子能量"],["E<sub>k</sub> = hν − W₀","光电效应方程"],["E = Δmc²","质能方程"],["hν = E<sub>m</sub> − E<sub>n</sub>","能级跃迁"]],["量子化的核心：能量、角动量、能级都是分立的，不能连续取值","波粒二象性：光与实物粒子都既有波动性又有粒子性"],["光电效应证明光的粒子性，干涉衍射证明波动性","原子核式结构由 α 粒子散射实验确立","玻尔模型引入量子化假设，成功解释氢原子光谱","天然放射现象说明原子核有内部结构","核反应遵循质量数守恒与电荷数守恒","质能方程揭示质量与能量的等价性"],["认为光电效应否定了光的波动性（应为补充，构成波粒二象性）","把质量数守恒与质量守恒混淆（核反应有质量亏损）","认为原子核由质子和电子组成（由质子和中子组成）"],["光电效应规律与图像","能级跃迁与光谱","核反应方程配平","质能方程与核能计算"]],"原子结构与波粒二象性":["#1ABC9C","从光电效应开始，人们认识到光具有粒子性；α 粒子散射揭示了原子的核式结构；玻尔模型用能级量子化解释了氢光谱；德布罗意进一步提出实物粒子也有波动性。这一章的核心是「量子化」与「波粒二象性」。",[["hν = W + Ek","爱因斯坦光电方程"],["hν = Eₘ − Eₙ","能级跃迁"],["λ = h/p","德布罗意波长"],["E = hν","光子能量"]],["光既有波动性又有粒子性，二者互补","光电效应的四条规律经典理论无法解释","原子只能处于分立的能级，跃迁时吸收或放出光子","实物粒子的波动性已被电子衍射实验证实"],["光电效应的实验规律","爱因斯坦光电方程与图像","α 粒子散射与核式结构","玻尔模型的三条假设与氢光谱","德布罗意波与物质波","波粒二象性的统一"],["认为光的波动性与粒子性不能共存","把截止频率与入射光强度联系起来"],["光电效应的图像","能级跃迁与光谱","物质波波长的计算"]],"光电效应":["#1ABC9C","光照射到金属表面时，金属中的电子吸收光子能量逸出的现象。四条实验规律无法用经典波动理论解释，迫使人们接受光的粒子性：存在截止频率、瞬时性、最大初动能与光强无关、饱和电流与光强成正比。",[["E<sub>k</sub> = hν − W₀","最大初动能"],["W₀ = hν₀","逸出功与截止频率"],["eU<sub>c</sub> = E<sub>k</sub>","遏止电压"],["I_饱和 ∝ 光强","饱和电流与光强的关系"]],["能否发生光电效应只取决于入射光频率是否大于截止频率，与光强无关","最大初动能随频率增大而增大，与光强无关"],["存在截止频率：低于该频率无论光多强都不发生光电效应","瞬时性：光照后几乎立刻有电子逸出（10⁻⁹ s 内）","最大初动能随入射光频率增大而增大，与光强无关","饱和电流与入射光强度成正比","遏止电压 U<sub>c</sub> 与最大初动能的关系：eU<sub>c</sub> = E<sub>k</sub>","E<sub>k</sub>-ν 图像是一条直线，斜率为 h，横截距为截止频率"],["认为光强越大越容易发生光电效应（关键看频率）","认为增大光强能增大最大初动能（只能增大饱和电流）","把遏止电压与加速电压混淆"],["光电效应规律的判断","E<sub>k</sub>-ν 图像求普朗克常量与逸出功","遏止电压的计算","光电效应与经典理论的矛盾"]],"光子说":["#1ABC9C","爱因斯坦提出光由一份份能量组成，每一份叫光子，能量 ε = hν。光子说成功解释了光电效应，把光的粒子性重新引入物理学。光子的能量由频率决定，与光强无关；光强只决定单位时间内光子的数目。",[["ε = hν = hc/λ","光子能量"],["h = 6.63×10⁻³⁴ J·s","普朗克常量"],["E = nε","光强与光子数的关系"]],["光子能量只与频率有关，与光强无关","光强由单位时间通过单位面积的光子数决定"],["光是一份一份不连续的，每份能量为 hν","光子没有静止质量，但有动量 p = h/λ","光子能量与频率成正比、与波长成反比","增大光强只增加光子数，不增加单个光子能量","光子说与波动说并不矛盾，共同构成波粒二象性","光子说是量子论的开端，普朗克首先提出能量量子化"],["认为光强越大光子能量越大（能量只与频率有关）","把光子当成有静止质量的实物粒子","认为光子说完全取代了波动说"],["光子能量的计算","光强与光子数的关系","光子动量与波长","波粒二象性的理解"]],"爱因斯坦光电方程":["#1ABC9C","E<sub>k</sub> = hν − W₀，即电子吸收一个光子后，扣除逸出功，剩余能量全部转化为电子的最大初动能。这个方程是能量守恒在光电效应中的体现，也是光子说的核心证据。",[["E<sub>k</sub> = hν − W₀","光电方程"],["W₀ = hν₀","逸出功"],["E<sub>k</sub> = eU<sub>c</sub>","与遏止电压的关系"],["hν = W₀ + eU<sub>c</sub>","综合形式"]],["方程中的 E<sub>k</sub> 是最大初动能，不是所有电子的动能","逸出功 W₀ 是金属的固有属性，不同金属不同"],["电子一次只吸收一个光子，能量一次到位","只有 hν > W₀ 时才能发生光电效应","hν = W₀ 时对应截止频率，E<sub>k</sub> = 0","最大初动能与频率成线性关系，斜率为 h","不同金属的直线平行，横截距不同（逸出功不同）","方程体现了能量守恒：光子能量 = 逸出功 + 最大初动能"],["把 E<sub>k</sub> 当成所有逸出电子的动能","认为电子可以累积多个光子的能量","图像题中把斜率当成逸出功"],["光电方程的基本计算","E<sub>k</sub>-ν 图像的斜率与截距","不同金属的图像比较","遏止电压与频率的关系"]],"原子结构":["#1ABC9C","人类对原子内部结构的认识经历了三个阶段：汤姆孙的枣糕模型、卢瑟福的核式结构模型、玻尔的量子化模型。每一次修正都源于新实验事实与旧理论的矛盾，这是物理学「实验—模型—修正」循环的经典案例。",[["原子直径约 10⁻¹⁰ m","原子尺度"],["原子核直径约 10⁻¹⁵ m","核尺度"],["核外电子绕核运动","核式结构模型"]],["α 粒子散射实验是核式结构模型的实验基础","核式结构模型无法解释原子的稳定性和线状光谱，这是玻尔模型出现的动因"],["汤姆孙发现电子，提出枣糕模型（正电荷均匀分布）","卢瑟福由 α 粒子散射实验提出核式结构模型","核式结构：原子中心有很小的核，集中了全部正电荷和几乎全部质量","核外电子在核的库仑力作用下绕核运动","经典理论无法解释：加速电子应辐射能量而坠入核，且光谱应为连续","玻尔在此基础上引入量子化假设"],["认为原子核由质子和电子组成（应为质子和中子）","把 α 粒子散射实验与光电效应混淆","认为核式结构模型完美无缺（它无法解释稳定性与线状光谱）"],["α 粒子散射实验的现象与结论","三种原子模型的比较","经典理论的困难","原子尺度与核尺度的数量级"]],"α粒子散射":["#1ABC9C","卢瑟福用 α 粒子轰击金箔，发现绝大多数 α 粒子几乎不偏转，少数发生较大偏转，极少数（约八千分之一）偏转超过 90° 甚至被反弹。这一结果否定了枣糕模型，确立了核式结构模型。",[["绝大多数不偏转","说明原子内部大部分是空的"],["极少数大角度偏转","说明存在体积小、质量大、电荷集中的核"]],["偏转角越大，说明 α 粒子越接近核，受到的库仑斥力越大","实验用金箔是因为金延展性好，可做得很薄"],["实验装置：放射源、金箔、荧光屏、显微镜（可转动）","绝大多数 α 粒子几乎沿原方向前进 → 原子内部大部分是空的","少数发生较大偏转 → 遇到了集中的正电荷","极少数被反弹 → 核的质量和电荷量都很大、体积很小","由实验估算出原子核的直径约为 10⁻¹⁵ m，是原子的十万分之一","α 粒子偏转是库仑斥力作用的结果，不是碰撞"],["认为 α 粒子是与电子碰撞而偏转（电子质量太小，不足以使其大角度偏转）","认为偏转是引力造成的（同种正电荷相斥）","忽略「极少数」这个关键比例"],["实验现象与结论的对应","核式结构模型的推断过程","α 粒子偏转的原因分析","原子核尺度的估算"]],"玻尔模型":["#1ABC9C","在核式结构基础上引入三条量子化假设：定态假设（电子只能在特定轨道上运动且不辐射）、跃迁假设（能级间跃迁吸收或辐射光子）、轨道量子化假设。它成功解释了氢原子光谱，是量子理论走向成熟的里程碑。",[["hν = E<sub>m</sub> − E<sub>n</sub>","跃迁时吸收或辐射的光子能量"],["E<sub>n</sub> = −13.6/n² eV","氢原子能级"],["r<sub>n</sub> = n²r₁","轨道半径量子化"],["E<sub>n</sub> ∝ −1/n²","能级公式"]],["n 越大，能级越高、能量越接近零（负得越少），轨道半径越大","一群氢原子从 n 能级跃迁最多可辐射 n(n−1)/2 种频率的光子"],["定态假设：电子在特定轨道上运动时不辐射能量，这些状态叫定态","跃迁假设：电子在不同定态间跃迁时，吸收或辐射能量为 hν 的光子","轨道量子化：电子的轨道半径只能取分立值","基态最稳定，能量最低；激发态不稳定，会自发跃迁回低能级","能级差越大，辐射光子的频率越高、波长越短","玻尔模型只对氢原子和类氢离子成功，对多电子原子失效"],["认为电子在定态时不运动（仍在运动，只是不辐射）","把「一个氢原子」与「一群氢原子」的跃迁种类数混淆","认为能级越高能量越大所以越稳定（实际越不稳定）"],["能级跃迁与光谱线计算","光子能量与频率波长的换算","电离能与能级图","一群原子跃迁的种类数"]],"物质波":["#1ABC9C","德布罗意提出，实物粒子也具有波动性，波长与动量成反比。电子衍射实验证实了这一预言，波粒二象性因此成为所有微观粒子的普遍属性。",[["λ = h/p = h/(mv)","德布罗意波长"],["p = h/λ","动量与波长的关系"]],["任何运动的物体都对应一种物质波，只是宏观物体波长极小","电子衍射实验证实了物质波的存在","波长与动量成反比，动量越大波长越短","波粒二象性是微观粒子的普遍属性"],["德布罗意关系式","物质波的实验验证","宏观物体波长极小的估算","波粒二象性的普遍性","电子显微镜的原理"],["认为只有光才具有波粒二象性","把物质波当成机械波"],["德布罗意波长的计算","物质波的实验验证","波粒二象性"]],"原子核":["#1ABC9C","原子中心体积极小、质量极大的部分，由质子和中子（统称核子）组成。质子数决定元素种类，中子数决定同位素。核内质子间存在强大的库仑斥力，靠核力（强相互作用）维系，核力是短程力。",[["A = Z + N","质量数 = 质子数 + 中子数"],["电荷数 Z 决定元素种类","质子数"],["质量亏损 Δm = Zm<sub>p</sub> + Nm<sub>n</sub> − M","核的质量亏损"]],["同位素：质子数相同、中子数不同的原子核","核力是短程力，只在 10⁻¹⁵ m 范围内起作用"],["原子核由质子和中子组成，二者统称核子","质子数（电荷数）决定元素种类，中子数决定同位素","质量数 A = 质子数 Z + 中子数 N","核力是强相互作用，短程、饱和、与电荷无关","核内质子间的库仑斥力被核力克服","核子平均质量随质量数变化，中等质量的核最稳定"],["认为原子核由质子和电子组成（中子是独立粒子）","把质量数与质量混淆","认为核力是电磁力的一种"],["质子数、中子数、质量数的换算","同位素与元素的概念","核力的性质","核的稳定性与比结合能"]],"天然放射现象":["#1ABC9C","原子核自发地放出射线的现象，说明原子核有内部结构。三种射线中 α 射线是氦核流、β 射线是电子流、γ 射线是高频电磁波。放射性衰变遵循电荷数守恒与质量数守恒，具有统计规律与半衰期。",[["α 衰变：A → A−4，Z → Z−2","放出氦核"],["β 衰变：A 不变，Z → Z+1","中子转化为质子"],["N = N₀(1/2)^(t/T)","半衰期公式"],["m = m₀(1/2)^(t/T)","质量随时间的变化"]],["半衰期是统计规律，只对大量原子核有意义，与温度、压强、化学状态无关","β 衰变的实质是核内中子转化为质子和电子"],["α 射线电离能力强、穿透能力弱（一张纸可挡）","β 射线电离能力较弱、穿透能力较强（几毫米铝板可挡）","γ 射线电离能力最弱、穿透能力最强（需厚铅板）","α 衰变质量数减 4、电荷数减 2","β 衰变质量数不变、电荷数加 1","半衰期由核本身决定，不受外界条件影响"],["认为加热或加压能改变半衰期","把 β 衰变当成核外电子被电离","认为半衰期是「原子核数量减半所需时间的一半」"],["三种射线的性质比较","衰变次数的计算","半衰期的应用","放射性在医学与考古中的应用"]],"核反应方程":["#1ABC9C","原子核在其他粒子作用下发生变化，或自发衰变的过程，用方程表示。书写时必须遵循两条守恒：质量数守恒、电荷数守恒。常见类型有衰变、人工转变、裂变、聚变。",[["质量数守恒：ΣA 反应前 = ΣA 反应后","配平依据之一"],["电荷数守恒：ΣZ 反应前 = ΣZ 反应后","配平依据之二"],["²³⁵U + n → ¹⁴⁴Ba + ⁸⁹Kr + 3n","裂变示例"],["²H + ³H → ⁴He + n","聚变示例"]],["核反应方程用箭头而非等号，因为反应不可逆","质量数守恒不等于质量守恒，核反应存在质量亏损"],["配平依据：质量数守恒与电荷数守恒","衰变：自发进行，不需要外界粒子轰击","人工转变：用 α 粒子、质子、中子轰击靶核（如发现质子、中子）","裂变：重核分裂为中等质量核，同时放出中子并释放能量","聚变：轻核结合成较重的核，释放能量更大（如太阳内部）","裂变需要临界体积，聚变需要极高温度"],["用等号写核反应方程","认为质量数守恒就是质量守恒（有质量亏损）","裂变与聚变的反应物搞混"],["核反应方程配平","衰变次数的计算","裂变与聚变的能量比较","人工核转变的发现史"]],"质能方程":["#1ABC9C","E = mc²，揭示质量与能量的等价性。核反应中出现的质量亏损会转化为巨大的能量释放，ΔE = Δmc²。这是核能利用的理论基础，也是理解恒星发光、核电站发电的关键。",[["E = mc²","质能方程"],["ΔE = Δmc²","质量亏损释放的能量"],["1 u 对应 931.5 MeV","原子质量单位的能量当量"],["比结合能 = 结合能/核子数","核的稳定程度"]],["质量亏损不是质量消失了，而是以能量的形式释放","中等质量核的比结合能最大，因此重核裂变与轻核聚变都能释放能量"],["质量与能量是同一事物的两种表现，可以相互转化","质量亏损 Δm 对应释放能量 ΔE = Δmc²","比结合能越大，原子核越稳定","裂变与聚变都使比结合能增大，因此都释放能量","核能计算常用 1 u = 931.5 MeV","核反应中质量数守恒但质量不守恒"],["把质量亏损理解为「质量消失了」","计算核能时单位换算出错（u 与 MeV）","认为比结合能越小越稳定"],["质量亏损与核能计算","比结合能曲线分析","裂变聚变的能量比较","结合能与电离能的区别"]],"核力与结合能":["#1ABC9C","核子之间通过核力结合成原子核。核力是短程强相互作用，只在约 10⁻¹⁵ m 内起作用，具有饱和性。核子结合成原子核时释放的能量叫结合能，比结合能越大原子核越稳定。",[["ΔE = Δmc²","结合能"],["比结合能 = 结合能/核子数","稳定性判据"]],["核力是短程力，只在相邻核子间起作用","比结合能曲线中间高两端低，铁附近最稳定","比结合能越大，原子核越难拆散","重核裂变与轻核聚变都向比结合能更大的方向走"],["核力的性质：短程、强、饱和","结合能与比结合能","比结合能曲线","核稳定性与比结合能的关系","裂变与聚变都放能的原因"],["把结合能大当成原子核稳定","认为核力是电磁力的一种"],["核力的性质","结合能与比结合能","比结合能曲线"]],"相对论":["#1ABC9C","狭义相对论建立在两条基本假设之上：相对性原理与光速不变原理。由此得出时间膨胀、长度收缩、质能关系等结论。它修正了经典时空观，但在低速下退化为牛顿力学。",[["Δt = Δt₀/√(1−v²/c²)","时间膨胀"],["L = L₀√(1−v²/c²)","长度收缩"],["m = m₀/√(1−v²/c²)","相对论质量"],["E = mc²","质能方程"]],["光速在任何惯性系中都是 c，与光源和观察者的运动无关","运动的钟变慢、沿运动方向的尺变短","质量与能量是同一事物的两种量度","低速时相对论效应可忽略，退化为经典力学"],["两条基本假设","时间膨胀与长度收缩","相对论质量与质能关系","经典时空观的困难","相对论的实验验证"],["认为时间膨胀是钟出了问题","把长度收缩理解成物体被压扁"],["时间膨胀与长度收缩","质能关系","相对论的基本假设"]],"相对论初步":["#1ABC9C","爱因斯坦提出的时空理论。狭义相对论基于两条假设：相对性原理与光速不变原理，由此推出时间膨胀、长度收缩、质速关系与质能方程。它表明时间和空间都不是绝对的，而是与参考系有关。",[["Δt = Δt₀/√(1−v²/c²)","时间膨胀（动钟变慢）"],["L = L₀√(1−v²/c²)","长度收缩（动尺变短）"],["m = m₀/√(1−v²/c²)","质速关系"],["E = mc²","质能方程"]],["时间膨胀与长度收缩只在接近光速时明显，低速下退化为经典力学","光速是速度的上限，任何有静止质量的物体都不能达到光速"],["两条基本假设：相对性原理、光速不变原理","同时性是相对的，不同参考系对「同时」的判断不同","运动的钟走得慢（时间膨胀），运动的尺子沿运动方向变短","物体速度越大，质量越大，越难加速","光速是宇宙中的速度极限","经典力学是相对论在低速条件下的近似"],["认为时间膨胀是钟坏了（是时空性质，不是机械误差）","认为长度收缩是物体被压缩了","把相对论与量子力学混为一谈"],["时间膨胀与长度收缩的计算","相对论速度合成","质速关系与光速极限","经典力学的适用范围"]],"思想方法":["#7F8C8D","物理的难，一半在知识，一半在方法。这一模块把散落在各章里的通用方法抽出来：守恒、整体隔离、临界极值、图像、微元、等效替代。它们不属于某一章，但每一章都会用到。",[["ΣF外 = 0 ⟹ p 守恒","守恒的判据"],["ΣF = Σma","系统牛顿第二定律"],["I = ΣF·Δt","微元求和"],["等效替换","效果相同即可替换"]],["方法的价值在于「绕开过程细节」，直接联系初末状态","同一道题往往有多种方法，选对了能省一半时间","守恒的前提是判断条件，不是看到题就用","等效替代的前提是「效果相同」"],["守恒思想：动量、能量、电荷量","整体隔离法：先整体求加速度，再隔离求内力","临界极值法：把物理条件翻译成数学不等式","图像法：斜率、面积、截距的物理意义","微元法：把变化的过程切成可算的小段","等效替代法：合力、等效重力、等效电源"],["不判断条件就套用守恒定律","把等效当成相等"],["守恒量的选取","连接体的整体与隔离","临界条件的寻找","图像的斜率与面积"]],"守恒思想":["#7F8C8D","物理学中最强大的一类方法：不去追踪过程中的每个细节，只比较初末状态。能量守恒、动量守恒、电荷守恒、质量数守恒，背后都是对称性。当过程复杂到无法逐段分析时，守恒律往往能一步到位。",[["E₁ = E₂","能量守恒"],["Σp₁ = Σp₂","动量守恒"],["q₁ = q₂","电荷守恒"],["ΣA₁ = ΣA₂","质量数守恒"]],["守恒律的适用条件是「系统」而非「物体」，选对系统是第一步","守恒量往往对应某种对称性：时间平移对应能量，空间平移对应动量"],["能量守恒：各种形式的能量相互转化，总量不变","动量守恒：系统合外力为零时总动量不变","机械能守恒是能量守恒的特例，条件更苛刻","电荷守恒：电荷既不能被创造也不能被消灭","质量数守恒与电荷数守恒是核反应配平的依据","守恒法解题的优势：跳过过程细节，直接联系初末状态"],["不判断守恒条件就直接用守恒律","把「能量守恒」当成「机械能守恒」","系统选错，把外力当内力或反之"],["守恒律的选择与条件判断","多过程问题用守恒律简化","碰撞与爆炸中的守恒","核反应中的守恒"]],"整体隔离法":["#7F8C8D","处理多物体系统的核心方法。整体法把系统当作一个物体，只考虑外力，方程少；隔离法把某个物体单独取出，能求内力，但方程多。实战中通常先整体求加速度，再隔离求内力，两者交替使用。",[["F_外 = (Σm)a","整体法，要求加速度相同"],["F_内 = ma","隔离法"],["ΣF_外 = Σmᵢaᵢ","加速度不同时的系统式"]],["整体法的前提：各物体加速度相同（或可用 Σma 形式）","求内力必须隔离，整体法永远求不出内力"],["整体法：不涉及内力，适合求加速度或外力","隔离法：暴露内力，适合求绳张力、接触面弹力、摩擦力","标准流程：整体求 a → 隔离求内力","加速度不同时，用系统牛顿第二定律 ΣF = Σma（需分解到同一方向）","连接体、板块、传送带问题都适用这套方法","隔离时受力分析要完整，漏力是最常见的错误"],["加速度不同时硬套整体法","隔离时把内力与外力的方向搞错","整体法求内力（不可能求出）"],["连接体加速度与内力","板块模型","多物体系统的受力分析","传送带问题"]],"临界极值法":["#7F8C8D","当物体的受力或运动状态发生质变时，存在一个临界状态，对应某个物理量的极值。抓住「临界条件」是解题的关键，常见的临界词有：恰好、刚好、最大、最小、至少。",[["N = 0","接触面分离的临界"],["f = f<sub>max</sub> = μN","恰好滑动的临界"],["F<sub>n</sub> = mv²/r","绳模型最高点临界 v = √(gr)"],["a = g","完全失重的临界"]],["临界状态的特征是某个力恰好为零或某个条件恰好满足","极值问题常转化为「临界条件 + 数学求极值」两步"],["分离临界：接触面弹力 N = 0","滑动临界：静摩擦力达到最大值","绳松弛临界：绳的张力 T = 0","圆周运动最高点临界：绳模型 v = √(gr)，杆模型 v = 0","追及相遇临界：速度相等时距离取极值","数学方法：二次函数求极值、三角函数求极值、均值不等式"],["没有识别出临界词，直接按一般情况求解","临界条件写错（如把 N = 0 写成 N = mg）","求出临界值后没有讨论取值范围"],["恰好分离与恰好滑动","圆周运动的临界速度","追及相遇的最远最近距离","含摩擦的临界角"]],"图像法":["#7F8C8D","用图像描述物理规律、提取信息、求解问题的方法。图像的价值在于「一眼看出趋势与极值」，而斜率、面积、截距、交点这四个几何要素往往对应着关键的物理量。",[["v-t 图：斜率 = a，面积 = x","运动学"],["U-I 图：斜率 = R 或 r","电路"],["p-V 图：面积 = 功","热学"],["F-x 图：面积 = 功","力学"]],["读图三步：看坐标轴物理量与单位 → 看斜率面积的含义 → 看特殊点（截距、交点、极值）","图像不表示运动轨迹，这是最常见的误解"],["v-t 图：斜率表加速度，面积表位移，交点表速度相等","x-t 图：斜率表速度，交点表相遇","U-I 图：电源图线与外电阻图线的交点即工作点","p-V 图：图线下方面积表示气体做功","F-x 图：面积表示功","图像转换：由 v-t 画 x-t、由 Φ-t 画 E-t 等"],["把图像当成运动轨迹","求斜率时用两点连线代替切线（曲线应求切线斜率）","面积计算忘记正负号或单位换算"],["图像信息提取","图像斜率与面积的物理意义","图像转换","多图线比较与交点分析"]],"微元法":["#7F8C8D","把复杂过程分割成无数微小段，在每一小段内把变化的量视为不变，从而可以用初等规律处理，再求和（积分思想）。它是处理变力做功、变加速运动、非均匀分布问题的通用手段。",[["ΔW = F·Δx","微元功，F 在 Δx 内视为恒定"],["W = ΣF·Δx = F-x 图面积","求和得总功"],["Δv = a·Δt","微元速度变化"]],["微元法的本质是「以恒代变、以直代曲」，是微积分思想在中学的体现","图像法中的「面积」正是微元求和的几何表现"],["把过程分成极小的段，段内物理量近似不变","变力做功：把位移分成微元，每段内 F 视为恒定","变加速运动：把时间分成微元，每段内 a 视为恒定","非均匀带电体、非均匀流体的处理","微元求和的结果常表现为图像的面积","电磁感应中求电荷量 q = ΣIΔt 也用到微元思想"],["分段取得太大，导致「以恒代变」的近似失效","求和时忘记考虑方向（矢量微元）","把微元法当成严格的积分推导，忽略近似条件"],["变力做功","变加速运动的定性分析","流体冲击力","电磁感应中的电荷量"]],"等效替代法":["#7F8C8D","用效果相同的简单模型替代复杂的实际对象，从而简化问题。合力与分力、等效电路、等效摆长、等效重力加速度，都是这一思想的应用。它的合法性来自「效果相同」。",[["F_合 与分力效果相同","力的等效"],["R_等效 = 串并联化简","电路等效"],["g_等效 = g ± a","等效重力加速度"]],["等效的前提是「效果相同」，不能随意替换","等效替代与「近似」不同：等效在给定条件下是严格的"],["力的合成与分解：用合力替代多个分力","等效电路：把复杂电路化简为串并联","等效重力：在加速系统中把惯性效果并入重力","等效摆长：单摆的实际摆长是悬点到球心的距离","等效电源：把含源电路化为一个电源与内阻","等效替代简化问题的同时，也可能丢失某些细节信息"],["等效替代时改变了研究对象的运动状态","把等效当成近似，忽略了成立条件","等效重力方向判断错误"],["等效电路的化简","等效重力与加速系统","等效摆长与单摆周期","力的等效替代"]],"高中物理":["#2C3E50","高中物理沿「运动—力—能量—场」四条主线展开：力学研究宏观物体的运动与相互作用，电磁学用力的语言描述场，热学与光学分别用统计和波动的方法处理大量粒子与光，近代物理把视角推进到原子与核。贯穿全书的不是零散知识点，而是模型建构、守恒、对称、等效替代这几条思想主线。",[],["四条主线：力学 → 电磁学 → 热学与光学 → 近代物理","五个基本模型：质点、轻绳轻杆、点电荷、理想气体、理想变压器","通用解题路径：选对象 → 受力与状态分析 → 选规律列方程 → 量纲与极限检验"],["力学是全部内容的地基，电磁学里的带电粒子运动本质仍是力学问题","动量与能量的守恒律跨越所有模块，是跨章节综合题的通用工具","图像是物理的第二语言：v-t、x-t、U-I、p-V、波动图像各有固定读图套路","实验能力单独成块：器材选择、电路设计、数据处理、误差分析"],["不要按章节孤立记忆，同一模型会在不同模块反复出现（圆周运动在万有引力与磁场中都是同一套方程）","公式记条件比记形式更重要，绝大多数失分来自「用了不适用的公式」"],["多过程多对象综合题","图像与公式结合题","信息给予题与实验设计题"]]};
