同」要求感应电流产生向里的磁场，由安培定则电流为顺时针","右手定则：左侧那条边在磁场内、向右切割磁感线，四指指向向上，即该边电流向上","左侧边电流向上，对应的正是顺时针方向","两种方法结论一致"],"a":"顺时针方向；两种方法殊途同归","c":"方法选择：整个回路的磁通量变化用楞次定律，单根导体切割用右手定则","x":"记「楞次定律管回路、右手定则管导体」，两条路必然一致，可用来自检"}],"v":["判断该用哪个定则","两种方法互相验证","整个回路用楞次定律","单根导体切割用右手定则","两种方法结论必然一致"]}],"欧姆定律":[{"t":"伏安特性曲线与非线性电阻","f":"由 U-I 图线求电阻、功率，或判断电阻随温度（电压）的变化趋势","k":"线性元件的图线斜率就是 R；非线性元件某点的电阻只能用该点的 U/I，绝不能用切线斜率","q":[{"q":"某小灯泡的 U-I 图线为曲线，当电压为 6 V 时电流为 0.5 A。求此时灯丝的电阻与功率，并说明电压升高时电阻如何变化。","s":["R = U/I = 6/0.5 = 12 Ω","P = UI = 6×0.5 = 3 W","不能用切线斜率求 R，那是动态电阻，不等于工作点电阻","灯丝温度随电压升高而升高，电阻增大，图线向电压轴弯曲"],"a":"R = 12 Ω，P = 3 W；电压升高电阻增大","c":"非线性元件的电阻定义始终是 R = U/I（工作点电阻），切线斜率是动态电阻，两者含义不同","x":"看图判断趋势：图线越来越陡（斜率增大）说明电阻在增大，越来越平说明电阻在减小"}],"v":["由 U-I 图求某点电阻","求某电压下的功率","判断电阻随温度的变化","图线与电源线的交点即工作点","小灯泡的电阻不是定值"]},{"t":"电阻定律与形变问题","f":"导线被拉长、对折、均匀压缩后求电阻变化，或求电阻率与温度的关系","k":"R = ρL/S；拉伸时体积不变，L 变为 n 倍则 S 变为 1/n，电阻变为 n² 倍","q":[{"q":"把一根均匀导线拉长到原来的 2 倍，其电阻变为原来的多少倍？若把它对折成两股，电阻又是多少？","s":["拉长时体积不变：L·S = L′·S′","L′ = 2L，故 S′ = S/2","R′ = ρ(2L)/(S/2) = 4ρL/S = 4R","对折后长度减半、横截面积加倍，R″ = R/4"],"a":"拉长为 2 倍时电阻变为 4 倍；对折后变为 1/4","c":"凡「拉长/对折」必用「体积不变」这一条，否则会误以为只有 L 变、S 不变","x":"记 R ∝ L²/V（体积不变时）：拉长 n 倍 → n² 倍；对折相当于长度减半、面积加倍 → 1/4 倍"}],"v":["导线拉长后电阻如何变","对折后电阻如何变","均匀压缩后的电阻","电阻率与温度的关系","体积不变时 R 与 L² 成正比"]},{"t":"电流的微观表达式","f":"由自由电子数密度、导线截面积与定向移动速率求电流，或比较不同导线的漂移速度","k":"I = nqSv，n 是单位体积自由电荷数，v 是定向移动速率","q":[{"q":"铜导线截面积 1 mm²，自由电子数密度 8.5×10²⁸ m⁻³，电子定向移动速率 7.4×10⁻⁵ m/s。求导线中的电流（e = 1.6×10⁻¹⁹ C）。","s":["I = nqSv","S = 1 mm² = 1×10⁻⁶ m²","I = 8.5×10²⁸ × 1.6×10⁻¹⁹ × 1×10⁻⁶ × 7.4×10⁻⁵","= 8.5×1.6×7.4 × 10^(28−19−6−5) ≈ 100 × 10⁻²","≈ 1.0 A"],"a":"约 1.0 A","c":"自由电子的定向移动速率极小（10⁻⁵ m/s 量级），但电流可以很大，因为电子数密度极大——这一点常被误判","x":"全部换成国际单位再乘，特别注意 mm² = 10⁻⁶ m²"}],"v":["由 n、S、v 求电流","比较不同导线的漂移速度","用 I = nqSv 计算","串联时漂移速度不同","漂移速度为什么很小"]}],"气体定律":[{"t":"气体状态变化的图像判断","f":"由 p-V、p-T、V-T 图像判断过程性质，或比较不同状态的参量","k":"p-V 图等温线是双曲线、p-T 与 V-T 图的等容/等压线都是过原点的直线，看形状即可定过程","q":[{"q":"一定质量的理想气体在 p-V 图中沿一条双曲线从 A 到 B，体积增大为原来的 2 倍。求压强变化与温度变化，并说明能量转化。","s":["双曲线对应等温过程：pV = 常量","体积加倍，压强减半","温度保持不变，故内能不变","气体对外做功，由 ΔU = Q + W 知必须吸收等量的热量"],"a":"压强减半，温度不变，内能不变，气体吸热且全部用于对外做功","c":"先由图像形状定过程类型（等温/等容/等压），再选定律，最后用第一定律分析能量，三步不能乱","x":"记三条图线形状：p-V 是双曲线、p-T 与 V-T 都过原点。形状一认，过程就定了"}],"v":["由 p-V 图判断过程性质","由 p-T 图判断过程","由 V-T 图判断过程","比较不同状态的参量","图像上某点的意义"]},{"t":"变质量问题：充气与抽气","f":"充气、抽气、气体分装等质量发生变化的问题","k":"把「容器 + 气筒」看成一个整体，总 pV 保持不变（等温），一次列式即可","q":[{"q":"容积 20 L 的钢瓶内气体压强为 10 atm。用容积 5 L 的抽气筒抽气一次（温度不变），求瓶内剩余气体的压强。","s":["抽气前总 pV = 10×20 = 200 atm·L","抽气后气体分布在 20 L 的瓶与 5 L 的筒中","p₂ × (20+5) = 200","p₂ = 8 atm"],"a":"8 atm","c":"抽气问题的关键是把「瓶 + 筒」当成一个整体，体积相加、pV 乘积不变","x":"用比例速算：p₂ = p₁V₁/(V₁+V筒)，抽 n 次则为 p₁[V₁/(V₁+V筒)]ⁿ，一步出结果"}],"v":["充气后压强如何变化","抽气若干次后的压强","气体分装问题","把变质量转化为定质量处理","选取合适的研究对象"]},{"t":"循环过程的多过程分析","f":"由 p-V 图判断循环中各阶段的吸放热与做功，或求一个循环的净功与净吸热","k":"循环回到初态则 ΔU = 0，净功等于 p-V 图围成的面积（顺时针为正），再由第一定律分配 Q","q":[{"q":"1 mol 理想气体经 A→B→C→A 顺时针循环，p-V 图围成面积 200 J。求整个循环气体对外做的净功与净吸热。","s":["循环回到初态，内能变化 ΔU = 0","p-V 图围成的面积即净功，顺时针表示气体对外做正功","W对外 = 200 J","由 ΔU = Q − W对外 得 Q = 200 J，即净吸热 200 J"],"a":"净功 200 J，净吸热 200 J","c":"循环题三句话：ΔU = 0、净功 = 面积、Q = W对外；逆时针则三者全部取负","x":"先判方向（顺正逆负），再算面积，最后用第一定律配 Q，不必逐段计算"}],"v":["判断各阶段是吸热还是放热","求一个循环的净功","求整个循环的净吸热","顺时针与逆时针的区别","各段内能变化之和为零"]}],"法拉第电磁感应定律":[{"t":"平均电动势与瞬时电动势","f":"求一段时间内的平均感应电动势、某一时刻的瞬时电动势，或由图像求电动势","k":"E = nΔΦ/Δt 只能求平均值，E = BLv 求瞬时值；Φ-t 图线的斜率就是瞬时电动势","q":[{"q":"面积 0.1 m² 的 100 匝线圈，磁感应强度在 0.2 s 内由 0.1 T 均匀增大到 0.5 T。求这段时间内的平均感应电动势。","s":["ΔΦ = ΔB·S = (0.5−0.1)×0.1 = 0.04 Wb","E = nΔΦ/Δt = 100×0.04/0.2","= 4/0.2 = 20 V","若求某一时刻的瞬时值，需用 E = BLv 或对 Φ-t 图求斜率"],"a":"20 V","c":"平均与瞬时的区别是本节最大的坑：ΔΦ/Δt 只能求平均，求瞬时必须用斜率或 BLv","x":"匝数 n 是最常见的漏项：题干里的「100 匝」几乎必然要用到，先圈出来"}],"v":["求一段时间内的平均电动势","求某时刻的瞬时电动势","由图像求电动势","E = nΔΦ/Δt 与 E = BLv 的区别","平均值的用法"]},{"t":"感应电荷量与图像问题","f":"求通过导线截面的电荷量，或由 B-t、Φ-t 图像判断电动势的变化","k":"q = nΔΦ/R，与时间无关，只与磁通量的变化量有关；E 的大小等于 Φ-t 图线的斜率","q":[{"q":"电阻 0.5 Ω 的 100 匝线圈，穿过它的磁通量在 0.1 s 内增加了 0.02 Wb。求通过导线截面的电荷量。","s":["由 q = It，I = E/R，E = nΔΦ/Δt 联立","得 q = nΔΦ/R","= 100×0.02/0.5","= 4 C，与所用时间 0.1 s 无关"],"a":"4 C","c":"q = nΔΦ/R 中不含 Δt，这是它与电动势公式最大的区别：时间长短不影响总电荷量","x":"忘了公式就现推：q = It = (E/R)t = (nΔΦ/Δt/R)Δt = nΔΦ/R，三行推出，不必硬记"}],"v":["求通过截面的电荷量","由 B-t 图判断电动势变化","由 Φ-t 图求电动势","q 与时间无关只与 ΔΦ 有关","图像斜率的含义"]},{"t":"感生电动势与动生电动势","f":"判断电动势的来源，或分别计算两种情形下的电动势","k":"感生：磁场变化产生涡旋电场，E = nΔΦ/Δt；动生：导体切割磁感线，E = BLv","q":[{"q":"一个 100 匝的线圈静止在均匀变化的磁场中，磁感应强度每秒增加 0.2 T，线圈面积 0.5 m²。求感应电动势。","s":["导体不动、磁场变化，属于感生电动势","ΔΦ/Δt = S·ΔB/Δt = 0.5×0.2 = 0.1 Wb/s","E = nΔΦ/Δt = 100×0.1","= 10 V"],"a":"10 V","c":"分清两类：导体不动、磁场变 → 感生（用法拉第定律）；磁场不变、导体动 → 动生（用 E = BLv）","x":"感生题直接算 S·ΔB/Δt 再乘匝数，不必管导体在哪里"}],"v":["判断电动势的来源","分别计算两种电动势","感生靠涡旋电场","动生靠洛伦兹力","两种情形叠加时的总电动势"]}],"波动图像":[{"t":"波动图像的读法与质点振动方向","f":"由波形图求波长、振幅，判断某质点的振动方向、加速度方向，或求一段时间内的路程","k":"波形图横轴是位置、纵轴是位移；质点振动方向用「上下坡法」判断：沿传播方向看，上坡处向下、下坡处向上","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波形图上 A 点位于波峰，B 点位于平衡位置且在 A 的右侧。判断 B 点的振动方向。","s":["波沿 +x 方向传播，B 位于 A（波峰）的右侧，处在下坡段","用上下坡法：沿传播方向看，下坡处的质点向上运动","故 B 点此刻向上振动","用微平移法校验：把波形沿 +x 平移一小段，B 处新波形在原波形上方，同样说明向上"],"a":"B 点向上振动","c":"上下坡法口诀：沿波传播方向看，「上坡向下、下坡向上」，一秒钟判定，不必列方程","x":"波形微平移最直观：整条波形沿传播方向平移一点点，同一横坐标处新波形在原波形上方 → 质点向上，下方 → 向下"}],"v":["由波形图求波长与振幅","判断某质点的振动方向","判断加速度方向","求一段时间内的路程","求某质点的位移"]},{"t":"波的叠加与干涉加强点","f":"两列相干波相遇，判断加强点与减弱点的位置与个数","k":"加强条件：到两波源的路程差为波长整数倍；减弱条件：为半波长的奇数倍","q":[{"q":"两个同相振动的相干波源相距 5 m，波长 2 m。求两波源连线上振动加强点的个数。","s":["加强条件：|Δr| = nλ = 2n（n = 0,1,2…）","连线上任一点到两波源的距离差范围为 0 到 5 m","由 2n ≤ 5 得 n = 0,1,2","n = 0 对应中点 1 个，n = 1、2 各对应对称的 2 个，共 5 个"],"a":"5 个加强点","c":"三步定式：写加强条件 → 由几何范围定 n 的取值范围 → 数点。n = 0 只对应一个点，是最常见的漏算处","x":"用对称性数点：加强点关于中点对称，中点 1 个 + 两侧各 2 个 = 5 个，不必逐个求坐标"}],"v":["判断加强点与减弱点","求加强点的个数","波程差为波长整数倍加强","两波源连线上的加强点","干涉图样的稳定性"]},{"t":"波速、波长与频率的关系","f":"由波形图与传播时间求波速，或判断波跨介质传播时哪个量不变","k":"v = λf = λ/T；波从一种介质进入另一种介质时频率不变，波速与波长都随之改变","q":[{"q":"一列波的频率为 50 Hz、波长为 4 m。求波速；若该波进入另一介质后波速变为 100 m/s，求新介质中的波长。","s":["v = λf = 4×50 = 200 m/s","频率由波源决定，进入新介质后不变，仍为 50 Hz","新波长 λ′ = v′/f = 100/50 = 2 m","波长变短，说明新介质中波速更小"],"a":"原波速 200 m/s；新介质中波长 2 m","c":"「频率不变」是跨介质问题的唯一锚点：波速和波长都变，只有频率死守不变","x":"记 v = λf 三量关系，已知两个求第三个；跨介质时先锁定 f 再算 λ"}],"v":["由波形图与传播时间求波速","求波长或频率","波跨介质时频率不变","波速由介质决定","v = λf 的应用"]}],"洛伦兹力":[{"t":"洛伦兹力的大小与方向","f":"求洛伦兹力大小与方向，判断粒子偏转方向或轨迹半径","k":"F = qvB sinθ，方向用左手定则（负电荷四指指向速度反方向）；洛伦兹力永远垂直于速度","q":[{"q":"电子以 2×10⁶ m/s 垂直射入 0.5 T 的匀强磁场。求洛伦兹力大小与轨迹半径（m = 9.1×10⁻³¹ kg，e = 1.6×10⁻¹⁹ C）。","s":["F = evB = 1.6×10⁻¹⁹ × 2×10⁶ × 0.5 = 1.6×10⁻¹³ N","洛伦兹力提供向心力：evB = mv²/r","r = mv/(eB) = 9.1×10⁻³¹ × 2×10⁶ ÷ (1.6×10⁻¹⁹ × 0.5)","r ≈ 2.3×10⁻⁵ m"],"a":"F = 1.6×10⁻¹³ N，r ≈ 2.3×10⁻⁵ m","c":"半径公式 r = mv/(qB) 与周期公式 T = 2πm/(qB) 必须背熟，后者与速率无关是常考点","x":"先求 r 再求 F 更省力：F = mv²/r，只代一次数量级，避免两次浮点运算出错"}],"v":["求洛伦兹力的大小","用左手定则判断方向","判断粒子的偏转方向","求圆周运动的轨迹半径","速度与磁场平行时不受力"]},{"t":"洛伦兹力不做功的含义","f":"判断洛伦兹力是否做功，粒子速率、动能是否变化，或辨析「磁场能否加速粒子」","k":"洛伦兹力始终垂直于速度，瞬时功率恒为零，一个周期内做功也为零，故速率与动能都不变","q":[{"q":"带电粒子在匀强磁场中做匀速圆周运动，洛伦兹力是否改变粒子的动能？若同时存在电场呢？","s":["洛伦兹力方向始终垂直于速度，瞬时功率 P = Fv cos90° = 0","整个运动过程中做功为零，动能保持不变","若同时存在电场，电场力做功，动能会改变","结论：磁场只改方向，电场才改速率"],"a":"洛伦兹力不改变动能；加入电场后动能会改变","c":"「洛伦兹力不做功」是处理磁场中粒子问题的基本前提，可用它直接排除「磁场使粒子加速」的选项","x":"能量判据最快：题中若出现「磁场使粒子加速」，一定是错的；出现「电场加速、磁场偏转」才是标准模型"}],"v":["判断洛伦兹力是否做功","粒子的速率是否变化","磁场能否加速粒子","动能为什么不变","洛伦兹力只改变速度方向"]},{"t":"速度选择器与复合场","f":"粒子在正交的电场与磁场中做直线运动，求能通过的速度条件","k":"电场力与洛伦兹力平衡时粒子做匀速直线运动：qE = qvB，得 v = E/B，与电荷量、质量无关","q":[{"q":"正交的匀强电场 E = 2×10⁴ V/m 与匀强磁场 B = 0.1 T。求能沿直线通过该区域的粒子速度。","s":["粒子做直线运动，说明电场力与洛伦兹力平衡","qE = qvB，电荷量约掉","v = E/B = 2×10⁴/0.1 = 2×10⁵ m/s","该结果与粒子的电荷量、质量都无关"],"a":"2×10⁵ m/s","c":"速度选择器的结论 v = E/B 与 q、m 无关——这是判断「不同粒子能否通过」类选项的关键","x":"直接 v = E/B 代入即可；前提是电场力与洛伦兹力方向相反，否则不可能平衡"}],"v":["求能通过的速度 v = E/B","判断不同粒子能否通过","电场力与洛伦兹力平衡","改变电场或磁场后的结果","与质谱仪的结合"]}],"热力学定律":[{"t":"第一定律的符号规则","f":"判断 ΔU、Q、W 的正负，或由其中两个量求第三个","k":"ΔU = Q + W；吸热 Q 取正、放热取负，外界对气体做功 W 取正、气体对外做功取负","q":[{"q":"气体吸收 500 J 的热量，同时对外做功 200 J。求内能的变化。","s":["吸热：Q = +500 J","对外做功：W = −200 J","ΔU = Q + W = 500 − 200","ΔU = 300 J，内能增加"],"a":"内能增加 300 J","c":"符号规则只有一句：吸热为正、外界对气体做功为正。写式子前先把 Q、W 的符号定死","x":"用「收支」理解：吸热是收入、对外做功是支出，ΔU 就是净收入，正负自然清楚"}],"v":["判断 ΔU 的正负","判断 Q 的正负","判断 W 的正负","由其中两个量求第三个","吸热与对外做功的符号"]},{"t":"热力学第二定律与效率","f":"判断某过程能否自发进行、热机效率能否达到 100%、是否违反第二定律","k":"开尔文表述：不可能从单一热源吸热全部变功而不引起其他变化；一切热机效率必小于 1","q":[{"q":"某热机从高温热源吸热 1000 J，对外做功 400 J，其余热量排向低温热源。是否违反热力学第二定律？","s":["效率 = 400/1000 = 40%","效率小于 100%，说明没有把吸收的热量全部变成功","剩余 600 J 排向低温热源，符合实际热机的运行方式","故不违反第二定律"],"a":"不违反，效率 40% 小于 100%","c":"第二定律禁止的是「效率 100%」和「热量自发从低温到高温」，并不禁止一切热传递与热机","x":"一句话判据：只要存在低温热源、效率小于 1，就一定不违反第二定律"}],"v":["判断某过程能否自发进行","效率能否达到 100%","是否违反第二定律","两种表述的等价性","第二类永动机为什么不可能"]},{"t":"内能、热量、温度三者的关系辨析","f":"判断温度、内能、热量之间的因果说法，纠正「温度高内能一定大」这类错误","k":"温度是分子平均动能的标志，内能是所有分子动能与势能之和，还与分子数、体积有关","q":[{"q":"判断两句话是否正确：①温度越高的物体内能越大；②内能增大的物体温度一定升高。","s":["内能 = 分子总动能 + 分子总势能，分子总数也影响内能的大小","一小杯沸水温度高但分子数远少于一池温水，内能可能更小，故①错","晶体熔化时持续吸热、内能增大，但温度保持不变，故②错","结论：温度与内能有关联但没有必然的单向关系"],"a":"两句话都错","c":"温度只管平均动能，内能还要管分子数与势能；三者的关系是「有关联、无必然」","x":"遇到这类判断题，先想两个反例：一滴沸水（温度高而内能小）、冰熔化（内能增而温度不变）"}],"v":["温度高内能一定大吗","内能增大温度一定升高吗","晶体熔化时的反例","三者的关联与区别","热量是过程量不是状态量"]}],"热力学第一定律":[{"t":"ΔU = Q + W 的综合计算","f":"结合气体状态变化求做功、吸放热与内能变化","k":"先由过程类型定 W（等容 W = 0、等压 W = −pΔV、等温 W 由第一定律反求），再代入 ΔU = Q + W","q":[{"q":"一定质量理想气体等压膨胀，压强 2×10⁵ Pa，体积由 1 L 增到 3 L，同时吸收 800 J 热量。求内能变化。","s":["等压膨胀，气体对外做功 W外 = pΔV = 2×10⁵ × 2×10⁻³ = 400 J","外界对气体做功 W = −400 J","ΔU = Q + W = 800 − 400","ΔU = 400 J，内能增加"],"a":"内能增加 400 J","c":"先算 W 并注意「气体对外做功」是负值，再代入 ΔU = Q + W，符号定好就不会错","x":"用能量收支核算：吸热 800 是收入、做功 400 是支出，净增 400，一步出结果"}],"v":["求气体做的功","求吸收或放出的热量","求内能的变化","结合状态变化综合计算","多过程分段的 ΔU 求和"]},{"t":"三个特殊过程中的能量关系","f":"判断等温、绝热、等容过程中内能、热量、功的变化","k":"等温 ΔU = 0、绝热 Q = 0、等容 W = 0；三条各锁住一个量，剩下的由第一定律推出","q":[{"q":"一定质量的理想气体被绝热压缩，内能与温度如何变化？","s":["绝热过程与外界无热交换：Q = 0","被压缩，外界对气体做功：W > 0","ΔU = Q + W = W > 0","内能增加，温度升高"],"a":"内能增加，温度升高","c":"三个特殊过程各有一个量恒为零，记住这三条能秒解大半选择题","x":"生活验证：给自行车打气时气筒会发热，正是绝热压缩使内能增加的直接证据"}],"v":["等温过程的 Q 与 W","绝热过程的 ΔU 与 W","等容过程的 Q 与 ΔU","三种过程对比","等温时 ΔU = 0"]},{"t":"绝热过程与自由膨胀","f":"分析绝热、自由膨胀等特殊过程中 Q、W、ΔU 的取值，判断温度是否变化","k":"绝热则 Q = 0，故 ΔU = W；向真空自由膨胀不做功 W = 0，若又绝热则 ΔU = 0，理想气体温度不变","q":[{"q":"绝热容器中，理想气体向真空自由膨胀。判断气体的内能与温度如何变化。","s":["绝热容器与外界无热交换：Q = 0","向真空膨胀，外界没有阻力，气体不对外做功：W = 0","由 ΔU = Q + W = 0，内能不变","理想气体内能只由温度决定，ΔU = 0 则温度不变"],"a":"内能不变，温度不变","c":"自由膨胀是「不做功的膨胀」；绝热 + 自由膨胀 = 内能严格不变，这是最容易被直觉带偏的一题","x":"两步取值法：先看有无热交换定 Q，再看有无对外做功定 W，剩下的交给第一定律"}],"v":["绝热膨胀温度如何变化","自由膨胀是否对外做功","内能是否变化","为什么温度不变","与等温膨胀的区别"]}],"热学":[{"t":"微观量的估算","f":"由宏观量（质量、体积、密度、摩尔质量）估算分子数、分子直径、分子质量","k":"阿伏加德罗常数是把宏观量与微观量连起来的唯一桥梁：N = (m/M)N_A，分子体积 V₀ = V/N","q":[{"q":"1 g 水中有多少个水分子？每个水分子占据的体积约多大？（M = 18 g/mol，N_A = 6×10²³ mol⁻¹，水的密度 1 g/cm³）","s":["物质的量 n = m/M = 1/18 mol","分子数 N = nN_A = 6×10²³/18 ≈ 3.3×10²² 个","1 g 水的体积为 1 cm³ = 10⁻⁶ m³","每个分子占据体积 V₀ = 10⁻⁶/3.3×10²² ≈ 3×10⁻²⁹ m³"],"a":"约 3.3×10²² 个，每个分子约占据 3×10⁻²⁹ m³","c":"所有估算题都走同一条路：宏观量 → 摩尔数 → 分子数 → 单个分子的量，一步一代","x":"记数量级：1 cm³ 水约含 3×10²² 个分子、分子直径约 10⁻¹⁰ m，估算题可直接用这两个数校验"}],"v":["求物体所含的分子数","估算分子的直径","求单个分子的质量","用油膜法估测分子直径","以阿伏伽德罗常数为桥梁换算"]},{"t":"内能的理解与比较","f":"判断内能是否变化、比较不同状态或不同物体的内能大小","k":"理想气体的内能只由温度和物质的量决定，与体积、压强无关；实际物体内能还包括分子势能","q":[{"q":"一定质量的理想气体温度不变、体积增大，内能如何变化？若温度升高、体积同时减小呢？","s":["理想气体分子间作用力可忽略，分子势能视为零","内能等于所有分子动能之和，只由温度决定","温度不变，分子平均动能不变，内能不变","温度升高则内能增大，与体积如何变化无关"],"a":"第一种情况内能不变；第二种情况内能增大","c":"「理想气体内能只看温度」是本模块最核心的结论，体积与压强都不影响内能","x":"一句话判据：温度不变 → 内能不变；温度升高 → 内能增大。看到「体积变化」不要被带偏"}],"v":["判断内能是否发生变化","比较两个物体的内能大小","内能与温度的区别","理想气体内能只由温度决定","内能与机械能无关"]},{"t":"气体压强的微观解释","f":"用分子动理论解释气体压强，或判断温度、体积同时改变时压强如何变化","k":"压强由分子平均动能与分子数密度共同决定：微观上正比于两者之积，宏观上由 pV/T = C 定量给出","q":[{"q":"一定质量的理想气体，温度升高的同时体积增大。能否直接判断压强如何变化？","s":["温度升高，分子平均动能增大，单次碰撞传递的冲量更大、碰撞更频繁，压强有增大趋势","体积增大，分子数密度减小，单位时间单位面积上的碰撞次数减少，压强有减小趋势","两个趋势方向相反，定性分析无法定论","由 p = C·T/V，T 与 V 同时增大时，必须比较两者的相对涨幅才能确定 p 的变化"],"a":"不能直接判断；取决于温度与体积增大的相对幅度","c":"压强的微观三要素是分子数密度、平均动能、碰撞频率；宏观上分别对应 V 与 T，同向变化时必须回到 pV/T = C","x":"遇到「温度升、体积也变」，先写 p = CT/V，再比 T 与 V 的倍数，谁涨得快压强就往谁那边走"}],"v":["解释压强的微观成因","温度与体积同变时压强如何变","碰撞频率与冲量的影响","用 pV/T = C 定量比较","分子数密度对压强的影响"]}],"熵增加原理":[{"t":"熵变与无序程度","f":"判断某过程熵增还是熵减，或判断过程能否自发进行","k":"孤立系统中熵永不减少；熵是分子无序程度的度量，由有序变无序则熵增","q":[{"q":"冰融化成水与水结成冰，哪个过程熵增加？为什么冰的融化能自发进行？","s":["冰是晶体，分子排列有序；水分子排列无序","融化使无序程度增大，故熵增加","凝固使无序程度减小，熵减小","冰融化需要吸热，系统的熵增主要来自从环境吸收热量带来的熵流"],"a":"冰融化成水的过程熵增加","c":"判断熵变只看「有序 → 无序」还是「无序 → 有序」，前者熵增、后者熵减","x":"一句话：熵增就是「变乱」。凡是系统从整齐走向混乱的过程，熵都在增加"}],"v":["判断熵增还是熵减","判断过程能否自发进行","无序程度如何变化","熵与温度的关系","判断熵是不是状态量"]},{"t":"第二定律的两种表述与「自发」","f":"判断热量传递方向、制冷机与热泵是否违反第二定律","k":"克劳修斯表述：热量不能自发地从低温物体传到高温物体；关键词是「自发」，有外界做功时不违反","q":[{"q":"空调能把热量从温度较低的室内搬到温度较高的室外。这是否违反热力学第二定律？","s":["第二定律禁止的是热量「自发」地从低温传到高温","空调消耗了电能，属于「引起其他变化」","故不违反第二定律","但制冷系数不可能无限大，效率受第二定律限制"],"a":"不违反，因为有外界做功","c":"抓住「自发」二字：有外界做功时，热量完全可以从低温流向高温","x":"冰箱、空调、热泵都是「非自发」过程，都要消耗能量，因此都不违反第二定律"}],"v":["判断热量传递的方向","制冷机是否违反第二定律","热泵的工作原理","「自发」的确切含义","两种表述的等价性"]},{"t":"能量耗散与能源利用效率","f":"判断能量耗散的不可逆性，或解释为什么热机效率不可能达到 100%","k":"能量总量守恒，但能量的品质下降（耗散为内能）；第二定律排除效率 100% 的热机","q":[{"q":"汽车制动时动能变为内能，这些内能能否自发地重新变回汽车的动能？说明理由。","s":["能量总量守恒，动能转化为内能并不违反第一定律","内能是大量分子无规则运动的形式，要让它自发集中为定向的机械能，需要系统熵减小","熵增加原理指出孤立系统的熵不会自发减小","故该过程不可逆，制动产生的内能无法自发复原为动能"],"a":"不能；该过程熵增，不可逆","c":"「第一定律管得住能量守恒，管不住过程方向」——凡是问「能不能自发」，答案都在第二定律","x":"回答「不可逆」类问题用三步：能量守恒成立 → 复原需要熵减小 → 违反第二定律"}],"v":["判断能量耗散是否可逆","为什么效率不能达到 100%","能量品质下降的含义","能源利用的极限","制动产生的内能能否复原"]}],"爱因斯坦光电方程":[{"t":"方程的定量计算","f":"求最大初动能、逸出功、入射光频率或波长、截止频率","k":"hν = W₀ + Ek_max，且 Ek_max = eU_c；入射光能量小于逸出功时不发生光电效应","q":[{"q":"用波长 400 nm 的光照射逸出功为 2.0 eV 的金属。求光电子的最大初动能（hc 取 1240 eV·nm）。","s":["光子能量 ε = hc/λ = 1240/400 = 3.1 eV","Ek = ε − W₀","= 3.1 − 2.0","= 1.1 eV"],"a":"1.1 eV","c":"全程用 eV 计算最省事，hc = 1240 eV·nm 是必背常数","x":"先算 ε 再减 W₀ 即可；若算出 ε < W₀，说明不发生光电效应，不必再往下算"}],"v":["求最大初动能","求金属的逸出功","求入射光的频率或波长","由逸出功反求截止频率"]},{"t":"Ek-ν 图线的截距与斜率","f":"由最大初动能—频率图线求逸出功、普朗克常量、截止频率","k":"图线是直线：斜率等于 h，横轴截距是截止频率 ν₀，纵轴截距是 −W₀","q":[{"q":"某金属的 Ek-ν 图线斜率为 6.6×10⁻³⁴ J·s，横轴截距为 5×10¹⁴ Hz。求逸出功。","s":["图线斜率即普朗克常量 h","横轴截距即截止频率 ν₀ = 5×10¹⁴ Hz","W₀ = hν₀ = 6.6×10⁻³⁴ × 5×10¹⁴","= 3.3×10⁻¹⁹ J ≈ 2.06 eV"],"a":"约 3.3×10⁻¹⁹ J（约 2.1 eV）","c":"三个特征量必须记牢：斜率 h、横截距 ν₀、纵截距 −W₀，读图题全考这三处","x":"用 h = 4.14×10⁻¹⁵ eV·s 直接算 eV：W₀ = 4.14×5×10⁻¹ ≈ 2.07 eV，不必先换焦耳"}],"v":["由纵轴截距求逸出功","由斜率求普朗克常量","由横轴截距求截止频率","图线为什么是直线","横轴截距的物理意义"]},{"t":"双光束照射下的光电效应","f":"两种不同频率的光同时照射同一金属，求最大初动能或判断能否发生光电效应","k":"各光子独立作用，一个电子一次只吸收一个光子；能否逸出取决于单个光子能量是否超过逸出功","q":[{"q":"某金属逸出功 2.0 eV。用 1.5 eV 与 3.0 eV 两种光子同时照射，能否发生光电效应？最大初动能多少？","s":["1.5 eV < 2.0 eV，这部分光子单独不能打出电子","3.0 eV > 2.0 eV，可以打出电子","最大初动能 Ek = hν − W = 3.0 − 2.0 = 1.0 eV","两束光同时照射不会把能量叠加给同一个电子，故 Ek 仍为 1.0 eV"],"a":"能发生；最大初动能为 1.0 eV","c":"「一个电子只吸收一个光子」——所以两束弱光叠加不能替代一束强光，这是最反直觉的一点","x":"分别对每束光判一次 hν 与 W 的大小，取能发生的那束算 Ek，绝不相加"}],"v":["判断能否发生光电效应","求最大初动能","两束光的能量能否叠加","分别对每束光单独判断","一个电子只吸收一个光子"]}],"牛顿定律":[{"t":"瞬时性问题（弹簧与绳的区别）","f":"剪断细绳、撤去挡板、突然撤力的瞬间，求各物体的加速度","k":"判据只有一条：绳、杆、接触面的弹力可以突变，弹簧、橡皮条的弹力不能突变。剪断瞬间先看谁的形变来不及改变","q":[{"q":"质量均为 m 的 A、B 两球，A 用细绳悬挂在天花板上，A、B 之间用弹簧相连。剪断细绳的瞬间，A、B 的加速度各是多少？","s":["剪断前：绳张力 2mg，弹簧对 A 向下拉力 mg，对 B 向上拉力 mg","剪断瞬间绳张力立刻消失，弹簧形变来不及改变，弹力仍为 mg","A 球：合力 = mg（重力）+ mg（弹簧）= 2mg，方向向下，a_A = 2g","B 球：合力 = mg（重力）− mg（弹簧）= 0，a_B = 0"],"a":"A 为 2g 向下，B 为 0","c":"先算剪断前每个弹力，剪断后只删掉绳（杆）的力、保留弹簧的力，再分别求合力","x":"画一张「剪断前受力表」，两列分别写剪断前后的力，逐行相减就是合力，比在脑子里推演可靠得多"}],"v":["剪断细绳瞬间求加速度","撤去挡板瞬间求加速度","弹簧与绳的突变差异","突然撤去拉力的瞬间","剪断弹簧与剪断绳的结果对比"]},{"t":"牛顿三定律的辨析","f":"选择题判断惯性与质量的关系、作用力与反作用力和平衡力的区别、定律的适用范围","k":"惯性只由质量决定，与速度无关；作用力与反作用力作用在两个物体上，平衡力作用在同一物体上，这是唯一的区分标准","q":[{"q":"马拉车前进时，马拉车的力与车拉马的力大小关系如何？既然两者大小相等，车为什么还能前进？","s":["这两个力是一对作用力与反作用力，任何时刻大小相等、方向相反","它们分别作用在车和马两个不同物体上，不能相互抵消","对车：向前的拉力大于向后的阻力，合力向前，车加速前进","对马：地面向前的摩擦力大于车向后的拉力，合力向前，马也前进"],"a":"大小相等；能否前进取决于各自所受的合力","c":"判断一对力是「相互作用」还是「平衡」，只看作用对象是一个还是两个，与大小是否相等无关","x":"记口诀「同物平衡、异物相互作用」，再复杂的情境一句话就能定性"}],"v":["惯性与质量的关系","作用力反作用力与平衡力的区别","牛顿定律的适用范围","力是维持运动的原因吗","惯性与速度是否有关"]},{"t":"惯性系与非惯性系","f":"判断某个参考系中牛顿定律是否成立，或解释加速车厢、电梯内的现象","k":"牛顿定律只在惯性系中成立；相对地面静止或匀速直线运动的才是惯性系，有加速度的都不是","q":[{"q":"加速前进的车厢内，光滑水平桌面上放着一个小球。车内观察者看到小球向后运动，如何解释？","s":["地面观察者（惯性系）：小球水平方向不受力，保持原来的速度不变","车厢在加速前进，于是小球相对车厢向后移动","车内观察者（非惯性系）：小球有加速度，却找不到施力物体","说明牛顿定律在非惯性系中不成立；若要沿用 F = ma，必须补一个惯性力 ma（方向与车厢加速度相反）"],"a":"地面系看是小球保持惯性、车厢加速；车内系必须引入惯性力才能解释","c":"判断是否惯性系只看一点：该参考系相对地面有没有加速度","x":"一句话：不是「小球被推了一把」，而是「车厢先跑了」"}],"v":["判断某参考系中定律是否成立","加速车厢内悬挂小球的状态","电梯内单摆的偏角","非惯性系中的「惯性力」","匀速与加速参考系的区别"]}],"牛顿第二定律":[{"t":"两类动力学问题","f":"已知受力求运动，或已知运动（含图像）反求受力，是本章最基础也最高频的题型","k":"桥梁是加速度：受力求 a 用 F = ma，运动求 a 用运动学公式，两边各算一次 a 再对接","q":[{"q":"质量 2 kg 的物体在水平面上受 10 N 水平拉力，动摩擦因数 0.2。求 3 s 末的速度和 3 s 内的位移（g 取 10 m/s²）。","s":["摩擦力 f = μmg = 0.2×2×10 = 4 N","合力 F合 = 10 − 4 = 6 N","a = F合/m = 3 m/s²","v = at = 9 m/s，x = ½at² = ½×3×9 = 13.5 m"],"a":"9 m/s，13.5 m","c":"受力分析 → 求合力 → a = F/m → 运动学公式，四步顺序不能颠倒，也不能跳过受力直接套运动学","x":"若题目给的是 v-t 图，先用斜率求 a，再由 ma = F − f 反推阻力，方向反着算同样快"}],"v":["已知受力求运动","已知运动反求受力","结合图像求受力","多过程的分段动力学"]},{"t":"整体法求加速度、隔离法求内力","f":"两个物体叠放或接触，受水平力作用，求保持相对静止的最大外力，或求两者之间的作用力","k":"先用整体法求共同加速度 a，再隔离受力较少的那个物体，把「内力 = ma」与最大静摩擦比较","q":[{"q":"质量 m 的物块叠放在质量 2m 的物块上，系统放在光滑水平面上。用水平力 F 拉下面的 2m 物块，两者间最大静摩擦力为 f_max。求保持相对静止的最大 F。","s":["整体：F = 3ma，得 a = F/(3m)","隔离上面的 m：静摩擦力提供它的加速度，f = ma = F/3","相对静止要求 f ≤ f_max，即 F/3 ≤ f_max","故 F 最大为 3f_max"],"a":"F 最大为 3f_max","c":"求「保持相对静止的最大外力」固定两步：整体求 a、隔离求内力，再令内力等于最大值","x":"用比例速算：内力由被带动的质量份额决定，f = F·m/(m+M)，本题份额是 1/3，一步写出不等式"}],"v":["求保持相对静止的最大外力","求两物体之间的弹力","求连接体之间绳的张力","先整体后隔离的解题顺序","叠放物体的内力计算"]},{"t":"a-F 图与 a-1/m 图","f":"由实验图像求小车质量与所受阻力，或判断图线不过原点的原因","k":"把公式化成 a = (1/m)F − f/m，与 y = kx + b 对照：斜率是 1/m，横轴截距是 f","q":[{"q":"探究 a 与 F 关系的实验中，a-F 图线是一条不经过原点的直线，横轴截距为 0.5 N，斜率为 2 kg⁻¹。求小车质量与所受阻力。","s":["由牛顿第二定律 F − f = ma 得 a = F/m − f/m","与 y = kx + b 对照：斜率 k = 1/m，截距 b = −f/m","斜率 1/m = 2，得 m = 0.5 kg","横轴截距满足 a = 0，即 F = f，故阻力 f = 0.5 N"],"a":"小车质量 0.5 kg，阻力 0.5 N","c":"图像题必须先把公式化成 y = kx + b 的形式，斜率和截距才对应得上物理量，直接看图容易搞反","x":"记「a-F 图斜率是 1/m、横截距是阻力 f」，看到图直接读两个数"}],"v":["由斜率求小车质量","由截距求阻力大小","图线不过原点的原因","平衡摩擦力的操作要点","砂桶质量不满足远小于小车时的弯曲"]}],"玻尔模型":[{"t":"能级公式与谱线数","f":"求能级能量、跃迁光子能量、可能发出的光谱线条数","k":"E_n = −13.6/n² eV；一群处于 n 能级的氢原子最多辐射 n(n−1)/2 种光子，单个原子最多 n−1 种","q":[{"q":"一群处于 n=3 能级的氢原子向低能级跃迁，最多能发出几种不同频率的光？","s":["可能的跃迁：3→1、3→2、2→1","共 3 种不同频率","用公式 n(n−1)/2 = 3×2/2 = 3 验证","若只有一个原子，最多只能发出 2 种"],"a":"3 种（一群原子）；若只有一个原子则为 2 种","c":"「一群原子」与「一个原子」结论不同：前者 n(n−1)/2，后者最多 n−1 种，审题时必须看清","x":"画能级图数箭头：从 n=3 出发能画出的箭头数就是答案，直观且不会漏"}],"v":["求某能级的能量","求跃迁光子的能量","求可能发出的光谱线条数","用 C(n,2) 计算","一群原子与一个原子的区别"]},{"t":"玻尔模型的适用范围","f":"判断玻尔模型能解释与不能解释的现象","k":"能解释氢原子与类氢离子的光谱；不能解释多电子原子的光谱与谱线强度","q":[{"q":"玻尔模型为什么无法解释氦原子的光谱？","s":["玻尔模型只处理「单电子绕核运动」的情形","氦原子有两个电子，存在电子之间的相互作用","模型无法处理这种多体问题","故只适用于氢原子与类氢离子（He⁺、Li²⁺ 等）"],"a":"因为玻尔模型只适用于单电子体系，无法处理电子间的相互作用","c":"判断「能否解释」只看电子数：单电子可以，多电子一律不行","x":"记住「玻尔模型 = 氢原子专用」，遇到氦、钠等直接判不能解释"}],"v":["能解释哪些现象","不能解释哪些现象","为什么不能解释多电子原子","与量子力学的差别","只对氢原子精确成立"]},{"t":"玻尔模型的三条假设","f":"判断某说法对应哪条假设，或用假设解释为什么氢光谱是分立线状谱","k":"①定态假设（稳定轨道不辐射）②跃迁假设（hν = Eₘ − Eₙ）③轨道量子化（角动量量子化）","q":[{"q":"说明玻尔模型是如何解释氢原子光谱为分立线状谱的。","s":["定态假设：电子只能在若干稳定轨道上运动，处于定态时不辐射能量","轨道量子化：这些定态的能量只能取分立值 E₁、E₂、E₃…","跃迁假设：电子在两定态间跃迁时才吸收或放出光子，hν = Eₘ − Eₙ","两个能级之差只有分立值，故光子频率只有分立值，光谱是线状谱"],"a":"定态与量子化使能量取分立值，跃迁辐射的光子频率因而分立","c":"三条假设是一套：定态管稳定、量子化管分立、跃迁管发光","x":"答「为什么是线状谱」的标准链条：定态 → 能量分立 → 跃迁 → 频率分立"}],"v":["判断说法对应哪条假设","定态假设的内容","跃迁假设的内容","轨道量子化的含义","三条假设如何配合"]}],"玻意耳定律":[{"t":"等温变化的基本计算","f":"求等温过程中的压强或体积，常以水银柱、活塞封闭气体的形式出现","k":"p₁V₁ = p₂V₂；难点不在公式，而在正确写出被封闭气体的压强（用水银柱高度或活塞受力求）","q":[{"q":"一端封闭的玻璃管竖直放置，管内水银柱高 10 cm，封闭气柱长 20 cm，大气压 75 cmHg。把玻璃管缓慢倒置（开口向下），求气柱长度。","s":["正立时封闭气体压强 p₁ = 75 + 10 = 85 cmHg，气柱长 20 cm","倒置后 p₂ = 75 − 10 = 65 cmHg","等温：p₁L₁ = p₂L₂（同一截面积，体积正比于长度）","L₂ = 85×20/65 ≈ 26.2 cm"],"a":"约 26.2 cm","c":"封闭气体压强先算清楚：正立加水银柱、倒置减水银柱。这一步错则后面全错","x":"用长度代替体积：同一玻璃管截面积不变，体积比就是长度比，省去换算截面积"}],"v":["求等温过程的压强","求等温过程的体积","水银柱封闭气体的等温变化","活塞封闭气体的等温变化","p₁V₁ = p₂V₂ 的应用"]},{"t":"等温线的图像与微观解释","f":"判断 p-V 图线形状、比较不同等温线的温度高低、用分子动理论解释","k":"等温线是双曲线，离原点越远 pV 乘积越大、温度越高；温度不变时体积减小会使分子碰撞频率增大","q":[{"q":"p-V 图中有两条等温线，A 点位于离原点较近的线上，B 点位于较远的线上。比较两状态的温度。","s":["等温线上 pV = 常量，常量越大温度越高","离原点越远，pV 乘积越大","故 T_B > T_A","同一等温线上各点温度完全相同"],"a":"T_B > T_A","c":"比较温度只看 pV 乘积：乘积大则温度高，不必代入具体数值计算","x":"在图上画一条过原点的辅助线，与两条等温线各交一点，位置更高的温度更高"}],"v":["判断 p-V 图线的形状","比较不同等温线的温度高低","用分子动理论解释","为什么是双曲线","等温线越远离原点温度越高"]},{"t":"封闭气体的液柱（水银柱）问题","f":"求被水银柱封闭的气体压强，或判断温度变化时水银柱如何移动","k":"先对液柱受力分析定压强：开口向上 p = p₀ + ρgh，开口向下 p = p₀ − ρgh；再结合等温或等压条件","q":[{"q":"一端封闭的玻璃管竖直放置、开口向上，管内水银柱高 10 cm，大气压为 76 cmHg。求封闭气体的压强。","s":["以水银柱为研究对象，受向下的重力 ρghS、向下的大气压力 p₀S、向上的气体压力 pS","平衡条件：pS = p₀S + ρghS","p = p₀ + ρgh = 76 + 10","= 86 cmHg"],"a":"86 cmHg","c":"「开口向上加、开口向下减」——水银柱题的第一步永远是受力分析定压强，别背结论","x":"统一用 cmHg 作单位，h 直接以 cm 代入，76 + 10 一步出结果，省去换算"}],"v":["求被封闭气体的压强","判断温度变化时水银柱如何移动","开口向上与开口向下的区别","玻璃管倾斜后的压强","先受力分析再列气体定律"]}],"电势电势能":[{"t":"电势差、电势能与电场力做功","f":"求两点间电势差、某点电势、电势能变化，或判断哪点电势更高","k":"三条式子必须分清：W_AB = qU_AB、U_AB = φ_A − φ_B、ΔEp = −W_AB。符号一错，结论全反","q":[{"q":"把电荷 q = −2×10⁻⁶ C 从 A 移到 B，电场力做功 4×10⁻⁶ J。求 U_AB、电势能变化，并判断 A、B 哪点电势高。","s":["U_AB = W_AB/q = 4×10⁻⁶ ÷ (−2×10⁻⁶) = −2 V","U_AB = φ_A − φ_B = −2 V < 0，故 φ_A < φ_B，B 点电势高","电场力做正功 4×10⁻⁶ J，电势能减少","ΔEp = −W_AB = −4×10⁻⁶ J"],"a":"U_AB = −2 V，B 点电势高，电势能减少 4×10⁻⁶ J","c":"先算 U_AB 的数值与符号，再由符号判断电势高低；电势能变化一律用「做正功则减少」定符号","x":"免符号口诀：正电荷顺电场线移动电势能减少，负电荷逆电场线移动电势能减少。先判方向再判增减，比套公式稳"}],"v":["求两点间的电势差","求某点的电势","求电势能的变化","判断哪点电势更高","U_AB = φ_A − φ_B 的符号"]},{"t":"等势面与做功的路径无关性","f":"带电粒子沿不同路径在等势面间移动，判断做功、电势能与动能变化","k":"W = qU 只由始末位置的电势差决定，与路径无关；同一等势面上移动，电场力不做功","q":[{"q":"带电粒子从等势面 A 沿两条不同路径移到等势面 B，两次电场力做功是否相同？若沿等势面绕一圈，净功为多少？","s":["电场力做功只取决于始末电势差：W = qU_AB","与路径形状、是否沿电场线都无关，故两次做功相同","沿等势面移动时电势差为零，电场力不做功","绕一圈回到原等势面，净功为零"],"a":"两次做功相同；沿等势面绕行净功为零","c":"静电力是保守力，做功与路径无关——这正是能引入「电势能」这个概念的前提","x":"类比重力：重力做功只看高度差，电场力做功只看电势差，两个模型完全同构，可以整段迁移"}],"v":["沿不同路径做功相同","判断电势能如何变化","判断动能如何变化","等势面上移动不做功","等势面与电场线垂直"]},{"t":"电势高低的判断","f":"判断电场中两点电势的高低，或比较同一电荷在两点电势能的大小","k":"沿电场线方向电势降低；正电荷在高电势处电势能大，负电荷在高电势处电势能小","q":[{"q":"一个电子从 A 点移到 B 点，电场力做功 3.2×10⁻¹⁸ J。判断 A、B 两点电势的高低。","s":["电场力做正功，说明电势能减少","电子带负电，q < 0","由 Ep = qφ，q 为负时 Ep 减小意味着 φ 增大","故 φ_B > φ_A，即 B 点电势高"],"a":"B 点电势高于 A 点","c":"负电荷是最大的坑：电场力做正功时，负电荷向高电势运动，正电荷向低电势运动","x":"记「正电荷顺电场线走电势能减小，负电荷逆电场线走电势能减小」，再反推电势高低"}],"v":["比较两点的电势","比较同一电荷的电势能","沿电场线方向电势降低","负电荷在低电势处电势能更大","由等势面判断"]}],"电场":[{"t":"场的叠加与场强计算","f":"两个点电荷连线或中垂线上某点的合场强，或求场强为零的位置","k":"场强是矢量：先分别用 E = kQ/r² 求大小，再按方向合成。等量同种电荷连线中点场强为零，等量异种电荷中点场强最大","q":[{"q":"两个等量异种点电荷 ±Q 相距 2L。求连线中点处的场强大小与方向。","s":["正电荷在中点产生的场强大小为 kQ/L²，方向背离正电荷（指向负电荷）","负电荷在中点产生的场强大小为 kQ/L²，方向指向负电荷","两者方向相同，直接相加","E = 2kQ/L²，方向由正电荷指向负电荷"],"a":"E = 2kQ/L²，方向从正电荷指向负电荷","c":"合成前先画每个电荷在该点的场强箭头，同向相加、反向相减，方向判断错则全错","x":"成对记忆：等量同种电荷连线中点 E = 0，等量异种电荷连线中点 E = 2kQ/L²（该直线上最大），两个结论一起背"}],"v":["两点电荷连线上的合场强","中垂线上的合场强","求场强为零的位置","叠加后方向如何确定","同种与异种电荷的差别"]},{"t":"电场中的功能关系","f":"带电体在电场中移动或运动，求电场力做功、电势能变化、动能变化","k":"W_AB = qU_AB，ΔEp = −W；电场力做正功电势能减少，只有电场力做功时动能与电势能之和守恒","q":[{"q":"电荷 q = −2×10⁻⁶ C 从 A 点移到 B 点，电场力做功 4×10⁻⁶ J。求 U_AB 与电势能的变化量。","s":["由 W_AB = qU_AB 得 U_AB = W_AB/q = 4×10⁻⁶ ÷ (−2×10⁻⁶) = −2 V","U_AB < 0 说明 φ_A < φ_B，B 点电势更高","电场力做正功，电势能一定减少","ΔEp = −W_AB = −4×10⁻⁶ J"],"a":"U_AB = −2 V，电势能减少 4×10⁻⁶ J","c":"三个符号最容易乱：q 的正负、U_AB = φ_A − φ_B 的顺序、W = qU 的写法。一律先代数运算，再解释含义","x":"用「电场力做正功 → 电势能减少」定符号，其余靠 W = qU 定量，比死记符号规则可靠得多"}],"v":["求电场力做的功","求电势能的变化","求动能的变化","用 W电 = −ΔEp 计算","结合动能定理求速度"]},{"t":"电场中带电体的平衡","f":"带电小球悬挂在电场中、静止在斜面上，求场强、电量或偏角","k":"把电场力 qE 当成普通力并进受力分析，与重力、绳拉力一起列平衡方程","q":[{"q":"质量 m、电荷量 q 的带正电小球用绝缘细线悬挂在水平向右的匀强电场中，静止时细线与竖直方向成 30°。求场强大小。","s":["小球受重力 mg、绳拉力 T、电场力 qE 三个力","水平方向：T sin30° = qE","竖直方向：T cos30° = mg","两式相除得 tan30° = qE/mg","E = mg tan30°/q = √3mg/(3q)"],"a":"E = √3mg/(3q)","c":"电场力就是普通力，直接并进受力分析；三力平衡用合成法或正交分解都可以","x":"记结论：偏角 θ 满足 tanθ = qE/mg，看到角度直接写比值，不必解方程"}],"v":["悬挂小球求场强","斜面上静止求电荷量","求悬线与竖直方向的偏角","三力平衡的分析","求悬线的张力与偏角"]}],"电场偏转":[{"t":"偏转距离与偏转角","f":"求射出电场时的偏转距离、偏转角，或求打在荧光屏上的位置","k":"类平抛三式：t = L/v₀，y = ½at²，tanθ = v_y/v₀ = at/v₀，其中 a = qU/(md)","q":[{"q":"电子以速度 v₀ 垂直进入长 L、板间距 d、电压 U 的平行板。求射出时速度方向与初速度方向夹角的正切。","s":["加速度 a = eU/(md)","飞行时间 t = L/v₀","竖直分速度 v_y = at = eUL/(mdv₀)","tanθ = v_y/v₀ = eUL/(mdv₀²)"],"a":"tanθ = eUL/(mdv₀²)","c":"类平抛的速度角与位移角仍满足 tanθ_v = 2tanθ_x，与平抛完全一致，可直接借用推论","x":"若粒子是先加速后偏转，代入 v₀² = 2eU₁/m，得 tanθ = UL/(2U₁d)，与粒子种类无关，可用来秒判「换粒子角度不变」"}],"v":["求偏转距离 y","求偏转角 tanθ","求打在屏上的位置","y 与 U、L、d 的关系","偏转位移与偏转角的关系"]},{"t":"能否射出极板的临界判断","f":"判断粒子打在极板上还是能飞出，求临界电压、临界入射位置或临界板长","k":"临界条件统一翻译成「恰好擦着极板边缘飞出」，即 y = d/2，代入偏转公式解临界量","q":[{"q":"电子以速度 v₀ 沿两板中线射入长 L、板间距 d 的平行板。求电子恰好能飞出时的最大电压 U。","s":["恰好飞出时偏转距离等于板间距的一半：y = d/2","y = ½at² = ½·(eU/md)·(L/v₀)²","令其等于 d/2：eUL²/(2mdv₀²) = d/2","解得 U = md²v₀²/(eL²)"],"a":"U = md²v₀²/(eL²)","c":"「恰好飞出」一律翻译成 y = d/2，这是这类题唯一的突破口，其余都是代数运算","x":"也可用时间判据：飞出所需时间 t = L/v₀，若竖直位移超过 d/2 则打在板上，两种判据完全等价"}],"v":["判断粒子是否打在极板上","求恰好射出的临界电压","求恰好射出的临界板长","求临界入射位置","恰好从边缘射出的条件"]},{"t":"偏转的推论与屏上位置","f":"求粒子打在荧光屏上的偏移量，或用「速度反向延长过板中心」快速求解","k":"射出偏转电场时速度的反向延长线过极板长度的中点；屏上偏移 y总 = y(1 + 2L′/L)","q":[{"q":"偏转极板长 L = 0.1 m，粒子射出时偏转距离 y = 0.01 m，极板右端到屏的距离 L′ = 0.2 m。求粒子打在屏上的偏移量。","s":["速度反向延长线过板长中点，即距右端 L/2 = 0.05 m 处","由相似三角形：y总/y = (L/2 + L′)/(L/2)","= (0.05 + 0.2)/0.05 = 5","y总 = 5×0.01 = 0.05 m"],"a":"0.05 m","c":"「反向延长过中点」把两段问题压缩成一次相似三角形，是偏转题最省时的推论","x":"记 y总 = y(1 + 2L′/L)，代入 0.01×(1 + 0.4/0.1) = 0.05 m"}],"v":["求屏上的偏移量","用速度反向延长过板中心","求偏移量与偏转角的关系","推论快速求解","打在屏上的范围"]}],"电场加速":[{"t":"加速后的动能与速度比较","f":"粒子经电压 U 加速后求速度或动能，或比较不同粒子在同一电压下的加速结果","k":"动能只由 qU 决定（Ek = qU），速度还要看质量（v = √(2qU/m)），两个比例必须分开算","q":[{"q":"质子（电荷 e、质量 m）与 α 粒子（电荷 2e、质量 4m）由静止经同一电压 U 加速。求它们的动能之比与速度之比。","s":["动能 Ek = qU，质子 eU、α 粒子 2eU，故动能比 1:2","速度 v = √(2qU/m)，质子 √(2eU/m)","α 粒子 √(2×2eU/4m) = √(eU/m)","速度比 = √2 : 1"],"a":"动能比 1:2，速度比 √2:1","c":"「同一电压加速」时动能只看电荷量，速度还要看荷质比 q/m，两条线不能混","x":"用 v ∝ √(q/m) 直接比荷质比：质子 e/m，α 粒子 2e/4m = 0.5e/m，速度比为 √2:1，一步出"}],"v":["求加速后的速度","求加速后的动能","比较不同粒子的结果","用 qU = ½mv² 求解","相同电压下动能与电荷量成正比"]},{"t":"多级加速与总能量","f":"粒子依次经过多个电势差区域，或往复加速，求最终动能","k":"只看始末电势差之和：ΔEk = q·ΣU，中间的加速与减速按正负号代数相加，与路径无关","q":[{"q":"电子由静止依次经过 +100 V、−50 V、+200 V 三个电势差区域。求最终动能。","s":["电子带负电，q = −e，电势差为正时电场力做正功","总电势差 ΣU = 100 − 50 + 200 = 250 V","ΔEk = e × 250 V = 250 eV","中间区域即使减速，也只影响过程，不影响最终能量"],"a":"250 eV","c":"多级加速只看始末电势差之和，中间怎么绕都不改变结果——这正是保守力做功的特点","x":"用「加速取正、减速取负」直接代数相加：100 − 50 + 200 = 250，一行出结果"}],"v":["求经过多个电势差后的动能","往复加速后的总能量","总功等于各段之和","直线加速器的原理","电场力做功与路径无关"]},{"t":"加速电压与动能的图像","f":"由 Ek-U 图求电荷量，或比较不同粒子图线的斜率","k":"qU = Ek，Ek-U 图线是过原点的直线，斜率就是电荷量 q","q":[{"q":"某粒子经不同加速电压 U 加速后测得其动能 Ek，作出 Ek-U 图线，斜率为 3.2×10⁻¹⁹ C。求该粒子所带元电荷数（e = 1.6×10⁻¹⁹ C）。","s":["由 qU = Ek 得 Ek = qU","图线斜率即电荷量 q = 3.2×10⁻¹⁹ C","元电荷 e = 1.6×10⁻¹⁹ C","q/e = 3.2/1.6 = 2"],"a":"带 2 个元电荷","c":"Ek-U 图线的斜率就是电荷量，这是测定粒子电荷的经典方法","x":"记住 e = 1.6×10⁻¹⁹ C，直接用斜率除以 e 得元电荷数"}],"v":["由 Ek-U 图求电荷量","比较不同粒子图线的斜率","判断粒子的比荷","图线为什么是过原点的直线","斜率的物理意义"]}],"电场强度":[{"t":"场强的矢量叠加","f":"求两点电荷连线或中垂线上某点的合场强大小与方向，或求场强为零的点","k":"先分别用 E = kQ/r² 求大小，再按方向合成；同种电荷中点场强为零，异种电荷中点场强叠加最大","q":[{"q":"两个等量正点电荷 +Q 相距 2L。求连线中点处的场强，并指出场强为零的位置。","s":["每个电荷在中点产生的场强大小都是 kQ/L²","两个场强方向相反（都背离各自电荷、指向中点两侧）","故中点处合场强为零","连线上的场强为零的点只有中点，其他位置两场强大小不等、无法抵消"],"a":"中点场强为零，且连线上只有这一点场强为零","c":"等量同种电荷：连线中点 E = 0、中垂线上中点 E = 0 但两侧向外；等量异种电荷：中点 E 最大。两类要分清","x":"画箭头法最快：同种电荷在中点处箭头相对必抵消，异种电荷箭头同向必叠加，不必算数值"}],"v":["求合场强的大小与方向","求场强为零的点","同种与异种电荷的分布差别","用平行四边形定则合成","场强方向的规定"]},{"t":"电场线与粒子轨迹","f":"由电场线分布判断场强大小、电势高低、粒子的受力方向与轨迹弯曲","k":"三条读法：电场线疏密看场强大小、切线方向看正电荷受力方向、沿电场线方向电势降低","q":[{"q":"某电场的电场线由左向右逐渐变密。一带正电粒子从左侧由静止释放，判断它的加速度、动能与电势能如何变化。","s":["电场线变密说明场强变大，故加速度逐渐增大","正电荷受力沿电场线方向，向右加速运动","电场力做正功，动能增加、电势能减少","只有电场力做功，动能与电势能之和保持不变"],"a":"加速度逐渐增大，动能增加，电势能减少","c":"电场线是「不用公式的场强地图」：疏密、方向、走向分别对应大小、方向、电势高低","x":"用能量守恒校验：动能增加多少，电势能就减少多少，两者之和恒定，不必算具体数值"}],"v":["判断场强的大小","判断电势的高低","判断粒子的受力方向","由轨迹弯曲方向定受力","粒子的电性与动能变化"]},{"t":"匀强电场中 E 与 U 的关系","f":"由两点电势差求场强，或判断电场方向、画等势线","k":"U = Ed，d 是沿电场方向的距离；场强方向由高电势指向低电势","q":[{"q":"匀强电场中 A、B 两点相距 0.2 m，连线与电场方向成 60° 角，U_AB = 100 V。求场强大小。","s":["沿电场方向的距离 d = 0.2×cos60° = 0.1 m","由 U = Ed 得 E = U/d","E = 100/0.1 = 1000 V/m","方向由高电势指向低电势"],"a":"1000 V/m","c":"d 必须是「沿电场方向」的投影距离，直接拿两点间距代入是最常见的错","x":"记 E = U/(L cosθ)，θ 是连线与电场方向的夹角"}],"v":["由电势差求场强","由场强求电势差","判断电场的方向","画出等势线并定电场方向","U = Ed 中 d 的含义"]}],"电学实验":[{"t":"伏安法测电阻：内接与外接","f":"选择电流表内接还是外接，判断测量值偏大还是偏小，或估算误差","k":"大电阻用内接（测量值偏大），小电阻用外接（测量值偏小）；临界值是 R_x 与 √(R_A·R_V) 的比较","q":[{"q":"待测电阻约 100 Ω，电压表内阻 3 kΩ，电流表内阻 1 Ω。应选内接还是外接？测量值偏大还是偏小？","s":["临界值 √(R_A R_V) = √(1×3000) ≈ 55 Ω","R_x = 100 Ω > 55 Ω，属于「大电阻」","故选用电流表内接法","内接时电流表分走一部分电压，电压表读数偏大，故 R测 > R真"],"a":"内接法，测量值偏大","c":"口诀「大内偏大、小外偏小」：大电阻用内接、结果偏大；小电阻用外接、结果偏小","x":"直接比较 R_x² 与 R_A R_V：100² = 10⁴ > 3000，故用内接，与临界值法结论一致且不用开方"}],"v":["选择内接还是外接","判断测量值偏大还是偏小","估算误差的大小","大电阻与小电阻的选择依据","「大内小外」的口诀"]},{"t":"分压与限流接法","f":"选择滑动变阻器的分压或限流接法，或连接实物图、判断调节范围","k":"需要电压从零连续调节、或变阻器阻值远小于待测电阻时用分压；其余情况优先限流（简单省电）","q":[{"q":"要用 0~3 V 连续可调的电压测小灯泡的伏安特性曲线，滑动变阻器最大阻值 10 Ω、灯泡电阻约 10 Ω。应选哪种接法？","s":["要求电压从零开始连续调节","限流接法时灯泡两端电压不能调到零","故必须使用分压接法","分压接法把变阻器全部接入回路，通过滑动触头分压，调节范围覆盖 0 到电源电压"],"a":"分压接法","c":"三条判据：要从零调、要大幅度调、变阻器阻值小于待测电阻——满足任一条就用分压","x":"记一句「测伏安特性曲线一律分压」，这是最常考的实验，几乎不必再逐条判断"}],"v":["选择分压还是限流","按电路图连接实物图","判断电压或电流的调节范围","什么情况必须用分压","两种接法的能耗比较"]},{"t":"实验数据处理与误差分析","f":"由多组数据求平均值、作图像求物理量，或分析系统误差的来源与方向","k":"图像法核心是「化曲为直」：把公式整理成 y = kx + b，斜率与截距才对应物理量","q":[{"q":"用单摆测重力加速度，测得多组摆长 L 与周期 T，应作什么图线？若图线斜率为 k，g 等于多少？","s":["由 T = 2π√(L/g) 两边平方得 T² = (4π²/g)L","以 L 为横轴、T² 为纵轴作图，图线是过原点的直线","斜率 k = 4π²/g","故 g = 4π²/k"],"a":"作 L-T² 图线，g = 4π²/k","c":"数据处理的核心是化曲为直：先整理成 y = kx + b，斜率和截距才有物理意义","x":"记住「T² 与 L 成正比」，作 L-T² 图最省事；若作 T-L 图是曲线，斜率没有意义"}],"v":["由多组数据求平均值","作图像求物理量","分析系统误差的方向","用逐差法处理数据","为什么作图像比求平均更可靠"]}],"电容器":[{"t":"动态分析：电压不变与电量不变","f":"电容器保持接电源（U 不变）或充电后断开（Q 不变），改变板间距、正对面积或插入介质，判断 C、U、Q、E 的变化","k":"先定谁不变，再走三步链条：C = εS/(4πkd) → U = Q/C → E = U/d。断电源时 Q 不变，接电源时 U 不变","q":[{"q":"平行板电容器充电后断开电源，把板间距增大为原来的 2 倍。判断电容、电压、板间场强的变化。","s":["断开电源，电荷量 Q 保持不变","C ∝ 1/d，d 加倍则 C 减半","U = Q/C，C 减半则 U 加倍","E = U/d = 2U₀/(2d₀) = U₀/d₀，场强不变"],"a":"C 减半，U 加倍，E 不变","c":"断电源时 E 与板间距无关（E = Q/εS），这是最重要也最反直觉的结论","x":"两条极端结论覆盖全部动态分析：断电源 E = Q/(εS) 与 d 无关；接电源 E = U/d 与 d 成反比"}],"v":["U 不变时改变板间距","Q 不变时改变板间距","插入电介质后的变化","判断 C、U、Q、E 各如何变","断开电源后 E 与 d 无关"]},{"t":"电容器的电量与储能","f":"求所带电荷量、电压、储能，或计算充放电过程中通过某截面的电荷量","k":"Q = CU，储能 W = ½CU² = ½QU；通过截面的电荷量等于电容器电荷量的变化量","q":[{"q":"电容 10 μF 的电容器接在 20 V 电源上。求所带电荷量与储能；若电压升到 40 V，需再补充多少电荷？","s":["Q₁ = CU₁ = 10×10⁻⁶ × 20 = 2×10⁻⁴ C","W = ½CU₁² = ½ × 10⁻⁵ × 400 = 2×10⁻³ J","Q₂ = CU₂ = 10⁻⁵ × 40 = 4×10⁻⁴ C","ΔQ = Q₂ − Q₁ = 2×10⁻⁴ C"],"a":"2×10⁻⁴ C，储能 2×10⁻³ J；需补充 2×10⁻⁴ C","c":"Q = CU 是最基本的式子；储能公式的系数 ½ 千万别漏，它来自「电压从零逐渐升高」的过程","x":"用 W = ½QU 校验：½ × 2×10⁻⁴ × 20 = 2×10⁻³ J，与 ½CU² 一致，两个公式互为检查"}],"v":["求所带的电荷量","求电容器的储能","求充放电通过的电荷量","用 C = Q/U 计算","储能公式 E = ½CU²"]},{"t":"电容器中的带电体平衡","f":"平行板间带电液滴静止，改变板间距或电压后判断液滴如何运动","k":"液滴静止时 qE = mg；保持接电源则 U 不变，断开电源则 Q 不变","q":[{"q":"平行板电容器水平放置，板间有一质量 m、电荷量 q 的带电液滴恰好静止。现将两板间距增大为原来的 2 倍（仍接在电源上），液滴如何运动？","s":["原来静止：qE = mg，其中 E = U/d","接在电源上，电压 U 保持不变","d 变为 2d，新场强 E′ = U/(2d) = E/2","电场力变为 qE/2 = mg/2 < mg","故液滴向下加速，a = (mg − mg/2)/m = g/2"],"a":"向下加速，加速度为 g/2","c":"先判断「U 不变还是 Q 不变」：保持接电源就是 U 不变，断开电源才是 Q 不变","x":"记「U 不变时 E 与 d 成反比」，d 翻倍则 E 减半、电场力减半，方向立刻可判"}],"v":["液滴静止时求电荷量","改变板间距后如何运动","改变电压后的加速度","判断是否仍能平衡","电场力与重力平衡"]}],"电磁感应":[{"t":"感应电流方向的判断","f":"判断线圈进出磁场、磁铁插入拔出、磁场变化时的感应电流方向与受力方向","k":"楞次定律「增反减同」定感应磁场方向，再用安培定则定电流方向；切割磁感线时用右手定则更快","q":[{"q":"矩形闭合线圈从磁场外进入垂直纸面向里的匀强磁场区域。判断进入过程中感应电流的方向；若穿出磁场，方向又如何？","s":["进入时穿过线圈的向里磁通量在增加","感应电流的磁场要阻碍增加，故方向向外","由安培定则，电流方向为逆时针","穿出磁场时磁通量减少，感应磁场向里，电流变为顺时针"],"a":"进入时逆时针，穿出时顺时针","c":"「增反减同」是全部方向判断的源头：先看磁通量是增还是减，再定感应磁场方向，最后定电流","x":"用力学表述校验：「来拒去留」——进入时受排斥、穿出时受吸引，与电流方向的结论互为印证"}],"v":["线圈进出磁场时的电流方向","磁铁插入拔出时的电流方向","磁场变化时的电流方向","判断线圈受到的安培力方向","用楞次定律或右手定则"]},{"t":"电磁感应中的能量与电荷量","f":"求产生的焦耳热、通过截面的电荷量、外力做的功或功率","k":"安培力做负功等于电能增加，最终等于焦耳热；q = nΔΦ/R 只与磁通量变化有关，与时间无关","q":[{"q":"质量 0.1 kg 的导体棒在导轨上以 2 m/s 匀速运动，B = 0.5 T，棒长 0.4 m，回路总电阻 0.2 Ω。求感应电动势、电流、安培力与外力的功率。","s":["E = BLv = 0.5×0.4×2 = 0.4 V","I = E/R = 0.4/0.2 = 2 A","F = BIL = 0.5×2×0.4 = 0.4 N","外力功率 P = Fv = 0.8 W，恰好等于 I²R = 4×0.2 = 0.8 W"],"a":"E = 0.4 V，I = 2 A，F = 0.4 N，功率 0.8 W","c":"匀速运动时外力做的功全部转化为焦耳热，P外 = Fv = I²R = E²/R 三个式子必然相等，可用来验算","x":"直接用 P = B²L²v²/R 一步求功率，跳过电流与力的中间计算"}],"v":["求产生的焦耳热","求通过截面的电荷量 q = nΔΦ/R","求外力做的功","求外力的功率","能量守恒的分配"]},{"t":"导体棒切割时两端电势的高低","f":"判断切割磁感线的导体棒哪端电势高，或求两端的电势差","k":"把导体棒看成电源，内部电流从低电势流向高电势；先用右手定则定电流方向，再判断哪端是正极","q":[{"q":"导体棒在垂直纸面向里的匀强磁场中向右运动，判断棒两端哪端电势高。","s":["右手定则：磁感线穿入掌心（手心向外），拇指指向运动方向（向右）","四指指向感应电流方向，即向下","棒相当于电源，内部电流由负极流向正极","故下端电势高"],"a":"下端（电流流出的一端）电势高","c":"棒内电流从低电势流向高电势，这是「电源内部」的规则，与外部电路正好相反","x":"记「右手定则定电流，电流流出端是正极」，两步搞定"}],"v":["判断哪端电势高","求两端的电势差","把棒看成电源处理","电流流出端是正极","内外电路的电压分配"]}],"盖-吕萨克定律":[{"t":"等压变化的计算","f":"求等压过程中的体积或温度，常见于活塞可自由移动的气缸","k":"V₁/T₁ = V₂/T₂；「活塞自由移动」「开口容器」都是等压过程的标志","q":[{"q":"气缸内气体在 27 ℃ 时体积为 2 L，活塞可自由移动。加热到 127 ℃，体积变为多少？","s":["活塞自由移动意味着压强始终等于外界压强，是等压过程","T₁ = 300 K，T₂ = 400 K","V₂ = V₁T₂/T₁ = 2 × 400/300","V₂ ≈ 2.67 L"],"a":"约 2.67 L","c":"先判断过程类型：活塞能动就是等压，容器密闭且体积固定就是等容，这一步决定用哪条定律","x":"用比例：400/300 = 4/3，体积同比例放大到 8/3 L，一步出结果"}],"v":["求等压过程的体积","求等压过程的温度","活塞可自由移动的气缸","V 与 T 成正比","V₁/T₁ = V₂/T₂ 的应用"]},{"t":"等压过程中的功","f":"求气体对外做的功，或由 p-V 图求功","k":"W = pΔV 只适用于等压过程；一般过程的功等于 p-V 图线下的面积","q":[{"q":"气体在 1.0×10⁵ Pa 下等压膨胀，体积由 2 L 增大到 5 L。求气体对外做的功。","s":["等压过程：W = pΔV","ΔV = 3 L = 3×10⁻³ m³","W = 1.0×10⁵ × 3×10⁻³","W = 300 J"],"a":"300 J","c":"只有等压过程才有 W = pΔV；其他过程必须用 p-V 图面积或由第一定律反求","x":"单位换算是本类题最大的坑：1 L = 10⁻³ m³，先把体积换成 m³ 再乘压强"}],"v":["求气体对外做的功","由 p-V 图求功","用 W = pΔV 计算","膨胀做正功还是负功","压缩时外界对气体做功"]},{"t":"V-T 图像与绝对零度的外推","f":"由 V-T 图求斜率的意义，或把 V-t 图外推求绝对零度","k":"等压时 V/T = C，V-T 图是过原点的直线；V-t 图不过原点，与 t 轴交于 −273 ℃","q":[{"q":"某气体等压变化，V-t（摄氏温度）图是一条直线，与 t 轴交于 −273 ℃。说明该交点的物理意义。","s":["等压时 V 与热力学温度成正比：V = C·T","把 T = t + 273 代入，得 V = C(t + 273)","当 t = −273 ℃ 时 T = 0 K，V = 0","故交点即绝对零度，是理想气体体积外推的零点"],"a":"交点对应绝对零度（0 K，−273 ℃），是体积的外推零点","c":"V-T 图过原点、V-t 图交 −273 ℃；两图形状相似但坐标原点含义不同","x":"记住「V-T 过原点、V-t 交 −273」，图像类选项基本都能直接判"}],"v":["由 V-T 图求斜率","把 V-t 图外推求绝对零度","图线为什么过原点","与等容线、等温线的比较","斜率与压强的反比关系"]}],"相互作用":[{"t":"受力分析的基本程序","f":"给出斜面、绳、挡板、叠放等情境，要求画受力图，或判断某个力是否存在、方向如何","k":"顺序固定：重力 → 接触力（弹力、摩擦力）→ 其他场力。每个力都必须找到施力物体，找不到施力物体的力一定不存在","q":[{"q":"质量 m 的物体静止在粗糙斜面上（倾角 θ）。分析它受哪几个力，并求出各力大小。","s":["重力 mg，竖直向下","斜面支持力 N，垂直于斜面向上","物体有沿斜面下滑的趋势，故受静摩擦力 f，沿斜面向上","沿斜面、垂直斜面分解：f = mg sinθ，N = mg cosθ"],"a":"重力 mg、支持力 mg cosθ、静摩擦力 mg sinθ（沿斜面向上）","c":"先重力再接触力，每个接触处都问一句「有没有挤压、有没有相对运动趋势」，力的个数就不会漏也不会多","x":"用假设法反推：假设斜面光滑，物体必下滑，与「静止」矛盾，所以摩擦力一定存在且方向沿斜面向上"}],"v":["判断某个力是否存在","画出完整的受力图","确定各力的方向","选择整体还是隔离作为研究对象","按重力、弹力、摩擦力的顺序找力"]},{"t":"三力平衡的图解与相似三角形","f":"一个力大小方向不变（通常是重力），另两个力方向随几何关系缓慢变化，判断各力如何变化","k":"三个力平衡必构成闭合矢量三角形。优先寻找与「几何三角形」的相似关系，把力的变化翻译成边长的变化，比列三角函数式更稳","q":[{"q":"光滑小球用细绳悬挂在竖直墙上，绳缓慢变长的过程中，绳的张力 T 与墙对球的支持力 N 如何变化？","s":["球受重力 G、绳张力 T（沿绳）、墙的支持力 N（水平向外）","三力平衡，力三角形与几何三角形（悬点、球心、球心在墙上的投影）相似","对应边成比例：T/G = L/h，N/G = R/h，其中 L 为绳长、R 为球半径、h = √(L²−R²)","绳变长时 h 增大，故 T = GL/h 与 N = GR/h 都减小"],"a":"T 减小，N 减小","c":"相似三角形法的关键是找对几何三角形：力三角形的三边分别平行于几何三角形的三边，比例式一写就出结果","x":"极限法验证：绳无限长时球贴墙、绳趋于竖直，此时 T → G、N → 0，两者确实都在减小，无需计算即可判断趋势"}],"v":["一个力恒定、另一个力方向不变","动态平衡中判断各力如何变化","用相似三角形求力的大小","求使物体平衡的最小力","用矢量三角形封闭判断"]},{"t":"多力平衡与正交分解","f":"物体受四个或更多力作用而处于平衡，求某个力的大小或动摩擦因数","k":"建立直角坐标系（尽量让未知力落在坐标轴上），列 ΣFx = 0 与 ΣFy = 0 两个方程","q":[{"q":"质量 2 kg 的物块在水平地面上，受与水平方向成 37° 斜向上的拉力 F = 10 N 而匀速前进。求支持力与动摩擦因数（g = 10，sin37° = 0.6，cos37° = 0.8）。","s":["竖直方向平衡：N + F sin37° = mg","N = 20 − 10×0.6 = 14 N","水平方向平衡：f = F cos37° = 10×0.8 = 8 N","由 f = μN 得 μ = 8/14 ≈ 0.57"],"a":"支持力 14 N，动摩擦因数约 0.57","c":"斜向力必须先分解再列平衡方程；「N = mg」只在竖直方向没有其他力时才成立","x":"顺序固定：竖直方向定 N → 水平方向定 f → μ = f/N，三步走不会乱"}],"v":["求某个力的大小","求动摩擦因数","如何建立坐标系更省事","分解后列两个方向的平衡方程","四个力以上的平衡问题"]}],"相对论初步":[{"t":"光速不变原理","f":"判断关于光速、参考系、相对性原理的说法是否正确","k":"两个基本假设：物理规律在所有惯性系中形式相同；真空光速与光源、观察者的运动无关","q":[{"q":"以 0.5c 飞行的飞船向前发射一束激光，地面观察者测得的光速是多少？","s":["由光速不变原理，真空光速与光源的运动无关","也不与观察者的运动有关","故测得的光速仍为 c","不能按经典速度合成写成 1.5c"],"a":"仍为 c","c":"光速不变是最反直觉也最常考的一条：任何惯性系中测得的光速都等于 c","x":"一句话：速度可以相加，光速不能相加——这是相对论与经典力学的分界线"}],"v":["判断关于光速的说法","光速与参考系无关","相对性原理的内容","经典时空观遇到的困难","迈克尔逊—莫雷实验"]},{"t":"时间膨胀与长度收缩","f":"判断运动时钟变慢、长度收缩的效应，或比较不同参考系的测量结果","k":"Δt = Δt₀/√(1−v²/c²)，运动时钟变慢；沿运动方向的长度收缩，垂直方向不变","q":[{"q":"飞船以 0.6c 飞行，船上的钟走过 1 s。地面上的观察者测得经过了多少时间？","s":["√(1 − 0.6²) = √0.64 = 0.8","Δt = Δt₀/0.8","= 1/0.8 = 1.25 s","地面观察者认为飞船上的钟变慢了"],"a":"1.25 s","c":"公式里的 Δt₀ 是与事件相对静止的钟测得的时间（固有时），代入前先想清楚「谁在动」","x":"记住常用值：v = 0.6c 时因子 0.8，v = 0.8c 时因子 0.6，考试基本只用这两组"}],"v":["判断运动的钟是否变慢","判断运动的尺是否变短","比较不同参考系的测量结果","γ 因子的计算","只沿运动方向收缩"]},{"t":"相对论质量与质能关系","f":"判断相对论质量随速度的变化，或把质能方程与质量亏损联系起来","k":"m = m₀/√(1 − v²/c²)，速度越大质量越大；E = mc² 说明质量与能量是同一事物的两种量度","q":[{"q":"为什么说质能方程把「质量亏损」与「释放能量」统一起来了？","s":["E = mc² 表明任何质量都对应一份能量，比例系数为 c²","核反应后总质量减小 Δm，对应能量减少 Δm·c²","这部分能量并未消失，而是以生成粒子的动能和光子形式放出","故「质量亏损」与「释放核能」是同一件事的两种说法"],"a":"因为质量与能量成正比，质量减少 Δm 就等于放出 Δm·c² 的能量","c":"质能方程不是「质量变成能量」，而是「质量就是能量的一种量度」","x":"答「质量哪去了」，标准说法是：质量没有消失，随能量一起转移到生成物的动能与辐射中"}],"v":["判断质量随速度如何变化","把质能方程与质量亏损联系起来","E = mc² 的含义","速度趋近光速时质量如何变","质量与能量是同一事物的两种量度"]}],"碰撞问题":[{"t":"弹性碰撞的结论与速算","f":"求弹性正碰后两物体的速度，或判断某组速度是否可能","k":"动量守恒与动能守恒联立得 v₁′ = (m₁−m₂)v₁/(m₁+m₂)，v₂′ = 2m₁v₁/(m₁+m₂)，记熟可省去大量运算","q":[{"q":"质量 2 kg 的 A 以 6 m/s 与静止的 4 kg 的 B 发生弹性正碰。求碰后两者的速度。","s":["v₁′ = (m₁−m₂)v₁/(m₁+m₂) = (2−4)×6/6 = −2 m/s","v₂′ = 2m₁v₁/(m₁+m₂) = 2×2×6/6 = 4 m/s","A 反向运动（反弹），B 沿原方向运动","校验动能：碰前 36 J，碰后 ½×2×4 + ½×4×16 = 4 + 32 = 36 J ✓"],"a":"A 以 2 m/s 反弹，B 以 4 m/s 沿原方向运动","c":"两条结论式比每次联立动量与动能方程快得多，也更不容易算错","x":"用「等质量交换速度」特例对照：m₁ = m₂ 时碰后交换速度；本题 m₁ < m₂ 故 A 反弹，定性判断也能先排除一半选项"}],"v":["求弹性正碰后的速度","判断某组速度是否可能","质量相等时交换速度","一动碰一静的速算公式","碰后速度的相对关系"]},{"t":"碰撞可能性的三条件判断","f":"给出碰前碰后的速度或动量组合，判断哪些是可能的","k":"三条约束：动量守恒、动能不增加、碰后不能「穿越」（同向运动时后者速度不小于前者）","q":[{"q":"质量 1 kg 的 A 以 6 m/s 撞击静止的质量 2 kg 的 B。判断下列碰后组合（v_A′, v_B′）哪些可能：(4,1)、(2,2)、(−6,6)、(3,1.5)。","s":["动量守恒要求 v_A′ + 2v_B′ = 6，四个组合都满足","(4,1)：动能 8+1 = 9 J < 18 J，但 A 在后速度 4 > B 的 1，会穿越，不可能","(−6,6)：动能 18+36 = 54 J > 18 J，动能增加，不可能","(3,1.5)：动能 4.5+2.25 = 6.75 J，但 A 速度 3 > B 的 1.5，会穿越，不可能","(2,2)：动量 6 ✓、动能 6 J ✓、速度相等不穿越 ✓，可能（正是完全非弹性碰撞）"],"a":"只有 (2,2) 可能","c":"三条约束逐条筛：动量守恒 → 动能不增 → 不穿越。前两条是方程，第三条最容易被忽略","x":"先算完全非弹性碰撞的共速 v = m₁v₁/(m₁+m₂) = 2 m/s，它就是动能损失最大的极限，任何组合的动能都必须大于它对应的值"}],"v":["动量是否守恒","动能是否不增加","速度是否符合实际情景","判断哪组数据不可能","碰后同向时后者速度不能更大"]},{"t":"完全非弹性碰撞与能量损失","f":"求碰后共速、损失的动能、损失占碰前动能的比例","k":"完全非弹性碰撞共速 v = m₁v₁/(m₁+m₂)，损失动能最多；被撞物静止时损失比例为 m₂/(m₁+m₂)","q":[{"q":"质量 2 kg 的物块以 6 m/s 撞上静止的质量 4 kg 的物块并粘在一起。求共速速度与损失的动能。","s":["动量守恒：2×6 = (2+4)v，得 v = 2 m/s","碰前动能 ½×2×6² = 36 J","碰后动能 ½×6×2² = 12 J","损失 36 − 12 = 24 J，占碰前动能的 2/3"],"a":"共速 2 m/s，损失 24 J（占碰前动能的 2/3）","c":"完全非弹性碰撞的损失比例可以直接算：m₂/(m₁+m₂) = 4/6 = 2/3，不必逐个算动能","x":"记两个比例：损失 m₂/(m₁+m₂)，剩余 m₁/(m₁+m₂)，两者相加为 1"}],"v":["求碰后的共同速度","求损失的动能","求损失占碰前动能的比例","求碰后系统的总动能","子弹打入木块后的共同速度"]}],"磁场":[{"t":"安培定则与磁场的叠加","f":"判断通电直导线、环形电流、螺线管的磁场方向，或两个电流在某点磁场的叠加","k":"直导线用右手「握」：拇指指电流、四指指磁场；环形电流与螺线管用右手「绕」：四指指电流、拇指指内部磁场","q":[{"q":"两根平行长直导线通以同向电流，判断它们之间的相互作用是吸引还是排斥。","s":["左侧导线在其右侧（两线之间）产生的磁场垂直纸面向里","右侧导线处于该磁场中，电流方向与左侧相同","由左手定则，右侧导线受力指向左侧导线","同理左侧导线也受力指向右侧，两导线相互吸引"],"a":"同向电流相互吸引","c":"结论要记牢：同向电流相吸、反向电流相斥。这与「同种电荷相斥」正好相反，是高频陷阱","x":"推导只需两步：先求一根导线在另一根处的磁场，再用左手定则。记不住结论时现推即可"}],"v":["判断直导线周围的磁场方向","环形电流的磁场方向","螺线管的 N 极在哪端","两个电流在某点磁场的叠加","用右手螺旋定则判断"]},{"t":"地磁场与磁偏角","f":"判断小磁针指向、地磁场方向，或解释磁偏角、极光等现象","k":"地球地理北极附近是地磁南极，小磁针 N 极指向地理北方（即指向地磁南极）","q":[{"q":"在地球赤道上方的某点水平放置一枚小磁针，静止时 N 极指向哪里？","s":["地磁场在赤道上空的方向大致由南指向北","小磁针 N 极受力方向即磁场方向","故 N 极指向地理北方","严格地说，它指向地磁南极，而地磁南极在地理北极附近"],"a":"指向地理北方（地磁南极附近）","c":"一切地磁题的前提都是「地磁南北极与地理南北极相反」，先把这个前提摆正","x":"记一句话「地理北极出地磁南极」，所有指向判断都不会错"}],"v":["判断小磁针的指向","地磁场的方向与磁偏角","极光为什么出现在两极","地理南北极与地磁南北极的差别","地磁场对宇宙射线的屏蔽"]},{"t":"通电线圈在磁场中的转动","f":"判断线圈受力与转动方向，或解释电流表、电动机的工作原理","k":"线圈两边受安培力形成力偶使线圈转动；线圈平面与磁场平行时磁力矩最大，垂直时为零","q":[{"q":"矩形线圈放在匀强磁场中，通以电流后开始转动。判断线圈转到什么位置时磁力矩为零。","s":["线圈平面与磁场平行时，两边受力方向相反且都垂直于磁场，力臂最大，磁力矩最大","线圈平面与磁场垂直时，两边受力沿平面方向、作用线共线","此时力臂为零，磁力矩为零","注意此时穿过线圈的磁通量恰好最大"],"a":"线圈平面与磁场垂直（磁通量最大）时磁力矩为零","c":"磁力矩最大对应「线圈平面与磁场平行」，为零对应「线圈平面与磁场垂直」——与磁通量的极值正好相反，别记混","x":"记「平行力矩大、垂直力矩零」，与「平行磁通量为零、垂直磁通量最大」对照记忆"}],"v":["判断线圈的转动方向","磁力矩何时最大、何时为零","电流表的工作原理","电动机的换向器作用","线圈平面与磁场平行时的受力"]}],"磁感应强度":[{"t":"磁感应强度的定义与理解","f":"判断关于 B 的说法是否正确，或由安培力求 B，或讨论 B 与 F、I、L 的关系","k":"B = F/(IL) 是定义式：B 由磁场本身决定，与试探电流的 F、I、L 都无关；方向是小磁针 N 极受力方向","q":[{"q":"长 0.5 m 的导线垂直放入匀强磁场中，通 2 A 电流时受安培力 0.4 N。求磁感应强度；若电流加倍，B 是否改变？","s":["B = F/(IL) = 0.4/(2×0.5) = 0.4 T","B 由磁场本身决定，与放入的电流无关","电流加倍只使安培力加倍（变为 0.8 N）","B 仍为 0.4 T"],"a":"B = 0.4 T；电流加倍时 B 不变","c":"定义式只用于「测量」B，绝不能说「B 与 F 成正比、与 IL 成反比」，这是最常见的概念错误","x":"与 E = F/q 类比：都是用受力去测场，场本身与试探物无关，两处逻辑完全一样"}],"v":["判断关于 B 的说法是否正确","由安培力反求 B","B 与 F、I、L 的关系","B 由磁场本身决定","B 的方向如何规定"]},{"t":"磁通量与有效面积","f":"求穿过某个面的磁通量，或判断线圈转动时磁通量的变化","k":"Φ = B·S⊥，S⊥ 是线圈面积在垂直 B 方向上的投影；线圈平面垂直 B 时最大，平行时为零","q":[{"q":"面积 0.02 m² 的线圈放在 0.5 T 的匀强磁场中。线圈平面与磁场垂直时磁通量多大？绕轴转过 60° 后多大？","s":["垂直时 Φ = BS = 0.5×0.02 = 0.01 Wb","转过 60° 后，线圈法线与 B 的夹角为 60°","Φ = BS cos60° = 0.01×0.5 = 0.005 Wb","若转到 90°，线圈平面与 B 平行，Φ = 0"],"a":"0.01 Wb；转过 60° 后为 0.005 Wb","c":"磁通量看的是「穿过」的有效面积，即 S 在垂直 B 方向上的投影，不是线圈面积本身","x":"记「垂直最大、平行归零」，中间按 cosθ 过渡，不必每次重新推投影关系"}],"v":["求穿过某个面的磁通量","线圈转动时磁通量如何变化","有效面积的取法","Φ = BS 中 S 的含义","磁通量为零时 B 是否为零"]},{"t":"B 与 E 的类比与区别","f":"判断关于磁感应强度与电场强度异同的说法，或比较两者的定义方式与方向规则","k":"都用比值定义（E = F/q、B = F/(IL)）；但 E 的方向就是正电荷受力方向，B 的方向与安培力方向垂直","q":[{"q":"判断「磁感应强度的方向就是通电导线在该处所受安培力的方向」是否正确，并说明理由。","s":["由左手定则，安培力方向与 B、I 都垂直","B 的方向由小磁针 N 极的指向定义，与受力方向无关","故该说法错误","对比电场：E 的方向确实就是正电荷受力方向，两者定义方式相似但方向规则不同"],"a":"错误；B 的方向由小磁针 N 极定义，与安培力方向垂直","c":"类比要小心：电场力与场同向，磁场力与场垂直，这是电磁学里最容易混淆的一处","x":"记「电场力顺着场、磁场力横着场」，一句话分开"}],"v":["比较两者的定义方式","比较两者方向的规定","电场力与磁场力的方向差别","判断某句类比说法是否正确","两者都由场本身决定"]}],"等效替代法":[{"t":"合力与分力的等效替换","f":"求合力、分力，或判断「效果相同」的替换是否成立、合力与分力能否同时计入","k":"合力与分力是等效替代关系：作用效果相同，但不能重复计入——加了合力就不能再加分力","q":[{"q":"两个大小均为 10 N 的力，夹角 120°。求它们的合力大小与方向。","s":["平行四边形定则：F = √(F₁² + F₂² + 2F₁F₂cos120°)","cos120° = −0.5，代入得 F = √(100 + 100 − 100)","F = √100 = 10 N","方向沿两力夹角的角平分线"],"a":"10 N，方向沿角平分线","c":"大小相等的两个力夹角 120° 时，合力与分力等大，这是最常用的特殊结论，直接记","x":"菱形法：两个 10 N 夹 120° 构成等边三角形的两边，对角线长 10 N，看图即得"}],"v":["求合力或分力","判断「效果相同」是否成立","合力与分力能否同时计入","等效替代的前提条件","等效不是相等"]},{"t":"等效重力与等效重力加速度","f":"求复合场中小球的平衡位置、摆动周期、圆周运动临界速度","k":"重力与电场力都是恒力时，合成一个「等效重力」G′，等效重力加速度 g′ = G′/m，之后完全按单一重力场处理","q":[{"q":"竖直向下的匀强电场中，带正电小球（质量 m、电荷量 q）用长 L 的细线悬挂，已知 qE = mg。求小球小角度摆动的周期。","s":["重力 mg 与电场力 qE 都竖直向下，可等效替代为一个等效重力","G′ = mg + qE = 2mg","等效重力加速度 g′ = G′/m = 2g","单摆周期 T = 2π√(L/g′) = 2π√(L/2g)"],"a":"T = 2π√(L/(2g))，约等于 π√(2L/g)","c":"恒力场叠加的通用做法：先合成等效重力定平衡位置，再把 g 换成 g′，其余公式一字不改","x":"记 g′ = g ± qE/m：同向相加、反向相减，直接代进单摆周期公式，不必重新推导"}],"v":["求复合场中的平衡位置","求等效摆长与周期","求圆周运动的临界速度","等效重力场的方向与大小","把电场力与重力合成"]},{"t":"等效电源与等效电阻","f":"把含源电路等效为一个电源，简化复杂电路的计算","k":"等效电动势等于该部分的开路电压，等效内阻等于其余电源置零后的等效电阻","q":[{"q":"电源 E、r 与电阻 R 串联，把 R 与电源一起看成一个等效电源，求其等效电动势与内阻。","s":["等效电动势 = 该部分的开路电压，即 a、b 两点断开时的 U_ab","R 与 r 串联且无电流时，U_ab = E","等效内阻 = 把 E 短路后 a、b 两点间的电阻 = r + R","故等效电源电动势为 E，等效内阻为 r + R"],"a":"等效电动势 E，等效内阻 r + R","c":"等效电源两步：开路电压定电动势、电源置零定内阻——顺序不能乱","x":"任何「把一部分电路打包」的题都按这两步走：先求开路电压，再把独立源置零求电阻"}],"v":["求等效电动势","求等效电源的内阻","用开路电压定电动势","把独立源置零定内阻","简化复杂含源电路"]}],"简谐运动":[{"t":"简谐运动的参量与图像","f":"由振动图像求振幅、周期、频率、某时刻的位移与速度方向，或求某段时间内的路程","k":"振幅看峰值、周期看两相邻同向过零点、速度方向看斜率；位移最大处速度为零、加速度最大，平衡位置处正好相反","q":[{"q":"某质点做简谐运动，位移—时间图像为从原点出发向上的正弦曲线，振幅 4 cm，周期 0.4 s。求 t = 0.1 s 时的位移与速度。","s":["ω = 2π/T = 5π rad/s，故 x = 4sin(5πt) cm","t = 0.1 s 时 5πt = 0.5π","x = 4sin(0.5π) = 4 cm，位于正向最大位移处","该处速度为 0，加速度大小最大、方向指向平衡位置"],"a":"位移 4 cm（正向最大），速度为零","c":"先由图像定初相位与 ω，再代入时刻；位置与速度的对应关系要背成条件反射","x":"记四句话：位移最大处速度为零、加速度最大；位移为零处速度最大、加速度为零。选择题几乎都能秒判"}],"v":["由图像读振幅与周期","由周期求频率","求某时刻的位移与速度方向","求一段时间内的路程","求某段时间内的位移"]},{"t":"单摆周期与等效摆长","f":"单摆周期计算、摆长变化、用单摆测重力加速度、不同天体上的周期比较","k":"T = 2π√(L/g)，与摆球质量、振幅（小角度）无关；等效摆长要算到摆球球心，不是悬点到球顶","q":[{"q":"摆长 1 m 的单摆在地球表面周期为 2 s（取 π² ≈ 10）。把它移到月球，月球表面重力加速度为地球的 1/6。求月球上的周期。","s":["T = 2π√(L/g)，周期与 √(1/g) 成正比","T月/T地 = √(g地/g月) = √6","T月 = 2×√6 ≈ 4.9 s","重力加速度变小，周期变长，符合「月球上摆得慢」的直觉"],"a":"约 4.9 s","c":"比较不同星球上的周期，用比例式 T ∝ 1/√g 最快，不必重新算一遍 2π√(L/g)","x":"记住 g = 10 m/s² 时 T ≈ 2√L（秒摆 L ≈ 1 m），本题直接得 2 s，月球上再乘 √6 即可"}],"v":["求单摆的周期","摆长变化后周期如何变","用单摆测重力加速度","不同天体上的周期比较","等效摆长的计算"]},{"t":"简谐运动的对称性与周期性","f":"求质点两次经过同一位置的时间关系、某段路程对应的最短时间，或一个周期内的路程","k":"关于平衡位置对称的两点速度大小相等；一个周期内路程恒为 4A，与起点无关","q":[{"q":"弹簧振子的周期为 0.4 s，振幅 5 cm。某时刻振子经过平衡位置，求它第一次到达最大位移处所需时间，以及 1 s 内经过的路程。","s":["从平衡位置到最大位移是四分之一周期：t = T/4 = 0.1 s","1 s = 2.5 个周期","一个周期内路程恒为 4A = 20 cm","2.5 个周期的路程 = 2.5×20 = 50 cm"],"a":"0.1 s；1 s 内路程 50 cm","c":"「一个周期走 4A」与起点无关，最可靠；但「半周期 2A、四分之一周期 A」只在从平衡位置或最大位移处起算时才成立","x":"直接用「周期数 × 4A」算路程；不要拿 A 去乘非整数倍的四分之一周期，那样容易错"}],"v":["两次经过同一位置的时间关系","某段路程对应的最短时间","一个周期内的路程为 4A","关于平衡位置对称的两点速度等大反向","求振动的总时间"]}],"自感互感":[{"t":"通电自感与断电自感","f":"判断开关闭合、断开瞬间各灯泡的亮度变化与电流方向","k":"自感电动势阻碍电流变化：通电时电流不能突变（逐渐增大），断电时电流不能突变（逐渐减小）","q":[{"q":"电感线圈与灯泡并联后接在电源上，断开开关瞬间，灯泡是立即熄灭还是闪亮一下再熄灭？","s":["断开前线圈中有稳定电流","断开瞬间线圈产生自感电动势，阻碍电流减小","线圈与灯泡构成新的闭合回路，电流经灯泡继续流动","若断开前线圈电流大于灯泡电流，灯泡会闪亮一下再熄灭；否则逐渐熄灭"],"a":"取决于断开前线圈电流与灯泡电流的大小关系：线圈电流更大则闪亮一下","c":"判断闪不闪只比一件事：断开前线圈的电流是否大于灯泡的电流","x":"一句话理解：断电自感时线圈相当于临时电源，电流方向与原来相同，沿回路继续流动"}],"v":["闭合开关瞬间灯泡的亮度变化","断开开关瞬间灯泡是否闪亮","判断电流方向","自感电动势阻碍电流变化","断电时灯泡为何先亮后灭"]},{"t":"自感系数与涡流","f":"判断自感系数的影响因素，或分析涡流的利弊与防止措施","k":"自感系数 L 由线圈自身结构（匝数、截面积、有无铁芯）决定，与电流、电压无关；涡流是整块导体中的感应电流","q":[{"q":"把铁芯插入线圈后自感系数如何变化？变压器铁芯为什么用硅钢片叠压而成而不是整块铁？","s":["插入铁芯后磁通量大大增加","自感系数 L 显著增大","整块铁芯中会产生很大的涡流，发热损耗能量","用硅钢片叠压并相互绝缘，可切断涡流路径，减小损耗"],"a":"L 显著增大；硅钢片叠压是为了减小涡流损耗","c":"L 只由线圈本身的结构决定，与电流、电压无关，这是概念题的高频陷阱","x":"类比记忆：电容 C 也只由结构决定（C = εS/4πkd），两个「只由本身决定」的元件可以一起记"}],"v":["判断自感系数的影响因素","分析涡流的利弊","涡流的防止措施","电磁炉与变压器铁芯","线圈匝数与自感系数的关系"]},{"t":"互感与变压器的基本原理","f":"判断互感现象，或由匝数比求电压、电流","k":"互感是一个线圈的电流变化在另一线圈中产生感应电动势；理想变压器电压比等于匝数比","q":[{"q":"理想变压器原线圈 1000 匝接 220 V 交流，副线圈 100 匝。求副线圈电压。","s":["理想变压器：U₁/U₂ = n₁/n₂","220/U₂ = 1000/100 = 10","U₂ = 22 V","接负载时功率相等：P₁ = P₂，故 I₁/I₂ = n₂/n₁"],"a":"22 V","c":"变压器只能改变交流电压，不能改变直流；电压比等于匝数比，电流比是匝数的反比","x":"记「匝数比 = 电压比 = 电流反比」，三个比例一次记牢"}],"v":["判断是否存在互感现象","由匝数比求电压","由匝数比求电流","理想变压器的功率关系","变压器为什么不能变直流"]}],"薄膜干涉":[{"t":"增透膜与增反膜","f":"求增透膜的最小厚度，或判断膜厚与波长的关系","k":"增透膜利用两表面反射光相消，膜厚为介质中波长的四分之一，即 d = λ/(4n)","q":[{"q":"在折射率 1.5 的玻璃表面镀增透膜（膜材料折射率 1.38），使波长 550 nm 的绿光反射最少。求最小膜厚。","s":["增透条件：两表面反射光的光程差为半波长，反射相消","膜厚 d = λ/(4n)","= 550/(4×1.38)","≈ 99.6 nm"],"a":"约 100 nm","c":"增透膜厚度是「介质中波长的四分之一」，必须除以膜的折射率，不能直接用真空波长","x":"记住数量级：可见光增透膜约 100 nm。若算出几百 nm，说明忘了除以 n"}],"v":["求增透膜的最小厚度","判断膜厚与波长的关系","为什么厚度取 λ/4","增反膜的条件","反射光相消还是相长"]},{"t":"检验平整度与条纹弯曲","f":"由干涉条纹的弯曲方向判断表面是凸还是凹，或解释条纹疏密","k":"同一级条纹对应同一膜厚，故条纹总是向「膜更薄」的方向弯曲；条纹越密说明厚度变化越快","q":[{"q":"用标准平板检查工件表面时，干涉条纹向左侧弯曲。判断该处表面是凸起还是凹陷。","s":["同一级条纹对应相同的空气膜厚度","条纹向左弯曲，说明该处「同厚度」的位置比周围偏左","即该处膜厚偏大，工件表面凹陷","若条纹向右弯曲，则说明该处凸起"],"a":"该处表面凹陷","c":"判据：条纹总是向膜更薄的方向弯曲，因为同一级条纹对应同一膜厚","x":"记「弯向薄处」，再判断哪一边更薄，凹凸立刻清楚"}],"v":["判断表面是凸还是凹","解释条纹为什么疏密不均","弯曲方向与凹凸的对应","用劈尖检验平整度","条纹弯曲说明什么"]},{"t":"劈尖干涉的条纹间距与楔角","f":"由条纹间距判断楔角的变化，或解释条纹为什么等间距","k":"相邻亮纹对应膜厚差 λ/2，条纹间距 Δx = λ/(2θ)，θ 为楔角","q":[{"q":"用两块玻璃片夹成空气劈尖观察干涉条纹。若把夹片变薄使楔角减小，条纹间距如何变化？","s":["相邻亮纹对应的膜厚增加 λ/2","膜厚随水平距离的变化率由楔角决定：Δh = θ·Δx","令 θ·Δx = λ/2，得 Δx = λ/(2θ)","θ 减小则 Δx 增大，条纹变稀疏"],"a":"条纹间距变大，条纹变稀疏","c":"「楔角越小、条纹越疏」——这是劈尖干涉唯一的定量结论，检验平整度也靠它","x":"记住 Δx = λ/(2θ)，θ 在分母，所以楔角与条纹间距成反比"}],"v":["判断楔角变化后间距如何变","解释条纹为什么等间距","用 Δx = λ/(2θ) 计算","楔角越小条纹越疏","膜厚差为 λ/2 对应一条条纹"]}],"质能方程":[{"t":"质量亏损与结合能","f":"求质量亏损、结合能、比结合能，或比较原子核的稳定性","k":"ΔE = Δmc²；比结合能 = 结合能 ÷ 核子数，中等质量核的比结合能最大、最稳定","q":[{"q":"氦核（4 个核子）的结合能为 28.3 MeV。求它的比结合能，并说明意义。","s":["比结合能 = 28.3 ÷ 4","≈ 7.1 MeV/核子","比结合能越大，原子核越稳定","铁附近的核比结合能最大（约 8.8 MeV/核子），所以最稳定"],"a":"约 7.1 MeV/核子","c":"衡量稳定性要看比结合能而不是结合能：核子多的核结合能自然大，但不一定更稳定","x":"记住「铁最稳定」，裂变与聚变都朝铁的方向走，所以两者都能释放能量"}],"v":["由原子质量求质量亏损","由质量亏损求结合能","求比结合能并比较稳定性","比较原子核的稳定性"]},{"t":"质量亏损的物理含义","f":"判断核反应中质量是否守恒，或解释亏损的质量去了哪里","k":"质量并没有消失，而是以能量形式释放；核反应中质量不守恒，但质能总量守恒","q":[{"q":"某核反应后总质量减少了 0.002 u。减少的质量去哪了？","s":["质量并没有凭空消失","由 ΔE = Δmc²，减少的质量以能量形式释放","ΔE = 0.002 × 931.5 ≈ 1.86 MeV","这些能量以光子动能、粒子动能的形式带走"],"a":"转化为约 1.86 MeV 的能量释放出去","c":"质量与能量是同一事物的两种形式：核反应中「质量不守恒，但质能总量守恒」","x":"一句话：亏损的质量变成了光子和粒子的动能，能量与质量始终等价"}],"v":["核反应中质量是否守恒","亏损的质量去了哪里","质量与能量的等价性","反应前后的总能量","不是质量消失而是形式转化"]},{"t":"比结合能曲线与核能释放方向","f":"由质量亏损计算核反应释放的能量，或判断某反应是否放能","k":"ΔE = Δm·c²；实用形式 ΔE = Δm × 931.5 MeV/u，也可用比结合能之差乘核子数","q":[{"q":"某核反应中质量亏损 0.02 u，已知 1 u 对应 931.5 MeV。求释放的核能。","s":["ΔE = Δm·c²，实用形式为 ΔE = Δm × 931.5 MeV/u","ΔE = 0.02 × 931.5","≈ 18.6 MeV","该能量以生成粒子的动能与γ光子形式释放"],"a":"约 18.6 MeV","c":"记住换算 1 u ↔ 931.5 MeV，比每次代 c² = 9×10¹⁶ 快十倍且不易错","x":"看到 u 就用 931.5 乘，看到 kg 才用 c² 硬算，两种单位不要混"}],"v":["计算反应释放的能量","判断某反应是否放能","为什么裂变与聚变都放能","都向曲线峰值靠拢","比结合能变大就放能"]}],"超重失重":[{"t":"视重的计算与判断","f":"电梯升降过程中体重计示数、弹簧秤读数，或由示数反推运动状态","k":"视重就是支持力或拉力，由牛顿第二定律决定；超重看加速度向上、失重看加速度向下，与速度方向完全无关","q":[{"q":"质量 60 kg 的人站在电梯内的体重计上，电梯正以 3 m/s² 的加速度减速下降。求体重计示数（g 取 10 m/s²）。","s":["减速下降意味着速度向下、加速度向上","对人：N − mg = ma，N = m(g + a) = 60×13","N = 780 N，大于实重 600 N","示数偏大，处于超重状态"],"a":"780 N","c":"先由「上升还是下降 + 加速还是减速」定出加速度方向，再代 N − mg = ma；速度方向不影响结论","x":"用等效重力加速度 g' = g + a = 13 m/s²，示数 = mg'，一步出结果；判超重失重只看 a 的箭头朝上还是朝下"}],"v":["求体重计的示数","由示数反推加速度","加速上升与减速下降的区别","完全失重时示数为零","斜向加速时的示数"]},{"t":"完全失重现象的判断","f":"空间站、自由落体系统内的仪器与现象判断，如天平、气压计、摆钟、浮力是否失效","k":"完全失重的条件是 a = g 且方向向下，此时一切由重力产生的效果（压力、浮力、液体压强、单摆回复力）全部消失，但质量与惯性不变","q":[{"q":"在绕地球做匀速圆周运动的空间站内，下列仪器仍能正常使用的是：A 天平　B 水银气压计　C 弹簧测力计　D 摆钟","s":["完全失重时物体对支持面的压力为零","天平靠重力压盘工作，失效；水银气压计靠液柱重力，失效；摆钟靠重力提供回复力，失效","弹簧测力计测的是弹簧的弹力，只要有力拉它就有示数","故只有弹簧测力计仍可使用"],"a":"C 弹簧测力计","c":"判断标准是「该仪器是否依赖重力产生效果」，凡与重力无关的（弹力、惯性、电磁）都照常工作","x":"一句话记：失重时「与重力有关的现象全部消失，与惯性、弹力、电磁有关的一概不变」"}],"v":["天平还能否称质量","水银气压计是否失效","摆钟是否停摆","浮力是否消失","空间站内的水滴形状"]},{"t":"示数与运动状态的多解对应","f":"给出体重计示数，列举电梯所有可能的运动状态；或判断「一定向上运动」这类说法是否成立","k":"示数只反映加速度方向，不反映速度方向；失重对应向下加速或向上减速两种可能","q":[{"q":"某人站在电梯内的体重计上，某段时间内示数稳定为实重的 0.8 倍。列举电梯可能的运动状态。","s":["示数小于实重，属于失重，加速度方向向下","加速度向下有两种可能：向下加速，或向上减速","故电梯可能在加速下降，也可能在减速上升","单凭示数无法区分，必须再知道速度方向才能确定"],"a":"可能向下加速，也可能向上减速；仅凭示数不能确定","c":"示数只反映加速度方向、不反映速度方向，这是超重失重题最常设的陷阱","x":"记「失重 = 向下加速 或 向上减速」，选择题里凡出现「一定向上运动」这类绝对表述都可直接排除"}],"v":["列举电梯所有可能的运动状态","判断「一定向上运动」是否正确","示数大于实重的两种情形","示数随时间变化的图像","由示数判断超重还是失重"]}],"运动学":[{"t":"多过程运动的分段求解","f":"以「先加速再匀速后减速」「上升—下降」「传送带」等情境给出 2~3 个阶段，求总时间、总位移或某段速度","k":"画运动草图，逐段标出 v₀、v、a、x、t；阶段之间的唯一连接量是上一段的末速度，先算它，再一段一段往下推","q":[{"q":"汽车从静止出发以 2 m/s² 加速 5 s，接着匀速行驶 10 s，最后以 4 m/s² 匀减速到停止。求全程位移。","s":["第一段：v₁ = a₁t₁ = 10 m/s，x₁ = ½a₁t₁² = 25 m","第二段：x₂ = v₁t₂ = 10×10 = 100 m","第三段：t₃ = v₁/a₂ = 2.5 s，x₃ = v₁²/(2a₂) = 12.5 m","总位移 x = 25 + 100 + 12.5 = 137.5 m"],"a":"137.5 m","c":"分段列式，每段挑「缺一个量」的公式；交界速度是唯一必须传递的量，先算它再算各段，可避免重复计算","x":"画 v-t 图，位移就是图线下的面积：上底 10 s、下底 17.5 s、高 10 m/s 的梯形，(10+17.5)/2×10 = 137.5 m，一步到位还能顺手检查数量级"}],"v":["求全程总时间或总位移","求某个阶段的速度或加速度","在 v-t 图上分段求面积","判断相邻两段的加速度是否相同"]},{"t":"追及与相遇问题","f":"两物体同向运动，给出初速度、加速度或图像，判断能否追上、求最远（最近）距离或相遇时刻","k":"临界条件永远是「速度相等」——此时距离取极值。先用 v₁ = v₂ 求出临界时刻，再把两个位移相减；能否追上则看临界时刻的位移差是否已跨过初始距离","q":[{"q":"甲车以 10 m/s 匀速行驶，经过静止的乙车时乙车立即以 2 m/s² 同向启动。求两车再次相遇前相距的最远距离。","s":["速度相等时距离最远：10 = 2t，t = 5 s","甲的位移 x甲 = 10×5 = 50 m","乙的位移 x乙 = ½×2×5² = 25 m","最远距离 // 连线 = 结构边 ∪ 关系边，去重后同时供 3D 绘制与邻接表使用

[...EDGES,...Object.keys(REL).map(k=>k.split('|'))].forEach(([a,b])=>{
  const k=a<b?a+'|'+b:b+'|'+a;
  if(a===b||seen.has(k)||!POS[a]||!POS[b]) return;
  seen.add(k); LINK.push([a,b]);
});
const ADJ={}; NODES.forEach(n=>ADJ[n]=[]);
LINK.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});

// 详情面板里展示的关联：剔除父级与根节点，只留同级 / 下级，且必须有语义描述
function relOf(n){
  return (ADJ[n]||[]).filter(r=>r!==PAR[n]&&r!=='高中物理'&&LV[r]>=LV[n]&&RELM[n+'|'+r]);
}
const P=NODES.map(n=>new THREE.Vector3(POS[n][0]*R,POS[n][1]*R,POS[n][2]*R));
const RAD=NODES.map((n,i)=>SZMAP[+SZ[i]]/60*0.75);

/* ---------- 场景 ---------- */
const scene=new THREE.Scene();
scene.background=BG;

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);
camera.position.copy(HOME);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('graph').appendChild(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:2';
document.body.appendChild(labelRenderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.09;
controls.rotateSpeed=.85;
controls.zoomSpeed=.9;
controls.minDistance=5;
controls.maxDistance=70;

scene.add(new THREE.AmbientLight(0xffffff,.88));
const key=new THREE.DirectionalLight(0xffffff,.45); key.position.set(1,1.2,.8); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.18); fill.position.set(-1,-.6,-.8); scene.add(fill);

/* ---------- 连线：结构边实一点，纯关系边淡一点 ---------- */
const structSet=new Set(EDGES.map(([a,b])=>a<b?a+'|'+b:b+'|'+a));
const lpS=[], lpR=[];
LINK.forEach(([a,b])=>{const x=POS[a],y=POS[b], k=a<b?a+'|'+b:b+'|'+a;
  (structSet.has(k)?lpS:lpR).push(x[0]*R,x[1]*R,x[2]*R, y[0]*R,y[1]*R,y[2]*R)});
const mkLines=(arr,color,opacity)=>{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity});
  const l=new THREE.LineSegments(g,m); scene.add(l); return [l,m];
};
const [lines,lmat]=mkLines(lpS,0xBDC3C7,.55);
const [relLines,rlmat]=mkLines(lpR,0xA7B2BD,.2);

/* ---------- 节点与标签 ---------- */
const meshes=[], labels=[], labelPos=[];
NODES.forEach((n,i)=>{
  const r=RAD[i], c=new THREE.Color(INFO[n][0]);
  const mat=new THREE.MeshLambertMaterial({color:c.clone(),emissive:c.clone(),emissiveIntensity:.08});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);
  mesh.position.copy(P[i]);
  mesh.userData={i,c};
  scene.add(mesh); meshes.push(mesh);

  const el=document.createElement('div');
  el.className='lbl'; el.textContent=n;
  const lb=new CSS2DObject(el);
  lb.position.copy(P[i]).add(new THREE.Vector3(0,r*1.6+.1,0));
  scene.add(lb);
  labels.push(lb); labelPos.push(lb.position);
});

/* ---------- 屏幕空间拾取 ---------- */
// Plotly 的 3D 命中按节点实际像素半径算，小球几乎点不中。
// 这里改成屏幕空间判定：每个节点在屏幕上都有固定的最小热区半径，远近一致。
const rect={w:0,h:0,l:0,t:0}, tmp=new THREE.Vector3(), camSpace=new THREE.Vector3();
function syncRect(){const b=renderer.domElement.getBoundingClientRect();rect.w=b.width;rect.h=b.height;rect.l=b.left;rect.t=b.top}
syncRect();

function project(p){
  camSpace.copy(p).applyMatrix4(camera.matrixWorldInverse);
  if(camSpace.z>-0.2) return null;                       // 在相机背后
  tmp.copy(p).project(camera);
  return {x:(tmp.x*.5+.5)*rect.w+rect.l, y:(-tmp.y*.5+.5)*rect.h+rect.t, d:-camSpace.z};
}

const HOT=19;                                            // 最小热区半径（像素）
function pick(mx,my){
  camera.updateMatrixWorld();
  let best=-1, bestScore=Infinity, bestDepth=Infinity;
  for(let i=0;i<NODES.length;i++){
    const s=project(P[i]); if(!s) continue;
    const lim=Math.max(RAD[i]*(rect.h/2)/(Math.tan(camera.fov*Math.PI/360)*s.d)*1.35, HOT);
    let score=Math.hypot(s.x-mx,s.y-my);
    if(score>lim){                                       // 球体没命中，再看标签
      const l=project(labelPos[i]);
      if(!l) continue;
      const dl=Math.hypot(l.x-mx,l.y-my);
      if(dl>lim*1.05) continue;
      score=dl;
    }
    if(score<bestScore-1.5 || (Math.abs(score-bestScore)<=1.5 && s.d<bestDepth)){
      best=i; bestScore=score; bestDepth=s.d;
    }
  }
  return best;
}

/* ---------- 状态与着色 ---------- */
let selected=-1, hovered=-1, showLabels=true;

function paint(){
  const rel=selected>=0?new Set([NODES[selected],...ADJ[NODES[selected]]]):null;
  meshes.forEach((m,i)=>{
    const on=i===selected, hov=i===hovered;
    // 悬停的节点即使在其他节点被灰掉时也恢复原色，明确"点下去选的是它"
    const dim=selected>=0&&!on&&!hov;
    m.scale.setScalar(on?2:(hov?1.15:(dim?.8:1)));
    m.material.color.copy(dim?GREY:m.userData.c);
    m.material.emissive.copy(dim?BG:m.userData.c);
    m.material.emissiveIntensity=dim?.02:(hov?.26:.08);
  });
  lmat.opacity=selected>=0?.14:.55;
  rlmat.opacity=selected>=0?.06:.2;
  labels.forEach((lb,i)=>{
    lb.position.y=P[i].y+RAD[i]*(i===selected?2.1:1.5)+.08;   // 跟随球体缩放，始终贴在球外
    // 注意：CSS2DRenderer 每帧会覆盖 element.style.display，隐藏必须用 object.visible
    // 分级显示：大节点常显；小球只在悬停/选中、或选中其关联节点时出现，避免标签糊成一片
    const focus=i===selected||i===hovered;
    const big=SZMAP[+SZ[i]]>=24;
    lb.visible=showLabels&&(focus||(big&&(!rel||rel.has(NODES[i]))));
    lb.element.style.fontWeight=i===selected?'700':'400';
    lb.element.style.fontSize=i===selected?'13px':'11px';
    lb.element.style.color=(selected>=0&&!rel.has(NODES[i]))?'#C9CDD3':'#2C3E50';
    lb.element.style.opacity=i===hovered||i===selected?'1':'.82';
  });
}

/* ---------- 相机动画 ---------- */
let anim=null;
let tocOpen=false;                 // 目录面板是否展开（focus 需要据此算焦点偏移）
function flyTo(camTo,tgtTo,dur=700){
  anim={c0:camera.position.clone(),c1:camTo.clone(),t0:controls.target.clone(),t1:tgtTo.clone(),t:0,dur};
}
function focus(i){
  const tgt=P[i];
  const dir=camera.position.clone().sub(controls.target);
  if(dir.lengthSq()<1e-6) dir.copy(HOME);
  dir.normalize();
  // 距离按「选中节点 + 它的邻居」的包围范围自适应，
  // 保证聚焦后周围的节点仍在视野内，可以接着点，不用先缩放。
  let rad=1.4;
  (ADJ[NODES[i]]||[]).forEach(n=>{
    const j=NODES.indexOf(n);
    if(j>=0) rad=Math.max(rad,tgt.distanceTo(P[j])+RAD[j]);
  });
  const fit=rad/Math.tan(camera.fov*Math.PI/360)*1.12;
  const dist=Math.min(Math.max(fit,7),26);
  // 右侧有详情面板，把焦点往左挪半屏宽，选中节点才不会被挡住
  camera.updateMatrixWorld();
  const perPx=2*dist*Math.tan(camera.fov*Math.PI/360)/innerHeight;
  const aim=tgt.clone();
  if(innerWidth>860){
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).normalize();
    // 左侧目录占 320px、右侧详情占 372px，把焦点移到两者之间空白区的中心
    const shift=tocOpen?26:186;
    aim.addScaledVector(right,shift*perPx);        // 大屏：按左右面板宽度差把焦点居中
  }else{
    // 窄屏详情面板在底部（bottom:12、max-height:42vh），焦点上移到面板上方的空白区中心
    aim.y-=(innerHeight*.21+6)*perPx;
  }
  flyTo(aim.clone().add(dir.multiplyScalar(dist)),aim);
}
function home(){
  selected=-1; hovered=-1; paint(); renderHint();
  flyTo(HOME,new THREE.Vector3(0,0,0),600);
}

/* ---------- 详情面板 ---------- */
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 转义后只放行 <sub>/<sup>，其余 HTML 一律当文本
const rich=v=>esc(v).replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>');
const side=document.getElementById('sidebar'), box=document.getElementById('search'), res=document.getElementById('results');
const HINT='<div class="hint">点击图中任意节点<br>查看知识点、公式、考法与例题</div>';
function renderHint(){side.innerHTML=HINT}

// 关系类型 → 颜色。同一套颜色用于标签、关联列表与思维导图的连线
const RTYPE={'前置':['#5DADE2','以它为前提'],'延伸':['#27AE60','向纵深延伸'],'对比':['#E67E22','易混辨析'],
             '同源':['#8E44AD','共用同一模型'],'应用':['#E74C3C','作为工具应用'],'组成':['#7F8C8D','结构组成'],
             '迁移':['#16A085','跨模块迁移']};
const rt=k=>RTYPE[k]||['#95A5A6',k];

/* 关联思维导图：左侧根节点，右侧按关系逐条展开，线色区分关系类型 */
function mindmap(n,rel){
  if(!rel.length) return '';
  const W=314, RH=25, GAP=8, TOP=14;
  const H=Math.max(132, rel.length*(RH+GAP)-GAP+TOP*2), cy=H/2, c=(INFO[n]||['#999'])[0];
  const RW=Math.min(100,Math.max(62,n.length*11+14));      // 根节点宽度随名字长度走
  const BX=RW+54, FS=n.length>6?10.5:11.5;
  let s=`<svg class="mm" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
  s+=`<rect x="2" y="${cy-13}" width="${RW}" height="26" rx="7" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-opacity=".55"/>`;
  s+=`<text x="${2+RW/2}" y="${cy+4}" text-anchor="middle" class="mmr" style="font-size:${FS}px">${esc(n)}</text>`;
  rel.forEach((r,i)=>{
    const info=RELM[n+'|'+r]||['关联',''], col=rt(info[0])[0];
    const by=TOP+i*(RH+GAP)+RH/2;
    s+=`<path d="M ${2+RW} ${cy} C ${2+RW+26} ${cy} ${BX-26} ${by} ${BX-3} ${by}"
         fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="1.4"/>`;
    s+=`<g class="mmn" data-n="${esc(r)}">
      <rect x="${BX}" y="${by-RH/2}" width="${W-BX-2}" height="${RH}" rx="6" fill="#F7F9FC" stroke="#E4E9F0"/>
      <circle cx="${BX+11}" cy="${by}" r="3.2" fill="${col}"/>
      <text x="${BX+20}" y="${by+4}" class="mmb">${esc(r.length>8?r.slice(0,8)+'…':r)}</text>
      <text x="${W-8}" y="${by+4}" text-anchor="end" class="mmt">${esc(info[0])}</text></g>`;
  });
  s+='</svg>';
  const types=[...new Set(rel.map(r=>(RELM[n+'|'+r]||['关联'])[0]))];
  return s+`<div class="mml">${types.map(t=>`<span><i style="background:${rt(t)[0]}"></i>${esc(t)}</span>`).join('')}</div>`;
}

function panel(n){
  const [c,d,f,no,p,t,e]=INFO[n]||['#999','暂无描述',[],[],[],[],[]];
  const rel=relOf(n), ex=EX[n]||[];
  const nav=[[f.length,'sec-f','公式'],[no.length,'sec-no','结论'],[p.length,'sec-p','要点'],
             [t.length,'sec-t','易错'],[(ex.length||e.length),'sec-e','考法'],[rel.length,'sec-rel','关联'],
             [rel.length,'sec-map','导图']]
            .filter(x=>x[0]).map(x=>`<a data-t="${x[1]}">${x[2]}</a>`).join('');

  // 考法：有题库就用折叠卡片（含例题与解法），否则退回标签
  const exHtml = ex.length
    ? `<div class="sec" id="sec-e">常见考法<em>${ex.length} 类 · ${ex.reduce((a,x)=>a+(x.q||[]).length,0)} 例</em></div>`
      + ex.map((x,i)=>{
          const qs=x.q||[];
          return `<div class="exg${i?'':' open'}">
            <div class="exh"><span class="exn">${i+1}</span><span class="ext">${rich(x.t)}</span><i class="exarw"></i></div>
            <div class="exb">
              ${x.f?`<div class="exf"><b>考查形式</b>${rich(x.f)}${(x.v&&x.v.length)?`<ul class="exv">${x.v.map(s=>`<li>${rich(s)}</li>`).join('')}</ul>`:''}</div>`:''}
              ${x.k?`<div class="exk"><b>破题关键</b>${rich(x.k)}</div>`:''}
              ${qs.map(q=>`<div class="exq">
                <div class="exqt"><span class="tag">例</span>${rich(q.q)}</div>
                ${(q.s||[]).length?`<ol class="exqs">${q.s.map(s=>`<li>${rich(s)}</li>`).join('')}</ol>`:''}
                ${q.a?`<div class="exqa"><b>答案</b>${rich(q.a)}</div>`:''}
                <div class="exsol">
                  ${q.c?`<div class="sc"><b>核心解法</b>${rich(q.c)}</div>`:''}
                  ${q.x?`<div class="sx"><b>特殊解法</b>${rich(q.x)}</div>`:''}
                </div></div>`).join('')}
            </div></div>`;
        }).join('')
    : (e.length?`<div class="sec" id="sec-e">常见考法</div>`+e.map(x=>`<span class="ex">${rich(x)}</span>`).join(''):'');

  // 关联概念：只列同级 / 下级，附关系类型与说明
  const relHtml = rel.length
    ? `<div class="sec p" id="sec-rel">关联概念<em>${rel.length} 个</em></div>`
      + rel.map(r=>{
          const info=RELM[n+'|'+r]||['关联',''], tc=rt(info[0])[0];
          const cc=(INFO[r]||['#999'])[0];
          return `<div class="rel" data-n="${esc(r)}" style="border-left-color:${cc}">
            <div class="relh"><b>${esc(r)}</b>
              <span class="relt" style="background:${tc}">${esc(info[0])}</span>
              <span class="lv">${LV[r]>LV[n]?'下级':LV[r]<LV[n]?'上级':'同级'}</span></div>
            ${info[1]?`<div class="reld">${rich(info[1])}</div>`:''}</div>`;
        }).join('')
      + `<div class="sec p" id="sec-map">关联思维导图</div><div class="mmw">${mindmap(n,rel)}</div>`
    : `<div class="sec p" id="sec-rel">关联概念</div><div class="hint">暂无同级关联</div>`;

  side.innerHTML=`<h3 style="border-bottom-color:${c}">${esc(n)}</h3>
    <div class="nav">${nav}</div>
    <div class="sec" id="sec-d">概念概述</div><div class="desc">${rich(d)||'暂无描述'}</div>`
    +(f.length?`<div class="sec" id="sec-f">核心公式</div>`
      +f.map(x=>`<div class="f"><b>${rich(x[0])}</b><i>${rich(x[1]||'')}</i></div>`).join(''):'')
    +(no.length?`<div class="sec" id="sec-no">关键结论</div>`
      +no.map(x=>`<div class="note">${rich(x)}</div>`).join(''):'')
    +(p.length?`<div class="sec" id="sec-p">核心知识点</div>`
      +p.map(x=>`<div class="pt">${rich(x)}</div>`).join(''):'')
    +(t.length?`<div class="sec warn" id="sec-t">易错提醒</div>`
      +t.map(x=>`<div class="tip">${rich(x)}</div>`).join(''):'')
    +exHtml+relHtml;
  box.value=n; res.style.display='none'; side.scrollTop=0;
}

function select(i){
  if(typeof i==='string') i=NODES.indexOf(i);   // 也接受节点名，方便控制台调用
  if(!(i>=0&&i<NODES.length)) return;
  selected=i; hovered=i; paint(); focus(i); panel(NODES[i]);
  box.value=NODES[i]; res.style.display='none'; syncToc(NODES[i]);
}
function clearSel(){
  selected=-1; hovered=-1; paint(); renderHint();
  box.value=''; res.style.display='none';
  tocBody.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  flyTo(HOME,new THREE.Vector3(0,0,0),600);
}

/* ---------- 指针交互 ---------- */
const canvas=renderer.domElement;
canvas.style.cursor='grab';
let mx=0,my=0,raf=0,downX=0,downY=0;

function onMove(){
  raf=0;
  const i=pick(mx,my);
  if(i!==hovered){hovered=i;paint()}
  canvas.style.cursor=i>=0?'pointer':'grab';
}
addEventListener('pointermove',e=>{
  mx=e.clientX; my=e.clientY;
  if(!raf) raf=requestAnimationFrame(onMove);
});

canvas.addEventListener('pointerdown',e=>{
  downX=e.clientX; downY=e.clientY; anim=null;   // 用户操作随时打断相机动画
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointerup',e=>{
  canvas.style.cursor=hovered>=0?'pointer':'grab';
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;  // 是拖拽，不是点击
  const i=pick(e.clientX,e.clientY);
  if(i>=0) select(i); else clearSel();                       // 点空白取消选择
});

addEventListener('keydown',e=>{if(e.key==='Escape')clearSel()});

side.addEventListener('click',e=>{
  const a=e.target.closest('.nav a');
  if(a){                                   // 段落导航
    const el=document.getElementById(a.dataset.t);
    if(el) side.scrollTo({top:el.offsetTop-10,behavior:'smooth'});
    return;
  }
  const h=e.target.closest('.exh');
  if(h){ h.parentElement.classList.toggle('open'); return; }   // 考法卡片折叠
  const t=e.target.closest('.rel,.mmn');
  if(t&&t.dataset.n) select(t.dataset.n);
});

/* ---------- 搜索 ---------- */
box.addEventListener('input',()=>{
  const q=box.value.trim().toLowerCase();
  if(!q){res.style.display='none';return}
  const m=NODES.filter(n=>n.toLowerCase().includes(q));
  res.innerHTML=m.length?m.map(n=>`<div data-n="${n}">${n}</div>`).join('')
                        :'<div style="color:#999;cursor:default">无匹配结果</div>';
  res.style.display='block';
});
res.addEventListener('click',e=>{
  const t=e.target.closest('[data-n]');
  if(t) select(NODES.indexOf(t.dataset.n));
});
document.addEventListener('click',e=>{
  if(!box.contains(e.target)&&!res.contains(e.target)) res.style.display='none';
});

/* ---------- 按钮 ---------- */
document.getElementById('btn-reset').onclick=home;
document.getElementById('btn-clear').onclick=clearSel;
const btnLabel=document.getElementById('btn-label');
btnLabel.onclick=()=>{
  showLabels=!showLabels;
  btnLabel.classList.toggle('off',!showLabels);
  paint();
};


/* ---------- 目录树 ---------- */
const tocEl=document.getElementById('toc'), tocBody=document.getElementById('toc-body');
document.getElementById('toc-n').textContent=NODES.length-1+' 个知识点';

function renderToc(){
  tocBody.innerHTML=TOC.map((m,mi)=>{
    const chs=m.ch.map((c,ci)=>{
      const has=c.i.length;
      const kids=has?`<div class="ch-b">`+c.i.map(n=>
          `<div class="it" data-n="${esc(n)}">${esc(n)}</div>`).join('')+`</div>`:'';
      return `<div class="ch" data-ch="${mi}-${ci}">
        <div class="ch-t" data-n="${esc(c.t)}">${has?'<span class="arw"></span>':''}
          <span class="tx">${esc(c.t)}</span></div>${kids}</div>`;
    }).join('');
    const cnt=m.ch.reduce((a,c)=>a+c.i.length+1,0)+(m.n?1:0);
    return `<div class="mod on" data-mod="${mi}">
      <div class="mod-t" data-n="${m.n?esc(m.n):''}">
        <span class="arw"></span><i style="background:${m.c}"></i>
        <span class="tx">${esc(m.t)}</span><b>${cnt}</b></div>
      <div class="mod-b">${chs}</div></div>`;
  }).join('');
}
renderToc();

tocBody.addEventListener('click',e=>{
  const row=e.target.closest('.mod-t,.ch-t,.it');
  if(!row) return;
  const box=row.parentElement;                       // .mod 或 .ch
  const canFold=box.classList.contains('mod')||box.classList.contains('ch');
  if(e.target.closest('.arw')){                      // 点三角只折叠，不换选中
    if(canFold) box.classList.toggle('on');
    return;
  }
  if(canFold) box.classList.add('on');               // 点标题：展开并选中
  if(row.dataset.n) select(row.dataset.n);
  // 窄屏：只有点到末级知识点（或没有子项的空章）才收起抽屉，
  // 否则展开章节的这一步会把抽屉关掉，永远进不到下一层
  const sub=box.querySelector('.mod-b,.ch-b');
  if(innerWidth<=860&&!sub) toggleToc(false);
});

function syncToc(name){
  tocBody.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  const el=tocBody.querySelector(`[data-n="${name}"]`);
  if(!el) return;
  const ch=el.closest('.ch'), mod=el.closest('.mod');
  if(ch&&el.classList.contains('it')) ch.classList.add('on');
  if(mod) mod.classList.add('on');
  el.classList.add('sel');
  if(!tocOpen) return;
  // 只滚动目录自身，避免 scrollIntoView 连带滚动页面
  const r=el.getBoundingClientRect(), b=tocBody.getBoundingClientRect();
  if(r.top<b.top+4) tocBody.scrollTop-=b.top+4-r.top;
  else if(r.bottom>b.bottom-4) tocBody.scrollTop+=r.bottom-b.bottom+4;
}

function toggleToc(on){
  tocOpen=on===undefined?!tocOpen:on;
  tocEl.classList.toggle('on',tocOpen);
  document.getElementById('btn-toc').classList.toggle('off',!tocOpen);
  document.getElementById('legend').style.display=tocOpen?'none':'';
}
document.getElementById('btn-toc').onclick=()=>toggleToc();

/* ---------- 循环 ---------- */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta();
  if(anim){
    anim.t+=dt*1000;
    const k=Math.min(anim.t/anim.dur,1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.c0,anim.c1,e);
    controls.target.lerpVectors(anim.t0,anim.t1,e);
    if(k>=1) anim=null;
  } else controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
  syncRect();
});

paint();
loop();
document.getElementById('loading').remove();
setTimeout(()=>{syncRect()},80);

// 调试接口：控制台可用 kg.select('电场')、kg.pick(x,y)
window.kg={pick,select,clearSel,NODES,P,project};
</script>

setTimeout(function(){
  var el=document.getElementById('loading');
  if(el) el.textContent='3D 引擎加载失败，请检查网络后刷新';
},9000);
</script>
