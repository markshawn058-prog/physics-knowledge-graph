= U_R/I_g = 2.9/10⁻³ = 2900 Ω","改装后电压表总内阻为 3000 Ω"],"a":"串联 2900 Ω","c":"改装方向记两句话：要测更大电压就串联分压，要测更大电流就并联分流","x":"用倍率速算：量程扩大 n = 3/0.1 = 30 倍，串 R = (n−1)R_g = 29×100 = 2900 Ω，一步出"}],"v":["改装成电压表需串联多大电阻","改装成电流表需并联多大电阻","求改装后的量程","改装后表盘如何重新刻度","改装后的内阻"]},{"t":"复杂电路的化简与等效电阻","f":"含多个电阻的电路求等效电阻、某支路电流或某点电势","k":"先用导线连接的节点标成同一点（等势点），再重画成清晰的串并联结构，最后按规律合并","q":[{"q":"三个阻值均为 6 Ω 的电阻，其中两个并联后再与第三个串联。求总电阻；若三个全部并联，总电阻又是多少？","s":["两个并联：1/R并 = 1/6 + 1/6 = 1/3，R并 = 3 Ω","再与第三个串联：R总 = 3 + 6 = 9 Ω","三个全并联：1/R = 3/6 = 1/2，R = 2 Ω","结论：同样的电阻，接法不同总阻值差别很大"],"a":"9 Ω；全部并联时为 2 Ω","c":"复杂电路的第一步永远是「标节点、找等势点」，结构画清楚了，串并联关系自然显现","x":"用速算：相同电阻并联减半、串联加倍。6∥6 = 3，3+6 = 9；三个并联 6/3 = 2"}],"v":["用等势点法求等效电阻","求某支路的电流","求某点的电势","识别串并联关系","用等势点法化简"]},{"t":"电路故障的判断","f":"由电表示数变化判断是断路还是短路、故障出在哪个元件","k":"串联电路中，电压表跨接在哪个元件上读数接近电源电压，那个元件就断路；读数为零则该元件完好","q":[{"q":"两个灯泡串联，闭合开关后两灯都不亮。用电压表测得 L₁ 两端电压等于电源电压、L₂ 两端电压为零。判断故障。","s":["两灯都不亮说明电路中没有电流，属于断路故障","电压表跨接在 L₁ 两端读数接近电源电压：电压表内阻极大，与断点串联时分走了几乎全部电压","L₂ 两端电压为零，说明 L₂ 本身完好，只是没有电流通过","故故障是 L₁ 断路"],"a":"L₁ 断路","c":"串联电路最快的判据：电压表跨在谁身上读数等于电源电压，谁就断路","x":"记口诀「谁两端有电压谁断路，谁两端没电压谁完好」"}],"v":["判断是断路还是短路","判断故障出在哪个元件","由电压表示数判断","由灯泡亮度判断","用电压表逐段检测"]}],"临界极值法":[{"t":"竖直圆周的临界速度","f":"求小球在竖直圆周最高点的最小速度，或判断能否通过最高点、求对应最低点速度","k":"绳（内轨）模型：最高点最小速度 √(gR)，此时绳张力为零、重力提供向心力；杆（双轨）模型：最高点最小速度为零","q":[{"q":"长 L = 0.5 m 的轻绳一端固定，另一端系小球在竖直平面内做圆周运动。求通过最高点的最小速度及对应的最低点速度（g = 10）。","s":["最高点临界条件：mg = mv²/L","v = √(gL) = √5 ≈ 2.24 m/s","最低点到最高点机械能守恒：½mv₀² = ½mv² + mg·2L","v₀² = gL + 4gL = 25，v₀ = 5 m/s"],"a":"最高点最小速度 √5 ≈ 2.24 m/s，对应最低点速度 5 m/s","c":"先判模型定临界速度：绳模型 √(gL)、杆模型为零；再用机械能守恒把最高点与最低点连起来","x":"整体一步：绳模型有 v₀² = 5gL，代入 5×10×0.5 = 25，直接得 v₀ = 5 m/s"}],"v":["求最高点的最小速度","判断能否通过最高点","求对应的最低点速度","绳与杆的临界差别","恰好通过时 N = 0"]},{"t":"静摩擦临界与极值","f":"求保持相对静止的最大加速度、最大拉力，或恰好不滑动的条件","k":"静摩擦达到最大值 f_max = μN 的那一刻就是临界；超过即相对滑动","q":[{"q":"质量 1 kg 的物块放在质量 2 kg 的长木板上，木板置于光滑水平面，物块与木板间动摩擦因数 0.2（最大静摩擦等于滑动摩擦）。水平力拉木板，求物块与木板保持相对静止的最大拉力（g = 10）。","s":["物块靠静摩擦加速，能获得的最大加速度 a_max = μg = 2 m/s²","此时静摩擦恰好达到最大值 f = μmg = 2 N","整体在此加速度下：F = (M+m)a_max = 3×2 = 6 N","超过 6 N，物块就相对木板向后滑动"],"a":"最大拉力 6 N","c":"临界点永远落在「受力最不利的那个物体」上：先算它单独能达到的最大加速度，再整体求对应的力","x":"一步公式 F_max = (M+m)μg = 3×0.2×10 = 6 N，注意这里的 μ 是物块与木板之间的"}],"v":["求保持相对静止的最大加速度","求恰好不滑动时的最大拉力","求恰好不滑动的条件","临界状态 f = f_max","先假设一起运动再检验"]},{"t":"用数学工具求物理极值","f":"把物理极值问题转化为二次函数、三角函数或不等式的数学极值","k":"先写出目标量的表达式，再判断它是二次函数（配方）、三角函数（合一变形）还是均值不等式","q":[{"q":"以初速 v₀ 斜向上抛出一物体（不计阻力），求最大射程对应的抛射角。","s":["射程 x = v₀²sin2θ/g","sin2θ 的最大值为 1，在 2θ = 90° 时取得","故 θ = 45° 时射程最大，x_max = v₀²/g","若抛出点与落地点不等高，最优角不再是 45°，需重新配方或求导"],"a":"θ = 45°，最大射程为 v₀²/g","c":"极值题三步：写表达式 → 认函数类型 → 用对应工具（配方 / 合一 / 均值）","x":"看到 sin2θ 就想「2θ = 90°」，看到二次式就想配方，这是最快的两条反射"}],"v":["用二次函数配方求极值","用三角函数合一变形","用均值不等式","先写表达式再认函数类型","sin2θ 的最大值"]}],"交变电流":[{"t":"交流电四值的选用","f":"同一个交流电，问某时刻的值、耐压值、电表读数或产生的热量，需要挑不同的值","k":"求某时刻用瞬时值，求耐压用峰值，求功热与电表读数用有效值，求电量用平均值","v":["求某时刻的瞬时电压","电容器耐压取哪个值","电表读数是多少","求一周期内产生的热量"],"q":[{"q":"交流电压 u = 311sin(100πt) V 接在 10 Ω 电阻上。求电压有效值、电流有效值、1 s 内产生的热量，以及 t = 1/600 s 时的瞬时电压。","s":["峰值 Um = 311 V，有效值 U = 311/√2 ≈ 220 V","电流有效值 I = U/R = 22 A","热量 Q = I²Rt = 484×10×1 = 4840 J","t = 1/600 s 时 100πt = π/6，u = 311×0.5 ≈ 156 V"],"a":"U = 220 V，I = 22 A，Q = 4840 J，瞬时值约 156 V","c":"先看题目问的是哪一个：热、功、功率、电表读数用有效值；某时刻的值用瞬时值；耐压用峰值","x":"记一张对照表：瞬时值→某时刻，峰值→耐压击穿，有效值→功热与读数，平均值→通过的电量"}]},{"t":"变压器与远距离输电的综合","f":"发电机经升压变压器、输电线、降压变压器到用户，求各段电流、电压与损耗","k":"两条主线：理想变压器 U₁/U₂=n₁/n₂、P₁=P₂；输电线 I=P/U、P损=I²R","v":["求输电线上的电流","求线路的功率损失","升压后损耗降为多少","降压变压器原线圈电压"],"q":[{"q":"发电机输出功率 100 kW、电压 500 V，经变压器升压到 10 kV 后输送，输电线总电阻 10 Ω。求输电线电流与功率损失。","s":["输电电流 I = P/U = 100000/10000 = 10 A","功率损失 P损 = I²R = 100×10 = 1000 W","电压损失 U损 = IR = 100 V","若直接用 500 V 输电，I = 200 A，P损 = 400 kW，几乎全部损失"],"a":"输电电流 10 A，功率损失 1000 W（占总功率 1%）","c":"输电线上的电流由「输送功率 ÷ 输电电压」决定，与负载电阻无关","x":"用平方关系看：电压升到 20 倍，电流降到 1/20，损耗降到 1/400"}]},{"t":"电感与电容对交流电的影响","f":"判断电感、电容对交流电的阻碍作用随频率如何变化，或分析它们在电路中的作用","k":"感抗 XL = 2πfL 随频率增大而增大，容抗 XC = 1/(2πfC) 随频率增大而减小","v":["频率升高感抗如何变","电容为什么隔直流","高频与低频的旁路作用","电感线圈的作用"],"q":[{"q":"一个线圈和一个电容器分别接入同一交流电路，交流电频率升高时，它们对电流的阻碍作用如何变化？","s":["感抗 XL = 2πfL，频率升高则感抗增大，对电流的阻碍变大","容抗 XC = 1/(2πfC)，频率升高则容抗减小，对电流的阻碍变小","故电感「通直流、阻交流」，电容「通交流、隔直流」","频率极高时电感近似断路，电容近似短路"],"a":"感抗增大、容抗减小","c":"两条口诀：电感通直流阻交流、电容通交流隔直流；再记住频率的影响方向","x":"只看公式趋势：XL ∝ f，XC ∝ 1/f，一个正比一个反比，不必记具体数值"}]}],"交变电流的产生与描述":[{"t":"中性面与瞬时值的变化","f":"线圈转到中性面或与磁场平行时，判断磁通量、电动势、电流的大小","k":"磁通量最大时电动势为零，磁通量为零时电动势最大——两者正好错开四分之一周期","v":["中性面时各量是多少","线圈与磁场平行时电动势","什么时候电流方向改变","磁通量最大电动势为何为零"],"q":[{"q":"矩形线圈在匀强磁场中绕垂直于磁场的轴匀速转动。转到中性面时，磁通量、感应电动势、电流各是多少？转到与磁场平行时又如何？","s":["中性面：线圈平面垂直于磁场，磁通量最大 Φ = BS","此时磁通量的变化率为零（转动瞬间不切割磁感线），e = 0，i = 0","与磁场平行时：磁通量为零，但变化率最大，e = nBSω 最大","电流方向每经过中性面改变一次"],"a":"中性面 Φ 最大、e = 0、i = 0；平行时 Φ = 0、e 与 i 均最大","c":"电动势看的是「磁通量的变化率」，不是磁通量本身，这是最反直觉、也最爱考的一点","x":"用 Φ-t 图想：Φ 是余弦曲线，e 是它的斜率（正弦曲线），峰谷与零点自然错开四分之一周期"}]},{"t":"交变电流的表达式与图像","f":"已知匝数、面积、磁感应强度与角速度，写出电动势的瞬时值表达式或画出图像","k":"峰值 Em = nBSω；从中性面开始计时用正弦，从平行位置开始计时用余弦","v":["写出瞬时值表达式","求电动势的峰值","图像从哪个位置开始计时","由图像读周期与峰值"],"q":[{"q":"线圈面积 0.02 m²、100 匝，在 0.5 T 的匀强磁场中以 100π rad/s 匀速转动，从线圈平面与磁场垂直时开始计时。写出感应电动势的瞬时值表达式。","s":["峰值 Em = nBSω = 100×0.5×0.02×100π ≈ 314 V","从中性面（线圈平面垂直于磁场）开始计时，电动势按正弦规律变化","e = Em sin(ωt) = 314sin(100πt) V","若改从线圈平面与磁场平行时计时，则写成 e = 314cos(100πt) V"],"a":"e = 314sin(100πt) V","c":"计时起点决定用正弦还是余弦：从中性面起用正弦，从平行位置起用余弦","x":"三步走：先算 nBSω 得峰值，再确认起点，最后写函数，顺序不乱就不会错"}]}],"伏安特性曲线":[{"t":"U-I 图线求电阻与工作点","f":"给出元件的 U-I 图线，求某电压下的电阻，或求与电源连接时的工作点","k":"线性元件 R = U/I 为定值；非线性元件的电阻必须指明工作点，同一点切线斜率的倒数是动态电阻","v":["由 U-I 图求电阻","非线性元件的电阻怎么算","电源与元件的交点即工作点","静态电阻与动态电阻的区别"],"q":[{"q":"某电阻的 U-I 图线是过原点的直线，U=6 V 时 I=0.3 A；某非线性元件在 U=6 V 时 I=0.5 A。分别求它们的电阻。","s":["线性电阻 R = U/I = 6/0.3 = 20 Ω，且各电压下都是这个值","图线的斜率 ΔI/ΔU 等于 1/R","非线性元件在该点 R = U/I = 6/0.5 = 12 Ω","但换一个电压，这个比值就变了，所以只能说「该工作点的电阻为 12 Ω」"],"a":"线性电阻 20 Ω；非线性元件在该工作点的电阻为 12 Ω","c":"非线性元件的电阻必须指明工作点，脱离工作点谈电阻没有意义","x":"区分两个概念：U/I 是静态电阻（割线斜率倒数），切线斜率倒数是动态电阻，两者只在直线时相等"}]},{"t":"小灯泡伏安特性曲线的实验","f":"考查电路选择（分压还是限流、电流表内接还是外接）、数据描点与图线分析","k":"电压要从零连续可调就用分压接法；待测电阻小就用电流表外接","v":["为什么用分压接法","电流表内接还是外接","图线为什么向下弯曲","如何描点作图"],"q":[{"q":"描绘小灯泡的伏安特性曲线时，为什么滑动变阻器要用分压接法、电流表要用外接法？","s":["实验要求电压从 0 连续变化，限流接法做不到，故用分压接法","小灯泡电阻较小（几欧到十几欧），与电流表内阻可比，故用外接法","外接法中电压表分流使电流测量值偏大，算得电阻偏小","所得图线是一条过原点的曲线，斜率随电压增大而减小"],"a":"分压保证电压从零连续可调；外接减小电流表内阻的分压影响","c":"「电压要从零开始」选分压，「待测电阻小」选外接，两句话定住电路","x":"口诀：大内偏大、小外偏小——大电阻用内接测量值偏大，小电阻用外接测量值偏小"}]}],"位移速度加速度":[{"t":"概念辨析：位移与路程、速度与速率、加速度与速度","f":"选择题给出运动情境，判断关于位移与路程、平均速度与平均速率、加速度与速度关系的说法是否正确","k":"抓住「矢量有方向」这一条：位移看初末位置，路程看轨迹长度；平均速度 = 位移/时间，平均速率 = 路程/时间，只有单向直线运动两者才相等","q":[{"q":"某人沿半径 R 的圆形跑道跑了半圈，用时 t。求这段时间内的平均速度大小和平均速率。","s":["位移是从起点指向终点的有向线段，半圈时其大小为直径 2R","平均速度大小 = 位移大小/时间 = 2R/t","路程是轨迹长度，半圈为半圆弧 πR","平均速率 = 路程/时间 = πR/t"],"a":"平均速度大小 2R/t，平均速率 πR/t","c":"先判断题目问的是位移还是路程，再除以时间；凡涉及「平均速度」必须能说出方向，否则只能写大小","x":"记住固定比例：圆周运动半圈时 平均速度:平均速率 = 2:π，跑完整圈时平均速度为零而平均速率非零，这类选项年年出现"}],"v":["判断位移大小是否等于路程","平均速度与平均速率的区别","加速度方向与速度方向的关系","速度为零时加速度是否为零","匀速圆周运动是不是匀变速运动"]},{"t":"加速度的理解与计算","f":"由速度变化或图像求加速度的大小与方向；或判断「速度大加速度是否大」「加速度为负是否就是减速」","k":"a = Δv/Δt 是矢量式，方向与 Δv 一致；加速还是减速只看 a 与 v 同向还是反向，与 a 的正负号本身无关","q":[{"q":"小球以 8 m/s 竖直下落撞击地面，反弹速度为 6 m/s，碰撞时间 0.02 s。求碰撞过程中的平均加速度。","s":["规定竖直向上为正方向：v₀ = −8 m/s，v = +6 m/s","Δv = v − v₀ = 6 − (−8) = 14 m/s","a = Δv/Δt = 14/0.02 = 700 m/s²","结果为正，说明加速度方向竖直向上"],"a":"700 m/s²，方向竖直向上","c":"先定正方向，再把速度带符号代入；Δv 一律「末减初」，方向由结果的符号读出，不要凭直觉写大小","x":"碰撞类加速度常在 10²~10³ m/s² 量级，若算出个位数基本可判定漏了符号或单位；用「速度变化量三角形」也能快速判方向"}],"v":["由 Δv 和 Δt 求 a 的大小与方向","由图像斜率求 a","判断 a 与 v 同向还是反向","刹车过程中 a 的符号","速度变化越快 a 越大"]},{"t":"平均速度与中间时刻速度","f":"求某段时间（或位移）内的平均速度，或利用「平均速度等于中间时刻瞬时速度」反求加速度","k":"匀变速运动中 v̄ = (v₀+v)/2 = v(t/2)，平均速度等于中间时刻的瞬时速度","q":[{"q":"物体做匀加速直线运动，前 4 s 内位移 12 m，第 4 s 末速度为 4 m/s。求初速度与加速度。","s":["前 4 s 的平均速度 v̄ = 12/4 = 3 m/s","中间时刻 t = 2 s 的瞬时速度等于平均速度，即 v₂ = 3 m/s","又知 v₄ = 4 m/s，故 a = (4 − 3)/(4 − 2) = 0.5 m/s²","v₀ = v₂ − a×2 = 3 − 1 = 2 m/s"],"a":"v₀ = 2 m/s，a = 0.5 m/s²","c":"「平均速度 = 中间时刻瞬时速度」是匀变速运动的专属性质，能把平均量直接变成瞬时量，省掉一次联立","x":"也可用 (v₀+v₄)/2×4 = 12 与 v₄ = v₀ + 4a 联立，但比中间时刻法多一步"}],"v":["求某段时间内的平均速度","用平均速度求位移","由中间时刻速度反求加速度","比较平均速度与中间位置的速度","纸带上求某段的平均速度"]}],"光":[{"t":"折射定律与视深问题","f":"求折射角、入射角、视深、侧移量，或作光路图","k":"n = sinθ₁/sinθ₂；从正上方看水中的物体，视深 h′ = h/n，看起来变浅","q":[{"q":"水深 1.2 m，水的折射率 4/3。从正上方观察池底，视深是多少？","s":["正上方观察时用视深公式 h′ = h/n","h′ = 1.2 ÷ (4/3)","= 1.2 × 3/4 = 0.9 m","看起来比实际浅 0.3 m"],"a":"0.9 m","c":"视深公式只适用于「正上方观察」的近似；斜视时必须用折射定律作光路图求解","x":"记住「水中物体看起来变浅、变近」，n 越大看起来越浅，可用于快速判断选项"}],"v":["求折射角或入射角","求水池的视深","求光线通过介质层的侧移量","作光路图分析"]},{"t":"色散与不同色光的比较","f":"比较白光经棱镜后的偏折程度，或比较不同色光在同一介质中的速度、临界角","k":"频率越高（紫光）折射率越大、偏折越大、介质中速度越小、临界角越小","q":[{"q":"红光与紫光以相同入射角从空气射入水中，哪种光偏折更大？哪种光的临界角更小？","s":["紫光频率高，水对紫光的折射率更大","由 n = sinθ₁/sinθ₂，n 大则折射角小，偏折更明显","由 sinC = 1/n，n 大则临界角小","故紫光偏折更大、临界角更小、更容易发生全反射"],"a":"紫光偏折更大，临界角更小","c":"一条主线贯穿全部结论：频率高 → n 大 → 偏折大 → 速度小 → 临界角小","x":"只记「紫偏折大、红偏折小」，其余结论都能由 n 的大小关系推出来，不必死背"}],"v":["白光经棱镜后的偏折顺序","比较不同色光在介质中的速度","比较临界角的大小","红光的偏折最小、紫光最大","同一介质对不同色光的 n 不同"]},{"t":"平行玻璃砖中的侧移","f":"求光通过平行玻璃砖后的侧移量，或判断出射光线的方向","k":"出射光线与入射光线平行，只发生侧移；侧移量随入射角增大、砖变厚而增大","q":[{"q":"一束光以 60° 入射到厚度为 d 的平行玻璃砖上表面，折射率为 n。判断出射光线的方向。","s":["上表面折射：n₁sin60° = n·sin r₁","下表面入射角等于 r₁（两表面平行，内错角相等）","下表面折射：n·sin r₁ = n₁·sin r₂","得 sin r₂ = sin60°，r₂ = 60°，故出射光线与入射光线平行"],"a":"出射光线与入射光线平行，只发生侧移","c":"「平行砖不改方向、只改位置」——先下这个判断，可以省掉大量计算","x":"两表面平行则入射角与出射角必然相等，方向一定平行，剩下只需算侧移量"}],"v":["求通过玻璃砖的侧移量","判断出射光线的方向","出射光与入射光平行","砖越厚、入射角越大侧移越大","两表面平行的几何关系"]}],"光子说":[{"t":"光子能量与光子数","f":"求单个光子的能量、光源每秒发出的光子数、光子动量","k":"ε = hν = hc/λ，p = h/λ；光子数 = 总能量 ÷ 单个光子能量","q":[{"q":"功率 1 W、波长 600 nm 的激光，每秒发出多少个光子？","s":["单个光子能量 ε = hc/λ = 6.63×10⁻³⁴×3×10⁸ ÷ 6×10⁻⁷ ≈ 3.3×10⁻¹⁹ J","每秒辐射的总能量为 1 J","光子数 n = 1 ÷ 3.3×10⁻¹⁹","≈ 3×10¹⁸ 个"],"a":"约 3×10¹⁸ 个/秒","c":"光子数 = 总能量 ÷ 单个光子能量，这条关系在激光、光源类题目里反复出现","x":"先用 hc = 1240 eV·nm 算出 ε(eV)，再统一单位，可避免数量级出错"}],"v":["求单个光子的能量","求光源每秒发出的光子数","求光子的动量","用 E = hν、p = h/λ","光强与光子数的关系"]},{"t":"光子说对光电效应的解释","f":"用光子说解释截止频率、瞬时性、最大初动能与光强无关这三条反常","k":"电子一次只吸收一个光子的能量，能量不足就无法逸出；吸收过程是瞬时的，不需要能量积累","q":[{"q":"为什么极微弱的光也能几乎瞬时产生光电子，而波动说无法解释这一点？","s":["波动说认为光的能量连续分布，弱光需要长时间积累才够打出电子","光子说认为光是一份一份的，单个光子能量足够时就能立即打出电子","电子一次吸收一个完整光子，不需要积累过程","故光电效应几乎瞬时发生"],"a":"因为电子一次吸收一个完整光子的能量，无需能量积累","c":"波动说解释不了的三个现象：截止频率、瞬时性、最大初动能与光强无关。三条都指向「能量量子化」","x":"记住「一份一份」四个字，光电效应的全部反常现象都由它解释"}],"v":["解释为什么存在截止频率","解释为什么具有瞬时性","解释最大初动能与光强无关","解释饱和电流与光强成正比","一份一份吸收的含义"]},{"t":"光子说与经典波动说的冲突","f":"说明经典电磁理论为什么解释不了光电效应，或判断某现象支持哪种学说","k":"经典理论预言只要光足够强、照射足够久就能打出电子；实验却存在截止频率与瞬时性","q":[{"q":"用经典波动理论解释光电效应会遇到哪两个无法克服的困难？","s":["经典理论认为光的能量连续分布、可随时间积累，只要光强足够、照射够久，任何频率都该能打出电子","但实验发现存在截止频率，低于它无论多强多久都不发生 → 困难一","经典理论还预言需要较长积累时间，而实验测得响应延迟不超过 10⁻⁹ s → 困难二","光子说用「一份一份地被吸收」同时解决了这两点"],"a":"无法解释截止频率的存在，也无法解释效应的瞬时性","c":"两个困难对应光子的两个性质：能量与频率挂钩（截止频率）、一份一份吸收（瞬时性）","x":"答「经典理论为何失败」就写这两条，答「光子说如何解决」就一一对应回去"}],"v":["经典理论遇到的两个困难","为什么解释不了截止频率","为什么解释不了瞬时性","光子说如何同时解决","能量积累需要时间的矛盾"]}],"光学":[{"t":"光的波动性与粒子性证据","f":"判断某现象说明光的什么性质，或辨析干涉、衍射、偏振、光电效应的归属","k":"干涉与衍射说明波动性，偏振说明光是横波，光电效应说明粒子性","q":[{"q":"分别说明下列现象体现光的什么性质：双缝干涉、泊松亮斑、通过偏振片后光强变化、光电效应。","s":["双缝干涉是两束光的叠加，体现波动性","泊松亮斑是光的衍射现象，同样体现波动性","偏振片能改变透射光强，说明光的振动方向有选择性，即光是横波","光电效应中光把电子打出金属，体现粒子性"],"a":"干涉与衍射体现波动性，偏振体现横波性，光电效应体现粒子性","c":"四条对应关系要背成条件反射，这是光学选择题最常考的一组","x":"一句话分辨：看到「条纹」就是波动，能「只放行一个方向」就是横波，能「打出电子」就是粒子"}],"v":["判断某现象说明光的什么性质","干涉、衍射、偏振说明波动性","光电效应说明粒子性","辨析各现象的归属","光的本性是波粒二象性"]},{"t":"介质中的光速、波长与频率","f":"求光在介质中的速度、波长、频率，或比较不同色光在同一介质中的表现","k":"光进入介质时频率不变，速度与波长都变为原来的 1/n：v = c/n，λ = λ₀/n","q":[{"q":"某介质折射率为 2，真空中波长 600 nm 的光射入该介质。求介质中的速度、频率与波长。","s":["v = c/n = 3×10⁸/2 = 1.5×10⁸ m/s","频率由光源决定，进入介质不变：f = c/λ₀ = 5×10¹⁴ Hz","λ = v/f = 1.5×10⁸/5×10¹⁴ = 3×10⁻⁷ m","即 λ = λ₀/n = 300 nm"],"a":"v = 1.5×10⁸ m/s，f = 5×10¹⁴ Hz，λ = 300 nm","c":"「频率不变」是折射类问题的第一句话：颜色、光子能量都由频率决定，与介质无关","x":"波长直接除以 n，不必先算速度再除频率，一步到位且不易错"}],"v":["求光在介质中的速度","求光在介质中的波长","频率为什么保持不变","比较不同色光在同一介质中","v = c/n 的应用"]},{"t":"光路的可逆性与光路图","f":"利用光路可逆性简化问题，或判断光线反向传播时的路径","k":"反射与折射都满足光路可逆：把光线方向反过来，路径完全重合，入射角与折射角互换","q":[{"q":"光从空气以 45° 射入某介质，折射角为 30°。若光从该介质以 30° 射向界面，折射角是多少？","s":["由光路可逆，正反向路径完全重合","正方向：空气 45° → 介质 30°","反方向即：介质 30° → 空气 45°","故折射角为 45°"],"a":"45°","c":"光路可逆不是近似，而是几何光学的严格性质；凡「反向入射」的题都可以直接对调角度","x":"看到「从介质射向空气」，直接把原题的入射角与折射角对调，不必重算折射率"}],"v":["利用可逆性对调入射角与折射角","判断光线反向传播的路径","作规范的光路图","反射与折射都满足可逆","法线与界面的画法"]}],"光导纤维":[{"t":"光纤的导光原理与临界角","f":"解释光纤为什么能导光、为什么纤芯折射率必须大于包层，或求临界角","k":"光从光密（纤芯）射向光疏（包层），入射角大于临界角时全反射，光被束缚在纤芯内","q":[{"q":"光纤纤芯折射率 1.5、包层 1.4。求光在界面上发生全反射的临界角。","s":["光从纤芯射向包层，属光密到光疏","sinC = n₂/n₁ = 1.4/1.5","≈ 0.933","C = arcsin0.933 ≈ 68.9°"],"a":"约 68.9°","c":"光从介质 1 射向介质 2 时 sinC = n₂/n₁（要求 n₁ > n₂），不要写成 1/n₁","x":"只要 n₁ > n₂ 就可能全反射；两者越接近，临界角越大、对入射角要求越苛刻"}],"v":["解释光纤为什么能导光","为什么纤芯折射率必须大于包层","求芯壁的临界角","全反射条件在光纤中的体现","光在芯壁的入射角"]},{"t":"光纤通信的优势","f":"判断光纤通信相比电缆的优势，或解释传输容量大、损耗低的原因","k":"光频率极高，可承载的带宽远大于电信号；全反射损耗小，中继距离长","q":[{"q":"为什么光纤通信的传输容量远大于传统电缆？","s":["通信容量与载波频率成正比","光的频率达 10¹⁴ Hz 量级，远高于电信号","故可承载的信息量极大","再加上全反射损耗小，可长距离传输而无需频繁中继"],"a":"光的频率极高，可承载带宽远大于电信号","c":"「频率越高、容量越大」是通信的通用规律，光纤与 5G 毫米波都遵循这一条","x":"用数量级记：光频 10¹⁴ Hz，无线电 10⁶~10⁹ Hz，相差五个数量级以上"}],"v":["比较光纤与电缆的优势","传输容量为什么大","损耗为什么低","抗电磁干扰的原因","为什么用激光作光源"]},{"t":"光纤端面的入射角范围","f":"求光能从光纤端面射入并能在芯壁发生全反射的最大入射角","k":"芯壁全反射要求芯壁入射角大于临界角，由互余关系换算成端面入射角的上限","q":[{"q":"光纤芯折射率 1.5，外套折射率 1.4。求光从空气射入端面后仍能在芯壁全反射的最大入射角的正弦值。","s":["芯壁全反射条件：sinθ ≥ n₂/n₁ = 1.4/1.5 ≈ 0.933","芯壁入射角 θ 与端面折射角 r 互余：θ = 90° − r","故 sinθ = cos r ≥ 0.933，得 sin r ≤ √(1 − 0.933²) ≈ 0.36","端面处 sin i = n₁·sin r ≤ 1.5 × 0.36 = 0.54"],"a":"最大入射角的正弦值约为 0.54","c":"「芯壁全反射」与「端面折射」由互余角串起来，这是光纤题唯一的几何桥梁","x":"顺链路走：端面 sin i = n₁sin r → 芯壁角 θ = 90° − r → sinθ = cos r ≥ n₂/n₁"}],"v":["求最大入射角的正弦值","端面折射与芯壁全反射的衔接","互余角作为桥梁","数值孔径的含义","入射角过大时漏光"]}],"光电效应":[{"t":"光电效应的四条实验规律","f":"判断关于截止频率、最大初动能、光电流、瞬时性的说法是否正确","k":"四条规律：存在截止频率；最大初动能随频率增大而与光强无关；光电流随光强增大；几乎瞬时发生","q":[{"q":"保持入射光频率不变而增大光强，光电流与光电子的最大初动能各如何变化？","s":["光强增大意味着单位时间内入射光子数增多","被打出的光电子数增多，光电流增大","每个光子的能量 hν 不变，单个光电子获得的最大初动能不变","故只有光电流增大，最大初动能不变"],"a":"光电流增大，最大初动能不变","c":"分清「光子数量」与「单个光子能量」：光强管数量、频率管能量，这是本节的核心分野","x":"一句话：光强调亮度（电流），频率调能量（初动能），两者互不干涉"}],"v":["判断关于截止频率的说法","判断最大初动能与光强无关","判断光电流与光强的关系","判断效应的瞬时性","四条规律的实验依据"]},{"t":"遏止电压与最大初动能","f":"由遏止电压求最大初动能，或求逸出功、截止频率","k":"eU_c = Ek_max = hν − W₀；遏止电压与频率成线性关系，斜率是 h/e","q":[{"q":"某金属的逸出功为 2.0 eV，用能量 3.0 eV 的光子照射。求光电子的最大初动能与遏止电压。","s":["Ek = hν − W₀ = 3.0 − 2.0 = 1.0 eV","遏止电压满足 eU_c = Ek","U_c = 1.0 V","截止频率由 ν₀ = W₀/h 求得，低于它无论光多强都不发生光电效应"],"a":"最大初动能 1.0 eV，遏止电压 1.0 V","c":"用 eV 作能量单位时，Ek 的数值与遏止电压的数值（伏特）相等，这是最省事的算法","x":"记 eU_c = Ek：数值上 U_c(V) = Ek(eV)，不必换算成焦耳再除 e"}],"v":["由遏止电压求最大初动能","求金属的逸出功","由逸出功求截止频率","用 eUc = Ek 计算","遏止电压与光强无关"]},{"t":"光电效应的 I-U 图像","f":"由 I-U 图读出饱和电流与遏止电压，判断光强或频率改变时图线如何变化","k":"横轴截距的绝对值是遏止电压 Uc，纵轴平台是饱和电流；光强只改饱和电流，频率只改遏止电压","q":[{"q":"同一光电管，保持入射光频率不变而增大光强，I-U 图线如何变化？","s":["频率不变，最大初动能不变，遏止电压 Uc 不变，横轴截距不动","光强增大，单位时间入射光子数增多，光电子数增多","饱和电流由光电子数决定，故纵轴平台升高","图线整体「向上抬」，但左端截距位置不变"],"a":"遏止电压不变，饱和电流增大，图线整体上移","c":"「光强管高度、频率管左右」——I-U 图的所有选项都能用这一句判断","x":"看图先标两个特征量：横轴截距（Uc）、纵轴平台（Im），再问变的是光强还是频率"}],"v":["读出饱和电流","读出遏止电压","光强改变时图线如何变","频率改变时图线如何变","光强管高度、频率管左右"]}],"光的偏振":[{"t":"偏振片与透射光强","f":"判断通过一个或两个偏振片后的光强，或求偏振化方向的夹角","k":"自然光通过第一个偏振片后变为线偏振光、光强减半；再通过第二个偏振片时按 cos²θ 变化","q":[{"q":"自然光依次通过两个偏振片，两偏振化方向夹角 60°。求透射光强与入射光强之比。","s":["通过第一个偏振片后，光强变为 I₀/2","通过第二个偏振片后 I = (I₀/2)cos²60°","cos60° = 0.5，cos²60° = 0.25","I = I₀/8"],"a":"I₀/8","c":"自然光先减半、再用 cos²θ，两步不能合并，漏掉减半是最常见的错","x":"记「自然光过第一片必减半」，这一步是整道题的起点"}],"v":["判断通过一个偏振片后的光强","两片正交时为何全暗","求偏振化方向的夹角","用 I = I₀cos²θ 计算","自然光通过第一片后减半"]},{"t":"偏振与横波的判定","f":"判断某现象能否说明光是横波，或解释立体电影、液晶显示的原理","k":"只有横波才有偏振现象，偏振是区分横波与纵波的唯一判据","q":[{"q":"如何用实验证明光是横波？","s":["让光通过偏振片，转动偏振片并观察透射光强","光强随转动角度明显变化","说明光的振动方向具有选择性，只在某一方向上通过","只有横波才具有这种性质，故光是横波"],"a":"转动偏振片时光强随角度变化，即可证明光是横波","c":"「有偏振现象 → 是横波」是充要关系；声波是纵波，无论怎么转都不会出现偏振","x":"一句话：能「只放行一个振动方向」的波，就是横波"}],"v":["判断某现象能否说明光是横波","解释立体电影的原理","液晶显示的原理","纵波能否发生偏振","偏振是横波特有的现象"]},{"t":"偏振光的应用","f":"解释立体电影、液晶显示、摄影减反等应用中的偏振原理","k":"偏振片只让某一方向的光振动通过；两片正交则全暗，夹角为 θ 时透射光强 I = I₀cos²θ","q":[{"q":"立体电影为什么让观众戴两片偏振方向互相垂直的眼镜？","s":["拍摄时用两个镜头分别记录左右眼画面，并让两束投影光的偏振方向互相垂直","左眼镜片只透过一种偏振方向的光，右眼镜片只透过另一种","于是左右眼分别看到对应画面，大脑合成后产生立体感","若摘下眼镜，两种画面同时进入双眼，看到的就是重影"],"a":"用互相垂直的偏振方向把左右眼画面筛开","c":"偏振的核心作用就一句：把「同时到达」的两束光按振动方向筛开","x":"凡是应用类问题都往「筛方向」上想：立体电影筛画面、液晶筛像素、摄影筛反射光"}],"v":["立体电影为什么戴偏振眼镜","液晶显示如何控制明暗","摄影如何用偏振镜减反","都归结为「筛方向」","偏振片在生活中的应用"]}],"光的干涉":[{"t":"条纹间距的定量计算","f":"由实验数据求波长、双缝间距，或判断条纹间距如何变化","k":"Δx = Lλ/d；波长变大、屏距变大、缝距变小，条纹都会变宽","q":[{"q":"双缝间距 0.2 mm，双缝到屏的距离 1 m，测得相邻亮纹间距 3 mm。求所用光的波长。","s":["由 Δx = Lλ/d 得 λ = Δx·d/L","= 3×10⁻³ × 0.2×10⁻³ ÷ 1","= 6×10⁻⁷ m","即 600 nm，属红光范围"],"a":"600 nm","c":"三个量的单位必须统一成米再计算，mm 与 nm 混用是本节最常见的失分点","x":"判断变化方向不必代数值：λ↑ 或 L↑ 或 d↓，Δx 都变大"}],"v":["由实验数据求波长","由条纹间距反求双缝间距","判断条纹间距如何变化","用 Δx = Lλ/d 计算","换用不同色光后如何变"]},{"t":"干涉条纹与衍射条纹的辨析","f":"判断某图样是干涉还是衍射，或比较两种条纹的特征","k":"干涉条纹等间距、明暗相间；单缝衍射条纹中央最宽最亮，两侧迅速变窄变暗","q":[{"q":"某图样中央条纹最亮最宽，两侧条纹宽度迅速减小。这是干涉图样还是衍射图样？","s":["干涉条纹的特征是等间距、明暗宽度基本一致","衍射条纹的特征是中央最宽最亮，两侧迅速变窄变暗","该图样符合衍射特征","故为单缝衍射图样"],"a":"衍射图样","c":"判据只有一条：等间距是干涉，中央宽两侧窄是衍射","x":"记六个字「干涉等宽、衍射中宽」，一眼分辨，不必计算"}],"v":["判断某图样是干涉还是衍射","比较两种条纹的特征","条纹是否等间距等宽","中央条纹的宽度与亮度","单缝与双缝的图样差别"]},{"t":"相干条件与相干光源的获得","f":"判断能否产生稳定干涉，或说明为什么必须用同一光源分光","k":"相干条件：频率相同、相位差恒定、振动方向相同；普通独立光源不满足，故用分光法获得相干光","q":[{"q":"两只完全相同的灯泡照在同一处，为什么看不到干涉条纹？","s":["干涉要求两束光频率相同且相位差恒定","两只灯泡的发光是大量原子独立的自发辐射，相位随机且不断变化","相位差在观察时间内快速随机变化，干涉图样被平均掉","故只看到均匀照亮；双缝干涉用同一束光分光，才满足相位差恒定的要求"],"a":"因为两个独立光源的相位差随机变化，不满足相干条件","c":"「同频率 + 恒相位差」是干涉的两个必要条件，缺一不可；普通光源靠分光解决第二条","x":"问「为什么不干涉」答相位差不恒定；问「怎样才能干涉」答用同一光源分光"}],"v":["判断能否产生稳定干涉","为什么必须用同一光源分光","两只灯泡为什么不干涉","用分光法获得相干光","频率相同与相位差恒定"]}],"光的衍射":[{"t":"明显衍射的条件","f":"判断能否观察到明显衍射，或解释为什么日常看不到光的衍射","k":"障碍物或孔的尺寸与波长相差不多或更小时，衍射才明显；可见光波长约 10⁻⁷ m，远小于日常物体","q":[{"q":"为什么声波容易绕过障碍物，而光波不容易？","s":["发生明显衍射的条件是障碍物尺寸与波长相差不多或更小","声波波长可达米级，与日常障碍物尺寸接近，容易衍射","光波波长仅 10⁻⁷ m 量级，远小于日常物体","故声波容易绕过障碍物，光波几乎沿直线传播"],"a":"因为声波波长与障碍物尺寸相近，而光波波长远小于障碍物","c":"一切衍射问题都归结为「波长与障碍物尺寸的比较」，这是唯一判据","x":"记「波长越长越容易衍射」：无线电波能绕过山丘、激光不能，都是这个道理"}],"v":["判断能否观察到明显衍射","为什么日常生活中看不到","缝宽与波长的比较","条件是「相差不多」不是「必须更小」","缝越窄衍射越明显"]},{"t":"衍射条纹的特征","f":"判断条纹特征、区分干涉与衍射图样，或判断缝宽变化的影响","k":"单缝衍射条纹中央最宽最亮，两侧宽度与亮度迅速减小；缝越窄，中央条纹越宽、亮度越暗","q":[{"q":"单缝衍射实验中把缝宽减小，中央亮纹如何变化？","s":["缝越窄，衍射现象越明显","中央亮纹变得更宽","通过的光减少，亮度减弱","两侧条纹的间距也相应变大"],"a":"中央亮纹变宽、亮度减弱","c":"「缝窄则条纹宽、亮度暗」是单缝衍射的核心规律","x":"与双缝对照：d 减小则 Δx 增大，方向一致，都符合「限制越强、扩展越大」"}],"v":["判断条纹的宽度与亮度特征","区分干涉与衍射图样","缝宽变化的影响","中央亮纹最宽最亮","条纹不等间距"]},{"t":"衍射光栅与光谱分析","f":"用光栅方程求亮纹位置，或比较不同波长在同一光栅下的分离程度","k":"光栅方程 d·sinθ = kλ（d 为光栅常数）；波长越长，同级亮纹的衍射角越大","q":[{"q":"光栅常数 d = 2×10⁻⁶ m 的光栅，用 λ = 500 nm 的光垂直照射。求第一级亮纹衍射角的正弦值。","s":["光栅方程 d·sinθ = kλ，取 k = 1","sinθ = λ/d = 500×10⁻⁹ / (2×10⁻⁶)","= 5×10⁻⁷ / 2×10⁻⁶ = 0.25","θ = arcsin0.25 ≈ 14.5°"],"a":"sinθ = 0.25，θ ≈ 14.5°","c":"光栅方程比双缝公式更好用：直接用 d·sinθ = kλ，不必再借 L 与 x","x":"先统一成米再代公式；k = 1 求第一级，注意 sinθ ≤ 1 限制了能出现的最大级次"}],"v":["用光栅方程求亮纹位置","比较不同波长的分离程度","求能出现的最大级次","d·sinθ = kλ 的应用","光栅比双缝更亮更细"]}],"全反射":[{"t":"临界角的计算与全反射判断","f":"求临界角、判断能否全反射，或求水面光斑的半径","k":"sinC = 1/n；必须同时满足两个条件：光从光密介质射向光疏介质、入射角大于临界角","q":[{"q":"折射率 √2 的介质与空气的界面，临界角多大？若点光源位于水面下 1 m 处（n = 4/3），水面上透光圆斑的半径约多少？","s":["sinC = 1/√2，得 C = 45°","水面情形：sinC = 3/4，C ≈ 48.6°","光斑半径 r = h·tanC = 1×tan48.6°","r ≈ 1.13 m"],"a":"45°；光斑半径约 1.13 m","c":"两个条件必须同时满足：光密射向光疏 + 入射角大于临界角。少一条就不能全反射","x":"光斑半径直接用 r = h/√(n²−1)：1/√(16/9−1) = 1/√(7/9) ≈ 1.13 m，一步出"}],"v":["求临界角 C","判断能否发生全反射","求水面光斑的半径","用 sinC = 1/n 计算","由光密到光疏才可能全反射"]},{"t":"棱镜中的全反射光路","f":"判断光在棱镜、玻璃砖、光纤中的全反射路径，或求射出方向","k":"全反射时没有折射光，光线全部返回原介质，反射角等于入射角","q":[{"q":"等腰直角玻璃棱镜（n = 1.5）斜边朝上，光垂直射入一条直角边。判断光在斜边处是否发生全反射。","s":["光垂直入射直角边，方向不变进入棱镜","射到斜边时，入射角为 45°","临界角 sinC = 1/1.5 ≈ 0.667，C ≈ 41.8°","45° > 41.8°，发生全反射，光线沿另一条直角边方向射出"],"a":"发生全反射，光沿另一条直角边方向射出","c":"判断顺序固定：先算临界角、再比入射角、最后画光路。棱镜题里 45° 是最常见的入射角","x":"记「n ≥ √2 ≈ 1.41 时 45° 入射必然全反射」，玻璃（1.5）恒满足，可秒判"}],"v":["判断光在棱镜中的路径","求光线射出棱镜的方向","全反射棱镜的应用","玻璃砖中的光路","多次反射的作图"]},{"t":"点光源照亮水面的圆形光斑","f":"求水下点光源在水面形成的亮圆半径，或判断岸上能看到的水面范围","k":"临界角满足 sinC = 1/n，亮圆半径 r = h·tanC；圆外光线全部全反射回水中","q":[{"q":"深 h = 2 m 的水池底部有一点光源，水的折射率 n = 4/3。求水面亮圆的半径。","s":["临界角满足 sinC = 1/n = 3/4","由 sinC = 0.75 得 cosC = √(1 − 0.5625) ≈ 0.661，tanC ≈ 1.134","r = h·tanC = 2 × 1.134 ≈ 2.27 m","圆内光线可折射出水形成亮区，圆外全部全反射"],"a":"约 2.3 m","c":"光斑题只有两步：由 n 求临界角 C，再由 r = h·tanC 求半径。水 n = 4/3 时 tanC ≈ 1.13，可记","x":"sinC = 3/4 是常见值，直接记 tanC ≈ 1.13；若 n = √2 则 C = 45°、tanC = 1，更快"}],"v":["求亮圆的半径","判断岸上能看到的水面范围","用 r = h·tanC 计算","圆外光线全部全反射","光源变深后光斑如何变"]}],"共点力的平衡":[{"t":"缓慢过程中的动态平衡","f":"一个力大小方向不变，另一个力方向缓慢变化，判断各力的大小如何变化","k":"把方向变化翻译成角度变化，写出三角函数式，再判断增减性","v":["挡板缓慢转动时压力如何变化","绳端缓慢移动判断张力变化","动态平衡中的最小力位置","用矢量三角形判断增减"],"q":[{"q":"光滑球夹在竖直墙与可绕底端转动的挡板之间，挡板由竖直缓慢转到水平，球对挡板的压力如何变化？","s":["球受重力 G、墙的支持力 N₁（水平）、挡板的支持力 N₂（垂直挡板向上）","设挡板与墙的夹角为 θ，则 N₂ 与水平方向夹角也是 θ","竖直方向平衡：N₂ sinθ = G，得 N₂ = G/sinθ","挡板由竖直转到水平，θ 由 90° 减小到 0，sinθ 减小，故 N₂ 不断增大","水平方向：N₁ = N₂ cosθ = G cotθ，也随 θ 减小而增大"],"a":"球对挡板的压力一直增大，球对墙的压力也一直增大","c":"「缓慢」意味着每一时刻都能用平衡方程；关键是找出角度 θ，把三个力写成 θ 的函数","x":"极限法：挡板接近水平时，竖直分量要靠极大的支持力才够，故压力必然趋于无穷，只能是一直增大"}]},{"t":"平衡中的最小力","f":"已知一个力的大小方向、另一个力的方向，求第三个力的最小值及其方向","k":"三力首尾相接成闭合三角形，点到直线的垂线段最短，最小力垂直于已知方向","v":["求使物体平衡的最小力","求最小力对应的方向","绳上张力最小时的夹角","用垂线段最短求极值"],"q":[{"q":"重 100 N 的物体在水平面上，受与水平方向成 α 的拉力 F 作用匀速运动，动摩擦因数 0.5。求使 F 最小的 α 及最小值。","s":["受力：重力 G、支持力 N、摩擦力 f = μN、拉力 F","竖直：N = G − F sinα；水平：F cosα = μN = μ(G − F sinα)","整理得 F(cosα + μ sinα) = μG，即 F = μG/(cosα + μ sinα)","cosα + μ sinα 的最大值为 √(1+μ²) = 1.118，取等时 tanα = μ = 0.5，α ≈ 26.6°","F 的最小值 = 0.5×100/1.118 ≈ 44.7 N"],"a":"α ≈ 26.6°（满足 tanα = μ），最小拉力约 44.7 N","c":"把 F 写成 α 的函数后，用 a cosα + b sinα ≤ √(a²+b²) 求极值，取等条件是 tanα = b/a","x":"用摩擦角：把 N 与 f 合成一个与法线成 φ（tanφ = μ）的全反力，三力平衡时 F 垂直于全反力最小，立刻得 α = φ、F = G sinφ ≈ 44.7 N"}]}],"分子力":[{"t":"分子力随距离的变化规律","f":"判断 r < r₀、r = r₀、r > r₀ 三种情况下分子力的表现，或比较引力与斥力的大小","k":"r = r₀ 时引力与斥力大小相等、合力为零；r 减小则斥力增长更快，表现为斥力；r 增大则表现为引力","q":[{"q":"两分子间距由 r₀ 减小到 r₀/2 的过程中，引力和斥力各如何变化？合力表现为什么性质的力？","s":["引力和斥力都随距离减小而增大","斥力随距离变化更剧烈，增长得更快","故合力表现为斥力","距离越近，斥力越显著，这就是物体难以被无限压缩的原因"],"a":"引力和斥力都增大，但斥力增长更快，合力表现为斥力","c":"分子力的三句要点：同时存在、同时变化、变化快慢不同。缺一条都容易判断错","x":"用图线记：引力与斥力两条曲线都随 r 减小而上升，但斥力曲线更陡，交点横坐标就是 r₀"}],"v":["r < r₀ 时斥力占优","r = r₀ 时合力为零","r > r₀ 时引力占优","比较引力与斥力的大小","r 很大时分子力趋于零"]},{"t":"分子势能与做功","f":"判断分子势能的变化趋势，或分析需要克服什么力做功","k":"分子力做正功则分子势能减小，做负功则势能增大——与重力做功的判据完全一致","q":[{"q":"把两个处于 r₀ 位置的分子拉开到相距很远，分子势能如何变化？需要克服什么力做功？","s":["r > r₀ 时分子力表现为引力","拉开过程中位移与引力方向相反，引力做负功","分子力做负功，分子势能增大","拉到无穷远时势能趋于零（取无穷远为零势能点），故 r₀ 处势能为负值"],"a":"分子势能增大，需克服分子引力做功","c":"势能判据与重力完全同构：力做正功势能减小，力做负功势能增大，不必另记一套规则","x":"类比弹簧：拉伸时弹力做负功、弹性势能增大，分子引力的情形与之一致"}],"v":["判断分子势能如何变化","分析需要克服什么力做功","势能最小处的位置","分子力做功与势能变化的关系","r₀ 处势能最小"]},{"t":"r₀ 附近的平衡与微小振动","f":"判断分子在平衡位置附近的运动性质，或解释固体为什么有确定的体积与形状","k":"r = r₀ 时引力与斥力大小相等、合力为零、势能最小；偏离 r₀ 后合力总指向 r₀，构成回复力","q":[{"q":"说明为什么固体分子只能在平衡位置附近振动，而不能任意远离或靠拢。","s":["r = r₀ 处引力与斥力平衡，合力为零，分子势能取最小值","r 略大于 r₀ 时引力占优，合力指向 r₀，把分子拉回","r 略小于 r₀ 时斥力占优，合力仍指向 r₀，把分子推开","合力始终指向平衡位置，构成回复力，故分子在 r₀ 附近往复振动；温度越高振幅越大"],"a":"分子力总是指向平衡位置，充当回复力，故分子只能振动","c":"「r₀ 是合力零点、也是势能最低点」——分子力的所有图像题都从这一点出发","x":"把分子力类比弹簧：r₀ 相当于原长，偏离就有回复力，振动的整套语言可以直接搬过来"}],"v":["判断分子在平衡位置附近的运动","解释固体为什么有确定的体积","回复力的来源","温度与振动幅度的关系","类比弹簧振子"]}],"分子动理论":[{"t":"分子力与分子势能曲线","f":"判断分子力随距离的变化、分子势能最低点位置、分子势能增减","k":"r = r₀ 时引力等于斥力、合力为零、分子势能最小；r < r₀ 斥力为主，r > r₀ 引力为主","q":[{"q":"两个分子从相距很远逐渐靠近到 r₀ 的过程中，分子力与分子势能分别如何变化？","s":["r > r₀ 时引力大于斥力，分子力表现为引力","靠近过程中引力先增大后减小，到 r₀ 时减小为零","引力做正功，分子势能不断减小","到 r₀ 时分子势能达到最小值"],"a":"分子力表现为引力（先增后减），分子势能一直减小到 r₀ 处最小","c":"分子势能的极小值出现在 r₀ 处，而不是零；通常取无穷远处势能为零，故 r₀ 处势能为负","x":"两条曲线对照记：分子力—距离图线在 r₀ 处过零，分子势能—距离图线在 r₀ 处取极小值"}],"v":["判断分子力随距离的变化","分子势能最低点的位置","判断势能是增还是减","r₀ 处的合力与势能特点","曲线各段的斜率含义"]},{"t":"布朗运动与分子热运动","f":"判断布朗运动的成因、影响因素，或辨析布朗运动与分子热运动、扩散现象","k":"布朗运动是悬浮微粒的无规则运动，不是分子本身的运动，而是分子无规则运动的间接反映","q":[{"q":"关于布朗运动，下列说法正确的是：A 它就是分子的热运动　B 温度越高越剧烈　C 颗粒越大越明显　D 它是液体分子无规则运动的反映","s":["布朗运动是固体小颗粒的运动，不是分子本身，A 错","温度越高，分子撞击越剧烈，布朗运动越明显，B 对","颗粒越大，各方向撞击越趋于平衡，运动越不明显，C 错","它是液体分子无规则运动的间接证据，D 对"],"a":"B、D 正确","c":"三句话记牢：不是分子、温度高更明显、颗粒小更明显","x":"用「统计涨落」理解：参与撞击的分子数越少，偏离平均的涨落越大，所以小颗粒才明显"}],"v":["判断布朗运动的成因","判断各因素对剧烈程度的影响","辨析布朗运动与分子运动","布朗运动不是分子运动本身","布朗运动间接证明分子在运动"]},{"t":"温度与分子平均动能","f":"判断关于温度、平均动能、平均速率的说法，或比较不同气体分子的平均动能与速率","k":"温度是分子平均动能的标志，同温下任何气体分子平均动能相同；但平均速率还与分子质量有关，质量大的速率小","q":[{"q":"0 ℃ 的氧气与 0 ℃ 的氢气，比较两者分子的平均动能与平均速率。","s":["温度相同，故两种气体分子的平均动能相同","平均动能 Ek = ½mv²，两种气体 Ek 相同而氧气分子质量更大","质量大则平均速率小","故氧气分子的平均速率小于氢气分子"],"a":"平均动能相同，氧气分子的平均速率较小","c":"「温度定平均动能，质量定平均速率」——这类比较题只需记这两句","x":"先看温度是否相同：相同则平均动能一定相同；再用摩尔质量大小定平均速率的高低"}],"v":["判断关于温度的说法","比较不同气体分子的平均动能","比较平均速率的大小","相同温度下平均动能相同","平均速率与分子质量的关系"]}],"分子动能与势能":[{"t":"温度是分子平均动能的标志","f":"温度或体积变化时，判断分子平均动能、分子势能、内能如何变化","k":"温度只决定分子平均动能；内能还包括分子势能，与体积也有关；理想气体内能只由温度决定","v":["温度升高分子平均动能如何变","内能一定增大吗","同温度下不同气体分子平均动能比较","体积变化对分子势能的影响"],"q":[{"q":"一定质量的理想气体温度不变、体积增大，分子平均动能、分子势能、内能各如何变化？","s":["温度不变，分子平均动能不变","理想气体分子间作用力可忽略，分子势能始终为零，不随体积变化","内能等于分子总动能与分子势能之和，故内能不变","这正是理想气体的重要性质：内能只由温度决定"],"a":"平均动能不变，分子势能为零，内能不变","c":"「温度定平均动能、体积定分子势能、两者之和是内能」——理想气体只认温度","x":"反过来记：真实气体体积增大时分子势能增大（分子远离平衡位置），内能会变；理想气体则不变"}]},{"t":"分子势能与分子间距的关系","f":"分子间距变化时，判断分子力做功、分子势能如何变化，或找势能最小的位置","k":"r = r₀ 时分子力为零、分子势能最小；偏离 r₀ 两侧势能都增大","v":["分子间距增大势能如何变","势能最小的位置在哪","分子力做功与势能变化","为什么 r0 处势能最小"],"q":[{"q":"两个分子从相距很远逐渐靠近到 r = r₀，再继续靠近，分子势能如何变化？","s":["r > r₀ 时分子力表现为引力，靠近过程中引力做正功，势能减小","到 r = r₀ 时引力与斥力平衡，分子力为零，势能降到最小","r < r₀ 时分子力表现为斥力，继续靠近需克服斥力做功，势能增大","故势能先减小后增大，在 r = r₀ 处最小"],"a":"先减小后增大，在 r = r₀ 处最小","c":"势能变化只看分子力做功：引力做正功势能减小，斥力做负功势能增大","x":"类比弹簧：r₀ 相当于弹簧原长，拉伸与压缩都使弹性势能增大，完全同理"}]}],"力学":[{"t":"力学综合题的拆解顺序","f":"给出多物体、多过程的力学情境，要求求加速度、速度、位移或某个力","k":"先定研究对象与过程，再画受力图，然后判断该用牛顿定律、动能定理还是动量定理","v":["多过程运动的分段处理","板块模型的相对滑动","求某段过程的加速度","多个物体如何选取研究对象","复杂情境如何拆成几个简单过程"],"q":[{"q":"质量 2 kg 的物块从高 1.8 m 的光滑斜面顶端由静止下滑，进入水平面后受恒定阻力 4 N，滑行 3 m 停下。求水平面上滑行的初速度（g=10）。","s":["过程一：斜面光滑，机械能守恒，mgh = ½mv²","v = √(2gh) = √(2×10×1.8) = 6 m/s","过程二：水平面上只有阻力做功，由动能定理 −fs = 0 − ½mv²","f = ½×2×36/3 = 12 N，与题给 4 N 不符，说明阻力不足，物块不会在 3 m 内停下"],"a":"物块进入水平面时速度为 6 m/s；按 4 N 阻力算，3 m 内只消耗 12 J，动能还有 24 J，不会停下","c":"多过程题先分段，每段选最省事的规律：斜面用机械能守恒，水平面用动能定理","x":"全程用一个动能定理：mgh − fs = 0，若真能停下则 f = mgh/s = 36/3 = 12 N，一步反查出题目数据矛盾"}]},{"t":"三大观点的选用","f":"同一个力学情境，问用牛顿定律、动能定理还是动量定理求解更简便","k":"涉及时间用动量定理，涉及位移用动能定理，涉及瞬时加速度用牛顿第二定律","v":["求冲量与作用时间","求变力做的功","比较几种解法的繁简","求平均作用力","多过程用能量观点还是动量观点"],"q":[{"q":"质量 0.5 kg 的球以 10 m/s 竖直下落，与地面碰撞 0.05 s 后以 8 m/s 反弹。求地面对球的平均作用力（g=10）。","s":["取竖直向上为正，初速度 −10 m/s，末速度 +8 m/s","动量变化 Δp = m(v2−v1) = 0.5×(8+10) = 9 kg·m/s","由动量定理 (N − mg)t = Δp","N = mg + Δp/t = 5 + 9/0.05 = 185 N"],"a":"地面对球的平均作用力 185 N，方向竖直向上","c":"碰撞类问题一定用动量定理；注意重力不能漏，短时间碰撞里重力项往往也不能忽略","x":"先算平均加速度 a = Δv/t = 18/0.05 = 360 m/s²，再由 N − mg = ma 得 N = 185 N，与动量定理等价"}]}],"力的合成分解":[{"t":"合力范围与三力合成","f":"求两个力的合力范围、三个力能否平衡、合力的最小值，或已知合力反求分力","k":"两力合力范围是 |F₁−F₂| ≤ F ≤ F₁+F₂；三力能否为零，只需看最小的两个力之和是否大于等于第三个力","q":[{"q":"三个共点力大小分别为 3 N、5 N、9 N，求它们合力的最大值和最小值。","s":["同向时合力最大：3 + 5 + 9 = 17 N","判断能否为零：3 + 5 = 8 N < 9 N，无法抵消最大的力","最小合力出现在 3 N 与 5 N 同向、与 9 N 反向时","最小值 = 9 − 3 − 5 = 1 N"],"a":"最大 17 N，最小 1 N","c":"三力合成先做一次「两小之和与最大之比」的判断：够则最小为零，不够则最小就是差值","x":"把三个力想成三角形的三条边：能构成三角形则合力可以为零；3+5<9 构不成三角形，缺口 1 N 就是最小合力"}],"v":["求两个力的合力范围","判断三个力能否平衡","求合力的最小值","已知合力反求分力","合力一定大于分力吗"]},{"t":"正交分解处理斜面问题","f":"斜面上物体在拉力、推力作用下匀速或加速运动，求某力大小、动摩擦因数或加速度","k":"让尽可能多的力落在坐标轴上：沿斜面与垂直斜面建系，重力分解为 mg sinθ 与 mg cosθ，两个方向各列一式","q":[{"q":"质量 10 kg 的物体放在倾角 30° 的斜面上，用沿斜面向上的力 F 拉它匀速上滑，动摩擦因数 √3/3。求 F（g 取 10 m/s²）。","s":["沿斜面方向：F = mg sin30° + f","垂直斜面方向：N = mg cos30° = 10×10×(√3/2) = 50√3 N","f = μN = (√3/3)×50√3 = 50 N","F = 50 + 50 = 100 N"],"a":"100 N","c":"沿斜面建系能把重力的两个分力直接写成 mg sinθ 与 mg cosθ，避免再算一次角度","x":"用摩擦角速算：tanφ = μ = √3/3，得 φ = 30°，F = mg sin(θ+φ)/cosφ = 100×sin60°/cos30° = 100 N，一步到位"}],"v":["求拉力或推力的大小","求动摩擦因数","求物体的加速度","重力沿斜面与垂直斜面的分解","斜面加外力的多力平衡"]},{"t":"力的分解的多解与极值","f":"已知一个力和一个分力的方向，求另一分力的最小值，或判断分解有几组解","k":"分解可能唯一、两解或无解；当另一分力与已知方向垂直时取最小值 F sinθ","q":[{"q":"把 20 N 的力分解为两个分力，其中一个分力与它成 30° 角。求另一个分力的最小值。","s":["画出矢量三角形：已知合力 F = 20 N，一个分力沿 30° 方向","另一个分力最小时，应与已知方向垂直（点到直线的距离最短）","最小值 = F sin30° = 20 × 0.5 = 10 N","此时已知方向的分力为 F cos30° ≈ 17.3 N"],"a":"最小值为 10 N","c":"「垂直取最小」是分解极值题的通用结论，本质是点到直线的距离最短","x":"直接记 F_min = F sinθ，代入 20×0.5 = 10 N，不用画图"}],"v":["求另一个分力的最小值","判断分解有几组解","已知两个分力的方向求大小","按实际效果分解重力","唯一解的条件"]}],"功和功率":[{"t":"功的计算与正负判断","f":"给出多个力作用的位移过程，求各力做的功、合力做的功，或判断功的正负","k":"W = Fx cosα，α 是力与位移的夹角；合力做的功等于各力做功的代数和","v":["求各力做的功","判断某个力做正功还是负功","求合力做的功","求变力做的功"],"q":[{"q":"质量 2 kg 的物体在水平面上受水平拉力 10 N 作用前进 5 m，动摩擦因数 0.2，g=10。求各力做的功与合力做的功。","s":["拉力做功 W_F = Fx = 10×5 = 50 J","摩擦力 f = μmg = 0.2×20 = 4 N，与位移反向，W_f = −4×5 = −20 J","重力与支持力垂直于位移，cos90° = 0，做功均为零","合力 F合 = 10 − 4 = 6 N，W合 = 6×5 = 30 J"],"a":"拉力 50 J、摩擦力 −20 J、重力与支持力均为 0、合力 30 J","c":"功是标量但有正负，正负只由力与位移的夹角决定：锐角为正、钝角为负、垂直为零","x":"用 W合 = ΔEk 反查：30 J 对应速度从 0 增到 √30 ≈ 5.5 m/s，可用来验算结果"}]},{"t":"恒定功率启动的分析","f":"汽车以恒定功率或恒定加速度启动，求最大速度、某时刻的加速度或某段过程的功","k":"P = Fv，最大速度时 F = f，故 vmax = P/f；任一速度下的牵引力 F = P/v","v":["求汽车的最大速度","求某速度时的加速度","恒定功率启动的 v-t 图","求启动过程牵引力做的功"],"q":[{"q":"质量 2000 kg 的汽车额定功率 60 kW，在平直路面上行驶，阻力恒为 2000 N。求最大速度；以恒定功率启动，速度 10 m/s 时加速度多大？","s":["速度最大时加速度为零，牵引力等于阻力：F = f = 2000 N","v_max = P/F = 60000/2000 = 30 m/s","v = 10 m/s 时牵引力 F = P/v = 60000/10 = 6000 N","由牛顿第二定律 a = (F − f)/m = (6000 − 2000)/2000 = 2 m/s²"],"a":"最大速度 30 m/s；10 m/s 时加速度为 2 m/s²","c":"恒定功率启动时牵引力随速度反比减小，加速度逐渐变小，直到 F = f 做匀速运动","x":"抓两个特征量即可：v_max = P/f 与 F = P/v，其余全部交给牛顿第二定律，不必分析过程"}]}],"功能关系":[{"t":"功与能变化的对应关系","f":"给出某力做功或机械能变化，求另一个力做的功、热量或速度","k":"除重力弹力外其他力做的功等于机械能的变化；合外力做的功等于动能的变化","v":["求摩擦力做的功","由机械能变化求某个力做功","求克服阻力做的功","判断能量转化方向"],"q":[{"q":"质量 2 kg 的物块从高 1 m 的斜面顶端由静止滑下，到达底端速度 3 m/s，g=10。求下滑过程中摩擦力做的功。","s":["以底端为零势能面，初态机械能 E₁ = mgh = 20 J，末态 E₂ = ½mv² = 9 J","机械能减少 11 J","除重力外只有摩擦力做功，故 W_f = ΔE = −11 J","即克服摩擦力做功 11 J，这部分能量转化为内能"],"a":"摩擦力做功 −11 J（克服摩擦力做功 11 J）","c":"「除重力弹力外其他力做的功 = 机械能的变化」，这条比逐个力算功快得多","x":"用动能定理等价求解：mgh + W_f = ½mv²，W_f = 9 − 20 = −11 J，两条路完全一致"}]},{"t":"摩擦生热与相对位移","f":"物块在传送带上滑动、或两物体相对滑动，求摩擦产生的热量","k":"Q = f·Δs相对，必须用两物体的相对位移，不能用其中任一个的位移","v":["求物块与传送带间的摩擦生热","求板块模型产生的热量","求系统损失的机械能","判断热量与位移的关系"],"q":[{"q":"质量 1 kg 的物块以 4 m/s 滑上以 2 m/s 同向匀速运动的传送带，动摩擦因数 0.2，g=10，传送带足够长。求物块与传送带间的摩擦生热。","s":["物块相对传送带向前滑，受向后的摩擦力 f = μmg = 2 N，加速度 a = 2 m/s²","物块减速到与带同速所需时间 t = (4 − 2)/2 = 1 s","该过程物块位移 s物 = (4+2)/2×1 = 3 m，传送带位移 s带 = 2×1 = 2 m","相对位移 Δs = 3 − 2 = 1 m，故 Q = f·Δs = 2×1 = 2 J"],"a":"摩擦生热 2 J","c":"摩擦生热一律用相对位移；用其中一个物体的位移算出来的是「摩擦力对该物体做的功」，不是热量","x":"用能量差验算：物块动能减少 ½×1×(16−4) = 6 J，传送带因摩擦获得 2×2 = 4 J，差额 2 J 就是内能，一致"}]}],"动能定理":[{"t":"动能定理处理变力与多过程","f":"变力做功、曲线运动、多阶段运动，求速度、位移、功或阻力","k":"W总 = ΔEk，总功包括所有力做的功；只关心初末状态，不必追究过程细节，这是它比牛顿定律强的地方","q":[{"q":"质量 1 kg 的小球从高 5 m 处由静止自由下落，陷入沙坑 0.2 m 后停止。求沙子对小球的平均阻力（g 取 10 m/s²）。","s":["全程受重力与阻力，机械能不守恒，改用动能定理","重力做功 mg(h+d)，阻力做功 −f·d","mg(h+d) − f·d = 0","f = 10×5.2/0.2 = 260 N"],"a":"260 N","c":"有非保守力做功就不能用机械能守恒，要把所有力的功写全，正负号由力与位移的夹角决定","x":"分两段校验：落地速度 v = √(2gh) = 10 m/s，沙中 ½mv² = (f − mg)d，得 f = 50/0.2 + 10 = 260 N，两条路互为验证"}],"v":["求变力做的功","求曲线运动中的速度","求多阶段的总功","由动能定理求阻力大小","求多过程中某一段的位移"]},{"t":"机车启动与功率","f":"恒定功率启动、恒定牵引力启动，求最大速度、某时刻加速度或做功","k":"恒定功率时 P = Fv，速度增大则牵引力减小；最大速度出现在 F = f 时，v_max = P/f","q":[{"q":"质量 2×10³ kg 的汽车额定功率 60 kW，在水平路面上行驶时阻力恒为 2×10³ N。求汽车能达到的最大速度；若以恒定功率启动，速度为 10 m/s 时加速度多大？","s":["最大速度时牵引力等于阻力：v_max = P/f = 60000/2000 = 30 m/s","速度为 10 m/s 时，牵引力 F = P/v = 60000/10 = 6000 N","合力 = 6000 − 2000 = 4000 N","a = F合/m = 4000/2000 = 2 m/s²"],"a":"最大速度 30 m/s；10 m/s 时加速度 2 m/s²","c":"恒定功率启动是变加速运动，只能用 P = Fv 与 F − f = ma 逐点分析，不能用匀变速公式","x":"用动能定理求启动时间：Pt − f·x = ½mv²，已知位移可反求时间，这是恒定功率启动唯一能算时间的方法"}],"v":["恒定功率启动的最大速度","恒定牵引力启动的匀加速阶段","求某时刻的加速度","求启动过程牵引力做的功","两种启动方式的图像比较"]},{"t":"动能定理与图像结合","f":"由 F-x 图或 P-t 图求功，再交给动能定理求速度","k":"F-x 图线下的面积是功，P-t 图线下的面积也是功；变力做功全靠面积求","q":[{"q":"质量 2 kg 的物体从静止开始受水平力作用，F 随位移变化：0-2 m 内由 0 线性增到 10 N，2-4 m 内保持 10 N。求 4 m 处的速度。","s":["0-2 m 是三角形，W₁ = ½×2×10 = 10 J","2-4 m 是矩形，W₂ = 2×10 = 20 J","总功 W = 10 + 20 = 30 J","由 W = ½mv² 得 v = √(2×30/2) = √30 ≈ 5.5 m/s"],"a":"约 5.5 m/s","c":"变力做功先转成「图线面积」，再交给动能定理——这是图像类动能题的唯一通道","x":"记「F-x 面积即功」：三角形 ½bh、矩形 bh，不必做积分"}],"v":["由 F-x 图线下的面积求功","由 P-t 图求功","求某位置的速度","图像斜率与截距的意义","由图像判断做功正负"]}],"动量与冲量":[{"t":"动量与冲量的矢量计算","f":"物体速度大小或方向发生变化（反弹、转弯），求动量变化量与所受冲量","k":"动量与冲量都是矢量，一维问题用正负号表示方向，反弹时末速度必须带负号","v":["求动量变化量的大小和方向","求墙对小球的冲量","反弹问题如何定正方向","求动量的变化率"],"q":[{"q":"质量 0.1 kg 的小球以 6 m/s 垂直撞墙，以 4 m/s 反向弹回，碰撞时间 0.02 s。求动量变化、墙的冲量与平均作用力。","s":["取初速度方向为正：p₁ = 0.1×6 = 0.6 kg·m/s，p₂ = 0.1×(−4) = −0.4 kg·m/s","Δp = p₂ − p₁ = −1.0 kg·m/s，负号表示方向与初速度相反","由动量定理，墙对小球的冲量 I = Δp = −1.0 N·s","平均作用力 F = |I|/t = 1.0/0.02 = 50 N，方向与初速度相反"],"a":"动量变化 1.0 kg·m/s（方向与初速相反）；冲量 1.0 N·s；平均力 50 N","c":"动量、冲量、力都是矢量，反弹时速度带负号，这是最容易丢分的一步","x":"用速度变化量一次算完：Δv = −4 − 6 = −10 m/s，Δp = mΔv = −1.0 kg·m/s，比分两步算更稳"}]},{"t":"F-t 图像的冲量","f":"给出力随时间变化的图像或分段变化，求冲量、动量变化或末速度","k":"F-t 图线与时间轴围成的面积就是冲量，时间轴下方的面积取负","v":["求变力的冲量","由 F-t 图求末速度","分段力求总冲量","求平均力"],"q":[{"q":"质量 2 kg 的物体原来静止，受水平力 F 作用：0–2 s 内 F 由 0 均匀增到 10 N，2–4 s 内保持 10 N。求 4 s 末的速度。","s":["F-t 图线与时间轴围成的面积等于冲量","0–2 s：三角形面积 ½×2×10 = 10 N·s","2–4 s：矩形面积 10×2 = 20 N·s","总冲量 30 N·s = mv，得 v = 15 m/s"],"a":"4 s 末速度为 15 m/s","c":"变力的冲量用 F-t 面积求，比「先求平均力再乘时间」普适——后者只对线性变化成立","x":"0–2 s 也可用平均力 5 N×2 s = 10 N·s，与面积法一致，说明线性变化时平均力取首末平均"}]}],"动量守恒":[{"t":"动量守恒的条件与方向性","f":"判断系统动量是否守恒，或在某个方向上守恒，并求碰后速度","k":"合外力为零则动量守恒；合外力不为零但某方向合外力为零，则该方向动量守恒——「部分守恒」是高频考点","q":[{"q":"光滑水平面上，质量 2 kg 的 A 以 3 m/s 向右运动，与静止的 1 kg 的 B 碰撞后，A 以 1 m/s 仍向右运动。求 B 的速度。","s":["水平方向不受外力，系统动量守恒","2×3 = 2×1 + 1×v","6 = 2 + v","v = 4 m/s，方向向右"],"a":"4 m/s，方向向右","c":"先判断哪个方向守恒，再沿该方向列式；速度一律带符号，方向由结果正负读出","x":"用「动量变化量等大反向」校验：A 减少 4 kg·m/s，B 必增加 4 kg·m/s，直接得 v = 4 m/s，不必解方程"}],"v":["判断系统动量是否守恒","判断某方向上是否守恒","求碰后的速度","内力远大于外力时近似守恒","爆炸瞬间的动量守恒"]},{"t":"人船模型","f":"人在船上走、气球上爬绳、平板车上移动，求各物体的位移","k":"系统总动量始终为零、质心不动：m₁x₁ = m₂x₂，且两位移之和等于相对位移","q":[{"q":"质量 60 kg 的人站在长 4 m、质量 120 kg 的静止小船上，从船头走到船尾。求船移动的距离（水的阻力不计）。","s":["系统初动量为零且不受水平外力，质心位置不变","设船对地位移为 x，则人对地位移为 4 − x","由 m人(4−x) = m船x 得 60(4−x) = 120x","240 = 180x，x ≈ 1.33 m，方向与人走动方向相反"],"a":"约 1.33 m，方向与人的运动方向相反","c":"人船模型两条式子：位移与质量成反比、两位移之和等于相对位移，缺一不可","x":"直接套 x船 = m人L/(m人+m船) = 60×4/180 ≈ 1.33 m，一个式子出结果"}],"v":["求人走动时船的位移","求气球上爬绳时的高度变化","求平板车的位移","位移与质量成反比","系统的质心位置不变"]},{"t":"爆炸与反冲","f":"爆炸后各块的速度、反冲速度、火箭原理","k":"爆炸瞬间内力远大于外力，动量守恒；时间极短位移可忽略；机械能一般增加","q":[{"q":"质量 3 kg 的爆竹静止在地面，爆炸成质量分别为 1 kg 和 2 kg 的两块。爆炸后 1 kg 的那块以 12 m/s 向东飞出，求另一块的速度。","s":["爆炸前系统总动量为零","爆炸瞬间动量守恒：0 = 1×12 + 2×v","v = −6 m/s","负号表示方向与 1 kg 那块相反，即向西"],"a":"6 m/s，方向向西","c":"爆炸、反冲、绳突然绷直都属于「内力远大于外力」，动量守恒但机械能不守恒（通常增加）","x":"反冲速度与质量成反比：m₁v₁ = m₂v₂，代入 1×12 = 2×v 直接得 6"}],"v":["求爆炸后各块的速度","求爆炸后另一块的反冲速度","解释火箭的工作原理","爆炸过程动能增加","由动量守恒求质量比"]}],"动量守恒定律":[{"t":"动量与能量的选择策略","f":"多过程综合题，要求判断该用动量还是能量，或两者联立求解","k":"有「时间」无「位移」想动量，有「位移」无「时间」想动能；碰撞、爆炸、绳突然绷直用动量；摩擦生热、弹簧形变用能量","q":[{"q":"质量 m 的子弹以速度 v₀ 水平射入静止在光滑水平面上的木块（质量 M）并留在其中。求共同速度与系统损失的动能。","s":["碰撞瞬间动量守恒：mv₀ = (m+M)v，得 v = mv₀/(m+M)","损失动能 Q = ½mv₀² − ½(m+M)v²","代入 v 化简：Q = ½mv₀²·M/(m+M)","Q 也可由 Q = f·Δs相对 求出相对滑动距离"],"a":"v = mv₀/(m+M)，Q = Mmv₀²/[2(m+M)]","c":"完全非弹性碰撞动量守恒但动能损失最大；热量等于初末动能之差，不要试图对单个物体用动能定理","x":"用约化质量记：Q = ½μv₀²，μ = mM/(m+M)，一步写出；还能直接看出 m ≪ M 时 Q ≈ ½mv₀²（动能几乎全变成热）"}],"v":["判断该用动量还是能量","两者联立求解","碰撞类优先用动量","涉及时间用动量定理","只涉及位移与速度用动能定理"]},{"t":"多过程综合题的分段处理","f":"滑块沿斜面下滑、进入粗糙水平面、与其他物块碰撞、再冲上圆轨道的组合情境","k":"按「段」处理：每段挑一个最省事的定律，段与段之间只用速度衔接，不要试图一个方程包打全程","q":[{"q":"质量 1 kg 的滑块从高 0.8 m 的光滑斜面由静止滑下，进入动摩擦因数 0.2 的水平面，滑行 2 m 后与静止的 3 kg 滑块发生完全非弹性碰撞。求碰后的共同速度（g 取 10 m/s²）。","s":["斜面段：mgh = ½mv₁²，v₁ = √(2×10×0.8) = 4 m/s","水平面段：½mv₁² − μmgs = ½mv₂²，8 − 0.2×1×10×2 = 4，v₂ = 2√2 ≈ 2.83 m/s","碰撞段动量守恒：mv₂ = (m+M)v，v = 2.83/4 ≈ 0.71 m/s","碰后动能约 1 J，损失约 3 J 转化为内能"],"a":"约 0.71 m/s","c":"分段选定律、速度作衔接；斜面用机械能守恒、水平面用动能定理、碰撞用动量守恒，各取所长","x":"斜面与水平面可合并成一次动能定理：mgh − μmgs = ½mv₂²，直接得 v₂，省掉一个中间变量"}],"v":["斜面下滑后进入粗糙水平面","碰撞后再冲上圆轨道","求全程摩擦生热","分段列式与交界速度传递","判断能否通过圆轨道最高点"]},{"t":"动量定理与平均作用力","f":"求碰撞、反弹中的平均作用力与冲量，或解释缓冲现象","k":"I = FΔt = Δp 是矢量式；求平均力必须先规定正方向，Δp = m(v₂ − v₁)","q":[{"q":"质量 0.5 kg 的球以 10 m/s 垂直撞墙，以 8 m/s 反弹，撞击时间 0.02 s。求墙对球的平均作用力。","s":["规定初速度方向为正，则 v₁ = 10 m/s，v₂ = −8 m/s","Δp = m(v₂ − v₁) = 0.5×(−8 − 10) = −9 kg·m/s","由 FΔt = Δp 得 F = −9/0.02 = −450 N","负号表示方向与初速度相反，大小为 450 N"],"a":"450 N，方向与初速度方向相反","c":"反弹题最容易漏负号：Δv 是 v₂ − v₁，方向相反时是两者大小相加，不是相减","x":"速算取大小：F = m(v₁+v₂)/Δt = 0.5×18/0.02 = 450 N，一步出结果"}],"v":["求碰撞中的平均作用力","求反弹过程的冲量","解释缓冲与安全气囊","求 Δp 并注意方向","合外力的冲量等于动量变化"]}],"动量定理":[{"t":"碰撞与缓冲中的平均力","f":"跳落、撞击、缓冲等过程，求地面对人的平均作用力，或解释缓冲为什么能减小受力","k":"动量变化由初末速度定死，缓冲只是把同样的 Δp 摊到更长时间上，F = Δp/t + mg","v":["求落地时地面对人的平均力","安全气囊为什么能保护人","求缓冲时间与受力的关系","打击类问题求平均力"],"q":[{"q":"质量 60 kg 的人从 1.8 m 高处跳下，落地后屈膝缓冲 0.5 s 停下，g=10。求地面对人的平均作用力；若缓冲时间只有 0.1 s，结果如何？","s":["落地速度 v = √(2gh) = √36 = 6 m/s","取向上为正，Δp = 0 − (−60×6) = 360 kg·m/s","由 (N − mg)t = Δp 得 N = 600 + 360/0.5 = 1320 N","缓冲 0.1 s 时 N = 600 + 360/0.1 = 4200 N，是前者的三倍多"],"a":"缓冲 0.5 s 时平均力 1320 N；0.1 s 时达 4200 N","c":"Δp 由初末速度定死，缓冲只是把同样的 Δp 摊到更长时间上，时间越短力越大","x":"先算需要的平均合力 Δp/t = 720 N，再加自重 600 N，比直接套公式更不容易漏掉重力"}]},{"t":"连续体与流体模型","f":"水流、气流、沙粒、雨滴连续打在某个面上，求平均作用力","k":"取 Δt 内的质量元 Δm = ρSvΔt，对它用动量定理，再约掉 Δt","v":["水柱对墙的作用力","风力对帆面的压力","雨滴对地面的平均压强","求单位时间的动量变化"],"q":[{"q":"水龙头出水口横截面积 1 cm²，水流速度 10 m/s，水打在竖直墙上后沿墙面流下。求水对墙的平均作用力（ρ=1.0×10³ kg/m³）。","s":["取 Δt 内流出的水，质量 Δm = ρSvΔt","这些水的速度由 v 变为 0，动量变化 Δp = Δm·v = ρSv²Δt","由动量定理 FΔt = Δp，得 F = ρSv² = 1000×10⁻⁴×100 = 10 N","由牛顿第三定律，水对墙的平均作用力也是 10 N"],"a":"水对墙的平均作用力为 10 N","c":"连续体问题先取一小段时间的质量元，再对这个质量元用动量定理，Δt 最后会约掉","x":"用「动量流」看：每秒 1 kg 水以 10 m/s 撞墙，动量变化率就是 10 N，一步读出"}]}],"匀变速直线运动":[{"t":"公式选择与知三求二","f":"给出 v₀、v、a、x、t 中的三个求其余；常与刹车、往返、斜面等情境结合，埋「时间超过停止时间」的坑","k":"五个量知三求二，选公式的原则是「缺什么避开什么」：不涉及 t 用 v² − v₀² = 2ax，不涉及 x 用 v = v₀ + at，不涉及 a 用 x = (v₀+v)t/2","q":[{"q":"汽车以 20 m/s 行驶，刹车时加速度大小为 5 m/s²。求刹车后 6 s 内的位移。","s":["先算停止时间：t₀ = v₀/a = 20/5 = 4 s","因为 6 s > 4 s，4 s 后车已停止，后 2 s 位移为零","6 s 内位移等于 4 s 内位移：x = v₀²/(2a) = 400/10 = 40 m","若直接代入 x = v₀t − ½at² 会得到 30 m，是「倒着开」的荒谬解"],"a":"40 m","c":"刹车类问题第一步永远是算停止时间，再判断给定时间是否超过它；超过就截断到停止时刻","x":"直接用刹车距离公式 x = v₀²/(2a)，与时间无关，天然避开陷阱；反向思考更快：把刹车看成逆向的初速为零匀加速，x = ½at₀² = ½×5×16 = 40 m"}],"v":["给三个量求其余两个","先算刹车停止时间再代入","往返运动要分段处理","斜面上滑与下滑的位移关系","不含时间的公式 v²−v₀²=2ax"]},{"t":"纸带与逐差法求加速度","f":"给出打点计时器纸带上连续相等时间内的位移，求加速度和某计数点的瞬时速度，或判断运动性质","k":"连续相等时间 T 内的位移差恒定 Δx = aT²，这是匀变速的判据也是求 a 的公式；某点瞬时速度等于该点前后两段的平均速度","q":[{"q":"纸带每 0.02 s 打一点，每 5 个间隔取一个计数点，测得相邻计数点间距依次为 2.0、3.0、4.0、5.0 cm。求加速度和打第 2 个计数点时的速度。","s":["计数周期 T = 5×0.02 = 0.1 s","相邻位移差 Δx = 1.0 cm = 0.01 m，由 Δx = aT² 得 a = 1.0 m/s²","第 2 点为第 2、3 段之间的时刻，v₂ = (x₂ + x₃)/(2T) = (0.03+0.04)/0.2 = 0.35 m/s","数据成等差（2、3、4、5），说明纸带做匀变速运动，结论自洽"],"a":"a = 1.0 m/s²，v₂ = 0.35 m/s","c":"逐差法要用全部数据：a = [(x₃+x₄) − (x₁+x₂)]/(4T²)，比只用两段更充分地利用了测量值、误差更小","x":"先看位移是否成等差数列，成等差就说明严格匀变速，可用 v₂ = (x₂+x₃)/(2T) 直算；若不成等差，题目多半在考「为什么不能用逐差法」"}],"v":["用逐差法求加速度 a","求某计数点的瞬时速度","判断纸带是否做匀变速运动","处理舍去最前面一段的情况","由纸带求某点的速度并画 v-t 图"]},{"t":"刹车陷阱与往返运动","f":"汽车刹车、物体冲上斜面后返回，求某时刻的速度或位移","k":"先算停止时间 t停 = v₀/a；所求时刻超过 t停 时速度为零、位移取停止时的值","q":[{"q":"汽车以 20 m/s 行驶，刹车加速度大小为 5 m/s²。求刹车后 3 s 内和 6 s 内的位移。","s":["停止时间 t停 = v₀/a = 20/5 = 4 s","3 s < 4 s，正常代入：x₃ = 20×3 − ½×5×9 = 37.5 m","6 s > 4 s，车早在 4 s 时就停了，位移取停止时的值","x = v₀²/(2a) = 400/10 = 40 m"],"a":"3 s 内 37.5 m；6 s 内 40 m（不是 60 − 90 = −30 m）","c":"一切刹车题先算停止时间再比较——超过就按停止时的位移算，这是本节最高频的失分点","x":"用 v² = 2ax 反算最大位移：x = v₀²/(2a) = 40 m，一步得到 6 s 的答案，完全不用管时间"}],"v":["求刹车后某时刻的速度","求刹车后一段时间内的位移","冲上斜面后又返回的全程","判断速度何时减为零","刹车距离与反应距离"]},{"t":"初速为零的匀加速比例式","f":"物体从静止开始匀加速，求连续相等时间内的位移比、连续相等位移所用时间比","k":"连续相等时间内位移比 1:3:5:7；通过连续相等位移所用时间比 1:(√2−1):(√3−√2)","q":[{"q":"物体从静止开始匀加速下滑，第 1 s 内位移 2 m。求第 3 s 内的位移与前 3 s 的总位移。","s":["由 x₁ = ½a×1² = 2 m 得 a = 4 m/s²","连续相等时间内位移比为 1:3:5，第 3 s 内是第 3 份","x₃ = 5 × 2 = 10 m","前 3 s 总位移 = (1+3+5) × 2 = 18 m"],"a":"第 3 s 内 10 m，前 3 s 共 18 m","c":"1:3:5:7 用于「第 n 秒内」；注意是「第 n 秒内」不是「前 n 秒」，两句话差一个累加","x":"用 x = ½at² 校验：前 3 s 是 18 m、前 2 s 是 8 m，第 3 s 内 = 10 m，两种算法互相印证"}],"v":["连续相等时间内的位移比 1:3:5","连续相等位移所用时间比","第 n 秒内的位移","前 n 秒与前 2n 秒的位移比","由比例式反求总时间"]}],"单摆":[{"t":"单摆做简谐运动的条件","f":"分析单摆的回复力来源，判断在什么条件下才能看作简谐运动","k":"回复力是重力沿圆弧切线的分力 mg sinθ，只有 θ 很小时 sinθ ≈ θ，才与位移成正比","v":["单摆回复力的来源","为什么要求摆角很小","大摆角时周期如何变化","单摆与弹簧振子的区别"],"q":[{"q":"摆长 1 m 的单摆，摆角为 5° 与 30° 时，回复力是否与位移成正比？周期是否相同？","s":["回复力 F = mg sinθ，位移 x = Lθ（弧长）","θ = 5° = 0.0873 rad 时 sinθ ≈ 0.0872，相对误差约 0.1%，可认为 F ∝ x","θ = 30° = 0.524 rad 时 sinθ = 0.5，相对误差约 4.5%，F 不再与 x 成正比","故 5° 时可视为简谐运动，周期用 2π√(L/g)；30° 时偏离简谐，实际周期略大于公式值"],"a":"5° 时近似成正比、可视为简谐；30° 时明显偏离，周期偏大","c":"判据就是 sinθ ≈ θ 是否成立，一般以 5°（约 0.087 rad）为界","x":"看误差量级：sinθ/θ ≈ 1 − θ²/6，θ=0.087 时误差 0.13%，θ=0.52 时误差 4.5%，一眼分晓"}]},{"t":"用单摆测重力加速度","f":"给出摆长与 n 次全振动的总时间，求 g；或分析摆长、时间记录错误对结果的影响","k":"g = 4π²L/T²，T 由总时间除以全振动次数得到；摆长必须量到球心","v":["由实验数据求 g","摆长该量到哪里","为什么要测多次全振动","分析 g 偏大偏小的原因"],"q":[{"q":"摆长 1.00 m 的单摆做 50 次全振动用 100.0 s。求 g；若摆长误按悬点到球顶量得（少算 1 cm），g 偏大还是偏小？","s":["T = 100.0/50 = 2.00 s","g = 4π²L/T² = 4×9.87×1.00/4.00 ≈ 9.87 m/s²","若真实摆长为 1.01 m 而代入 1.00 m，算得的 g 比真实值（约 9.97）偏小","故摆长记小了 g 偏小；反之记大了 g 偏大"],"a":"g ≈ 9.87 m/s²；摆长记小会使 g 偏小","c":"g ∝ L/T²：L 偏小则 g 偏小，T 偏大（把 n 次数少了）则 g 偏小，两个方向别搞反","x":"只看比例关系判断误差方向，不必逐项代入数字：g 与 L 正比、与 T² 反比"}]}],"卫星变轨":[{"t":"变轨过程的加速度、速度与能量","f":"卫星从低轨到高轨（或反向），判断各阶段速度、加速度、机械能的变化，比较不同轨道上的周期","k":"点火加速 → 需要的向心力变大 → 引力不足 → 做离心运动升高轨道；升高后稳定圆轨道的速度反而更小","q":[{"q":"卫星先在低轨圆轨道运行，在 P 点点火加速进入椭圆轨道，到远地点 Q 再次点火进入高轨圆轨道。比较三个轨道上速度与机械能的大小关系。","s":["低轨圆轨道速度 v₁；P 点点火后瞬间速度增大到 v₂ > v₁，开始做离心运动","沿椭圆从 P 到 Q，引力做负功，速度不断减小","Q 点再次点火加速，进入高轨圆轨道，速度变为 v₃","稳定圆轨道「高轨低速」，故 v₃ < v₁；机械能随轨道升高而增大，E₁ < E₂ < E₃"],"a":"v₂ > v₁ > v₃，E₁ < E₂ < E₃","c":"分两件事看：同一点点火是「瞬间加速」，不同圆轨道之间比是「高轨低速」，两者并不矛盾","x":"记住这个反直觉结论：两次都在加速，最终速度却更小——因为加速的目的是抬高轨道，抬高后速度自然变小"}],"v":["比较不同轨道上的速度","比较不同轨道上的加速度","判断机械能如何变化","该点火加速还是减速","同一点在不同轨道上的加速度相同"]},{"t":"变轨对接与追及","f":"两航天器在不同轨道同一平面内，问如何追上、需要几次点火、转移时间多少","k":"低轨周期短、跑得快，会从后方追上高轨目标；不能直接加速追（加速会升轨），必须经椭圆转移轨道","q":[{"q":"飞船在较低圆轨道、空间站在较高圆轨道，两者共面。飞船要与空间站对接，应如何操作？","s":["飞船轨道低、周期小、角速度大，会逐渐追上空间站","不能直接加速——加速会使飞船升轨，偏离空间站所在轨道","应在相位合适时点火加速，进入椭圆转移轨道，使远地点与空间站轨道相切","到达远地点时再次点火加速，进入空间站轨道完成对接"],"a":"等相位合适后两次点火，经椭圆转移轨道对接","c":"「加速升轨、减速降轨」是变轨铁律；追赶靠等待相位差，不靠直接加速","x":"用霍曼转移记：两次点火、转移轨道是半椭圆，转移时间等于该椭圆周期的一半"}],"v":["如何追上前面同一轨道上的航天器","需要几次点火","求转移轨道上的运行时间","霍曼转移的轨道选择","低轨追高轨的次序"]},{"t":"同步卫星的轨道高度","f":"求同步卫星的轨道半径、距地面高度与线速度","k":"同步卫星周期被锁死为 24 h（86400 s），由 r³ = GMT²/(4π²) 求半径，高度 h = r − R","q":[{"q":"已知地球质量 M = 6×10²⁴ kg，G = 6.67×10⁻¹¹ N·m²/kg²，地球半径 R = 6.4×10⁶ m。估算同步卫星距地面的高度。","s":["由 GMm/r² = m(4π²/T²)r 得 r³ = GMT²/(4π²)","T = 86400 s，T² ≈ 7.5×10⁹ s²","r³ = 6.67×10⁻¹¹×6×10²⁴×7.5×10⁹ ÷ (4π²) ≈ 7.6×10²² m³","r ≈ 4.2×10⁷ m","h = r − R ≈ 4.2×10⁷ − 6.4×10⁶ ≈ 3.6×10⁷ m"],"a":"约 3.6×10⁴ km（3.6 万公里）","c":"同步卫星只有一个固定高度，因为周期被锁死；求半径统一用 r³ = GMT²/(4π²)","x":"记结论「同步卫星高度约 3.6 万公里、线速度约 3.1 km/s」，估算题可直接引用"}],"v":["求同步卫星的轨道半径","求距地面的高度","求同步卫星的线速度","同步卫星为什么只能在赤道上空","同步卫星的周期与地球自转相同"]}],"原子核":[{"t":"核反应方程的配平","f":"补全核反应方程、判断粒子种类、判断反应类型","k":"质量数守恒与电荷数守恒两条都要满足；常见粒子：α(4,2)、β(0,−1)、质子(1,1)、中子(1,0)","q":[{"q":"完成核反应方程：²³⁸U → ²³⁴Th + ?，并指出反应类型。","s":["质量数：238 − 234 = 4","电荷数：92 − 90 = 2","质量数 4、电荷数 2 对应 α 粒子（⁴₂He）","故为 α 衰变"],"a":"⁴₂He，属于 α 衰变","c":"先配质量数、再配电荷数，两条都验一遍才算完成，只配一条是最常见的错","x":"把常见粒子的 (A,Z) 背成表：α(4,2)、β(0,−1)、p(1,1)、n(1,0)、正电子(0,1)，配平时直接查"}],"v":["补全核反应方程","判断未知粒子的种类","判断反应的类型","质量数与电荷数守恒","用逐行做减法配平方程"]},{"t":"半衰期","f":"求剩余质量、衰变次数、经过的时间，或判断关于半衰期的说法","k":"m = m₀(1/2)^(t/T)；半衰期是统计规律，只对大量原子核有意义，且不受温度、压强影响","q":[{"q":"某放射性元素半衰期为 5 天，原有 8 g 该元素，经过 15 天后还剩多少？","s":["15 天 = 3 个半衰期","每经过一个半衰期剩余一半","m = 8 × (1/2)³","= 8 × 1/8 = 1 g"],"a":"1 g","c":"先算「经过几个半衰期」，再用 (1/2)ⁿ，比套对数公式快得多","x":"半衰期不能预测单个核何时衰变，也不能被加温加压改变，这两条是常考的辨析点"}],"v":["求经过 n 个半衰期后的质量","求衰变的次数","求经过的时间","半衰期是统计规律","对少量原子核不适用"]},{"t":"核力的性质与比结合能","f":"判断核力的特点，或由比结合能曲线判断哪些核反应能释放能量","k":"核力是短程强相互作用，只在约 10⁻¹⁵ m 内起作用且有饱和性；比结合能越大原子核越稳定","q":[{"q":"为什么重核裂变与轻核聚变都能释放能量？用比结合能曲线说明。","s":["比结合能曲线中间高、两端低，铁附近的核比结合能最大、最稳定","重核比结合能较小，裂变成中等核后比结合能增大，多余能量释放","轻核比结合能更小，聚变成较重的核后比结合能增大，同样释放能量","两条路径都是「向曲线峰值靠拢」，故都放能"],"a":"因为裂变与聚变都使核向比结合能更大的方向移动，多余能量以动能形式释放","c":"比结合能曲线是核能的「地形图」：所有放能反应都是往山顶（铁）走","x":"判放能只需一句：反应后比结合能变大就放能，变小就吸能，不必算质量亏损"}],"v":["判断核力的特点","由比结合能曲线判断能否放能","为什么铁附近的核最稳定","核力的饱和性","核力是短程强相互作用"]}],"原子结构":[{"t":"α粒子散射与核式结构","f":"由散射现象推断原子结构，或判断关于核式结构的说法","k":"绝大多数 α 粒子几乎不偏转，说明原子内部很空；极少数大角度偏转甚至反弹，说明存在体积小、质量大、带正电的核","q":[{"q":"α 粒子散射实验中，为什么极少数 α 粒子会发生大角度偏转甚至被反弹回来？","s":["大多数 α 粒子几乎沿直线通过，说明原子内部大部分是空的","极少数 α 粒子非常靠近原子核，受到很强的库仑斥力","原子核集中了原子的几乎全部质量和全部正电荷","故这些 α 粒子发生大角度偏转甚至被弹回"],"a":"因为它们非常靠近体积很小、集中全部正电荷与几乎全部质量的原子核","c":"三条现象对应三个结论，是典型的「现象 → 结构」推理题，三条要能一一对应","x":"记住卢瑟福的结论：枣糕模型被推翻，改为「行星式」核式结构模型"}],"v":["由散射现象推断原子结构","判断关于核式结构的说法","极少数大角度偏转说明什么","绝大多数几乎不偏转说明什么","现象与结论的对应"]},{"t":"能级跃迁与光谱","f":"求跃迁时吸收或放出的光子能量、波长，或判断能发出几种频率的光","k":"hν = E_m − E_n（高能级减低能级）；一群处于 n 能级的氢原子最多辐射 n(n−1)/2 种光子","q":[{"q":"氢原子从 n=4 跃迁到 n=2，两能级分别为 −0.85 eV 与 −3.4 eV。求辐射光子的能量与波长。","s":["ΔE = −0.85 − (−3.4) = 2.55 eV","由 λ = hc/ΔE，取 hc = 1240 eV·nm","λ = 1240/2.55","≈ 486 nm，属蓝绿光"],"a":"2.55 eV，约 486 nm","c":"跃迁能量一律「高能级减低能级」，能级本身是负值，减法最容易错符号","x":"直接用 λ(nm) = 1240/ΔE(eV)，一步出波长，不必换算成焦耳"}],"v":["求跃迁辐射的光子能量","求光子的波长","判断能发出几种频率的光","吸收与辐射的区别","用 hν = Eₘ − Eₙ"]},{"t":"卢瑟福核式结构模型的困难","f":"说明核式结构模型与经典电磁理论的矛盾，或解释为什么需要玻尔模型","k":"绕核运动的电子是加速运动，按经典理论应持续辐射、轨道收缩坠核，且光谱应为连续谱","q":[{"q":"核式结构模型在经典物理框架下会遇到什么根本困难？","s":["电子绕核做圆周运动，存在向心加速度，属于加速运动","经典电磁理论：加速电荷持续辐射电磁波、能量不断减少","能量减少则轨道半径减小，电子应在约 10⁻¹¹ s 内坠入原子核，原子不可能稳定存在","且辐射频率应连续变化得到连续谱，而实际观察到的是分立线状谱"],"a":"原子不稳定（电子会坠核），且光谱应为连续谱，与事实矛盾","c":"两个矛盾：稳定性 + 分立谱；玻尔的三条假设正是逐条回应这两点","x":"答这类题先摆经典理论的预言，再摆实验事实，矛盾自然显形"}],"v":["与经典电磁理论的矛盾","为什么原子不可能稳定","为什么光谱应为连续谱","玻尔如何逐条回应","两个矛盾分别对应哪条假设"]}],"原子结构与波粒二象性":[{"t":"光电效应的图像综合","f":"给出 I-U 图或 Ek-ν 图，读截距与斜率求普朗克常量、逸出功、截止频率","k":"Ek-ν 图斜率是 h、纵截距是 −W₀；Uc-ν 图斜率是 h/e、纵截距是 −W₀/e","v":["由 Ek-ν 图求普朗克常量","由截距求逸出功","由图像求截止频率","两图的斜率分别代表什么"],"q":[{"q":"某金属的遏止电压 Uc 与入射光频率 ν 的关系图线：斜率 4.0×10⁻¹⁵ V·s，纵轴截距 −2.0 V。求普朗克常量、逸出功与截止频率（e=1.6×10⁻¹⁹ C）。","s":["由 eUc = hν − W₀ 得 Uc = (h/e)ν − W₀/e","斜率 k = h/e = 4.0×10⁻¹⁵，故 h = 1.6×10⁻¹⁹×4.0×10⁻¹⁵ = 6.4×10⁻³⁴ J·s","纵截距 −W₀/e = −2.0 V，故 W₀ = 2.0 eV = 3.2×10⁻¹⁹ J","横截距即截止频率 ν₀ = W₀/h = 3.2×10⁻¹⁹/6.4×10⁻³⁴ = 5.0×10¹⁴ Hz"],"a":"h = 6.4×10⁻³⁴ J·s，W₀ = 2.0 eV，ν₀ = 5.0×10¹⁴ Hz","c":"Uc-ν 图三个量一次读全：斜率给 h/e，纵截距给 −W₀/e，横截距给 ν₀","x":"用 eV 作单位最省事：截距 2.0 V 直接读成 W₀ = 2.0 eV，不必先换成焦耳"}]},{"t":"能级跃迁与光谱线数","f":"求一群氢原子（或单个氢原子）从某能级向下跃迁能发出几种频率的光","k":"一群氢原子用 N = n(n−1)/2，单个氢原子最多 n−1 种","v":["一群氢原子最多发出几种光","单个氢原子最多几种","跃迁时吸收还是放出光子","谱线波长如何比较"],"q":[{"q":"一群处于 n=4 能级的氢原子向低能级跃迁，最多能发出几种不同频率的光？若只有一个氢原子呢？","s":["一群氢原子：任意两个能级之间都可能发生跃迁，N = n(n−1)/2","N = 4×3/2 = 6 种","单个氢原子只能沿一条路径逐级跃迁：4→3→2→1，最多 3 种","能级差越大，放出光子的频率越高、波长越短"],"a":"一群氢原子最多 6 种；单个氢原子最多 3 种","c":"「一群」用 n(n−1)/2，「一个」用 n−1，这是本节最容易踩的坑","x":"画能级图数连线：4 个能级两两连线，条数就是 6，比记公式更直观"}]},{"t":"原子模型的历史演进","f":"考查从枣糕模型到核式结构再到玻尔模型的实验依据与逻辑关系","k":"每个新模型都由「旧模型解释不了的现象」推动，抓住矛盾点就能串起整条线索","v":["α 散射为什么推翻枣糕模型","核式结构遇到什么困难","玻尔模型解决了什么","各模型的实验依据"],"q":[{"q":"从汤姆孙到卢瑟福再到玻尔，原子模型的实验依据分别是什么？","s":["汤姆孙发现电子，提出枣糕模型：电子嵌在正电荷的球体中","α 粒子散射实验中少数粒子发生大角度偏转，说明正电荷与几乎全部质量集中在很小的核内","核式结构与经典电磁理论矛盾：绕核电子应不断辐射而坠入核内，且无法解释线状光谱","玻尔引入定态、跃迁与轨道量子化三条假设，成功解释了氢原子光谱"],"a":"电子发现→枣糕模型；α 散射→核式结构；稳定性与光谱矛盾→玻尔模型","c":"每一条模型都对应一个「旧模型解释不了的现象」，抓住矛盾点就能记住整条历史线","x":"记因果链：大角度散射推翻枣糕，光谱线状与原子稳定性推翻核式结构"}]}],"双缝干涉":[{"t":"条纹间距公式的应用","f":"由实验数据求波长，或判断装置改变后条纹间距如何变化","k":"Δx = Lλ/d；相邻亮（暗）纹间距相等，这是干涉最本质的特征","q":[{"q":"把双缝干涉装置整体浸入水中（n = 4/3），条纹间距如何变化？","s":["水中光的波长变为 λ = λ₀/n","由 Δx = Lλ/d，其他量不变时 Δx 与 λ 成正比","波长变小，条纹间距变小","变为原来的 3/4"],"a":"条纹间距变小，变为原来的 3/4","c":"变化类问题只盯住 λ：L 与 d 不变时 Δx 与 λ 成正比","x":"直接乘 1/n：Δx′ = Δx/n = 3Δx/4，一步出结果"}],"v":["由数据求波长","装置改变后条纹间距如何变","换用不同色光的影响","屏距变化的影响","Δx 与 λ、L 成正比、与 d 成反比"]},{"t":"明暗条纹的条件","f":"判断某点是亮纹还是暗纹，或由光程差反求波长","k":"光程差为波长整数倍是亮纹，为半波长奇数倍是暗纹","q":[{"q":"双缝到屏上某点的光程差为 1.5λ，该点是亮纹还是暗纹？","s":["把光程差写成 λ 的倍数：1.5λ = 3λ/2","3λ/2 = (2k+1)λ/2，取 k = 1 时成立","满足暗纹条件","故该点为暗纹"],"a":"暗纹","c":"亮纹看整数倍、暗纹看半整数倍，判断前先把光程差写成 λ 的倍数","x":"记「整数亮、半整数暗」，比值一看便知"}],"v":["判断某点是亮纹还是暗纹","由光程差反求波长","光程差为波长整数倍是亮纹","半波长奇数倍是暗纹","中央一定是亮纹"]},{"t":"不同色光条纹的重叠与级次","f":"判断两种色光的条纹能否重合，或比较某级亮纹的位置","k":"Δx = Lλ/d，波长越长条纹越宽；同级亮纹位置正比于 λ，故不同色光的同级条纹不重合","q":[{"q":"红光与蓝光分别做双缝干涉，判断两者第一级亮纹是否重合，哪一条离中央更远。","s":["第一级亮纹位置 x = Lλ/d","λ红 > λ蓝，其他条件相同","故 x红 > x蓝，红光条纹更靠外","两者位置不同不重合；级次越高，分离越明显"],"a":"不重合；红光的第一级亮纹离中央更远","c":"「波长定条纹宽度」——红光条纹最宽、紫光最窄，这是色光比较题的总纲","x":"同一装置比较色光只比 λ：λ 大的条纹宽、位置远，不必算具体数值"}],"v":["判断同级条纹是否重合","哪一条离中央更远","级次越高分离越明显","红光与蓝光的比较","白光的彩色条纹"]}],"反冲与爆炸":[{"t":"反冲速度的计算","f":"火箭喷气、小车抛物体、人跳离小车，求反冲后的速度","k":"系统总动量不变；喷出后主体质量已经减少，这是最常见的错误来源","v":["求喷气后火箭的速度","人跳离小车后车的速度","多次抛出的累积效果","求反冲的距离"],"q":[{"q":"总质量 200 kg（含 50 kg 燃料）的小车静止在光滑水平面上，燃料以相对地面 200 m/s 的速度一次性向后喷出。求小车获得的速度。","s":["喷气过程内力远大于外力，系统动量守恒，总动量为零","设剩余 150 kg 的小车速度为 v，50 kg 气体速度为 −200 m/s","150v + 50×(−200) = 0","v = 10000/150 ≈ 66.7 m/s"],"a":"小车获得约 66.7 m/s 的速度，方向与喷气方向相反","c":"反冲问题一律写「系统总动量不变」，特别注意喷出后主体质量已经减少","x":"用比例式更快：v = (m气/m车)×v气 = (50/150)×200 ≈ 66.7 m/s，方向与喷气相反"}]},{"t":"爆炸中的能量分配","f":"静止物体炸成两块或多块，求各块速度比、动能比或释放的总能量","k":"动量守恒定速度比，Ek = p²/(2m) 定动能比——动量相同时动能与质量成反比","v":["求爆炸后两块的速度比","求两块动能之比","由总能量求各块动能","判断哪块飞得更快"],"q":[{"q":"静止的炸弹炸成质量比 1:2 的两块，共释放能量 300 J。求两块的动能。","s":["爆炸瞬间动量守恒，总动量为零，故两块动量大小相等、方向相反","由 Ek = p²/(2m)，动量相同时动能与质量成反比：Ek1 : Ek2 = m₂ : m₁ = 2 : 1","总动能 300 J 按 2:1 分配","质量小的一块得 200 J，质量大的一块得 100 J"],"a":"质量小的块 200 J，质量大的块 100 J","c":"爆炸题两步走：动量守恒定速度比，Ek = p²/(2m) 定动能比，不要用 ½mv² 硬算","x":"记结论：动量相同时动能与质量成反比，所以小块飞得快、拿走的能量也多"}]}],"受迫振动与共振":[{"t":"受迫振动的频率与稳定状态","f":"给出固有频率与驱动力频率，判断稳定后振动的频率与振幅变化","k":"受迫振动稳定后的频率等于驱动力频率，与固有频率无关；固有频率只影响振幅","v":["稳定后振动频率是多少","驱动力频率改变时振幅如何变","固有频率的作用是什么","受迫振动与自由振动的区别"],"q":[{"q":"弹簧振子的固有频率为 5 Hz，受频率 3 Hz 的驱动力作用。稳定后振动频率是多少？若驱动力频率改为 5 Hz，振幅如何变化？","s":["受迫振动稳定后的频率等于驱动力频率，与固有频率无关","故 3 Hz 驱动时振动频率为 3 Hz","驱动力频率越接近固有频率，振幅越大；相等时振幅最大，即共振","故改为 5 Hz 时振幅达到最大"],"a":"3 Hz 驱动时振动频率为 3 Hz；5 Hz 驱动时发生共振，振幅最大","c":"「受迫振动频率等于驱动力频率」是死结论，固有频率只决定振幅大小，不决定频率","x":"把共振曲线想成一座山峰，峰顶在 f驱 = f固 处，驱动频率越靠近峰顶振幅越大"}]},{"t":"共振现象的解释与应用","f":"以洗衣机脱水、桥梁振动、荡秋千等情境设问，解释剧烈振动的原因或如何避免","k":"剧烈振动一定对应驱动力频率接近固有频率；要避免共振就让工作频率远离固有频率","v":["洗衣机某转速下剧烈振动的原因","部队过桥为什么要便步走","荡秋千如何越荡越高","如何避免共振"],"q":[{"q":"洗衣机脱水时转速从 0 逐渐增大，在某一转速附近机身剧烈振动，之后又趋于平稳。解释这一现象。","s":["脱水桶转动时给机身一个周期性驱动力，其频率等于转速对应的频率","转速增大到接近机身固有频率时发生共振，振幅最大，机身剧烈振动","转速继续增大，驱动力频率远离固有频率，振幅减小，机身趋于平稳","设计时应使机身固有频率远离常用工作转速，避免共振"],"a":"该转速对应机身的固有频率，发生共振；越过之后振幅减小而趋于平稳","c":"见到「剧烈振动」先找两个频率是否相等，这是共振的唯一判据","x":"用共振曲线解释：驱动力频率从低到高扫过固有频率，振幅先增后减，峰值处就是剧烈振动"}]}],"变压器":[{"t":"变压器的电压、电流与功率关系","f":"已知匝数比与原线圈电压，求副线圈电压、电流与原线圈电流","k":"电压比等于匝数比，功率相等，电流比等于匝数反比","v":["求副线圈电压","求原线圈电流","匝数比与电流比的关系","变压器能改变功率吗"],"q":[{"q":"理想变压器原线圈 1000 匝、副线圈 200 匝，原线圈接 220 V 交流电，副线圈接 22 Ω 电阻。求副线圈电压、电流与原线圈电流。","s":["由 U₁/U₂ = n₁/n₂ 得 U₂ = 220×200/1000 = 44 V","副线圈电流 I₂ = U₂/R = 44/22 = 2 A","理想变压器 P₁ = P₂，即 U₁I₁ = U₂I₂","I₁ = 44×2/220 = 0.4 A"],"a":"U₂ = 44 V，I₂ = 2 A，I₁ = 0.4 A","c":"变压器三条关系：电压比等于匝数比、功率相等、电流比等于匝数反比，注意电流是反比","x":"先算功率 P₂ = U₂²/R = 88 W，再由 I₁ = P/U₁ = 0.4 A，比用电流比公式更直观"}]},{"t":"变压器的动态分析","f":"负载电阻或副线圈匝数变化，判断各电压、电流、功率如何变化","k":"电压由匝数比决定（先定 U₂），电流由负载决定（再看 I₂），功率随之，最后回到 I₁","v":["负载电阻减小各量如何变","副线圈匝数增加电压如何变","原线圈电流如何变","变压器动态分析的顺序"],"q":[{"q":"理想变压器原线圈接恒定交流电压，副线圈接滑动变阻器。当滑片使副线圈电阻减小时，副线圈电压与原线圈电流如何变化？","s":["原线圈电压 U₁ 与匝数比固定，故 U₂ = U₁n₂/n₁ 保持不变","副线圈电阻减小，I₂ = U₂/R 增大","输出功率 P₂ = U₂I₂ 增大","由 P₁ = P₂ 得 I₁ = P₂/U₁ 也增大"],"a":"U₂ 不变，I₂ 增大，I₁ 增大","c":"动态分析顺序固定：U₁ → U₂（由匝数比定）→ I₂（由负载定）→ P₂ → I₁","x":"记住一句话：电压由匝数定、电流由负载定，先定电压再看电流，方向就不会错"}]}],"向心力":[{"t":"向心力大小的计算","f":"已知线速度、角速度、周期或转速中的任一个，求向心力","k":"四个表达式等价：mv²/r、mω²r、m·4π²r/T²、mvω，按已知量挑一个","v":["由线速度求向心力","由转速求向心力","由周期求向心力","向心力随半径如何变化"],"q":[{"q":"质量 0.5 kg 的小球在半径 0.5 m 的圆周上以 2 m/s 运动。求向心力；若改为每秒 3 转，向心力多大？","s":["F = mv²/r = 0.5×4/0.5 = 4 N","转速 n = 3 r/s，角速度 ω = 2πn ≈ 18.85 rad/s","F = mω²r = 0.5×355.3×0.5 ≈ 88.8 N","转速 3 r/s 时向心力是原来的 22 倍，说明向心力对转速极其敏感"],"a":"原来 4 N；转速 3 r/s 时约 88.8 N","c":"已知 v 用 mv²/r，已知 ω 用 mω²r，已知 T 用 4π²mr/T²，先统一单位再代入","x":"多一个可选式：先算 ω = v/r = 4 rad/s，再 F = mvω = 0.5×2×4 = 4 N，计算量更小"}]},{"t":"多力在半径方向的合成","f":"物体在一般位置（非最高点、最低点）做圆周运动，求某个力或判断是否脱离","k":"把各力分解到半径方向，指向圆心的取正、背离的取负，合力等于 mv²/r","v":["求一般位置绳的张力","判断小球在何处脱离轨道","求半径方向的合力","求某位置的支持力"],"q":[{"q":"长 L 的轻绳系小球在竖直面内做圆周运动，某时刻绳与竖直方向成 θ，球位于圆心上方，速度为 v。求绳的张力。","s":["球受重力 mg 与绳的拉力 T，重力沿半径方向的分量为 mg cosθ，方向背离圆心","半径方向：T + mg cosθ = mv²/L","解得 T = mv²/L − mg cosθ","当 T = 0 时小球恰好脱离圆轨道，此时 v² = gL cosθ"],"a":"T = mv²/L − mg cosθ；当 v² = gL cosθ 时 T = 0，小球开始脱离圆轨道","c":"一般位置必须先把重力分解到半径方向，只有最高点、最低点才恰好不需要分解","x":"把 mg cosθ 看成「沿半径向外的等效重力分量」，与最低点的 mg 类比，正负号一次就定对"}]}],"向心加速度":[{"t":"三种连接方式的加速度比较","f":"同轴转动、皮带传动、齿轮啮合三类装置中比较线速度、角速度、向心加速度","k":"同轴转动 ω 相同，皮带与齿轮边缘 v 相同；再由 a = v²/r 或 a = ω²r 比较，先定「谁相同」是关键","q":[{"q":"A、B 两轮用皮带连接，半径之比为 1:2。求 A、B 轮边缘点的向心加速度之比。","s":["皮带连接，两轮边缘的线速度相同：v_A = v_B","由 a = v²/r，v 相同时 a 与 r 成反比","a_A : a_B = r_B : r_A = 2 : 1","若改为同轴转动（ω 相同），则由 a = ω²r 得比为 1:2，结论正好相反"],"a":"2:1","c":"先判断连接方式定出「谁相同」，再选 a = v²/r 或 a = ω²r，一步到位","x":"画一张三连接对照表：同轴 ω 同、皮带齿轮 v 同、同半径 a 同，考场上直接查表比对"}],"v":["同轴转动的角速度相同","皮带传动的线速度相同","齿轮啮合的线速度相同","比较向心加速度大小","不打滑时边缘点线速度相等"]},{"t":"变速圆周运动的加速度方向","f":"判断某点加速度是否指向圆心，或求切向、法向加速度分量","k":"只有匀速圆周运动的加速度才指向圆心；变速圆周运动的加速度有切向分量，合加速度偏离圆心","q":[{"q":"小球在竖直平面内做变速圆周运动，经过绳与竖直方向成 θ 角的位置时速率为 v，绳长 L。求此时加速度的法向与切向分量。","s":["法向（指向圆心）：a_n = v²/L，由绳张力与重力法向分量的合力提供","切向：由重力沿切向的分量提供，a_t = g sinθ","合加速度 a = √(a_n² + a_t²)，方向偏离圆心","只有在最高点、最低点处 sinθ = 0，合加速度才指向圆心"],"a":"a_n = v²/L，a_t = g sinθ，合加速度不指向圆心","c":"变速圆周运动必须分解为法向（改变方向）与切向（改变速率）两个分量，不能笼统说「指向圆心」","x":"一句话判错：凡是选项说「变速圆周运动的加速度指向圆心」，一律错；只有匀速圆周运动才成立"}],"v":["加速度是否指向圆心","求切向与法向分量","最低点的加速度方向","速率变化时加速度的指向","合力与向心力的差别"]},{"t":"向心加速度的计算与速度变化量","f":"求某点的向心加速度，或求一段时间内速度的变化量 Δv","k":"a = v²/r = ω²r = 4π²r/T²；Δv 是矢量差，不能把速率直接相减","q":[{"q":"质点做半径 2 m、周期 4 s 的匀速圆周运动。求向心加速度，以及经过半个周期速度的变化量大小。","s":["ω = 2π/T = π/2 rad/s","a = ω²r = (π/2)²×2 = π²/2 ≈ 4.9 m/s²","v = ωr = π m/s ≈ 3.1 m/s","半个周期后速度方向完全反向，Δv = 2v = 2π ≈ 6.3 m/s"],"a":"向心加速度约 4.9 m/s²；半个周期内 Δv 约 6.3 m/s","c":"匀速圆周运动速率不变但速度一直在变；Δv 必须按矢量算，半个周期正好反向所以是 2v","x":"记：半周期 Δv = 2v，四分之一周期 Δv = √2·v，都是一个等腰直角三角形的斜边"}],"v":["求某点的向心加速度","求一段时间内的 Δv","Δv 的方向","用 Δv/Δt 求平均加速度","匀速圆周运动的 Δv 大小"]}],"固体与晶体":[{"t":"晶体与非晶体的判断","f":"给出若干说法，判断关于晶体、非晶体、单晶体、多晶体的描述是否正确","k":"晶体（单晶与多晶）都有确定熔点；单晶体各向异性，多晶体与非晶体各向同性","v":["判断某物质是否为晶体","单晶体与多晶体的区别","非晶体有没有熔点","各向异性的判据"],"q":[{"q":"判断正误：A 所有晶体都有确定熔点；B 单晶体一定各向异性；C 非晶体没有确定熔点；D 多晶体表现各向异性。","s":["A 对：无论单晶体还是多晶体，都有确定的熔点","B 对：单晶体在不同方向上物理性质不同","C 对：非晶体没有确定熔点，受热逐渐软化","D 错：多晶体由大量小晶粒杂乱排列而成，宏观上各向同性"],"a":"A、B、C 正确，D 错误","c":"两句话解决全部判断：「单晶各向异性、多晶各向同性」「晶体有熔点、非晶体没有」","x":"用食盐与玻璃对比：食盐是单晶体（有规则外形、各向异性），玻璃是非晶体（无熔点、各向同性）"}]},{"t":"结构决定性质","f":"同种元素组成的不同晶体性质差异巨大，要求从结构角度解释","k":"同种元素可以形成不同晶体（同素异形体），性质差异来自原子排列方式不同","v":["石墨与金刚石为何性质不同","同素异形体的性质差异","结构如何决定性质","晶体为什么有规则外形"],"q":[{"q":"石墨与金刚石都由碳组成，为什么物理性质差别巨大？","s":["两者的碳原子排列方式（点阵结构）完全不同","金刚石中每个碳原子与 4 个碳原子形成正四面体空间网状结构，故硬度极大","石墨为层状结构，层内结合强、层间结合弱，故质软易滑动且能导电","同种元素形成不同晶体，称为同素异形体，结构决定性质"],"a":"原子排列方式不同，导致硬度、导电性等性质差异巨大","c":"「结构决定性质」是固体部分的统一线索，判断性质差异先问结构差在哪","x":"类比：同样的材料排成不同结构，功能完全不同——晶体的性质由「排列」而非「成分」决定"}]}],"图像法":[{"t":"v-t 图的斜率与面积","f":"由 v-t 图求加速度、位移、平均速度，或比较两物体的运动与追及","k":"斜率 = 加速度；图线与时间轴围成的面积 = 位移（轴下取负）；两图线交点表示速度相同，不是相遇","q":[{"q":"某物体 0-4 s 由静止匀加速到 8 m/s，4-10 s 匀速，10-12 s 匀减速到零。求总位移与全程平均速度。","s":["0-4 s：面积 ½×4×8 = 16 m","4-10 s：面积 6×8 = 48 m","10-12 s：面积 ½×2×8 = 8 m","总位移 72 m，总时间 12 s，平均速度 72/12 = 6 m/s"],"a":"总位移 72 m，平均速度 6 m/s","c":"v-t 图三件事：斜率看加速度、面积看位移、交点看速度相等。分段算面积再相加，别漏最后一段","x":"平均速度一律用 v̄ = 总位移 ÷ 总时间；只有匀变速才可用 (v₀+v)/2，混着用是常见扣分点"}],"v":["由斜率求加速度","由面积求位移","由 v-t 图求平均速度","比较两物体的追及","t 轴下方的面积取负"]},{"t":"斜率截距的物理意义","f":"由图像求电动势与内阻、劲度系数、普朗克常量等，或判断图像是否正确","k":"先写出物理关系式，化成 y = kx + b 的形式，斜率与截距各对应一个物理量","q":[{"q":"用伏安法测电源，作出 U-I 图线，纵轴截距为 3.0 V，图线斜率为 −2.0 Ω。求电动势与内阻。","s":["闭合电路欧姆定律：U = E − Ir","与 y = kx + b 逐项对照：截距 b = E，斜率 k = −r","E = 3.0 V","r = |k| = 2.0 Ω"],"a":"电动势 3.0 V，内阻 2.0 Ω","c":"图像题通用套路：先写公式，再与 y = kx + b 对照，斜率、截距的物理意义自然浮现","x":"记结论「U-I 图截距是 E、斜率绝对值是 r」；若纵轴不从零开始，截距会失真，只能读斜率"}],"v":["由图像求电动势与内阻","由图像求劲度系数","由图像求普朗克常量","判断图像是否正确","截距对应哪个物理量"]},{"t":"图像转换与化曲为直","f":"把非线性图像转化为线性图像，或由直线的斜率、截距求物理量","k":"通过变量替换让关系变成 y = kx + b，斜率与截距就对应物理量","q":[{"q":"验证玻意耳定律时，为什么常画 p-1/V 图而不是 p-V 图？","s":["等温时 pV = C，即 p = C/V，p-V 图是双曲线，不便判断是否为反比","令横轴为 1/V，则 p = C·(1/V)，p-1/V 图应是过原点的直线","直线的斜率就是常量 C，是否过原点可直接用直尺判断","化曲为直后判断反比关系变得直观，误差也一目了然"],"a":"因为 p-1/V 图是过原点的直线，便于判断反比关系并求出常量","c":"「化曲为直」的通用手法：把自变量换成它的倒数或平方，让关系线性化","x":"判断两个量是否成反比，最稳的办法是画「一个量 — 另一个量的倒数」图，看是否过原点"}],"v":["把非线性关系转成线性","由斜率求物理量","由截距求物理量","判断两个量是否成反比","变量替换的思路"]}],"圆周运动":[{"t":"向心力的来源分析","f":"圆锥摆、汽车转弯、拱形桥、圆盘上的物块，求角速度、线速度或某个力的大小","k":"向心力不是一种新的力，而是合力在半径方向的分量；先受力分析，再沿半径方向写 ΣF = mv²/r","q":[{"q":"质量 1 kg 的小球用长 1 m 的细绳悬挂做圆锥摆，绳与竖直方向夹角 60°。求小球做圆周运动的角速度（g 取 10 m/s²）。","s":["受力：重力 mg、绳张力 T，二力的合力水平指向圆心","竖直方向平衡：T cos60° = mg，得 T = 20 N","水平方向提供向心力：T sin60° = mω²·L sin60°","ω = √(g/(L cos60°)) = √(10/0.5) = √20 ≈ 4.47 rad/s"],"a":"约 4.47 rad/s","c":"圆锥摆一律「竖直方向平衡 + 水平方向提供向心力」，结论 ω = √(g/(L cosθ))，与质量无关","x":"记 h = L cosθ 为圆锥摆的高度，则 ω = √(g/h)，与单摆周期 T = 2π√(h/g) 完全同形，两个模型可以互相印证"}],"v":["圆锥摆求角速度","汽车转弯的最大速度","拱形桥对桥面的压力","圆盘上物块的临界角速度","火车转弯的外轨受力"]},{"t":"竖直面内的临界问题","f":"绳模型（最高点最小速度）、杆模型（最高点速度可为零）、拱桥（最大安全速度）","k":"绳模型最高点「恰好通过」的条件是张力为零、重力恰好提供向心力，v_min = √(gr)；杆模型最高点速度可以为零","q":[{"q":"质量 0.5 kg 的小球用长 0.4 m 的细绳系住在竖直平面内做圆周运动。求最高点的最小速度和此时绳的张力（g 取 10 m/s²）。","s":["最高点速度最小时，绳张力恰好为零，重力提供全部向心力","mg = mv²/r，得 v = √(gr) = √(0.4×10) = 2 m/s","此时 T = 0","若 v 更大，则 T = mv²/r − mg，随 v 增大而增大"],"a":"v_min = 2 m/s，此时 T = 0","c":"绳模型最高点「恰好通过」= T = 0，即 v_min = √(gr)；杆模型没有这个限制，v 可以为零","x":"用能量校验：从最低点到最高点 ½mv₁² = ½mv₂² + 2mgr，已知最低点速度就能直接判断能否通过"}],"v":["绳模型最高点最小速度","杆模型最高点速度可为零","拱桥的最大安全速度","管道模型在最高点的临界","最低点绳的张力"]},{"t":"圆周运动与平抛的结合","f":"小球在竖直圆轨道内运动后从某点飞出，做平抛落地，求水平距离或落点位置","k":"分两段处理：圆轨道段用向心力方程与机械能守恒求飞出点的速度，飞出后按平抛处理","q":[{"q":"半径 R = 0.5 m 的光滑半圆轨道竖直放置，小球恰好能通过最高点。求小球落地点到轨道最低点的水平距离（g = 10）。","s":["恰好通过最高点：mg = mv²/R，得 v = √(gR) = √5 ≈ 2.24 m/s","从最高点飞出后做平抛，下落高度为 2R = 1 m","由 2R = ½gt² 得 t = √(4R/g) = √0.2 ≈ 0.45 s","水平距离 x = v·t = 2.24×0.45 ≈ 1.0 m"],"a":"约 1.0 m","c":"这类题分两段：圆轨道段用向心力 + 能量，飞出后用平抛；两段的衔接点是飞出点的速度","x":"记结论：恰好过最高点时 x = √(gR)·√(4R/g) = 2R，本题即 1.0 m，一步出结果"}],"v":["从圆轨道飞出后做平抛","求落地的水平距离","求落地点的位置与距离","求飞出点的速度","先平抛后进入圆轨道"]}],"圆周运动的规律":[{"t":"圆周运动的周期性与多解","f":"圆周运动与另一个运动配合（转盘、穿孔、追及），求最短时间或写出全部可能值","k":"转过整圈后状态重复，通式带 n（n=0,1,2…），问「最短」时取 n=0","v":["求再次相遇的最短时间","转盘转过的角度可能值","子弹穿过旋转圆盘","多解问题如何写通式"],"q":[{"q":"直径 1 m 的圆盘绕中心轴匀速转动，子弹沿直径方向以 200 m/s 穿过圆盘，留下两个弹孔，两孔夹角 90°。求圆盘角速度的可能值。","s":["子弹穿过圆盘的时间 t = d/v = 1/200 = 0.005 s","这段时间内圆盘转过的角度 θ = π/2 + 2nπ（n = 0,1,2…）","ω = θ/t = (π/2 + 2nπ)/0.005 = 100π(1 + 4n) rad/s","取 n=0 得最小值 ω = 100π ≈ 314 rad/s"],"a":"ω = 100π(1+4n) rad/s（n=0,1,2…），最小约 314 rad/s","c":"圆周运动的周期性一律写成 θ = θ₀ + 2nπ，多解就来自 n 的取值","x":"反过来看：子弹飞行时间极短，圆盘转过的角度必须是「90° 加上整圈」，把整圈写成 2nπ 即可"}]},{"t":"圆周运动与能量、临界的综合","f":"圆轨道上的物体既要满足临界条件，又要用能量关系求速度，求高度范围或某点受力","k":"临界条件给速度下限，能量关系把高度与速度连起来，两者联立得范围","v":["求不脱离轨道的释放高度","圆轨道与弹簧的组合","求轨道对物体的作用力","判断能否完成整圈"],"q":[{"q":"小球从高 h 处沿光滑斜面滑下，进入半径 0.4 m 的竖直圆轨道内侧，g=10。求小球能通过最高点的最小 h。","s":["通过最高点的临界条件：重力单独提供向心力，mg = mv²/R，得 v² = gR = 4","从释放点到最高点机械能守恒：mgh = mg·2R + ½mv²","h = 2R + v²/(2g) = 0.8 + 0.2 = 1.0 m","若 h < 1.0 m，小球会在轨道上半部某处脱离轨道"],"a":"h 至少为 1.0 m，即 2.5R","c":"竖直圆轨道「不脱离」有两个分支：h ≥ 2.5R 通过最高点，或 h ≤ R 只在下方往复","x":"记住 2.5R 这个数：h = 2.5×0.4 = 1.0 m，可用来快速检验计算结果"}]},{"t":"水平面内圆周运动的三类情境","f":"圆锥摆、转盘、弯道三类情境，求角速度、周期或最大安全速度","k":"三类情境向心力来源不同（拉力分量、静摩擦、支持力分量），但方程形式完全一样","v":["圆锥摆的周期","转盘上物块的最大角速度","汽车转弯的最大速度","火车弯道内外轨高度差"],"q":[{"q":"火车以 20 m/s 通过半径 400 m 的弯道，要求轮缘不受侧向压力，g=10。求内外轨高度差对应的倾角。","s":["不受侧压力时，重力与支持力的合力提供向心力","竖直方向：N cosθ = mg；水平方向：N sinθ = mv²/R","两式相除：tanθ = v²/(gR) = 400/4000 = 0.1","θ ≈ 5.7°"],"a":"tanθ = 0.1，倾角约 5.7°","c":"「不受侧向压力」等价于「重力与支持力的合力正好提供向心力」，与圆锥摆方程完全相同","x":"记 tanθ = v²/(gR)，这就是弯道设计的核心公式，结果与列车质量无关"}]}],"多普勒效应":[{"t":"多普勒效应的频率判断","f":"波源或观察者运动，求接收频率，或判断频率是升高还是降低","k":"相互靠近则接收频率升高、相互远离则降低；先判方向，再代公式","v":["波源靠近时接收频率","波源远离时接收频率","观察者运动的情况","判断频率升高还是降低"],"q":[{"q":"火车鸣笛频率 500 Hz，以 30 m/s 靠近站台，声速 340 m/s。求站台听到的频率；远离时又是多少？","s":["靠近时波长被压缩，f′ = f·v/(v − v源) = 500×340/310 ≈ 548 Hz","远离时波长被拉长，f′ = f·v/(v + v源) = 500×340/370 ≈ 459 Hz","靠近频率升高、远离频率降低，这就是多普勒效应的核心","若波源静止、观察者运动，则改为 f′ = f(v ± v观)/v"],"a":"靠近约 548 Hz，远离约 459 Hz","c":"「靠近则高、远离则低」，先判方向再代公式，不要死记分子分母谁加谁减","x":"从波长想：靠近时波被压缩、λ 变小，由 f = v/λ 必增大，定性判断一秒出结果"}]},{"t":"多普勒效应的应用","f":"测速仪、天文红移、医学彩超等情境，由频率变化反推速度","k":"反射式测速是「两次多普勒」的叠加，频率比只与速度比有关","v":["用超声波测车速","天体光谱红移说明什么","由频率变化求速度","判断物体靠近还是远离"],"q":[{"q":"交警用超声波测速仪向迎面驶来的汽车发射 40 kHz 的超声波，测得反射波频率为 40.8 kHz，声速 340 m/s。估算车速。","s":["反射波频率升高，说明车与测速仪相互靠近","车接收到的频率 f₁ = f(v+v车)/v，反射后测速仪收到 f₂ = f₁·v/(v−v车)","综合得 f₂/f = (v+v车)/(v−v车) = 40.8/40 = 1.02","解得 v车 = 0.02v/2.02 ≈ 3.4 m/s"],"a":"车速约 3.4 m/s（约 12 km/h），正在靠近测速仪","c":"反射式测速是两次多普勒叠加，最终频率比只含速度与波速之比","x":"小速度近似：Δf/f ≈ 2v车/v，故 v车 ≈ (Δf/f)·v/2 = 0.02×170 = 3.4 m/s，一步得解"}]}],"多用电表":[{"t":"多用电表的原理与读数","f":"考查欧姆挡的刻度特点、读数方法、换挡后为什么要重新调零","k":"欧姆挡刻度不均匀、右密左疏，读数要乘倍率；换挡即换内阻，必须重新欧姆调零","v":["欧姆挡如何读数","换挡后为什么重新调零","指针指在哪里最准","红黑表笔如何接"],"q":[{"q":"用多用电表欧姆挡测电阻，指针指在刻度 15 处，挡位为 ×100。读数是多少？换挡后为什么要重新欧姆调零？","s":["读数 = 刻度值 × 倍率 = 15×100 = 1500 Ω","欧姆挡内部有电源，不同挡位对应的内阻不同","换挡后内阻改变，指针零点随之偏移，必须短接表笔重新调零","测量时应让指针落在中间刻度附近，此时读数最准"],"a":"1500 Ω；换挡改变了内阻，零点随之改变，所以必须重新调零","c":"欧姆挡刻度不均匀，读数必须乘倍率，且每次换挡都要调零——这两点几乎是必考点","x":"从原理想：欧姆挡 = 电流表 + 内电源 + 调零电阻，换挡就是换内阻，零点当然要重调"}]},{"t":"用多用电表判断电路故障","f":"电路某处断路或短路，用电压挡或欧姆挡检测并判断故障位置","k":"断路处两端承受全部电压，短路处两端电压为零","v":["用电压挡找断路点","用欧姆挡查短路","灯不亮如何排查","开关两端有电压说明什么"],"q":[{"q":"闭合开关后灯不亮，用电压挡测得开关两端电压接近 220 V。判断故障位置。","s":["开关两端电压接近电源电压，说明开关处于断路状态","若开关正常闭合，其接触电阻极小，两端电压应接近 0","断路处电阻无穷大，会分得全部电压，这是判断断路的依据","故故障是开关接触不良或内部断路"],"a":"开关断路（接触不良）","c":"电压表量到某段两端有电压，说明该段断路；量到某段无电压而电路仍不通，说明断路在别处","x":"把电路想成串联分压：断路处电阻无穷大，分得全部电压，「哪里量到全电压，哪里就断了」"}]}],"天然放射现象":[{"t":"三种射线的性质","f":"判断 α、β、γ 射线的本质、电离能力、穿透能力，或在电磁场中的偏转","k":"α 是氦核（电离最强、穿透最弱），β 是电子（居中），γ 是光子（穿透最强、电离最弱）","q":[{"q":"把放射性物质放在垂直纸面向里的匀强磁场中，α、β、γ 三种射线如何偏转？","s":["α 粒子带正电，由左手定则向一侧偏转，因质量大偏转半径大","β 粒子带负电，向相反方向偏转，因质量小偏转明显","γ 射线不带电，不发生偏转","穿透能力排序：γ > β > α"],"a":"α 与 β 向相反方向偏转（α 的半径大），γ 不偏转","c":"电离能力与穿透能力总是相反：电离强的穿透弱，记住一条即可推另一条","x":"记「α 重带电、β 轻带电、γ 不带电」，偏转方向与程度一次判定"}],"v":["判断三种射线的本质","比较电离能力的强弱","比较穿透能力的强弱","在电磁场中的偏转情况","α 是氦核、β 是电子流、γ 是光子"]},{"t":"衰变次数的计算","f":"由始末核求 α 衰变与 β 衰变的次数","k":"α 衰变使质量数减 4、电荷数减 2；β 衰变质量数不变、电荷数加 1","q":[{"q":"²³⁸U 经过一系列衰变变成 ²⁰⁶Pb。求其中 α 衰变与 β 衰变的次数。","s":["质量数减少 238 − 206 = 32","每次 α 衰变减 4，故 α 衰变次数 = 32/4 = 8","电荷数应由 92 减到 82，净减少 10","8 次 α 衰变减少 16，故 β 衰变 16 − 10 = 6 次"],"a":"8 次 α 衰变，6 次 β 衰变","c":"先用质量数定 α 次数，再用电荷数反推 β 次数，顺序不能颠倒","x":"列式一次搞定：净减少的电荷数 = 2n_α − n_β，即 10 = 16 − n_β，n_β = 6"}],"v":["求 α 衰变的次数","求 β 衰变的次数","由始末核的质量数与电荷数差求解","列方程组计算","先定 α 再定 β"]},{"t":"三种射线在电磁场中的偏转","f":"判断α、β、γ射线在磁场或电场中的偏转方向与弯曲程度","k":"α带正电、β带负电、γ不带电；半径 r = mv/(qB)，α的半径远大于β","q":[{"q":"三种射线垂直射入垂直纸面向里的匀强磁场，判断各自的偏转情况。","s":["γ不带电，不受洛伦兹力，沿直线前进","α带正电，由左手定则偏向一侧；β带负电，偏向相反一侧","半径 r = mv/(qB)：α的质量大、速度小，但电荷量只有 2e，综合后半径远大于β","故α的圆弧最平缓，β的圆弧最弯曲"],"a":"γ不偏转；α与β向相反方向偏转，且α的半径远大于β","c":"「α偏得少、β偏得多、γ不偏」——三者的质量电荷比决定了这一点","x":"先用带电性定偏转方向（左手定则），再用 r = mv/(qB) 定弯曲程度"}],"v":["判断各自的偏转方向","比较弯曲程度","γ 为什么不偏转","α 与 β 偏转方向相反","半径 r = mv/(qB)"]}],"宇宙速度":[{"t":"三个宇宙速度的物理意义","f":"判断某发射速度对应的运动状态（绕地、绕日、飞出太阳系），或计算某星球的第一宇宙速度","k":"7.9 km/s 是最小发射速度也是最大环绕速度；11.2 km/s 脱离地球引力；16.7 km/s 脱离太阳系","q":[{"q":"某探测器的发射速度为 12 km/s。判断它此后的运动情况。","s":["12 km/s > 11.2 km/s，已能脱离地球引力的束缚","12 km/s < 16.7 km/s，还不能脱离太阳引力","因此它将成为绕太阳运行的人造天体","轨道为椭圆或双曲线，取决于剩余动能的大小"],"a":"脱离地球束缚，成为绕太阳运动的人造天体","c":"三个阈值对应「脱离谁」：7.9 绕地、11.2 离地、16.7 离日，逐级判断即可","x":"第二宇宙速度就是第一的 √2 倍：由 ½mv² = GMm/R 得 v = √(2GM/R) = √2·v₁，不必硬记"}],"v":["判断发射速度对应的运动状态","第一宇宙速度的物理意义","第二、第三宇宙速度的数值","某星球的第一宇宙速度"]},{"t":"第一宇宙速度的推导与变形","f":"给出某星球的质量与半径（或密度与半径），求其第一宇宙速度或与其他星球的比值","k":"v₁ = √(GM/R) = √(gR)，只由中心天体决定，与环绕天体质量无关","q":[{"q":"某行星的质量是地球的 8 倍，半径是地球的 2 倍。求该行星的第一宇宙速度与地球之比。","s":["v = √(GM/R)","v星/v地 = √[(8M/M) ÷ (2R/R)] = √4 = 2","地球第一宇宙速度为 7.9 km/s","该行星约为 15.8 km/s"],"a":"2:1，约 15.8 km/s","c":"比例法：v ∝ √(M/R)，把质量比与半径比代入即可，不必求绝对数值","x":"若给的是密度 ρ 与半径 R，则 v = √(4πGρR²/3) ∝ R√ρ，换成这个比例式再算"}],"v":["由 M、R 求 v₁","由 ρ、R 求 v₁","求两星球 v₁ 之比","v₁ 与近地环绕速度的关系","v₁ 是最小发射速度也是最大环绕速度"]},{"t":"近地卫星、同步卫星与赤道物体的比较","f":"比较三类天体的线速度、角速度、向心加速度与周期","k":"近地卫星 r ≈ R、周期约 85 min；同步卫星 T = 24 h、位于赤道正上方；赤道上的物体与同步卫星角速度相同但半径更小","q":[{"q":"比较近地卫星 A、同步卫星 B、赤道上随地球自转的物体 C 的线速度与角速度大小。","s":["A、B 都是卫星，由 v = √(GM/r)：r_A < r_B，故 v_A > v_B","B 与 C 的周期都是 24 h，角速度相同，ω_B = ω_C","由 v = ωr：r_B > r_C，故 v_B > v_C","合起来 v_A > v_B > v_C，且 ω_A > ω_B = ω_C"],"a":"v_A > v_B > v_C；ω_A > ω_B = ω_C","c":"三者的关键分野：A、B 用「万有引力提供向心力」，B、C 用「角速度相同」，两组关系绝不能混用","x":"记「卫星越高越慢，赤道上的物体被同步卫星甩在后面」"}],"v":["比较三者的线速度","比较三者的周期","同步卫星与赤道物体角速度相同","比较三者的向心加速度","赤道物体为何不是卫星"]}],"守恒思想":[{"t":"守恒量的选取与判定","f":"判断某过程中哪个量守恒，或由初末状态求未知量、求摩擦生热","k":"先看外力：合外力为零→动量守恒；只有重力弹力做功→机械能守恒；有摩擦生热→能量守恒但机械能不守恒","q":[{"q":"质量 2 kg 的物块以 6 m/s 滑上粗糙水平面，滑行 4 m 后停下。求摩擦力大小与产生的热量（g = 10）。","s":["用动能定理：−f·x = 0 − ½mv²","f = mv²/(2x) = 2×36 ÷ 8 = 9 N","产生的热量 Q = f·x = 9×4 = 36 J","与初动能 ½×2×36 = 36 J 相等，机械能全部转化为内能"],"a":"摩擦力 9 N，热量 36 J","c":"有摩擦时机械能不守恒，但能量守恒：减少的机械能等于摩擦力乘相对滑动路程","x":"一步法：Q = ΔEk = ½mv² = 36 J，再由 f = Q/x = 9 N 反推，省掉列方程的功夫"}],"v":["判断哪个量守恒","由初末状态求未知量","由能量守恒求摩擦生热","在动量与能量之间做选择"]},{"t":"多过程问题里的守恒串联","f":"碰撞、滑行、上摆等多阶段连在一起，需要分段选择守恒定律","k":"碰撞瞬间动量守恒（时间极短、内力远大于外力）；碰后滑行或上升用能量守恒；两段靠共同速度衔接","q":[{"q":"质量 1 kg 的子弹以 300 m/s 水平射入静止在光滑水平面上质量 4 kg 的木块并留在其中，随后一起压缩一轻弹簧。求共同速度与弹簧的最大弹性势能。","s":["射入过程极短，动量守恒：1×300 = (1+4)v","v = 60 m/s","碰后系统机械能守恒，动能全部转化为弹性势能","Ep = ½×5×60² = 9000 J"],"a":"共同速度 60 m/s，最大弹性势能 9000 J","c":"完全非弹性碰撞损失动能最多，但动量一定守恒；碰后立刻换成能量守恒，中间靠共同速度衔接","x":"记住口诀「碰前
