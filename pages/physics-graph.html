E/R → F = BIL；最大速度出现在安培力等于外力（a = 0）时","q":[{"q":"质量 0.1 kg 的导体棒在光滑水平导轨上受 0.5 N 恒力由静止启动，B = 0.5 T，棒长 0.4 m，回路总电阻 0.2 Ω。求棒能达到的最大速度。","s":["速度最大时加速度为零，安培力等于外力：BIL = 0.5 N","I = 0.5/(0.5×0.4) = 2.5 A","E = IR = 2.5×0.2 = 0.5 V","v = E/(BL) = 0.5/0.2 = 2.5 m/s"],"a":"2.5 m/s","c":"最大速度的条件永远是「加速度为零」，即安培力与外力平衡，与过程是否匀加速无关","x":"直接用 v_max = FR/(B²L²) = 0.5×0.2/(0.25×0.16) = 2.5 m/s，一步出结果"}],"v":["求棒的加速度","求棒最终的最大速度","求产生的热量","求通过截面的电荷量","加速度减小的加速运动"]},{"t":"双棒模型与动量能量综合","f":"两根棒在同一导轨上通过磁场相互作用，求最终速度、相对位移、产生的总热量","k":"双棒系统的安培力等大反向、属于内力，动量守恒；最终两棒共速，损失的动能全部转化为焦耳热","q":[{"q":"光滑导轨上两根质量均为 0.1 kg 的棒，一根以 3 m/s 运动、另一根静止，通过磁场相互作用。求最终共同速度与产生的总热量。","s":["系统所受安培力是内力，动量守恒：mv₀ = 2mv","v = 1.5 m/s","动能损失 = ½×0.1×9 − ½×0.2×2.25","= 0.45 − 0.225 = 0.225 J，全部转化为焦耳热"],"a":"共同速度 1.5 m/s，产生热量 0.225 J","c":"双棒模型两个关键：动量守恒（安培力是内力）、能量守恒（损失的动能全变热），缺一不可","x":"用约化质量速算：Q = ½μv_rel²，μ = m/2 = 0.05 kg，Q = ½×0.05×9 = 0.225 J，一步出"}],"v":["求最终的共同速度","求两棒之间的相对位移","求产生的总热量","用动量守恒求速度","双棒间距的变化"]},{"t":"导轨问题的 v-t 与 i-t 图像","f":"由棒的 v-t 图判断受力与电动势变化，或定性画出 i-t 图","k":"单棒在恒力作用下：v↑ → E↑ → I↑ → 安培力↑ → 合力↓ → a↓，最终匀速","q":[{"q":"导体棒在恒力 F 作用下从静止开始沿光滑导轨运动（回路电阻 R、匀强磁场 B）。定性描述其 v-t 图与 i-t 图。","s":["初始 v = 0，E = 0，I = 0，安培力为零，a = F/m 最大","随 v 增大，E = BLv 增大，I = BLv/R 增大","安培力 F安 = B²L²v/R 增大，合力减小，加速度减小","当 F安 = F 时 a = 0，速度达到最大值 v_m = FR/(B²L²)","v-t 图是斜率逐渐减小的曲线，最终趋于水平；i ∝ v，i-t 图形状相同"],"a":"v-t 与 i-t 都是「先陡后缓、趋于水平」的曲线，最终匀速","c":"导轨题的核心链条：v → E → I → F安 → a → v，走完一圈就知道是「加速度减小的加速运动」","x":"记「恒力启动的导轨问题最终一定匀速」，v_m = FR/(B²L²)，求最大速度一步到位"}],"v":["由 v-t 图判断受力变化","定性画出 i-t 图","判断最终是否匀速","斜率与加速度的对应","最大速度 v_m = FR/(B²L²)"]}],"布朗运动":[{"t":"布朗运动的成因与影响因素","f":"解释为什么颗粒越小、温度越高布朗运动越明显，或判断某因素对布朗运动的影响","k":"成因是液体分子对各方向撞击不平衡；颗粒越小撞击越不平衡、质量越小越易被推动；温度越高分子运动越剧烈","q":[{"q":"为什么悬浮颗粒越小，布朗运动越明显？","s":["颗粒越小，同一时刻撞击它的分子数越少","各方向撞击的不平衡性（统计涨落）越显著","颗粒质量越小，同样的冲量产生的加速度越大","两个原因叠加，使小颗粒的布朗运动格外明显"],"a":"撞击的不平衡性更显著，且颗粒质量小、更易被推动","c":"两个原因必须都说：撞击不平衡（统计涨落）+ 质量小（惯性小），只说一个不完整","x":"用「样本越小、涨落越大」的统计直觉理解，比背结论更牢"}],"v":["解释颗粒越小为什么越明显","解释温度越高为什么越明显","判断某因素的影响方向","撞击不平衡的成因","悬浮颗粒的质量影响"]},{"t":"布朗运动、扩散与热运动的辨析","f":"判断三个概念的说法是否正确，或判断某现象属于哪一类","k":"布朗运动看的是悬浮颗粒、扩散看的是分子直接迁移、热运动指分子本身的运动","q":[{"q":"下列说法的正误：A 布朗运动就是分子的热运动　B 扩散现象说明分子在不停地运动　C 温度越低布朗运动越明显　D 布朗运动只能在液体中发生","s":["布朗运动是颗粒的运动，A 错","扩散是分子直接迁移的证据，B 对","温度越低分子运动越缓慢，布朗运动越不明显，C 错","气体中同样可以观察到布朗运动，D 错"],"a":"只有 B 正确","c":"三个概念的对象不同，判断时先问「说的是谁在动」：颗粒、分子迁移，还是分子本身","x":"一句话辨析：布朗运动是分子热运动的「影子」，不是分子本身"}],"v":["判断某现象属于哪一类","判断某种说法是否正确","扩散与布朗运动的区别","三者都说明分子在无规则运动","扩散是分子直接迁移"]},{"t":"布朗运动的实验观察与位移分析","f":"根据实验记录判断布朗运动的特点，或分析记录间隔与位移的关系","k":"每隔相同时间记录颗粒位置并连线，连线不是轨迹；间隔越长两点间直线距离越大，说明无规则性越强","q":[{"q":"在显微镜下每隔 30 s 记录一次悬浮颗粒的位置并把各点连成折线，这条折线能否表示颗粒的运动轨迹？","s":["折线只连接了每隔 30 s 的位置，间隔内颗粒的实际路径完全未知","间隔内颗粒仍在做复杂的无规则运动，可能已绕行很远","故折线只是等时间间隔的位置连线，不是运动轨迹","间隔取得越短，折线越接近真实轨迹，但永远不会完全重合"],"a":"不能；折线只是等时间间隔的位置连线，不代表运动轨迹","c":"「折线 ≠ 轨迹」是布朗运动实验题的第一道坎，第二道坎是「布朗运动 ≠ 分子运动」","x":"看到「连线」先问三句：间隔多长、记录的是什么、能不能代表路径"}],"v":["折线是不是运动轨迹","间隔时间与位移大小的关系","如何记录颗粒的位置","间隔越短越接近真实轨迹","显微镜下看到的是颗粒不是分子"]}],"带电粒子圆周运动":[{"t":"半径、周期与几何关系","f":"求轨迹半径、周期、运动时间、偏转角，或求射出点的位置","k":"r = mv/(qB)，T = 2πm/(qB)；运动时间 t = (θ/2π)T，圆心角 θ 等于速度方向的偏转角","q":[{"q":"带电粒子垂直进入宽度为 d 的匀强磁场区域，射出时速度方向偏转了 60°。求轨迹半径与在磁场中运动的时间（用 T 表示）。","s":["速度偏转角等于轨迹的圆心角，即 θ = 60°","由几何关系，磁场宽度 d = r sin60°","r = d/sin60° = 2d/√3 ≈ 1.15d","运动时间 t = (60°/360°)T = T/6"],"a":"r = 2d/√3，t = T/6","c":"三步定式：画圆找圆心（圆心在速度垂线上）→ 由几何关系求半径 → 用圆心角求时间","x":"记住「偏转角 = 圆心角」，再用弦长关系 sin(θ/2) = (d/2)/r 直接解半径，省掉辅助线"}],"v":["求轨迹半径 r = mv/(qB)","求周期与运动时间","求粒子运动的偏转角","求射出点的位置","画轨迹找几何关系"]},{"t":"临界问题与多解","f":"粒子从边界射出的范围、恰好不射出的条件，或速度方向、大小不确定带来的多解","k":"临界条件统一是「轨迹与边界相切」；速度方向不确定用旋转圆，速率不确定用缩放圆","q":[{"q":"粒子从正方形磁场区域一边的中点垂直射入，速率可以调节。分析粒子能射出该区域的速率范围。","s":["速率小则半径小，粒子可能在区域内转过半圈，从射入的那条边射出","速率大则半径大，粒子会从对边射出","临界情况是轨迹恰好与对边相切，此时半径由几何关系确定","再由 r = mv/(qB) 反解临界速率，得到速率区间的上下界"],"a":"速率介于「恰好能从原边转出」与「恰好与对边相切」两个临界值之间","c":"一切临界问题都转化为「轨迹与边界相切」，画出相切的那个圆，几何关系立刻显现","x":"旋转圆法：把速度方向绕入射点转一圈，圆心轨迹本身也是一个圆，所有可能的圆心都落在它上面"}],"v":["求粒子从边界射出的范围","求恰好不射出的条件","速度方向不确定带来的多解","速度大小不确定带来的多解","临界半径的确定"]},{"t":"磁聚焦与几何约束","f":"粒子从同一点以不同方向射入磁场，求轨迹圆心的轨迹或射出点的范围","k":"速率相同则半径相同，圆心都在以入射点为圆心、r 为半径的圆上","q":[{"q":"粒子以相同速率、不同方向从同一点射入匀强磁场。求这些粒子轨迹圆心的轨迹。","s":["半径 r = mv/(qB) 只由速率决定，速率相同则半径相同","每个轨迹圆的圆心到入射点的距离都等于 r","所有满足「到定点距离为 r」的点构成一个圆","故圆心轨迹是以入射点为圆心、r 为半径的圆"],"a":"圆心轨迹是以入射点为圆心、r 为半径的圆","c":"「同速率 → 同半径 → 圆心在以入射点为心的圆上」，这是处理多方向入射问题的几何起点","x":"画图时先定圆心圆，再从圆心圆上取点画轨迹圆，比逐个画轨迹快得多"}],"v":["求轨迹圆心的轨迹","求射出点的范围","同速率同半径的几何关系","同一点不同方向射入","聚焦点的位置"]}],"带电粒子运动":[{"t":"加速与偏转的组合","f":"粒子先经加速电场、再进入偏转电场，求偏转距离、偏转角或打在屏上的位置","k":"加速段 eU₁ = ½mv₀²；偏转段是类平抛：t = L/v₀，a = qU₂/(md)，y = ½at²","q":[{"q":"电子经电压 U₁ 加速后，垂直进入长 L、板间距 d、电压 U₂ 的平行板。求射出时的偏转距离 y。","s":["加速段：eU₁ = ½mv₀²，得 v₀² = 2eU₁/m","偏转段飞行时间 t = L/v₀","加速度 a = eU₂/(md)","y = ½at² = ½·eU₂/(md)·L²/v₀² = U₂L²/(4U₁d)"],"a":"y = U₂L²/(4U₁d)","c":"消去 v₀ 后 y 与粒子的 q、m 全部无关，只由电压与几何尺寸决定——这是本模型最重要的结论","x":"直接用「偏转距离与粒子种类无关」判断：把电子换成质子，偏转距离不变，只是方向相反"}],"v":["求偏转距离 y","求射出时的偏转角","求打在屏上的位置","先加速后偏转的联立"]},{"t":"电场与重力场中的等效圆周运动","f":"带电小球在电场与重力共同作用下做圆周运动，求等效最高点、最小速度或临界条件","k":"把电场力与重力合成为「等效重力」，等效最低点沿合力方向，之后完全按普通竖直圆周运动处理","q":[{"q":"质量 m、带正电 q 的小球用绳系住在竖直平面内做圆周运动，同时存在水平向右的匀强电场，且 qE = mg。求等效重力的大小与方向。","s":["重力 mg 竖直向下，电场力 qE = mg 水平向右","合力大小 = √[(mg)² + (mg)²] = √2 mg","方向与竖直方向成 45° 偏右下方","等效重力加速度 g′ = √2 g，等效最低点在右下方 45° 方向"],"a":"等效重力 √2 mg，方向右下方 45°，g′ = √2 g","c":"等效重力法：先把所有恒力合成一个，再把它当成新的「重力」，所有圆周运动结论平移过去","x":"等效最高点的最小速度 v_min = √(g′R) = √(√2gR)，与原结论只差一个 √2 因子，不必重新推导"}],"v":["求等效最高点的位置","求最高点的最小速度","求等效最高点的临界条件","等效重力场的方向与大小","最低点与最高点的张力差"]},{"t":"带电粒子在交变电场中的运动","f":"粒子在周期性变化的电场中运动，求某时刻的速度、位移，或判断能否射出","k":"分时间段处理，每段内都是匀变速；关键是判断粒子在每个半周期内是否反向","q":[{"q":"平行板间加方波电压，周期为 T：前 T/2 内场强向上、后 T/2 内场强向下，大小相同。一个电子从静止在 t = 0 时释放，求一个周期末的速度与位移。","s":["前 T/2：电子带负电，受力方向与场强相反，向下加速","末速度 v = a·T/2，位移 x₁ = ½a(T/2)²","后 T/2：场强反向，电场力向上，做匀减速","末速度 v − a·T/2 = 0，位移 x₂ = v·(T/2) − ½a(T/2)² = ½a(T/2)²","总位移 x = x₁ + x₂ = aT²/4，方向向下"],"a":"一个周期末速度为零，总位移 aT²/4，方向与第一个半周期相同","c":"交变电场的关键是「一个周期末速度是否回到零」——方波且对称时正好回零，粒子只发生整体漂移","x":"画 v-t 图：一个周期是一个三角形，面积就是位移；速度对称则末速为零"}],"v":["求某时刻的速度","求某时刻的位移","判断能否射出电场","周期性加速的累积"]}],"平抛运动":[{"t":"平抛的分解与基本量计算","f":"求飞行时间、水平射程、落地速度大小与方向，或由部分信息反求初速度","k":"时间只由竖直高度决定 t = √(2h/g)，水平位移由 x = v₀t 决定，两个方向靠时间 t 联系","q":[{"q":"从 20 m 高处以 10 m/s 水平抛出小球。求落地时间、水平射程、落地速度大小（g 取 10 m/s²）。","s":["竖直方向自由落体：t = √(2h/g) = √(40/10) = 2 s","水平方向匀速：x = v₀t = 10×2 = 20 m","落地竖直分速度 v_y = gt = 20 m/s","v = √(v₀² + v_y²) = √(100+400) = 10√5 ≈ 22.4 m/s"],"a":"2 s，20 m，10√5 m/s（约 22.4 m/s）","c":"竖直定时间、水平定射程、最后矢量合成求末速度，三步顺序固定","x":"用动能定理求末速度：½mv² = ½mv₀² + mgh，得 v = √(100+400)，比先算 v_y 再合成更快"}],"v":["求平抛的飞行时间","由高度求水平射程","求落地速度大小与方向","由部分信息反求初速度","求某时刻的速度偏角"]},{"t":"斜面平抛与两个偏角推论","f":"平抛落在斜面上、速度方向与斜面平行、求飞行时间或位移比","k":"两个黄金推论：速度偏角的正切等于位移偏角正切的两倍（tanθ_v = 2tanθ_x）；速度的反向延长线过水平位移的中点","q":[{"q":"从倾角 37° 的斜面顶端以 10 m/s 水平抛出小球，小球落在斜面上。求飞行时间（g 取 10 m/s²，sin37°=0.6，cos37°=0.8）。","s":["落在斜面上说明位移方向沿斜面：tan37° = y/x","y = ½gt²，x = v₀t，代入得 ½×10×t² ÷ (10t) = 0.75","化简得 t/2 = 0.75，t = 1.5 s","校验：x = 15 m，y = 11.25 m，y/x = 0.75，与 tan37° 一致"],"a":"1.5 s","c":"「落在斜面上」用位移角，「速度与斜面平行」用速度角，两者由 tanθ_v = 2tanθ_x 联系","x":"直接套 tanθ = gt/(2v₀)：0.75 = 10t/20，得 t = 1.5 s，一个式子解决，不必写两个方向的方程"}],"v":["平抛落在斜面上","速度方向与斜面平行","求飞行时间与位移","位移偏角与速度偏角的关系","从斜面抛出又落回斜面"]},{"t":"平抛的临界与边界问题","f":"球恰好越过网或矮墙、恰好落入某区域，求初速度的取值范围","k":"把「恰好」翻译成「轨迹恰好经过该点」：x = v₀t 与 y = ½gt² 联立，解出边界对应的 v₀","q":[{"q":"从高 0.8 m 的平台水平抛出一小球，平台边缘正前方 1.2 m 处有一堵高 0.2 m 的矮墙。要使小球越过矮墙，初速度至少多大（g = 10）？","s":["恰好越过墙顶，即轨迹恰好经过墙顶那一点","从抛出点到墙顶的下落高度 h = 0.8 − 0.2 = 0.6 m","由 h = ½gt² 得 t = √(2×0.6/10) = √0.12 ≈ 0.35 s","水平位移 x = 1.2 m，故 v₀ = x/t = 1.2/0.35 ≈ 3.5 m/s"],"a":"至少约 3.5 m/s","c":"「恰好越过」就是「轨迹恰好过该点」——把该点坐标代入平抛方程，解出的 v₀ 就是临界值","x":"用比例式更快：v₀ = x√(g/2h) = 1.2×√(10/1.2) ≈ 3.5 m/s，不必先求 t"}],"v":["恰好越过网或矮墙","恰好落入某区域","求初速度的取值范围","擦着边界飞出的条件","两个边界同时满足"]}],"库仑定律":[{"t":"库仑力的合成与平衡位置","f":"两个点电荷对第三个电荷的作用力合成，或求第三个电荷的平衡位置","k":"先判断每个力的方向，再矢量合成；两个同种电荷时，平衡点在电量较小的一侧外部","q":[{"q":"两个正电荷 Q₁ = 4q、Q₂ = q 相距 L。在连线上放第三个电荷使它受力平衡，求其位置。","s":["第三个电荷必在 Q₂ 的外侧（离电量小的更近），才能让两个斥力反向","设它离 Q₂ 的距离为 x，则离 Q₁ 为 L + x","平衡条件：kQ₂q/x² = kQ₁q/(L+x)²","1/x² = 4/(L+x)²，开方得 (L+x)/x = 2，解得 x = L"],"a":"在 Q₂ 外侧、距 Q₂ 为 L 处（距 Q₁ 为 2L）","c":"「两同夹异、两大夹小、近小远大」：同种电荷时平衡点在小电荷外侧，异种电荷时在两者之间","x":"用比例速解：平衡点到两电荷的距离比等于 √Q₁:√Q₂ 的反比，即 2:1，再由距离差 L 直接得 L 与 2L"}],"v":["求第三个电荷受到的合力","求合力为零的位置","判断第三个电荷的电性","两力夹角的合成","平衡位置的唯一性"]},{"t":"三个自由电荷同时平衡","f":"判断第三个电荷的电性、电量与位置，使三个电荷都处于平衡","k":"三条口诀定电性与位置：两同夹异（两边同号、中间异号）、两大夹小（中间电量最小）、近小远大（靠近小电荷）","q":[{"q":"两个正电荷 Q₁ = 4q、Q₂ = q 相距 L，放入第三个电荷使三者都平衡。求它的电性、电量与位置。","s":["三者都平衡要求「两同夹异」：第三个必为负电荷，且位于两电荷之间","「近小远大」：它应靠近电量较小的 Q₂，设距 Q₂ 为 x","由 Q₂ 平衡：kQ₁Q₂/L² = kQ₂q₃/x²","解得 q₃ = 4q/9，x = L/3"],"a":"负电荷，电量 4q/9，位于两电荷之间、距 Q₂ 为 L/3 处","c":"口诀先定电性与位置，再用任一电荷的平衡方程定量，不必三个方程联立","x":"直接用结论式：q₃ = Q₁Q₂/(√Q₁+√Q₂)² = 4q²/(9q) = 4q/9；距小电荷 x = L√Q₂/(√Q₁+√Q₂) = L/3"}],"v":["判断第三个电荷的电性","求第三个电荷的电量","求第三个电荷的位置","两同夹异、两大夹小","三个电荷的平衡条件"]},{"t":"库仑力作用下的动力学","f":"两带电小球在光滑绝缘面上由静止释放，求某时刻的速度、加速度或相对位移","k":"库仑力是变力，加速度也随之变化，只能用动量守恒 + 能量守恒处理","q":[{"q":"两个带电小球质量分别为 m 和 2m、电荷量均为 +q，静止在光滑绝缘水平面上相距 L。由静止释放，求它们相距 2L 时的速度大小。","s":["系统合外力为零，动量守恒：m v₁ = 2m v₂，即 v₁ = 2v₂","库仑力做正功，电势能减少转化为动能：ΔEp = kq²/L − kq²/(2L) = kq²/(2L)","由能量守恒：kq²/(2L) = ½m v₁² + ½·2m v₂²","代入 v₁ = 2v₂：左边 = ½m·4v₂² + m v₂² = 3m v₂²","3m v₂² = kq²/(2L)，得 v₂ = √(kq²/(6mL))，v₁ = √(2kq²/(3mL))"],"a":"v₁ = √(2kq²/(3mL))，v₂ = √(kq²/(6mL))","c":"库仑力是变力，牛顿定律很难用；「动量守恒 + 能量守恒」是这类题的唯一通道","x":"记住同种电荷相斥分离、异种电荷相吸靠近，用动量分配与能量守恒联立，不必求加速度"}],"v":["求某时刻的速度","求初始加速度","求两球靠近的相对位移","用能量守恒求速度","加速度随距离变化的分析"]}],"开普勒三定律":[{"t":"开普勒第三定律的比例计算","f":"已知两个天体（或卫星）的轨道半径，求周期之比，或已知周期求半径之比","k":"同一中心天体下 a³/T² 为常量，比例式中常量约掉，只剩 (a₂/a₁)^(3/2)","v":["求两颗行星的周期比","已知周期求轨道半径比","判断谁的周期更长","估算某行星的公转周期"],"q":[{"q":"地球公转周期 1 年、轨道半径约 1.5×10¹¹ m；火星轨道半径约 2.28×10¹¹ m。求火星的公转周期。","s":["由开普勒第三定律 a³/T² = k，得 T₂ = T₁·(a₂/a₁)^(3/2)","半径比 a₂/a₁ = 2.28/1.5 ≈ 1.52","1.52^1.5 = 1.52×√1.52 ≈ 1.52×1.233 ≈ 1.87","故 T₂ ≈ 1.87 年，与实际 1.88 年吻合"],"a":"火星公转周期约 1.87 年","c":"第三定律只在同一中心天体下成立；比例式里 k 一定约掉，不需要知道 k 的具体值","x":"记规律：半径变为 n 倍，周期变为 n^1.5 倍；1.5 倍半径对应约 1.84 年，比线性增长快得多"}]},{"t":"椭圆轨道上的速度比较","f":"卫星沿椭圆轨道运行，比较近地点与远地点的速度、加速度、周期","k":"近地点速度最大、远地点最小，用角动量守恒（面积定律）v₁r₁ = v₂r₂ 最快","v":["比较近地点与远地点速度","求远地点速度","比较两点的加速度","判断哪段运动更快"],"q":[{"q":"卫星沿椭圆轨道运行，近地点距地心 r₁、速度 v₁，远地点距地心 r₂。求远地点速度，并比较两点的加速度。","s":["卫星只受万有引力，角动量守恒；近、远地点速度均垂直于半径","由 m v₁ r₁ = m v₂ r₂ 得 v₂ = v₁ r₁/r₂","因 r₁ < r₂，故 v₂ < v₁，近地点速度最大","加速度由万有引力产生：a = GM/r²，故近地点加速度更大"],"a":"v₂ = v₁r₁/r₂（小于 v₁）；近地点加速度更大","c":"「近快远慢」的根源是角动量守恒；加速度只看 r，与速度无关","x":"用能量守恒也能得同一结论：从近地点到远地点引力做负功，动能减小，速度必减小"}]}],"弹力":[{"t":"弹力有无与方向的判断","f":"判断某个接触处是否存在弹力、方向如何，涉及绳、杆、面、球与球、球与墙角等模型","k":"方向永远垂直于接触面：点面接触过点作面的垂线，球面接触沿半径方向。有无则用假设法——撤去该接触，看运动状态是否改变","q":[{"q":"小球静止在光滑水平地面上并紧靠光滑竖直墙壁（球与墙面接触）。墙对球有没有弹力？","s":["假设撤去墙壁，球在重力和地面支持力作用下依然静止，运动状态没有改变","说明墙对球没有必须存在的弹力","再从平衡看：水平方向若只有墙的弹力一个力，合力不可能为零","故墙对球的弹力为零"],"a":"没有弹力","c":"假设法配合平衡条件双重验证：撤去后状态不变 → 无弹力；撤去后状态改变 → 有弹力","x":"更快的一招：看水平方向是否还有别的力。只有一个力时它必为零，连假设都省了"}],"v":["判断接触处是否存在弹力","绳的拉力一定沿绳","杆的弹力是否一定沿杆","球与墙角、球与球之间的弹力","用假设法判断弹力有无"]},{"t":"胡克定律与弹簧串并联","f":"求弹簧形变量、劲度系数，或弹簧剪断、串联、并联后的等效 k，或与牛顿第二定律结合的瞬时加速度问题","k":"F = kx 中的 x 是形变量（伸长量或压缩量），不是弹簧总长；串联时各弹簧受力相同、形变相加，并联时形变相同、弹力相加","q":[{"q":"劲度系数 200 N/m、原长 10 cm 的弹簧下端挂 4 N 重物。求静止时弹簧长度；若把它剪成等长两段，每段的劲度系数是多少？","s":["由 F = kx 得 x = 4/200 = 0.02 m = 2 cm","弹簧长度 = 原长 + 伸长量 = 10 + 2 = 12 cm","剪成两段后，同样大小的力使每段只伸长原来的一半","由 k = F/x 可知劲度系数变为原来的 2 倍，即 400 N/m"],"a":"12 cm；每段 400 N/m","c":"弹簧的 k 与长度成反比：越短越硬。凡涉及「剪断」「截取」的题，一律先想这条","x":"把原弹簧看成两根半弹簧串联：1/k = 1/k₁ + 1/k₁，解得 k₁ = 2k = 400 N/m，不必记结论也能推"}],"v":["求弹簧的形变量","由 F-x 图求劲度系数","串联后的等效劲度系数","并联后的等效劲度系数","剪断弹簧瞬间的加速度"]},{"t":"轻绳、轻杆、弹簧的弹力特点","f":"判断杆的弹力方向，或比较剪断瞬间各物体的加速度","k":"绳只能拉不能推、方向沿绳；杆可拉可压、方向不一定沿杆；弹簧形变不能突变，剪断瞬间弹力不变，绳的拉力可以突变","q":[{"q":"小球用轻弹簧悬挂在天花板上，另用水平细绳把它拉偏并保持静止。剪断水平细绳的瞬间，小球的加速度方向如何？","s":["剪断前：重力、弹簧拉力、水平绳拉力三力平衡","剪断瞬间，弹簧形变来不及改变，弹力大小方向都不变","水平绳拉力消失，剩下重力与弹簧弹力的合力","该合力与原水平绳拉力等大反向，方向水平","故加速度方向水平，大小为原水平绳拉力除以质量"],"a":"加速度方向水平，大小等于原水平绳拉力除以质量","c":"「弹簧不能突变、绳可以突变」是判断瞬时加速度的唯一依据，先想清楚剪断瞬间哪些力还在","x":"记结论：剪断水平绳 → 合力沿原绳方向反向；剪断弹簧 → 只剩重力，a = g"}],"v":["杆的弹力方向如何确定","剪断瞬间各物体的加速度","弹簧弹力不能突变","绳与杆在瞬间问题中的差别","铰链连接处的受力"]}],"微元法":[{"t":"变力做功的计算","f":"求弹簧弹力、沿曲线摩擦力、变力做功，或求变力做功的平均功率","k":"把过程切成无数小段，每段内近似为恒力，求各段功再累加（这就是积分思想）","q":[{"q":"劲度系数 k = 200 N/m 的弹簧，从原长被缓慢拉长到 0.2 m。求拉力做的功。","s":["拉力 F = kx 随伸长量线性增大，是变力","取微元：dW = kx·dx","累加得 W = ½kx²","W = ½×200×0.04 = 4 J"],"a":"4 J","c":"线性变力做功 = 平均力 × 位移 = (0 + kx)/2 × x = ½kx²，这是微元法最常见的落点","x":"用 F-x 图线下面积（三角形）直接算：½×0.2×40 = 4 J，比积分更快也更直观"}],"v":["求弹簧弹力做的功","求沿曲线的摩擦力做功","求变力做功的平均功率","用 F-x 图线下面积","改用动能定理绕开"]},{"t":"流体与连续介质的微元","f":"求水流、气流、粒子流对物体的作用力，或求单位时间内通过的电荷量、质量","k":"取 Δt 内的质量微元 Δm = ρSvΔt，再用动量定理 FΔt = Δm·Δv 求平均作用力","q":[{"q":"水流以 10 m/s 垂直射向墙面，冲击后沿墙面流下（水平速度变为零）。水管横截面积 2×10⁻⁴ m²，水密度 1×10³ kg/m³。求水对墙的平均作用力。","s":["取 Δt 内流出的水：Δm = ρSvΔt = 1000×2×10⁻⁴×10×Δt = 2Δt kg","水平方向速度由 10 m/s 变为 0","动量定理：FΔt = Δm×10 = 2Δt×10","F = 20 N"],"a":"20 N","c":"流体冲击题固定三步：Δm = ρSvΔt → 动量定理 → 约掉 Δt。写成「单位时间质量」思路更清楚","x":"一步公式 F = ρSv² = 1000×2×10⁻⁴×100 = 20 N，连 Δt 都不用设"}],"v":["求水流对物体的作用力","求气流对帆面的力","求单位时间通过的电荷量","取 Δt 内的质量元","用 ρSv² 求作用力"]},{"t":"微元法求变力的冲量","f":"求随速度变化的力（如随速度变化的阻力）的冲量","k":"把过程切成无数小段，每段内可视为恒力：I = ΣF·Δt，即 F-t 图线下的面积","q":[{"q":"物体运动时受到阻力 F = kv，速度由 v₀ 减到 0。求阻力的总冲量。","s":["F = kv 随时间变化，不能直接用 I = Ft","取微元：dI = F·dt = kv·dt = k·(v·dt) = k·dx","对全程求和：I = k·x总","可见冲量等于 k 乘以总位移，与过程快慢无关"],"a":"I = kx（x 为总位移）","c":"微元法的威力在于「换个变量求和」：kv·dt 里的 v·dt 正好就是 dx","x":"遇到 F 随 v 变化的题，先试着把 dt 换成 dx/v，往往一步就化简"}],"v":["求随速度变化的阻力的冲量","把 dt 换成 dx/v","求 F-t 图线下的面积","冲量与位移的关系","变力冲量的累积"]}],"思想方法":[{"t":"一题多解与方法选择","f":"同一道题用牛顿定律、动能定理、动量定理分别求解，比较繁简并说明选择依据","k":"涉及时间用动量定理，涉及位移用动能定理，涉及瞬时加速度用牛顿第二定律","v":["三种解法如何选","为什么动能定理更简","动量定理适合什么题","一题多解如何比较"],"q":[{"q":"质量 m 的物块从高 h 的光滑斜面滑下，进入粗糙水平面滑行 s 后停下。分别用牛顿定律、动能定理求动摩擦因数，并比较。","s":["牛顿定律：斜面求 v = √(2gh)，水平面 a = μg，由 v² = 2as 得 μ = h/s（三步）","动能定理：mgh − μmgs = 0，直接得 μ = h/s（一步）","动量定理：需先求时间，还要分别处理两段，最繁","结论：涉及位移与能量变化时优先用动能定理"],"a":"μ = h/s，动能定理最简","c":"选方法的依据只有三条：涉及时间→动量定理，涉及位移→动能定理，涉及瞬时加速度→牛顿定律","x":"再快一步：全过程看能量，重力势能 mgh 全部被摩擦消耗 μmgs，一步出结果"}]},{"t":"等效替代的构造","f":"要求用等效的方法把复杂对象化为简单对象，或判断某个等效是否成立","k":"等效的唯一标准是「效果相同」，与过程是否相同无关","v":["力、场、电路三类等效","等效重力如何构造","等效电源如何使用","等效成立的条件"],"q":[{"q":"举例说明「等效替代」在高中物理中的三种用法，并说明等效成立的标准。","s":["力的等效：多个力合成一个合力，或把一个力分解为两个分力","场的等效：单摆小角度摆动等效为简谐运动；复合场中把重力与电场力合成「等效重力」","电路的等效：多个电阻化简为一个等效电阻；电源等效为电动势与内阻串联","共同的思路是用效果相同、结构更简单的对象替换原对象"],"a":"力、场、电路三类等效，本质都是「效果相同、形式更简」","c":"判断能否等效的唯一标准是「效果是否相同」，与过程是否相同无关","x":"反过来检验：若替换后某个可观测量变了，说明等效不成立——这常用来检查等效是否正确"}]}],"折射率":[{"t":"折射率的两种定义","f":"用 n = sinθ₁/sinθ₂ 或 n = c/v 求折射率，或比较不同介质的折射率","k":"两种定义完全等价：n = sinθ₁/sinθ₂ = c/v；n 由介质和光的频率共同决定，不是介质单独的性质","q":[{"q":"光在某介质中的速度为 2×10⁸ m/s。求该介质的折射率；若光从空气以 45° 入射，求折射角。","s":["n = c/v = 3×10⁸ ÷ 2×10⁸ = 1.5","由 n = sinθ₁/sinθ₂ 得 sinθ₂ = sin45°/1.5","sinθ₂ = 0.707/1.5 ≈ 0.471","θ₂ ≈ 28.1°"],"a":"n = 1.5，折射角约 28.1°","c":"已知速度用 n = c/v，已知角度用 n = sinθ₁/sinθ₂，按已知量选式子","x":"记住常见值：水 4/3、玻璃 1.5、金刚石 2.4，可快速判断答案是否离谱"}],"v":["用 sinθ₁/sinθ₂ 求 n","用 c/v 求 n","比较不同介质的折射率","两种定义为什么等价","n 由介质本身决定"]},{"t":"折射率与光速、波长的关系","f":"求介质中的波长、频率、速度，或比较不同色光的折射率大小","k":"频率由光源决定、进入介质不变；v = c/n，λ = λ₀/n","q":[{"q":"某色光在真空中波长 500 nm，进入折射率 1.5 的玻璃。求玻璃中的波长与频率。","s":["频率 f = c/λ₀ = 3×10⁸ ÷ 5×10⁻⁷ = 6×10¹⁴ Hz","频率不随介质改变，仍为 6×10¹⁴ Hz","λ = λ₀/n = 500/1.5","≈ 333 nm"],"a":"波长约 333 nm，频率 6×10¹⁴ Hz","c":"「频率不变」必须写在第一步，颜色、光子能量都由频率决定，与介质无关","x":"波长直接除以 n，不必绕道算速度，一步出结果"}],"v":["求介质中的波长","求介质中的光速","频率在介质中不变","比较不同色光的折射率","λ介质 = λ真空/n"]},{"t":"相对折射率与绝对折射率的换算","f":"用一般形式的折射定律处理两种介质之间的折射，或由相对折射率判断偏折方向","k":"n₁sinθ₁ = n₂sinθ₂ 是普适形式；相对折射率 n₂₁ = n₂/n₁ = sinθ₁/sinθ₂","q":[{"q":"光从折射率 1.5 的玻璃射入折射率 1.33 的水，判断光线相对法线如何偏折。","s":["由 n₁sinθ₁ = n₂sinθ₂，其中 n₁ = 1.5 > n₂ = 1.33","故 sinθ₂ > sinθ₁，即 θ₂ > θ₁","折射角大于入射角，光线偏离法线","相对折射率 n₂₁ = 1.33/1.5 < 1，同样说明是「由密到疏」"],"a":"折射角大于入射角，光线偏离法线","c":"「由密到疏偏离法线、由疏到密靠近法线」，判据就是两个 n 谁大谁小","x":"先比两个折射率的大小定偏折方向，只有需要算角度时才动 sin"}],"v":["用一般形式的折射定律","判断光线相对法线如何偏折","由相对折射率比较 n 的大小","n₁sinθ₁ = n₂sinθ₂","由密到疏与由疏到密"]}],"抛体运动":[{"t":"类平抛运动","f":"物体初速度与恒定合力垂直，但加速度不等于 g（光滑斜面上、电场中、复合场中），求时间与位移","k":"只要「初速度与恒定合力垂直」就是类平抛，把所有公式里的 g 换成等效加速度 a","v":["光滑斜面上的类平抛","电场中的类平抛运动","求等效重力加速度","类平抛的位移与偏角"],"q":[{"q":"光滑斜面倾角 30°，小球从斜面顶端以 2 m/s 沿斜面内水平方向射出，沿斜面下滑 1.6 m 到达底端，g=10。求所用时间与沿初速方向的偏移。","s":["小球在斜面上受重力沿斜面的分力 mg sin30°，加速度 a = g sin30° = 5 m/s²","初速度沿斜面内的水平方向，与加速度垂直，故为类平抛运动","沿斜面向下：1.6 = ½×5×t²，得 t = 0.8 s","沿初速方向：x = 2×0.8 = 1.6 m"],"a":"时间 0.8 s，沿初速方向偏移 1.6 m","c":"类平抛的判据是「初速度与恒定合力垂直」，与加速度是否等于 g 无关，公式里把 g 换成 a 即可","x":"用运动的独立性：下滑时间只由 a 与斜面长度决定，与初速度大小无关，先算时间再算偏移"}]},{"t":"斜抛运动的射程与射高","f":"以某角度斜向上抛出，求飞行时间、射高、射程，或求使射程最大的抛射角","k":"分解为水平匀速与竖直上抛；射程 R = v₀²sin2θ/g，θ=45° 时射程最大","v":["求斜抛的飞行时间","求射高与射程","求最大射程的抛射角","斜抛落到不同高度处的速度"],"q":[{"q":"以 20 m/s 斜向上 30° 抛出小球，落回同一高度，g=10。求飞行时间、射高与水平射程。","s":["分解：v₀ₓ = 20cos30° ≈ 17.3 m/s，v₀ᵧ = 20sin30° = 10 m/s","竖直方向做上抛，飞行时间 t = 2v₀ᵧ/g = 2 s","射高 H = v₀ᵧ²/(2g) = 100/20 = 5 m","射程 R = v₀ₓ·t = 17.3×2 ≈ 34.6 m"],"a":"飞行时间 2 s，射高 5 m，射程约 34.6 m","c":"斜抛一律先分解：竖直方向定时间，水平方向用这个时间求射程","x":"用射程公式 R = v₀²sin2θ/g = 400×sin60°/10 ≈ 34.6 m，一步得射程；θ=45° 时射程最大为 40 m"}]},{"t":"平抛的轨迹方程与两个推论","f":"要求写出平抛的轨迹方程，或利用「速度反向延长线过水平位移中点」等推论快速求解","k":"轨迹方程 y = gx²/(2v₀²)；速度偏角的正切是位移偏角正切的 2 倍","v":["写出平抛的轨迹方程","用中点推论求速度方向","判断轨迹是否经过某点","位移偏角与速度偏角的关系"],"q":[{"q":"小球以 5 m/s 水平抛出，g=10。写出轨迹方程；求水平位移 2 m 处的速度方向。","s":["x = v₀t，y = ½gt²，消去 t 得 y = gx²/(2v₀²) = 0.2x²","x = 2 m 时 y = 0.8 m，下落时间 t = x/v₀ = 0.4 s","vᵧ = gt = 4 m/s，vₓ = 5 m/s","tanθ = vᵧ/vₓ = 0.8，速度与水平方向夹角约 38.7°"],"a":"轨迹方程 y = 0.2x²（单位 m）；该点速度与水平方向夹角约 38.7°","c":"轨迹方程由消去时间得到；速度偏角与位移偏角满足 tanθ = 2tanα","x":"用中点推论：速度反向延长线交水平位移中点 x=1 m 处，tanθ = y/(x/2) = 0.8/1 = 0.8，不必算时间"}]}],"摩擦力":[{"t":"静摩擦与滑动摩擦的判断与计算","f":"给出外力大小，判断物体是否滑动、求摩擦力大小方向，或求恰好滑动的临界外力","k":"先算最大静摩擦力判断是否滑动：不滑动时用平衡条件求静摩擦，滑动后才用 f = μN。两者绝不能混用","q":[{"q":"质量 5 kg 的物体放在水平地面上，与地面间动摩擦因数 0.4。用 15 N 的水平力推它，求物体受到的摩擦力（g 取 10 m/s²，最大静摩擦力等于滑动摩擦力）。","s":["最大静摩擦力 f_max = μmg = 0.4×5×10 = 20 N","推力 15 N < 20 N，物体保持静止","由平衡条件，静摩擦力大小等于推力","f = 15 N，方向与推力方向相反"],"a":"15 N，方向与推力相反","c":"三步定式：算 f_max → 比较外力 → 决定用平衡条件还是 μN。跳过第一步直接用 μN 是最常见的失分点","x":"记住「静摩擦随外力变、滑动摩擦才用公式」；本题若答 20 N，就说明把静摩擦当成了滑动摩擦"}],"v":["判断物体是否发生相对滑动","求摩擦力的大小与方向","求恰好滑动时的临界外力","最大静摩擦力略大于滑动摩擦力","由运动状态反推摩擦力"]},{"t":"传送带上的摩擦力与相对位移","f":"物体轻放到传送带上，求加速度、达到共速的时间与位移、相对滑动的划痕长度，或倾斜传送带上的多过程运动","k":"摩擦力方向由「相对运动方向」决定，与物体对地速度方向无关；共速是摩擦力突变（消失或反向）的临界点","q":[{"q":"水平传送带以 2 m/s 匀速运行，把一物体轻放在左端，物体与带间动摩擦因数 0.2。求物体加速到与带共速所需的时间和位移（g 取 10 m/s²）。","s":["物体初速为零，相对传送带向后滑，所受摩擦力向前","a = μg = 0.2×10 = 2 m/s²","t = v/a = 2/2 = 1 s","x = v²/(2a) = 4/4 = 1 m"],"a":"1 s，1 m","c":"相对运动方向定摩擦力方向；共速之后若不再受其他力，物体与带一起匀速，摩擦力立即消失","x":"画 v-t 图：传送带是水平线、物体是过原点的斜线，两线间面积就是划痕长度 = 2×1 − 1 = 1 m，位移与划痕一次算清"}],"v":["求达到共速所需的时间","求传送带上的划痕长度","倾斜传送带的多过程分析","判断摩擦力方向何时改变","求物体与传送带的相对位移"]},{"t":"摩擦力方向的判断","f":"判断静摩擦或滑动摩擦的方向，特别是叠放、传送带、斜面上的情形","k":"滑动摩擦方向与相对运动方向相反；静摩擦方向与相对运动趋势相反，用「假设法」判断","q":[{"q":"物块 A 放在物块 B 上，B 放在水平地面上，用水平力拉 B 使两者一起向右加速运动。判断 A 所受摩擦力的方向。","s":["A 与 B 一起向右加速，A 的加速度方向向右","A 水平方向只可能受 B 给它的静摩擦力","这个摩擦力正是提供 A 加速度的唯一来源","故方向向右，大小 f = m_A·a"],"a":"方向向右，大小 f = m_A·a","c":"静摩擦方向看「相对运动趋势」：假设接触面光滑，看 A 相对 B 往哪滑，摩擦力就反向——本题中 A 会相对 B 向左滑，故摩擦力向右","x":"一句话：静摩擦总是「跟着加速度走」，物体被谁带着加速，摩擦就朝加速度方向"}],"v":["叠放物体之间的摩擦力方向","传送带对物体的摩擦力方向","斜面上静摩擦的方向","由相对运动趋势判断方向","摩擦力可以是动力"]},{"t":"摩擦力做功与摩擦生热","f":"求摩擦力做的功、系统产生的热量、相对滑动距离","k":"一对摩擦力做的总功等于 −f·Δx相对；产生的热量 Q = f·Δx相对，Δx相对 是相对滑动路程","q":[{"q":"质量 1 kg 的物块以 4 m/s 滑上静止在光滑水平面上质量 3 kg 的长木板，最终两者共速。物块与木板间动摩擦因数 0.2。求共速速度、产生的热量与相对滑动距离（g = 10）。","s":["动量守恒：1×4 = (1+3)v，得 v = 1 m/s","热量等于动能损失：Q = ½×1×4² − ½×4×1² = 8 − 2 = 6 J","摩擦力 f = μmg = 0.2×1×10 = 2 N","由 Q = f·Δx 得 Δx = 6/2 = 3 m"],"a":"共速 1 m/s，热量 6 J，相对滑动 3 m","c":"「Q = f × 相对路程」是板块问题的核心等式，注意是相对路程，不是各自的位移","x":"三步固定：动量守恒定共速 → 动能差定热量 → 除以 f 得相对位移，顺序不能颠倒"}],"v":["求摩擦力对物体做的功","求系统产生的热量 Q=f·Δx相对","求相对滑动距离","一对摩擦力做功之和为负","传送带问题中的能量转化"]}],"整体隔离法":[{"t":"连接体求加速度与内力","f":"求系统加速度，或求两物体之间的相互作用力（绳张力、相互挤压、杆的弹力）","k":"求加速度先整体（F外 = Σma）；求内力再隔离（挑受力最少的那个物体列式）","q":[{"q":"光滑水平面上，质量 2 kg 与 3 kg 的两物块用轻绳相连，水平拉力 F = 10 N 作用在 3 kg 上。求加速度与绳张力。","s":["整体：a = F/(m₁+m₂) = 10 ÷ 5 = 2 m/s²","隔离 2 kg：T = m₁·a = 4 N","隔离 3 kg 校验：F − T = 10 − 4 = 6 = 3×2 ✓","张力按质量比例分配：T = F·m₁/(m₁+m₂)"],"a":"加速度 2 m/s²，绳张力 4 N","c":"「先整体求 a，再隔离求内力」是固定两步；隔离时挑受力少的那个，方程最简单","x":"内力按质量比例分配：T = F × 未被拉一侧的质量 ÷ 总质量 = 10×2/5 = 4 N，一步得"}],"v":["求系统的加速度","用隔离法求绳的张力","求两物体之间的挤压力","先整体后隔离"]},{"t":"整体法的适用条件","f":"判断能否把系统当整体，或求地面对系统的支持力与摩擦力","k":"各物体加速度相同（或都为零）时可整体列 F = ma；加速度不同也能用，但要写 ΣF外 = Σma 的分量式","q":[{"q":"物块沿粗糙斜面加速下滑，斜面始终静止在水平地面上。判断地面对斜面的摩擦力方向。","s":["物块加速下滑，加速度沿斜面向下，具有水平分量 a水平","对「物块 + 斜面」整体，竖直方向无加速度、水平方向合外力 = m·a水平 ≠ 0","水平方向唯一的外力就是地面对斜面的摩擦力","故摩擦力方向与 a水平 同向，即指向斜面低端一侧"],"a":"方向与物块水平加速度同向，指向斜面低端一侧","c":"加速度不同也能整体：写 ΣF外 = Σma 按分量算，这是整体法的通用形式，别只记「加速度相同才能用」","x":"判据一句话：看系统重心往哪边加速，地面摩擦力就朝哪边"}],"v":["判断能否用整体法","求地面对系统的支持力","求地面对系统的摩擦力","加速度相同时才能整体","有相对加速度时的处理"]},{"t":"加速度不同的系统用整体法","f":"系统内各物体加速度不同时，用系统牛顿第二定律求外力","k":"ΣF外 = m₁a₁ + m₂a₂ + …（矢量和）；整体法只求外力，求内力必须隔离","q":[{"q":"光滑水平面上，质量 M 的斜面（倾角 θ）上有一质量 m 的物块以加速度 a 沿斜面下滑，斜面不动。求地面对斜面的支持力。","s":["对整体在竖直方向用系统牛顿第二定律：N − (M+m)g = m·a_y + M·0","物块加速度的竖直分量 a_y = a·sinθ，方向向下，故取负","N = (M+m)g − ma·sinθ","支持力小于总重力，因为物块具有向下的加速度"],"a":"N = (M+m)g − ma·sinθ","c":"系统牛顿第二定律的价值就在这里：不必拆内力，直接对外力做矢量和","x":"写方程时把各物体的加速度分解到所求方向，代入 ΣF = Σma 即可"}],"v":["用系统牛顿第二定律","求地面的支持力","求地面的摩擦力","ΣF = Σma 的矢量性","各加速度分解到所求方向"]}],"曲线运动与运动的合成":[{"t":"曲线运动的条件与轨迹判断","f":"给出受力方向与初速度方向，判断轨迹如何弯曲，或判断某点速度方向","k":"合力指向轨迹凹侧；速度方向沿轨迹切线，合力只改变方向不改变速率（当合力垂直于速度时）","v":["判断轨迹弯曲方向","确定某点的速度方向","判断速率如何变化","合力与速度夹角的意义"],"q":[{"q":"质点在一水平面上运动，经过 P 点时速度水平向右，所受合力斜向右下方。此后质点速率如何变化？轨迹向哪侧弯曲？","s":["把合力分解为沿速度方向的分力 F∥ 与垂直速度方向的分力 F⊥","F∥ 与速度同向，故速率增大","F⊥ 指向速度的右下方，轨迹向合力所指的一侧弯曲，即向下偏","轨迹为向下弯曲的曲线，速率不断增大"],"a":"速率增大，轨迹向下（合力一侧）弯曲","c":"沿速度方向的分力管速率增减，垂直速度方向的分力管方向改变，两个分力分工明确","x":"极限法：若合力一直与速度垂直则速率不变（匀速圆周），现在合力偏向速度前方，相当于「顺着推」，速率必增大"}]},{"t":"运动的合成与分解","f":"小船渡河、绳связ物体、电梯中抛球等情境，求实际速度、最短时间或最短位移","k":"实际运动是合运动，分解时按效果分；渡河最短时间看垂直分速度，最短位移看合速度方向","v":["求小船渡河最短时间","求渡河最短位移","绳связ物体的速度关系","求实际速度的大小和方向"],"q":[{"q":"河宽 60 m，水流速度 3 m/s，船在静水中速度 5 m/s。求渡河最短时间与此时的登陆点偏移。","s":["渡河时间只由垂直河岸的分速度决定：t = d/v⊥","要使 t 最短，船头应正对河岸，v⊥ = 5 m/s","t = 60/5 = 12 s","沿河岸方向被水流带走：x = v水 t = 3×12 = 36 m"],"a":"最短时间 12 s，登陆点向下游偏移 36 m","c":"过河时间与水流速度无关，只由船垂直河岸的分速度决定；这是最容易记混的一条","x":"若求最短位移，则要求合速度垂直河岸，船头须向上游偏，cosθ = 3/5，位移即河宽 60 m，但时间会变长"}]}],"有效值与峰值":[{"t":"有效值的定义与计算","f":"给出非正弦的交流电（方波、半波整流、分段恒定），求其有效值","k":"回到定义：让交流与直流在同一电阻上产生相同热量，这个直流值就是有效值","v":["方波交流电的有效值","半波整流的有效值","为什么不能用峰值除以根号二","有效值的定义式"],"q":[{"q":"某交流电的电流随时间变化：0–T/2 内为 2 A，T/2–T 内为 0。求该交流电的有效值。","s":["有效值按「同一电阻上产生相同热量」定义","一个周期内的热量 Q = I₁²R·(T/2) + 0 = 4R·(T/2) = 2RT","设有效值为 I，则 I²RT = 2RT","解得 I = √2 ≈ 1.41 A"],"a":"有效值约 1.41 A","c":"非正弦交流电必须回到热量相等的定义去算，绝不能直接拿峰值除以 √2","x":"用「平方的平均再开方」：i² 在一个周期内的平均值是 4/2 = 2，开方即 √2，一步到位"}]},{"t":"峰值、有效值与电表读数","f":"判断某物理量该用峰值还是有效值，如电容器耐压、电表读数、灯泡亮度","k":"耐压击穿看峰值，电表读数与功率热量看有效值，两者相差 √2 倍","v":["电容器耐压取哪个值","电压表读数是多少","灯泡会不会被击穿","峰值与有效值如何换算"],"q":[{"q":"交流电压 u = 220√2 sin(100πt) V 接在电容器两端，电容器的耐压值至少应为多少？电压表读数是多少？","s":["峰值 Um = 220√2 ≈ 311 V","电容器耐压看峰值，故至少应为 311 V","电压表测的是有效值，U = Um/√2 = 220 V","若误按有效值 220 V 选电容，峰值时就会被击穿"],"a":"耐压至少 311 V；电压表读数 220 V","c":"耐压、击穿看峰值；电表读数、功率、热量看有效值，这两类问题几乎每次考试都出现","x":"记住换算：峰值 = √2 × 有效值，220 V 对应 311 V，反向除以 1.414 即可"}]}],"机械振动":[{"t":"简谐运动的判定与回复力","f":"判断某运动是否为简谐运动，或求回复力、加速度随位移的变化","k":"判据只有一条：回复力与位移成正比且方向相反，F = −kx","v":["判断某运动是否简谐","求回复力与位移的关系","求最大加速度","证明竖直弹簧振子做简谐运动"],"q":[{"q":"劲度系数 100 N/m 的弹簧竖直悬挂质量 0.5 kg 的物块，求它偏离平衡位置 2 cm 时回复力与加速度的大小（g=10）。","s":["竖直弹簧振子的回复力仍为 F = −kx，x 从平衡位置算起","x = 0.02 m 时 F = 100×0.02 = 2 N，方向指向平衡位置","加速度 a = F/m = 2/0.5 = 4 m/s²","重力只改变平衡位置，不改变「回复力与位移成正比」这一结论"],"a":"回复力 2 N，加速度 4 m/s²，方向都指向平衡位置","c":"竖直振子的关键是「x 从平衡位置量起」，此时重力与弹簧原长弹力已经相互抵消","x":"等效法：把竖直振子看成「弹簧原长被拉长了 mg/k」的水平振子，周期与回复力公式完全不变"}]},{"t":"简谐运动的能量与振幅","f":"振子经过某位置时求动能、势能、总能量，或判断能量随位置的变化","k":"总能量 E = ½kA²，与振幅平方成正比；动能与势能相互转化，总和不变","v":["求振子的总能量","求某位置的动能","振幅加倍能量如何变","求最大速度"],"q":[{"q":"劲度系数 200 N/m 的弹簧振子振幅 0.1 m，质量 0.5 kg。求总能量、最大速度，以及位移 0.06 m 处的动能。","s":["总能量 E = ½kA² = ½×200×0.01 = 1 J","平衡位置动能最大：½mv² = 1，得 v = √(2/0.5) = 2 m/s","x = 0.06 m 时弹性势能 Ep = ½×200×0.0036 = 0.36 J","动能 Ek = 1 − 0.36 = 0.64 J"],"a":"总能量 1 J，最大速度 2 m/s，位移 0.06 m 处动能 0.64 J","c":"简谐运动能量守恒，任意位置都满足 Ek + Ep = ½kA²，缺哪个减一下就得到","x":"用比例快算：x/A = 0.6，Ep/E = (x/A)² = 0.36，故 Ek/E = 0.64，不用算 k 与 m"}]},{"t":"用参考圆处理简谐运动","f":"已知初位置与初速度方向，求振动方程、某时刻位移或到达某位置的最短时间","k":"把简谐运动看成匀速圆周运动在直径上的投影，相位就是圆心角，转一圈对应一个周期","v":["写出振动方程","求到某位置的最短时间","确定初相位","由参考圆判断速度方向"],"q":[{"q":"弹簧振子振幅 10 cm、周期 0.4 s，t=0 时物体在 x=5 cm 处向正方向运动。求振动方程与第一次到达 x=−10 cm 的时间。","s":["设 x = A sin(ωt + φ)，t=0 时 5 = 10 sinφ 且速度为正，故 φ = 30°","ω = 2π/T = 5π rad/s，振动方程为 x = 10sin(5πt + π/6) cm","到达 x = −10 cm 对应相位 270°，从 30° 转到 270° 共转过 240°","t = (240/360)×T = (2/3)×0.4 ≈ 0.267 s"],"a":"x = 10sin(5πt + π/6) cm；第一次到达 −10 cm 约需 0.267 s","c":"参考圆把「相位」变成「圆心角」，转过的角度除以 360° 再乘周期就是时间","x":"分段检验：从 +5 到 +10 用 60°（0.067 s），从 +10 到 −10 用半圈（0.2 s），合计 0.267 s，与整体法一致"}]}],"机械波":[{"t":"振动图像与波动图像的互推","f":"给出振动图像与波动图像之一，求波速、波长、周期，或判断某质点的振动方向","k":"振动图像是「一个质点随时间」，波动图像是「某一时刻所有质点」；波速 v = λ/T 是连接两者的唯一桥梁","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波速 2 m/s，波长 4 m，振幅 5 cm。求周期，并说明 t = 0 时位于 x = 0 处、正从平衡位置向上运动的质点的振动图像特征。","s":["由 v = λ/T 得 T = λ/v = 4/2 = 2 s","振幅 5 cm，周期 2 s，角频率 ω = 2π/T = π rad/s","t = 0 时位移为零、速度方向向上，故初相位为零","振动图像为 x = 5sin(πt) cm，从原点出发向上的一条正弦曲线"],"a":"T = 2 s；振动图像是从原点向上的正弦曲线，振幅 5 cm","c":"先由 v = λ/T 求周期，再由初位置与初速度定初相位，最后按振幅画图，三步固定","x":"判断质点振动方向用「上下坡法」：沿波传播方向看，上坡处质点向下、下坡处质点向上，比代公式快得多"}],"v":["由振动图求波长与波速","由波形图求周期","判断某质点的振动方向","两图结合求传播方向","区分振动图与波形图的横轴"]},{"t":"波的多解问题","f":"已知两时刻的波形（或某质点两时刻的位置），求波速、波长、周期的可能值","k":"波传播的距离 Δx = nλ + Δx₀（n = 0,1,2…），v = Δx/Δt；多解来自时间的周期性与传播方向的不确定","q":[{"q":"一列简谐横波的波长 4 m，t = 0 与 t = 0.5 s 时的波形完全相同。求可能的波速。","s":["波形相同说明经过的时间是周期的整数倍：Δt = nT","T = Δt/n = 0.5/n","v = λ/T = 4n/0.5 = 8n m/s","取 n = 1,2,3… 得 8、16、24 m/s…"],"a":"v = 8n m/s（n = 1,2,3…）","c":"多解题必须写出含 n 的通式再取整数，漏掉 n 就是漏解；若传播方向不确定，还要再加一组反向的解","x":"直接记 v = nλ/Δt：本题 v = n×4/0.5 = 8n，一步写出全部可能值"}],"v":["求波速的可能值","求波长的可能值","求周期的可能值","传播方向未知造成的多解","时间与周期倍数关系造成的多解"]},{"t":"波的传播方向与质点振动方向的互判","f":"已知波的传播方向判断某质点的振动方向，或由质点振动方向反推传播方向","k":"同侧法：在波形图上，质点振动方向与波的传播方向位于波形线的同一侧；相距 nλ 的两质点步调相同，相距 (n+½)λ 的步调相反","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波长 4 m。某时刻 x = 1 m 处的质点恰好经过平衡位置向上运动，求此刻 x = 3 m 处质点的振动方向。","s":["x = 3 m 与 x = 1 m 相差 2 m","2 m 恰好是半个波长（λ/2 = 2 m）","相距半波长的两质点振动步调完全相反","x = 1 m 处向上运动，故 x = 3 m 处向下运动"],"a":"向下运动","c":"「相距 nλ 步调相同、相距 (n+½)λ 步调相反」是判断振动方向最快的依据，比逐个平移波形省时","x":"同侧法：沿波的传播方向看，质点振动方向与波形「下坡」同侧，一眼定方向"}],"v":["已知传播方向判断振动方向","由振动方向反推传播方向","用「上下坡法」判断","用「同侧法」判断","用波形平移法判断方向"]}],"机械能守恒":[{"t":"机械能守恒的判断与计算","f":"判断系统机械能是否守恒，或求某位置的速度、高度","k":"判据只有一条：是否只有重力（或弹簧弹力）做功。有摩擦、有外力做功、绳突然绷直，都不守恒","q":[{"q":"长 L 的轻绳一端固定，另一端系质量 m 的小球，把球拉到水平位置由静止释放。求球到最低点时的速度与绳的张力。","s":["只有重力做功，机械能守恒：mgL = ½mv²","v = √(2gL)","最低点：T − mg = mv²/L","T = mg + 2mg = 3mg"],"a":"v = √(2gL)，T = 3mg","c":"圆周与能量结合的定式：先用机械能守恒求速度，再沿半径写向心力方程求力","x":"记住「从水平位置释放到最低点，绳张力恒为 3mg」这个结论，与 L、m 无关，选择题可直接用"}],"v":["判断系统机械能是否守恒","求某位置的速度","求上升的最大高度","有摩擦时改用能量守恒","单个物体与系统的区别"]},{"t":"连接体的机械能守恒","f":"两物体用绳跨过滑轮连接，一个下降一个上升，求速度或加速度","k":"把两个物体当成一个系统：绳张力是内力、对系统不做总功，只有重力做功，故系统机械能守恒","q":[{"q":"质量 2 kg 与 3 kg 的两物体用轻绳跨过定滑轮连接，从静止释放。求 3 kg 物体下降 0.5 m 时的速度（g 取 10 m/s²）。","s":["系统机械能守恒：(m₂ − m₁)gh = ½(m₁ + m₂)v²","重力势能减少量 = (3 − 2)×10×0.5 = 5 J","5 = ½×5×v²，得 v² = 2","v = √2 ≈ 1.41 m/s"],"a":"约 1.41 m/s","c":"连接体用「系统」机械能守恒：势能变化只看高度差，动能是总质量乘共同速率","x":"也可用牛顿定律：a = (m₂−m₁)g/(m₁+m₂) = 2 m/s²，再由 v² = 2ah = 2 得 v = √2，两条路完全等价"}],"v":["滑轮两侧物体速度大小相同","求某时刻的速度","求系统的加速度","用 ΔEp 减少量等于 ΔEk 增加量","绳的张力不做功"]},{"t":"含弹簧的机械能守恒","f":"物块落到弹簧上、弹簧与物块组成的系统，求最大压缩量或最大速度的位置","k":"系统（物块 + 弹簧 + 地球）机械能守恒；速度最大时加速度为零，即弹力等于重力","q":[{"q":"质量 m 的物块从高 h 处自由下落，落到竖直放置的弹簧上（劲度系数 k）。求弹簧的最大压缩量 x（不计空气阻力）。","s":["从释放到压缩最短，只有重力与弹力做功，系统机械能守恒","以最低点为零势能面：初态动能 0、重力势能 mg(h+x)","末态动能 0、弹性势能 ½kx²","mg(h+x) = ½kx²，整理得 kx² − 2mgx − 2mgh = 0","取正根 x = [mg + √(m²g² + 2kmgh)]/k"],"a":"x = [mg + √(m²g² + 2kmgh)]/k","c":"关键是「零势能面选在最低点」，让初态重力势能写成 mg(h+x)；写成 mgh 就会漏掉压缩那一段","x":"注意速度最大处不是压缩最短处：速度最大时 kx = mg，即 x = mg/k，这是选择题的常考点"}],"v":["求弹簧的最大压缩量","求最大速度出现的位置","求某点的速度","弹性势能与动能的转化","弹簧原长处的速度最大"]}],"机械能守恒定律":[{"t":"机械能守恒的判断","f":"给出若干运动过程，判断机械能是否守恒，或说明守恒的理由","k":"只看做功的力：只有重力或弹力做功才守恒，有其他力做正功或负功都不守恒","v":["判断某过程机械能是否守恒","说明机械能守恒的理由","匀速运动是否一定守恒","摩擦生热时能量去哪了"],"q":[{"q":"下列过程机械能守恒的是：A 物体沿粗糙斜面下滑；B 物体在拉力作用下匀速上升；C 小球自由下落；D 物体沿光滑曲面下滑。","s":["判断标准只有一条：除重力（或弹力）外，还有没有别的力做功","A 有摩擦力做负功，机械能减少，不守恒","B 拉力做正功，动能不变而重力势能增加，机械能增加，不守恒","C 只有重力做功，守恒；D 支持力始终垂直于速度不做功，只有重力做功，守恒"],"a":"C 和 D 机械能守恒","c":"守恒与「匀速」「直线」都无关，只看做功的力有哪几个 定律":[{"t":"伏安特性曲线与非线性电阻","f":"由 U-I 图线求电阻、功率，或判断电阻随温度（电压）的变化趋势","k":"线性元件的图线斜率就是 R；非线性元件某点的电阻只能用该点的 U/I，绝不能用切线斜率","q":[{"q":"某小灯泡的 U-I 图线为曲线，当电压为 6 V 时电流为 0.5 A。求此时灯丝的电阻与功率，并说明电压升高时电阻如何变化。","s":["R = U/I = 6/0.5 = 12 Ω","P = UI = 6×0.5 = 3 W","不能用切线斜率求 R，那是动态电阻，不等于工作点电阻","灯丝温度随电压升高而升高，电阻增大，图线向电压轴弯曲"],"a":"R = 12 Ω，P = 3 W；电压升高电阻增大","c":"非线性元件的电阻定义始终是 R = U/I（工作点电阻），切线斜率是动态电阻，两者含义不同","x":"看图判断趋势：图线越来越陡（斜率增大）说明电阻在增大，越来越平说明电阻在减小"}],"v":["由 U-I 图求某点电阻","求某电压下的功率","判断电阻随温度的变化","图线与电源线的交点即工作点","小灯泡的电阻不是定值"]},{"t":"电阻定律与形变问题","f":"导线被拉长、对折、均匀压缩后求电阻变化，或求电阻率与温度的关系","k":"R = ρL/S；拉伸时体积不变，L 变为 n 倍则 S 变为 1/n，电阻变为 n² 倍","q":[{"q":"把一根均匀导线拉长到原来的 2 倍，其电阻变为原来的多少倍？若把它对折成两股，电阻又是多少？","s":["拉长时体积不变：L·S = L′·S′","L′ = 2L，故 S′ = S/2","R′ = ρ(2L)/(S/2) = 4ρL/S = 4R","对折后长度减半、横截面积加倍，R″ = R/4"],"a":"拉长为 2 倍时电阻变为 4 倍；对折后变为 1/4","c":"凡「拉长/对折」必用「体积不变」这一条，否则会误以为只有 L 变、S 不变","x":"记 R ∝ L²/V（体积不变时）：拉长 n 倍 → n² 倍；对折相当于长度减半、面积加倍 → 1/4 倍"}],"v":["导线拉长后电阻如何变","对折后电阻如何变","均匀压缩后的电阻","电阻率与温度的关系","体积不变时 R 与 L² 成正比"]},{"t":"电流的微观表达式","f":"由自由电子数密度、导线截面积与定向移动速率求电流，或比较不同导线的漂移速度","k":"I = nqSv，n 是单位体积自由电荷数，v 是定向移动速率","q":[{"q":"铜导线截面积 1 mm²，自由电子数密度 8.5×10²⁸ m⁻³，电子定向移动速率 7.4×10⁻⁵ m/s。求导线中的电流（e = 1.6×10⁻¹⁹ C）。","s":["I = nqSv","S = 1 mm² = 1×10⁻⁶ m²","I = 8.5×10²⁸ × 1.6×10⁻¹⁹ × 1×10⁻⁶ × 7.4×10⁻⁵","= 8.5×1.6×7.4 × 10^(28−19−6−5) ≈ 100 × 10⁻²","≈ 1.0 A"],"a":"约 1.0 A","c":"自由电子的定向移动速率极小（10⁻⁵ m/s 量级），但电流可以很大，因为电子数密度极大——这一点常被误判","x":"全部换成国际单位再乘，特别注意 mm² = 10⁻⁶ m²"}],"v":["由 n、S、v 求电流","比较不同导线的漂移速度","用 I = nqSv 计算","串联时漂移速度不同","漂移速度为什么很小"]}],"气体固体和液体":[{"t":"封闭气体压强的求解","f":"给出水银柱、活塞、气缸等封闭装置，求被封闭气体的压强","k":"以液柱或活塞为研究对象列平衡方程，液柱在气体上方则加、下方则减","v":["求水银柱封闭的气体压强","活塞封闭的气体压强","玻璃管倾斜后压强如何变","大气压与液柱压强如何叠加"],"q":[{"q":"一端封闭的玻璃管竖直放置，管内水银柱长 10 cm，封闭端在上，大气压 76 cmHg。求封闭气体的压强；若把玻璃管倒置（封闭端在下）又如何？","s":["取水银柱为研究对象，它受向下的重力、上方气体压力、下方大气压力","封闭端在上时：p气 = p₀ + ρgh = 76 + 10 = 86 cmHg","倒置后水银柱上方变为大气：p气 + ρgh = p₀，故 p气 = 76 − 10 = 66 cmHg","关键是先判断水银柱的上方是气体还是大气"],"a":"封闭端在上时 86 cmHg；倒置后 66 cmHg","c":"求封闭气体压强一律「以液柱为研究对象」列平衡方程，再换算成压强单位","x":"记口诀：液柱压在气体上方就加，气体顶着液柱就减；先画图标出各段再动笔"}]},{"t":"气体实验定律的综合应用","f":"气体经历两个或三个连续过程，求末状态参量或判断中间状态","k":"一段一段用相应定律，每段只变一个量；也可用 pV/T = 常量一步跨过中间状态","v":["等压后等容求末态压强","多过程问题的分段处理","用 pV/T 常量一步求解","判断每段是什么变化"],"q":[{"q":"一定质量的理想气体从状态 A（2×10⁵ Pa、1 L、300 K）等压膨胀到 2 L，再等容降温回 300 K。求末态压强。","s":["A→B 等压：V/T 为常量，体积加倍则温度加倍，T_B = 600 K","B→C 等容：p/T 为常量，温度由 600 K 降到 300 K，减半","p_C = 2×10⁵×(300/600) = 1×10⁵ Pa","核对：A 与 C 的 pV/T 都是 2×10⁵×1/300 ≈ 667，一致"],"a":"末态压强为 1×10⁵ Pa","c":"多过程题一段一段来，每段只允许一个参量不变，标清「谁不变」就不会用错定律","x":"用 pV/T = 常量一步跨：p_C = p_A V_A T_C/(V_C T_A) = 2×10⁵×1×300/(2×300) = 1×10⁵ Pa"}]},{"t":"固体、液体与气体的性质对比","f":"比较三态的宏观性质与微观结构，判断晶体、非晶体、液体的特征","k":"固体有固定形状和体积，液体有固定体积无固定形状，气体都没有；差别源于分子间距与作用力","v":["晶体与非晶体的区别","液体为什么有固定体积","三态的微观差别","多晶体是否各向异性"],"q":[{"q":"比较晶体、非晶体与液体在结构、各向异性与熔点上的差别。","s":["晶体有规则的点阵结构，非晶体没有","单晶体表现各向异性，多晶体与非晶体各向同性","晶体有确定的熔点，非晶体没有确定熔点、逐渐软化","液体介于两者之间：短程有序、长程无序，有确定体积但无确定形状"],"a":"晶体有序、有熔点（单晶各向异性）；非晶体无序、无熔点；液体短程有序","c":"判据三条：有无规则结构、有无确定熔点、是否各向异性","x":"记住「单晶各向异性、多晶各向同性」这一对，这是选择题最爱设的坑"}]}],"气体定律":[{"t":"气体状态变化的图像判断","f":"由 p-V、p-T、V-T 图像判断过程性质，或比较不同状态的参量","k":"p-V 图等温线是双曲线、p-T 与 V-T 图的等容/等压线都是过原点的直线，看形状即可定过程","q":[{"q":"一定质量的理想气体在 p-V 图中沿一条双曲线从 A 到 B，体积增大为原来的 2 倍。求压强变化与温度变化，并说明能量转化。","s":["双曲线对应等温过程：pV = 常量","体积加倍，压强减半","温度保持不变，故内能不变","气体对外做功，由 ΔU = Q + W 知必须吸收等量的热量"],"a":"压强减半，温度不变，内能不变，气体吸热且全部用于对外做功","c":"先由图像形状定过程类型（等温/等容/等压），再选定律，最后用第一定律分析能量，三步不能乱","x":"记三条图线形状：p-V 是双曲线、p-T 与 V-T 都过原点。形状一认，过程就定了"}],"v":["由 p-V 图判断过程性质","由 p-T 图判断过程","由 V-T 图判断过程","比较不同状态的参量","图像上某点的意义"]},{"t":"变质量问题：充气与抽气","f":"充气、抽气、气体分装等质量发生变化的问题","k":"把「容器 + 气筒」看成一个整体，总 pV 保持不变（等温），一次列式即可","q":[{"q":"容积 20 L 的钢瓶内气体压强为 10 atm。用容积 5 L 的抽气筒抽气一次（温度不变），求瓶内剩余气体的压强。","s":["抽气前总 pV = 10×20 = 200 atm·L","抽气后气体分布在 20 L 的瓶与 5 L 的筒中","p₂ × (20+5) = 200","p₂ = 8 atm"],"a":"8 atm","c":"抽气问题的关键是把「瓶 + 筒」当成一个整体，体积相加、pV 乘积不变","x":"用比例速算：p₂ = p₁V₁/(V₁+V筒)，抽 n 次则为 p₁[V₁/(V₁+V筒)]ⁿ，一步出结果"}],"v":["充气后压强如何变化","抽气若干次后的压强","气体分装问题","把变质量转化为定质量处理","选取合适的研究对象"]},{"t":"循环过程的多过程分析","f":"由 p-V 图判断循环中各阶段的吸放热与做功，或求一个循环的净功与净吸热","k":"循环回到初态则 ΔU = 0，净功等于 p-V 图围成的面积（顺时针为正），再由第一定律分配 Q","q":[{"q":"1 mol 理想气体经 A→B→C→A 顺时针循环，p-V 图围成面积 200 J。求整个循环气体对外做的净功与净吸热。","s":["循环回到初态，内能变化 ΔU = 0","p-V 图围成的面积即净功，顺时针表示气体对外做正功","W对外 = 200 J","由 ΔU = Q − W对外 得 Q = 200 J，即净吸热 200 J"],"a":"净功 200 J，净吸热 200 J","c":"循环题三句话：ΔU = 0、净功 = 面积、Q = W对外；逆时针则三者全部取负","x":"先判方向（顺正逆负），再算面积，最后用第一定律配 Q，不必逐段计算"}],"v":["判断各阶段是吸热还是放热","求一个循环的净功","求整个循环的净吸热","顺时针与逆时针的区别","各段内能变化之和为零"]}],"法拉第电磁感应定律":[{"t":"平均电动势与瞬时电动势","f":"求一段时间内的平均感应电动势、某一时刻的瞬时电动势，或由图像求电动势","k":"E = nΔΦ/Δt 只能求平均值，E = BLv 求瞬时值；Φ-t 图线的斜率就是瞬时电动势","q":[{"q":"面积 0.1 m² 的 100 匝线圈，磁感应强度在 0.2 s 内由 0.1 T 均匀增大到 0.5 T。求这段时间内的平均感应电动势。","s":["ΔΦ = ΔB·S = (0.5−0.1)×0.1 = 0.04 Wb","E = nΔΦ/Δt = 100×0.04/0.2","= 4/0.2 = 20 V","若求某一时刻的瞬时值，需用 E = BLv 或对 Φ-t 图求斜率"],"a":"20 V","c":"平均与瞬时的区别是本节最大的坑：ΔΦ/Δt 只能求平均，求瞬时必须用斜率或 BLv","x":"匝数 n 是最常见的漏项：题干里的「100 匝」几乎必然要用到，先圈出来"}],"v":["求一段时间内的平均电动势","求某时刻的瞬时电动势","由图像求电动势","E = nΔΦ/Δt 与 E = BLv 的区别","平均值的用法"]},{"t":"感应电荷量与图像问题","f":"求通过导线截面的电荷量，或由 B-t、Φ-t 图像判断电动势的变化","k":"q = nΔΦ/R，与时间无关，只与磁通量的变化量有关；E 的大小等于 Φ-t 图线的斜率","q":[{"q":"电阻 0.5 Ω 的 100 匝线圈，穿过它的磁通量在 0.1 s 内增加了 0.02 Wb。求通过导线截面的电荷量。","s":["由 q = It，I = E/R，E = nΔΦ/Δt 联立","得 q = nΔΦ/R","= 100×0.02/0.5","= 4 C，与所用时间 0.1 s 无关"],"a":"4 C","c":"q = nΔΦ/R 中不含 Δt，这是它与电动势公式最大的区别：时间长短不影响总电荷量","x":"忘了公式就现推：q = It = (E/R)t = (nΔΦ/Δt/R)Δt = nΔΦ/R，三行推出，不必硬记"}],"v":["求通过截面的电荷量","由 B-t 图判断电动势变化","由 Φ-t 图求电动势","q 与时间无关只与 ΔΦ 有关","图像斜率的含义"]},{"t":"感生电动势与动生电动势","f":"判断电动势的来源，或分别计算两种情形下的电动势","k":"感生：磁场变化产生涡旋电场，E = nΔΦ/Δt；动生：导体切割磁感线，E = BLv","q":[{"q":"一个 100 匝的线圈静止在均匀变化的磁场中，磁感应强度每秒增加 0.2 T，线圈面积 0.5 m²。求感应电动势。","s":["导体不动、磁场变化，属于感生电动势","ΔΦ/Δt = S·ΔB/Δt = 0.5×0.2 = 0.1 Wb/s","E = nΔΦ/Δt = 100×0.1","= 10 V"],"a":"10 V","c":"分清两类：导体不动、磁场变 → 感生（用法拉第定律）；磁场不变、导体动 → 动生（用 E = BLv）","x":"感生题直接算 S·ΔB/Δt 再乘匝数，不必管导体在哪里"}],"v":["判断电动势的来源","分别计算两种电动势","感生靠涡旋电场","动生靠洛伦兹力","两种情形叠加时的总电动势"]}],"波动图像":[{"t":"波动图像的读法与质点振动方向","f":"由波形图求波长、振幅，判断某质点的振动方向、加速度方向，或求一段时间内的路程","k":"波形图横轴是位置、纵轴是位移；质点振动方向用「上下坡法」判断：沿传播方向看，上坡处向下、下坡处向上","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波形图上 A 点位于波峰，B 点位于平衡位置且在 A 的右侧。判断 B 点的振动方向。","s":["波沿 +x 方向传播，B 位于 A（波峰）的右侧，处在下坡段","用上下坡法：沿传播方向看，下坡处的质点向上运动","故 B 点此刻向上振动","用微平移法校验：把波形沿 +x 平移一小段，B 处新波形在原波形上方，同样说明向上"],"a":"B 点向上振动","c":"上下坡法口诀：沿波传播方向看，「上坡向下、下坡向上」，一秒钟判定，不必列方程","x":"波形微平移最直观：整条波形沿传播方向平移一点点，同一横坐标处新波形在原波形上方 → 质点向上，下方 → 向下"}],"v":["由波形图求波长与振幅","判断某质点的振动方向","判断加速度方向","求一段时间内的路程","求某质点的位移"]},{"t":"波的叠加与干涉加强点","f":"两列相干波相遇，判断加强点与减弱点的位置与个数","k":"加强条件：到两波源的路程差为波长整数倍；减弱条件：为半波长的奇数倍","q":[{"q":"两个同相振动的相干波源相距 5 m，波长 2 m。求两波源连线上振动加强点的个数。","s":["加强条件：|Δr| = nλ = 2n（n = 0,1,2…）","连线上任一点到两波源的距离差范围为 0 到 5 m","由 2n ≤ 5 得 n = 0,1,2","n = 0 对应中点 1 个，n = 1、2 各对应对称的 2 个，共 5 个"],"a":"5 个加强点","c":"三步定式：写加强条件 → 由几何范围定 n 的取值范围 → 数点。n = 0 只对应一个点，是最常见的漏算处","x":"用对称性数点：加强点关于中点对称，中点 1 个 + 两侧各 2 个 = 5 个，不必逐个求坐标"}],"v":["判断加强点与减弱点","求加强点的个数","波程差为波长整数倍加强","两波源连线上的加强点","干涉图样的稳定性"]},{"t":"波速、波长与频率的关系","f":"由波形图与传播时间求波速，或判断波跨介质传播时哪个量不变","k":"v = λf = λ/T；波从一种介质进入另一种介质时频率不变，波速与波长都随之改变","q":[{"q":"一列波的频率为 50 Hz、波长为 4 m。求波速；若该波进入另一介质后波速变为 100 m/s，求新介质中的波长。","s":["v = λf = 4×50 = 200 m/s","频率由波源决定，进入新介质后不变，仍为 50 Hz","新波长 λ′ = v′/f = 100/50 = 2 m","波长变短，说明新介质中波速更小"],"a":"原波速 200 m/s；新介质中波长 2 m","c":"「频率不变」是跨介质问题的唯一锚点：波速和波长都变，只有频率死守不变","x":"记 v = λf 三量关系，已知两个求第三个；跨介质时先锁定 f 再算 λ"}],"v":["由波形图与传播时间求波速","求波长或频率","波跨介质时频率不变","波速由介质决定","v = λf 的应用"]}],"波的干涉与衍射":[{"t":"振动加强点与减弱点的判断","f":"两相干波源同相位振动，判断连线上（或空间中）哪些点是加强点、哪些是减弱点","k":"看路程差：Δs = nλ 加强，Δs = (2n+1)λ/2 减弱；先定 Δs 的取值范围再数 n","v":["连线上加强点有几个","判断某点是加强还是减弱","求减弱点的位置","两波源反相位时条件如何变"],"q":[{"q":"两相干波源相距 1.2 m、同相位振动，波长 0.4 m。求两波源连线上加强点与减弱点的个数。","s":["连线上任一点到两波源的路程差满足 0 ≤ Δs ≤ 1.2 m","加强条件 Δs = nλ = 0.4n，n = 0,1,2,3，得 0、0.4、0.8、1.2 m，共 4 个","减弱条件 Δs = (2n+1)λ/2 = 0.2(2n+1)，得 0.2、0.6、1.0 m，共 3 个","注意 0 与 1.2 m 是两波源所在位置，题意要求连线内部时要去掉"],"a":"加强点 4 个（含端点），减弱点 3 个","c":"路程差的范围由两波源间距决定，把范围写出来再数 n 的取值，不会多数也不会漏数","x":"画图数区间：加强点把连线分成 n 段等长的区间，区间数即加强点数，比代数更快"}]},{"t":"衍射现象的解释","f":"判断某障碍物或小孔能否使波发生明显衍射，并解释生活中的衍射现象","k":"障碍物或孔的尺寸与波长差不多、或比波长更小时，衍射才明显；比波长大得多时衍射可忽略","v":["判断能否发生明显衍射","为什么听得到墙后的声音","孔变小时衍射如何变化","衍射与干涉的区别"],"q":[{"q":"声波波长约 1 m，可见光波长约 5×10⁻⁷ m。为什么能听到墙后的声音，却看不到墙后的人？","s":["明显衍射的条件：障碍物尺寸与波长差不多或更小","墙的尺寸（米量级）与声波波长（约 1 m）相当，声波能绕过墙发生明显衍射","可见光波长 5×10⁻⁷ m，远小于墙的尺寸，衍射极不明显，光近似沿直线传播","故能闻其声而不能见其人"],"a":"声波波长大、衍射明显；光波波长极小，衍射可忽略","c":"判断衍射是否明显只比一个量：波长与障碍物（或孔）的尺寸","x":"记数量级：声波 10⁰ m、光波 10⁻⁷ m，与米级障碍物一比，答案立刻分明"}]}],"波的形成与传播":[{"t":"波的形成与质点运动","f":"判断波传播时各质点的振动方向、起振方向，以及质点是否随波迁移","k":"质点只在平衡位置附近振动、不随波迁移；各质点的起振方向都与波源的起振方向相同","v":["质点是否随波迁移","判断各质点的起振方向","波源停止后质点如何运动","波传播的是能量还是物质"],"q":[{"q":"一列横波沿 x 轴正方向传播，波源开始向上振动。求 x=4 m 处质点开始振动的方向；波传过后该质点的位移如何变化？","s":["介质中每个质点的起振方向都与波源的起振方向相同","波源开始向上振动，故 x=4 m 处质点的起振方向也向上","质点只在平衡位置附近上下振动，不随波向 x 正方向迁移","波传过后该质点做与波源同频率的振动，位移随时间按正弦规律变化"],"a":"起振方向向上；质点不迁移，只在平衡位置附近振动","c":"「起振方向与波源相同」「质点不随波迁移」是波的形成两句话，几乎每道题都要用","x":"用「排队传话」类比：每个人只在自己位置上下动作，动作沿队列传下去，人本身不移动"}]},{"t":"波速、频率与波长的关系","f":"波从一种介质进入另一种介质，判断波速、频率、波长如何变化","k":"频率由波源决定、跨介质不变；波速由介质决定；波长 λ = v/f 随波速同比例变化","v":["波从空气进入水中各量如何变","波速由什么决定","频率为什么不改变","由波速和频率求波长"],"q":[{"q":"声波在空气中速度 340 m/s、频率 680 Hz，进入水中速度变为 1360 m/s。求空气中与水中的波长。","s":["空气中 λ = v/f = 340/680 = 0.5 m","进入水中频率由波源决定，保持不变，仍为 680 Hz","水中 λ = 1360/680 = 2 m","波长变为原来的 4 倍，与波速同比例变化"],"a":"空气中波长 0.5 m，水中 2 m，频率始终为 680 Hz","c":"三句话定住所有跨介质问题：频率看波源、波速看介质、波长跟着波速变","x":"用比例：f 不变时 λ ∝ v，波速变 4 倍波长也变 4 倍，不必分别代入"}]}],"洛伦兹力":[{"t":"洛伦兹力的大小与方向","f":"求洛伦兹力大小与方向，判断粒子偏转方向或轨迹半径","k":"F = qvB sinθ，方向用左手定则（负电荷四指指向速度反方向）；洛伦兹力永远垂直于速度","q":[{"q":"电子以 2×10⁶ m/s 垂直射入 0.5 T 的匀强磁场。求洛伦兹力大小与轨迹半径（m = 9.1×10⁻³¹ kg，e = 1.6×10⁻¹⁹ C）。","s":["F = evB = 1.6×10⁻¹⁹ × 2×10⁶ × 0.5 = 1.6×10⁻¹³ N","洛伦兹力提供向心力：evB = mv²/r","r = mv/(eB) = 9.1×10⁻³¹ × 2×10⁶ ÷ (1.6×10⁻¹⁹ × 0.5)","r ≈ 2.3×10⁻⁵ m"],"a":"F = 1.6×10⁻¹³ N，r ≈ 2.3×10⁻⁵ m","c":"半径公式 r = mv/(qB) 与周期公式 T = 2πm/(qB) 必须背熟，后者与速率无关是常考点","x":"先求 r 再求 F 更省力：F = mv²/r，只代一次数量级，避免两次浮点运算出错"}],"v":["求洛伦兹力的大小","用左手定则判断方向","判断粒子的偏转方向","求圆周运动的轨迹半径","速度与磁场平行时不受力"]},{"t":"洛伦兹力不做功的含义","f":"判断洛伦兹力是否做功，粒子速率、动能是否变化，或辨析「磁场能否加速粒子」","k":"洛伦兹力始终垂直于速度，瞬时功率恒为零，一个周期内做功也为零，故速率与动能都不变","q":[{"q":"带电粒子在匀强磁场中做匀速圆周运动，洛伦兹力是否改变粒子的动能？若同时存在电场呢？","s":["洛伦兹力方向始终垂直于速度，瞬时功率 P = Fv cos90° = 0","整个运动过程中做功为零，动能保持不变","若同时存在电场，电场力做功，动能会改变","结论：磁场只改方向，电场才改速率"],"a":"洛伦兹力不改变动能；加入电场后动能会改变","c":"「洛伦兹力不做功」是处理磁场中粒子问题的基本前提，可用它直接排除「磁场使粒子加速」的选项","x":"能量判据最快：题中若出现「磁场使粒子加速」，一定是错的；出现「电场加速、磁场偏转」才是标准模型"}],"v":["判断洛伦兹力是否做功","粒子的速率是否变化","磁场能否加速粒子","动能为什么不变","洛伦兹力只改变速度方向"]},{"t":"速度选择器与复合场","f":"粒子在正交的电场与磁场中做直线运动，求能通过的速度条件","k":"电场力与洛伦兹力平衡时粒子做匀速直线运动：qE = qvB，得 v = E/B，与电荷量、质量无关","q":[{"q":"正交的匀强电场 E = 2×10⁴ V/m 与匀强磁场 B = 0.1 T。求能沿直线通过该区域的粒子速度。","s":["粒子做直线运动，说明电场力与洛伦兹力平衡","qE = qvB，电荷量约掉","v = E/B = 2×10⁴/0.1 = 2×10⁵ m/s","该结果与粒子的电荷量、质量都无关"],"a":"2×10⁵ m/s","c":"速度选择器的结论 v = E/B 与 q、m 无关——这是判断「不同粒子能否通过」类选项的关键","x":"直接 v = E/B 代入即可；前提是电场力与洛伦兹力方向相反，否则不可能平衡"}],"v":["求能通过的速度 v = E/B","判断不同粒子能否通过","电场力与洛伦兹力平衡","改变电场或磁场后的结果","与质谱仪的结合"]}],"液体与表面张力":[{"t":"表面张力的方向与效果","f":"解释水滴呈球形、液面像薄膜等现象，判断表面张力的方向","k":"表面张力沿液面切线、垂直于分界线，效果是使液面收缩到面积最小","v":["小水滴为什么呈球形","表面张力的方向","液面为什么像绷紧的膜","表面张力与哪些因素有关"],"q":[{"q":"为什么小水滴在失重或自由下落时呈球形？表面张力的方向如何？","s":["表面层分子间距大于液体内部，分子间作用表现为引力","这些引力使液面像一张绷紧的膜，总有收缩到最小的趋势","相同体积下球的表面积最小，故小水滴趋于球形","表面张力方向沿液面切线，与分界线垂直"],"a":"表面张力使液面收缩，球形表面积最小，故呈球形","c":"表面张力的方向一定「沿液面切线、垂直于分界线」，不是指向液体内部","x":"用「绷紧的橡皮膜」类比：膜总想缩到最小面积，球形正是体积一定时最小的面"}]},{"t":"浸润、不浸润与毛细现象","f":"判断液体在管中上升还是下降，或解释毛细现象与管径的关系","k":"附着力大于内聚力则浸润、液面凹、上升；反之不浸润、液面凸、下降；管越细现象越明显","v":["浸润液体为什么上升","不浸润液体为什么下降","管径对上升高度的影响","水银在玻璃管中为何下降"],"q":[{"q":"浸润液体在细管中上升、不浸润液体在细管中下降，为什么？管越细现象为什么越明显？","s":["浸润时液体与管壁的附着力大于液体内部分子间的内聚力，液面呈凹形","表面张力沿液面切线向上拉，产生向上的附加压强，把液体往上带","不浸润时液面呈凸形，表面张力方向相反，液体被压低","管越细，液面曲率越大，附加压强越大，上升或下降越明显"],"a":"由附着力与内聚力的相对大小决定；管越细曲率越大，现象越明显","c":"判断上升还是下降只看「浸润与否」，判断幅度大小只看「管的粗细」","x":"从能量看：浸润使液固接触面积增大、总表面能降低，所以液体自发上升"}]}],"激光":[{"t":"激光的三大特性与应用","f":"给出具体应用（测距、通信、手术、切割），判断利用了激光的哪个特性","k":"平行度好对应准直与测距，相干性好对应通信与全息，亮度高对应切割与手术","v":["激光为什么能用于测距","相干性的应用","激光切割为什么精度高","激光与普通光的区别"],"q":[{"q":"激光测距、光纤通信、激光手术分别利用了激光的什么特性？","s":["激光平行度好、发散角极小，可射到很远仍保持细光束，故用于测距与准直","激光相干性好，可作为理想的相干光源，故用于光纤通信与全息照相","激光亮度高、能量高度集中，故用于切割、焊接与手术","三者分别对应平行度、相干性、亮度"],"a":"测距→平行度好；通信→相干性好；手术→亮度高","c":"记住三个特性，再想每个应用「需要什么」，一一对应即可","x":"反过来推：要射得远就需平行，要传信息就需相干，要破坏组织就需高能量"}]},{"t":"激光的产生与粒子数反转","f":"考查受激辐射、粒子数反转的概念，判断关于激光产生条件的说法","k":"激光由受激辐射产生，前提是实现粒子数反转，使受激辐射占优势从而光被放大","v":["激光产生的原理","什么是粒子数反转","受激辐射与自发辐射的区别","激光为什么单色性好"],"q":[{"q":"为什么必须实现粒子数反转才能产生激光？","s":["常温下低能级粒子数远多于高能级，光通过时吸收过程多于辐射过程","粒子数反转使高能级粒子数多于低能级，受激辐射占优势","受激辐射产生的光子与入射光子的频率、相位、方向完全相同","故光在介质中不断被放大且高度一致，形成激光"],"a":"只有粒子数反转才能让受激辐射占优势，实现光的放大","c":"这条链要能顺下来：粒子数反转 → 受激辐射占优 → 光放大 → 激光","x":"用「人多势众」理解：高能级粒子多，辐射事件就多，光越走越强"}]}],"热力学定律":[{"t":"第一定律的符号规则","f":"判断 ΔU、Q、W 的正负，或由其中两个量求第三个","k":"ΔU = Q + W；吸热 Q 取正、放热取负，外界对气体做功 W 取正、气体对外做功取负","q":[{"q":"气体吸收 500 J 的热量，同时对外做功 200 J。求内能的变化。","s":["吸热：Q = +500 J","对外做功：W = −200 J","ΔU = Q + W = 500 − 200","ΔU = 300 J，内能增加"],"a":"内能增加 300 J","c":"符号规则只有一句：吸热为正、外界对气体做功为正。写式子前先把 Q、W 的符号定死","x":"用「收支」理解：吸热是收入、对外做功是支出，ΔU 就是净收入，正负自然清楚"}],"v":["判断 ΔU 的正负","判断 Q 的正负","判断 W 的正负","由其中两个量求第三个","吸热与对外做功的符号"]},{"t":"热力学第二定律与效率","f":"判断某过程能否自发进行、热机效率能否达到 100%、是否违反第二定律","k":"开尔文表述：不可能从单一热源吸热全部变功而不引起其他变化；一切热机效率必小于 1","q":[{"q":"某热机从高温热源吸热 1000 J，对外做功 400 J，其余热量排向低温热源。是否违反热力学第二定律？","s":["效率 = 400/1000 = 40%","效率小于 100%，说明没有把吸收的热量全部变成功","剩余 600 J 排向低温热源，符合实际热机的运行方式","故不违反第二定律"],"a":"不违反，效率 40% 小于 100%","c":"第二定律禁止的是「效率 100%」和「热量自发从低温到高温」，并不禁止一切热传递与热机","x":"一句话判据：只要存在低温热源、效率小于 1，就一定不违反第二定律"}],"v":["判断某过程能否自发进行","效率能否达到 100%","是否违反第二定律","两种表述的等价性","第二类永动机为什么不可能"]},{"t":"内能、热量、温度三者的关系辨析","f":"判断温度、内能、热量之间的因果说法，纠正「温度高内能一定大」这类错误","k":"温度是分子平均动能的标志，内能是所有分子动能与势能之和，还与分子数、体积有关","q":[{"q":"判断两句话是否正确：①温度越高的物体内能越大；②内能增大的物体温度一定升高。","s":["内能 = 分子总动能 + 分子总势能，分子总数也影响内能的大小","一小杯沸水温度高但分子数远少于一池温水，内能可能更小，故①错","晶体熔化时持续吸热、内能增大，但温度保持不变，故②错","结论：温度与内能有关联但没有必然的单向关系"],"a":"两句话都错","c":"温度只管平均动能，内能还要管分子数与势能；三者的关系是「有关联、无必然」","x":"遇到这类判断题，先想两个反例：一滴沸水（温度高而内能小）、冰熔化（内能增而温度不变）"}],"v":["温度高内能一定大吗","内能增大温度一定升高吗","晶体熔化时的反例","三者的关联与区别","热量是过程量不是状态量"]}],"热力学第一定律":[{"t":"ΔU = Q + W 的综合计算","f":"结合气体状态变化求做功、吸放热与内能变化","k":"先由过程类型定 W（等容 W = 0、等压 W = −pΔV、等温 W 由第一定律反求），再代入 ΔU = Q + W","q":[{"q":"一定质量理想气体等压膨胀，压强 2×10⁵ Pa，体积由 1 L 增到 3 L，同时吸收 800 J 热量。求内能变化。","s":["等压膨胀，气体对外做功 W外 = pΔV = 2×10⁵ × 2×10⁻³ = 400 J","外界对气体做功 W = −400 J","ΔU = Q + W = 800 − 400","ΔU = 400 J，内能增加"],"a":"内能增加 400 J","c":"先算 W 并注意「气体对外做功」是负值，再代入 ΔU = Q + W，符号定好就不会错","x":"用能量收支核算：吸热 800 是收入、做功 400 是支出，净增 400，一步出结果"}],"v":["求气体做的功","求吸收或放出的热量","求内能的变化","结合状态变化综合计算","多过程分段的 ΔU 求和"]},{"t":"三个特殊过程中的能量关系","f":"判断等温、绝热、等容过程中内能、热量、功的变化","k":"等温 ΔU = 0、绝热 Q = 0、等容 W = 0；三条各锁住一个量，剩下的由第一定律推出","q":[{"q":"一定质量的理想气体被绝热压缩，内能与温度如何变化？","s":["绝热过程与外界无热交换：Q = 0","被压缩，外界对气体做功：W > 0","ΔU = Q + W = W > 0","内能增加，温度升高"],"a":"内能增加，温度升高","c":"三个特殊过程各有一个量恒为零，记住这三条能秒解大半选择题","x":"生活验证：给自行车打气时气筒会发热，正是绝热压缩使内能增加的直接证据"}],"v":["等温过程的 Q 与 W","绝热过程的 ΔU 与 W","等容过程的 Q 与 ΔU","三种过程对比","等温时 ΔU = 0"]},{"t":"绝热过程与自由膨胀","f":"分析绝热、自由膨胀等特殊过程中 Q、W、ΔU 的取值，判断温度是否变化","k":"绝热则 Q = 0，故 ΔU = W；向真空自由膨胀不做功 W = 0，若又绝热则 ΔU = 0，理想气体温度不变","q":[{"q":"绝热容器中，理想气体向真空自由膨胀。判断气体的内能与温度如何变化。","s":["绝热容器与外界无热交换：Q = 0","向真空膨胀，外界没有阻力，气体不对外做功：W = 0","由 ΔU = Q + W = 0，内能不变","理想气体内能只由温度决定，ΔU = 0 则温度不变"],"a":"内能不变，温度不变","c":"自由膨胀是「不做功的膨胀」；绝热 + 自由膨胀 = 内能严格不变，这是最容易被直觉带偏的一题","x":"两步取值法：先看有无热交换定 Q，再看有无对外做功定 W，剩下的交给第一定律"}],"v":["绝热膨胀温度如何变化","自由膨胀是否对外做功","内能是否变化","为什么温度不变","与等温膨胀的区别"]}],"热学":[{"t":"微观量的估算","f":"由宏观量（质量、体积、密度、摩尔质量）估算分子数、分子直径、分子质量","k":"阿伏加德罗常数是把宏观量与微观量连起来的唯一桥梁：N = (m/M)N_A，分子体积 V₀ = V/N","q":[{"q":"1 g 水中有多少个水分子？每个水分子占据的体积约多大？（M = 18 g/mol，N_A = 6×10²³ mol⁻¹，水的密度 1 g/cm³）","s":["物质的量 n = m/M = 1/18 mol","分子数 N = nN_A = 6×10²³/18 ≈ 3.3×10²² 个","1 g 水的体积为 1 cm³ = 10⁻⁶ m³","每个分子占据体积 V₀ = 10⁻⁶/3.3×10²² ≈ 3×10⁻²⁹ m³"],"a":"约 3.3×10²² 个，每个分子约占据 3×10⁻²⁹ m³","c":"所有估算题都走同一条路：宏观量 → 摩尔数 → 分子数 → 单个分子的量，一步一代","x":"记数量级：1 cm³ 水约含 3×10²² 个分子、分子直径约 10⁻¹⁰ m，估算题可直接用这两个数校验"}],"v":["求物体所含的分子数","估算分子的直径","求单个分子的质量","用油膜法估测分子直径","以阿伏伽德罗常数为桥梁换算"]},{"t":"内能的理解与比较","f":"判断内能是否变化、比较不同状态或不同物体的内能大小","k":"理想气体的内能只由温度和物质的量决定，与体积、压强无关；实际物体内能还包括分子势能","q":[{"q":"一定质量的理想气体温度不变、体积增大，内能如何变化？若温度升高、体积同时减小呢？","s":["理想气体分子间作用力可忽略，分子势能视为零","内能等于所有分子动能之和，只由温度决定","温度不变，分子平均动能不变，内能不变","温度升高则内能增大，与体积如何变化无关"],"a":"第一种情况内能不变；第二种情况内能增大","c":"「理想气体内能只看温度」是本模块最核心的结论，体积与压强都不影响内能","x":"一句话判据：温度不变 → 内能不变；温度升高 → 内能增大。看到「体积变化」不要被带偏"}],"v":["判断内能是否发生变化","比较两个物体的内能大小","内能与温度的区别","理想气体内能只由温度决定","内能与机械能无关"]},{"t":"气体压强的微观解释","f":"用分子动理论解释气体压强，或判断温度、体积同时改变时压强如何变化","k":"压强由分子平均动能与分子数密度共同决定：微观上正比于两者之积，宏观上由 pV/T = C 定量给出","q":[{"q":"一定质量的理想气体，温度升高的同时体积增大。能否直接判断压强如何变化？","s":["温度升高，分子平均动能增大，单次碰撞传递的冲量更大、碰撞更频繁，压强有增大趋势","体积增大，分子数密度减小，单位时间单位面积上的碰撞次数减少，压强有减小趋势","两个趋势方向相反，定性分析无法定论","由 p = C·T/V，T 与 V 同时增大时，必须比较两者的相对涨幅才能确定 p 的变化"],"a":"不能直接判断；取决于温度与体积增大的相对幅度","c":"压强的微观三要素是分子数密度、平均动能、碰撞频率；宏观上分别对应 V 与 T，同向变化时必须回到 pV/T = C","x":"遇到「温度升、体积也变」，先写 p = CT/V，再比 T 与 V 的倍数，谁涨得快压强就往谁那边走"}],"v":["解释压强的微观成因","温度与体积同变时压强如何变","碰撞频率与冲量的影响","用 pV/T = C 定量比较","分子数密度对压强的影响"]}],"焦耳定律与电功率":[{"t":"电功率与热功率的定量计算","f":"电动机、电解槽等非纯电阻电路，求输入功率、发热功率、输出功率与效率","k":"非纯电阻电路欧姆定律不成立（U ≠ IR），功率必须分成输入、发热、输出三块算","v":["求电动机的输出机械功率","求电动机的效率","求线圈发热功率","非纯电阻为什么不能用 U=IR"],"q":[{"q":"一台电动机接在 220 V 电源上，通过的电流 5 A，线圈电阻 4 Ω。求输入功率、发热功率、输出机械功率与效率。","s":["输入电功率 P入 = UI = 220×5 = 1100 W","线圈发热功率 P热 = I²R = 25×4 = 100 W","输出机械功率 P出 = 1100 − 100 = 1000 W","效率 η = 1000/1100 ≈ 90.9%"],"a":"输入 1100 W，发热 100 W，输出 1000 W，效率约 90.9%","c":"电动机是非纯电阻，U ≠ IR，功率只能分三块算，不能拿 U²/R 求发热","x":"用能量守恒检查：输入 = 输出 + 发热，1100 = 1000 + 100，任何一项算错都会对不上"}]},{"t":"额定功率与实际功率","f":"用电器铭牌给出额定值，接到不同电压下求实际功率，或判断能否正常工作","k":"电阻不变时 P ∝ U²，电压减半功率变四分之一；实际功率超过额定值会烧毁","v":["求实际功率","灯泡在不同电压下的亮度","串联后谁更亮","额定电流与额定电阻"],"q":[{"q":"标有「220 V 100 W」的灯泡接在 110 V 电路中（不考虑温度对电阻的影响），实际功率是多少？","s":["由 P = U²/R 求电阻：R = 220²/100 = 484 Ω","接 110 V 时 P实 = 110²/484 = 25 W","即实际功率是额定功率的四分之一","实际上灯丝温度降低、电阻变小，实际功率会略大于 25 W"],"a":"约 25 W","c":"电阻不变时 P ∝ U²，电压减半功率变四分之一，这是最常用的比例关系","x":"直接看比例：P实/P额 = (U实/U额)² = (1/2)² = 1/4，连电阻都不用算"}]}],"熵增加原理":[{"t":"熵变与无序程度","f":"判断某过程熵增还是熵减，或判断过程能否自发进行","k":"孤立系统中熵永不减少；熵是分子无序程度的度量，由有序变无序则熵增","q":[{"q":"冰融化成水与水结成冰，哪个过程熵增加？为什么冰的融化能自发进行？","s":["冰是晶体，分子排列有序；水分子排列无序","融化使无序程度增大，故熵增加","凝固使无序程度减小，熵减小","冰融化需要吸热，系统的熵增主要来自从环境吸收热量带来的熵流"],"a":"冰融化成水的过程熵增加","c":"判断熵变只看「有序 → 无序」还是「无序 → 有序」，前者熵增、后者熵减","x":"一句话：熵增就是「变乱」。凡是系统从整齐走向混乱的过程，熵都在增加"}],"v":["判断熵增还是熵减","判断过程能否自发进行","无序程度如何变化","熵与温度的关系","判断熵是不是状态量"]},{"t":"第二定律的两种表述与「自发」","f":"判断热量传递方向、制冷机与热泵是否违反第二定律","k":"克劳修斯表述：热量不能自发地从低温物体传到高温物体；关键词是「自发」，有外界做功时不违反","q":[{"q":"空调能把热量从温度较低的室内搬到温度较高的室外。这是否违反热力学第二定律？","s":["第二定律禁止的是热量「自发」地从低温传到高温","空调消耗了电能，属于「引起其他变化」","故不违反第二定律","但制冷系数不可能无限大，效率受第二定律限制"],"a":"不违反，因为有外界做功","c":"抓住「自发」二字：有外界做功时，热量完全可以从低温流向高温","x":"冰箱、空调、热泵都是「非自发」过程，都要消耗能量，因此都不违反第二定律"}],"v":["判断热量传递的方向","制冷机是否违反第二定律","热泵的工作原理","「自发」的确切含义","两种表述的等价性"]},{"t":"能量耗散与能源利用效率","f":"判断能量耗散的不可逆性，或解释为什么热机效率不可能达到 100%","k":"能量总量守恒，但能量的品质下降（耗散为内能）；第二定律排除效率 100% 的热机","q":[{"q":"汽车制动时动能变为内能，这些内能能否自发地重新变回汽车的动能？说明理由。","s":["能量总量守恒，动能转化为内能并不违反第一定律","内能是大量分子无规则运动的形式，要让它自发集中为定向的机械能，需要系统熵减小","熵增加原理指出孤立系统的熵不会自发减小","故该过程不可逆，制动产生的内能无法自发复原为动能"],"a":"不能；该过程熵增，不可逆","c":"「第一定律管得住能量守恒，管不住过程方向」——凡是问「能不能自发」，答案都在第二定律","x":"回答「不可逆」类问题用三步：能量守恒成立 → 复原需要熵减小 → 违反第二定律"}],"v":["判断能量耗散是否可逆","为什么效率不能达到 100%","能量品质下降的含义","能源利用的极限","制动产生的内能能否复原"]}],"爱因斯坦光电方程":[{"t":"方程的定量计算","f":"求最大初动能、逸出功、入射光频率或波长、截止频率","k":"hν = W₀ + Ek_max，且 Ek_max = eU_c；入射光能量小于逸出功时不发生光电效应","q":[{"q":"用波长 400 nm 的光照射逸出功为 2.0 eV 的金属。求光电子的最大初动能（hc 取 1240 eV·nm）。","s":["光子能量 ε = hc/λ = 1240/400 = 3.1 eV","Ek = ε − W₀","= 3.1 − 2.0","= 1.1 eV"],"a":"1.1 eV","c":"全程用 eV 计算最省事，hc = 1240 eV·nm 是必背常数","x":"先算 ε 再减 W₀ 即可；若算出 ε < W₀，说明不发生光电效应，不必再往下算"}],"v":["求最大初动能","求金属的逸出功","求入射光的频率或波长","由逸出功反求截止频率"]},{"t":"Ek-ν 图线的截距与斜率","f":"由最大初动能—频率图线求逸出功、普朗克常量、截止频率","k":"图线是直线：斜率等于 h，横轴截距是截止频率 ν₀，纵轴截距是 −W₀","q":[{"q":"某金属的 Ek-ν 图线斜率为 6.6×10⁻³⁴ J·s，横轴截距为 5×10¹⁴ Hz。求逸出功。","s":["图线斜率即普朗克常量 h","横轴截距即截止频率 ν₀ = 5×10¹⁴ Hz","W₀ = hν₀ = 6.6×10⁻³⁴ × 5×10¹⁴","= 3.3×10⁻¹⁹ J ≈ 2.06 eV"],"a":"约 3.3×10⁻¹⁹ J（约 2.1 eV）","c":"三个特征量必须记牢：斜率 h、横截距 ν₀、纵截距 −W₀，读图题全考这三处","x":"用 h = 4.14×10⁻¹⁵ eV·s 直接算 eV：W₀ = 4.14×5×10⁻¹ ≈ 2.07 eV，不必先换焦耳"}],"v":["由纵轴截距求逸出功","由斜率求普朗克常量","由横轴截距求截止频率","图线为什么是直线","横轴截距的物理意义"]},{"t":"双光束照射下的光电效应","f":"两种不同频率的光同时照射同一金属，求最大初动能或判断能否发生光电效应","k":"各光子独立作用，一个电子一次只吸收一个光子；能否逸出取决于单个光子能量是否超过逸出功","q":[{"q":"某金属逸出功 2.0 eV。用 1.5 eV 与 3.0 eV 两种光子同时照射，能否发生光电效应？最大初动能多少？","s":["1.5 eV < 2.0 eV，这部分光子单独不能打出电子","3.0 eV > 2.0 eV，可以打出电子","最大初动能 Ek = hν − W = 3.0 − 2.0 = 1.0 eV","两束光同时照射不会把能量叠加给同一个电子，故 Ek 仍为 1.0 eV"],"a":"能发生；最大初动能为 1.0 eV","c":"「一个电子只吸收一个光子」——所以两束弱光叠加不能替代一束强光，这是最反直觉的一点","x":"分别对每束光判一次 hν 与 W 的大小，取能发生的那束算 Ek，绝不相加"}],"v":["判断能否发生光电效应","求最大初动能","两束光的能量能否叠加","分别对每束光单独判断","一个电子只吸收一个光子"]}],"牛顿第一定律":[{"t":"力与运动关系的辨析","f":"以「推着走、不推就停」等生活经验设问，判断关于力与运动关系的说法是否正确","k":"力是改变运动状态的原因，不是维持运动的原因；物体停下来是因为受到阻力","v":["判断关于惯性说法的正误","解释撤去推力后仍能滑行","说明力与运动的关系","区分惯性与惯性定律"],"q":[{"q":"关于力和运动，下列说法正确的是：A 物体受力才能运动；B 物体运动必须有力维持；C 物体运动状态改变一定受到力；D 物体速度越大惯性越大。","s":["A、B 都把力当成维持运动的原因，与「不受力时物体保持匀速直线运动」矛盾","C：运动状态改变即速度矢量改变，一定有加速度，由牛顿第二定律必有合外力，正确","D：惯性大小只由质量决定，与速度无关","结论：只有 C 正确"],"a":"C 正确","c":"抓住一条：力对应加速度，不对应速度。有力才有加速度，与速度大小、是否运动无关","x":"反例法最快：冰面上推出的冰壶撤手后仍滑很远，直接推翻 A、B；同一辆车满载与空载惯性不同而速度可相同，推翻 D"}]},{"t":"惯性现象与惯性系","f":"给出急刹车、突然启动、抖落灰尘等情境，判断物体相对车厢的运动方向","k":"物体保持原来速度，车厢速度突变，二者之差就是相对运动方向","v":["急刹车时乘客向哪倾","突然启动时物体相对车厢的运动","抖落衣服上灰尘的原理","惯性大小与质量的关系"],"q":[{"q":"公交车原来以 10 m/s 匀速行驶，突然以 2 m/s² 刹车。车内水平桌面上一个光滑小球，刹车瞬间小球相对车厢如何运动？","s":["小球水平方向不受力（桌面光滑），由惯性保持 10 m/s 的速度","车厢开始减速，速度小于 10 m/s","小球速度大于车厢速度，相对车厢向前运动","相对加速度大小为 2 m/s²，方向向前"],"a":"小球相对车厢向前运动，相对加速度 2 m/s²","c":"先判断物体本身受什么力，再比较它与参考系的速度差，不要凭感觉说「向前倾」","x":"换到车厢参考系：车厢有向后的加速度，小球受到向前的惯性力 ma，故相对车厢向前加速，一步到位"}]}],"牛顿第三定律":[{"t":"作用力与反作用力、平衡力的辨析","f":"给出几对力，判断哪一对是作用力与反作用力，哪一对是平衡力","k":"看两点：是否作用在同一物体上（平衡力同体，作用力异体）、是否同性质","v":["区分作用力反作用力与平衡力","判断某力的反作用力是什么","说明两力为何不能抵消","找出题中的三对力"],"q":[{"q":"书静止在水平桌面上。判断：①书受的重力与桌面对书的支持力；②书对桌面的压力与桌面对书的支持力；③书受的重力与书对桌面的压力，各是什么关系？","s":["①都作用在书上，是一对平衡力，性质不同（重力与弹力），合力为零","②分别作用在桌面和书上，等大反向、同性质（都是弹力），是作用力与反作用力","③作用在两个物体上，但方向相同（都向下），既不是平衡力也不是作用力与反作用力","判断口诀：先看作用对象，再看方向是否相反，最后看性质是否相同"],"a":"①平衡力 ②作用力与反作用力 ③两者都不是","c":"作用力与反作用力一定「异体、反向、同性质、同时存在」，平衡力一定「同体、反向、可不同性质」","x":"用「撤去法」检验：撤去桌面，压力与支持力同时消失（同生同灭）→ 是作用力与反作用力；撤去书，重力仍在（重力来自地球）→ 重力与支持力不是"}]},{"t":"转换研究对象求力","f":"要求 A 对 B 的作用力，但直接分析 B 受力很麻烦，需要改分析 A","k":"先求 B 对 A 的反作用力，再用牛顿第三定律反号得到 A 对 B 的力","v":["求人对地面的压力","拔河时绳的张力","起跳时地面对人的作用力","求物体对斜面的压力"],"q":[{"q":"质量 60 kg 的人站在电梯里的体重计上，电梯以 2 m/s² 的加速度竖直向上加速。求人对体重计的压力（g=10）。","s":["先以人为研究对象，受重力 mg 与支持力 N，加速度向上","由牛顿第二定律 N − mg = ma，得 N = 60×(10+2) = 720 N","人对体重计的压力与体重计对人的支持力是作用力与反作用力","故压力大小也为 720 N，方向竖直向下"],"a":"人对体重计的压力为 720 N，比重力大 120 N","c":"求「某物体受到的力」先隔离该物体；求「某物体施加的力」就用第三定律反号","x":"直接用等效重力加速度：视重 = m(g+a) = 60×12 = 720 N，加速上升时 g 等效放大，一步得解"}]}],"牛顿第二定律":[{"t":"两类动力学问题","f":"已知受力求运动，或已知运动（含图像）反求受力，是本章最基础也最高频的题型","k":"桥梁是加速度：受力求 a 用 F = ma，运动求 a 用运动学公式，两边各算一次 a 再对接","q":[{"q":"质量 2 kg 的物体在水平面上受 10 N 水平拉力，动摩擦因数 0.2。求 3 s 末的速度和 3 s 内的位移（g 取 10 m/s²）。","s":["摩擦力 f = μmg = 0.2×2×10 = 4 N","合力 F合 = 10 − 4 = 6 N","a = F合/m = 3 m/s²","v = at = 9 m/s，x = ½at² = ½×3×9 = 13.5 m"],"a":"9 m/s，13.5 m","c":"受力分析 → 求合力 → a = F/m → 运动学公式，四步顺序不能颠倒，也不能跳过受力直接套运动学","x":"若题目给的是 v-t 图，先用斜率求 a，再由 ma = F − f 反推阻力，方向反着算同样快"}],"v":["已知受力求运动","已知运动反求受力","结合图像求受力","多过程的分段动力学"]},{"t":"整体法求加速度、隔离法求内力","f":"两个物体叠放或接触，受水平力作用，求保持相对静止的最大外力，或求两者之间的作用力","k":"先用整体法求共同加速度 a，再隔离受力较少的那个物体，把「内力 = ma」与最大静摩擦比较","q":[{"q":"质量 m 的物块叠放在质量 2m 的物块上，系统放在光滑水平面上。用水平力 F 拉下面的 2m 物块，两者间最大静摩擦力为 f_max。求保持相对静止的最大 F。","s":["整体：F = 3ma，得 a = F/(3m)","隔离上面的 m：静摩擦力提供它的加速度，f = ma = F/3","相对静止要求 f ≤ f_max，即 F/3 ≤ f_max","故 F 最大为 3f_max"],"a":"F 最大为 3f_max","c":"求「保持相对静止的最大外力」固定两步：整体求 a、隔离求内力，再令内力等于最大值","x":"用比例速算：内力由被带动的质量份额决定，f = F·m/(m+M)，本题份额是 1/3，一步写出不等式"}],"v":["求保持相对静止的最大外力","求两物体之间的弹力","求连接体之间绳的张力","先整体后隔离的解题顺序","叠放物体的内力计算"]},{"t":"a-F 图与 a-1/m 图","f":"由实验图像求小车质量与所受阻力，或判断图线不过原点的原因","k":"把公式化成 a = (1/m)F − f/m，与 y = kx + b 对照：斜率是 1/m，横轴截距是 f","q":[{"q":"探究 a 与 F 关系的实验中，a-F 图线是一条不经过原点的直线，横轴截距为 0.5 N，斜率为 2 kg⁻¹。求小车质量与所受阻力。","s":["由牛顿第二定律 F − f = ma 得 a = F/m − f/m","与 y = kx + b 对照：斜率 k = 1/m，截距 b = −f/m","斜率 1/m = 2，得 m = 0.5 kg","横轴截距满足 a = 0，即 F = f，故阻力 f = 0.5 N"],"a":"小车质量 0.5 kg，阻力 0.5 N","c":"图像题必须先把公式化成 y = kx + b 的形式，斜率和截距才对应得上物理量，直接看图容易搞反","x":"记「a-F 图斜率是 1/m、横截距是阻力 f」，看到图直接读两个数"}],"v":["由斜率求小车质量","由截距求阻力大小","图线不过原点的原因","平衡摩擦力的操作要点","砂桶质量不满足远小于小车时的弯曲"]}],"物质波":[{"t":"德布罗意波长的计算","f":"已知粒子质量与速度、动能或加速电压，求其德布罗意波长","k":"λ = h/p = h/(mv)；由动能表示时 λ = h/√(2mEk)，加速电压下 Ek = qU","v":["求电子的德布罗意波长","由加速电压求波长","波长与动量的关系","质子和电子的波长比较"],"q":[{"q":"电子经 100 V 电压加速，求其德布罗意波长（m=9.1×10⁻³¹ kg，e=1.6×10⁻¹⁹ C，h=6.63×10⁻³⁴ J·s）。","s":["加速后动能 Ek = eU = 1.6×10⁻¹⁹×100 = 1.6×10⁻¹⁷ J","动量 p = √(2mEk) = √(2×9.1×10⁻³¹×1.6×10⁻¹⁷) ≈ 5.4×10⁻²⁴ kg·m/s","λ = h/p = 6.63×10⁻³⁴/5.4×10⁻²⁴","λ ≈ 1.2×10⁻¹⁰ m"],"a":"约 1.2×10⁻¹⁰ m，即 0.12 nm","c":"两步不能省：先由能量求动量，再用 λ = h/p；不要试图一步套公式","x":"记住结论：100 V 加速的电子波长约 0.12 nm，与晶格常数同量级，这正是电子衍射能成功的原因"}]},{"t":"宏观物体与微观粒子的波动性","f":"判断为什么宏观物体观察不到波动性，或比较不同粒子的波长大小","k":"λ = h/p，宏观物体动量大、波长远小于任何可观测尺度，故波动性无法显现","v":["为什么人观察不到波动性","波长与质量的关系","波动性显著的条件","电子与质子的波长比较"],"q":[{"q":"质量 60 kg 的人以 1 m/s 行走，求其德布罗意波长，并解释为什么观察不到衍射。","s":["λ = h/(mv) = 6.63×10⁻³⁴/(60×1) ≈ 1.1×10⁻³⁵ m","这个波长比原子核（约 10⁻¹⁵ m）还小 20 个数量级","没有任何障碍物或缝的尺寸能与之相比，衍射无法观察","故宏观物体的波动性原则上存在，实际上完全不可观测"],"a":"约 1.1×10⁻³⁵ m，远小于任何可观测尺度，故观察不到","c":"判断波动性是否显著，只比「波长」与「障碍物尺寸」两个量","x":"从 h 极小（6.63×10⁻³⁴）入手：只要 m 是宏观量，λ 必然小到无法测量"}]}],"玻尔模型":[{"t":"能级公式与谱线数","f":"求能级能量、跃迁光子能量、可能发出的光谱线条数","k":"E_n = −13.6/n² eV；一群处于 n 能级的氢原子最多辐射 n(n−1)/2 种光子，单个原子最多 n−1 种","q":[{"q":"一群处于 n=3 能级的氢原子向低能级跃迁，最多能发出几种不同频率的光？","s":["可能的跃迁：3→1、3→2、2→1","共 3 种不同频率","用公式 n(n−1)/2 = 3×2/2 = 3 验证","若只有一个原子，最多只能发出 2 种"],"a":"3 种（一群原子）；若只有一个原子则为 2 种","c":"「一群原子」与「一个原子」结论不同：前者 n(n−1)/2，后者最多 n−1 种，审题时必须看清","x":"画能级图数箭头：从 n=3 出发能画出的箭头数就是答案，直观且不会漏"}],"v":["求某能级的能量","求跃迁光子的能量","求可能发出的光谱线条数","用 C(n,2) 计算","一群原子与一个原子的区别"]},{"t":"玻尔模型的适用范围","f":"判断玻尔模型能解释与不能解释的现象","k":"能解释氢原子与类氢离子的光谱；不能解释多电子原子的光谱与谱线强度","q":[{"q":"玻尔模型为什么无法解释氦原子的光谱？","s":["玻尔模型只处理「单电子绕核运动」的情形","氦原子有两个电子，存在电子之间的相互作用","模型无法处理这种多体问题","故只适用于氢原子与类氢离子（He⁺、Li²⁺ 等）"],"a":"因为玻尔模型只适用于单电子体系，无法处理电子间的相互作用","c":"判断「能否解释」只看电子数：单电子可以，多电子一律不行","x":"记住「玻尔模型 = 氢原子专用」，遇到氦、钠等直接判不能解释"}],"v":["能解释哪些现象","不能解释哪些现象","为什么不能解释多电子原子","与量子力学的差别","只对氢原子精确成立"]},{"t":"玻尔模型的三条假设","f":"判断某说法对应哪条假设，或用假设解释为什么氢光谱是分立线状谱","k":"①定态假设（稳定轨道不辐射）②跃迁假设（hν = Eₘ − Eₙ）③轨道量子化（角动量量子化）","q":[{"q":"说明玻尔模型是如何解释氢原子光谱为分立线状谱的。","s":["定态假设：电子只能在若干稳定轨道上运动，处于定态时不辐射能量","轨道量子化：这些定态的能量只能取分立值 E₁、E₂、E₃…","跃迁假设：电子在两定态间跃迁时才吸收或放出光子，hν = Eₘ − Eₙ","两个能级之差只有分立值，故光子频率只有分立值，光谱是线状谱"],"a":"定态与量子化使能量取分立值，跃迁辐射的光子频率因而分立","c":"三条假设是一套：定态管稳定、量子化管分立、跃迁管发光","x":"答「为什么是线状谱」的标准链条：定态 → 能量分立 → 跃迁 → 频率分立"}],"v":["判断说法对应哪条假设","定态假设的内容","跃迁假设的内容","轨道量子化的含义","三条假设如何配合"]}],"玻意耳定律":[{"t":"等温变化的基本计算","f":"求等温过程中的压强或体积，常以水银柱、活塞封闭气体的形式出现","k":"p₁V₁ = p₂V₂；难点不在公式，而在正确写出被封闭气体的压强（用水银柱高度或活塞受力求）","q":[{"q":"一端封闭的玻璃管竖直放置，管内水银柱高 10 cm，封闭气柱长 20 cm，大气压 75 cmHg。把玻璃管缓慢倒置（开口向下），求气柱长度。","s":["正立时封闭气体压强 p₁ = 75 + 10 = 85 cmHg，气柱长 20 cm","倒置后 p₂ = 75 − 10 = 65 cmHg","等温：p₁L₁ = p₂L₂（同一截面积，体积正比于长度）","L₂ = 85×20/65 ≈ 26.2 cm"],"a":"约 26.2 cm","c":"封闭气体压强先算清楚：正立加水银柱、倒置减水银柱。这一步错则后面全错","x":"用长度代替体积：同一玻璃管截面积不变，体积比就是长度比，省去换算截面积"}],"v":["求等温过程的压强","求等温过程的体积","水银柱封闭气体的等温变化","活塞封闭气体的等温变化","p₁V₁ = p₂V₂ 的应用"]},{"t":"等温线的图像与微观解释","f":"判断 p-V 图线形状、比较不同等温线的温度高低、用分子动理论解释","k":"等温线是双曲线，离原点越远 pV 乘积越大、温度越高；温度不变时体积减小会使分子碰撞频率增大","q":[{"q":"p-V 图中有两条等温线，A 点位于离原点较近的线上，B 点位于较远的线上。比较两状态的温度。","s":["等温线上 pV = 常量，常量越大温度越高","离原点越远，pV 乘积越大","故 T_B > T_A","同一等温线上各点温度完全相同"],"a":"T_B > T_A","c":"比较温度只看 pV 乘积：乘积大则温度高，不必代入具体数值计算","x":"在图上画一条过原点的辅助线，与两条等温线各交一点，位置更高的温度更高"}],"v":["判断 p-V 图线的形状","比较不同等温线的温度高低","用分子动理论解释","为什么是双曲线","等温线越远离原点温度越高"]},{"t":"封闭气体的液柱（水银柱）问题","f":"求被水银柱封闭的气体压强，或判断温度变化时水银柱如何移动","k":"先对液柱受力分析定压强：开口向上 p = p₀ + ρgh，开口向下 p = p₀ − ρgh；再结合等温或等压条件","q":[{"q":"一端封闭的玻璃管竖直放置、开口向上，管内水银柱高 10 cm，大气压为 76 cmHg。求封闭气体的压强。","s":["以水银柱为研究对象，受向下的重力 ρghS、向下的大气压力 p₀S、向上的气体压力 pS","平衡条件：pS = p₀S + ρghS","p = p₀ + ρgh = 76 + 10","= 86 cmHg"],"a":"86 cmHg","c":"「开口向上加、开口向下减」——水银柱题的第一步永远是受力分析定压强，别背结论","x":"统一用 cmHg 作单位，h 直接以 cm 代入，76 + 10 一步出结果，省去换算"}],"v":["求被封闭气体的压强","判断温度变化时水银柱如何移动","开口向上与开口向下的区别","玻璃管倾斜后的压强","先受力分析再列气体定律"]}],"理想气体状态方程":[{"t":"状态方程的定量计算","f":"已知两个状态的参量，求第三个状态的某个参量，中间过程可以不管","k":"p₁V₁/T₁ = p₂V₂/T₂，温度必须用热力学温度；单位两边一致即可","v":["求末态体积","求末态温度","求末态压强","两个状态之间如何建立联系"],"q":[{"q":"一定质量的理想气体在 1×10⁵ Pa、300 K 时体积为 2 L。求 1.5×10⁵ Pa、450 K 时的体积。","s":["由 p₁V₁/T₁ = p₂V₂/T₂","V₂ = p₁V₁T₂/(p₂T₁) = 1×10⁵×2×450/(1.5×10⁵×300)","分子 9×10⁷，分母 4.5×10⁷","V₂ = 2 L"],"a":"末态体积仍为 2 L","c":"状态方程一次跨两个状态，中间怎么变都不用管；温度必须换成开尔文","x":"先看比值：p 变 1.5 倍、T 也变 1.5 倍，对 V 的影响正好抵消，故 V 不变"}]},{"t":"气体密度与状态方程","f":"求气体在不同状态下的密度，或判断温度、压强变化时密度如何变","k":"由 pV = nRT 得 ρ = pM/(RT)：密度与压强成正比、与温度成反比","v":["求气体的密度","温度升高密度如何变","容器漏气后密度变化","由密度求物质的量"],"q":[{"q":"一定质量的气体温度由 300 K 升到 600 K，压强保持不变，密度变为原来的多少？","s":["由 pV = nRT，p 不变时 V ∝ T","温度加倍，体积加倍","质量不变，由 ρ = m/V 得密度减半","也可直接由 ρ = pM/(RT) 看出 ρ ∝ 1/T"],"a":"密度变为原来的 1/2","c":"ρ = pM/(RT)：密度与压强成正比、与温度成反比，这是判断密度变化最快的式子","x":"用常识判断：同质量的气体受热膨胀、体积变大，密度自然变小，不必代公式"}]}],"生活中的圆周运动":[{"t":"拱形桥与凹形桥的受力","f":"汽车通过拱形桥最高点或凹形桥最低点，求车对桥面的压力，或求压力为零的临界速度","k":"最高点 mg−N=mv²/R，最低点 N−mg=mv²/R，再结合牛顿第三定律换成「车对桥的压力」","v":["求拱桥最高点的压力","求汽车离开桥面的速度","比较最高点与最低点的压力","求凹形桥底部的支持力"],"q":[{"q":"质量 1000 kg 的汽车以 10 m/s 通过半径 50 m 的拱形桥最高点，g=10。求车对桥面的压力；速度多大时车恰好离开桥面？","s":["最高点重力与支持力的合力提供向心力：mg − N = mv²/R","N = m(g − v²/R) = 1000×(10 − 100/50) = 1000×8 = 8000 N","由牛顿第三定律，车对桥面的压力大小也是 8000 N","令 N = 0 得 v = √(gR) = √500 ≈ 22.4 m/s，此时车恰好离开桥面"],"a":"压力 8000 N；速度达到约 22.4 m/s 时车恰好离开桥面","c":"竖直面圆周先写「供需关系」：需要的向心力由重力与支持力的合力提供，方向指向圆心","x":"极限法：v 越大所需向心力越大，重力全用来提供向心力时支持力为零，超过就飞出去，临界速度 √(gR) 一步得出"}]},{"t":"水平面转弯与离心趋势","f":"汽车转弯、转盘上物块、洗衣机脱水，判断能否保持圆周运动、求最大安全速度","k":"需要的向心力 mω²r 超过能提供的最大静摩擦 μmg 时，物体做离心运动","v":["求转弯的最大安全速度","求转盘不打滑的最大角速度","解释脱水筒为什么能甩干","判断物块何时被甩出"],"q":[{"q":"物块放在水平转盘上，距轴 0.5 m，与盘间动摩擦因数 0.4，g=10。求转盘不打滑的最大角速度。","s":["物块随盘转动，静摩擦力提供向心力：f = mω²r","不打滑条件是 f 不超过最大静摩擦：mω²r ≤ μmg","得 ω ≤ √(μg/r) = √(0.4×10/0.5) = √8 ≈ 2.83 rad/s","若路面湿滑使 μ 减半，最大角速度降为 √2/2 倍，约 2 rad/s"],"a":"最大角速度约 2.83 rad/s，超过后物块被甩向边缘","c":"「供需关系」是判断离心运动的总纲：需要多少向心力，能提供多少，两者一比结论就出来","x":"换成线速度更快：v ≤ √(μgr) = √2 ≈ 1.41 m/s，再由 v = ωr 得 ω ≈ 2.83 rad/s"}]}],"电势差与场强":[{"t":"U = Ed 的定量计算","f":"匀强电场中已知场强、两点距离或电势差，求另一个量，注意距离要不要投影","k":"U = Ed 中的 d 必须是沿电场线方向的距离，斜向距离要乘 cosθ 投影","v":["求两点间的电势差","d 应该取哪一段","由 U 和 d 求场强","斜向连线如何计算"],"q":[{"q":"匀强电场场强 200 V/m，方向水平向右。A、B 两点相距 0.1 m，连线与场强方向成 60°，B 在 A 的右侧。求 U_AB。","s":["d 取沿场强方向的投影：d = 0.1×cos60° = 0.05 m","U_AB = E·d = 200×0.05 = 10 V","B 在 A 沿场强方向的一侧，电场线由高电势指向低电势，故 φ_A > φ_B","U_AB = φ_A − φ_B = 10 V"],"a":"U_AB = 10 V","c":"U = Ed 里的 d 一定是沿电场线方向的距离，斜着量必须先投影","x":"也可先算功：W = qE·d cos60°，再由 U = W/q 得同一结果，两种写法完全等价"}]},{"t":"等势面与场强的定性关系","f":"给出等势面分布或电势随位置变化的图线，比较场强大小或判断场强方向","k":"等差等势面越密处场强越大；电场线垂直等势面且由高电势指向低电势","v":["由等势面疏密判断场强","判断两点电势高低","φ-x 图线的斜率含义","等差等势面的间距"],"q":[{"q":"某电场中三个等势面电势依次为 10 V、6 V、2 V，相邻等势面间距依次为 1 cm 与 3 cm。比较这两处的场强大小。","s":["相邻等势面的电势差相同，都是 4 V","由 E = U/d，电势差相同时 d 越小 E 越大","第一段 E₁ = 4/0.01 = 400 V/m","第二段 E₂ = 4/0.03 ≈ 133 V/m"],"a":"前一处约 400 V/m，后一处约 133 V/m，等势面密处场强大","c":"等差等势面的疏密直接反映场强大小：密则强、疏则弱","x":"只看「同样的电势差占多大距离」：距离短的场强必然大，连具体数值都不用算"}]}],"电势电势能":[{"t":"电势差、电势能与电场力做功","f":"求两点间电势差、某点电势、电势能变化，或判断哪点电势更高","k":"三条式子必须分清：W_AB = qU_AB、U_AB = φ_A − φ_B、ΔEp = −W_AB。符号一错，结论全反","q":[{"q":"把电荷 q = −2×10⁻⁶ C 从 A 移到 B，电场力做功 4×10⁻⁶ J。求 U_AB、电势能变化，并判断 A、B 哪点电势高。","s":["U_AB = W_AB/q = 4×10⁻⁶ ÷ (−2×10⁻⁶) = −2 V","U_AB = φ_A − φ_B = −2 V < 0，故 φ_A < φ_B，B 点电势高","电场力做正功 4×10⁻⁶ J，电势能减少","ΔEp = −W_AB = −4×10⁻⁶ J"],"a":"U_AB = −2 V，B 点电势高，电势能减少 4×10⁻⁶ J","c":"先算 U_AB 的数值与符号，再由符号判断电势高低；电势能变化一律用「做正功则减少」定符号","x":"免符号口诀：正电荷顺电场线移动电势能减少，负电荷逆电场线移动电势能减少。先判方向再判增减，比套公式稳"}],"v":["求两点间的电势差","求某点的电势","求电势能的变化","判断哪点电势更高","U_AB = φ_A − φ_B 的符号"]},{"t":"等势面与做功的路径无关性","f":"带电粒子沿不同路径在等势面间移动，判断做功、电势能与动能变化","k":"W = qU 只由始末位置的电势差决定，与路径无关；同一等势面上移动，电场力不做功","q":[{"q":"带电粒子从等势面 A 沿两条不同路径移到等势面 B，两次电场力做功是否相同？若沿等势面绕一圈，净功为多少？","s":["电场力做功只取决于始末电势差：W = qU_AB","与路径形状、是否沿电场线都无关，故两次做功相同","沿等势面移动时电势差为零，电场力不做功","绕一圈回到原等势面，净功为零"],"a":"两次做功相同；沿等势面绕行净功为零","c":"静电力是保守力，做功与路径无关——这正是能引入「电势能」这个概念的前提","x":"类比重力：重力做功只看高度差，电场力做功只看电势差，两个模型完全同构，可以整段迁移"}],"v":["沿不同路径做功相同","判断电势能如何变化","判断动能如何变化","等势面上移动不做功","等势面与电场线垂直"]},{"t":"电势高低的判断","f":"判断电场中两点电势的高低，或比较同一电荷在两点电势能的大小","k":"沿电场线方向电势降低；正电荷在高电势处电势能大，负电荷在高电势处电势能小","q":[{"q":"一个电子从 A 点移到 B 点，电场力做功 3.2×10⁻¹⁸ J。判断 A、B 两点电势的高低。","s":["电场力做正功，说明电势能减少","电子带负电，q < 0","由 Ep = qφ，q 为负时 Ep 减小意味着 φ 增大","故 φ_B > φ_A，即 B 点电势高"],"a":"B 点电势高于 A 点","c":"负电荷是最大的坑：电场力做正功时，负电荷向高电势运动，正电荷向低电势运动","x":"记「正电荷顺电场线走电势能减小，负电荷逆电场线走电势能减小」，再反推电势高低"}],"v":["比较两点的电势","比较同一电荷的电势能","沿电场线方向电势降低","负电荷在低电势处电势能更大","由等势面判断"]}],"电场偏转":[{"t":"偏转距离与偏转角","f":"求射出电场时的偏转距离、偏转角，或求打在荧光屏上的位置","k":"类平抛三式：t = L/v₀，y = ½at²，tanθ = v_y/v₀ = at/v₀，其中 a = qU/(md)","q":[{"q":"电子以速度 v₀ 垂直进入长 L、板间距 d、电压 U 的平行板。求射出时速度方向与初速度方向夹角的正切。","s":["加速度 a = eU/(md)","飞行时间 t = L/v₀","竖直分速度 v_y = at = eUL/(mdv₀)","tanθ = v_y/v₀ = eUL/(mdv₀²)"],"a":"tanθ = eUL/(mdv₀²)","c":"类平抛的速度角与位移角仍满足 tanθ_v = 2tanθ_x，与平抛完全一致，可直接借用推论","x":"若粒子是先加速后偏转，代入 v₀² = 2eU₁/m，得 tanθ = UL/(2U₁d)，与粒子种类无关，可用来秒判「换粒子角度不变」"}],"v":["求偏转距离 y","求偏转角 tanθ","求打在屏上的位置","y 与 U、L、d 的关系","偏转位移与偏转角的关系"]},{"t":"能否射出极板的临界判断","f":"判断粒子打在极板上还是能飞出，求临界电压、临界入射位置或临界板长","k":"临界条件统一翻译成「恰好擦着极板边缘飞出」，即 y = d/2，代入偏转公式解临界量","q":[{"q":"电子以速度 v₀ 沿两板中线射入长 L、板间距 d 的平行板。求电子恰好能飞出时的最大电压 U。","s":["恰好飞出时偏转距离等于板间距的一半：y = d/2","y = ½at² = ½·(eU/md)·(L/v₀)²","令其等于 d/2：eUL²/(2mdv₀²) = d/2","解得 U = md²v₀²/(eL²)"],"a":"U = md²v₀²/(eL²)","c":"「恰好飞出」一律翻译成 y = d/2，这是这类题唯一的突破口，其余都是代数运算","x":"也可用时间判据：飞出所需时间 t = L/v₀，若竖直位移超过 d/2 则打在板上，两种判据完全等价"}],"v":["判断粒子是否打在极板上","求恰好射出的临界电压","求恰好射出的临界板长","求临界入射位置","恰好从边缘射出的条件"]},{"t":"偏转的推论与屏上位置","f":"求粒子打在荧光屏上的偏移量，或用「速度反向延长过板中心」快速求解","k":"射出偏转电场时速度的反向延长线过极板长度的中点；屏上偏移 y总 = y(1 + 2L′/L)","q":[{"q":"偏转极板长 L = 0.1 m，粒子射出时偏转距离 y = 0.01 m，极板右端到屏的距离 L′ = 0.2 m。求粒子打在屏上的偏移量。","s":["速度反向延长线过板长中点，即距右端 L/2 = 0.05 m 处","由相似三角形：y总/y = (L/2 + L′)/(L/2)","= (0.05 + 0.2)/0.05 = 5","y总 = 5×0.01 = 0.05 m"],"a":"0.05 m","c":"「反向延长过中点」把两段问题压缩成一次相似三角形，是偏转题最省时的推论","x":"记 y总 = y(1 + 2L′/L)，代入 0.01×(1 + 0.4/0.1) = 0.05 m"}],"v":["求屏上的偏移量","用速度反向延长过板中心","求偏移量与偏转角的关系","推论快速求解","打在屏上的范围"]}],"电场加速":[{"t":"加速后的动能与速度比较","f":"粒子经电压 U 加速后求速度或动能，或比较不同粒子在同一电压下的加速结果","k":"动能只由 qU 决定（Ek = qU），速度还要看质量（v = √(2qU/m)），两个比例必须分开算","q":[{"q":"质子（电荷 e、质量 m）与 α 粒子（电荷 2e、质量 4m）由静止经同一电压 U 加速。求它们的动能之比与速度之比。","s":["动能 Ek = qU，质子 eU、α 粒子 2eU，故动能比 1:2","速度 v = √(2qU/m)，质子 √(2eU/m)","α 粒子 √(2×2eU/4m) = √(eU/m)","速度比 = √2 : 1"],"a":"动能比 1:2，速度比 √2:1","c":"「同一电压加速」时动能只看电荷量，速度还要看荷质比 q/m，两条线不能混","x":"用 v ∝ √(q/m) 直接比荷质比：质子 e/m，α 粒子 2e/4m = 0.5e/m，速度比为 √2:1，一步出"}],"v":["求加速后的速度","求加速后的动能","比较不同粒子的结果","用 qU = ½mv² 求解","相同电压下动能与电荷量成正比"]},{"t":"多级加速与总能量","f":"粒子依次经过多个电势差区域，或往复加速，求最终动能","k":"只看始末电势差之和：ΔEk = q·ΣU，中间的加速与减速按正负号代数相加，与路径无关","q":[{"q":"电子由静止依次经过 +100 V、−50 V、+200 V 三个电势差区域。求最终动能。","s":["电子带负电，q = −e，电势差为正时电场力做正功","总电势差 ΣU = 100 − 50 + 200 = 250 V","ΔEk = e × 250 V = 250 eV","中间区域即使减速，也只影响过程，不影响最终能量"],"a":"250 eV","c":"多级加速只看始末电势差之和，中间怎么绕都不改变结果——这正是保守力做功的特点","x":"用「加速取正、减速取负」直接代数相加：100 − 50 + 200 = 250，一行出结果"}],"v":["求经过多个电势差后的动能","往复加速后的总能量","总功等于各段之和","直线加速器的原理","电场力做功与路径无关"]},{"t":"加速电压与动能的图像","f":"由 Ek-U 图求电荷量，或比较不同粒子图线的斜率","k":"qU = Ek，Ek-U 图线是过原点的直线，斜率就是电荷量 q","q":[{"q":"某粒子经不同加速电压 U 加速后测得其动能 Ek，作出 Ek-U 图线，斜率为 3.2×10⁻¹⁹ C。求该粒子所带元电荷数（e = 1.6×10⁻¹⁹ C）。","s":["由 qU = Ek 得 Ek = qU","图线斜率即电荷量 q = 3.2×10⁻¹⁹ C","元电荷 e = 1.6×10⁻¹⁹ C","q/e = 3.2/1.6 = 2"],"a":"带 2 个元电荷","c":"Ek-U 图线的斜率就是电荷量，这是测定粒子电荷的经典方法","x":"记住 e = 1.6×10⁻¹⁹ C，直接用斜率除以 e 得元电荷数"}],"v":["由 Ek-U 图求电荷量","比较不同粒子图线的斜率","判断粒子的比荷","图线为什么是过原点的直线","斜率的物理意义"]}],"电场强度":[{"t":"场强的矢量叠加","f":"求两点电荷连线或中垂线上某点的合场强大小与方向，或求场强为零的点","k":"先分别用 E = kQ/r² 求大小，再按方向合成；同种电荷中点场强为零，异种电荷中点场强叠加最大","q":[{"q":"两个等量正点电荷 +Q 相距 2L。求连线中点处的场强，并指出场强为零的位置。","s":["每个电荷在中点产生的场强大小都是 kQ/L²","两个场强方向相反（都背离各自电荷、指向中点两侧）","故中点处合场强为零","连线上的场强为零的点只有中点，其他位置两场强大小不等、无法抵消"],"a":"中点场强为零，且连线上只有这一点场强为零","c":"等量同种电荷：连线中点 E = 0、中垂线上中点 E = 0 但两侧向外；等量异种电荷：中点 E 最大。两类要分清","x":"画箭头法最快：同种电荷在中点处箭头相对必抵消，异种电荷箭头同向必叠加，不必算数值"}],"v":["求合场强的大小与方向","求场强为零的点","同种与异种电荷的分布差别","用平行四边形定则合成","场强方向的规定"]},{"t":"电场线与粒子轨迹","f":"由电场线分布判断场强大小、电势高低、粒子的受力方向与轨迹弯曲","k":"三条读法：电场线疏密看场强大小、切线方向看正电荷受力方向、沿电场线方向电势降低","q":[{"q":"某电场的电场线由左向右逐渐变密。一带正电粒子从左侧由静止释放，判断它的加速度、动能与电势能如何变化。","s":["电场线变密说明场强变大，故加速度逐渐增大","正电荷受力沿电场线方向，向右加速运动","电场力做正功，动能增加、电势能减少","只有电场力做功，动能与电势能之和保持不变"],"a":"加速度逐渐增大，动能增加，电势能减少","c":"电场线是「不用公式的场强地图」：疏密、方向、走向分别对应大小、方向、电势高低","x":"用能量守恒校验：动能增加多少，电势能就减少多少，两者之和恒定，不必算具体数值"}],"v":["判断场强的大小","判断电势的高低","判断粒子的受力方向","由轨迹弯曲方向定受力","粒子的电性与动能变化"]},{"t":"匀强电场中 E 与 U 的关系","f":"由两点电势差求场强，或判断电场方向、画等势线","k":"U = Ed，d 是沿电场方向的距离；场强方向由高电势指向低电势","q":[{"q":"匀强电场中 A、B 两点相距 0.2 m，连线与电场方向成 60° 角，U_AB = 100 V。求场强大小。","s":["沿电场方向的距离 d = 0.2×cos60° = 0.1 m","由 U = Ed 得 E = U/d","E = 100/0.1 = 1000 V/m","方向由高电势指向低电势"],"a":"1000 V/m","c":"d 必须是「沿电场方向」的投影距离，直接拿两点间距代入是最常见的错","x":"记 E = U/(L cosθ)，θ 是连线与电场方向的夹角"}],"v":["由电势差求场强","由场强求电势差","判断电场的方向","画出等势线并定电场方向","U = Ed 中 d 的含义"]}],"电学实验":[{"t":"伏安法测电阻：内接与外接","f":"选择电流表内接还是外接，判断测量值偏大还是偏小，或估算误差","k":"大电阻用内接（测量值偏大），小电阻用外接（测量值偏小）；临界值是 R_x 与 √(R_A·R_V) 的比较","q":[{"q":"待测电阻约 100 Ω，电压表内阻 3 kΩ，电流表内阻 1 Ω。应选内接还是外接？测量值偏大还是偏小？","s":["临界值 √(R_A R_V) = √(1×3000) ≈ 55 Ω","R_x = 100 Ω > 55 Ω，属于「大电阻」","故选用电流表内接法","内接时电流表分走一部分电压，电压表读数偏大，故 R测 > R真"],"a":"内接法，测量值偏大","c":"口诀「大内偏大、小外偏小」：大电阻用内接、结果偏大；小电阻用外接、结果偏小","x":"直接比较 R_x² 与 R_A R_V：100² = 10⁴ > 3000，故用内接，与临界值法结论一致且不用开方"}],"v":["选择内接还是外接","判断测量值偏大还是偏小","估算误差的大小","大电阻与小电阻的选择依据","「大内小外」的口诀"]},{"t":"分压与限流接法","f":"选择滑动变阻器的分压或限流接法，或连接实物图、判断调节范围","k":"需要电压从零连续调节、或变阻器阻值远小于待测电阻时用分压；其余情况优先限流（简单省电）","q":[{"q":"要用 0~3 V 连续可调的电压测小灯泡的伏安特性曲线，滑动变阻器最大阻值 10 Ω、灯泡电阻约 10 Ω。应选哪种接法？","s":["要求电压从零开始连续调节","限流接法时灯泡两端电压不能调到零","故必须使用分压接法","分压接法把变阻器全部接入回路，通过滑动触头分压，调节范围覆盖 0 到电源电压"],"a":"分压接法","c":"三条判据：要从零调、要大幅度调、变阻器阻值小于待测电阻——满足任一条就用分压","x":"记一句「测伏安特性曲线一律分压」，这是最常考的实验，几乎不必再逐条判断"}],"v":["选择分压还是限流","按电路图连接实物图","判断电压或电流的调节范围","什么情况必须用分压","两种接法的能耗比较"]},{"t":"实验数据处理与误差分析","f":"由多组数据求平均值、作图像求物理量，或分析系统误差的来源与方向","k":"图像法核心是「化曲为直」：把公式整理成 y = kx + b，斜率与截距才对应物理量","q":[{"q":"用单摆测重力加速度，测得多组摆长 L 与周期 T，应作什么图线？若图线斜率为 k，g 等于多少？","s":["由 T = 2π√(L/g) 两边平方得 T² = (4π²/g)L","以 L 为横轴、T² 为纵轴作图，图线是过原点的直线","斜率 k = 4π²/g","故 g = 4π²/k"],"a":"作 L-T² 图线，g = 4π²/k","c":"数据处理的核心是化曲为直：先整理成 y = kx + b，斜率和截距才有物理意义","x":"记住「T² 与 L 成正比」，作 L-T² 图最省事；若作 T-L 图是曲线，斜率没有意义"}],"v":["由多组数据求平均值","作图像求物理量","分析系统误差的方向","用逐差法处理数据","为什么作图像比求平均更可靠"]}],"电容器":[{"t":"动态分析：电压不变与电量不变","f":"电容器保持接电源（U 不变）或充电后断开（Q 不变），改变板间距、正对面积或插入介质，判断 C、U、Q、E 的变化","k":"先定谁不变，再走三步链条：C = εS/(4πkd) → U = Q/C → E = U/d。断电源时 Q 不变，接电源时 U 不变","q":[{"q":"平行板电容器充电后断开电源，把板间距增大为原来的 2 倍。判断电容、电压、板间场强的变化。","s":["断开电源，电荷量 Q 保持不变","C ∝ 1/d，d 加倍则 C 减半","U = Q/C，C 减半则 U 加倍","E = U/d = 2U₀/(2d₀) = U₀/d₀，场强不变"],"a":"C 减半，U 加倍，E 不变","c":"断电源时 E 与板间距无关（E = Q/εS），这是最重要也最反直觉的结论","x":"两条极端结论覆盖全部动态分析：断电源 E = Q/(εS) 与 d 无关；接电源 E = U/d 与 d 成反比"}],"v":["U 不变时改变板间距","Q 不变时改变板间距","插入电介质后的变化","判断 C、U、Q、E 各如何变","断开电源后 E 与 d 无关"]},{"t":"电容器的电量与储能","f":"求所带电荷量、电压、储能，或计算充放电过程中通过某截面的电荷量","k":"Q = CU，储能 W = ½CU² = ½QU；通过截面的电荷量等于电容器电荷量的变化量","q":[{"q":"电容 10 μF 的电容器接在 20 V 电源上。求所带电荷量与储能；若电压升到 40 V，需再补充多少电荷？","s":["Q₁ = CU₁ = 10×10⁻⁶ × 20 = 2×10⁻⁴ C","W = ½CU₁² = ½ × 10⁻⁵ × 400 = 2×10⁻³ J","Q₂ = CU₂ = 10⁻⁵ × 40 = 4×10⁻⁴ C","ΔQ = Q₂ − Q₁ = 2×10⁻⁴ C"],"a":"2×10⁻⁴ C，储能 2×10⁻³ J；需补充 2×10⁻⁴ C","c":"Q = CU 是最基本的式子；储能公式的系数 ½ 千万别漏，它来自「电压从零逐渐升高」的过程","x":"用 W = ½QU 校验：½ × 2×10⁻⁴ × 20 = 2×10⁻³ J，与 ½CU² 一致，两个公式互为检查"}],"v":["求所带的电荷量","求电容器的储能","求充放电通过的电荷量","用 C = Q/U 计算","储能公式 E = ½CU²"]},{"t":"电容器中的带电体平衡","f":"平行板间带电液滴静止，改变板间距或电压后判断液滴如何运动","k":"液滴静止时 qE = mg；保持接电源则 U 不变，断开电源则 Q 不变","q":[{"q":"平行板电容器水平放置，板间有一质量 m、电荷量 q 的带电液滴恰好静止。现将两板间距增大为原来的 2 倍（仍接在电源上），液滴如何运动？","s":["原来静止：qE = mg，其中 E = U/d","接在电源上，电压 U 保持不变","d 变为 2d，新场强 E′ = U/(2d) = E/2","电场力变为 qE/2 = mg/2 < mg","故液滴向下加速，a = (mg − mg/2)/m = g/2"],"a":"向下加速，加速度为 g/2","c":"先判断「U 不变还是 Q 不变」：保持接电源就是 U 不变，断开电源才是 Q 不变","x":"记「U 不变时 E 与 d 成反比」，d 翻倍则 E 减半、电场力减半，方向立刻可判"}],"v":["液滴静止时求电荷量","改变板间距后如何运动","改变电压后的加速度","判断是否仍能平衡","电场力与重力平衡"]}],"电容器与带电粒子":[{"t":"示波管的全程计算","f":"电子先经加速电压、再经偏转极板、最后打在荧光屏上，求偏转距离与屏上位置","k":"加速段用 qU₁=½mv₀²，偏转段用类平抛 y=U₂L²/(4dU₁)，出板后沿直线延伸到屏","v":["求偏转极板间的偏转距离","求射出极板时的偏转角","求荧光屏上的亮点位置","判断能否射出极板"],"q":[{"q":"电子经 500 V 加速后，垂直进入长 5 cm、间距 1 cm、电压 20 V 的偏转极板。求射出时的偏转距离与偏转角的正切。","s":["加速段：eU₁ = ½mv₀²","偏转段加速度 a = eU₂/(md)，飞行时间 t = L/v₀","y = ½at² = U₂L²/(4dU₁) = 20×0.0025/(4×0.01×500) = 0.0025 m","tanθ = vᵧ/v₀ = U₂L/(2dU₁) = 20×0.05/(2×0.01×500) = 0.1"],"a":"偏转距离 0.25 cm，偏转角正切 0.1（约 5.7°）","c":"示波管三段的接头都是速度：加速段给 v₀，偏转段用 v₀，出板后用 tanθ 延伸","x":"记两个结论式：y = U₂L²/(4dU₁)、tanθ = U₂L/(2dU₁)，都与电子质量电荷量无关，代入即得"}]},{"t":"电场中运动的能量分析","f":"带电粒子在电场中加速、减速或往复运动，用动能定理求速度、路程或电势差","k":"电场力做功 W = qU 只与初末位置的电势差有关，与路径无关，直接进动能定理","v":["由加速电压求末速度","求粒子通过某点的速度","求电场力做的功","往复运动的总路程"],"q":[{"q":"质子（电荷 1.6×10⁻¹⁹ C，质量 1.6×10⁻²⁷ kg）从静止经 200 V 电压加速，求到达另一板时的速度。","s":["只有电场力做功，由动能定理 qU = ½mv²","v = √(2qU/m) = √(2×1.6×10⁻¹⁹×200/1.6×10⁻²⁷)","2×1.6×10⁻¹⁹×200 = 6.4×10⁻¹⁷，除以 1.6×10⁻²⁷ 得 4×10¹⁰","v = √(4×10¹⁰) = 2×10⁵ m/s"],"a":"到达另一板的速度为 2×10⁵ m/s","c":"加速问题一律用动能定理，不要用牛顿定律加运动学——后者还要算加速度和时间","x":"记住 v = √(2qU/m) 这个形式，同一粒子速度与 √U 成正比，电压变 4 倍速度变 2 倍"}]},{"t":"平行板电容器的动态分析","f":"改变板间距、正对面积或插入介质，判断电容、电量、场强、电势如何变化","k":"先判断「谁不变」：接电源则 U 不变，断电源则 Q 不变；再套 C=εS/(4πkd)","v":["板间距增大各量如何变","断开电源后插入介质","某点电势如何变化","静电计指针张角的变化"],"q":[{"q":"平行板电容器始终与电源相连，现将两板间距增大。判断电容、电量、板间场强如何变化。","s":["始终与电源相连，故电压 U 保持不变","由 C = εS/(4πkd)，d 增大则 C 减小","由 Q = CU，U 不变而 C 减小，故 Q 减小，电容器放电","由 E = U/d，U 不变而 d 增大，故 E 减小"],"a":"C 减小、Q 减小、E 减小、U 不变","c":"动态分析第一步永远是判断 U 不变还是 Q 不变，这一步错了后面全错","x":"只用两条式子就够：C = εS/(4πkd) 与 E = U/d，其余量都由 Q = CU 推出"}]}],"电流与电动势":[{"t":"电流的定义与微观表达式","f":"由电荷量、时间、截面积、漂移速度求电流，或反过来求电子定向移动速度","k":"宏观 I = q/t，微观 I = nqvS，两者描述的是同一个电流","v":["求通过截面的电流","求电子定向移动速度","电流的微观表达式","电解液中的电流方向"],"q":[{"q":"铜导线横截面积 1 mm²，通过 1 A 电流，自由电子数密度 8.5×10²⁸ m⁻³。求电子定向移动速度。","s":["由 I = nqvS 得 v = I/(nqS)","S = 1 mm² = 1×10⁻⁶ m²","nqS = 8.5×10²⁸×1.6×10⁻¹⁹×1×10⁻⁶ ≈ 1.36×10⁴","v = 1/(1.36×10⁴) ≈ 7.4×10⁻⁵ m/s"],"a":"电子定向移动速度约 7.4×10⁻⁵ m/s，远小于热运动速率","c":"定向移动速度很小，但电场以光速建立，所以合开关「瞬间」灯就亮，两者不矛盾","x":"先算单位体积内的电荷量 nq，再除以 S 与 I，分步算可避免指数运算出错"}]},{"t":"电动势与路端电压","f":"给出电动势、内阻与外电阻，求电流、路端电压、内电压，或比较不同连接方式","k":"E = U + Ir；路端电压总小于电动势，只有开路时两者相等","v":["求路端电压","求内电压","电动势与电压的区别","电池串联后电动势与内阻"],"q":[{"q":"一节干电池电动势 1.5 V、内阻 0.5 Ω，外接 2.5 Ω 的电阻。求电流、路端电压与内电压。","s":["I = E/(R+r) = 1.5/3 = 0.5 A","路端电压 U = IR = 0.5×2.5 = 1.25 V","内电压 U内 = Ir = 0.5×0.5 = 0.25 V","验证：U + U内 = 1.5 V = E"],"a":"电流 0.5 A，路端电压 1.25 V，内电压 0.25 V","c":"E = U + Ir 是闭合电路的基本关系；电动势由电源本身决定，与外电路无关","x":"用分压比更快：U/E = R/(R+r) = 2.5/3，直接得 U = 1.25 V，不必先算电流"}]}],"电源的功率与效率":[{"t":"U-I 图线读电源参数","f":"给出电源的 U-I 图线，求电动势、内阻，或求某电流下的路端电压与输出功率","k":"纵轴截距是电动势 E，斜率绝对值是内阻 r，横轴截距是短路电流 E/r","v":["由 U-I 图求电动势","由 U-I 图求内阻","求某电流下的输出功率","两图线交点是什么"],"q":[{"q":"某电源的 U-I 图线：纵轴截距 6 V，横轴截距 3 A。求电动势与内阻；电流 1 A 时路端电压与输出功率。","s":["纵轴截距即电动势，E = 6 V","横轴截距为短路电流，由 I短 = E/r 得 r = 6/3 = 2 Ω","I = 1 A 时 U = E − Ir = 6 − 2 = 4 V","P出 = UI = 4×1 = 4 W"],"a":"E = 6 V，r = 2 Ω；I=1 A 时 U = 4 V，P出 = 4 W","c":"U-I 图线三个特征：纵截距 E、斜率绝对值 r、横截距短路电流，看到图先抓这三个","x":"用两点式验算斜率：(6−0)/(0−3) = −2，绝对值即 r = 2 Ω，与计算一致"}]},{"t":"电源效率的计算与提高","f":"求不同外阻下的电源效率，或讨论效率与输出功率的关系","k":"η = R/(R+r)，只与外阻和内阻之比有关；外阻越大效率越高，但输出功率不一定大","v":["求电源效率","外阻增大效率如何变","效率最高时输出功率最大吗","如何提高电源效率"],"q":[{"q":"电源电动势 10 V、内阻 1 Ω，外接电阻由 4 Ω 增到 9 Ω。求两种情况下的电源效率。","s":["η = P出/P总 = I²R/(EI) = R/(R+r)","R = 4 Ω 时 η = 4/5 = 80%","R = 9 Ω 时 η = 9/10 = 90%","外阻越大效率越高，但输出功率在 R = r 时才是最大"],"a":"分别为 80% 与 90%","c":"效率只看 R/(R+r)，与外电阻同向变化；「效率最高」与「功率最大」是两个不同的问题","x":"看两个极端：R→0 时 η→0（短路），R→∞ 时 η→100%（开路），中间单调上升"}]}],"电磁学":[{"t":"电场中力与能两条线索","f":"带电体在电场中平衡、加速或做曲线运动，求场强、加速度、速度或电势差","k":"力的线索走 F=qE 加牛顿定律，能的线索走 W=qU 加动能定理，先看题目给的是力还是能","v":["带电微粒在电场中平衡","由加速电压求速度","电场中求某点电势差","力与能两条路如何选"],"q":[{"q":"质量 m、电荷量 q 的带负电微粒在竖直向下的匀强电场中匀速下落。求场强；若场强加倍，求加速度。","s":["匀速下落说明合力为零：电场力竖直向上，与重力平衡","qE = mg，得 E = mg/q","场强加倍为 2E 时，电场力变为 2mg，方向向上","合力为 mg 向上，故 a = g，方向竖直向上"],"a":"E = mg/q；场强加倍后加速度为 g，方向竖直向上","c":"电场中的力学问题与纯力学完全一样，只是多了一个 qE，先受力分析再谈别的","x":"用「等效重力」看：把 qE 与 mg 的合力当成等效重力，场强加倍相当于等效重力反向，加速度立刻得出"}]},{"t":"电磁感应中的力电综合","f":"导体棒切割磁感线，求感应电动势、电流、安培力，或求最终速度与产生的热量","k":"链条固定：E=BLv → I=E/R → F=BIL → 牛顿第二定律或能量关系","v":["求感应电动势与电流","求安培力与加速度","求导体棒的最终速度","求回路产生的热量"],"q":[{"q":"长 0.5 m 的导体棒在 0.4 T 的匀强磁场中以 5 m/s 垂直切割磁感线，回路总电阻 0.5 Ω。求感应电动势、感应电流与安培力。","s":["E = BLv = 0.4×0.5×5 = 1 V","I = E/R = 1/0.5 = 2 A","F = BIL = 0.4×2×0.5 = 0.4 N","安培力方向与运动方向相反，起阻碍作用"],"a":"电动势 1 V，电流 2 A，安培力 0.4 N，方向与运动方向相反","c":"切割问题的链条是固定的：E → I → F → a 或能量，一步不能跳","x":"用功率验算：电功率 EI = 2 W，恰好等于克服安培力做功的功率 Fv = 0.4×5 = 2 W，两条线自洽"}]}],"电磁感应":[{"t":"感应电流方向的判断","f":"判断线圈进出磁场、磁铁插入拔出、磁场变化时的感应电流方向与受力方向","k":"楞次定律「增反减同」定感应磁场方向，再用安培定则定电流方向；切割磁感线时用右手定则更快","q":[{"q":"矩形闭合线圈从磁场外进入垂直纸面向里的匀强磁场区域。判断进入过程中感应电流的方向；若穿出磁场，方向又如何？","s":["进入时穿过线圈的向里磁通量在增加","感应电流的磁场要阻碍增加，故方向向外","由安培定则，电流方向为逆时针","穿出磁场时磁通量减少，感应磁场向里，电流变为顺时针"],"a":"进入时逆时针，穿出时顺时针","c":"「增反减同」是全部方向判断的源头：先看磁通量是增还是减，再定感应磁场方向，最后定电流","x":"用力学表述校验：「来拒去留」——进入时受排斥、穿出时受吸引，与电流方向的结论互为印证"}],"v":["线圈进出磁场时的电流方向","磁铁插入拔出时的电流方向","磁场变化时的电流方向","判断线圈受到的安培力方向","用楞次定律或右手定则"]},{"t":"电磁感应中的能量与电荷量","f":"求产生的焦耳热、通过截面的电荷量、外力做的功或功率","k":"安培力做负功等于电能增加，最终等于焦耳热；q = nΔΦ/R 只与磁通量变化有关，与时间无关","q":[{"q":"质量 0.1 kg 的导体棒在导轨上以 2 m/s 匀速运动，B = 0.5 T，棒长 0.4 m，回路总电阻 0.2 Ω。求感应电动势、电流、安培力与外力的功率。","s":["E = BLv = 0.5×0.4×2 = 0.4 V","I = E/R = 0.4/0.2 = 2 A","F = BIL = 0.5×2×0.4 = 0.4 N","外力功率 P = Fv = 0.8 W，恰好等于 I²R = 4×0.2 = 0.8 W"],"a":"E = 0.4 V，I = 2 A，F = 0.4 N，功率 0.8 W","c":"匀速运动时外力做的功全部转化为焦耳热，P外 = Fv = I²R = E²/R 三个式子必然相等，可用来验算","x":"直接用 P = B²L²v²/R 一步求功率，跳过电流与力的中间计算"}],"v":["求产生的焦耳热","求通过截面的电荷量 q = nΔΦ/R","求外力做的功","求外力的功率","能量守恒的分配"]},{"t":"导体棒切割时两端电势的高低","f":"判断切割磁感线的导体棒哪端电势高，或求两端的电势差","k":"把导体棒看成电源，内部电流从低电势流向高电势；先用右手定则定电流方向，再判断哪端是正极","q":[{"q":"导体棒在垂直纸面向里的匀强磁场中向右运动，判断棒两端哪端电势高。","s":["右手定则：磁感线穿入掌心（手心向外），拇指指向运动方向（向右）","四指指向感应电流方向，即向下","棒相当于电源，内部电流由负极流向正极","故下端电势高"],"a":"下端（电流流出的一端）电势高","c":"棒内电流从低电势流向高电势，这是「电源内部」的规则，与外部电路正好相反","x":"记「右手定则定电流，电流流出端是正极」，两步搞定"}],"v":["判断哪端电势高","求两端的电势差","把棒看成电源处理","电流流出端是正极","内外电路的电压分配"]}],"电磁感应现象":[{"t":"产生感应电流的条件","f":"给出线圈平移、转动、进出磁场等操作，判断能否产生感应电流","k":"条件只有一条：穿过闭合回路的磁通量发生变化；与是否切割磁感线无关","v":["判断能否产生感应电流","磁通量是否发生变化","切割磁感线一定产生电流吗","线圈进出磁场的过程"],"q":[{"q":"判断下列情况能否产生感应电流：A 线圈在匀强磁场中平移；B 线圈绕垂直于磁场的轴转动；C 线圈绕平行于磁场的轴转动；D 磁铁插入线圈。","s":["判断依据：Φ = BS cosθ 是否发生变化","A 平移：B、S、夹角都不变，Φ 不变，无感应电流","B 转动：夹角 θ 变化，Φ 变化，有感应电流（这正是发电机的原理）","C 绕平行于 B 的轴转动：线圈在垂直 B 方向的投影不变，Φ 不变，无感应电流","D 插入磁铁：线圈处 B 变化，Φ 变化，有感应电流"],"a":"B 和 D 有感应电流，A 和 C 没有","c":"只看 Φ = BS cosθ 有没有变，三个因素任一变都可能产生电流，也可能互相抵消","x":"极端检验：把线圈想成「框住多少条磁感线」，框住的条数变了才有电流，条数不变就没有"}]},{"t":"磁通量变化的图像问题","f":"给出 Φ-t 图或 B-t 图，判断感应电动势的大小与变化，或求某段时间的平均电动势","k":"E = nΔΦ/Δt 就是 Φ-t 图线的斜率；斜率恒定则电动势恒定，斜率为零则无电动势","v":["由 Φ-t 图判断电动势大小","由 B-t 图求感应电动势","哪段时间没有感应电流","图像斜率与电动势的关系"],"q":[{"q":"面积 0.2 m² 的线圈 100 匝，磁场 B 在 0–2 s 内由 0.1 T 均匀增到 0.5 T，2–4 s 内保持不变。求各段的感应电动势。","s":["0–2 s：ΔB/Δt = (0.5 − 0.1)/2 = 0.2 T/s","E = nS·ΔB/Δt = 100×0.2×0.2 = 4 V","2–4 s：B 不变，ΔΦ/Δt = 0，E = 0","故前 2 s 有 4 V 的恒定电动势，后 2 s 无感应电动势"],"a":"0–2 s 为 4 V，2–4 s 为 0","c":"Φ-t（或 B-t）图线的斜率就是 ΔΦ/Δt，斜率恒定则电动势恒定，斜率变化则电动势变化","x":"先算「每秒变化多少韦伯」再乘匝数：0.2 m²×0.2 T/s = 0.04 Wb/s，乘 100 得 4 V，比套公式直观"}]}],"电磁振荡":[{"t":"LC 振荡的周期与频率","f":"已知电感与电容，求振荡周期与频率；或改变 L、C 后判断周期如何变化","k":"T = 2π√(LC)，周期只由 L 与 C 决定，与初始电量、是否插入铁芯无关（除铁芯改变 L 外）","v":["求 LC 振荡的周期","求振荡频率","电容加倍周期如何变","如何提高振荡频率"],"q":[{"q":"LC 振荡电路中电感 0.1 H、电容 10 μF。求振荡周期与频率。","s":["T = 2π√(LC) = 2π√(0.1×10×10⁻⁶)","LC = 1×10⁻⁶，开方得 1×10⁻³","T = 2π×10⁻³ ≈ 6.28×10⁻³ s","f = 1/T ≈ 159 Hz"],"a":"周期约 6.28×10⁻³ s，频率约 159 Hz","c":"T = 2π√(LC) 与单摆的 2π√(L/g) 形式相同：固有周期只由元件参数决定","x":"先算 LC 的数量级再开方，可避免指数运算出错；L 增大 4 倍则周期变 2 倍"}]},{"t":"振荡过程中的状态对应","f":"判断某时刻电量、电流、电场能、磁场能的大小关系，或某段时间内的变化趋势","k":"电量最大↔电流为零↔电场能最大；电量为零↔电流最大↔磁场能最大","v":["放电完毕瞬间各量是多少","充电过程中电流如何变","何时磁场能最大","能量在哪些形式间转化"],"q":[{"q":"LC 振荡电路中，电容器放电完毕的瞬间，电路中的电流、电容器电量、线圈中的磁场能各是什么情况？","s":["放电完毕时电容器电量 q = 0，极板间电压为零","此时电流达到最大值","电场能全部转化为磁场能，磁场能最大","随后线圈的自感作用使电流继续流动，开始反向充电"],"a":"电量 0、电流最大、磁场能最大","c":"「电量最大↔电流为零」「电量为零↔电流最大」两组状态交替出现，能量在电场能与磁场能之间来回转化","x":"类比弹簧振子：电量像位移、电流像速度，位移最大时速度为零，一一对应"}]}],"电磁振荡与电磁波":[{"t":"电磁波的产生与传播","f":"已知频率、波长或波速中的两个，求第三个；或判断电磁波进入介质后各量如何变化","k":"c = λf；进入介质后频率不变、波速变为 c/n、波长同比例改变","v":["由频率求波长","电磁波进入介质后波长如何变","求电磁波在介质中的速度","不同波段波长比较"],"q":[{"q":"某电台发射频率 100 MHz 的电磁波。求它在真空中的波长；若进入折射率 1.5 的介质，波长变为多少？","s":["真空中 λ = c/f = 3×10⁸/1×10⁸ = 3 m","进入介质后频率由波源决定，保持不变","介质中波速 v = c/n = 3×10⁸/1.5 = 2×10⁸ m/s","λ′ = v/f = 2 m"],"a":"真空中波长 3 m；介质中 2 m，频率仍为 100 MHz","c":"电磁波跨介质与机械波规律相同：频率不变、波速改变、波长随之改变","x":"用比例看：n = 1.5 则 v 变为原来的 2/3，波长也变 2/3，3 m → 2 m，一步得出"}]},{"t":"电磁波的发射与接收","f":"考查调制、调谐、解调的作用，或判断接收电路如何选台","k":"调谐是让接收电路的固有频率与来波频率相同（电谐振），调制是把低频信号搭载到高频载波上","v":["调谐改变的是什么","为什么要调制","解调的作用","如何改变接收频率"],"q":[{"q":"收音机通过调谐选台，实质上改变的是什么？为什么声音信号必须经过调制才能发射？","s":["调谐是改变接收电路的固有频率，使其与目标电台的频率相同而发生电谐振","由 f = 1/(2π√(LC))，改变电容或电感即可改变固有频率","声音信号频率低，直接发射所需天线极长、辐射效率极低","故把声音信号搭载到高频电磁波（载波）上，这就是调制；接收端再解调还原"],"a":"调谐改变的是接收电路的固有频率；调制是为了让低频信号搭上高频载波","c":"调谐 = 电谐振 = 固有频率与来波频率相等，这是选台的物理本质","x":"从共振理解：调谐就是让接收电路与来波「共振」，与机械共振完全同理"}]},{"t":"电磁波与机械波的对比","f":"比较电磁波与机械波的异同，或判断某现象属于哪一类波","k":"两者都满足 v = λf、都能干涉衍射；区别在于是否需要介质、传播的是振动还是场","v":["电磁波与机械波的区别","能否在真空中传播","两者的共同点","哪种波速度最大"],"q":[{"q":"比较电磁波与机械波的相同点与不同点。","s":["相同：都满足 v = λf，都能发生干涉、衍射、反射与折射","不同：机械波必须依靠介质，电磁波不需要介质","机械波传播的是质点的振动，电磁波传播的是电场与磁场的交替变化","机械波在真空中无法传播，电磁波在真空中速度最大，为 3×10⁸ m/s"],"a":"波的共性相同，本质与介质要求不同","c":"一句话概括：机械波传的是「振动」，电磁波传的是「场」","x":"最快的判别标准：能不能在真空中传播——能则是电磁波，不能则是机械波"}]}],"电磁波谱":[{"t":"电磁波谱的排列与特性","f":"按波长或频率排列各波段，或判断某波段的特性（穿透能力、热效应、电离能力）","k":"波长由长到短：无线电波、红外线、可见光、紫外线、X 射线、γ 射线；频率与能量反向递增","v":["按波长排列各波段","哪个波段频率最高","穿透能力最强的是哪种","可见光在谱中的位置"],"q":[{"q":"按波长由长到短排列无线电波、红外线、可见光、紫外线、X 射线、γ 射线，并各举一个典型应用。","s":["波长由长到短：无线电波 > 红外线 > 可见光 > 紫外线 > X 射线 > γ 射线","频率由低到高，顺序与波长相反；光子能量也随频率升高而增大","无线电波用于通信广播；红外线用于遥感、遥控与热成像","紫外线用于杀菌与荧光；X 射线用于透视；γ 射线用于治疗与探伤"],"a":"顺序如上，应用见步骤 3、4","c":"记住「波长变短、频率变高、能量变大」这三条同向变化，顺序就不会记反","x":"用「红橙黄绿蓝靛紫」把可见光夹在中间：左边无线电与红外，右边紫外、X、γ，位置一次记牢"}]},{"t":"各波段的应用原理","f":"解释为什么某波段有某种用途（夜视、杀菌、透视、加热），从波长与能量角度分析","k":"波长越短、频率越高、光子能量越大，电离与穿透能力越强；波长越长越容易衍射、越适合通信","v":["红外线为什么能夜视","紫外线为什么能杀菌","X 射线为什么能透视","微波炉加热的原理"],"q":[{"q":"为什么红外线可用于夜视仪，而紫外线可用于杀菌消毒？","s":["一切物体都在辐射红外线，温度越高辐射越强","夜视仪探测物体自身发出的红外线，故在黑暗中也能成像","紫外线的光子能量较大，能破坏蛋白质与核酸的结构","故紫外线可杀菌消毒，但过量照射对人体有害"],"a":"红外线利用「一切物体都辐射红外线」；紫外线利用其光子能量大、能破坏生物分子","c":"「波长越短、频率越高、光子能量越大」，这条链决定各波段的应用方向","x":"从能量统一看：γ 射线能量最大可破坏细胞，红外能量小只能被探测，应用差别本质是能量差别"}]}],"电能与能量守恒":[{"t":"闭合电路的功率分配","f":"给定电动势、内阻与外电阻，求总功率、输出功率、内耗功率与效率","k":"P总 = EI，P出 = I²R = UI，P内 = I²r，三者满足 P总 = P出 + P内","v":["求电源的总功率","求输出功率与内耗功率","求电源效率","功率如何分配"],"q":[{"q":"电源电动势 12 V、内阻 1 Ω，外接 5 Ω 电阻。求总功率、输出功率、内耗功率与效率。","s":["I = E/(R+r) = 12/6 = 2 A","总功率 P总 = EI = 24 W","输出功率 P出 = I²R = 4×5 = 20 W，内耗 P内 = I²r = 4 W","效率 η = 20/24 ≈ 83.3%"],"a":"总功率 24 W，输出 20 W，内耗 4 W，效率约 83.3%","c":"闭合电路的功率分配永远满足 P总 = P出 + P内，且 P总 = EI 而不是 I²R","x":"用分压比分功率：P出/P总 = R/(R+r) = 5/6，直接得 20 W，不必先算电流"}]},{"t":"含电动机的电路","f":"电源与电动机串联，求电动机两端电压、输出机械功率或发热功率","k":"电动机不能对整个电路用欧姆定律，必须由 E、r、I 先求路端电压","v":["求电动机两端电压","求输出机械功率","求电动机发热功率","电动机卡住时电流多大"],"q":[{"q":"电源电动势 12 V、内阻 0.5 Ω，接一台线圈电阻 1 Ω 的电动机，正常工作时电流 2 A。求电动机两端电压与输出机械功率。","s":["路端电压 U = E − Ir = 12 − 2×0.5 = 11 V，即电动机两端电压","电动机输入功率 P入 = UI = 11×2 = 22 W","发热功率 P热 = I²R = 4×1 = 4 W","输出机械功率 P出 = 22 − 4 = 18 W"],"a":"电动机两端电压 11 V，输出机械功率 18 W","c":"含电动机时不能用 U = IR 求电压，必须先走「E − Ir = U」这条正路","x":"用总账检查：EI = 24 W，分成内阻 2 W、电机发热 4 W、机械 18 W，加起来正好"}]},{"t":"电源输出功率的最大值","f":"外电阻可变，求输出功率最大时的外阻与最大功率，或讨论功率随外阻的变化","k":"R = r 时输出功率最大，Pmax = E²/(4r)，此时效率只有 50%","v":["求最大输出功率","外阻为多少时输出最大","输出功率随外阻如何变","最大功率时的效率"],"q":[{"q":"电源电动势 6 V、内阻 2 Ω，外接可变电阻 R。求 R 为多少时输出功率最大，最大值是多少。","s":["P出 = I²R = E²R/(R+r)²","分子分母同除以 R：P出 = E²/(R + 2r + r²/R)","由均值不等式，R = r = 2 Ω 时分母最小，P出 最大","Pmax = E²/(4r) = 36/8 = 4.5 W"],"a":"R = 2 Ω 时输出功率最大，为 4.5 W","c":"「R = r 时输出功率最大」是固定结论，但此时效率只有 50%，工程上并不追求这一点","x":"记 P出-R 图像：从原点上升，在 R=r 处到顶，之后缓慢下降，顶点坐标 (r, E²/4r)"}]}],"电能的输送":[{"t":"输电线路的损耗计算","f":"已知输送功率、输电电压与线路电阻，求电流、功率损失与电压损失","k":"I = P/U，P损 = I²R，U损 = IR；提高电压能成平方地降低损耗","v":["求输电线上的电流","求功率损失","求线路电压损失","不同电压下损耗之比"],"q":[{"q":"输送功率 100 kW，输电线总电阻 10 Ω。分别用 500 V 与 10 kV 输电，求功率损失之比。","s":["500 V 时 I = 100000/500 = 200 A，P损 = I²R = 4×10⁴×10 = 4×10⁵ W","10 kV 时 I = 100000/10000 = 10 A，P损 = 100×10 = 1000 W","比值 400000 : 1000 = 400 : 1","电压升到 20 倍，损耗降到 1/400"],"a":"功率损失之比为 400 : 1","c":"P损 = I²R 且 I = P/U，故 P损 ∝ 1/U²，电压升 n 倍损耗降 n² 倍","x":"直接用平方关系：电压比 20，损耗比 1/400，不必算两次电流"}]},{"t":"高压输电的原理与选择","f":"解释为什么远距离输电要用高压，或比较加粗导线与升压两种方案","k":"减小损耗有两条路：减小 R（加粗导线，成本高）或减小 I（升压，效果成平方）","v":["为什么用高压输电","加粗导线与升压哪个好","输电电压越高越好吗","线路损耗与哪些因素有关"],"q":[{"q":"为什么远距离输电要用高压，而不是单纯增大导线截面积？","s":["减小损耗有两条路：减小线路电阻 R，或减小输电电流 I","减小 R 需加粗导线，耗铜量大、成本高、架设困难","由 I = P/U，提高输电电压可直接减小电流","且 P损 ∝ I²，电流减半损耗降为 1/4，效果远好于加粗导线"],"a":"升压能成平方地降低损耗，经济性远优于加粗导线","c":"输电问题的核心式只有两个：I = P/U 与 P损 = I²R
