，斜率是 h/e","q":[{"q":"某金属的逸出功为 2.0 eV，用能量 3.0 eV 的光子照射。求光电子的最大初动能与遏止电压。","s":["Ek = hν − W₀ = 3.0 − 2.0 = 1.0 eV","遏止电压满足 eU_c = Ek","U_c = 1.0 V","截止频率由 ν₀ = W₀/h 求得，低于它无论光多强都不发生光电效应"],"a":"最大初动能 1.0 eV，遏止电压 1.0 V","c":"用 eV 作能量单位时，Ek 的数值与遏止电压的数值（伏特）相等，这是最省事的算法","x":"记 eU_c = Ek：数值上 U_c(V) = Ek(eV)，不必换算成焦耳再除 e"}],"v":["由遏止电压求最大初动能","求金属的逸出功","由逸出功求截止频率","用 eUc = Ek 计算","遏止电压与光强无关"]},{"t":"光电效应的 I-U 图像","f":"由 I-U 图读出饱和电流与遏止电压，判断光强或频率改变时图线如何变化","k":"横轴截距的绝对值是遏止电压 Uc，纵轴平台是饱和电流；光强只改饱和电流，频率只改遏止电压","q":[{"q":"同一光电管，保持入射光频率不变而增大光强，I-U 图线如何变化？","s":["频率不变，最大初动能不变，遏止电压 Uc 不变，横轴截距不动","光强增大，单位时间入射光子数增多，光电子数增多","饱和电流由光电子数决定，故纵轴平台升高","图线整体「向上抬」，但左端截距位置不变"],"a":"遏止电压不变，饱和电流增大，图线整体上移","c":"「光强管高度、频率管左右」——I-U 图的所有选项都能用这一句判断","x":"看图先标两个特征量：横轴截距（Uc）、纵轴平台（Im），再问变的是光强还是频率"}],"v":["读出饱和电流","读出遏止电压","光强改变时图线如何变","频率改变时图线如何变","光强管高度、频率管左右"]}],"光的偏振":[{"t":"偏振片与透射光强","f":"判断通过一个或两个偏振片后的光强，或求偏振化方向的夹角","k":"自然光通过第一个偏振片后变为线偏振光、光强减半；再通过第二个偏振片时按 cos²θ 变化","q":[{"q":"自然光依次通过两个偏振片，两偏振化方向夹角 60°。求透射光强与入射光强之比。","s":["通过第一个偏振片后，光强变为 I₀/2","通过第二个偏振片后 I = (I₀/2)cos²60°","cos60° = 0.5，cos²60° = 0.25","I = I₀/8"],"a":"I₀/8","c":"自然光先减半、再用 cos²θ，两步不能合并，漏掉减半是最常见的错","x":"记「自然光过第一片必减半」，这一步是整道题的起点"}],"v":["判断通过一个偏振片后的光强","两片正交时为何全暗","求偏振化方向的夹角","用 I = I₀cos²θ 计算","自然光通过第一片后减半"]},{"t":"偏振与横波的判定","f":"判断某现象能否说明光是横波，或解释立体电影、液晶显示的原理","k":"只有横波才有偏振现象，偏振是区分横波与纵波的唯一判据","q":[{"q":"如何用实验证明光是横波？","s":["让光通过偏振片，转动偏振片并观察透射光强","光强随转动角度明显变化","说明光的振动方向具有选择性，只在某一方向上通过","只有横波才具有这种性质，故光是横波"],"a":"转动偏振片时光强随角度变化，即可证明光是横波","c":"「有偏振现象 → 是横波」是充要关系；声波是纵波，无论怎么转都不会出现偏振","x":"一句话：能「只放行一个振动方向」的波，就是横波"}],"v":["判断某现象能否说明光是横波","解释立体电影的原理","液晶显示的原理","纵波能否发生偏振","偏振是横波特有的现象"]},{"t":"偏振光的应用","f":"解释立体电影、液晶显示、摄影减反等应用中的偏振原理","k":"偏振片只让某一方向的光振动通过；两片正交则全暗，夹角为 θ 时透射光强 I = I₀cos²θ","q":[{"q":"立体电影为什么让观众戴两片偏振方向互相垂直的眼镜？","s":["拍摄时用两个镜头分别记录左右眼画面，并让两束投影光的偏振方向互相垂直","左眼镜片只透过一种偏振方向的光，右眼镜片只透过另一种","于是左右眼分别看到对应画面，大脑合成后产生立体感","若摘下眼镜，两种画面同时进入双眼，看到的就是重影"],"a":"用互相垂直的偏振方向把左右眼画面筛开","c":"偏振的核心作用就一句：把「同时到达」的两束光按振动方向筛开","x":"凡是应用类问题都往「筛方向」上想：立体电影筛画面、液晶筛像素、摄影筛反射光"}],"v":["立体电影为什么戴偏振眼镜","液晶显示如何控制明暗","摄影如何用偏振镜减反","都归结为「筛方向」","偏振片在生活中的应用"]}],"光的干涉":[{"t":"条纹间距的定量计算","f":"由实验数据求波长、双缝间距，或判断条纹间距如何变化","k":"Δx = Lλ/d；波长变大、屏距变大、缝距变小，条纹都会变宽","q":[{"q":"双缝间距 0.2 mm，双缝到屏的距离 1 m，测得相邻亮纹间距 3 mm。求所用光的波长。","s":["由 Δx = Lλ/d 得 λ = Δx·d/L","= 3×10⁻³ × 0.2×10⁻³ ÷ 1","= 6×10⁻⁷ m","即 600 nm，属红光范围"],"a":"600 nm","c":"三个量的单位必须统一成米再计算，mm 与 nm 混用是本节最常见的失分点","x":"判断变化方向不必代数值：λ↑ 或 L↑ 或 d↓，Δx 都变大"}],"v":["由实验数据求波长","由条纹间距反求双缝间距","判断条纹间距如何变化","用 Δx = Lλ/d 计算","换用不同色光后如何变"]},{"t":"干涉条纹与衍射条纹的辨析","f":"判断某图样是干涉还是衍射，或比较两种条纹的特征","k":"干涉条纹等间距、明暗相间；单缝衍射条纹中央最宽最亮，两侧迅速变窄变暗","q":[{"q":"某图样中央条纹最亮最宽，两侧条纹宽度迅速减小。这是干涉图样还是衍射图样？","s":["干涉条纹的特征是等间距、明暗宽度基本一致","衍射条纹的特征是中央最宽最亮，两侧迅速变窄变暗","该图样符合衍射特征","故为单缝衍射图样"],"a":"衍射图样","c":"判据只有一条：等间距是干涉，中央宽两侧窄是衍射","x":"记六个字「干涉等宽、衍射中宽」，一眼分辨，不必计算"}],"v":["判断某图样是干涉还是衍射","比较两种条纹的特征","条纹是否等间距等宽","中央条纹的宽度与亮度","单缝与双缝的图样差别"]},{"t":"相干条件与相干光源的获得","f":"判断能否产生稳定干涉，或说明为什么必须用同一光源分光","k":"相干条件：频率相同、相位差恒定、振动方向相同；普通独立光源不满足，故用分光法获得相干光","q":[{"q":"两只完全相同的灯泡照在同一处，为什么看不到干涉条纹？","s":["干涉要求两束光频率相同且相位差恒定","两只灯泡的发光是大量原子独立的自发辐射，相位随机且不断变化","相位差在观察时间内快速随机变化，干涉图样被平均掉","故只看到均匀照亮；双缝干涉用同一束光分光，才满足相位差恒定的要求"],"a":"因为两个独立光源的相位差随机变化，不满足相干条件","c":"「同频率 + 恒相位差」是干涉的两个必要条件，缺一不可；普通光源靠分光解决第二条","x":"问「为什么不干涉」答相位差不恒定；问「怎样才能干涉」答用同一光源分光"}],"v":["判断能否产生稳定干涉","为什么必须用同一光源分光","两只灯泡为什么不干涉","用分光法获得相干光","频率相同与相位差恒定"]}],"光的折射":[{"t":"折射定律与视深问题","f":"求折射角、入射角、视深、侧移量，或作光路图","k":"n = sinθ₁/sinθ₂；从正上方看水中的物体，视深 h′ = h/n，看起来变浅","q":[{"q":"水深 1.2 m，水的折射率 4/3。从正上方观察池底，视深是多少？","s":["正上方观察时用视深公式 h′ = h/n","h′ = 1.2 ÷ (4/3)","= 1.2 × 3/4 = 0.9 m","看起来比实际浅 0.3 m"],"a":"0.9 m","c":"视深公式只适用于「正上方观察」的近似；斜视时必须用折射定律作光路图求解","x":"记住「水中物体看起来变浅、变近」，n 越大看起来越浅，可用于快速判断选项"}],"v":["求折射角或入射角","求水池的视深","求光线通过介质层的侧移量","作光路图分析"]},{"t":"色散与不同色光的比较","f":"比较白光经棱镜后的偏折程度，或比较不同色光在同一介质中的速度、临界角","k":"频率越高（紫光）折射率越大、偏折越大、介质中速度越小、临界角越小","q":[{"q":"红光与紫光以相同入射角从空气射入水中，哪种光偏折更大？哪种光的临界角更小？","s":["紫光频率高，水对紫光的折射率更大","由 n = sinθ₁/sinθ₂，n 大则折射角小，偏折更明显","由 sinC = 1/n，n 大则临界角小","故紫光偏折更大、临界角更小、更容易发生全反射"],"a":"紫光偏折更大，临界角更小","c":"一条主线贯穿全部结论：频率高 → n 大 → 偏折大 → 速度小 → 临界角小","x":"只记「紫偏折大、红偏折小」，其余结论都能由 n 的大小关系推出来，不必死背"}],"v":["白光经棱镜后的偏折顺序","比较不同色光在介质中的速度","比较临界角的大小","红光的偏折最小、紫光最大","同一介质对不同色光的 n 不同"]},{"t":"平行玻璃砖中的侧移","f":"求光通过平行玻璃砖后的侧移量，或判断出射光线的方向","k":"出射光线与入射光线平行，只发生侧移；侧移量随入射角增大、砖变厚而增大","q":[{"q":"一束光以 60° 入射到厚度为 d 的平行玻璃砖上表面，折射率为 n。判断出射光线的方向。","s":["上表面折射：n₁sin60° = n·sin r₁","下表面入射角等于 r₁（两表面平行，内错角相等）","下表面折射：n·sin r₁ = n₁·sin r₂","得 sin r₂ = sin60°，r₂ = 60°，故出射光线与入射光线平行"],"a":"出射光线与入射光线平行，只发生侧移","c":"「平行砖不改方向、只改位置」——先下这个判断，可以省掉大量计算","x":"两表面平行则入射角与出射角必然相等，方向一定平行，剩下只需算侧移量"}],"v":["求通过玻璃砖的侧移量","判断出射光线的方向","出射光与入射光平行","砖越厚、入射角越大侧移越大","两表面平行的几何关系"]}],"光的衍射":[{"t":"明显衍射的条件","f":"判断能否观察到明显衍射，或解释为什么日常看不到光的衍射","k":"障碍物或孔的尺寸与波长相差不多或更小时，衍射才明显；可见光波长约 10⁻⁷ m，远小于日常物体","q":[{"q":"为什么声波容易绕过障碍物，而光波不容易？","s":["发生明显衍射的条件是障碍物尺寸与波长相差不多或更小","声波波长可达米级，与日常障碍物尺寸接近，容易衍射","光波波长仅 10⁻⁷ m 量级，远小于日常物体","故声波容易绕过障碍物，光波几乎沿直线传播"],"a":"因为声波波长与障碍物尺寸相近，而光波波长远小于障碍物","c":"一切衍射问题都归结为「波长与障碍物尺寸的比较」，这是唯一判据","x":"记「波长越长越容易衍射」：无线电波能绕过山丘、激光不能，都是这个道理"}],"v":["判断能否观察到明显衍射","为什么日常生活中看不到","缝宽与波长的比较","条件是「相差不多」不是「必须更小」","缝越窄衍射越明显"]},{"t":"衍射条纹的特征","f":"判断条纹特征、区分干涉与衍射图样，或判断缝宽变化的影响","k":"单缝衍射条纹中央最宽最亮，两侧宽度与亮度迅速减小；缝越窄，中央条纹越宽、亮度越暗","q":[{"q":"单缝衍射实验中把缝宽减小，中央亮纹如何变化？","s":["缝越窄，衍射现象越明显","中央亮纹变得更宽","通过的光减少，亮度减弱","两侧条纹的间距也相应变大"],"a":"中央亮纹变宽、亮度减弱","c":"「缝窄则条纹宽、亮度暗」是单缝衍射的核心规律","x":"与双缝对照：d 减小则 Δx 增大，方向一致，都符合「限制越强、扩展越大」"}],"v":["判断条纹的宽度与亮度特征","区分干涉与衍射图样","缝宽变化的影响","中央亮纹最宽最亮","条纹不等间距"]},{"t":"衍射光栅与光谱分析","f":"用光栅方程求亮纹位置，或比较不同波长在同一光栅下的分离程度","k":"光栅方程 d·sinθ = kλ（d 为光栅常数）；波长越长，同级亮纹的衍射角越大","q":[{"q":"光栅常数 d = 2×10⁻⁶ m 的光栅，用 λ = 500 nm 的光垂直照射。求第一级亮纹衍射角的正弦值。","s":["光栅方程 d·sinθ = kλ，取 k = 1","sinθ = λ/d = 500×10⁻⁹ / (2×10⁻⁶)","= 5×10⁻⁷ / 2×10⁻⁶ = 0.25","θ = arcsin0.25 ≈ 14.5°"],"a":"sinθ = 0.25，θ ≈ 14.5°","c":"光栅方程比双缝公式更好用：直接用 d·sinθ = kλ，不必再借 L 与 x","x":"先统一成米再代公式；k = 1 求第一级，注意 sinθ ≤ 1 限制了能出现的最大级次"}],"v":["用光栅方程求亮纹位置","比较不同波长的分离程度","求能出现的最大级次","d·sinθ = kλ 的应用","光栅比双缝更亮更细"]}],"全反射":[{"t":"临界角的计算与全反射判断","f":"求临界角、判断能否全反射，或求水面光斑的半径","k":"sinC = 1/n；必须同时满足两个条件：光从光密介质射向光疏介质、入射角大于临界角","q":[{"q":"折射率 √2 的介质与空气的界面，临界角多大？若点光源位于水面下 1 m 处（n = 4/3），水面上透光圆斑的半径约多少？","s":["sinC = 1/√2，得 C = 45°","水面情形：sinC = 3/4，C ≈ 48.6°","光斑半径 r = h·tanC = 1×tan48.6°","r ≈ 1.13 m"],"a":"45°；光斑半径约 1.13 m","c":"两个条件必须同时满足：光密射向光疏 + 入射角大于临界角。少一条就不能全反射","x":"光斑半径直接用 r = h/√(n²−1)：1/√(16/9−1) = 1/√(7/9) ≈ 1.13 m，一步出"}],"v":["求临界角 C","判断能否发生全反射","求水面光斑的半径","用 sinC = 1/n 计算","由光密到光疏才可能全反射"]},{"t":"棱镜中的全反射光路","f":"判断光在棱镜、玻璃砖、光纤中的全反射路径，或求射出方向","k":"全反射时没有折射光，光线全部返回原介质，反射角等于入射角","q":[{"q":"等腰直角玻璃棱镜（n = 1.5）斜边朝上，光垂直射入一条直角边。判断光在斜边处是否发生全反射。","s":["光垂直入射直角边，方向不变进入棱镜","射到斜边时，入射角为 45°","临界角 sinC = 1/1.5 ≈ 0.667，C ≈ 41.8°","45° > 41.8°，发生全反射，光线沿另一条直角边方向射出"],"a":"发生全反射，光沿另一条直角边方向射出","c":"判断顺序固定：先算临界角、再比入射角、最后画光路。棱镜题里 45° 是最常见的入射角","x":"记「n ≥ √2 ≈ 1.41 时 45° 入射必然全反射」，玻璃（1.5）恒满足，可秒判"}],"v":["判断光在棱镜中的路径","求光线射出棱镜的方向","全反射棱镜的应用","玻璃砖中的光路","多次反射的作图"]},{"t":"点光源照亮水面的圆形光斑","f":"求水下点光源在水面形成的亮圆半径，或判断岸上能看到的水面范围","k":"临界角满足 sinC = 1/n，亮圆半径 r = h·tanC；圆外光线全部全反射回水中","q":[{"q":"深 h = 2 m 的水池底部有一点光源，水的折射率 n = 4/3。求水面亮圆的半径。","s":["临界角满足 sinC = 1/n = 3/4","由 sinC = 0.75 得 cosC = √(1 − 0.5625) ≈ 0.661，tanC ≈ 1.134","r = h·tanC = 2 × 1.134 ≈ 2.27 m","圆内光线可折射出水形成亮区，圆外全部全反射"],"a":"约 2.3 m","c":"光斑题只有两步：由 n 求临界角 C，再由 r = h·tanC 求半径。水 n = 4/3 时 tanC ≈ 1.13，可记","x":"sinC = 3/4 是常见值，直接记 tanC ≈ 1.13；若 n = √2 则 C = 45°、tanC = 1，更快"}],"v":["求亮圆的半径","判断岸上能看到的水面范围","用 r = h·tanC 计算","圆外光线全部全反射","光源变深后光斑如何变"]}],"分子力":[{"t":"分子力随距离的变化规律","f":"判断 r < r₀、r = r₀、r > r₀ 三种情况下分子力的表现，或比较引力与斥力的大小","k":"r = r₀ 时引力与斥力大小相等、合力为零；r 减小则斥力增长更快，表现为斥力；r 增大则表现为引力","q":[{"q":"两分子间距由 r₀ 减小到 r₀/2 的过程中，引力和斥力各如何变化？合力表现为什么性质的力？","s":["引力和斥力都随距离减小而增大","斥力随距离变化更剧烈，增长得更快","故合力表现为斥力","距离越近，斥力越显著，这就是物体难以被无限压缩的原因"],"a":"引力和斥力都增大，但斥力增长更快，合力表现为斥力","c":"分子力的三句要点：同时存在、同时变化、变化快慢不同。缺一条都容易判断错","x":"用图线记：引力与斥力两条曲线都随 r 减小而上升，但斥力曲线更陡，交点横坐标就是 r₀"}],"v":["r < r₀ 时斥力占优","r = r₀ 时合力为零","r > r₀ 时引力占优","比较引力与斥力的大小","r 很大时分子力趋于零"]},{"t":"分子势能与做功","f":"判断分子势能的变化趋势，或分析需要克服什么力做功","k":"分子力做正功则分子势能减小，做负功则势能增大——与重力做功的判据完全一致","q":[{"q":"把两个处于 r₀ 位置的分子拉开到相距很远，分子势能如何变化？需要克服什么力做功？","s":["r > r₀ 时分子力表现为引力","拉开过程中位移与引力方向相反，引力做负功","分子力做负功，分子势能增大","拉到无穷远时势能趋于零（取无穷远为零势能点），故 r₀ 处势能为负值"],"a":"分子势能增大，需克服分子引力做功","c":"势能判据与重力完全同构：力做正功势能减小，力做负功势能增大，不必另记一套规则","x":"类比弹簧：拉伸时弹力做负功、弹性势能增大，分子引力的情形与之一致"}],"v":["判断分子势能如何变化","分析需要克服什么力做功","势能最小处的位置","分子力做功与势能变化的关系","r₀ 处势能最小"]},{"t":"r₀ 附近的平衡与微小振动","f":"判断分子在平衡位置附近的运动性质，或解释固体为什么有确定的体积与形状","k":"r = r₀ 时引力与斥力大小相等、合力为零、势能最小；偏离 r₀ 后合力总指向 r₀，构成回复力","q":[{"q":"说明为什么固体分子只能在平衡位置附近振动，而不能任意远离或靠拢。","s":["r = r₀ 处引力与斥力平衡，合力为零，分子势能取最小值","r 略大于 r₀ 时引力占优，合力指向 r₀，把分子拉回","r 略小于 r₀ 时斥力占优，合力仍指向 r₀，把分子推开","合力始终指向平衡位置，构成回复力，故分子在 r₀ 附近往复振动；温度越高振幅越大"],"a":"分子力总是指向平衡位置，充当回复力，故分子只能振动","c":"「r₀ 是合力零点、也是势能最低点」——分子力的所有图像题都从这一点出发","x":"把分子力类比弹簧：r₀ 相当于原长，偏离就有回复力，振动的整套语言可以直接搬过来"}],"v":["判断分子在平衡位置附近的运动","解释固体为什么有确定的体积","回复力的来源","温度与振动幅度的关系","类比弹簧振子"]}],"分子动理论":[{"t":"分子力与分子势能曲线","f":"判断分子力随距离的变化、分子势能最低点位置、分子势能增减","k":"r = r₀ 时引力等于斥力、合力为零、分子势能最小；r < r₀ 斥力为主，r > r₀ 引力为主","q":[{"q":"两个分子从相距很远逐渐靠近到 r₀ 的过程中，分子力与分子势能分别如何变化？","s":["r > r₀ 时引力大于斥力，分子力表现为引力","靠近过程中引力先增大后减小，到 r₀ 时减小为零","引力做正功，分子势能不断减小","到 r₀ 时分子势能达到最小值"],"a":"分子力表现为引力（先增后减），分子势能一直减小到 r₀ 处最小","c":"分子势能的极小值出现在 r₀ 处，而不是零；通常取无穷远处势能为零，故 r₀ 处势能为负","x":"两条曲线对照记：分子力—距离图线在 r₀ 处过零，分子势能—距离图线在 r₀ 处取极小值"}],"v":["判断分子力随距离的变化","分子势能最低点的位置","判断势能是增还是减","r₀ 处的合力与势能特点","曲线各段的斜率含义"]},{"t":"布朗运动与分子热运动","f":"判断布朗运动的成因、影响因素，或辨析布朗运动与分子热运动、扩散现象","k":"布朗运动是悬浮微粒的无规则运动，不是分子本身的运动，而是分子无规则运动的间接反映","q":[{"q":"关于布朗运动，下列说法正确的是：A 它就是分子的热运动　B 温度越高越剧烈　C 颗粒越大越明显　D 它是液体分子无规则运动的反映","s":["布朗运动是固体小颗粒的运动，不是分子本身，A 错","温度越高，分子撞击越剧烈，布朗运动越明显，B 对","颗粒越大，各方向撞击越趋于平衡，运动越不明显，C 错","它是液体分子无规则运动的间接证据，D 对"],"a":"B、D 正确","c":"三句话记牢：不是分子、温度高更明显、颗粒小更明显","x":"用「统计涨落」理解：参与撞击的分子数越少，偏离平均的涨落越大，所以小颗粒才明显"}],"v":["判断布朗运动的成因","判断各因素对剧烈程度的影响","辨析布朗运动与分子运动","布朗运动不是分子运动本身","布朗运动间接证明分子在运动"]},{"t":"温度与分子平均动能","f":"判断关于温度、平均动能、平均速率的说法，或比较不同气体分子的平均动能与速率","k":"温度是分子平均动能的标志，同温下任何气体分子平均动能相同；但平均速率还与分子质量有关，质量大的速率小","q":[{"q":"0 ℃ 的氧气与 0 ℃ 的氢气，比较两者分子的平均动能与平均速率。","s":["温度相同，故两种气体分子的平均动能相同","平均动能 Ek = ½mv²，两种气体 Ek 相同而氧气分子质量更大","质量大则平均速率小","故氧气分子的平均速率小于氢气分子"],"a":"平均动能相同，氧气分子的平均速率较小","c":"「温度定平均动能，质量定平均速率」——这类比较题只需记这两句","x":"先看温度是否相同：相同则平均动能一定相同；再用摩尔质量大小定平均速率的高低"}],"v":["判断关于温度的说法","比较不同气体分子的平均动能","比较平均速率的大小","相同温度下平均动能相同","平均速率与分子质量的关系"]}],"力的合成分解":[{"t":"合力范围与三力合成","f":"求两个力的合力范围、三个力能否平衡、合力的最小值，或已知合力反求分力","k":"两力合力范围是 |F₁−F₂| ≤ F ≤ F₁+F₂；三力能否为零，只需看最小的两个力之和是否大于等于第三个力","q":[{"q":"三个共点力大小分别为 3 N、5 N、9 N，求它们合力的最大值和最小值。","s":["同向时合力最大：3 + 5 + 9 = 17 N","判断能否为零：3 + 5 = 8 N < 9 N，无法抵消最大的力","最小合力出现在 3 N 与 5 N 同向、与 9 N 反向时","最小值 = 9 − 3 − 5 = 1 N"],"a":"最大 17 N，最小 1 N","c":"三力合成先做一次「两小之和与最大之比」的判断：够则最小为零，不够则最小就是差值","x":"把三个力想成三角形的三条边：能构成三角形则合力可以为零；3+5<9 构不成三角形，缺口 1 N 就是最小合力"}],"v":["求两个力的合力范围","判断三个力能否平衡","求合力的最小值","已知合力反求分力","合力一定大于分力吗"]},{"t":"正交分解处理斜面问题","f":"斜面上物体在拉力、推力作用下匀速或加速运动，求某力大小、动摩擦因数或加速度","k":"让尽可能多的力落在坐标轴上：沿斜面与垂直斜面建系，重力分解为 mg sinθ 与 mg cosθ，两个方向各列一式","q":[{"q":"质量 10 kg 的物体放在倾角 30° 的斜面上，用沿斜面向上的力 F 拉它匀速上滑，动摩擦因数 √3/3。求 F（g 取 10 m/s²）。","s":["沿斜面方向：F = mg sin30° + f","垂直斜面方向：N = mg cos30° = 10×10×(√3/2) = 50√3 N","f = μN = (√3/3)×50√3 = 50 N","F = 50 + 50 = 100 N"],"a":"100 N","c":"沿斜面建系能把重力的两个分力直接写成 mg sinθ 与 mg cosθ，避免再算一次角度","x":"用摩擦角速算：tanφ = μ = √3/3，得 φ = 30°，F = mg sin(θ+φ)/cosφ = 100×sin60°/cos30° = 100 N，一步到位"}],"v":["求拉力或推力的大小","求动摩擦因数","求物体的加速度","重力沿斜面与垂直斜面的分解","斜面加外力的多力平衡"]},{"t":"力的分解的多解与极值","f":"已知一个力和一个分力的方向，求另一分力的最小值，或判断分解有几组解","k":"分解可能唯一、两解或无解；当另一分力与已知方向垂直时取最小值 F sinθ","q":[{"q":"把 20 N 的力分解为两个分力，其中一个分力与它成 30° 角。求另一个分力的最小值。","s":["画出矢量三角形：已知合力 F = 20 N，一个分力沿 30° 方向","另一个分力最小时，应与已知方向垂直（点到直线的距离最短）","最小值 = F sin30° = 20 × 0.5 = 10 N","此时已知方向的分力为 F cos30° ≈ 17.3 N"],"a":"最小值为 10 N","c":"「垂直取最小」是分解极值题的通用结论，本质是点到直线的距离最短","x":"直接记 F_min = F sinθ，代入 20×0.5 = 10 N，不用画图"}],"v":["求另一个分力的最小值","判断分解有几组解","已知两个分力的方向求大小","按实际效果分解重力","唯一解的条件"]}],"动能定理":[{"t":"动能定理处理变力与多过程","f":"变力做功、曲线运动、多阶段运动，求速度、位移、功或阻力","k":"W总 = ΔEk，总功包括所有力做的功；只关心初末状态，不必追究过程细节，这是它比牛顿定律强的地方","q":[{"q":"质量 1 kg 的小球从高 5 m 处由静止自由下落，陷入沙坑 0.2 m 后停止。求沙子对小球的平均阻力（g 取 10 m/s²）。","s":["全程受重力与阻力，机械能不守恒，改用动能定理","重力做功 mg(h+d)，阻力做功 −f·d","mg(h+d) − f·d = 0","f = 10×5.2/0.2 = 260 N"],"a":"260 N","c":"有非保守力做功就不能用机械能守恒，要把所有力的功写全，正负号由力与位移的夹角决定","x":"分两段校验：落地速度 v = √(2gh) = 10 m/s，沙中 ½mv² = (f − mg)d，得 f = 50/0.2 + 10 = 260 N，两条路互为验证"}],"v":["求变力做的功","求曲线运动中的速度","求多阶段的总功","由动能定理求阻力大小","求多过程中某一段的位移"]},{"t":"机车启动与功率","f":"恒定功率启动、恒定牵引力启动，求最大速度、某时刻加速度或做功","k":"恒定功率时 P = Fv，速度增大则牵引力减小；最大速度出现在 F = f 时，v_max = P/f","q":[{"q":"质量 2×10³ kg 的汽车额定功率 60 kW，在水平路面上行驶时阻力恒为 2×10³ N。求汽车能达到的最大速度；若以恒定功率启动，速度为 10 m/s 时加速度多大？","s":["最大速度时牵引力等于阻力：v_max = P/f = 60000/2000 = 30 m/s","速度为 10 m/s 时，牵引力 F = P/v = 60000/10 = 6000 N","合力 = 6000 − 2000 = 4000 N","a = F合/m = 4000/2000 = 2 m/s²"],"a":"最大速度 30 m/s；10 m/s 时加速度 2 m/s²","c":"恒定功率启动是变加速运动，只能用 P = Fv 与 F − f = ma 逐点分析，不能用匀变速公式","x":"用动能定理求启动时间：Pt − f·x = ½mv²，已知位移可反求时间，这是恒定功率启动唯一能算时间的方法"}],"v":["恒定功率启动的最大速度","恒定牵引力启动的匀加速阶段","求某时刻的加速度","求启动过程牵引力做的功","两种启动方式的图像比较"]},{"t":"动能定理与图像结合","f":"由 F-x 图或 P-t 图求功，再交给动能定理求速度","k":"F-x 图线下的面积是功，P-t 图线下的面积也是功；变力做功全靠面积求","q":[{"q":"质量 2 kg 的物体从静止开始受水平力作用，F 随位移变化：0-2 m 内由 0 线性增到 10 N，2-4 m 内保持 10 N。求 4 m 处的速度。","s":["0-2 m 是三角形，W₁ = ½×2×10 = 10 J","2-4 m 是矩形，W₂ = 2×10 = 20 J","总功 W = 10 + 20 = 30 J","由 W = ½mv² 得 v = √(2×30/2) = √30 ≈ 5.5 m/s"],"a":"约 5.5 m/s","c":"变力做功先转成「图线面积」，再交给动能定理——这是图像类动能题的唯一通道","x":"记「F-x 面积即功」：三角形 ½bh、矩形 bh，不必做积分"}],"v":["由 F-x 图线下的面积求功","由 P-t 图求功","求某位置的速度","图像斜率与截距的意义","由图像判断做功正负"]}],"动量与能量":[{"t":"动量与能量的选择策略","f":"多过程综合题，要求判断该用动量还是能量，或两者联立求解","k":"有「时间」无「位移」想动量，有「位移」无「时间」想动能；碰撞、爆炸、绳突然绷直用动量；摩擦生热、弹簧形变用能量","q":[{"q":"质量 m 的子弹以速度 v₀ 水平射入静止在光滑水平面上的木块（质量 M）并留在其中。求共同速度与系统损失的动能。","s":["碰撞瞬间动量守恒：mv₀ = (m+M)v，得 v = mv₀/(m+M)","损失动能 Q = ½mv₀² − ½(m+M)v²","代入 v 化简：Q = ½mv₀²·M/(m+M)","Q 也可由 Q = f·Δs相对 求出相对滑动距离"],"a":"v = mv₀/(m+M)，Q = Mmv₀²/[2(m+M)]","c":"完全非弹性碰撞动量守恒但动能损失最大；热量等于初末动能之差，不要试图对单个物体用动能定理","x":"用约化质量记：Q = ½μv₀²，μ = mM/(m+M)，一步写出；还能直接看出 m ≪ M 时 Q ≈ ½mv₀²（动能几乎全变成热）"}],"v":["判断该用动量还是能量","两者联立求解","碰撞类优先用动量","涉及时间用动量定理","只涉及位移与速度用动能定理"]},{"t":"多过程综合题的分段处理","f":"滑块沿斜面下滑、进入粗糙水平面、与其他物块碰撞、再冲上圆轨道的组合情境","k":"按「段」处理：每段挑一个最省事的定律，段与段之间只用速度衔接，不要试图一个方程包打全程","q":[{"q":"质量 1 kg 的滑块从高 0.8 m 的光滑斜面由静止滑下，进入动摩擦因数 0.2 的水平面，滑行 2 m 后与静止的 3 kg 滑块发生完全非弹性碰撞。求碰后的共同速度（g 取 10 m/s²）。","s":["斜面段：mgh = ½mv₁²，v₁ = √(2×10×0.8) = 4 m/s","水平面段：½mv₁² − μmgs = ½mv₂²，8 − 0.2×1×10×2 = 4，v₂ = 2√2 ≈ 2.83 m/s","碰撞段动量守恒：mv₂ = (m+M)v，v = 2.83/4 ≈ 0.71 m/s","碰后动能约 1 J，损失约 3 J 转化为内能"],"a":"约 0.71 m/s","c":"分段选定律、速度作衔接；斜面用机械能守恒、水平面用动能定理、碰撞用动量守恒，各取所长","x":"斜面与水平面可合并成一次动能定理：mgh − μmgs = ½mv₂²，直接得 v₂，省掉一个中间变量"}],"v":["斜面下滑后进入粗糙水平面","碰撞后再冲上圆轨道","求全程摩擦生热","分段列式与交界速度传递","判断能否通过圆轨道最高点"]},{"t":"动量定理与平均作用力","f":"求碰撞、反弹中的平均作用力与冲量，或解释缓冲现象","k":"I = FΔt = Δp 是矢量式；求平均力必须先规定正方向，Δp = m(v₂ − v₁)","q":[{"q":"质量 0.5 kg 的球以 10 m/s 垂直撞墙，以 8 m/s 反弹，撞击时间 0.02 s。求墙对球的平均作用力。","s":["规定初速度方向为正，则 v₁ = 10 m/s，v₂ = −8 m/s","Δp = m(v₂ − v₁) = 0.5×(−8 − 10) = −9 kg·m/s","由 FΔt = Δp 得 F = −9/0.02 = −450 N","负号表示方向与初速度相反，大小为 450 N"],"a":"450 N，方向与初速度方向相反","c":"反弹题最容易漏负号：Δv 是 v₂ − v₁，方向相反时是两者大小相加，不是相减","x":"速算取大小：F = m(v₁+v₂)/Δt = 0.5×18/0.02 = 450 N，一步出结果"}],"v":["求碰撞中的平均作用力","求反弹过程的冲量","解释缓冲与安全气囊","求 Δp 并注意方向","合外力的冲量等于动量变化"]}],"动量守恒":[{"t":"动量守恒的条件与方向性","f":"判断系统动量是否守恒，或在某个方向上守恒，并求碰后速度","k":"合外力为零则动量守恒；合外力不为零但某方向合外力为零，则该方向动量守恒——「部分守恒」是高频考点","q":[{"q":"光滑水平面上，质量 2 kg 的 A 以 3 m/s 向右运动，与静止的 1 kg 的 B 碰撞后，A 以 1 m/s 仍向右运动。求 B 的速度。","s":["水平方向不受外力，系统动量守恒","2×3 = 2×1 + 1×v","6 = 2 + v","v = 4 m/s，方向向右"],"a":"4 m/s，方向向右","c":"先判断哪个方向守恒，再沿该方向列式；速度一律带符号，方向由结果正负读出","x":"用「动量变化量等大反向」校验：A 减少 4 kg·m/s，B 必增加 4 kg·m/s，直接得 v = 4 m/s，不必解方程"}],"v":["判断系统动量是否守恒","判断某方向上是否守恒","求碰后的速度","内力远大于外力时近似守恒","爆炸瞬间的动量守恒"]},{"t":"人船模型","f":"人在船上走、气球上爬绳、平板车上移动，求各物体的位移","k":"系统总动量始终为零、质心不动：m₁x₁ = m₂x₂，且两位移之和等于相对位移","q":[{"q":"质量 60 kg 的人站在长 4 m、质量 120 kg 的静止小船上，从船头走到船尾。求船移动的距离（水的阻力不计）。","s":["系统初动量为零且不受水平外力，质心位置不变","设船对地位移为 x，则人对地位移为 4 − x","由 m人(4−x) = m船x 得 60(4−x) = 120x","240 = 180x，x ≈ 1.33 m，方向与人走动方向相反"],"a":"约 1.33 m，方向与人的运动方向相反","c":"人船模型两条式子：位移与质量成反比、两位移之和等于相对位移，缺一不可","x":"直接套 x船 = m人L/(m人+m船) = 60×4/180 ≈ 1.33 m，一个式子出结果"}],"v":["求人走动时船的位移","求气球上爬绳时的高度变化","求平板车的位移","位移与质量成反比","系统的质心位置不变"]},{"t":"爆炸与反冲","f":"爆炸后各块的速度、反冲速度、火箭原理","k":"爆炸瞬间内力远大于外力，动量守恒；时间极短位移可忽略；机械能一般增加","q":[{"q":"质量 3 kg 的爆竹静止在地面，爆炸成质量分别为 1 kg 和 2 kg 的两块。爆炸后 1 kg 的那块以 12 m/s 向东飞出，求另一块的速度。","s":["爆炸前系统总动量为零","爆炸瞬间动量守恒：0 = 1×12 + 2×v","v = −6 m/s","负号表示方向与 1 kg 那块相反，即向西"],"a":"6 m/s，方向向西","c":"爆炸、反冲、绳突然绷直都属于「内力远大于外力」，动量守恒但机械能不守恒（通常增加）","x":"反冲速度与质量成反比：m₁v₁ = m₂v₂，代入 1×12 = 2×v 直接得 6"}],"v":["求爆炸后各块的速度","求爆炸后另一块的反冲速度","解释火箭的工作原理","爆炸过程动能增加","由动量守恒求质量比"]}],"匀变速直线运动":[{"t":"公式选择与知三求二","f":"给出 v₀、v、a、x、t 中的三个求其余；常与刹车、往返、斜面等情境结合，埋「时间超过停止时间」的坑","k":"五个量知三求二，选公式的原则是「缺什么避开什么」：不涉及 t 用 v² − v₀² = 2ax，不涉及 x 用 v = v₀ + at，不涉及 a 用 x = (v₀+v)t/2","q":[{"q":"汽车以 20 m/s 行驶，刹车时加速度大小为 5 m/s²。求刹车后 6 s 内的位移。","s":["先算停止时间：t₀ = v₀/a = 20/5 = 4 s","因为 6 s > 4 s，4 s 后车已停止，后 2 s 位移为零","6 s 内位移等于 4 s 内位移：x = v₀²/(2a) = 400/10 = 40 m","若直接代入 x = v₀t − ½at² 会得到 30 m，是「倒着开」的荒谬解"],"a":"40 m","c":"刹车类问题第一步永远是算停止时间，再判断给定时间是否超过它；超过就截断到停止时刻","x":"直接用刹车距离公式 x = v₀²/(2a)，与时间无关，天然避开陷阱；反向思考更快：把刹车看成逆向的初速为零匀加速，x = ½at₀² = ½×5×16 = 40 m"}],"v":["给三个量求其余两个","先算刹车停止时间再代入","往返运动要分段处理","斜面上滑与下滑的位移关系","不含时间的公式 v²−v₀²=2ax"]},{"t":"纸带与逐差法求加速度","f":"给出打点计时器纸带上连续相等时间内的位移，求加速度和某计数点的瞬时速度，或判断运动性质","k":"连续相等时间 T 内的位移差恒定 Δx = aT²，这是匀变速的判据也是求 a 的公式；某点瞬时速度等于该点前后两段的平均速度","q":[{"q":"纸带每 0.02 s 打一点，每 5 个间隔取一个计数点，测得相邻计数点间距依次为 2.0、3.0、4.0、5.0 cm。求加速度和打第 2 个计数点时的速度。","s":["计数周期 T = 5×0.02 = 0.1 s","相邻位移差 Δx = 1.0 cm = 0.01 m，由 Δx = aT² 得 a = 1.0 m/s²","第 2 点为第 2、3 段之间的时刻，v₂ = (x₂ + x₃)/(2T) = (0.03+0.04)/0.2 = 0.35 m/s","数据成等差（2、3、4、5），说明纸带做匀变速运动，结论自洽"],"a":"a = 1.0 m/s²，v₂ = 0.35 m/s","c":"逐差法要用全部数据：a = [(x₃+x₄) − (x₁+x₂)]/(4T²)，比只用两段更充分地利用了测量值、误差更小","x":"先看位移是否成等差数列，成等差就说明严格匀变速，可用 v₂ = (x₂+x₃)/(2T) 直算；若不成等差，题目多半在考「为什么不能用逐差法」"}],"v":["用逐差法求加速度 a","求某计数点的瞬时速度","判断纸带是否做匀变速运动","处理舍去最前面一段的情况","由纸带求某点的速度并画 v-t 图"]},{"t":"刹车陷阱与往返运动","f":"汽车刹车、物体冲上斜面后返回，求某时刻的速度或位移","k":"先算停止时间 t停 = v₀/a；所求时刻超过 t停 时速度为零、位移取停止时的值","q":[{"q":"汽车以 20 m/s 行驶，刹车加速度大小为 5 m/s²。求刹车后 3 s 内和 6 s 内的位移。","s":["停止时间 t停 = v₀/a = 20/5 = 4 s","3 s < 4 s，正常代入：x₃ = 20×3 − ½×5×9 = 37.5 m","6 s > 4 s，车早在 4 s 时就停了，位移取停止时的值","x = v₀²/(2a) = 400/10 = 40 m"],"a":"3 s 内 37.5 m；6 s 内 40 m（不是 60 − 90 = −30 m）","c":"一切刹车题先算停止时间再比较——超过就按停止时的位移算，这是本节最高频的失分点","x":"用 v² = 2ax 反算最大位移：x = v₀²/(2a) = 40 m，一步得到 6 s 的答案，完全不用管时间"}],"v":["求刹车后某时刻的速度","求刹车后一段时间内的位移","冲上斜面后又返回的全程","判断速度何时减为零","刹车距离与反应距离"]},{"t":"初速为零的匀加速比例式","f":"物体从静止开始匀加速，求连续相等时间内的位移比、连续相等位移所用时间比","k":"连续相等时间内位移比 1:3:5:7；通过连续相等位移所用时间比 1:(√2−1):(√3−√2)","q":[{"q":"物体从静止开始匀加速下滑，第 1 s 内位移 2 m。求第 3 s 内的位移与前 3 s 的总位移。","s":["由 x₁ = ½a×1² = 2 m 得 a = 4 m/s²","连续相等时间内位移比为 1:3:5，第 3 s 内是第 3 份","x₃ = 5 × 2 = 10 m","前 3 s 总位移 = (1+3+5) × 2 = 18 m"],"a":"第 3 s 内 10 m，前 3 s 共 18 m","c":"1:3:5:7 用于「第 n 秒内」；注意是「第 n 秒内」不是「前 n 秒」，两句话差一个累加","x":"用 x = ½at² 校验：前 3 s 是 18 m、前 2 s 是 8 m，第 3 s 内 = 10 m，两种算法互相印证"}],"v":["连续相等时间内的位移比 1:3:5","连续相等位移所用时间比","第 n 秒内的位移","前 n 秒与前 2n 秒的位移比","由比例式反求总时间"]}],"卫星变轨":[{"t":"变轨过程的加速度、速度与能量","f":"卫星从低轨到高轨（或反向），判断各阶段速度、加速度、机械能的变化，比较不同轨道上的周期","k":"点火加速 → 需要的向心力变大 → 引力不足 → 做离心运动升高轨道；升高后稳定圆轨道的速度反而更小","q":[{"q":"卫星先在低轨圆轨道运行，在 P 点点火加速进入椭圆轨道，到远地点 Q 再次点火进入高轨圆轨道。比较三个轨道上速度与机械能的大小关系。","s":["低轨圆轨道速度 v₁；P 点点火后瞬间速度增大到 v₂ > v₁，开始做离心运动","沿椭圆从 P 到 Q，引力做负功，速度不断减小","Q 点再次点火加速，进入高轨圆轨道，速度变为 v₃","稳定圆轨道「高轨低速」，故 v₃ < v₁；机械能随轨道升高而增大，E₁ < E₂ < E₃"],"a":"v₂ > v₁ > v₃，E₁ < E₂ < E₃","c":"分两件事看：同一点点火是「瞬间加速」，不同圆轨道之间比是「高轨低速」，两者并不矛盾","x":"记住这个反直觉结论：两次都在加速，最终速度却更小——因为加速的目的是抬高轨道，抬高后速度自然变小"}],"v":["比较不同轨道上的速度","比较不同轨道上的加速度","判断机械能如何变化","该点火加速还是减速","同一点在不同轨道上的加速度相同"]},{"t":"变轨对接与追及","f":"两航天器在不同轨道同一平面内，问如何追上、需要几次点火、转移时间多少","k":"低轨周期短、跑得快，会从后方追上高轨目标；不能直接加速追（加速会升轨），必须经椭圆转移轨道","q":[{"q":"飞船在较低圆轨道、空间站在较高圆轨道，两者共面。飞船要与空间站对接，应如何操作？","s":["飞船轨道低、周期小、角速度大，会逐渐追上空间站","不能直接加速——加速会使飞船升轨，偏离空间站所在轨道","应在相位合适时点火加速，进入椭圆转移轨道，使远地点与空间站轨道相切","到达远地点时再次点火加速，进入空间站轨道完成对接"],"a":"等相位合适后两次点火，经椭圆转移轨道对接","c":"「加速升轨、减速降轨」是变轨铁律；追赶靠等待相位差，不靠直接加速","x":"用霍曼转移记：两次点火、转移轨道是半椭圆，转移时间等于该椭圆周期的一半"}],"v":["如何追上前面同一轨道上的航天器","需要几次点火","求转移轨道上的运行时间","霍曼转移的轨道选择","低轨追高轨的次序"]},{"t":"同步卫星的轨道高度","f":"求同步卫星的轨道半径、距地面高度与线速度","k":"同步卫星周期被锁死为 24 h（86400 s），由 r³ = GMT²/(4π²) 求半径，高度 h = r − R","q":[{"q":"已知地球质量 M = 6×10²⁴ kg，G = 6.67×10⁻¹¹ N·m²/kg²，地球半径 R = 6.4×10⁶ m。估算同步卫星距地面的高度。","s":["由 GMm/r² = m(4π²/T²)r 得 r³ = GMT²/(4π²)","T = 86400 s，T² ≈ 7.5×10⁹ s²","r³ = 6.67×10⁻¹¹×6×10²⁴×7.5×10⁹ ÷ (4π²) ≈ 7.6×10²² m³","r ≈ 4.2×10⁷ m","h = r − R ≈ 4.2×10⁷ − 6.4×10⁶ ≈ 3.6×10⁷ m"],"a":"约 3.6×10⁴ km（3.6 万公里）","c":"同步卫星只有一个固定高度，因为周期被锁死；求半径统一用 r³ = GMT²/(4π²)","x":"记结论「同步卫星高度约 3.6 万公里、线速度约 3.1 km/s」，估算题可直接引用"}],"v":["求同步卫星的轨道半径","求距地面的高度","求同步卫星的线速度","同步卫星为什么只能在赤道上空","同步卫星的周期与地球自转相同"]}],"原子核":[{"t":"核反应方程的配平","f":"补全核反应方程、判断粒子种类、判断反应类型","k":"质量数守恒与电荷数守恒两条都要满足；常见粒子：α(4,2)、β(0,−1)、质子(1,1)、中子(1,0)","q":[{"q":"完成核反应方程：²³⁸U → ²³⁴Th + ?，并指出反应类型。","s":["质量数：238 − 234 = 4","电荷数：92 − 90 = 2","质量数 4、电荷数 2 对应 α 粒子（⁴₂He）","故为 α 衰变"],"a":"⁴₂He，属于 α 衰变","c":"先配质量数、再配电荷数，两条都验一遍才算完成，只配一条是最常见的错","x":"把常见粒子的 (A,Z) 背成表：α(4,2)、β(0,−1)、p(1,1)、n(1,0)、正电子(0,1)，配平时直接查"}],"v":["补全核反应方程","判断未知粒子的种类","判断反应的类型","质量数与电荷数守恒","用逐行做减法配平方程"]},{"t":"半衰期","f":"求剩余质量、衰变次数、经过的时间，或判断关于半衰期的说法","k":"m = m₀(1/2)^(t/T)；半衰期是统计规律，只对大量原子核有意义，且不受温度、压强影响","q":[{"q":"某放射性元素半衰期为 5 天，原有 8 g 该元素，经过 15 天后还剩多少？","s":["15 天 = 3 个半衰期","每经过一个半衰期剩余一半","m = 8 × (1/2)³","= 8 × 1/8 = 1 g"],"a":"1 g","c":"先算「经过几个半衰期」，再用 (1/2)ⁿ，比套对数公式快得多","x":"半衰期不能预测单个核何时衰变，也不能被加温加压改变，这两条是常考的辨析点"}],"v":["求经过 n 个半衰期后的质量","求衰变的次数","求经过的时间","半衰期是统计规律","对少量原子核不适用"]},{"t":"核力的性质与比结合能","f":"判断核力的特点，或由比结合能曲线判断哪些核反应能释放能量","k":"核力是短程强相互作用，只在约 10⁻¹⁵ m 内起作用且有饱和性；比结合能越大原子核越稳定","q":[{"q":"为什么重核裂变与轻核聚变都能释放能量？用比结合能曲线说明。","s":["比结合能曲线中间高、两端低，铁附近的核比结合能最大、最稳定","重核比结合能较小，裂变成中等核后比结合能增大，多余能量释放","轻核比结合能更小，聚变成较重的核后比结合能增大，同样释放能量","两条路径都是「向曲线峰值靠拢」，故都放能"],"a":"因为裂变与聚变都使核向比结合能更大的方向移动，多余能量以动能形式释放","c":"比结合能曲线是核能的「地形图」：所有放能反应都是往山顶（铁）走","x":"判放能只需一句：反应后比结合能变大就放能，变小就吸能，不必算质量亏损"}],"v":["判断核力的特点","由比结合能曲线判断能否放能","为什么铁附近的核最稳定","核力的饱和性","核力是短程强相互作用"]}],"原子结构":[{"t":"α粒子散射与核式结构","f":"由散射现象推断原子结构，或判断关于核式结构的说法","k":"绝大多数 α 粒子几乎不偏转，说明原子内部很空；极少数大角度偏转甚至反弹，说明存在体积小、质量大、带正电的核","q":[{"q":"α 粒子散射实验中，为什么极少数 α 粒子会发生大角度偏转甚至被反弹回来？","s":["大多数 α 粒子几乎沿直线通过，说明原子内部大部分是空的","极少数 α 粒子非常靠近原子核，受到很强的库仑斥力","原子核集中了原子的几乎全部质量和全部正电荷","故这些 α 粒子发生大角度偏转甚至被弹回"],"a":"因为它们非常靠近体积很小、集中全部正电荷与几乎全部质量的原子核","c":"三条现象对应三个结论，是典型的「现象 → 结构」推理题，三条要能一一对应","x":"记住卢瑟福的结论：枣糕模型被推翻，改为「行星式」核式结构模型"}],"v":["由散射现象推断原子结构","判断关于核式结构的说法","极少数大角度偏转说明什么","绝大多数几乎不偏转说明什么","现象与结论的对应"]},{"t":"能级跃迁与光谱","f":"求跃迁时吸收或放出的光子能量、波长，或判断能发出几种频率的光","k":"hν = E_m − E_n（高能级减低能级）；一群处于 n 能级的氢原子最多辐射 n(n−1)/2 种光子","q":[{"q":"氢原子从 n=4 跃迁到 n=2，两能级分别为 −0.85 eV 与 −3.4 eV。求辐射光子的能量与波长。","s":["ΔE = −0.85 − (−3.4) = 2.55 eV","由 λ = hc/ΔE，取 hc = 1240 eV·nm","λ = 1240/2.55","≈ 486 nm，属蓝绿光"],"a":"2.55 eV，约 486 nm","c":"跃迁能量一律「高能级减低能级」，能级本身是负值，减法最容易错符号","x":"直接用 λ(nm) = 1240/ΔE(eV)，一步出波长，不必换算成焦耳"}],"v":["求跃迁辐射的光子能量","求光子的波长","判断能发出几种频率的光","吸收与辐射的区别","用 hν = Eₘ − Eₙ"]},{"t":"卢瑟福核式结构模型的困难","f":"说明核式结构模型与经典电磁理论的矛盾，或解释为什么需要玻尔模型","k":"绕核运动的电子是加速运动，按经典理论应持续辐射、轨道收缩坠核，且光谱应为连续谱","q":[{"q":"核式结构模型在经典物理框架下会遇到什么根本困难？","s":["电子绕核做圆周运动，存在向心加速度，属于加速运动","经典电磁理论：加速电荷持续辐射电磁波、能量不断减少","能量减少则轨道半径减小，电子应在约 10⁻¹¹ s 内坠入原子核，原子不可能稳定存在","且辐射频率应连续变化得到连续谱，而实际观察到的是分立线状谱"],"a":"原子不稳定（电子会坠核），且光谱应为连续谱，与事实矛盾","c":"两个矛盾：稳定性 + 分立谱；玻尔的三条假设正是逐条回应这两点","x":"答这类题先摆经典理论的预言，再摆实验事实，矛盾自然显形"}],"v":["与经典电磁理论的矛盾","为什么原子不可能稳定","为什么光谱应为连续谱","玻尔如何逐条回应","两个矛盾分别对应哪条假设"]}],"双缝干涉":[{"t":"条纹间距公式的应用","f":"由实验数据求波长，或判断装置改变后条纹间距如何变化","k":"Δx = Lλ/d；相邻亮（暗）纹间距相等，这是干涉最本质的特征","q":[{"q":"把双缝干涉装置整体浸入水中（n = 4/3），条纹间距如何变化？","s":["水中光的波长变为 λ = λ₀/n","由 Δx = Lλ/d，其他量不变时 Δx 与 λ 成正比","波长变小，条纹间距变小","变为原来的 3/4"],"a":"条纹间距变小，变为原来的 3/4","c":"变化类问题只盯住 λ：L 与 d 不变时 Δx 与 λ 成正比","x":"直接乘 1/n：Δx′ = Δx/n = 3Δx/4，一步出结果"}],"v":["由数据求波长","装置改变后条纹间距如何变","换用不同色光的影响","屏距变化的影响","Δx 与 λ、L 成正比、与 d 成反比"]},{"t":"明暗条纹的条件","f":"判断某点是亮纹还是暗纹，或由光程差反求波长","k":"光程差为波长整数倍是亮纹，为半波长奇数倍是暗纹","q":[{"q":"双缝到屏上某点的光程差为 1.5λ，该点是亮纹还是暗纹？","s":["把光程差写成 λ 的倍数：1.5λ = 3λ/2","3λ/2 = (2k+1)λ/2，取 k = 1 时成立","满足暗纹条件","故该点为暗纹"],"a":"暗纹","c":"亮纹看整数倍、暗纹看半整数倍，判断前先把光程差写成 λ 的倍数","x":"记「整数亮、半整数暗」，比值一看便知"}],"v":["判断某点是亮纹还是暗纹","由光程差反求波长","光程差为波长整数倍是亮纹","半波长奇数倍是暗纹","中央一定是亮纹"]},{"t":"不同色光条纹的重叠与级次","f":"判断两种色光的条纹能否重合，或比较某级亮纹的位置","k":"Δx = Lλ/d，波长越长条纹越宽；同级亮纹位置正比于 λ，故不同色光的同级条纹不重合","q":[{"q":"红光与蓝光分别做双缝干涉，判断两者第一级亮纹是否重合，哪一条离中央更远。","s":["第一级亮纹位置 x = Lλ/d","λ红 > λ蓝，其他条件相同","故 x红 > x蓝，红光条纹更靠外","两者位置不同不重合；级次越高，分离越明显"],"a":"不重合；红光的第一级亮纹离中央更远","c":"「波长定条纹宽度」——红光条纹最宽、紫光最窄，这是色光比较题的总纲","x":"同一装置比较色光只比 λ：λ 大的条纹宽、位置远，不必算具体数值"}],"v":["判断同级条纹是否重合","哪一条离中央更远","级次越高分离越明显","红光与蓝光的比较","白光的彩色条纹"]}],"向心加速度":[{"t":"三种连接方式的加速度比较","f":"同轴转动、皮带传动、齿轮啮合三类装置中比较线速度、角速度、向心加速度","k":"同轴转动 ω 相同，皮带与齿轮边缘 v 相同；再由 a = v²/r 或 a = ω²r 比较，先定「谁相同」是关键","q":[{"q":"A、B 两轮用皮带连接，半径之比为 1:2。求 A、B 轮边缘点的向心加速度之比。","s":["皮带连接，两轮边缘的线速度相同：v_A = v_B","由 a = v²/r，v 相同时 a 与 r 成反比","a_A : a_B = r_B : r_A = 2 : 1","若改为同轴转动（ω 相同），则由 a = ω²r 得比为 1:2，结论正好相反"],"a":"2:1","c":"先判断连接方式定出「谁相同」，再选 a = v²/r 或 a = ω²r，一步到位","x":"画一张三连接对照表：同轴 ω 同、皮带齿轮 v 同、同半径 a 同，考场上直接查表比对"}],"v":["同轴转动的角速度相同","皮带传动的线速度相同","齿轮啮合的线速度相同","比较向心加速度大小","不打滑时边缘点线速度相等"]},{"t":"变速圆周运动的加速度方向","f":"判断某点加速度是否指向圆心，或求切向、法向加速度分量","k":"只有匀速圆周运动的加速度才指向圆心；变速圆周运动的加速度有切向分量，合加速度偏离圆心","q":[{"q":"小球在竖直平面内做变速圆周运动，经过绳与竖直方向成 θ 角的位置时速率为 v，绳长 L。求此时加速度的法向与切向分量。","s":["法向（指向圆心）：a_n = v²/L，由绳张力与重力法向分量的合力提供","切向：由重力沿切向的分量提供，a_t = g sinθ","合加速度 a = √(a_n² + a_t²)，方向偏离圆心","只有在最高点、最低点处 sinθ = 0，合加速度才指向圆心"],"a":"a_n = v²/L，a_t = g sinθ，合加速度不指向圆心","c":"变速圆周运动必须分解为法向（改变方向）与切向（改变速率）两个分量，不能笼统说「指向圆心」","x":"一句话判错：凡是选项说「变速圆周运动的加速度指向圆心」，一律错；只有匀速圆周运动才成立"}],"v":["加速度是否指向圆心","求切向与法向分量","最低点的加速度方向","速率变化时加速度的指向","合力与向心力的差别"]},{"t":"向心加速度的计算与速度变化量","f":"求某点的向心加速度，或求一段时间内速度的变化量 Δv","k":"a = v²/r = ω²r = 4π²r/T²；Δv 是矢量差，不能把速率直接相减","q":[{"q":"质点做半径 2 m、周期 4 s 的匀速圆周运动。求向心加速度，以及经过半个周期速度的变化量大小。","s":["ω = 2π/T = π/2 rad/s","a = ω²r = (π/2)²×2 = π²/2 ≈ 4.9 m/s²","v = ωr = π m/s ≈ 3.1 m/s","半个周期后速度方向完全反向，Δv = 2v = 2π ≈ 6.3 m/s"],"a":"向心加速度约 4.9 m/s²；半个周期内 Δv 约 6.3 m/s","c":"匀速圆周运动速率不变但速度一直在变；Δv 必须按矢量算，半个周期正好反向所以是 2v","x":"记：半周期 Δv = 2v，四分之一周期 Δv = √2·v，都是一个等腰直角三角形的斜边"}],"v":["求某点的向心加速度","求一段时间内的 Δv","Δv 的方向","用 Δv/Δt 求平均加速度","匀速圆周运动的 Δv 大小"]}],"图像法":[{"t":"v-t 图的斜率与面积","f":"由 v-t 图求加速度、位移、平均速度，或比较两物体的运动与追及","k":"斜率 = 加速度；图线与时间轴围成的面积 = 位移（轴下取负）；两图线交点表示速度相同，不是相遇","q":[{"q":"某物体 0-4 s 由静止匀加速到 8 m/s，4-10 s 匀速，10-12 s 匀减速到零。求总位移与全程平均速度。","s":["0-4 s：面积 ½×4×8 = 16 m","4-10 s：面积 6×8 = 48 m","10-12 s：面积 ½×2×8 = 8 m","总位移 72 m，总时间 12 s，平均速度 72/12 = 6 m/s"],"a":"总位移 72 m，平均速度 6 m/s","c":"v-t 图三件事：斜率看加速度、面积看位移、交点看速度相等。分段算面积再相加，别漏最后一段","x":"平均速度一律用 v̄ = 总位移 ÷ 总时间；只有匀变速才可用 (v₀+v)/2，混着用是常见扣分点"}],"v":["由斜率求加速度","由面积求位移","由 v-t 图求平均速度","比较两物体的追及","t 轴下方的面积取负"]},{"t":"斜率截距的物理意义","f":"由图像求电动势与内阻、劲度系数、普朗克常量等，或判断图像是否正确","k":"先写出物理关系式，化成 y = kx + b 的形式，斜率与截距各对应一个物理量","q":[{"q":"用伏安法测电源，作出 U-I 图线，纵轴截距为 3.0 V，图线斜率为 −2.0 Ω。求电动势与内阻。","s":["闭合电路欧姆定律：U = E − Ir","与 y = kx + b 逐项对照：截距 b = E，斜率 k = −r","E = 3.0 V","r = |k| = 2.0 Ω"],"a":"电动势 3.0 V，内阻 2.0 Ω","c":"图像题通用套路：先写公式，再与 y = kx + b 对照，斜率、截距的物理意义自然浮现","x":"记结论「U-I 图截距是 E、斜率绝对值是 r」；若纵轴不从零开始，截距会失真，只能读斜率"}],"v":["由图像求电动势与内阻","由图像求劲度系数","由图像求普朗克常量","判断图像是否正确","截距对应哪个物理量"]},{"t":"图像转换与化曲为直","f":"把非线性图像转化为线性图像，或由直线的斜率、截距求物理量","k":"通过变量替换让关系变成 y = kx + b，斜率与截距就对应物理量","q":[{"q":"验证玻意耳定律时，为什么常画 p-1/V 图而不是 p-V 图？","s":["等温时 pV = C，即 p = C/V，p-V 图是双曲线，不便判断是否为反比","令横轴为 1/V，则 p = C·(1/V)，p-1/V 图应是过原点的直线","直线的斜率就是常量 C，是否过原点可直接用直尺判断","化曲为直后判断反比关系变得直观，误差也一目了然"],"a":"因为 p-1/V 图是过原点的直线，便于判断反比关系并求出常量","c":"「化曲为直」的通用手法：把自变量换成它的倒数或平方，让关系线性化","x":"判断两个量是否成反比，最稳的办法是画「一个量 — 另一个量的倒数」图，看是否过原点"}],"v":["把非线性关系转成线性","由斜率求物理量","由截距求物理量","判断两个量是否成反比","变量替换的思路"]}],"圆周运动":[{"t":"向心力的来源分析","f":"圆锥摆、汽车转弯、拱形桥、圆盘上的物块，求角速度、线速度或某个力的大小","k":"向心力不是一种新的力，而是合力在半径方向的分量；先受力分析，再沿半径方向写 ΣF = mv²/r","q":[{"q":"质量 1 kg 的小球用长 1 m 的细绳悬挂做圆锥摆，绳与竖直方向夹角 60°。求小球做圆周运动的角速度（g 取 10 m/s²）。","s":["受力：重力 mg、绳张力 T，二力的合力水平指向圆心","竖直方向平衡：T cos60° = mg，得 T = 20 N","水平方向提供向心力：T sin60° = mω²·L sin60°","ω = √(g/(L cos60°)) = √(10/0.5) = √20 ≈ 4.47 rad/s"],"a":"约 4.47 rad/s","c":"圆锥摆一律「竖直方向平衡 + 水平方向提供向心力」，结论 ω = √(g/(L cosθ))，与质量无关","x":"记 h = L cosθ 为圆锥摆的高度，则 ω = √(g/h)，与单摆周期 T = 2π√(h/g) 完全同形，两个模型可以互相印证"}],"v":["圆锥摆求角速度","汽车转弯的最大速度","拱形桥对桥面的压力","圆盘上物块的临界角速度","火车转弯的外轨受力"]},{"t":"竖直面内的临界问题","f":"绳模型（最高点最小速度）、杆模型（最高点速度可为零）、拱桥（最大安全速度）","k":"绳模型最高点「恰好通过」的条件是张力为零、重力恰好提供向心力，v_min = √(gr)；杆模型最高点速度可以为零","q":[{"q":"质量 0.5 kg 的小球用长 0.4 m 的细绳系住在竖直平面内做圆周运动。求最高点的最小速度和此时绳的张力（g 取 10 m/s²）。","s":["最高点速度最小时，绳张力恰好为零，重力提供全部向心力","mg = mv²/r，得 v = √(gr) = √(0.4×10) = 2 m/s","此时 T = 0","若 v 更大，则 T = mv²/r − mg，随 v 增大而增大"],"a":"v_min = 2 m/s，此时 T = 0","c":"绳模型最高点「恰好通过」= T = 0，即 v_min = √(gr)；杆模型没有这个限制，v 可以为零","x":"用能量校验：从最低点到最高点 ½mv₁² = ½mv₂² + 2mgr，已知最低点速度就能直接判断能否通过"}],"v":["绳模型最高点最小速度","杆模型最高点速度可为零","拱桥的最大安全速度","管道模型在最高点的临界","最低点绳的张力"]},{"t":"圆周运动与平抛的结合","f":"小球在竖直圆轨道内运动后从某点飞出，做平抛落地，求水平距离或落点位置","k":"分两段处理：圆轨道段用向心力方程与机械能守恒求飞出点的速度，飞出后按平抛处理","q":[{"q":"半径 R = 0.5 m 的光滑半圆轨道竖直放置，小球恰好能通过最高点。求小球落地点到轨道最低点的水平距离（g = 10）。","s":["恰好通过最高点：mg = mv²/R，得 v = √(gR) = √5 ≈ 2.24 m/s","从最高点飞出后做平抛，下落高度为 2R = 1 m","由 2R = ½gt² 得 t = √(4R/g) = √0.2 ≈ 0.45 s","水平距离 x = v·t = 2.24×0.45 ≈ 1.0 m"],"a":"约 1.0 m","c":"这类题分两段：圆轨道段用向心力 + 能量，飞出后用平抛；两段的衔接点是飞出点的速度","x":"记结论：恰好过最高点时 x = √(gR)·√(4R/g) = 2R，本题即 1.0 m，一步出结果"}],"v":["从圆轨道飞出后做平抛","求落地的水平距离","求落地点的位置与距离","求飞出点的速度","先平抛后进入圆轨道"]}],"天然放射现象":[{"t":"三种射线的性质","f":"判断 α、β、γ 射线的本质、电离能力、穿透能力，或在电磁场中的偏转","k":"α 是氦核（电离最强、穿透最弱），β 是电子（居中），γ 是光子（穿透最强、电离最弱）","q":[{"q":"把放射性物质放在垂直纸面向里的匀强磁场中，α、β、γ 三种射线如何偏转？","s":["α 粒子带正电，由左手定则向一侧偏转，因质量大偏转半径大","β 粒子带负电，向相反方向偏转，因质量小偏转明显","γ 射线不带电，不发生偏转","穿透能力排序：γ > β > α"],"a":"α 与 β 向相反方向偏转（α 的半径大），γ 不偏转","c":"电离能力与穿透能力总是相反：电离强的穿透弱，记住一条即可推另一条","x":"记「α 重带电、β 轻带电、γ 不带电」，偏转方向与程度一次判定"}],"v":["判断三种射线的本质","比较电离能力的强弱","比较穿透能力的强弱","在电磁场中的偏转情况","α 是氦核、β 是电子流、γ 是光子"]},{"t":"衰变次数的计算","f":"由始末核求 α 衰变与 β 衰变的次数","k":"α 衰变使质量数减 4、电荷数减 2；β 衰变质量数不变、电荷数加 1","q":[{"q":"²³⁸U 经过一系列衰变变成 ²⁰⁶Pb。求其中 α 衰变与 β 衰变的次数。","s":["质量数减少 238 − 206 = 32","每次 α 衰变减 4，故 α 衰变次数 = 32/4 = 8","电荷数应由 92 减到 82，净减少 10","8 次 α 衰变减少 16，故 β 衰变 16 − 10 = 6 次"],"a":"8 次 α 衰变，6 次 β 衰变","c":"先用质量数定 α 次数，再用电荷数反推 β 次数，顺序不能颠倒","x":"列式一次搞定：净减少的电荷数 = 2n_α − n_β，即 10 = 16 − n_β，n_β = 6"}],"v":["求 α 衰变的次数","求 β 衰变的次数","由始末核的质量数与电荷数差求解","列方程组计算","先定 α 再定 β"]},{"t":"三种射线在电磁场中的偏转","f":"判断α、β、γ射线在磁场或电场中的偏转方向与弯曲程度","k":"α带正电、β带负电、γ不带电；半径 r = mv/(qB)，α的半径远大于β","q":[{"q":"三种射线垂直射入垂直纸面向里的匀强磁场，判断各自的偏转情况。","s":["γ不带电，不受洛伦兹力，沿直线前进","α带正电，由左手定则偏向一侧；β带负电，偏向相反一侧","半径 r = mv/(qB)：α的质量大、速度小，但电荷量只有 2e，综合后半径远大于β","故α的圆弧最平缓，β的圆弧最弯曲"],"a":"γ不偏转；α与β向相反方向偏转，且α的半径远大于β","c":"「α偏得少、β偏得多、γ不偏」——三者的质量电荷比决定了这一点","x":"先用带电性定偏转方向（左手定则），再用 r = mv/(qB) 定弯曲程度"}],"v":["判断各自的偏转方向","比较弯曲程度","γ 为什么不偏转","α 与 β 偏转方向相反","半径 r = mv/(qB)"]}],"宇宙速度":[{"t":"三个宇宙速度的物理意义","f":"判断某发射速度对应的运动状态（绕地、绕日、飞出太阳系），或计算某星球的第一宇宙速度","k":"7.9 km/s 是最小发射速度也是最大环绕速度；11.2 km/s 脱离地球引力；16.7 km/s 脱离太阳系","q":[{"q":"某探测器的发射速度为 12 km/s。判断它此后的运动情况。","s":["12 km/s > 11.2 km/s，已能脱离地球引力的束缚","12 km/s < 16.7 km/s，还不能脱离太阳引力","因此它将成为绕太阳运行的人造天体","轨道为椭圆或双曲线，取决于剩余动能的大小"],"a":"脱离地球束缚，成为绕太阳运动的人造天体","c":"三个阈值对应「脱离谁」：7.9 绕地、11.2 离地、16.7 离日，逐级判断即可","x":"第二宇宙速度就是第一的 √2 倍：由 ½mv² = GMm/R 得 v = √(2GM/R) = √2·v₁，不必硬记"}],"v":["判断发射速度对应的运动状态","第一宇宙速度的物理意义","第二、第三宇宙速度的数值","某星球的第一宇宙速度"]},{"t":"第一宇宙速度的推导与变形","f":"给出某星球的质量与半径（或密度与半径），求其第一宇宙速度或与其他星球的比值","k":"v₁ = √(GM/R) = √(gR)，只由中心天体决定，与环绕天体质量无关","q":[{"q":"某行星的质量是地球的 8 倍，半径是地球的 2 倍。求该行星的第一宇宙速度与地球之比。","s":["v = √(GM/R)","v星/v地 = √[(8M/M) ÷ (2R/R)] = √4 = 2","地球第一宇宙速度为 7.9 km/s","该行星约为 15.8 km/s"],"a":"2:1，约 15.8 km/s","c":"比例法：v ∝ √(M/R)，把质量比与半径比代入即可，不必求绝对数值","x":"若给的是密度 ρ 与半径 R，则 v = √(4πGρR²/3) ∝ R√ρ，换成这个比例式再算"}],"v":["由 M、R 求 v₁","由 ρ、R 求 v₁","求两星球 v₁ 之比","v₁ 与近地环绕速度的关系","v₁ 是最小发射速度也是最大环绕速度"]},{"t":"近地卫星、同步卫星与赤道物体的比较","f":"比较三类天体的线速度、角速度、向心加速度与周期","k":"近地卫星 r ≈ R、周期约 85 min；同步卫星 T = 24 h、位于赤道正上方；赤道上的物体与同步卫星角速度相同但半径更小","q":[{"q":"比较近地卫星 A、同步卫星 B、赤道上随地球自转的物体 C 的线速度与角速度大小。","s":["A、B 都是卫星，由 v = √(GM/r)：r_A < r_B，故 v_A > v_B","B 与 C 的周期都是 24 h，角速度相同，ω_B = ω_C","由 v = ωr：r_B > r_C，故 v_B > v_C","合起来 v_A > v_B > v_C，且 ω_A > ω_B = ω_C"],"a":"v_A > v_B > v_C；ω_A > ω_B = ω_C","c":"三者的关键分野：A、B 用「万有引力提供向心力」，B、C 用「角速度相同」，两组关系绝不能混用","x":"记「卫星越高越慢，赤道上的物体被同步卫星甩在后面」"}],"v":["比较三者的线速度","比较三者的周期","同步卫星与赤道物体角速度相同","比较三者的向心加速度","赤道物体为何不是卫星"]}],"守恒思想":[{"t":"守恒量的选取与判定","f":"判断某过程中哪个量守恒，或由初末状态求未知量、求摩擦生热","k":"先看外力：合外力为零→动量守恒；只有重力弹力做功→机械能守恒；有摩擦生热→能量守恒但机械能不守恒","q":[{"q":"质量 2 kg 的物块以 6 m/s 滑上粗糙水平面，滑行 4 m 后停下。求摩擦力大小与产生的热量（g = 10）。","s":["用动能定理：−f·x = 0 − ½mv²","f = mv²/(2x) = 2×36 ÷ 8 = 9 N","产生的热量 Q = f·x = 9×4 = 36 J","与初动能 ½×2×36 = 36 J 相等，机械能全部转化为内能"],"a":"摩擦力 9 N，热量 36 J","c":"有摩擦时机械能不守恒，但能量守恒：减少的机械能等于摩擦力乘相对滑动路程","x":"一步法：Q = ΔEk = ½mv² = 36 J，再由 f = Q/x = 9 N 反推，省掉列方程的功夫"}],"v":["判断哪个量守恒","由初末状态求未知量","由能量守恒求摩擦生热","在动量与能量之间做选择"]},{"t":"多过程问题里的守恒串联","f":"碰撞、滑行、上摆等多阶段连在一起，需要分段选择守恒定律","k":"碰撞瞬间动量守恒（时间极短、内力远大于外力）；碰后滑行或上升用能量守恒；两段靠共同速度衔接","q":[{"q":"质量 1 kg 的子弹以 300 m/s 水平射入静止在光滑水平面上质量 4 kg 的木块并留在其中，随后一起压缩一轻弹簧。求共同速度与弹簧的最大弹性势能。","s":["射入过程极短，动量守恒：1×300 = (1+4)v","v = 60 m/s","碰后系统机械能守恒，动能全部转化为弹性势能","Ep = ½×5×60² = 9000 J"],"a":"共同速度 60 m/s，最大弹性势能 9000 J","c":"完全非弹性碰撞损失动能最多，但动量一定守恒；碰后立刻换成能量守恒，中间靠共同速度衔接","x":"记住口诀「碰前动量、碰后能量」，两段各用一条定律，不必去追中间的内力过程"}],"v":["碰撞后再滑行","滑行后冲上斜面","分段选择守恒定律","交界处速度的传递"]},{"t":"用守恒思想处理变质量问题","f":"处理水流、沙流、连续喷射等变质量系统的动量问题","k":"取一小段时间 Δt 内的质量元 Δm 为研究对象，对「即将进入或离开」的系统用动量定理","q":[{"q":"水管以速度 v 水平喷水，水打到竖直墙上后顺墙流下。水密度 ρ、管口面积 S，求水对墙的平均作用力。","s":["Δt 内打到墙上的水质量 Δm = ρSvΔt","这些水垂直墙方向的动量由 ρSvΔt·v 变为 0","由动量定理：FΔt = Δm·v = ρSv²Δt","故 F = ρSv²"],"a":"F = ρSv²","c":"变质量题的关键是「取一段质量元」，把连续过程切成一个个可算的小碰撞","x":"记住 ρSv² 这个结果，水流打墙、风吹帆面都是同一个式子"}],"v":["求水流对墙的作用力","沙流落到传送带上","连续喷射的反冲","取一段质量元分析"]}],"安培力":[{"t":"安培力的大小与方向","f":"求安培力的大小与方向，或判断通电导线的运动趋势","k":"F = BIL sinθ（θ 是 B 与 I 的夹角）；方向用左手定则：磁感线穿入掌心、四指指电流、拇指指受力","q":[{"q":"长 0.2 m 的导线通 5 A 电流，置于 0.5 T 的匀强磁场中，导线与磁场方向成 30° 角。求安培力大小。","s":["F = BIL sinθ","代入得 0.5×5×0.2×sin30°","= 0.5×5×0.2×0.5","= 0.25 N"],"a":"0.25 N","c":"公式中的 sinθ 是 B 与 I 的夹角：垂直时最大、平行时为零，角度取错结果必错","x":"把 B 分解为平行与垂直分量：只有垂直分量 B sinθ 产生力，一眼看出为何平行时力为零"}],"v":["求安培力的大小","用左手定则判断方向","判断通电导线的运动趋势","F = BIL 的适用条件","电流与磁场平行时安培力为零"]},{"t":"安培力作用下的平衡","f":"通电导体棒在导轨上受安培力，配合重力、支持力、摩擦力求平衡条件或加速度","k":"先把立体图转成侧视平面受力图，用左手定则定安培力方向，再按共点力平衡处理","q":[{"q":"质量 0.1 kg、长 0.5 m 的导体棒水平放在倾角 30° 的光滑导轨上，通 2 A 电流，磁场竖直向上且 B = 0.5 T。求导体棒受到的摩擦力（g 取 10 m/s²）。","s":["安培力水平向右：F = BIL = 0.5×2×0.5 = 0.5 N","重力沿斜面向下的分力 = mg sin30° = 0.5 N","安培力沿斜面向上的分力 = F cos30° ≈ 0.433 N","两者不等，需静摩擦 f ≈ 0.067 N，方向沿斜面向上"],"a":"摩擦力约 0.067 N，沿斜面向上","c":"立体图必须转成侧视受力图再画力，直接在立体图上画安培力几乎一定出错","x":"用「等效重力」：把安培力与重力先合成，再看合力沿斜面的分量，比分别投影更少出错"}],"v":["求导体棒受到的安培力","求导轨上的加速度","配合重力与摩擦力求平衡","求磁感应强度大小","斜面导轨上的平衡"]},{"t":"安培力做功与能量转化","f":"求安培力做的功、产生的热量，或判断能量转化的方向","k":"安培力做正功时电能转化为机械能（电动机），做负功时机械能转化为电能（发电机）","q":[{"q":"通电导体棒在磁场中受安培力作用沿导轨移动 0.5 m，安培力大小恒为 0.4 N 且与运动方向相同。求安培力做的功与消耗的电能（不计电阻）。","s":["W = F·s = 0.4×0.5 = 0.2 J","安培力做正功，说明电能转化为机械能","不计电阻时没有焦耳热，电能全部转化为机械能","故消耗的电能为 0.2 J"],"a":"安培力做功 0.2 J，消耗电能 0.2 J","c":"「安培力做正功 = 电动机，做负功 = 发电机」，这是判断能量流向最快的一句话","x":"直接用 W = Fs，注意安培力与位移同向才做正功"}],"v":["求安培力做的功","判断能量转化的方向","求产生的热量","电动机与发电机的区别","安培力做正功还是负功"]}],"导轨问题":[{"t":"单棒切割的动力学与能量","f":"求棒的加速度、最大速度、产生的热量、通过截面的电荷量","k":"三步链条：E = BLv → I = E/R → F = BIL；最大速度出现在安培力等于外力（a = 0）时","q":[{"q":"质量 0.1 kg 的导体棒在光滑水平导轨上受 0.5 N 恒力由静止启动，B = 0.5 T，棒长 0.4 m，回路总电阻 0.2 Ω。求棒能达到的最大速度。","s":["速度最大时加速度为零，安培力等于外力：BIL = 0.5 N","I = 0.5/(0.5×0.4) = 2.5 A","E = IR = 2.5×0.2 = 0.5 V","v = E/(BL) = 0.5/0.2 = 2.5 m/s"],"a":"2.5 m/s","c":"最大速度的条件永远是「加速度为零」，即安培力与外力平衡，与过程是否匀加速无关","x":"直接用 v_max = FR/(B²L²) = 0.5×0.2/(0.25×0.16) = 2.5 m/s，一步出结果"}],"v":["求棒的加速度","求棒最终的最大速度","求产生的热量","求通过截面的电荷量","加速度减小的加速运动"]},{"t":"双棒模型与动量能量综合","f":"两根棒在同一导轨上通过磁场相互作用，求最终速度、相对位移、产生的总热量","k":"双棒系统的安培力等大反向、属于内力，动量守恒；最终两棒共速，损失的动能全部转化为焦耳热","q":[{"q":"光滑导轨上两根质量均为 0.1 kg 的棒，一根以 3 m/s 运动、另一根静止，通过磁场相互作用。求最终共同速度与产生的总热量。","s":["系统所受安培力是内力，动量守恒：mv₀ = 2mv","v = 1.5 m/s","动能损失 = ½×0.1×9 − ½×0.2×2.25","= 0.45 − 0.225 = 0.225 J，全部转化为焦耳热"],"a":"共同速度 1.5 m/s，产生热量 0.225 J","c":"双棒模型两个关键：动量守恒（安培力是内力）、能量守恒（损失的动能全变热），缺一不可","x":"用约化质量速算：Q = ½μv_rel²，μ = m/2 = 0.05 kg，Q = ½×0.05×9 = 0.225 J，一步出"}],"v":["求最终的共同速度","求两棒之间的相对位移","求产生的总热量","用动量守恒求速度","双棒间距的变化"]},{"t":"导轨问题的 v-t 与 i-t 图像","f":"由棒的 v-t 图判断受力与电动势变化，或定性画出 i-t 图","k":"单棒在恒力作用下：v↑ → E↑ → I↑ → 安培力↑ → 合力↓ → a↓，最终匀速","q":[{"q":"导体棒在恒力 F 作用下从静止开始沿光滑导轨运动（回路电阻 R、匀强磁场 B）。定性描述其 v-t 图与 i-t 图。","s":["初始 v = 0，E = 0，I = 0，安培力为零，a = F/m 最大","随 v 增大，E = BLv 增大，I = BLv/R 增大","安培力 F安 = B²L²v/R 增大，合力减小，加速度减小","当 F安 = F 时 a = 0，速度达到最大值 v_m = FR/(B²L²)","v-t 图是斜率逐渐减小的曲线，最终趋于水平；i ∝ v，i-t 图形状相同"],"a":"v-t 与 i-t 都是「先陡后缓、趋于水平」的曲线，最终匀速","c":"导轨题的核心链条：v → E → I → F安 → a → v，走完一圈就知道是「加速度减小的加速运动」","x":"记「恒力启动的导轨问题最终一定匀速」，v_m = FR/(B²L²)，求最大速度一步到位"}],"v":["由 v-t 图判断受力变化","定性画出 i-t 图","判断最终是否匀速","斜率与加速度的对应","最大速度 v_m = FR/(B²L²)"]}],"布朗运动":[{"t":"布朗运动的成因与影响因素","f":"解释为什么颗粒越小、温度越高布朗运动越明显，或判断某因素对布朗运动的影响","k":"成因是液体分子对各方向撞击不平衡；颗粒越小撞击越不平衡、质量越小越易被推动；温度越高分子运动越剧烈","q":[{"q":"为什么悬浮颗粒越小，布朗运动越明显？","s":["颗粒越小，同一时刻撞击它的分子数越少","各方向撞击的不平衡性（统计涨落）越显著","颗粒质量越小，同样的冲量产生的加速度越大","两个原因叠加，使小颗粒的布朗运动格外明显"],"a":"撞击的不平衡性更显著，且颗粒质量小、更易被推动","c":"两个原因必须都说：撞击不平衡（统计涨落）+ 质量小（惯性小），只说一个不完整","x":"用「样本越小、涨落越大」的统计直觉理解，比背结论更牢"}],"v":["解释颗粒越小为什么越明显","解释温度越高为什么越明显","判断某因素的影响方向","撞击不平衡的成因","悬浮颗粒的质量影响"]},{"t":"布朗运动、扩散与热运动的辨析","f":"判断三个概念的说法是否正确，或判断某现象属于哪一类","k":"布朗运动看的是悬浮颗粒、扩散看的是分子直接迁移、热运动指分子本身的运动","q":[{"q":"下列说法的正误：A 布朗运动就是分子的热运动　B 扩散现象说明分子在不停地运动　C 温度越低布朗运动越明显　D 布朗运动只能在液体中发生","s":["布朗运动是颗粒的运动，A 错","扩散是分子直接迁移的证据，B 对","温度越低分子运动越缓慢，布朗运动越不明显，C 错","气体中同样可以观察到布朗运动，D 错"],"a":"只有 B 正确","c":"三个概念的对象不同，判断时先问「说的是谁在动」：颗粒、分子迁移，还是分子本身","x":"一句话辨析：布朗运动是分子热运动的「影子」，不是分子本身"}],"v":["判断某现象属于哪一类","判断某种说法是否正确","扩散与布朗运动的区别","三者都说明分子在无规则运动","扩散是分子直接迁移"]},{"t":"布朗运动的实验观察与位移分析","f":"根据实验记录判断布朗运动的特点，或分析记录间隔与位移的关系","k":"每隔相同时间记录颗粒位置并连线，连线不是轨迹；间隔越长两点间直线距离越大，说明无规则性越强","q":[{"q":"在显微镜下每隔 30 s 记录一次悬浮颗粒的位置并把各点连成折线，这条折线能否表示颗粒的运动轨迹？","s":["折线只连接了每隔 30 s 的位置，间隔内颗粒的实际路径完全未知","间隔内颗粒仍在做复杂的无规则运动，可能已绕行很远","故折线只是等时间间隔的位置连线，不是运动轨迹","间隔取得越短，折线越接近真实轨迹，但永远不会完全重合"],"a":"不能；折线只是等时间间隔的位置连线，不代表运动轨迹","c":"「折线 ≠ 轨迹」是布朗运动实验题的第一道坎，第二道坎是「布朗运动 ≠ 分子运动」","x":"看到「连线」先问三句：间隔多长、记录的是什么、能不能代表路径"}],"v":["折线是不是运动轨迹","间隔时间与位移大小的关系","如何记录颗粒的位置","间隔越短越接近真实轨迹","显微镜下看到的是颗粒不是分子"]}],"带电粒子圆周运动":[{"t":"半径、周期与几何关系","f":"求轨迹半径、周期、运动时间、偏转角，或求射出点的位置","k":"r = mv/(qB)，T = 2πm/(qB)；运动时间 t = (θ/2π)T，圆心角 θ 等于速度方向的偏转角","q":[{"q":"带电粒子垂直进入宽度为 d 的匀强磁场区域，射出时速度方向偏转了 60°。求轨迹半径与在磁场中运动的时间（用 T 表示）。","s":["速度偏转角等于轨迹的圆心角，即 θ = 60°","由几何关系，磁场宽度 d = r sin60°","r = d/sin60° = 2d/√3 ≈ 1.15d","运动时间 t = (60°/360°)T = T/6"],"a":"r = 2d/√3，t = T/6","c":"三步定式：画圆找圆心（圆心在速度垂线上）→ 由几何关系求半径 → 用圆心角求时间","x":"记住「偏转角 = 圆心角」，再用弦长关系 sin(θ/2) = (d/2)/r 直接解半径，省掉辅助线"}],"v":["求轨迹半径 r = mv/(qB)","求周期与运动时间","求粒子运动的偏转角","求射出点的位置","画轨迹找几何关系"]},{"t":"临界问题与多解","f":"粒子从边界射出的范围、恰好不射出的条件，或速度方向、大小不确定带来的多解","k":"临界条件统一是「轨迹与边界相切」；速度方向不确定用旋转圆，速率不确定用缩放圆","q":[{"q":"粒子从正方形磁场区域一边的中点垂直射入，速率可以调节。分析粒子能射出该区域的速率范围。","s":["速率小则半径小，粒子可能在区域内转过半圈，从射入的那条边射出","速率大则半径大，粒子会从对边射出","临界情况是轨迹恰好与对边相切，此时半径由几何关系确定","再由 r = mv/(qB) 反解临界速率，得到速率区间的上下界"],"a":"速率介于「恰好能从原边转出」与「恰好与对边相切」两个临界值之间","c":"一切临界问题都转化为「轨迹与边界相切」，画出相切的那个圆，几何关系立刻显现","x":"旋转圆法：把速度方向绕入射点转一圈，圆心轨迹本身也是一个圆，所有可能的圆心都落在它上面"}],"v":["求粒子从边界射出的范围","求恰好不射出的条件","速度方向不确定带来的多解","速度大小不确定带来的多解","临界半径的确定"]},{"t":"磁聚焦与几何约束","f":"粒子从同一点以不同方向射入磁场，求轨迹圆心的轨迹或射出点的范围","k":"速率相同则半径相同，圆心都在以入射点为圆心、r 为半径的圆上","q":[{"q":"粒子以相同速率、不同方向从同一点射入匀强磁场。求这些粒子轨迹圆心的轨迹。","s":["半径 r = mv/(qB) 只由速率决定，速率相同则半径相同","每个轨迹圆的圆心到入射点的距离都等于 r","所有满足「到定点距离为 r」的点构成一个圆","故圆心轨迹是以入射点为圆心、r 为半径的圆"],"a":"圆心轨迹是以入射点为圆心、r 为半径的圆","c":"「同速率 → 同半径 → 圆心在以入射点为心的圆上」，这是处理多方向入射问题的几何起点","x":"画图时先定圆心圆，再从圆心圆上取点画轨迹圆，比逐个画轨迹快得多"}],"v":["求轨迹圆心的轨迹","求射出点的范围","同速率同半径的几何关系","同一点不同方向射入","聚焦点的位置"]}],"带电粒子运动":[{"t":"加速与偏转的组合","f":"粒子先经加速电场、再进入偏转电场，求偏转距离、偏转角或打在屏上的位置","k":"加速段 eU₁ = ½mv₀²；偏转段是类平抛：t = L/v₀，a = qU₂/(md)，y = ½at²","q":[{"q":"电子经电压 U₁ 加速后，垂直进入长 L、板间距 d、电压 U₂ 的平行板。求射出时的偏转距离 y。","s":["加速段：eU₁ = ½mv₀²，得 v₀² = 2eU₁/m","偏转段飞行时间 t = L/v₀","加速度 a = eU₂/(md)","y = ½at² = ½·eU₂/(md)·L²/v₀² = U₂L²/(4U₁d)"],"a":"y = U₂L²/(4U₁d)","c":"消去 v₀ 后 y 与粒子的 q、m 全部无关，只由电压与几何尺寸决定——这是本模型最重要的结论","x":"直接用「偏转距离与粒子种类无关」判断：把电子换成质子，偏转距离不变，只是方向相反"}],"v":["求偏转距离 y","求射出时的偏转角","求打在屏上的位置","先加速后偏转的联立"]},{"t":"电场与重力场中的等效圆周运动","f":"带电小球在电场与重力共同作用下做圆周运动，求等效最高点、最小速度或临界条件","k":"把电场力与重力合成为「等效重力」，等效最低点沿合力方向，之后完全按普通竖直圆周运动处理","q":[{"q":"质量 m、带正电 q 的小球用绳系住在竖直平面内做圆周运动，同时存在水平向右的匀强电场，且 qE = mg。求等效重力的大小与方向。","s":["重力 mg 竖直向下，电场力 qE = mg 水平向右","合力大小 = √[(mg)² + (mg)²] = √2 mg","方向与竖直方向成 45° 偏右下方","等效重力加速度 g′ = √2 g，等效最低点在右下方 45° 方向"],"a":"等效重力 √2 mg，方向右下方 45°，g′ = √2 g","c":"等效重力法：先把所有恒力合成一个，再把它当成新的「重力」，所有圆周运动结论平移过去","x":"等效最高点的最小速度 v_min = √(g′R) = √(√2gR)，与原结论只差一个 √2 因子，不必重新推导"}],"v":["求等效最高点的位置","求最高点的最小速度","求等效最高点的临界条件","等效重力场的方向与大小","最低点与最高点的张力差"]},{"t":"带电粒子在交变电场中的运动","f":"粒子在周期性变化的电场中运动，求某时刻的速度、位移，或判断能否射出","k":"分时间段处理，每段内都是匀变速；关键是判断粒子在每个半周期内是否反向","q":[{"q":"平行板间加方波电压，周期为 T：前 T/2 内场强向上、后 T/2 内场强向下，大小相同。一个电子从静止在 t = 0 时释放，求一个周期末的速度与位移。","s":["前 T/2：电子带负电，受力方向与场强相反，向下加速","末速度 v = a·T/2，位移 x₁ = ½a(T/2)²","后 T/2：场强反向，电场力向上，做匀减速","末速度 v − a·T/2 = 0，位移 x₂ = v·(T/2) − ½a(T/2)² = ½a(T/2)²","总位移 x = x₁ + x₂ = aT²/4，方向向下"],"a":"一个周期末速度为零，总位移 aT²/4，方向与第一个半周期相同","c":"交变电场的关键是「一个周期末速度是否回到零」——方波且对称时正好回零，粒子只发生整体漂移","x":"画 v-t 图：一个周期是一个三角形，面积就是位移；速度对称则末速为零"}],"v":["求某时刻的速度","求某时刻的位移","判断能否射出电场","周期性加速的累积"]}],"平抛运动":[{"t":"平抛的分解与基本量计算","f":"求飞行时间、水平射程、落地速度大小与方向，或由部分信息反求初速度","k":"时间只由竖直高度决定 t = √(2h/g)，水平位移由 x = v₀t 决定，两个方向靠时间 t 联系","q":[{"q":"从 20 m 高处以 10 m/s 水平抛出小球。求落地时间、水平射程、落地速度大小（g 取 10 m/s²）。","s":["竖直方向自由落体：t = √(2h/g) = √(40/10) = 2 s","水平方向匀速：x = v₀t = 10×2 = 20 m","落地竖直分速度 v_y = gt = 20 m/s","v = √(v₀² + v_y²) = √(100+400) = 10√5 ≈ 22.4 m/s"],"a":"2 s，20 m，10√5 m/s（约 22.4 m/s）","c":"竖直定时间、水平定射程、最后矢量合成求末速度，三步顺序固定","x":"用动能定理求末速度：½mv² = ½mv₀² + mgh，得 v = √(100+400)，比先算 v_y 再合成更快"}],"v":["求平抛的飞行时间","由高度求水平射程","求落地速度大小与方向","由部分信息反求初速度","求某时刻的速度偏角"]},{"t":"斜面平抛与两个偏角推论","f":"平抛落在斜面上、速度方向与斜面平行、求飞行时间或位移比","k":"两个黄金推论：速度偏角的正切等于位移偏角正切的两倍（tanθ_v = 2tanθ_x）；速度的反向延长线过水平位移的中点","q":[{"q":"从倾角 37° 的斜面顶端以 10 m/s 水平抛出小球，小球落在斜面上。求飞行时间（g 取 10 m/s²，sin37°=0.6，cos37°=0.8）。","s":["落在斜面上说明位移方向沿斜面：tan37° = y/x","y = ½gt²，x = v₀t，代入得 ½×10×t² ÷ (10t) = 0.75","化简得 t/2 = 0.75，t = 1.5 s","校验：x = 15 m，y = 11.25 m，y/x = 0.75，与 tan37° 一致"],"a":"1.5 s","c":"「落在斜面上」用位移角，「速度与斜面平行」用速度角，两者由 tanθ_v = 2tanθ_x 联系","x":"直接套 tanθ = gt/(2v₀)：0.75 = 10t/20，得 t = 1.5 s，一个式子解决，不必写两个方向的方程"}],"v":["平抛落在斜面上","速度方向与斜面平行","求飞行时间与位移","位移偏角与速度偏角的关系","从斜面抛出又落回斜面"]},{"t":"平抛的临界与边界问题","f":"球恰好越过网或矮墙、恰好落入某区域，求初速度的取值范围","k":"把「恰好」翻译成「轨迹恰好经过该点」：x = v₀t 与 y = ½gt² 联立，解出边界对应的 v₀","q":[{"q":"从高 0.8 m 的平台水平抛出一小球，平台边缘正前方 1.2 m 处有一堵高 0.2 m 的矮墙。要使小球越过矮墙，初速度至少多大（g = 10）？","s":["恰好越过墙顶，即轨迹恰好经过墙顶那一点","从抛出点到墙顶的下落高度 h = 0.8 − 0.2 = 0.6 m","由 h = ½gt² 得 t = √(2×0.6/10) = √0.12 ≈ 0.35 s","水平位移 x = 1.2 m，故 v₀ = x/t = 1.2/0.35 ≈ 3.5 m/s"],"a":"至少约 3.5 m/s","c":"「恰好越过」就是「轨迹恰好过该点」——把该点坐标代入平抛方程，解出的 v₀ 就是临界值","x":"用比例式更快：v₀ = x√(g/2h) = 1.2×√(10/1.2) ≈ 3.5 m/s，不必先求 t"}],"v":["恰好越过网或矮墙","恰好落入某区域","求初速度的取值范围","擦着边界飞出的条件","两个边界同时满足"]}],"库仑定律":[{"t":"库仑力的合成与平衡位置","f":"两个点电荷对第三个电荷的作用力合成，或求第三个电荷的平衡位置","k":"先判断每个力的方向，再矢量合成；两个同种电荷时，平衡点在电量较小的一侧外部","q":[{"q":"两个正电荷 Q₁ = 4q、Q₂ = q 相距 L。在连线上放第三个电荷使它受力平衡，求其位置。","s":["第三个电荷必在 Q₂ 的外侧（离电量小的更近），才能让两个斥力反向","设它离 Q₂ 的距离为 x，则离 Q₁ 为 L + x","平衡条件：kQ₂q/x² = kQ₁q/(L+x)²","1/x² = 4/(L+x)²，开方得 (L+x)/x = 2，解得 x = L"],"a":"在 Q₂ 外侧、距 Q₂ 为 L 处（距 Q₁ 为 2L）","c":"「两同夹异、两大夹小、近小远大」：同种电荷时平衡点在小电荷外侧，异种电荷时在两者之间","x":"用比例速解：平衡点到两电荷的距离比等于 √Q₁:√Q₂ 的反比，即 2:1，再由距离差 L 直接得 L 与 2L"}],"v":["求第三个电荷受到的合力","求合力为零的位置","判断第三个电荷的电性","两力夹角的合成","平衡位置的唯一性"]},{"t":"三个自由电荷同时平衡","f":"判断第三个电荷的电性、电量与位置，使三个电荷都处于平衡","k":"三条口诀定电性与位置：两同夹异（两边同号、中间异号）、两大夹小（中间电量最小）、近小远大（靠近小电荷）","q":[{"q":"两个正电荷 Q₁ = 4q、Q₂ = q 相距 L，放入第三个电荷使三者都平衡。求它的电性、电量与位置。","s":["三者都平衡要求「两同夹异」：第三个必为负电荷，且位于两电荷之间","「近小远大」：它应靠近电量较小的 Q₂，设距 Q₂ 为 x","由 Q₂ 平衡：kQ₁Q₂/L² = kQ₂q₃/x²","解得 q₃ = 4q/9，x = L/3"],"a":"负电荷，电量 4q/9，位于两电荷之间、距 Q₂ 为 L/3 处","c":"口诀先定电性与位置，再用任一电荷的平衡方程定量，不必三个方程联立","x":"直接用结论式：q₃ = Q₁Q₂/(√Q₁+√Q₂)² = 4q²/(9q) = 4q/9；距小电荷 x = L√Q₂/(√Q₁+√Q₂) = L/3"}],"v":["判断第三个电荷的电性","求第三个电荷的电量","求第三个电荷的位置","两同夹异、两大夹小","三个电荷的平衡条件"]},{"t":"库仑力作用下的动力学","f":"两带电小球在光滑绝缘面上由静止释放，求某时刻的速度、加速度或相对位移","k":"库仑力是变力，加速度也随之变化，只能用动量守恒 + 能量守恒处理","q":[{"q":"两个带电小球质量分别为 m 和 2m、电荷量均为 +q，静止在光滑绝缘水平面上相距 L。由静止释放，求它们相距 2L 时的速度大小。","s":["系统合外力为零，动量守恒：m v₁ = 2m v₂，即 v₁ = 2v₂","库仑力做正功，电势能减少转化为动能：ΔEp = kq²/L − kq²/(2L) = kq²/(2L)","由能量守恒：kq²/(2L) = ½m v₁² + ½·2m v₂²","代入 v₁ = 2v₂：左边 = ½m·4v₂² + m v₂² = 3m v₂²","3m v₂² = kq²/(2L)，得 v₂ = √(kq²/(6mL))，v₁ = √(2kq²/(3mL))"],"a":"v₁ = √(2kq²/(3mL))，v₂ = √(kq²/(6mL))","c":"库仑力是变力，牛顿定律很难用；「动量守恒 + 能量守恒」是这类题的唯一通道","x":"记住同种电荷相斥分离、异种电荷相吸靠近，用动量分配与能量守恒联立，不必求加速度"}],"v":["求某时刻的速度","求初始加速度","求两球靠近的相对位移","用能量守恒求速度","加速度随距离变化的分析"]}],"弹力":[{"t":"弹力有无与方向的判断","f":"判断某个接触处是否存在弹力、方向如何，涉及绳、杆、面、球与球、球与墙角等模型","k":"方向永远垂直于接触面：点面接触过点作面的垂线，球面接触沿半径方向。有无则用假设法——撤去该接触，看运动状态是否改变","q":[{"q":"小球静止在光滑水平地面上并紧靠光滑竖直墙壁（球与墙面接触）。墙对球有没有弹力？","s":["假设撤去墙壁，球在重力和地面支持力作用下依然静止，运动状态没有改变","说明墙对球没有必须存在的弹力","再从平衡看：水平方向若只有墙的弹力一个力，合力不可能为零","故墙对球的弹力为零"],"a":"没有弹力","c":"假设法配合平衡条件双重验证：撤去后状态不变 → 无弹力；撤去后状态改变 → 有弹力","x":"更快的一招：看水平方向是否还有别的力。只有一个力时它必为零，连假设都省了"}],"v":["判断接触处是否存在弹力","绳的拉力一定沿绳","杆的弹力是否一定沿杆","球与墙角、球与球之间的弹力","用假设法判断弹力有无"]},{"t":"胡克定律与弹簧串并联","f":"求弹簧形变量、劲度系数，或弹簧剪断、串联、并联后的等效 k，或与牛顿第二定律结合的瞬时加速度问题","k":"F = kx 中的 x 是形变量（伸长量或压缩量），不是弹簧总长；串联时各弹簧受力相同、形变相加，并联时形变相同、弹力相加","q":[{"q":"劲度系数 200 N/m、原长 10 cm 的弹簧下端挂 4 N 重物。求静止时弹簧长度；若把它剪成等长两段，每段的劲度系数是多少？","s":["由 F = kx 得 x = 4/200 = 0.02 m = 2 cm","弹簧长度 = 原长 + 伸长量 = 10 + 2 = 12 cm","剪成两段后，同样大小的力使每段只伸长原来的一半","由 k = F/x 可知劲度系数变为原来的 2 倍，即 400 N/m"],"a":"12 cm；每段 400 N/m","c":"弹簧的 k 与长度成反比：越短越硬。凡涉及「剪断」「截取」的题，一律先想这条","x":"把原弹簧看成两根半弹簧串联：1/k = 1/k₁ + 1/k₁，解得 k₁ = 2k = 400 N/m，不必记结论也能推"}],"v":["求弹簧的形变量","由 F-x 图求劲度系数","串联后的等效劲度系数","并联后的等效劲度系数","剪断弹簧瞬间的加速度"]},{"t":"轻绳、轻杆、弹簧的弹力特点","f":"判断杆的弹力方向，或比较剪断瞬间各物体的加速度","k":"绳只能拉不能推、方向沿绳；杆可拉可压、方向不一定沿杆；弹簧形变不能突变，剪断瞬间弹力不变，绳的拉力可以突变","q":[{"q":"小球用轻弹簧悬挂在天花板上，另用水平细绳把它拉偏并保持静止。剪断水平细绳的瞬间，小球的加速度方向如何？","s":["剪断前：重力、弹簧拉力、水平绳拉力三力平衡","剪断瞬间，弹簧形变来不及改变，弹力大小方向都不变","水平绳拉力消失，剩下重力与弹簧弹力的合力","该合力与原水平绳拉力等大反向，方向水平","故加速度方向水平，大小为原水平绳拉力除以质量"],"a":"加速度方向水平，大小等于原水平绳拉力除以质量","c":"「弹簧不能突变、绳可以突变」是判断瞬时加速度的唯一依据，先想清楚剪断瞬间哪些力还在","x":"记结论：剪断水平绳 → 合力沿原绳方向反向；剪断弹簧 → 只剩重力，a = g"}],"v":["杆的弹力方向如何确定","剪断瞬间各物体的加速度","弹簧弹力不能突变","绳与杆在瞬间问题中的差别","铰链连接处的受力"]}],"微元法":[{"t":"变力做功的计算","f":"求弹簧弹力、沿曲线摩擦力、变力做功，或求变力做功的平均功率","k":"把过程切成无数小段，每段内近似为恒力，求各段功再累加（这就是积分思想）","q":[{"q":"劲度系数 k = 200 N/m 的弹簧，从原长被缓慢拉长到 0.2 m。求拉力做的功。","s":["拉力 F = kx 随伸长量线性增大，是变力","取微元：dW = kx·dx","累加得 W = ½kx²","W = ½×200×0.04 = 4 J"],"a":"4 J","c":"线性变力做功 = 平均力 × 位移 = (0 + kx)/2 × x = ½kx²，这是微元法最常见的落点","x":"用 F-x 图线下面积（三角形）直接算：½×0.2×40 = 4 J，比积分更快也更直观"}],"v":["求弹簧弹力做的功","求沿曲线的摩擦力做功","求变力做功的平均功率","用 F-x 图线下面积","改用动能定理绕开"]},{"t":"流体与连续介质的微元","f":"求水流、气流、粒子流对物体的作用力，或求单位时间内通过的电荷量、质量","k":"取 Δt 内的质量微元 Δm = ρSvΔt，再用动量定理 FΔt = Δm·Δv 求平均作用力","q":[{"q":"水流以 10 m/s 垂直射向墙面，冲击后沿墙面流下（水平速度变为零）。水管横截面积 2×10⁻⁴ m²，水密度 1×10³ kg/m³。求水对墙的平均作用力。","s":["取 Δt 内流出的水：Δm = ρSvΔt = 1000×2×10⁻⁴×10×Δt = 2Δt kg","水平方向速度由 10 m/s 变为 0","动量定理：FΔt = Δm×10 = 2Δt×10","F = 20 N"],"a":"20 N","c":"流体冲击题固定三步：Δm = ρSvΔt → 动量定理 → 约掉 Δt。写成「单位时间质量」思路更清楚","x":"一步公式 F = ρSv² = 1000×2×10⁻⁴×100 = 20 N，连 Δt 都不用设"}],"v":["求水流对物体的作用力","求气流对帆面的力","求单位时间通过的电荷量","取 Δt 内的质量元","用 ρSv² 求作用力"]},{"t":"微元法求变力的冲量","f":"求随速度变化的力（如随速度变化的阻力）的冲量","k":"把过程切成无数小段，每段内可视为恒力：I = ΣF·Δt，即 F-t 图线下的面积","q":[{"q":"物体运动时受到阻力 F = kv，速度由 v₀ 减到 0。求阻力的总冲量。","s":["F = kv 随时间变化，不能直接用 I = Ft","取微元：dI = F·dt = kv·dt = k·(v·dt) = k·dx","对全程求和：I = k·x总","可见冲量等于 k 乘以总位移，与过程快慢无关"],"a":"I = kx（x 为总位移）","c":"微元法的威力在于「换个变量求和」：kv·dt 里的 v·dt 正好就是 dx","x":"遇到 F 随 v 变化的题，先试着把 dt 换成 dx/v，往往一步就化简"}],"v":["求随速度变化的阻力的冲量","把 dt 换成 dx/v","求 F-t 图线下的面积","冲量与位移的关系","变力冲量的累积"]}],"恒定电流":[{"t":"电路动态分析","f":"滑动变阻器阻值变化，判断电表读数、灯泡亮度、某元件功率如何变化","k":"从变化点出发走一条链：局部 R 变 → 总 R 变 → 总 I 变 → 路端电压变 → 再回到各支路","q":[{"q":"电源电动势 12 V、内阻 1 Ω，外接 3 Ω 的定值电阻与滑动变阻器串联。滑动变阻器由 2 Ω 调到 8 Ω，求路端电压的变化。","s":["总电阻由 3+2+1 = 6 Ω 变为 3+8+1 = 12 Ω","总电流由 12/6 = 2 A 变为 12/12 = 1 A","路端电压 U = E − Ir，由 12−2 = 10 V 变为 12−1 = 11 V","结论：外电阻增大，路端电压升高、总电流减小"],"a":"路端电压由 10 V 增大到 11 V","c":"定性判断用「局部 → 整体 → 局部」的推理链，不要跳步；定量时再代数值","x":"直接用 U = E − Ir：I 减小则 U 增大，一句话定性；需要具体数值时再算一次"}],"v":["判断电表读数的变化","判断灯泡亮度的变化","判断某元件功率的变化","用「串反并同」的规律","滑动变阻器阻值变化的连锁反应"]},{"t":"电功与电热的区分","f":"纯电阻电路与非纯电阻电路（电动机、电解槽）中的功率、发热与效率计算","k":"纯电阻电路 P = UI = I²R = U²/R 三者等价；非纯电阻只能用 P = UI 求总功率，发热必须用 I²R","q":[{"q":"电动机接在 220 V 电源上，通过线圈的电流 5 A，线圈电阻 4 Ω。求总功率、热功率、机械功率与效率。","s":["总功率 P总 = UI = 220×5 = 1100 W","热功率 P热 = I²R = 25×4 = 100 W","机械功率 P机 = P总 − P热 = 1000 W","效率 η = 1000/1100 ≈ 90.9%"],"a":"1100 W、100 W、1000 W，效率约 90.9%","c":"非纯电阻电路中欧姆定律不成立（U ≠ IR），必须用能量守恒把功率拆成「发热 + 有用」两部分","x":"反算校验：若按纯电阻算 R = U/I = 44 Ω，与实际 4 Ω 相差十倍，立刻说明这是非纯电阻电路"}],"v":["纯电阻电路的功率","电动机的发热与输出功率","电解槽的效率","非纯电阻不能用 U²/R","电功大于电热"]},{"t":"含电容器的直流电路","f":"求电容器两端电压与所带电荷量，或开关变化后通过某支路的电荷量","k":"稳态时电容器所在支路无电流、相当于断路；电容器两端电压等于与它并联部分的电压","q":[{"q":"电源电动势 12 V、内阻 1 Ω，外接 R₁ = 5 Ω 与 R₂ = 6 Ω 串联，电容器（C = 2 μF）与 R₂ 并联。求电容器两端电压与所带电荷量。","s":["稳态时电容器支路无电流，电路就是 R₁ 与 R₂ 串联","I = E/(R₁ + R₂ + r) = 12/(5 + 6 + 1) = 1 A","电容器电压等于 R₂ 两端电压：U = IR₂ = 6 V","Q = CU = 2×10⁻⁶ × 6 = 1.2×10⁻⁵ C"],"a":"电压 6 V，电荷量 1.2×10⁻⁵ C","c":"含容电路两步走：先把电容器当断路画出等效电路算电流，再把电容器接回去读它并联部分的电压","x":"记住「电容器电压 = 并联部分电压」，不必管它自己那条支路"}],"v":["求电容器两端的电压","求电容器所带的电荷量","开关变化后通过的电荷量","稳态时电容器相当于断路","与电容器串联的电阻无电流"]}],"折射率":[{"t":"折射率的两种定义","f":"用 n = sinθ₁/sinθ₂ 或 n = c/v 求折射率，或比较不同介质的折射率","k":"两种定义完全等价：n = sinθ₁/sinθ₂ = c/v；n 由介质和光的频率共同决定，不是介质单独的性质","q":[{"q":"光在某介质中的速度为 2×10⁸ m/s。求该介质的折射率；若光从空气以 45° 入射，求折射角。","s":["n = c/v = 3×10⁸ ÷ 2×10⁸ = 1.5","由 n = sinθ₁/sinθ₂ 得 sinθ₂ = sin45°/1.5","sinθ₂ = 0.707/1.5 ≈ 0.471","θ₂ ≈ 28.1°"],"a":"n = 1.5，折射角约 28.1°","c":"已知速度用 n = c/v，已知角度用 n = sinθ₁/sinθ₂，按已知量选式子","x":"记住常见值：水 4/3、玻璃 1.5、金刚石 2.4，可快速判断答案是否离谱"}],"v":["用 sinθ₁/sinθ₂ 求 n","用 c/v 求 n","比较不同介质的折射率","两种定义为什么等价","n 由介质本身决定"]},{"t":"折射率与光速、波长的关系","f":"求介质中的波长、频率、速度，或比较不同色光的折射率大小","k":"频率由光源决定、进入介质不变；v = c/n，λ = λ₀/n","q":[{"q":"某色光在真空中波长 500 nm，进入折射率 1.5 的玻璃。求玻璃中的波长与频率。","s":["频率 f = c/λ₀ = 3×10⁸ ÷ 5×10⁻⁷ = 6×10¹⁴ Hz","频率不随介质改变，仍为 6×10¹⁴ Hz","λ = λ₀/n = 500/1.5","≈ 333 nm"],"a":"波长约 333 nm，频率 6×10¹⁴ Hz","c":"「频率不变」必须写在第一步，颜色、光子能量都由频率决定，与介质无关","x":"波长直接除以 n，不必绕道算速度，一步出结果"}],"v":["求介质中的波长","求介质中的光速","频率在介质中不变","比较不同色光的折射率","λ介质 = λ真空/n"]},{"t":"相对折射率与绝对折射率的换算","f":"用一般形式的折射定律处理两种介质之间的折射，或由相对折射率判断偏折方向","k":"n₁sinθ₁ = n₂sinθ₂ 是普适形式；相对折射率 n₂₁ = n₂/n₁ = sinθ₁/sinθ₂","q":[{"q":"光从折射率 1.5 的玻璃射入折射率 1.33 的水，判断光线相对法线如何偏折。","s":["由 n₁sinθ₁ = n₂sinθ₂，其中 n₁ = 1.5 > n₂ = 1.33","故 sinθ₂ > sinθ₁，即 θ₂ > θ₁","折射角大于入射角，光线偏离法线","相对折射率 n₂₁ = 1.33/1.5 < 1，同样说明是「由密到疏」"],"a":"折射角大于入射角，光线偏离法线","c":"「由密到疏偏离法线、由疏到密靠近法线」，判据就是两个 n 谁大谁小","x":"先比两个折射率的大小定偏折方向，只有需要算角度时才动 sin"}],"v":["用一般形式的折射定律","判断光线相对法线如何偏折","由相对折射率比较 n 的大小","n₁sinθ₁ = n₂sinθ₂","由密到疏与由疏到密"]}],"摩擦力":[{"t":"静摩擦与滑动摩擦的判断与计算","f":"给出外力大小，判断物体是否滑动、求摩擦力大小方向，或求恰好滑动的临界外力","k":"先算最大静摩擦力判断是否滑动：不滑动时用平衡条件求静摩擦，滑动后才用 f = μN。两者绝不能混用","q":[{"q":"质量 5 kg 的物体放在水平地面上，与地面间动摩擦因数 0.4。用 15 N 的水平力推它，求物体受到的摩擦力（g 取 10 m/s²，最大静摩擦力等于滑动摩擦力）。","s":["最大静摩擦力 f_max = μmg = 0.4×5×10 = 20 N","推力 15 N < 20 N，物体保持静止","由平衡条件，静摩擦力大小等于推力","f = 15 N，方向与推力方向相反"],"a":"15 N，方向与推力相反","c":"三步定式：算 f_max → 比较外力 → 决定用平衡条件还是 μN。跳过第一步直接用 μN 是最常见的失分点","x":"记住「静摩擦随外力变、滑动摩擦才用公式」；本题若答 20 N，就说明把静摩擦当成了滑动摩擦"}],"v":["判断物体是否发生相对滑动","求摩擦力的大小与方向","求恰好滑动时的临界外力","最大静摩擦力略大于滑动摩擦力","由运动状态反推摩擦力"]},{"t":"传送带上的摩擦力与相对位移","f":"物体轻放到传送带上，求加速度、达到共速的时间与位移、相对滑动的划痕长度，或倾斜传送带上的多过程运动","k":"摩擦力方向由「相对运动方向」决定，与物体对地速度方向无关；共速是摩擦力突变（消失或反向）的临界点","q":[{"q":"水平传送带以 2 m/s 匀速运行，把一物体轻放在左端，物体与带间动摩擦因数 0.2。求物体加速到与带共速所需的时间和位移（g 取 10 m/s²）。","s":["物体初速为零，相对传送带向后滑，所受摩擦力向前","a = μg = 0.2×10 = 2 m/s²","t = v/a = 2/2 = 1 s","x = v²/(2a) = 4/4 = 1 m"],"a":"1 s，1 m","c":"相对运动方向定摩擦力方向；共速之后若不再受其他力，物体与带一起匀速，摩擦力立即消失","x":"画 v-t 图：传送带是水平线、物体是过原点的斜线，两线间面积就是划痕长度 = 2×1 − 1 = 1 m，位移与划痕一次算清"}],"v":["求达到共速所需的时间","求传送带上的划痕长度","倾斜传送带的多过程分析","判断摩擦力方向何时改变","求物体与传送带的相对位移"]},{"t":"摩擦力方向的判断","f":"判断静摩擦或滑动摩擦的方向，特别是叠放、传送带、斜面上的情形","k":"滑动摩擦方向与相对运动方向相反；静摩擦方向与相对运动趋势相反，用「假设法」判断","q":[{"q":"物块 A 放在物块 B 上，B 放在水平地面上，用水平力拉 B 使两者一起向右加速运动。判断 A 所受摩擦力的方向。","s":["A 与 B 一起向右加速，A 的加速度方向向右","A 水平方向只可能受 B 给它的静摩擦力","这个摩擦力正是提供 A 加速度的唯一来源","故方向向右，大小 f = m_A·a"],"a":"方向向右，大小 f = m_A·a","c":"静摩擦方向看「相对运动趋势」：假设接触面光滑，看 A 相对 B 往哪滑，摩擦力就反向——本题中 A 会相对 B 向左滑，故摩擦力向右","x":"一句话：静摩擦总是「跟着加速度走」，物体被谁带着加速，摩擦就朝加速度方向"}],"v":["叠放物体之间的摩擦力方向","传送带对物体的摩擦力方向","斜面上静摩擦的方向","由相对运动趋势判断方向","摩擦力可以是动力"]},{"t":"摩擦力做功与摩擦生热","f":"求摩擦力做的功、系统产生的热量、相对滑动距离","k":"一对摩擦力做的总功等于 −f·Δx相对；产生的热量 Q = f·Δx相对，Δx相对 是相对滑动路程","q":[{"q":"质量 1 kg 的物块以 4 m/s 滑上静止在光滑水平面上质量 3 kg 的长木板，最终两者共速。物块与木板间动摩擦因数 0.2。求共速速度、产生的热量与相对滑动距离（g = 10）。","s":["动量守恒：1×4 = (1+3)v，得 v = 1 m/s","热量等于动能损失：Q = ½×1×4² − ½×4×1² = 8 − 2 = 6 J","摩擦力 f = μmg = 0.2×1×10 = 2 N","由 Q = f·Δx 得 Δx = 6/2 = 3 m"],"a":"共速 1 m/s，热量 6 J，相对滑动 3 m","c":"「Q = f × 相对路程」是板块问题的核心等式，注意是相对路程，不是各自的位移","x":"三步固定：动量守恒定共速 → 动能差定热量 → 除以 f 得相对位移，顺序不能颠倒"}],"v":["求摩擦力对物体做的功","求系统产生的热量 Q=f·Δx相对","求相对滑动距离","一对摩擦力做功之和为负","传送带问题中的能量转化"]}],"整体隔离法":[{"t":"连接体求加速度与内力","f":"求系统加速度，或求两物体之间的相互作用力（绳张力、相互挤压、杆的弹力）","k":"求加速度先整体（F外 = Σma）；求内力再隔离（挑受力最少的那个物体列式）","q":[{"q":"光滑水平面上，质量 2 kg 与 3 kg 的两物块用轻绳相连，水平拉力 F = 10 N 作用在 3 kg 上。求加速度与绳张力。","s":["整体：a = F/(m₁+m₂) = 10 ÷ 5 = 2 m/s²","隔离 2 kg：T = m₁·a = 4 N","隔离 3 kg 校验：F − T = 10 − 4 = 6 = 3×2 ✓","张力按质量比例分配：T = F·m₁/(m₁+m₂)"],"a":"加速度 2 m/s²，绳张力 4 N","c":"「先整体求 a，再隔离求内力」是固定两步；隔离时挑受力少的那个，方程最简单","x":"内力按质量比例分配：T = F × 未被拉一侧的质量 ÷ 总质量 = 10×2/5 = 4 N，一步得"}],"v":["求系统的加速度","用隔离法求绳的张力","求两物体之间的挤压力","先整体后隔离"]},{"t":"整体法的适用条件","f":"判断能否把系统当整体，或求地面对系统的支持力与摩擦力","k":"各物体加速度相同（或都为零）时可整体列 F = ma；加速度不同也能用，但要写 ΣF外 = Σma 的分量式","q":[{"q":"物块沿粗糙斜面加速下滑，斜面始终静止在水平地面上。判断地面对斜面的摩擦力方向。","s":["物块加速下滑，加速度沿斜面向下，具有水平分量 a水平","对「物块 + 斜面」整体，竖直方向无加速度、水平方向合外力 = m·a水平 ≠ 0","水平方向唯一的外力就是地面对斜面的摩擦力","故摩擦力方向与 a水平 同向，即指向斜面低端一侧"],"a":"方向与物块水平加速度同向，指向斜面低端一侧","c":"加速度不同也能整体：写 ΣF外 = Σma 按分量算，这是整体法的通用形式，别只记「加速度相同才能用」","x":"判据一句话：看系统重心往哪边加速，地面摩擦力就朝哪边"}],"v":["判断能否用整体法","求地面对系统的支持力","求地面对系统的摩擦力","加速度相同时才能整体","有相对加速度时的处理"]},{"t":"加速度不同的系统用整体法","f":"系统内各物体加速度不同时，用系统牛顿第二定律求外力","k":"ΣF外 = m₁a₁ + m₂a₂ + …（矢量和）；整体法只求外力，求内力必须隔离","q":[{"q":"光滑水平面上，质量 M 的斜面（倾角 θ）上有一质量 m 的物块以加速度 a 沿斜面下滑，斜面不动。求地面对斜面的支持力。","s":["对整体在竖直方向用系统牛顿第二定律：N − (M+m)g = m·a_y + M·0","物块加速度的竖直分量 a_y = a·sinθ，方向向下，故取负","N = (M+m)g − ma·sinθ","支持力小于总重力，因为物块具有向下的加速度"],"a":"N = (M+m)g − ma·sinθ","c":"系统牛顿第二定律的价值就在这里：不必拆内力，直接对外力做矢量和","x":"写方程时把各物体的加速度分解到所求方向，代入 ΣF = Σma 即可"}],"v":["用系统牛顿第二定律","求地面的支持力","求地面的摩擦力","ΣF = Σma 的矢量性","各加速度分解到所求方向"]}],"曲线运动":[{"t":"曲线运动的条件与轨迹判断","f":"判断物体是否做曲线运动、轨迹向哪一侧弯曲、速率如何变化","k":"合力与速度不共线则做曲线运动；轨迹夹在速度与合力之间并朝合力一侧弯曲。速率增减看合力与速度的夹角：锐角加速、钝角减速","q":[{"q":"质点在某点速度水平向右，此时起受到斜向右下方的恒力作用。判断此后轨迹如何弯曲、速率如何变化。","s":["合力与速度不共线，质点做曲线运动","轨迹向合力一侧弯曲，即向右下方弯曲","合力与速度的夹角为锐角，合力在速度方向上有正分量","故速率不断增大，轨迹是一条向下弯曲且越来越陡的曲线"],"a":"轨迹向右下方弯曲，速率增大","c":"两条判据分开用：弯曲方向看合力指向哪侧，速率增减看夹角是锐角还是钝角","x":"把合力分解成切向与法向分量：切向分量改变速率、法向分量改变方向，一画分解图结论自明"}],"v":["判断物体是否做曲线运动","轨迹弯向合力一侧","速率在增大还是减小","合力方向与轨迹的关系","合力与速度共线时的运动"]},{"t":"运动的合成与分解（渡河模型）","f":"小船渡河的最短时间、最短位移，或绳拉船、杆靠墙等速度分解问题","k":"分运动具有独立性：垂直河岸的分速度决定渡河时间，沿河岸的分速度只影响落点位置","q":[{"q":"河宽 100 m，水流速度 3 m/s，船在静水中的速度 4 m/s。求渡河的最短时间及此时的位移大小。","s":["船头垂直河岸时垂直分速度最大，渡河时间最短","t = d/v船 = 100/4 = 25 s","这段时间内沿河岸漂移 x = v水 t = 3×25 = 75 m","合位移 = √(100² + 75²) = 125 m"],"a":"最短时间 25 s，位移 125 m","c":"最短时间看垂直分速度、最短位移看合速度方向，两个问题的判据完全不同，别混用","x":"3-4-5 勾股数直接读出 125 m；若要最短位移，则让合速度垂直河岸，位移就是河宽 100 m（前提 v船 > v水）"}],"v":["求最短渡河时间","求最短渡河位移","船速小于水速时的最短位移","绳拉船的速度分解","杆靠墙时两端速度关系"]},{"t":"两个分运动合成的性质判断","f":"判断合运动是直线还是曲线、是匀变速还是变加速，并求某时刻的合速度","k":"合加速度与合初速度共线则做直线运动，不共线则做曲线运动；加速度恒定就是「匀变速」","q":[{"q":"物体同时参与两个分运动：水平方向匀速 v = 3 m/s，竖直方向初速为零、加速度 4 m/s² 匀加速。判断合运动的性质，并求 2 s 末的速度大小。","s":["合初速度为 3 m/s，水平方向；合加速度为 4 m/s²，竖直方向","两者不共线，故合运动是曲线运动","加速度恒定，故为匀变速曲线运动（本质就是类平抛）","2 s 末：vx = 3 m/s，vy = 4×2 = 8 m/s","v = √(3² + 8²) = √73 ≈ 8.5 m/s"],"a":"匀变速曲线运动，2 s 末速度约 8.5 m/s","c":"判断合运动性质只用两句话：加速度与初速度共线则直线、不共线则曲线；加速度是否恒定决定「匀」还是「变」","x":"认出「水平匀速 + 竖直匀加速」就是平抛模型，直接套平抛的结论"}],"v":["判断合运动是直线还是曲线","判断合运动是否匀变速","求某时刻的合速度","两个匀速运动的合成","一个匀速一个匀变速的合成"]}],"机械振动与波":[{"t":"振动图像与波动图像的互推","f":"给出振动图像与波动图像之一，求波速、波长、周期，或判断某质点的振动方向","k":"振动图像是「一个质点随时间」，波动图像是「某一时刻所有质点」；波速 v = λ/T 是连接两者的唯一桥梁","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波速 2 m/s，波长 4 m，振幅 5 cm。求周期，并说明 t = 0 时位于 x = 0 处、正从平衡位置向上运动的质点的振动图像特征。","s":["由 v = λ/T 得 T = λ/v = 4/2 = 2 s","振幅 5 cm，周期 2 s，角频率 ω = 2π/T = π rad/s","t = 0 时位移为零、速度方向向上，故初相位为零","振动图像为 x = 5sin(πt) cm，从原点出发向上的一条正弦曲线"],"a":"T = 2 s；振动图像是从原点向上的正弦曲线，振幅 5 cm","c":"先由 v = λ/T 求周期，再由初位置与初速度定初相位，最后按振幅画图，三步固定","x":"判断质点振动方向用「上下坡法」：沿波传播方向看，上坡处质点向下、下坡处质点向上，比代公式快得多"}],"v":["由振动图求波长与波速","由波形图求周期","判断某质点的振动方向","两图结合求传播方向","区分振动图与波形图的横轴"]},{"t":"波的多解问题","f":"已知两时刻的波形（或某质点两时刻的位置），求波速、波长、周期的可能值","k":"波传播的距离 Δx = nλ + Δx₀（n = 0,1,2…），v = Δx/Δt；多解来自时间的周期性与传播方向的不确定","q":[{"q":"一列简谐横波的波长 4 m，t = 0 与 t = 0.5 s 时的波形完全相同。求可能的波速。","s":["波形相同说明经过的时间是周期的整数倍：Δt = nT","T = Δt/n = 0.5/n","v = λ/T = 4n/0.5 = 8n m/s","取 n = 1,2,3… 得 8、16、24 m/s…"],"a":"v = 8n m/s（n = 1,2,3…）","c":"多解题必须写出含 n 的通式再取整数，漏掉 n 就是漏解；若传播方向不确定，还要再加一组反向的解","x":"直接记 v = nλ/Δt：本题 v = n×4/0.5 = 8n，一步写出全部可能值"}],"v":["求波速的可能值","求波长的可能值","求周期的可能值","传播方向未知造成的多解","时间与周期倍数关系造成的多解"]},{"t":"波的传播方向与质点振动方向的互判","f":"已知波的传播方向判断某质点的振动方向，或由质点振动方向反推传播方向","k":"同侧法：在波形图上，质点振动方向与波的传播方向位于波形线的同一侧；相距 nλ 的两质点步调相同，相距 (n+½)λ 的步调相反","q":[{"q":"一列简谐横波沿 x 轴正方向传播，波长 4 m。某时刻 x = 1 m 处的质点恰好经过平衡位置向上运动，求此刻 x = 3 m 处质点的振动方向。","s":["x = 3 m 与 x = 1 m 相差 2 m","2 m 恰好是半个波长（λ/2 = 2 m）","相距半波长的两质点振动步调完全相反","x = 1 m 处向上运动，故 x = 3 m 处向下运动"],"a":"向下运动","c":"「相距 nλ 步调相同、相距 (n+½)λ 步调相反」是判断振动方向最快的依据，比逐个平移波形省时","x":"同侧法：沿波的传播方向看，质点振动方向与波形「下坡」同侧，一眼定方向"}],"v":["已知传播方向判断振动方向","由振动方向反推传播方向","用「上下坡法」判断","用「同侧法」判断","用波形平移法判断方向"]}],"机械能守恒":[{"t":"机械能守恒的判断与计算","f":"判断系统机械能是否守恒，或求某位置的速度、高度","k":"判据只有一条：是否只有重力（或弹簧弹力）做功。有摩擦、有外力做功、绳突然绷直，都不守恒","q":[{"q":"长 L 的轻绳一端固定，另一端系质量 m 的小球，把球拉到水平位置由静止释放。求球到最低点时的速度与绳的张力。","s":["只有重力做功，机械能守恒：mgL = ½mv²","v = √(2gL)","最低点：T − mg = mv²/L","T = mg + 2mg = 3mg"],"a":"v = √(2gL)，T = 3mg","c":"圆周与能量结合的定式：先用机械能守恒求速度，再沿半径写向心力方程求力","x":"记住「从水平位置释放到最低点，绳张力恒为 3mg」这个结论，与 L、m 无关，选择题可直接用"}],"v":["判断系统机械能是否守恒","求某位置的速度","求上升的最大高度","有摩擦时改用能量守恒","单个物体与系统的区别"]},{"t":"连接体的机械能守恒","f":"两物体用绳跨过滑轮连接，一个下降一个上升，求速度或加速度","k":"把两个物体当成一个系统：绳张力是内力、对系统不做总功，只有重力做功，故系统机械能守恒","q":[{"q":"质量 2 kg 与 3 kg 的两物体用轻绳跨过定滑轮连接，从静止释放。求 3 kg 物体下降 0.5 m 时的速度（g 取 10 m/s²）。","s":["系统机械能守恒：(m₂ − m₁)gh = ½(m₁ + m₂)v²","重力势能减少量 = (3 − 2)×10×0.5 = 5 J","5 = ½×5×v²，得 v² = 2","v = √2 ≈ 1.41 m/s"],"a":"约 1.41 m/s","c":"连接体用「系统」机械能守恒：势能变化只看高度差，动能是总质量乘共同速率","x":"也可用牛顿定律：a = (m₂−m₁)g/(m₁+m₂) = 2 m/s²，再由 v² = 2ah = 2 得 v = √2，两条路完全等价"}],"v":["滑轮两侧物体速度大小相同","求某时刻的速度","求系统的加速度","用 ΔEp 减少量等于 ΔEk 增加量","绳的张力不做功"]},{"t":"含弹簧的机械能守恒","f":"物块落到弹簧上、弹簧与物块组成的系统，求最大压缩量或最大速度的位置","k":"系统（物块 + 弹簧 + 地球）机械能守恒；速度最大时加速度为零，即弹力等于重力","q":[{"q":"质量 m 的物块从高 h 处自由下落，落到竖直放置的弹簧上（劲度系数 k）。求弹簧的最大压缩量 x（不计空气阻力）。","s":["从释放到压缩最短，只有重力与弹力做功，系统机械能守恒","以最低点为零势能面：初态动能 0、重力势能 mg(h+x)","末态动能 0、弹性势能 ½kx²","mg(h+x) = ½kx²，整理得 kx² − 2mgx − 2mgh = 0","取正根 x = [mg + √(m²g² + 2kmgh)]/k"],"a":"x = [mg + √(m²g² + 2kmgh)]/k","c":"关键是「零势能面选在最低点」，让初态重力势能写成 mg(h+x)；写成 mgh 就会漏掉压缩那一段","x":"注意速度最大处不是压缩最短处：速度最大时 kx = mg，即 x = mg/k，这是选择题的常考点"}],"v":["求弹簧的最大压缩量","求最大速度出现的位置","求某点的速度","弹性势能与动能的转化","弹簧原长处的速度最大"]}],"查理定律":[{"t":"等容变化的计算","f":"求等容过程中的压强或温度，多用于密闭容器、钢瓶、灯泡等体积不变的场景","k":"p₁/T₁ = p₂/T₂，温度必须用热力学温度（K），用摄氏度代入是致命错误","q":[{"q":"密闭容器内的气体在 27 ℃ 时压强为 1.0×10⁵ Pa。温度升高到 87 ℃，压强变为多少？","s":["T₁ = 27 + 273 = 300 K","T₂ = 87 + 273 = 360 K","等容：p₂ = p₁T₂/T₁ = 1.0×10⁵ × 360/300","p₂ = 1.2×10⁵ Pa"],"a":"1.2×10⁵ Pa","c":"气体定律中的 T 一律是热力学温度，先加 273 再运算，这是本节最常见的失分点","x":"用比例：360/300 = 1.2，压强同比放大 1.2 倍，不必算中间量"}],"v":["求等容过程的压强","求等容过程的温度","密闭容器与钢瓶问题","体积不变时 p 与 T 成正比","灯泡内气体的等容变化"]},{"t":"p-T 图像的斜率含义","f":"由 p-T 图判断过程、比较不同等容线对应的体积、求绝对零度","k":"p-T 图线是过原点的直线，斜率 = nR/V，斜率越大体积越小；p-t 图线不过原点，交 t 轴于 −273 ℃","q":[{"q":"p-T 图中有两条等容线 A、B，A 的斜率大于 B。比较两过程对应的体积大小。","s":["由 p = (nR/V)T 知斜率 k = nR/V","斜率大说明体积小","故 V_A < V_B","若是 p-t（摄氏温度）图，直线不过原点，延长线与 t 轴交于 −273 ℃"],"a":"V_A < V_B","c":"p-T 图斜率越大体积越小；而 V-T 图斜率越大压强越小，两者方向相反，极易记反","x":"不记斜率关系也行：在图上画一条等压水平线，交点温度更高的一方体积更大"}],"v":["由 p-T 图判断过程","比较不同等容线对应的体积","外推求绝对零度","斜率与体积的关系","过原点的直线表示等容"]},{"t":"查理定律的适用条件与温度单位","f":"判断查理定律的使用是否正确，或纠正把摄氏温度直接代入的错误","k":"p/T = C 中的 T 必须是热力学温度，摄氏温度不能直接成比例；0 ℃ 对应 273 K","q":[{"q":"一定质量的气体等容变化，0 ℃ 时压强为 1 atm，27 ℃ 时压强是多少？","s":["先把温度换成热力学温度：T₁ = 273 K，T₂ = 300 K","等容变化：p₁/T₁ = p₂/T₂","1/273 = p₂/300","p₂ = 300/273 ≈ 1.1 atm"],"a":"约 1.1 atm","c":"所有气体定律中的 T 都是热力学温度，这是唯一不能省的一步换算","x":"凡看到 ℃ 就先加 273，把温度统一成 K 再动笔，能避开绝大多数计算错误"}],"v":["判断某处用法是否正确","纠正摄氏温度直接代入的错误","0 ℃ 对应多少 K","等容条件是否满足","先换算再成比例"]}],"核反应方程":[{"t":"四大核反应类型的判断","f":"判断反应属于衰变、人工转变、裂变还是聚变","k":"衰变自发进行；人工转变用粒子轰击；裂变是重核分裂成两个中等核；聚变是轻核结合成较重的核","q":[{"q":"判断反应 ²³⁵U + n → ¹⁴¹Ba + ⁹²Kr + 3n 属于哪一类核反应。","s":["重核吸收一个中子后分裂成两个中等质量的核","同时放出多个中子","这是典型的重核裂变","释放能量巨大，是核电站与原子弹的原理"],"a":"重核裂变","c":"判断类型看反应前后核的质量分布：重核一分为二是裂变，轻核合二为一是聚变","x":"记住两个代表式：裂变用铀 235 加中子，聚变用氘加氚，考试基本不出这两个之外"}],"v":["判断是否为衰变","
