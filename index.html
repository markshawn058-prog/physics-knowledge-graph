<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物理教学 · 工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='4' fill='%233498DB'/><circle cx='5' cy='6' r='2.5' fill='%235DADE2'/><circle cx='19' cy='7' r='2.5' fill='%235DADE2'/><circle cx='6' cy='18' r='2.5' fill='%235DADE2'/><circle cx='18.5' cy='18' r='2.5' fill='%235DADE2'/></svg>">
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E6E8EC; --text:#1F2937;
  --muted:#6B7280; --hint:#9CA3AF; --accent:#3498DB;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181D; --card:#1F2229; --line:#2E323B; --text:#E8EAED;
        --muted:#9BA1AC; --hint:#6B7280; --accent:#5DADE2;}
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:56px 24px 80px;
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px; margin:0 auto}
header h1{margin:0 0 8px; font-size:26px; font-weight:600; letter-spacing:.3px}
header p{margin:0 0 28px; font-size:14px; color:var(--muted)}
header b{color:var(--text); font-weight:600}

#q{
  width:100%; padding:12px 16px; margin-bottom:20px;
  font-size:14px; color:var(--text);
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  outline:none; transition:border-color .2s;
}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--hint)}

.card{
  display:flex; align-items:flex-start; gap:16px;
  padding:20px; margin-bottom:12px;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  text-decoration:none; color:inherit;
  transition:transform .18s, box-shadow .18s, border-color .18s;
}
.card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.07); border-color:var(--accent)}
.icon{
  flex:none; display:grid; place-items:center; width:44px; height:44px;
  border-radius:11px; background:color-mix(in srgb, var(--accent) 12%, transparent);
  color:var(--accent);
}
.card h2{margin:2px 0 6px; font-size:16px; font-weight:600}
.card p{margin:0; font-size:13.5px; line-height:1.65; color:var(--muted); max-width:60ch}
.tags{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px}
.tags span{
  font-size:11.5px; padding:2px 8px; border-radius:20px;
  color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent);
}

.empty{
  padding:28px; text-align:center; font-size:13.5px; color:var(--hint);
  border:1px dashed var(--line); border-radius:14px;
}
footer{
  margin-top:32px; padding-top:20px; border-top:1px solid var(--line);
  font-size:12.5px; line-height:1.8; color:var(--hint);
}
footer code{
  padding:1px 5px; border-radius:4px; font-size:12px;
  background:color-mix(in srgb, var(--text) 7%, transparent);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>物理教学 · 工作台</h1>
    <p>本地页面索引，共 <b id="count">0</b> 个页面</p>
  </header>

  <input id="q" placeholder="搜索页面标题或标签…" autocomplete="off">
  <main id="list"></main>

  <footer>
    新增页面：把 HTML 放进 <code>pages/</code>，在 <code>index.html</code> 的 <code>PAGES</code> 数组里加一行。<br>
    本地预览：<code>python -m http.server 8000</code> 后访问 localhost:8000。约定见 <code>AGENTS.md</code>。
  </footer>
</div>

<script>
const PAGES=[
  {
    title:'高中物理知识图谱 · 3D 交互版',
    desc:'92 个概念节点组成的三维知识网络，按「模块 → 章 → 知识点」三级目录组织（6 模块 / 30 章 / 91 个知识点）。每个节点含概念概述、核心公式、关键结论、知识点、易错提醒与常见考法，共约 3.8 万字。任意角度点节点即可查看，目录与 3D 场景双向联动。',
    file:'pages/physics-graph.html',
    tags:['Three.js','3D','三级目录','单文件']
  }
];

const ICON=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.6" stroke-linecap="round">
  <circle cx="12" cy="12" r="2.6"/>
  <circle cx="5" cy="6" r="1.7"/><circle cx="19" cy="7" r="1.7"/>
  <circle cx="6" cy="18" r="1.7"/><circle cx="18.5" cy="18" r="1.7"/>
  <path d="M6.4 7.3 9.9 10.7M17.5 8.3 13.9 10.9M7.3 16.9 10.4 13.6M17 17.3 13.8 13.8"/>
</svg>`;

const list=document.getElementById('list'), box=document.getElementById('q');
document.getElementById('count').textContent=PAGES.length;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(kw=''){
  const q=kw.trim().toLowerCase();
  const hit=PAGES.filter(p=>(p.title+p.desc+p.tags.join('')).toLowerCase().includes(q));
  list.innerHTML=hit.length
    ? hit.map(p=>`<a class="card" href="${p.file}">
        <div class="icon">${ICON}</div>
        <div>
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.desc)}</p>
          <div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
        </div>
      </a>`).join('')
    : `<div class="empty">没有匹配的页面</div>`;
}

box.addEventListener('input',()=>render(box.value));
render();
</script>
</body>
</html>
